# Only the ME line is mandatory; the others are just samples of how to do# things.  Virtually everything will need modifying for your local feeds# and newsgroups.# line indicating what we are willing to receive; note local groups on endME:comp,news,sci,rec,misc,soc,talk,to,can,ont,tor,ut# sample insignificant feed not using batching (for special situations only)huey:news.config,to.huey/all::uux - -r -gd huey!rnews# sample of mailing newsgroups to someone (note distribution)daisy:soc.women,soc.couples/all::mail daisy@duck# sample major batched feed, including (unnecessary) explicit file namedewey:comp,news,sci,rec,misc,soc,talk,to.dewey,can,ont,tor,ut/all:f:dewey/togo# sample long-haul feed; note no local groupsdonald:comp,news,sci,rec,misc,soc,talk,to.donald/all:f:# sample local-postings-only feed direct to major site (gets them out fast)scrooge:comp,news,sci,rec,misc,soc,talk,to.scrooge/all:Lf:# sample ihave/sendme link# Send ihave telling louie what we have -- batcher turns the batch into a# giant control message and posts it to "to.louie".  (#1)louie:comp,news,sci,rec,misc,soc,talk,!to/all,!sendme,!ihave:I:louie.ihave/togo# Send sendme in response to ihave from louie -- again, turned by batcher# into giant control message posted to "to.louie".  (#3)louie-send-ids:to.louie/ihave:I:louie.sendme/togo# Transmit said giant control messages by normal batching.  (#2,#4)louie-ctl:to.louie/all,!sendme,!ihave:f:louie/togo# Send articles in response to sendme messages from louie. (#5)louie-real:to.louie/sendme:f:louie/togo# Actually the last two could be combined.# also, since ihave/sendme is slow, send local postings to louie without# waiting (beware ihave/sendme)louie-local:comp,news,sci,rec,misc,soc,talk/all,!sendme,!ihave:L: