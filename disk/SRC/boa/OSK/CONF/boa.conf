# Boa 0.92p configuration for this disk.# The server root is compiled in as /h0/c/unid/boa/osk, so a bare `boa'# finds this file; `boa -c <dir>' names another root with its own CONF.Port 8080User 0Group 0ServerName localhostErrorLog logs/error_logAccessLog logs/access_logDocumentRoot /h0/c/unid/boa/osk/HTMLDirectoryIndex index.htmlDirectoryCache /dd/tmpKeepAliveMax 10KeepAliveTimeout 10DefaultType text/plainAddType application/x-httpd-cgi cgiScriptAlias /cgi-bin/ /h0/c/unid/wn_1.14.3/osk/EXAMPLES/