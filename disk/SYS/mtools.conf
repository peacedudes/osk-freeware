# mtools.conf -- drive letters for the mtools suite (GNU mtools 3.6, OSK port)## WITHOUT this file mtools defaults drive A: to the OS-9 device /pc1@, a real# PC-floppy descriptor.  On hardware that is right; under os9exec there is no# such device and every ms* command fails with#     Can't open /pc1@: 000:221 module not found# so the drives below are mapped to disk IMAGE FILES instead.## Syntax is documented in DOC/mtools/mtools.5.  Only `file' is mandatory, and# the manual is explicit that geometry is best left out: "If no geometry# information is supplied in the configuration file, all disks are accepted."# So no tracks/heads/sectors here -- A: and B: take an image of ANY size.# Verified with both a 1.44M and a 720K FAT12 image.drive a: file="/dd/DOS/a.img"drive b: file="/dd/DOS/b.img"# Pin a geometry only if you need to reject the wrong disk:# drive a: file="/dd/DOS/a.img" fat_bits=12 tracks=80 heads=2 sectors=18## On real hardware, point a drive at the PC floppy descriptor instead.  The# port's author used, on a VME147:#     name=pc0  manager=pcf  driver=rb5400  devcon=scsi147#     drv=5 stp=3 typ=$21 dns=$03 cyl=80 sid=2 sct=15 t0s=15# drive a: file="/pc0@"# drive b: file="/pc1@"