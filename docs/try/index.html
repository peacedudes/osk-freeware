<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS9exec</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { --bg: #101418; --fg: #d8dee4; --dim: #7d8590; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 16px; color: var(--dim); display: flex; gap: 12px;
           align-items: center; flex-wrap: wrap; }
  #status { flex: 1; min-width: 12em; }
  header button { font: inherit; color: var(--fg); background: #1f262d; border: 1px solid #30363d;
                  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  header button:disabled { opacity: 0.4; cursor: default; }
  #term { flex: 1; padding: 0 16px 16px; min-height: 0; overflow: auto; }
  /* Visual bell, like Terminal's "flash screen": an even wash over the whole
     terminal, the same however much text is showing. */
  #term { position: relative; }
  #term::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                 background: #fff; opacity: 0; }
  #term.bell::after { opacity: 0.125; }
  body.embed header { display: none; }
  body.embed #term { padding: 4px; }
</style>
</head>
<body>
<header>
  <span id="status">OS9exec: loading the emulator and its disk...</span>
  <span id="h1name"></span>
  <button id="attach" disabled title="Open an RBF disk image from this computer as /h1. It is copied into this browser and stays on this machine; nothing is sent anywhere. Safari's own dialog says &quot;Upload&quot;, which it is not.">Open disk as /h1...</button>
  <button id="save" disabled title="Download /h1 as it is now">Save /h1</button>
  <button id="tapsave" hidden title="Download every byte the emulator has written to the terminal">Save output</button>
  <button id="detach" disabled title="Remove /h1 from this browser">Detach /h1</button>
  <input id="pick" type="file" hidden>
</header>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
  // The emulator reads keys from Module.os9keys (telnetaccess.c, HandleEvent)
  // and writes the console byte by byte through Module.os9out (pre.js).
  const term = new Terminal({ cursorBlink: true, cursorStyle: 'underline', fontSize: 14,
                              theme: { background: '#101418' } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  // Fit the window, but never smaller than 80x24: every program on the disk
  // draws for that screen and none can ask how big the window is, so a
  // narrower terminal wraps their lines.  A small window scrolls instead.
  // (A wider one is fine now that nothing writes column 80, 2026-09-28.)
  const MIN_COLS = 80, MIN_ROWS = 24;
  function fitTerm() {
    const d = fit.proposeDimensions();
    if (!d || !isFinite(d.cols) || !isFinite(d.rows)) return;
    const cols = Math.max(MIN_COLS, d.cols), rows = Math.max(MIN_ROWS, d.rows);
    if (cols !== term.cols || rows !== term.rows) term.resize(cols, rows);
  }
  fitTerm();
  window.addEventListener('resize', fitTerm);
  term.focus();

  // BEL (Ctrl-G, and what OS-9 sends on a backspace at column zero): flash.
  const termEl = document.getElementById('term');
  term.onBell(() => {
    termEl.classList.add('bell');
    setTimeout(() => termEl.classList.remove('bell'), 120);
  });

  // THE HIGH HALF IS CP437, as the cards read it (tools/gen_screens.py).
  // Programs here draw boxes with the PC's line characters -- mwb's are
  // $C9 $CD $BB $BA -- and handing those bytes to the terminal as UTF-8
  // mangled them: some corners showed, the lines vanished (2026-09-26).
  const CP437 = "\u00c7\u00fc\u00e9\u00e2\u00e4\u00e0\u00e5\u00e7\u00ea\u00eb\u00e8\u00ef\u00ee\u00ec\u00c4\u00c5\u00c9\u00e6\u00c6\u00f4\u00f6\u00f2\u00fb\u00f9\u00ff\u00d6\u00dc\u00a2\u00a3\u00a5\u20a7\u0192\u00e1\u00ed\u00f3\u00fa\u00f1\u00d1\u00aa\u00ba\u00bf\u2310\u00ac\u00bd\u00bc\u00a1\u00ab\u00bb\u2591\u2592\u2593\u2502\u2524\u2561\u2562\u2556\u2555\u2563\u2551\u2557\u255d\u255c\u255b\u2510\u2514\u2534\u252c\u251c\u2500\u253c\u255e\u255f\u255a\u2554\u2569\u2566\u2560\u2550\u256c\u2567\u2568\u2564\u2565\u2559\u2558\u2552\u2553\u256b\u256a\u2518\u250c\u2588\u2584\u258c\u2590\u2580\u03b1\u00df\u0393\u03c0\u03a3\u03c3\u00b5\u03c4\u03a6\u0398\u03a9\u03b4\u221e\u03c6\u03b5\u2229\u2261\u00b1\u2265\u2264\u2320\u2321\u00f7\u2248\u00b0\u2219\u00b7\u221a\u207f\u00b2\u25a0\u00a0";
  // ?tap=1: keep every byte the emulator writes, and offer them as a file --
  // for finding out what a program really sent when the screen looks wrong.
  const tap = new URLSearchParams(location.search).get('tap') ? [] : null;
  let pending = [];
  const flush = () => {
    let s = "";
    for (const b of pending) s += b < 0x80 ? String.fromCharCode(b) : CP437[b - 0x80];
    term.write(s); pending = [];
  };

  // ?gaps=1: measure where output stalls. "from the emulator" counts pauses
  // between bytes arriving; "on screen" counts frames that came late.
  const gaps = new URLSearchParams(location.search).get('gaps') ? { emu: [], draw: [] } : null;
  let lastByte = 0, lastFrame = 0;
  const note = (list, t, last) => { if (last && t - last > 50 && t - last < 2000) list.push(Math.round(t - last)); };
  if (gaps) setInterval(() => {
    document.getElementById('status').textContent =
      'pauses over 50 ms -- from the emulator: ' + gaps.emu.length + ' [' + gaps.emu.slice(-8).join(' ') + ']' +
      '   on screen: ' + gaps.draw.length + ' [' + gaps.draw.slice(-8).join(' ') + ']';
  }, 500);

  var Module = {
    // ?r=1 turns off the emulator's baud-rate pacing, which needs waits
    // shorter than a browser timer can give.  No "-q": that turns off the
    // system tick, and since os9exec b31f713 the tick is what lets a busy
    // program give the page a turn -- without it, it froze the tab.
    arguments: (new URLSearchParams(location.search).get('r') ? ['-r'] : []).concat(["bash", "/dd/SYS/login"]),
    os9keys: [],
    // Collected and drawn once per frame: one terminal write per byte made
    // output arrive in visible stutters.
    os9out: (c) => {
      armRun();
      if (gaps) { const t = performance.now(); note(gaps.emu, t, lastByte); lastByte = t; }
      if (tap) tap.push(c & 0xff);
      pending.push(c & 0xff);
      if (pending.length === 1) requestAnimationFrame((t) => {
        if (gaps) { note(gaps.draw, t, lastFrame); lastFrame = t; }
        flush();
      });
    },
    os9status: (text) => { document.getElementById('status').textContent = 'OS9exec: ' + text; },
    onRuntimeInitialized: () => {
      document.getElementById('status').textContent = 'OS9exec: running. Click the terminal to type.';
      showH1();
    },
    onExit: (code) => {
      document.getElementById('status').textContent = 'OS9exec: emulation ended (' + code + '). Reload to start again.';
    },
  };
  // /h1: a disk image of the user's, kept in this browser between visits (pre.js).
  // Attaching or detaching restarts the emulator, which finds /h1 at startup.
  const $ = (id) => document.getElementById(id);
  function showH1() {
    const name = Module.os9h1.name();
    $('h1name').textContent = name ? '/h1: ' + name : '';
    $('attach').disabled = false;
    // No `accept` filter: an OS-9 image is any name at all, and a filter greys
    // out the very file the reader saved from here.
    $('save').disabled = $('detach').disabled = !name;
  }
  $('attach').onclick = () => $('pick').click();
  $('pick').onchange = async () => {
    const file = $('pick').files[0];
    if (!file) return;
    // Attaching restarts the emulator, because /h1 is picked up at startup.
    // The /h1 it replaces exists only in this browser, so say so.
    const old = Module.os9h1.name();
    if (!confirm('Open ' + file.name + ' as /h1?\n\nIt is copied into this browser and stays on '
                 + 'this machine. '
                 + (old ? 'It replaces the /h1 here now (' + old + '); save that first if you want '
                        + 'to keep it. ' : '')
                 + 'If you select OK, the emulator restarts to attach it, so anything '
                 + 'running now is lost.')) {
      $('pick').value = '';
      return;
    }
    Module.os9status('opening ' + file.name + ' into this browser (it stays on this machine)...');
    const bytes = new Uint8Array(await file.arrayBuffer());
    Module.os9h1.attach(file.name, bytes, () => location.reload());
  };
  if (tap) {
    $('tapsave').hidden = false;
    $('tapsave').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([new Uint8Array(tap)]));
      a.download = 'os9exec-output.bin';
      a.click();
    };
  }
  $('save').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([Module.os9h1.image()]));
    a.download = Module.os9h1.name();
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    term.focus();
  };
  $('detach').onclick = () => {
    if (confirm('Remove /h1 (' + Module.os9h1.name() + ') from this browser?\n\nSave it first if you '
                + 'want to keep it. If you select OK, the emulator restarts, so anything running now '
                + 'is lost.'))
      Module.os9h1.detach(() => location.reload());
  };

  // ?run=<command>: type <command> for the reader once the system is ready --
  // the first time its output has been quiet for READY_QUIET_MS, which after
  // boot is the login prompt. It is typed where the reader can see it, exactly
  // as a card shows it, and NOT entered: the reader presses Enter. A link is
  // anybody's to write, and the reader's own /h1 is on the other end of it.
  // For the same reason nothing in it below a space is typed, so it cannot
  // carry an Enter of its own. &needs=h1: only once the reader's own OS-9 is
  // attached as /h1; until then, say so. Attaching reloads this same address,
  // so the command is then typed.
  const params = new URLSearchParams(location.search);
  // ?man=<name>: READ A PROGRAM'S DOCUMENTS -- the catalogue's `Read about
  // it' opens this page in a panel on the card.  Unlike ?run=, this one is
  // ENTERED for the reader: the page writes the command itself, and the
  // name is held to letters, digits and . _ + -, so all a link can ever
  // make it do is `man' on one name (2026-09-27).
  // ?src=<name> is the same for its source: `man -s <name>'.
  const nameIn = key => /^[\w.+-]{1,40}$/.test(params.get(key) || '') ? params.get(key) : null;
  const manName = nameIn('man') || nameIn('src');
  const runCmd = manName ? (nameIn('man') ? 'man ' : 'man -s ') + manName
                         : params.get('run')?.replace(/[\x00-\x1f\x7f]/g, '') || null;
  // &embed=1: inside a card's panel -- no buttons, no margin, just the terminal.
  if (params.get('embed')) document.body.classList.add('embed');
  // ?newdisk=1: MAKE A DISK OF YOUR OWN.  A fresh empty 16 MB disk
  // (blank.dd.gz, made with os9exec's `mount -k') is attached as /h1 and the
  // page restarts with it; the link's command -- a `keep' the catalogue's
  // tray wrote -- is then typed as always, and `Save /h1' downloads the disk.
  // For a reader with no OS-9 of their own, or one whose disk is smaller than
  // this collection (2026-09-26).  Typing waits until the disk is attached.
  let newDiskPending = !!params.get('newdisk');
  if (newDiskPending) window.addEventListener('load', async () => {
    params.delete('newdisk');
    const q = params.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) {}
    const old = Module.os9h1.name();
    if (old && !confirm('Make a new empty disk as /h1?\n\nIt replaces the /h1 here now (' + old
                        + '); save that first if you want to keep it.')) {
      newDiskPending = false; return;
    }
    Module.os9status('making an empty disk as /h1 ...');
    try {
      const r = await fetch('blank.dd.gz');
      const buf = await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      Module.os9h1.attach('mydisk.dd', new Uint8Array(buf), () => location.reload());
    } catch (e) {
      newDiskPending = false;
      Module.os9status('could not make an empty disk: ' + e);
    }
  });
  const READY_QUIET_MS = 800;
  let quietTimer = null, typedRun = false, runWaiting = false;
  function armRun() {
    if (!runCmd || typedRun) return;
    clearTimeout(quietTimer);
    quietTimer = setTimeout(typeRun, READY_QUIET_MS);
  }
  // A LONG COMMAND IS TYPED IN LINES.  bash takes the terminal to be 80
  // columns wide, and a line wider than that it scrolls sideways, showing
  // `<DEX DEMO/gulls.gif...' with its start cut off (2026-09-26; 87 cards
  // have commands that wide).  So the command is broken between words, at
  // spaces outside quotes, with a backslash-newline: bash reads that as the
  // same command continued and RUNS NOTHING until the reader's own Enter --
  // even a break that landed inside quotes only continues the line.  Only
  // at bash: Microware's shell does not scroll a long line.
  const LINE_MAX = 70;
  function wrapForBash(cmd) {
    if (cmd.length + 5 <= 79) return cmd;
    const words = [];
    let cur = '', q = null;
    for (let i = 0; i < cmd.length; i++) {
      const ch = cmd[i];
      if (q) { cur += ch; if (ch === q) q = null; else if (ch === '\\' && q === '"' && i + 1 < cmd.length) cur += cmd[++i]; continue; }
      if (ch === "'" || ch === '"' || ch === '`') { q = ch; cur += ch; continue; }
      if (ch === '\\' && i + 1 < cmd.length) { cur += ch + cmd[++i]; continue; }
      if (ch === ' ') { if (cur) words.push(cur); cur = ''; continue; }
      cur += ch;
    }
    if (cur) words.push(cur);
    const lines = [];
    let line = '';
    for (const w of words) {
      if (line && line.length + 1 + w.length > LINE_MAX) { lines.push(line); line = w; }
      else line = line ? line + ' ' + w : w;
    }
    if (line) lines.push(line);
    return lines.join(' \\\n');
  }
  function typeText(text) {
    for (const ch of text) {
      const c = ch.charCodeAt(0);
      Module.os9keys.push(KEYMAP[c] ?? c);
    }
  }
  // &shell=os9: the reader chose Microware's shell on the catalogue, so the
  // command is spelt for it and should run IN it, leaving them there after.
  // The shell is the reader's own, made resident from /h1 by SYS/login, so
  // this needs /h1.  The page enters `exec shell' itself -- text it chose, not
  // text from the link, so entering it is safe -- which replaces bash and
  // keeps the login's environment; then, at the shell's prompt, the link's
  // command is typed as always, for the reader to enter.
  const wantShell = params.get('shell') === 'os9';
  let inShell = false;
  // &card=<stanza>: do first what that card did out of sight -- a cd, a
  // load, a file staged -- so its command starts where the card's did.  The
  // lines come from setup.json, which the catalogue build writes from the
  // card sheets; the link only NAMES a card, so it cannot make this page
  // enter text of its own.  One line per quiet spell, like a person typing.
  const cardName = params.get('card');
  let setupLines = null, cardKeys = [];
  const setupReady = (cardName && /^[\w.+-]+$/.test(cardName))
    ? fetch('setup.json').then(r => r.ok ? r.json() : {}).then(j => {
        const c = j[cardName] || {};
        setupLines = Array.isArray(c.setup) ? c.setup.slice() : [];
        cardKeys = Array.isArray(c.keys) ? c.keys : [];
      }).catch(() => { setupLines = []; })
    : Promise.resolve().then(() => { setupLines = []; });
  function typeRun() {
    if (typedRun || newDiskPending) return;
    if ((wantShell || params.get('needs') === 'h1') && !Module.os9h1.name()) {
      typedRun = true;
      Module.os9status('"' + runCmd + '" needs your own OS-9 system attached as /h1. ' +
                       'Use "Open disk as /h1..." and it will run.');
      return;
    }
    if (setupLines === null) {            // setup.json not here yet
      setupReady.then(typeRun);
      return;
    }
    if (setupLines.length) {
      typeText(setupLines.shift().replace(/[\x00-\x1f\x7f]/g, '') + '\n');
      return;                             // the next step waits for quiet
    }
    if (wantShell && !inShell) {
      inShell = true;
      typeText('exec shell\n');   // then wait for the shell's prompt to go quiet
      return;
    }
    typedRun = true;
    typeText(wantShell ? runCmd : wrapForBash(runCmd));
    if (manName) typeText('\n');     // text this page chose; see ?man= above
    // Say what the card typed next: a program like forth waits in silence,
    // and nothing on the screen tells a reader it is their turn.
    if (cardKeys.length)
      Module.os9status('press Enter to run it; then the card typed: ' +
                       cardKeys.slice(0, 3).join('  |  '));
    runWaiting = true;
    // FORGET IT ONCE TYPED.  Reloading -- or attaching a disk as /h1, which
    // reloads this same address -- would otherwise type the command again,
    // and the reader who had wandered off into OS-9 half an hour ago gets
    // `rain' a second time with no idea why -- surprises, not in a good
    // way.  Dropping `run' from the address leaves the session as it is and
    // takes the surprise out of the next reload.
    try {
      params.delete('run');
      params.delete('man');
      params.delete('src');
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
    } catch (e) { /* a browser that refuses replaceState loses nothing else */ }
  }

  // Send what a Unix terminal sends: Enter as LF, which the emulator's
  // console swaps to OS-9's CR (consio.c), exactly as for a native terminal.
  // Backspace as BS, where xterm sends DEL.
  const KEYMAP = { 0x0d: 0x0a, 0x7f: 0x08 };

  // Ctrl-A is OS-9's duplicate-last-line key (PD_DUP), and SCF answers it for a
  // program that reads through the terminal's own line editing. bash does its
  // own reading, so a command WE typed at startup could not be recalled that
  // way. Here Ctrl-A types it again, unexecuted, exactly as the reader would
  // have typed it -- but only until a line of their own has been entered, after
  // which the key belongs to the guest again. The Enter that runs the typed
  // command is not a line of their own.
  let ownLineEntered = false;
  term.onData((data) => {
    for (const ch of data) {
      const c = ch.charCodeAt(0);
      if (c === 0x01 && typedRun && !ownLineEntered) { typeText(wantShell ? runCmd : wrapForBash(runCmd)); continue; }
      if (c === 0x0d) { if (runWaiting) runWaiting = false; else ownLineEntered = true; }
      Module.os9keys.push(KEYMAP[c] ?? c);
    }
  });
</script>
<script src="os9exec.js"></script>
</body>
</html>
