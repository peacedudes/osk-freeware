kes no options and reads the .dat files in the data directory"},"cat":"Games","sub":"Other games"},{"name":"wam.sbprolog","desc":"SB-Prolog 2.2, a full Prolog. Needs SIMPATH=/dd/SBPROLOG/MODLIB; `wam.sbprolog SBPROLOG/MODLIB/$readloop' from /dd gives the `?-' prompt, and halt. leaves. DOC/sbprolog has the manual and README- SBPROLOG","src":"sbprolog","origin":"PD disk","archive":"3, SBPROLOG2.2/SIM -- SB-Prolog 2.2, SUNY Stony Brook","dir":"CMDS","size":72088,"hassrc":true,"howto":"Needs SIMPATH=/dd/SBPROLOG/MODLIB (login sets it). From /dd: `wam.sbprolog SBPROLOG/MODLIB/$readloop' gives the `?-' prompt; after a solution ; asks for the next and Return accepts it; halt. leaves.","help":{"note":"it takes the module to start in and has no help flag"},"cat":"Languages","sub":"Interpreters"},{"name":"wanderer","desc":"a Boulderdash-style maze game: dig through the earth for diamonds. Its thirty screens are in GAMES/WAND/screens, found with this disk as /dd","src":"wanderer","origin":"usenet archive","archive":"wanderer.ar","needs":[{"path":"/dd/GAMES/wand/screens","missing":false,"dir":true,"bytes":null},{"path":"/dd/GAMES/words","missing":false,"dir":false,"bytes":164034},{"path":"/dd/GAMES/wand/hiscore","missing":false,"dir":false,"bytes":174},{"path":"/dd/GAMES/wand/wanderer.lock","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":65244,"docs":true,"hassrc":true,"howto":"Full-screen. Dig through the earth for diamonds, forty-five on the first screen. `q' quits. Its thirty screens are in GAMES/WAND.","help":{"cmd":"wanderer -?","text":"syntax: wanderer {opt}\nfunction: play interactive game\noptions:\n\t-c  print credits for wanderer\n\t-s  show high scores\n\t-e  enter screen development editor on file \"screen\"\n\t-m  edit hiscore table (master password required)\n\t-f  starts game with 'map' display instead of normal (too easy)\nNote: type \"?\" in game to display game instructions"},"cat":"Games","sub":"Arcade & action"},{"name":"wc","desc":"count lines, words and characters for each file named, and print a total; it counts CR-terminated lines as well as LF.","dir":"CMDS","size":14978,"help":{"note":"it takes no options: name the files to count, or give it standard input"},"cat":"Text tools","sub":"Count & inspect"},{"name":"wc.cio","desc":"an older word count that reads standard input only: `wc.cio \u003c file' answers `1 lines, 6 words, 40 chars'; `wc' is the build that takes file names","dir":"CMDS/REBUILT","size":1438,"star":true,"help":{"note":"it takes no options and counts standard input only"},"cat":"Text tools","sub":"Count & inspect"},{"name":"weave","desc":"WEB to TeX -- the other half of literate programming, and it needs a change file for the same reason `tangle' does: `weave sample none'","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/BIB","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/BIB","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFBASES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFBASES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFINPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/POOLS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/POOLS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FORMATS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FORMATS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/TEX/SAMPLES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/INPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/SAMPLES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":128740,"howto":"The other half of `tangle', and it NEEDS A CHANGE FILE NAMED just as tangle does: `weave sample none', never `weave sample.web'. Given only a .web it answers `Error: `Can't open file.'' and the file it cannot open is the absent change file. DOC/tex ships sample.web and none.ch.","help":{"cmd":"weave -?","text":"Usage: weave webfile[.web] [changefile[.ch]] [-x]."},"cat":"Text tools","sub":"TeX"},{"name":"wgen","desc":"Tektronix waveform generator.  With the `graph' trap library resident it runs and asks for a resolution and the intensity of each harmonic, then emits Tektronix plotting codes.  Bare, it aborts with `unintialized User Trap #5'.","src":"tekdemos","origin":"Microware OS-9 archive","archive":"TekDemos.t.Z","dir":"CMDS/GAMES","size":18488,"hassrc":true,"howto":"It aborts with `unintialized User Trap #5, err=#227' until the `graph' trap library is resident: `load /dd/CMDS/GAMES/graph'. Then it asks for a resolution and the intensity of nine harmonics and draws the waveform. Give it ten numbers -- at end of input it draws for ever. `showpic' and `graphsave' need the same library AND a display, so they abort either way.","help":{"note":"it takes no options: it asks for a resolution and the intensity of each harmonic, with the Graph trap library loaded first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"what","desc":"inventory the expansion cards in a GEPARD -- the German 68k machine much of the EFFO material was written on.  It prints `What's where in the GEPARD:' and a table of I/O address, reference byte and card name, empty on anything else.  It ignores its arguments.","dir":"CMDS","size":976,"howto":"An inventory tool for the GEPARD, the German 68k machine: it prints \"What's where in the GEPARD:\" and a table of expansion cards. On other hardware the table is empty, and it ignores its arguments.","help":{"note":"it takes no options and ignores its arguments; run it and it prints its table"},"cat":"System & modules","sub":"Utilities"},{"name":"who","desc":"'who is logged in'.  Written in Microware shell syntax","needs":[{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":1259,"help":{"note":"a shell script with no options"},"cat":"System & modules","sub":"Processes & memory"},{"name":"whoami","desc":"Print who you are logged in as (GNU)","dir":"CMDS","size":8198,"star":true,"docs":true,"help":{"cmd":"whoami --help","text":"Usage: whoami [OPTION]...\n\n  --help      display this help and exit\n  --version   output version information and exit\n\nSame as id -un."},"cat":"Shells","sub":"Shell utilities"},{"name":"windio.52","desc":"windowing terminal driver","needs":[{"path":"/dd/sys/stdfonts","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/MM1","size":32798,"help":{"note":"a device driver for the MM/1, not a program"},"cat":"System & modules","sub":"MM/1 drivers"},{"name":"wisecrack","desc":"a SERVER, and `ask' is its client.  Run it in the background and every `ask' pulls one line out of it through /PIPE/txtpipe -- slogans from a German OS-9 seminar, 1992-93.  `wisecrack & ask \"anything\"'.","src":"forum20","origin":"Microware OS-9 archive","archive":"forum20.lzh","dir":"CMDS/GAMES","size":12868,"hassrc":true,"help":{"note":"it takes no options: run it in the background and `ask' reads what it writes"},"cat":"Games","sub":"Other games"},{"name":"wish","desc":"the `hack' wish toy: run it and it prints `Wishing for: 3 potions of gain level' and `what happened to \"hack\"'.  The same program as CMDS/GAMES/wish.  DOC/ORIGINS lists a `wish' from EFFO disk 17 (WiSH_src.lzh, Hellmuth Michaelis, GPL) as well as one from the `toys' archive; the EFFO one is not the binary that is here, under either name","src":"wish","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C/wish (WiSH_src.lzh) -- Hellmuth Michaelis, GPL","dir":"CMDS/GAMES","size":17522,"star":true,"docs":true,"hassrc":true,"help":{"note":"it takes what you wish for and nothing else"},"cat":"Games","sub":"Dungeon crawl"},{"name":"wn","desc":"the WN web server, version 1.14.3. It is an inetd-style server: one HTTP request on standard input, one response on standard output, so run bare it waits. Its document root is compiled in as /h0/c/unid/wn_1.14.3/osk, which is on this disk, so mount the collection as /h0 as well as /dd and it answers `HTTP/1.0 200 OK' with the page. It serves the files named in that directory's index.cache; see wndex. Its manual is 30 HTML files in DOC/wn","needs":[{"path":"/h0/tmp","missing":false,"dir":true,"bytes":null},{"path":"/h0/c/unid/wn_1.14.3/osk/logs/wn.log","missing":true,"dir":false,"bytes":null},{"path":"/h0/c/unid/wn_1.14.3/osk/logs/wn.log.err","missing":true,"dir":false,"bytes":null},{"path":"/h0/c/unid/wn_1.14.3/osk","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/WN","size":111066,"docs":true,"howto":"A real HTTP server (WN 1.14.3, GPL). It starts and opens its log -- the path /h0/c/unid/wn_1.14.3/osk/logs is compiled into the binary, and that directory is on this disk so it can. To serve, it needs TCP/IP under it (KA9Q or osknet, in CMDS/NET). It is an inetd-style server -- one request in on standard input, one response out -- so you can hand it a request by hand and read the reply. Its manual is 30 HTML files in DOC/wn.","help":{"note":"inetd gives it its options and the request arrives on standard input; there is no help flag"},"cat":"Communications","sub":"Web server"},{"name":"wn.stb","desc":"WN's symbol table (a data module)","dir":"CMDS/WN","size":7968,"help":{"note":"a symbol table that ships beside the WN web server, not a program"},"cat":"Communications","sub":"Web server"},{"name":"wndex","desc":"builds the index.cache WN serves a directory from. It works on the current data directory and ignores a directory given as an argument, so move there first (ksh's `cd' or the OS-9 shell's `chd') and run it by name. `Can't open ./index -- skipping it' means you are not where you think you are","needs":[{"path":"/h0/c/unid/wn_1.14.3/lib/mime.types","missing":false,"dir":false,"bytes":907}],"dir":"CMDS/WN","size":40466,"howto":"Builds the index.cache WN will not serve without. It works on the CURRENT directory and IGNORES a directory given as an argument -- on this disk that means ksh, whose `cd' is a real chdir where bash's is not: `ksh -c \"cd \u003cdir>; /dd/CMDS/WN/wndex\"'. On its own it says \"Can't open ./index -- skipping it\", which means you are not where you think you are. The site that ships at /dd/c/unid/wn_1.14.3/osk already has its cache built; that is WN's compiled-in document root.","help":{"cmd":"wndex -?","text":"/dd/CMDS/WN/wndex: illegal option -- ?\nUsage: /dd/CMDS/WN/wndex [-r] [-q] [-v] [-d dir] [-i indexfile] [-c cachefile]"},"cat":"Communications","sub":"Web server"},{"name":"world","desc":"World - text adventure","src":"world","origin":"usenet archive","archive":"world.ar","needs":[{"path":"/dd/GAMES/world/q1text.dat","missing":false,"dir":false,"bytes":77824}],"dir":"CMDS/GAMES","size":85934,"docs":true,"hassrc":true,"help":{"note":"it takes no options: run it and the adventure begins"},"cat":"Games","sub":"Other games"},{"name":"worms","desc":"worms crawl about the screen at random, each leaving a trail -- a screen toy: -number how many, -length how long, -trail to leave one; control-C ends it","src":"toys","origin":"usenet archive","archive":"toys.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":22038,"hassrc":true,"help":{"cmd":"worms -?","text":"usage: /dd/CMDS/GAMES/worms [-field] [-length #] [-number #] [-trail]"},"cat":"Screen toys","sub":"Screen toys"},{"name":"wrjpgcom","desc":"write a comment into a JPEG file","dir":"CMDS","size":17732,"docs":true,"help":{"cmd":"wrjpgcom -?","text":"wrjpgcom inserts a textual comment in a JPEG file.\nYou can add to or replace any existing comment(s).\nUsage: wrjpgcom [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -replace         Delete any existing comments\n  -comment \"text\"  Insert comment with given text\n  -cfile name      Read comment from named file\nNotice that you must put quotes around the comment text\nwhen you use -comment.\nIf you do not give either -comment or -cfile on the command line,\nthen the comment text is read from standard input.\nIt can be multiple lines, up to 65000 characters total.\nYou must specify an input JPEG file name when supplying\ncomment text from standard input."},"cat":"Graphics & images","sub":"JPEG"},{"name":"wrjpgcom.070","desc":"write a JPEG's comment (IJG 0.70 build)","dir":"CMDS","size":17866,"help":{"cmd":"wrjpgcom.070 -?","text":"wrjpgcom inserts a textual comment in a JPEG file.\nYou can add to or replace any existing comment(s).\nUsage: wrjpgcom.070 [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -replace         Delete any existing comments\n  -comment \"text\"  Insert comment with given text\n  -cfile name      Read comment from named file\nNotice that you must put quotes around the comment text\nwhen you use -comment.\nIf you do not give either -comment or -cfile on the command line,\nthen the comment text is read from standard input.\nIt can be multiple lines, up to 65000 characters total.\nYou must specify an input JPEG file name when supplying\ncomment text from standard input."},"cat":"Graphics & images","sub":"JPEG"},{"name":"wysecrack","desc":"probe a Wyse terminal: it sends the code that asks the terminal to identify itself (`Anybody out there?' is in the binary) and reads the reply to sense its baud rate. With a Wyse terminal on the line it answers; without one it waits.  Companion to wysetime, which sets that terminal's clock","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS/COMMS","size":2386,"star":true,"hassrc":true,"help":{"note":"it takes no options: it sends the identify request and waits for the terminal's reply"},"cat":"Communications","sub":"Terminal & session"},{"name":"wysetime","desc":"Wyse terminal clock-setter, in BASIC09.  `runb wysetime' prints the escape sequence a Wyse terminal reads to set its own display clock; run it by bare name at an OS-9 shell.","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":274,"basic09":true,"hassrc":true,"help":{"note":"a BASIC09 program run by runb; it takes no options"},"cat":"Communications","sub":"Terminal & session"},{"name":"X11R6shl","desc":"X11R6 shared library loader","needs":[{"path":"/dd/LIBDIR/XErrorDB","missing":true,"dir":false,"bytes":null},{"path":"/dd/XLOCALEDIR","missing":true,"dir":false,"bytes":null},{"path":"/dd/LIBDIR/Xcms.txt","missing":true,"dir":false,"bytes":null},{"path":"/dd/LIBDIR/XKeysymDB","missing":true,"dir":false,"bytes":null},{"path":"/dd/INCDIR/bitmaps","missing":true,"dir":false,"bytes":null},{"path":"/dd/XTFILES","missing":true,"dir":false,"bytes":null},{"path":"/dd/LIBDIR/XtErrorDB","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":1678736,"help":{"note":"a shared library, not a program"},"cat":"Graphics & images","sub":"X11"},{"name":"xbmtopbm","desc":"X11 or X10 bitmap, as C source, to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":48750,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"xc","desc":"runs the commands marked in a file -- a line beginning `% ' -- and leaves the rest as notes.  Forks them through Microware's `shell' to run","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":19652,"hassrc":true,"howto":"`xc \u003cfile>': lines beginning `% ' are commands, the rest is notes. It forks them through Microware's `shell' to run.","help":{"cmd":"xc -?","text":"xc: illegal option -- ?\nsyntax: xc [-c \u003ckey_char>] [file]\nfunction: find and execute commands contained in a file\ncommand lines are in the form:\n\t%c \u003cshell command>       or\n\t$c \u003cshell command>       (not echoed)\n...where 'c' is the optional key_char.\n\nthe most recent filename (from HOME/.xc) is assumed if omitted"},"cat":"Shells","sub":"Shell helpers"},{"name":"xcrypt","desc":"a simple file cipher: `xcrypt -k=\u003ckey> in out' encrypts, and the same command over the result decrypts it","src":"xrand","origin":"usenet archive","archive":"xrand.ar","dir":"CMDS","size":5448,"star":true,"hassrc":true,"help":{"cmd":"xcrypt -?","text":"en/decrypt \u003cinput-file> \u003coutput-file>"},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"xengine","desc":"an X11 demonstration: an engine animated in a window on an X display","src":"x11r6pl13_lib_v0_6","origin":"Microware OS-9 archive","archive":"x11r6pl13_lib_v0.6.lzh","dir":"CMDS","size":16712,"hassrc":true,"help":{"note":"it takes an X display and nothing else"},"cat":"Graphics & images","sub":"X11"},{"name":"ximtoppm","desc":"Xim image to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":48670,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"xkermit","desc":"the same version and banner as `kermit' -- OS-9 Kermit 1.5 -- in half the space, because it links cio rather than carrying stdio.  DOC/README-KERMIT","dir":"CMDS","size":14176,"star":true,"help":{"cmd":"xkermit -?","text":"OS-9 Kermit Version 1 Release 5\nUsage: kermit c[le line esc.char]   (connect mode)\nor:    kermit s[difl line] file ... (send mode)\nor:    kermit r[difl line]          (receive mode)\nor:    kermit h[difl line]          (Host server mode)\nor:    kermit g[difl line] file ... (get file from server)\nor:    kermit q[diful line]         (Quit remote Host server)"},"cat":"Communications","sub":"Kermit"},{"name":"xlate","desc":"Translate 6809 assembly source to 68000","dir":"CMDS","size":14834,"star":true,"docs":true,"hassrc":true,"howto":"Translates 6809 assembly source into 68000. Pairs with as09 (the 6809 assembler on this disk) and with `tab', which tabulates either dialect. Needs cio.","help":{"cmd":"xlate -?","text":"Syntax: xlate [\u003copts>] \u003cpathname>\nFunction: Translate a 6809 assembly language to 68000\nOptions:\n     -b\u003csize>      Make branches \u003csize>\n                        \u003csize> is one of s,b,w,l\n                        Default: BRA: short, LBRA: word\n     -c            Convert comments to lower case\n     -f            Use 68020 full format addressing modes\n     -k\u003ccpu>       Select CPU: 0=68000 (default); 2=68020\n     -o            Include old opcodes in comment field\n     -r            Read register mapping from 'xlate.regs'\n                        Contains lines of the form:\n                        \u003c6809reg>=\u003c68000reg>\n                        Lines starting with '*' are ignored\n     -r\u003cfrom>=\u003cto> Map 6809 register \u003cfrom> to 68000 register \u003cto>\n                        Defaults: A=d0, B=d1, D=d2, X=a0, Y=a1,\n                        U=a6, DP=a6 S=a7, PC=pc, CR=ccr, I(indirect)=a5\n     -s\u003csize>      Make data registers \u003csize>\n                        \u003csize> is one of b,w,l\n                        Default: A,B: byte, D: word\n     -w            Don't issue warnings for non-68000 op codes\n     -?            List usage\nInput taken from file, output to stdout\n\nCopyright (c) 1991,1994 Steven Weller, Windsor Systems\n2407 Lime Kiln Court, Louisville, KY 40222, U.S.A.\nPhone +1 (502) 425 9560  Fax +1 (502) 426 3944, email info@barefoot.com\nMay be distributed freely"},"cat":"Developer tools","sub":"Assembly"},{"name":"xlharc","desc":"C-LHarc 1.00 in a third build: extracts and lists .lzh archives like `lharc'","dir":"CMDS","size":48878,"help":{"cmd":"xlharc -?","text":"C-LHarc for OSK Version 1.00   (C) 1989-1990 Y.Tagawa\n (C) 1991 OS9/68000 Version N. Kuehne\n\nUsage: xlharc {axevlufdmctp}[qnftv] archive_file [files or directories...]\n\nCommands:                    Options:\n  a   Append                   q   quiet\n  x,e EXtract                  n   no execute\n  v,l View/List                f   force (over write at extract)\n  u   Update                   t   files are TEXT files\n  f   Freshen                  p\u003cpager>  use file pager for p command\n  d   Delete\n  m   Move\n  c   re-Construct new archive\n  t   Test archive\n  p   Print to STDOUT"},"cat":"System & modules","sub":"Utilities"},{"name":"xlisp","desc":"XLISP 2.1, a Lisp interpreter with objects, at a > prompt; (exit) leaves. DOC/xlisp has the manual","src":"xlisp","origin":"hc disk","archive":"SOURCES/USENET/XLISP/","dir":"CMDS","size":109682,"docs":true,"hassrc":true,"help":{"note":"it takes no options; its prompt takes Lisp, and (exit) leaves"},"cat":"Languages","sub":"Interpreters"},{"name":"xpmtoppm","desc":"X pixmap (XPM) to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":59360,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"xrf","desc":"C cross-reference generator -- it reads its language table C.XRF from the current data directory; the disk ships one in DOC/xrf.","src":"eff_xrf","origin":"EFFO forum","archive":"disk 1   C/XRF","dir":"CMDS","size":20290,"docs":true,"hassrc":true,"howto":"Wants TWO files in the DATA directory, not on the command line: its language table as `C.XRF' (the disk has it as DOC/xrf/c.xrf -- copy it) and the source you name. Given both it prints a full cross-reference: every identifier with the lines it appears on.","help":{"note":"it takes the source file and nothing else, with C.XRF in the data directory"},"cat":"Developer tools","sub":"Source navigation"},{"name":"xvminitoppm","desc":"XV thumbnail (.xvpics) to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":51574,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"xwdtopnm","desc":"X window dump (xwd) to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":100114,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"xy","desc":"XMODEM/YMODEM transfer.  `xy -?' prints the shared usage: send by naming files, receive by naming none; -A forces ASCII, -B binary, and -X/-Y/-K/-G/-C pick the protocol.  `z -?' lists the family's options too","dir":"CMDS/COMMS","size":53002,"help":{"cmd":"xy -?","text":"General Usage:\n   To send files:      XY \u003cfile1> \u003cfile2> \u003cetc.>\n   To receive files:   XY\n\nBy default, XY will automatically guess the type of each file.\n   To treat all files as a certain type:\n     -A   All files are ASCII      -B   All files are Binary\nBy default, XY attempts to use the YModem protocol.\n   To influence xy's protocol determination:\n     -X XModem       -K XModem-K   -G YModem-G\n     -C XModem-CRC   -Y YModem\n   To get debugging information: -d, -dd, etc.\n\nXY uses the MODEM environment variable to determine the port\nto use.  If none is available, stdio paths will be used.\nThe -p\u003cport> option overrides the MODEM environment variable.\nHost mode: -h forces XY to use stdio paths and suppresses all\nprogress and debug messages.  Equivalent to `unsetenv MODEM'.\n\nBased on \"The Working Programmer's Guide to Serial Protocols\"\nCopyright (C) 1995 Tim Kientzle and The Coriolis Group, Inc."},"cat":"Communications","sub":"Terminal & transfer"},{"name":"xydown","desc":"XModem/YModem download, public domain.  It senses which the sender is using -- XModem, YModem or YModem-Batch -- and follows, and it converts line endings on the way in. Written for use inside Eddie Kuns' KBCom terminal program and stands alone.  Full source in SRC/xydown, notes in DOC/xydown","src":"xydown","origin":"Microware OS-9 archive","archive":"XYDown.lzh","dir":"CMDS/COMMS","size":28098,"docs":true,"hassrc":true,"help":{"cmd":"xydown -?","text":"XYDOWN ver. 1.1\nXYDown ver. 1.1: XModem/YModem/YBatch download utility\nUsage:  XYDOWN  [opts]  [filename]\nOptions:\n  -a        Download file(s) as ASCII.\n  -b        Download file(s) as Binary.\n  -t\u003cpath>  Use \u003cpath> as serial port.  Default is /T0.\n  -l\u003cpath>  Use \u003cpath> as logging path.\n  -r\u003cbaud>  Use baud rate \u003cbaud>.\nXYDown automatically senses whether the sender is using\nXModem, YModem, or YBatch.  It will also make an automatic\ndetermination of the file type if neither -a nor -b is\nspecified.\nReleased into Public Domain.\nAuthor: Tim Kientzle, 1990."},"cat":"Communications","sub":"Terminal & transfer"},{"name":"xyt","desc":"X/Y/ZMODEM transfer for tterm","needs":[{"path":"/dd/SYS/XYTRANSFER/","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/COMMS","size":20124,"star":true,"help":{"cmd":"xyt -?","text":"xyt - version 1.02\n   XModem/YModem/YBatch transfer utility\n   Copyright 1995 by Stephen Carville\n   P.O. Box 822, Glendora, CA 91740  USA\n   (818) 914-2511\n\nUsage:  xyt [opts] [filename] [opts]\n\noptions:\n   -a  Force all transfers to Text\n   -b  Force all transfers to Binary\n   -x  startup in remote mode\n   -z[=]\u003cfile>  Get list of files to send from \u003cfile>\n   -t[=]\u003cpath>  Use \u003cpath> as serial port.\nDefaults:  local - MODEM port, remote - stdin"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"yacc","desc":"yacc parser generator, rebuilt `-qm' from SRC/effo_yacc. It reads a grammar and writes y.tab.c into the data directory.  `bison' is the other parser generator here and reports states and conflicts","src":"effo_yacc","origin":"EFFO forum","archive":"disk 14  SOFTWARE/C/yacc","needs":[{"path":"/dd/tmp","missing":false,"dir":true,"bytes":null}],"info":{"purpose":"yet another compiler compiler","status":"final","hardware":"none","language":"C","author":"from Berkeley univeristy (adaption to OS-9/68 : Stephan Paschedag)","availability":"public"},"dir":"CMDS","size":65550,"docs":true,"hassrc":true,"help":{"cmd":"yacc -?","text":"Syntax   : yacc [-dltv] [-b \u003cprefix>] filename\nFunction : yet another compiler compiler\nOptions  :\n   -b \u003cprefix>  output name wil be \u003cprefix>.tab.c\n   -d           generate .h file\n   -l           omit line numbers\n   -t           generate debug code\n   -v           generate y.output\n Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"yagi","desc":"a Yagi antenna design calculator, to DL6WU's method. It asks five questions on standard input -- frequency, element count, boom diameter, insulated from the boom Y/N, and a tubing size off its own list -- and prints element lengths and spacings. Answer four and it loops on the fifth","dir":"CMDS","size":26614,"howto":"It asks FIVE questions on standard input -- centre frequency in MHz, element count, boom diameter, whether the elements are insulated from the boom (Y/N), and a tubing size off its own list of six. Answer four and it loops on the fifth forever, because EOF on a numeric read returns the same thing every time.","help":{"note":"it asks its five questions itself"},"cat":"System & modules","sub":"Utilities"},{"name":"ybmtopbm","desc":"Bennet Yee `face' bitmap to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":41788,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"ynad","desc":"YNAD -- Yet Another Name & Address program.  A contact database.","dir":"CMDS","size":31684,"star":true,"help":{"note":"it takes no options; its commands are inside"},"cat":"System & modules","sub":"Utilities"},{"name":"yuvsplittoppm","desc":"three YUV planes -- basename.Y, .U and .V, 4:2:0 -- to PPM, given the width and height","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":55558,"hassrc":true,"help":{"cmd":"yuvsplittoppm -?","text":"usage:  yuvsplittoppm \u003cbasename> \u003cwidth> \u003cheight> [-ccir601]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"yuvtoppm","desc":"Abekas YUV bytes to PPM, given the width and height","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":46360,"hassrc":true,"howto":"yuvtoppm \u003cwidth> \u003cheight>. The dimensions are not stored in a YUV file, so you must supply the ones ppmtoyuv started from.","help":{"cmd":"yuvtoppm -?","text":"usage:  yuvtoppm \u003cwidth> \u003cheight> [yuvfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"z","desc":"ZMODEM transfer.  `z -?' prints the usage for both.  $MODEM names the port; -p\u003cport> overrides it","dir":"CMDS/COMMS","size":64202,"help":{"cmd":"z -?","text":"General Usage:\n   To send files:      Z \u003cfile1> \u003cfile2> \u003cetc.>\n   To receive files:   Z\n\nBy default, Z will automatically guess the type of each file.\n   To treat all files as a certain type:\n     -A   All files are ASCII      -B   All files are Binary\n   To send a command via ZModem: -c \"command\"\n   To get debugging information: -d, -dd, etc.\n\nZ uses the MODEM environment variable to determine the port\nto use.  If none is available, stdio paths will be used.\nThe -p\u003cport> option overrides the MODEM environment variable.\nHost mode: -h forces Z to use stdio paths and suppresses all\nprogress and debug messages.  Equivalent to `unsetenv MODEM'.\n\nBased on \"The Working Programmer's Guide to Serial Protocols\"\nCopyright (C) 1995 Tim Kientzle and The Coriolis Group, Inc."},"cat":"Communications","sub":"Terminal & transfer"},{"name":"zeisstopnm","desc":"Zeiss confocal microscope image to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":96088,"hassrc":true,"help":{"cmd":"zeisstopnm -?","text":"usage:  zeisstopnm [-pgm|-ppm] [Zeissfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"zip","desc":"Info-ZIP zip 1.9.  It deflates correctly, writes a temporary file (_Z000003), then cannot rename it over the target and reports `zip error: Could not create output file', in /dd/tmp and in /dd alike.  `zoo', `tar' and `gzip' round-trip exactly.","dir":"CMDS","size":63972,"docs":true,"help":{"cmd":"zip -h","text":"Copyright (C) 1990-1992 Mark Adler, Richard B. Wales, Jean-loup Gailly\nand Kai Uwe Rommel. Type 'zip -L' for the software License.\n\nZip 1.9 (Aug 20th 1992). Usage:\nzip [-options] [-b path] [-t mmddyy] [-n suffixes] [zipfile list] [-x list]\n  The default action is to add or replace zipfile entries from list, which\n  can include the special name - to compress standard input.\n  If zipfile and list are ommitted, zip compresses stdin to stdout.\n  -f   freshen: only changed files  -u   update: only changed or new files\n  -d   delete entries in zipfile    -m   move into zipfile (delete files)\n  -k   simulate PKZIP made zipfile  -g   allow growing existing zipfile\n  -h   show this help               -L   show software license\n  -r   recurse into directories     -j   junk (don't record) directory names\n  -0   store only                   -l   translate end-of-line\n  -1   compress faster              -9   compress better\n  -q   quiet operation              -n   don't compress these suffixes\n  -c   add one-line comments        -z   add zipfile comment\n  -b   use \"path\" for temp files    -t   only do files after \"mmddyy\"\n  -@   read names from stdin        -o   make zipfile as old as latest entry\n  -x   exclude the names that follow from those operated on"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"zipinfo","desc":"Info-ZIP zipinfo -- what is inside a zip archive","src":"unzip50","origin":"Microware OS-9 archive","archive":"unzip50_src.lzh -- Info-ZIP 5.0,","dir":"CMDS","size":23904,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"zipinfo -?","text":"   ZipInfo:  Zipfile Information Utility v1.0 of 21 August 92\n   (brought to you by Newtware, Inc., and the fine folks at Info-ZIP)\n\n   Usage:  zipinfo [-1smlvht] file[.zip] [filespec...]\n     -1  list filenames only, one per line (useful for pipes)\n     -s  list zipfile info in short Unix \"ls -l\" format:  default\n     -m  list zipfile info in medium Unix \"ls -l\" format\n     -l  list zipfile info in long Unix \"ls -l\" format\n     -v  list zipfile information in verbose, multi-page format\n     -h  list header line\n     -t  list totals for files listed or for all files"},"cat":"Archives & compression","sub":"zip"},{"name":"zipnote","desc":"Info-ZIP zipnote -- view/edit zip comments","dir":"CMDS","size":39604,"help":{"cmd":"zipnote -h","text":"Copyright (C) 1990-1992 Mark Adler, Richard B. Wales, Jean-loup Gailly\nand Kai Uwe Rommel. Type 'zipnote -L' for the software License.\n\nZipNote 1.9 (Aug 20th 1992)\nUsage:  zipnote [-w] [-b path] zipfile\n  the default action is to write the comments in zipfile to stdout\n  -w   write the zipfile comments from stdin\n  -b   use \"path\" for the temporary zip file\n  -h   show this help               -L   show software license\n\nExample:\n     zipnote foo.zip > foo.tmp\n     ed foo.tmp\n     ... then you edit the comments, save, and exit ...\n     zipnote -w foo.zip \u003c foo.tmp"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"zipsplit","desc":"Info-ZIP zipsplit -- split a zip archive","dir":"CMDS","size":41464,"help":{"cmd":"zipsplit -h","text":"Copyright (C) 1990-1992 Mark Adler, Richard B. Wales, Jean-loup Gailly\nand Kai Uwe Rommel. Type 'zipsplit -L' for the software License.\n\nZipSplit 1.9 (Aug 20th 1992)\nUsage:  zipsplit [-ti] [-n size] [-b path] zipfile\n  -t   report how many files it will t nOptions:\n\t-d          display text line in all styles, one at a time\n\t-s          help with styles  :-)\n\t-s[=]\u003cnum>  use style \u003cnum>\n\t-z[=\u003cfile>] get text from \u003cfile> (or stdin)\n\nBy: Roger Murray (ucla-an!remsit!rem@ee.ucla.edu) and\n    Marc Kriguer (kriguer@ernie.berkeley.edu)"},"cat":"Text tools","sub":"Banners & text art"}];
const BLURB = {"Shells": "Unix shells to sit beside OS-9's own -- bash and ksh bring history, job control, and scripts that come across unchanged.", "Editors": "vi and emacs in several flavours, line and stream editors, and editors for binary and hex.", "Text tools": "Search, sort, compare, reformat, split and spell-check.", "Files & directories": "Listing, copying, finding, renaming, and knowing what you have.", "Developer tools": "Version control, tags, cross-reference, formatters, a debugger and benchmarks.", "Compilers & build": "C compilers and their passes, assemblers, linkers, make and parser generators.", "Languages": "Interpreters and language systems beyond C.", "Archives & compression": "Pack, unpack and shrink -- lha, zip, tar, arc, zoo, and OS-9 module libraries.", "Encoding & conversion": "Between text encodings, line endings, Macintosh formats, ciphers and hashes.", "Communications": "Kermit in several builds, terminal sessions, and networking.", "Graphics & images": "The netpbm toolkit, JPEG, a ray tracer, and things that draw.", "Games": "Adventures, board and card games, arcade ports, dungeon crawls and puzzles.", "Screen toys": "Animations and screen effects -- they draw on the terminal rather than print to it. Some run until you stop them.", "Amusements": "Generators, simulators and diversions that are not quite games.", "System & modules": "OS-9 module and process tools, devices, system state and scheduling.", "Disk & DOS": "Reading and writing MS-DOS media with the mtools set.", "Time & calendar": "Calendars, clocks and astronomy.", "Maths & calculators": "Calculators, plotting, orbits and number theory.", "Printing": "Spoolers, page formatting and PostScript.", "Documentation": "Pagers, readers and the help system."};
const ORDER = ["Shells", "Editors", "Text tools", "Files & directories", "Developer tools", "Compilers & build", "Languages", "Archives & compression", "Encoding & conversion", "Communications", "Graphics & images", "Games", "Screen toys", "Amusements", "System & modules", "Disk & DOS", "Time & calendar", "Maths & calculators", "Printing", "Documentation", "Uncategorised"];
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const kb = n => n>=1024 ? Math.round(n/1024)+"K" : n+"B";
// Screens captured from the running programs, keyed by program name.
// docs/screens.js is generated by tools/gen_screens.py; if it is missing
// the catalogue simply shows no pictures.
const SHOTS = window.SCREENS || {};
const BY = Object.fromEntries(DATA.map(p=>[p.name,p]));
const picked = new Set();
// Which shell the reader types at.  Most commands read the same at bash and
// at Microware's shell; where a card carries an `os9' spelling, that is
// what the OS-9 setting shows.  Remembered in this browser only.
let shell = "unix";
try{ if(localStorage.getItem("shell")==="os9") shell="os9"; }catch(e){}
const PROMPT = {unix:"bash$ ", os9:"shell$ "};
function setShell(s){
  shell = s;
  try{ localStorage.setItem("shell", s); }catch(e){}
  document.getElementById("sh-unix").setAttribute("aria-pressed", String(s==="unix"));
  document.getElementById("sh-os9").setAttribute("aria-pressed", String(s==="os9"));
  renderPanel(); about();
}
// A picture is a session: its typed lines start `$ '.  Show them at the
// reader's own prompt, and where the card spells the command differently
// for the OS-9 shell, show that spelling on the line that typed it.
function shotHTML(shot){
  const cmd = tryFor(shot);
  return esc(shot.s).split("\n").map(ln => {
    if(!ln.startsWith("$ ")) return ln;
    let typed = ln.slice(2);
    if(shell==="os9" && shot.os9 && typed===esc(shot.try||"")) typed = esc(shot.os9);
    return `<span class="pr">${esc(PROMPT[shell])}</span>${typed}`;
  }).join("\n");
}
function tryFor(shot){
  if(!shot) return null;
  return (shell==="os9" && shot.os9) || shot.try || null;
}
// What the reader has chosen: a kind OR a letter, a query, and a program.
const st = {q:"", cat:null, letter:null, sel:null, nocio:false, src:false, doc:false, shot:false};

function ok(p){
  if(st.nocio && p.star) return false;
  if(st.src && !p.hassrc) return false;
  if(st.doc && !p.docs) return false;
  if(st.shot && !SHOTS[p.name]) return false;
  return true;
}
function matches(p, q){
  return p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q)
      || p.cat.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q);
}
// How well `p' answers the query: 3 exact name, 2 name starts with it,
// 1 name contains it, 0 only the prose does.  Typing `ls' should put the
// program `ls' first, not thirty descriptions that happen to contain those
// two letters.
function rank(p, q){
  const n = p.name.toLowerCase();
  return n === q ? 3 : n.startsWith(q) ? 2 : n.includes(q) ? 1 : 0;
}

// The list gives each program one line: the first sentence of its entry.
// The whole entry is on its page.
function lead(d){
  const m = /^(.*?)(\.\s|$)/.exec(d||"");
  return m ? m[1] : d;
}
function brief(d){
  const s = lead(d);
  return s.length > 68 ? s.slice(0,66).replace(/\s+\S*$/,"") + "\u2026" : s;
}
function row(p, where){
  const on = picked.has(p.name);
  return `<li class="p${on?" picked":""}" tabindex="0" data-n="${esc(p.name)}"`+
    `${st.sel===p.name?' aria-current="true"':''}>`+
    `<button class="pick" data-pick="${esc(p.name)}" tabindex="-1" `+
    `aria-label="pick ${esc(p.name)}">${on?"&#10003;":"+"}</button>`+
    `<span class="nm">${esc(p.name)}</span>`+
    `<span class="ds">${esc(brief(p.desc))}${where?` <span class="where">&middot; ${esc(where)}</span>`:""}</span></li>`;
}

function renderKinds(){
  const hits = DATA.filter(ok);
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  document.getElementById("kinds").innerHTML = ORDER.filter(c=>count[c]).map(c=>
    `<li data-cat="${esc(c)}" tabindex="0"${st.cat===c?' aria-current="true"':''}>`+
    `${esc(c)}<span class="n">${count[c]}</span></li>`).join("");
  const byl = {};
  for(const p of hits) byl[p.name[0].toUpperCase()] = (byl[p.name[0].toUpperCase()]||0)+1;
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  for(const k of Object.keys(byl)) if(!letters.includes(k)) letters.push(k);
  document.getElementById("abc").innerHTML = letters.map(k =>
    `<button data-letter="${k}"${byl[k]?"":" disabled"}${st.letter===k?' aria-current="true"':''}`+
    ` title="${byl[k]||0} programs">${k}</button>`).join("");
}

function renderProgs(){
  const col = document.getElementById("progs-col");
  const hits = DATA.filter(ok);
  const q = st.q.trim().toLowerCase();
  if(q){
    // SEARCHING IS NOT BROWSING: the answer is a ranked list, best first.
    const rows = hits.filter(p=>matches(p,q)).sort((a,b)=>rank(b,q)-rank(a,q)||a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${rows.length} match${rows.length===1?"":"es"}</h2>`+
      (rows.length ? `<ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`
                   : `<p class="empty">Nothing matches that. Names, descriptions and kinds are searched.</p>`);
    return;
  }
  if(st.letter){
    const rows = hits.filter(p=>p.name[0].toUpperCase()===st.letter).sort((a,b)=>a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${st.letter} &middot; ${rows.length}</h2><ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`;
    return;
  }
  if(st.cat){
    const subs = {};
    for(const p of hits) if(p.cat===st.cat) (subs[p.sub] ||= []).push(p);
    const names = Object.keys(subs).sort((a,b)=>a.localeCompare(b));
    const total = names.reduce((n,s)=>n+subs[s].length,0);
    let out = `<h2>${esc(st.cat)} &middot; ${total}</h2><p class="lede">${esc(BLURB[st.cat]||"")}</p>`;
    for(const s of names){
      if(names.length>1) out += `<div class="subh">${esc(s)} &middot; ${subs[s].length}</div>`;
      out += `<ul class="progs">${subs[s].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>row(p)).join("")}</ul>`;
    }
    col.innerHTML = out;
    return;
  }
  // Nothing chosen yet: every kind, with what it holds, as the way in.
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  col.innerHTML = `<h2>${hits.length} programs</h2><ul class="overview kinds">`+
    ORDER.filter(c=>count[c]).map(c=>`<li data-cat="${esc(c)}" tabindex="0"><div class="ct">${esc(c)}`+
    `<span class="n">${count[c]}</span></div><p class="blurb">${esc(BLURB[c]||"")}</p></li>`).join("")+"</ul>";
}

// Extra data files a program reads that ARE on the disk -- a reassurance,
// not a warning.  Scratch and universal paths are not worth listing, and a
// path the scan marked absent is dropped entirely: it is usually a
// compiled-in fallback the program never opens, and "what it needs and how
// to run it" is the job of the How to run it line, in plain words.
const NOISE = /\/tmp(\/|$)|\/sys\/termcap|tmp\.|\/nil$/i;
function alsoReads(p){
  if(!p.needs) return [];
  return p.needs.filter(n => !n.missing && !NOISE.test(n.path)).map(n => n.path);
}

// What `keep <name>' writes, by keep's own rules (SRC/keep/keep.c): the
// program, then each file DOC/DEPENDS says it opens that is here -- not
// termcap (SYS/login sets TERMCAP), not a directory (keep names it and
// leaves the decision to you), a path named twice taken once.
function brings(p){
  const files = [{path:"/dd/"+p.dir+"/"+p.name, bytes:p.size||0}];
  const seen = new Set([(p.dir+"/"+p.name).toLowerCase()]);
  const notes = [];
  for(const n of (p.needs||[])){
    if(n.missing) continue;
    const rel = n.path.replace(/^\/(dd|h0)\//i,"");
    if(/^sys\/termcap$/i.test(rel)) continue;
    if(seen.has(rel.toLowerCase())) continue;
    seen.add(rel.toLowerCase());
    if(n.dir){ notes.push(n.path+" is a directory, left for you to decide about"); continue; }
    if(n.bytes==null) continue;
    files.push({path:"/dd/"+rel, bytes:n.bytes});
  }
  return {files, notes};
}
function bringsHTML(p){
  const b = brings(p);
  const items = b.files.map(f=>`<li><code>${esc(f.path)}</code><span class="sz">${kb(f.bytes)}</span></li>`)
    .concat(b.notes.map(n=>`<li class="note">${esc(n)}</li>`));
  return `<div class="brings"><span class="k">keep brings</span><ul>${items.join("")}</ul></div>`;
}

function about(){

  if(st.sel && BY[st.sel]) return;
  const pr = PROMPT[shell];
  col.innerHTML = `<div class="about">`+
    `<p>Pick a kind of program, or a letter, then a program. Each one&rsquo;s page `+
    `says in a line what it does, gives you the command to <b>try it</b>, `+
    `lists anything it <b>needs</b>, shows it <b>running</b>, and prints `+
    `<b>its own help</b> as the program itself gives it; version, author and `+
    `where it came from follow.</p>`+
    `<p><b>See it run</b> was captured from the program on the disk image: keystrokes `+
    `into the console, the terminal stream rendered into the grid a vt100 `+
    `would have shown. Nothing is mocked up. The <b>bash</b> / <b>OS-9 shell</b> switch `+
    `above sets which shell the commands are spelt for.</p>`+
    `<p><b>Taking programs onto your own disk.</b> If this collection is your <code>/dd</code>, `+
    `everything already runs where it is. If your own OS-9 is <code>/dd</code> and this `+
    `disk is mounted alongside it, <code>keep</code> copies a program and the data files `+
    `it reads to where it expects them, and writes a receipt of every file. `+
    `Tick programs with <b>+</b> (or the space bar) and the command builds itself below.</p>`+
    `<pre class="usage">${esc(pr)}keep -n fortune cookie    what would be written, nothing touched\n`+
    `${esc(pr)}keep fortune cookie       copy them, and record every file\n`+
    `${esc(pr)}kept                      what has been taken, and how much it came to\n`+
    `${esc(pr)}drop cookie               put back exactly what keep wrote</pre>`+
    `<p><code>drop</code> leaves alone any file you have changed since &mdash; a score file, `+
    `a saved game &mdash; and says so. <code>DOC/README-KEEP</code> on the disk has the rest.</p>`+
    `</div>`;
}

function renderPanel(){

    about();
    return;
  }
  // Real requirements only.  cio ships on the disk, so it is not a

  const needs=[];
  if(p.basic09) needs.push('Microware&rsquo;s <code>runb</code>');

  const D=[];

  const i=p.info||{};

  add("Source",    p.src ? `<code>SRC/${esc(p.src)}</code>` : (p.hassrc?`<code>SRC/${esc(p.name)}</code>`:""));
  add("Docs",      p.docs ? `<code>DOC/${esc(p.name)}/</code>` : "");
  add("Restrictions", esc(i.restrictions));
  add("Hardware",     esc(i.hardware));
  const kin=DATA.filter(x=>x.sub===p.sub && x.name!==p.name).sort((a,b)=>a.name.localeCompare(b.name));
  if(kin.length) add("See also", kin.map(x=>
      `<a href="#p=${encodeURIComponent(x.name)}" class="kin" data-n="${esc(x.name)}"><code>${esc(x.name)}</code></a>`).join(", "));

  // The two things a browser wants first: what to type, and the program

    : "";
  // What the program says of itself when asked, captured whole

  // answers).  A program with no help of its own says so in a line.
  const h=p.help;

    ? `<div class="help"><div class="k">its own help</div>`+
      `<pre class="usage"><span class="pr">${esc(PROMPT[shell])}</span>${esc(h.cmd)}\n${esc(h.text)}</pre></div>`
    : `<div class="help"><div class="k">its own help</div><span class="none">${esc(h.note)}</span></div>`;

  col.innerHTML = `<div class="panel">`+
    `<button class="back" id="back">&larr; Back to the list</button>`+
    `<h2 class="pn">${esc(p.name)}</h2>`+
    `<p class="pd">${esc(i.purpose||lead(p.desc))}</p>`+
    `<div class="try"><span class="k">try it</span><code><span class="pr">${esc(PROMPT[shell])}</span>${esc(tryCmd)}</code></div>`+
    (needs.length?`<div class="needs"><span class="k">needs</span><span>${needs.join(" &middot; ")}${data.length?` <span class="okk">&middot; ${data.length>1?"all ":""}on the disk</span>`:""}</span></div>`:"")+
    seeHTML+
    helpHTML+
    bringsHTML(p)+
    (D.length?`<div class="more"><span class="k">details and provenance</span><dl>${D.join("")}</dl></div>`:"")+
    `</div>`;
  col.scrollTop = 0;
}

function render(){ renderKinds(); renderProgs(); renderPanel(); }

// The address bar follows the reader, so a page can be linked to and the
// back button works: #k=Games, #a=G, #p=gnuchess, #q=chess.
function toHash(){
  const h = st.sel ? "p="+encodeURIComponent(st.sel)
        : st.q ? "q="+encodeURIComponent(st.q)
        : st.cat ? "k="+encodeURIComponent(st.cat)
        : st.letter ? "a="+st.letter : "";
  if(location.hash.slice(1)!==h) history.pushState(null,"","#"+h);
}
function fromHash(){
  const [k,v] = location.hash.slice(1).split("=");
  const val = v ? decodeURIComponent(v) : "";
  if(k==="p" && BY[val]){ st.sel = val; if(!st.cat && !st.letter && !st.q) st.cat = BY[val].cat; }
  else if(k==="k"){ st.cat = val; st.letter=null; st.q=""; }
  else if(k==="a"){ st.letter = val; st.cat=null; st.q=""; }
  else if(k==="q"){ st.q = val; }
  document.getElementById("q").value = st.q;
  document.getElementById("app").dataset.stage = st.sel ? "panel" : "list";
}

function choose(name){
  st.sel = name;
  document.getElementById("app").dataset.stage = "panel";
  toHash(); renderProgs(); renderPanel();
}
function chooseKind(c){
  st.cat = c; st.letter = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}
function chooseLetter(k){
  st.letter = k; st.cat = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}

function tray(){
  const names=[...picked].sort();
  document.getElementById("tray").classList.toggle("on", names.length>0);
  document.getElementById("traycmd").textContent = names.length ? "keep " + names.join(" ") : "keep";
  document.getElementById("traydry").textContent = names.length ? "keep -n " + names.join(" ") : "keep -n";
  const all=[], notes=[], seen=new Set();
  for(const x of names){
    if(!BY[x]) continue;
    const b=brings(BY[x]);
    for(const f of b.files){ if(!seen.has(f.path.toLowerCase())){ seen.add(f.path.toLowerCase()); all.push(f); } }
    for(const n of b.notes) notes.push(n);
  }
  const bytes=all.reduce((n,f)=>n+f.bytes,0);
  document.getElementById("traysize").innerHTML =
    `<b>${names.length}</b> program${names.length===1?"":"s"}, <b>${all.length}</b> file${all.length===1?"":"s"}, `+
    `<b>${kb(bytes)}</b> written under /dd. Every file is recorded, so <code>drop</code> can take it back.`;
  document.getElementById("traysum").textContent = "every file it would write ("+all.length+")";
  document.getElementById("trayfiles").innerHTML =
    all.map(f=>`<li>${esc(f.path)}<span class="sz">${kb(f.bytes)}</span></li>`).join("")+
    notes.map(n=>`<li class="note">${esc(n)}</li>`).join("");
}

document.getElementById("kinds").addEventListener("click",e=>{
  const li=e.target.closest("li[data-cat]"); if(li) chooseKind(li.dataset.cat); });
document.getElementById("kinds").addEventListener("keydown",e=>{
  const li=e.target.closest("li[data-cat]"); if(li && e.key==="Enter") chooseKind(li.dataset.cat); });
document.getElementById("abc").addEventListener("click",e=>{
  const b=e.target.closest("button[data-letter]"); if(b) chooseLetter(b.dataset.letter); });
document.getElementById("progs-col").addEventListener("click",e=>{
  const pb=e.target.closest("button.pick");
  if(pb){                       // picking, not opening
    e.stopPropagation();
    const n=pb.dataset.pick;
    picked.has(n) ? picked.delete(n) : picked.add(n);
    pb.closest("li.p").classList.toggle("picked", picked.has(n));
    pb.innerHTML = picked.has(n) ? "&#10003;" : "+";
    tray();
    return;
  }
  const li=e.target.closest("li.p"); if(li){ choose(li.dataset.n); return; }
  const k=e.target.closest("li[data-cat]"); if(k) chooseKind(k.dataset.cat);
});
document.getElementById("progs-col").addEventListener("keydown",e=>{
  const li=e.target.closest("li.p");
  if(li){
    if(e.key==="Enter"){ e.preventDefault(); choose(li.dataset.n); }
    else if(e.key===" "){ e.preventDefault(); const pb=li.querySelector("button.pick"); if(pb) pb.click(); }
    return;
  }
  const k=e.target.closest("li[data-cat]"); if(k && e.key==="Enter") chooseKind(k.dataset.cat);
});
document.getElementById("panel-col").addEventListener("click",e=>{
  const a=e.target.closest("a.kin");
  if(a){ e.preventDefault(); choose(a.dataset.n); return; }
  if(e.target.id==="back"){
    st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel();
  }
});
document.getElementById("q").addEventListener("input",e=>{
  st.q=e.target.value; if(st.q){ st.cat=null; st.letter=null; }
  document.getElementById("app").dataset.stage="list"; toHash(); render(); });
for(const [id,k] of [["f-src","src"],["f-doc","doc"],["f-shot","shot"]]){
  const b=document.getElementById(id);
  b.onclick=()=>{ st[k]=!st[k]; b.setAttribute("aria-pressed",String(st[k])); render(); };
}
function copier(codeId, buttonId){ return ()=>{
  const el=document.getElementById(codeId);
  const b=document.getElementById(buttonId);
  const done=()=>{ b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200); };
  const selectIt=()=>{ const r=document.createRange(); r.selectNodeContents(el);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  // Selecting the text is the fallback: the clipboard API is unavailable on a
  // page opened from a file:// URL in several browsers, and this page is meant
  // to be readable straight off the disk.
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.textContent).then(done, selectIt);
  else selectIt();
}; }
document.getElementById("traycopy").onclick=copier("traycmd","traycopy");
document.getElementById("traycopydry").onclick=copier("traydry","traycopydry");
document.getElementById("sh-unix").onclick=()=>setShell("unix");
document.getElementById("sh-os9").onclick=()=>setShell("os9");
document.getElementById("trayclear").onclick=()=>{ picked.clear(); renderProgs(); tray(); };
window.addEventListener("popstate", ()=>{ st.sel=null; st.cat=null; st.letter=null; st.q=""; fromHash(); render(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && st.sel){ st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel(); }
});
fromHash(); setShell(shell); render(); tray();
</script>
