"size":69194,"help":{"cmd":"cjpeg.070 -?","text":"usage: cjpeg.070 [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -quality N     Compression quality (0..100; 5-95 is useful range)\n  -grayscale     Create monochrome JPEG file\n  -optimize      Optimize Huffman table (smaller file, but slow compression)\n  -targa         Input file is Targa format (usually not needed)\nSwitches for advanced users:\n  -dct int       Use integer DCT method (default)\n  -dct fast      Use fast integer DCT (less accurate)\n  -dct float     Use floating-point DCT method\n  -restart N     Set restart interval in rows, or in blocks with B\n  -smooth N      Smooth dithered input (N=1..100 is strength)\n  -maxmemory N   Maximum memory to use (in kbytes)\n  -outfile name  Specify name for output file\n  -verbose  or  -debug   Emit debug output\nSwitches for wizards:\n  -baseline      Force baseline output\n  -qtables file  Use quantization tables given in file\n  -qslots N[,...]    Set component quantization tables\n  -sample HxV[,...]  Set component sampling factors"},"cat":"Graphics & images","sub":"JPEG"},{"name":"ckermit","desc":"C-Kermit 5A(190) BETA.14, 24 Jul 94 -- the cio build.","dir":"CMDS","size":356040,"star":true,"docs":true,"help":{"cmd":"ckermit -h","text":"Usage: ckermit [cmdfile] [-x arg [-x arg]...[-yyy]..] [ = text ] ]\n  -x is an option requiring an argument, -y an option with no argument.\n     = means ignore following words, but place them in array \\&@[].\nactions:\n  -s files  send files                    -r  receive files\n  -s -      send files from stdin         -k  receive files to stdout\n  -x        enter server mode             -f  finish remote server\n\n  -g files  get remote files from server (quote wildcards)\n  -a name   alternate file name, used with -s, -r, -g\n  -c        connect (before file transfer), used with -l and -b\n  -n        connect (after file transfer), used with -l and -b\n\nsettings:\n  -l line   communication line device     -q   quiet during file transfer\n  -i        binary file transfer\n  -b bps    line speed, e.g. 2400         -t   half duplex, xon handshake\n  -p x      parity, x = e,o,m,s, or n     -d   log debug info to debug.log\n  -y name   alternate init file name      -w   write over files\n  -e n      receive packet length         -v n window size\n  -m name   modem type                    -z   force foreground\nIf no action command is included, or -S is, enter interactive dialog."},"cat":"Communications","sub":"Kermit"},{"name":"clear","desc":"clear the screen","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/C/CLEAR","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":4204,"star":true,"hassrc":true,"help":{"cmd":"clear -?","text":"Syntax:   clear\nFunction: Clears the screen.  (Informations from TERMCAP -file)\nOptions:  none"},"cat":"System & modules","sub":"Utilities"},{"name":"clock","desc":"displays a running clock on the terminal; it needs a terminal type and opens a pipe to feed its display","src":"misc","origin":"usenet archive","archive":"misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":36566,"hassrc":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"System state"},{"name":"cls","desc":"clear the screen (termcap)","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":15646,"hassrc":true,"help":{"cmd":"cls -?","text":"Syntax: cls\nFunction: clear terminal screen, uses TERM enviroment variable\n           and 'termcap' to clear screen\nOptions: none."},"cat":"Communications","sub":"Terminal & session"},{"name":"cmuwmtopbm","desc":"CMU window manager bitmap to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":41790,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"co","desc":"RCS: checks a revision out of a history file into a working file; -l locks it for editing","needs":[{"path":"/dd/tmp","missing":false,"dir":true,"bytes":null},{"path":"/dd/cmds/rcs","missing":false,"dir":false,"bytes":44066},{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":42308,"star":true,"help":{"cmd":"co -?","text":"co error: unknown option: -?\ncommand format:\nco -f[rev] -l[rev] -p[rev] -q[rev] -r[rev] -ddate -sstate -w[login] -jjoinlist file ...\nco aborted"},"cat":"Developer tools","sub":"Version control"},{"name":"collect","desc":"collect2: builds the table of global constructors and destructors a C++ program needs before linking","dir":"CMDS/GCC2","size":17634,"help":{"cmd":"collect -?","text":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n           -l=\u003cfile>    process library\n  Written 1991 by Stephan Paschedag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"colortest","desc":"G-Windows colour chart","dir":"CMDS/GAMES","size":5676,"star":true,"help":{"cmd":"colortest -?","text":"colortest\n   Provides information about G-Windows CLUT configuration\nOptions: none"},"cat":"Games","sub":"Other games"},{"name":"combine","desc":"interleaves two files byte by byte, one supplying the even bytes and the other the odd -- how a 16-bit EPROM image is put back together from two 8-bit halves","dir":"CMDS","size":3688,"star":true,"help":{"cmd":"combine -?","text":"(c.) 1989 by F.R.Schmitt MPI Kernphysik Heidelberg\n\nSyntax: combine [\u003cfile1>] [\u003cfile2>] [\u003coutfile>] [\u003copt>]\nFunction: combine files with even and odd bytes\nOptions:\n     -q      quiet mode [no prints]\n     -?      show this explanation"},"cat":"System & modules","sub":"Utilities"},{"name":"compiler","desc":"GSHELL front-end for the C compiler","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":22090,"docs":true,"hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; none of q, Q, control-D or ESC do.","help":{"cmd":"compiler -?","text":"Syntax: compiler [\u003cpath>]\nFunction: a menue driven compiler shell\nOptions: none"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"compr","desc":"a Lempel-Ziv-Welch file compressor, another edition of `compress': -v reports the saving, -d decompresses, and the .Z file replaces the original","dir":"CMDS","size":17762,"docs":true,"help":{"cmd":"compr -?","text":"Unknown flag: '?'; Usage: compress [-dfvcV] [-b maxbits] [file ...]"},"cat":"Archives & compression","sub":"Compress a file"},{"name":"compress","desc":"compress and uncompress with Lempel-Ziv-Welch coding","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":20484,"docs":true,"hassrc":true,"help":{"cmd":"compress -?","text":"Unknown flag: '?'; Usage: compress [-dfvoV] [-b MaxBits] [file ...]"},"cat":"Archives & compression","sub":"Compress a file"},{"name":"compress_4.0","desc":"compress 4.0, another edition of CMDS/compress","dir":"CMDS/REBUILT","size":31720,"help":{"cmd":"compress_4.0 -?","text":"Syntax   : compress [-cdfvV] [-b maxbits] [file ...]\nFunction : compress files\nOptions  :\n   -b  \u003cbits> set max number of bits for common substrings\n   -c         write result to stdout\n   -d         decompress\n   -f         overwrite already existing files\n   -v         print compression factors\n   -V         print version number\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Archives & compression","sub":"Alternates"},{"name":"compress_rebuilt","desc":"a second build of `compress' from the same source; the two write the same bytes","dir":"CMDS/REBUILT","size":20434,"help":{"cmd":"compress_rebuilt -?","text":"Unknown flag: '?'; Usage: compress [-dfvoV] [-b MaxBits] [file ...]"},"cat":"Archives & compression","sub":"Alternates"},{"name":"config","desc":"report this machine's C type properties as #defines -- char, short, int, long, pointer and float all come out; it then aborts where `double' begins, because that needs a 68881 or Microware's fpu.  See DOC/README-BUSERR","dir":"CMDS","size":21944,"docs":true,"help":{"note":"it takes no options: run it and it prints the defines"},"cat":"System & modules","sub":"Utilities"},{"name":"connect","desc":"connect to a serial line","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":6494,"star":true,"hassrc":true,"help":{"cmd":"connect -?","text":"Usage: connect [\u003cswitches>] [\u003cpath1>] [\u003cswitches>] [\u003cpath2>]\n\nWhere: 'switches' are...\n   -e : Enable local echo to selected path.\n   -d : Same as '-e'.\n   -l : Enable auto CRLF to selected path.\n   -x : Enable XON/XOFF to selected path.\n   -r : Open selected path for read only.\n   -w : Open selected path for write only.\n   -  : Use standard input and output to substitute for path name.\n   -- : Same as '-'.\n   -h : Show usage.\n   -? : Show usage.\n\u003cpath1>: Path name of controlling terminal (default is stdio).\n\u003cpath2>: Path name of remote device (default is stdio).\n\nAll switches affect the path name that follows.\nIf '-x' is selected with one of '-r' or '-w', the path will be opened\nwith read+write attributes."},"cat":"Communications","sub":"Terminal & session"},{"name":"convert","desc":"starts the WORLD text adventure: run it and the game opens with its banner, the opening paragraph and a `>' prompt","src":"world","origin":"usenet archive","archive":"world.ar","needs":[{"path":"/dd/GAMES/world/q1text.dat","missing":false,"dir":false,"bytes":77824}],"dir":"CMDS/GAMES","size":85936,"hassrc":true,"howto":"It STARTS the `world' adventure -- run it and the game opens.","help":{"note":"it takes no options: run it and the adventure begins"},"cat":"Games","sub":"Other games"},{"name":"cookhash","desc":"build the hash file cookie(1) needs, from a sayings file","src":"cookie","origin":"usenet archive","archive":"cookie.ar","dir":"CMDS","size":13780,"hassrc":true,"help":{"cmd":"cookhash -?","text":"usage: cookhash \u003ccookiefile >hashfile"},"cat":"Text tools","sub":"Fortune & sayings"},{"name":"cookie","desc":"print a random fortune cookie","src":"cookie","origin":"usenet archive","archive":"cookie.ar","needs":[{"path":"/dd/GAMES/cookie/sayings","missing":false,"dir":false,"bytes":159500},{"path":"/dd/GAMES/cookie/sayhash","missing":false,"dir":false,"bytes":6356}],"dir":"CMDS","size":19312,"docs":true,"hassrc":true,"howto":"Bare it prints a fortune from a default file. Given arguments it wants BOTH the cookie file and the hash `strfile' built for it: `strfile mine' then `cookie mine mine.dat'.","help":{"cmd":"cookie -?","text":"usage: cookie cookiefile hashfile"},"cat":"Text tools","sub":"Fortune & sayings"},{"name":"cp","desc":"copy files -- `cp \u003cfrom> \u003cto>' copies the bytes across.  Run with no arguments it prints its usage and then stops on a bus error","dir":"CMDS","size":4228,"star":true,"help":{"cmd":"cp -?","text":"Usage: cp file1 file2\n  or   cp file1 file2 .. dir\n    copy one file literally to another, or\n     copy several files to a directory.\n   options:\n    -c    confirm before overwrite\n    -n    noisy (tells of copies)\n    -u    upcase before compare\n    -v    verify the data written\n  file spec can include meta chars, but not dir\ncp: cp is not directory"},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"cpr","desc":"print or pretty-list C source for paper: a title, a contents page, then the source with page and line numbers.","src":"cpr","origin":"usenet archive","archive":"cpr.ar   [also built from hc_loose, v_misc]","needs":[{"path":"/dd/tmp/cprXXXXXX","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":26306,"docs":true,"hassrc":true,"help":{"cmd":"cpr -?","text":"Usage: cpr [-cCnNsS] [-T title] [-t tabwidth] [-p[num]] [-r[num]] [-l pagelength] [[-f] file] ..."},"cat":"Developer tools","sub":"Source formatting"},{"name":"cpu","desc":"a CPU speed test: it draws a bar chart of its timing loop and prints the clock rate it measured, then stops on a trap","dir":"CMDS","size":8246,"star":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"Utilities"},{"name":"creadoc","desc":"extract the documentation header (C++ ... C--) from every .f file in the current directory into creadoc.txt -- an early Fortran documentation generator.  It reads each file name from column 53 of a `dir -eadu' listing, where this disk's dir puts it at 54 (and 2026, printed `126', pushes it a column further), so it opens the name with a leading space and stops.  A dir-format brittleness, not the CPU; a one-constant source fix.  DOC/rtf/biory.doc is its output for biory.f.  Source: SRC/rtf/creadoc.f","src":"rtf","origin":"EFFO forum","archive":"disk 5 SPRACHEN/FORTRAN/CREADOC","dir":"CMDS","size":5748,"hassrc":true,"help":{"note":"`load /dd/CMDS/os9lib' first; it takes no options and works on the .f files in the data directory"},"cat":"Compilers & build","sub":"Fortran"},{"name":"crib","desc":"cribbage.  Needs TERM set, so run it from a login session -- bare it says `Unknown terminal type'","src":"crib","origin":"usenet archive","archive":"crib.ar","needs":[{"path":"/dd/GAMES/crib/crib.instr","missing":false,"dir":false,"bytes":10525},{"path":"/dd/GAMES/crib/criblog","missing":false,"dir":false,"bytes":88},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":53634,"docs":true,"hassrc":true,"howto":"Full-screen cribbage, and it wants TERM -- run it from a login session. Answer the instructions question, choose a long or short game, and discard by naming a card, `7H'. Control-C gets you out.","help":{"cmd":"crib -?","text":"syntax: crib {opt}\nfunction: play game of cribbage against computer\noptions:\n\t-e\texplain player (scoring) errors\n\t-q\tuse abbreviated messages\n\t-r\tuse random cuts instead of inquiring"},"cat":"Games","sub":"Board & card"},{"name":"cribbage","desc":"cribbage -- offers instructions before it deals.  Needs TERM, so run it from a login session","needs":[{"path":"/h0/games/crib/crib.instr","missing":false,"dir":false,"bytes":10525},{"path":"/h0/games/crib/criblog","missing":false,"dir":false,"bytes":88},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":40608,"star":true,"howto":"The other cribbage, the same shape: TERM must be set, it offers the rules first, then cuts for the crib. Control-C gets you out.","help":{"cmd":"cribbage -?","text":"syntax: cribbage {opt}\nfunction: play game of cribbage against computer\noptions:\n\t-e\texplain player (scoring) errors\n\t-q\tuse abbreviated messages\n\t-r\tuse random cuts instead of inquiring"},"cat":"Games","sub":"Board & card"},{"name":"cron","desc":"run commands at specified times (daemon)","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","needs":[{"path":"/dd/usr/lib/crontab","missing":false,"dir":false,"bytes":243}],"dir":"CMDS","size":5126,"docs":true,"hassrc":true,"help":{"note":"it takes no options; it reads the crontab and runs as a daemon"},"cat":"System & modules","sub":"Scheduling"},{"name":"crypto","desc":"cryptogram puzzle solver's assistant","src":"crypto","origin":"usenet archive","archive":"crypto.ar","needs":[{"path":"/dd/GAMES/dict","missing":false,"dir":false,"bytes":164034},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":39736,"star":true,"docs":true,"hassrc":true,"howto":"`crypto -h' is the real option list and `-i' the interactive commands; its bare answer is two lines naming those. As a FILTER it ends the emulator session here, so read the help rather than piping through it.","help":{"cmd":"crypto -h","text":"This program allows you to interactively solve cryptogram puzzles, or to simply\nfilter the input to the standard output IF the output has been redirected.  The\ninput can be pre-encoded or I can encode it for you.  If I encode it, I will be\nable to tell you when you have correctly solved the puzzle.\n\nCommand-line options:\n\t-u\tforce all input to Upper-case.\n\t-e\tEncode the input stream with a random cypher.\n\t-r\tencode using a simpler, rot-based random cypher.  For a\n\t\tspecific rotation, include a number from 1 to 26, e.g.:  -r13.\n\t-cSTR\tencode using the Code STR as the encryption cypher.\n\t-gSTR\tinitialize the Guessed letters to STR.\n\t-n\tinclude No brace-commands when saving or piping.\n\tFILE\tread input from one or more FILEs instead of stdin.\n\t-i\toutput the Interactive commands.\n\t-h\toutput this Help list.\n\t-\tthe null option can be used to avoid an empty command tail.\n\nExamples:\n\tfortune -l | crypto -r\n\tcrypto -eu puzzles\n\tcrypto -n -gzyxwvutsrqponmlkjihgfedcba code.file >result.file"},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"csl","desc":"Microware's C Shared Library, for programs built with Ultra C rather than cc 3.2 (68000)","dir":"CMDS","size":48366,"help":{"note":"Microware's C standard library trap handler, not a program"},"cat":"System & modules","sub":"Microware runtime"},{"name":"csl020","desc":"the same, for 68020/030/040","dir":"CMDS","size":43794,"help":{"note":"Microware's C standard library trap handler built for the 68020, not a program"},"cat":"System & modules","sub":"Microware runtime"},{"name":"ctags","desc":"generate a vi tags file from C source (BSD)","dir":"CMDS","size":25972,"docs":true,"help":{"cmd":"ctags -?","text":"ctags: illegal option -- ?\nusage: ctags [-BFadtuwvx] [-f tagsfile] file ...\n        -B : use backward searching patterns (? ?)\n        -F : use forward searching patterns (/ /)\n        -a : append to 'tags' file\n        -d : create tags for #define's without arguments\n        -f : place tag description in 'tagsfile'\n        -t : create tags for typedefs, structs, unions\n        -u : update specified files in 'tags'\n        -v : prepare index for 'vgrind'\n        -w : suppress warnings\n        -x : prepare xref index"},"cat":"Developer tools","sub":"Source navigation"},{"name":"ctags.elvis","desc":"elvis 1.7's ctags; CMDS/ctags is the BSD one","needs":[{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/REBUILT","size":28032,"help":{"cmd":"ctags.elvis -?","text":"usage: ctags [flags] filenames...\n\t-s  include static functions\n\t-t  include typedefs\n\t-v  include variable declarations\n\t-r  generate a \"refs\" file, too\n\t-a  append to \"tags\", instead of overwriting"},"cat":"Developer tools","sub":"Tags"},{"name":"cursive","desc":"writes a message as one line of joined, sloping cursive script, the flourish people once signed mail with","src":"cursive","origin":"usenet archive","archive":"cursive.ar","dir":"CMDS","size":23590,"docs":true,"hassrc":true,"help":{"cmd":"cursive -?","text":"usage: cursive [-tn] [-in] message"},"cat":"Text tools","sub":"Banners & text art"},{"name":"cut","desc":"picks fields (-f) or character columns (-c) out of each line, with -d naming the field separator","src":"cutpaste","origin":"usenet archive","archive":"cutpaste.ar","dir":"CMDS","size":17596,"docs":true,"hassrc":true,"help":{"cmd":"cut -?","text":"cut: Illegal option -- ?\ncut [-d\u003cdelimitor>] [-s] -c\u003clist>|-f\u003clist> [files]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"cuts","desc":"Coco Usenet Transfer Utility -- encodes a binary as text that will pass through electronic mail, in a form that survives gateways between ASCII and EBCDIC machines; `-d' decodes, which is the half worth having.  The encoder (`-e') asks for billions of bytes of memory, is refused, and writes empty data lines until it is stopped.","src":"cuts","origin":"hc disk","archive":"SOURCES/USENET/cuts.ar","dir":"CMDS","size":8794,"star":true,"docs":true,"hassrc":true,"howto":"Coco Usenet Transfer Utility: it encodes a binary as mail-safe text and `-d' decodes a cuts file. Use `-d' for the half worth having; the encoder (`-e') asks for gigabytes of memory and is refused.","help":{"cmd":"cuts -h","text":"          CUTS Usage Summary\n\nTo decode one or more CUTS-encoded files:\n     cuts -d \u003cfile> . . .\n\nTo encode one or more files into a CUTS package:\n     cuts -e [-o \u003coutput_file>]  [ [-\u003ctype>] \u003cfile> ]\n\n   where \u003coutput_file> defaults to standard output,\n   \u003ctype> is one of:   -9    OS9-specific binary\n                       -a    ASCII text file\n                       -b    non-specific Binary file(e.g. picture files)\n                       -r    RSDOS-specific binary\n\nTo print out information about this version of CUTS:\n     cuts -v\n\nTo get this message:\n     cuts -h"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"cvtbase","desc":"converts a number between bases.  The bases are named by key -- b, d, h or x, o -- or by their value, and the number comes on standard input: `echo 255 ! cvtbase d h' answers ff","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":16476,"hassrc":true,"howto":"The bases are the arguments and the numbers come on standard input, one per line: `cvtbase d h' then 255 answers ff; Escape ends it. Bases are named b, d, h or x, o -- or by their digit characters.","help":{"cmd":"cvtbase -?","text":"syntax: cvtbase \u003cinput base> \u003coutput base>\nfunction: convert numbers in \u003cstdin> from one base to another.\noptions: (none)\n\u003cbase> is specified by one of the following:\n\tb       binary\n\td       decimal\n\th or x  hexadecimal\n\to       octal\n\tor the actual digit characters (eg. 012 would be ternary notation).\nThese may be preceded by a - sign to indicate the base is negative.\nA base may be preceded by m\u003cchar>, to use a different minus sign char.\nBases -1, 0, and 1 are disallowed.\n\nCopyright 1988 by Mike Parker.  All rights reserved.  Non-profit\nredistribution permitted."},"cat":"Maths & calculators","sub":"Calculators"},{"name":"cxref","desc":"C cross-reference lister -- numbered listing + symbol table","dir":"CMDS","size":5594,"star":true,"help":{"cmd":"cxref -?","text":"Syntax:\t\tcxref [-opts] [path]\nFunction:\tCreate and print a 'C' cross-reference\nOptions:\t-x\t\t\tmake cross-reference only\n\t\t\t-w=(n)\t\tprint line width(>50, default 132)\n\t\t\t-t=(n)\t\tmaximum token with(7\u003cn\u003c25, default 24)\n\t\t\t-?\t\t\tdisplay synopsis"},"cat":"Developer tools","sub":"Source navigation"},{"name":"cyberwar","desc":"CyberWar -- a game that needs G-Windows","dir":"CMDS/GAMES","size":93966,"star":true,"docs":true,"help":{"note":"it needs G-Windows; there is no help flag"},"cat":"Games","sub":"Other games"},{"name":"dam","desc":"display the disk allocation map -- dam [\u003cdrive>]","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2626,"star":true,"hassrc":true,"help":{"note":"it takes a device and nothing else"},"cat":"System & modules","sub":"Devices & disks"},{"name":"dback","desc":"directory backup: walks a directory and issues an OS-9 `copy' for every file that has changed, so what you see is the list of copies it wants","src":"dback","origin":"Microware OS-9 archive","archive":"dback.lzh","dir":"CMDS","size":14898,"docs":true,"hassrc":true,"help":{"cmd":"dback -?","text":"Usage: Dback [-options] \u003cfromdir> \u003ctodir> [-options]\n     -b=\u003cno>k= copy buffer\n     -d=file = backup selected directory\n     -e      = execute\n     -f=xxx  = omit files suffixed xxx (default:_BAK)\n     -k      = omit OS9Boot files\n     -l      = no recursion\n     -p      = pause before copying\n     -s=file = start copying at\n     -t=file = terminate copying at\n     -v      = verify\n     -?      = report help\nDefaults\n source directory (default =  . )\n target directory (default = /d0)"},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"dbz","desc":"the news history database","dir":"CMDS/NEWS","size":13344,"star":true,"howto":"The news history database from C News: `dbz [-a] [-x] [-c] database [file]...'. Part of a news system.","help":{"cmd":"dbz -?","text":"/dd/CMDS/NEWS/dbz: unknown option -?\nusage: /dd/CMDS/NEWS/dbz [-a] [-x] [-c] database [file] ..."},"cat":"Communications","sub":"News"},{"name":"dclock","desc":"a digital clock for G-Windows","dir":"CMDS/GAMES","size":5652,"star":true,"help":{"cmd":"dclock -?","text":"dclock - digital clock for G-windows\nCopyright 1996 by High-G Software.\n\nUsage: dclock [options]\n    options:\n        -m = use 24 hour format (default = 12 hour format).\n        -h = don't hibernate on startup."},"cat":"Games","sub":"Other games"},{"name":"dearc","desc":"Extract an MS-DOS .ARC archive.  arc and marc handle the OS-9 side","dir":"CMDS","size":7680,"star":true,"help":{"note":"it takes the archive to extract and nothing else"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"dedit","desc":"BASIC09 disk sector editor -- read, edit and write raw sectors, decode a disk's identification sector.  I-CODE, not 68000 code: run it with runb and the bare module name, like bio and wysetime.  Nine modules in the one file.","dir":"CMDS","size":13514,"basic09":true,"help":{"note":"it edits raw disk sectors at its own prompts and has no help flag; it writes what it is told"},"cat":"System & modules","sub":"Devices & disks"},{"name":"delbak","desc":"delete backup files (*_bak) in a directory tree","src":"cowen_tools","origin":"Microware OS-9 archive","archive":"cowen_tools.lzh","dir":"CMDS","size":3352,"star":true,"hassrc":true,"help":{"cmd":"delbak -?","text":"Usage: delbak [-options] [directory] [-options]\n     -n      = no recursion\n     -l      = list only\n     -f=\u003cext>= extension to delete, default _bak\n     -?      = report help"},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"demerge","desc":"split a merged file back into its parts","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/ASSEMBLER (68k asm)","dir":"CMDS","size":456,"hassrc":true,"howto":"OS-9's `merge' is concatenation and there is no `merge' binary here, so `cat a b > c' makes the file demerge takes apart. There is no `od' either -- `dump' is the hex dump.","help":{"cmd":"demerge -?","text":"Syntax:   demerge \u003cpath>\nFunction: demerges a file of merged modules to single module\n          files named as modules\nopts:     none"},"cat":"System & modules","sub":"Utilities"},{"name":"demo","desc":"egetopt option-parsing demonstration","dir":"CMDS","size":11082,"help":{"note":"it takes options to parse and prints what it made of them"},"cat":"System & modules","sub":"Utilities"},{"name":"des","desc":"DES file encryption -- it writes `\u003cfile>.n' and removes the original.  It does not restore a file run through it twice with the same key (the result checksums 00000000), so for a round trip use `xcrypt'","src":"des","origin":"usenet archive","archive":"des.ar","dir":"CMDS","size":6344,"star":true,"docs":true,"hassrc":true,"howto":"It takes files and has no option flags at all -- `des file ...'. `-e' and `-?' are read as filenames and earn `Can't read -e.'","help":{"note":"it takes files and no option flags at all; a flag is read as a file name"},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"detab","desc":"replaces tabs with spaces, at stops every eight columns or every n with -tn","dir":"CMDS","size":2138,"star":true,"help":{"cmd":"detab -?","text":"Usage: detab [-tn] [infile] or [\u003cinfile]\n     -tn = n is tabstop"},"cat":"Text tools","sub":"Transform & filter"},{"name":"deton","desc":"time out an I/O read using an alarm: `deton [seconds]', an example rather than a tool.  For converting tabs, see `detab' and `expand'","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2974,"star":true,"hassrc":true,"help":{"cmd":"deton -?","text":"syntax: deton [seconds]\nfunction: demonstrate use of alarm to time out I/O\noptions: none"},"cat":"System & modules","sub":"Utilities"},{"name":"devprc","desc":"shows which device each process holds a path to: -a walks every process and lists its open paths and the device behind each","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":17922,"docs":true,"hassrc":true,"help":{"cmd":"devprc -?","text":"devprc: display device(s) belonging to process(es), V.1.01\noptions:     -a       display all devices belonging to all processes\n             -d [dev] display process having device [dev] open\n             -h       print header (with -d option)"},"cat":"System & modules","sub":"Utilities"},{"name":"dfiles","desc":"find duplicate files under a directory and write out the `cmp' commands that would prove them identical, so the list itself is the answer","src":"dfiles","origin":"EFFO forum","archive":"disk 15 SOFTWARE/C/DFILES","info":{"version":"1.4","purpose":"search for double files on disk","status":"final (hopefully)","language":"C","author":"Christian Mahr","availability":"Public","conditions":"no conditions","copyright":"(C) Christian Mahr"},"dir":"CMDS","size":8798,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"dfiles -?","text":"dfiles 0.7\nUsage:\ndfiles \u003cpath> [\u003cpath> ...]\nFunction:\n\trecursive directory scan:\n\tfinds double files on disk and\n\tissues the necessary 'cmp' commands\n\tfiles may be excluded from compare by an exclude list\nOptions:\n  -v            verbose mode\n  -e[=\u003cfile>]   exclude list\n  -z[=\u003cfile>]   dir list\n  -c            execute the 'cmp'\n  -d            use 'diff' instead of 'cmp'"},"cat":"Files & directories","sub":"Find & compare"},{"name":"dhry","desc":"Dhrystone 2.0 built with Microware's cc. It reads the number of runs from standard input: `echo 500000 | dhry'. Twelve builds of the same source sit in CMDS/DHRY, so the compilers can be compared","dir":"CMDS/DHRY","size":25000,"docs":true,"hassrc":true,"howto":"Dhrystone 2.0. Twelve builds of the same source sit in CMDS/DHRY -- run several and compare, which is what tells you the compiler's cost. Run under an emulator the number describes the host machine, not a 68000.","help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc","desc":"Dhrystone 2.0 built with GCC 1; see dhry","dir":"CMDS/DHRY","size":8804,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2","desc":"Dhrystone 2.0 built with GCC 2; see dhry","dir":"CMDS/DHRY","size":9510,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2in","desc":"Dhrystone 2.0 built with GCC 2 with inlining; see dhry","dir":"CMDS/DHRY","size":9506,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2mx","desc":"Dhrystone 2.0 built with GCC 2, mixed options; see dhry","dir":"CMDS/DHRY","size":9450,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2o2","desc":"Dhrystone 2.0 built with GCC 2 at -O2; see dhry","dir":"CMDS/DHRY","size":8808,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGccin","desc":"Dhrystone 2.0 built with GCC 1 with inlining; see dhry","dir":"CMDS/DHRY","size":8810,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGccmx","desc":"Dhrystone 2.0 built with GCC 1, mixed options; see dhry","dir":"CMDS/DHRY","size":8750,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcco2","desc":"Dhrystone 2.0 built with GCC 1 at -O2; see dhry","dir":"CMDS/DHRY","size":8806,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryO2","desc":"Dhrystone 2.0 built with Microware's cc at -O2; see dhry","dir":"CMDS/DHRY","size":24854,"howto":"All eleven Dhrystone builds READ A RUN COUNT FROM STANDARD INPUT before they start -- run bare they print two lines and wait. `echo 200000 | dhryO2'. Under os9exec even 20000 runs finish inside one tick of the clock, so it answers \"Measured time too small ... Please increase number of runs\" rather than a rate; the comparison between builds is what they are here for, and on real hardware it works as intended.","help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryshamu","desc":"Dhrystone 2.0, the shamu build; see dhry","dir":"CMDS/DHRY","size":8750,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryshamu2","desc":"Dhrystone 2.0, a second shamu build; see dhry","dir":"CMDS/DHRY","size":9454,"star":true,"help":{"note":"it reads the number of runs from standard input and takes no options: `echo 500000"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"diff","desc":"GNU diff 1.1: compares two text files and prints the lines that differ, in normal, context (-c) or ed-script (-e) form; reads CR-terminated text","src":"diff","origin":"usenet archive","archive":"diff.ar   [also built from eff_effdiff]","dir":"CMDS","size":31240,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"diff -?","text":"diff: illegal option -- diff: requires two file names.  Usage: diff [-options] file1 file2"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"diff_1.1","desc":"a second build of GNU diff 1.1 with the same options; see `diff'","dir":"CMDS/REBUILT","size":61968,"help":{"cmd":"diff_1.1 -?","text":"Syntax   : diff [\u003coptions>] file1 file2\nFunction : generate differences of two files\nOptions  :\n     -\u003cnum>      specify context size in decimal\n     -a          treat all files as text files\n     -b          ignore trailing whitespaces\n     -B          ignore blank lines\n     -c          generate context-style output\n     -C          context-style and show name of last C function\n     -d          don't discard lines (slow)\n     -e          generate ed-script output\n     -f          sorted ed-script\n     -F \u003cregexp> show previous line of match (only with -c)\n     -H          use heuristics\n     -i          ignore case\n     -I \u003cregexp> ignore lines matching regexp\n     -l          paginate output through 'pr'\n     -n          generate an reverse ed-script for RCS\n     -N          suppress 'Only in \u003cdir>'-messages\n     -r          compare directories recursively\n     -s          announce same files\n     -S \u003cfname>  (re-)start comparision of dirs with fname\n     -t          expand tabs to spaces in output\n     -T          use tabs in output\n     -w          totally ignore spaces\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Text tools","sub":"Alternates"},{"name":"digclk","desc":"a clock in block digits with the machine's name above it and the date below, redrawn once a minute, or every so many seconds as given","src":"digclk","origin":"usenet archive","archive":"digclk.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":38194,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"digclk -?","text":"Usage: digclk [refresh_rate]"},"cat":"Time & calendar","sub":"Clocks"},{"name":"dinfo","desc":"disk/device information","src":"eff_dinfo","origin":"EFFO forum","archive":"disk 12  SOFTWARE/C/DINFO","dir":"CMDS","size":7348,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"dinfo -?","text":"Syntax:   dinfo [\u003copts>] {\u003cdevice name> [\u003copts>]}\nFunction: Show information about a RBF Disk Device\n          (Substitute for OS9 \"free\" utility)\nOptions:  -e           : Extended display\n          -f[[=]\u003cnum>] : Show fragmentation info. \u003cnum> specifies max\n                         size (in clusters) of blocks to be reported as\n                         \"small blocks\". Default is 4 clusters\n          -l           : detailed list of unused blocks\n          -b[=]\u003csize>  : set buffer size\nV2.1 Ed#4 (c) 1990 by L.Zeller"},"cat":"System & modules","sub":"Devices & disks"},{"name":"dir","desc":"directory listing -- `dir [\u003copts>] \u003cdirectory>'; `-e' adds owner, dates, attributes and size","dir":"CMDS","size":9680,"star":true,"help":{"cmd":"dir -?","text":"Dir Version 1.08  (C) 1988 by Lim. (Modified by L.Z)\nSyntax: dir [\u003copts>] {\u003cdir names> [\u003copts>]}\nFunction: display directory contents\nOptions:\n     -a        show all files\n     -c        show creation date\n     -d        show directories with a slash\n     -e        extended dir listing\n     -f        show fragmentation and link count\n     -h        show file size in hex\n     -k        show file size in kilo bytes\n     -m        sort 'last modified' field\n     -n        treat dirs like files\n     -p        follow the PATH environment dir names\n     -r        recursive dir listings\n     -r=\u003cnum>  recursive dir listing to depth \u003cnum>\n     -s        unsorted dir listing\n     -u        unformatted listing\n     -x        directory is execution dir\n     -z        read dir names from stdin"},"cat":"Files & directories","sub":"List & navigate"},{"name":"dirname","desc":"prints the directory part of a path: everything up to the last slash","dir":"CMDS","size":2074,"star":true,"help":{"cmd":"dirname -?","text":"dirname v1.0 (c) M.C.Gregorie, 1994\n\nSyntax:   dirname \u003cpath>\nFunction: Outputs string after deleting\n          anything after the final /\nOptions:  none"},"cat":"Files & directories","sub":"Paths"},{"name":"disable","desc":"disable a UUCP device","src":"bnu_uucp","origin":"Microware OS-9 archive","archive":"uucp.lzh BNU/UUCP/SRC","needs":[{"path":"/DD/SYS/ttylist","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/UUCP","size":4280,"star":true,"hassrc":true,"help":{"cmd":"disable -?","text":"Syntax: disable \u003cport>\nFunction: Turn OFF MTSMon on \u003cport>"},"cat":"Communications","sub":"Mail"},{"name":"disktest","desc":"measure disk performance  [no military use -- DOC/EFFO-INFO]","src":"forum14","origin":"Microware OS-9 archive","archive":"forum14.lzh","info":{"version":"1.0","purpose":"diskperformance test","status":"final","hardware":"none","language":"C","author":"Stephan Paschedag, CH-8708 Maennedorf","availability":"public","conditions":"no military use","copyright":"by St.Paschedag","restrictions":"will not work on small RAMdisks of fast systems"},"dir":"CMDS","size":23802,"docs":true,"hassrc":true,"military":true,"help":{"cmd":"disktest -?","text":"Syntax   : disktest [\u003copt>]\nFunction : measure diskperformance\nOptions  : -?  show this text\n  V1.0, written by Stephan Paschedag"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"divide","desc":"splits a file into pieces of so many lines: `divide -l=\u003clines> \u003cinfile> [\u003coutfile>]' writes outfile.1, outfile.2 and so on","dir":"CMDS","size":4708,"star":true,"help":{"cmd":"divide -?","text":"DIVIDE Version 1.1\nCopyright (C) 1992\nFarside Systems\nUsage..: Divide file into pieces.\nSyntax.: divide -\u003coption> [ infile [outfile] ] -\u003coption>\nOptions:\n         -?         Help\n         -v         Verbose\n         -d         Delimit files\n         -l=num     Number of lines for each piece.\n                    Default is 1200\n         Each piece is of the form outfile.xx\n         If no outfile is specified infile is used."},"cat":"Files & directories","sub":"Split & join"},{"name":"djpeg","desc":"JPEG decompressor, jpeg-5a.  Decodes a JPEG to a PNM.  Its output ends each header line with LF where the netpbm here wants CR, so patch the three separators with `pbyte' to pipe it on; DOC/STATUS has the offsets.","needs":[{"path":"/dd/TEMP","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":55960,"docs":true,"howto":"Decompresses a JPEG: `djpeg -pnm image.jpg > out.ppm`. The disk has one to try, SRC/jpeglib/JPEG_5A/testimg.jpg. Its output will NOT pipe into netpbm unpatched -- djpeg writes LF at the end of a PNM header line and netpbm here wants CR. `pbyte out.ppm 2 0d` and the same at the two later separators fixes it; DOC/STATUS has the offsets.","help":{"cmd":"djpeg -?","text":"usage: djpeg [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -colors N      Reduce image to no more than N colors\n  -gif           Select GIF output format\n  -pnm           Select PBMPLUS (PPM/PGM) output format (default)\n  -quantize N    Same as -colors N\n  -targa         Select Targa output format\nSwitches for advanced users:\n  -blocksmooth   Apply cross-block smoothing\n  -grayscale     Force grayscale output\n  -nodither      Don't use dithering in quantization\n  -onepass       Use 1-pass quantization (fast, low quality)\n  -maxmemory N   Maximum memory to use (in kbytes)\n  -verbose  or  -debug   Emit debug output"},"cat":"Graphics & images","sub":"JPEG"},{"name":"djpeg.070","desc":"JPEG decompressor, a build for another processor.  It decodes a JPEG, including one the 68000 cjpeg wrote; its companion encoder is cjpeg.070","dir":"CMDS","size":79586,"help":{"cmd":"djpeg.070 -?","text":"usage: djpeg.070 [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -colors N      Reduce image to no more than N colors\n  -fast          Fast, low-quality processing\n  -grayscale     Force grayscale output\n  -scale M/N     Scale output image by fraction M/N, eg, 1/8\n  -bmp           Select BMP output format (Windows style)\n  -gif           Select GIF output format\n  -os2           Select BMP output format (OS/2 style)\n  -pnm           Select PBMPLUS (PPM/PGM) output format (default)\n  -targa         Select Targa output format\nSwitches for advanced users:\n  -dct int       Use integer DCT method (default)\n  -dct fast      Use fast integer DCT (less accurate)\n  -dct float     Use floating-point DCT method\n  -dither fs     Use F-S dithering (default)\n  -dither none   Don't use dithering in quantization\n  -dither ordered  Use ordered dither (medium speed, quality)\n  -map FILE      Map to colors used in named image file\n  -nosmooth      Don't use high-quality upsampling\n  -onepass       Use 1-pass quantization (fast, low quality)\n  -maxmemory N   Maximum memory to use (in kbytes)\n  -outfile name  Specify name for output file\n  -verbose  or  -debug   Emit debug output"},"cat":"Graphics & images","sub":"JPEG"},{"name":"dld","desc":"XModem download","dir":"CMDS/COMMS","size":4122,"star":true,"help":{"cmd":"dld -?","text":"dld version 1.4   (c) 1986 FHL\n\nSyntax: dld \u003cfile>\n\nFunction: download from \u003cfile> using XMODEM protocol"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"dload","desc":"load a data file into a data module: `dload \u003cfilename>'. Nothing to do with serial downloads -- `sbreak' and `break' are the serial-line examples here","dir":"CMDS","size":3058,"star":true,"help":{"cmd":"dload -?","text":"Syntax: dload \u003cfilename>\nFunction: loads datafile into datamodule"},"cat":"System & modules","sub":"Utilities"},{"name":"dm","desc":"Disk Master 1.4, a full-screen two-pane disk and directory browser with a file-information panel beside the listing.  It runs the commands on its bottom line through system(), so SHELL must name a shell that can carry them out: with SHELL=/dd/CMDS/sh it runs completely.  Its help file is SYS/dm.hlp","needs":[{"path":"/dd/sys/dm.hlp","missing":false,"dir":false,"bytes":5203}],"dir":"CMDS","size":35436,"star":true,"docs":true,"hassrc":true,"howto":"Disk Master 1.4, a full-screen disk browser. It runs the commands on its bottom line through system(), so SHELL must name a shell that can carry them out; with SHELL=/dd/CMDS/sh it runs completely, listing and file-information panel and all.","help":{"cmd":"dm -?","text":"Usage: DiskMaster [-c] [-d\u003cdir name>]\n       -c don't clear screen on exit\n       dir name is initial directory"},"cat":"Files & directories","sub":"List & navigate"},{"name":"dmake","desc":"dmake 3.70 - parallel make with its own makefile dialect","needs":[{"path":"/h0/SYS/startup.mk","missing":false,"dir":false,"bytes":2219}],"dir":"CMDS","size":92930,"star":true,"help":{"cmd":"dmake -?","text":"Usage:\ndmake [-AeEhiknpqrsStTuVx] [-v{dfimt}] [-P#] [-{f|K} file] [macro[*][+][:]=value ...] [target ...]"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"dotilde","desc":"the mailer's tilde-escape handler: it reads a message from standard input and acts on the `~' commands in it, answering `Unrecognized tilde command' and `Continuing...type \".\" or \u003cESC> to end message...'","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/UUCP","size":18634,"star":true,"hassrc":true,"help":{"cmd":"dotilde -?","text":"================= Tilde Help =================\n ~h, ~?       this help message\n ~m[c]        append message being replied to\n                preface each line with char c\n                default is T\n ~r[c] \u003cfile> append 'file', preface each line\n                with char c, uuencode binaries\n ~R[c] \u003cfile> same as ~r, 'file' NOT uuencoded\n ~v           edit message with vi\n ~e           edit message with UNDEFINED\n ~q, ~x       exit immediately\n ~!           fork a shell\n ~a           abort sending current message\n ~u \u003cfile>    uuencode 'file' before appending\n ==============================================\n\n\nContinuing...type \".\" or \u003cESC> to end message..."},"cat":"Communications","sub":"Mail"},{"name":"dpark","desc":"parks the disk head: `dpark [/device]' restores an RBF device's head to track 00, which is what you did before moving a drive","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":2418,"star":true,"hassrc":true,"help":{"cmd":"dpark -?","text":"Syntax:   dpark [/device]\nFunction: restore RBF device head to TRK00\nOptions:  none"},"cat":"System & modules","sub":"Devices & disks"},{"name":"draw","desc":"a character-graphics drawing program: it rules a canvas across the terminal and you move a cursor over it laying down characters -- hjkl to move, p to lift and drop the pen, backslash to choose the character; `?' shows the keys","src":"draw","origin":"hc disk","archive":"SOURCES/USENET/draw.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":53818,"hassrc":true,"help":{"cmd":"draw -?","text":"syntax: draw [\u003copts>] \u003cfile> [\u003copts>]\nFunction: drawing editor\nOptions:\n\t-l=\u003cnum>\tnumber of lines (default 132)\n\t-n\t\t\tuse numeric keypad movement keys\n\t-w=\u003cnum>\tmaximum line width (default 80)"},"cat":"Graphics & images","sub":"Drawing & display"},{"name":"drop","desc":"put back exactly what keep wrote.  It refuses to remove any file whose checksum has changed, so your saves and scores are safe from it by construction.","needs":[{"path":"/dd/SYS/kept","missing":true,"dir":false,"bytes":null},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":24958,"help":{"cmd":"drop -?","text":"keep 1.0 -- OS-9 freeware collection\n\nUsage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...\n       drop [-n] \u003cprogram>...\n       kept\n\n  keep   copy a program from this collection onto your own /dd,\n         together with the files DOC/DEPENDS says it reads.\n  drop   remove exactly what keep wrote, and NOTHING whose\n         contents have changed since.\n  kept   list what has been taken, and how much it came to.\n\n  -n     dry run: print what would happen, write nothing\n  -f     overwrite a file that is already there\n  -p \u003cd> put everything under \u003cd> instead of /dd\n  -q     leave out the notes about what was skipped\n  -s     take the SOURCE tree too, where there is one\n\nIf you mount this collection as /dd you do not need any of this;\nsee DOC/README-RUNNING."},"cat":"System & modules","sub":"Keeping and dropping"},{"name":"du","desc":"adds up what a directory tree holds -- bytes, kilobytes, sectors and the number of files -- one line per directory, with a total","src":"eff_du","origin":"EFFO forum","archive":"disk 4   SPRACHEN/C/DU","dir":"CMDS","size":4854,"star":true,"hassrc":true,"help":{"cmd":"du -?","text":"Syntax: du \u003cdirectory>\nFunction: displays information about disk usage\nOptions : -a displays just the final summary"},"cat":"Files & directories","sub":"Find & compare"},{"name":"dump","desc":"the hex dump: shows a file, or a module in memory (-m), as offsets, hex bytes and the characters beside them","dir":"CMDS","size":1712,"docs":true,"howto":"This is the hex dump on this disk. There is no `od'.","help":{"cmd":"dump -?","text":"Syntax: dump [\u003copts>] \u003cpath/module> [\u003copts>] [\u003cstarting byte>] [\u003copts>]\nFunction: formatted display of contents of a file/module\nOptions:\n     -c        don't compress duplicate lines\n     -x        path implies execution directory\n     -m        dump memory module"},"cat":"Text tools","sub":"Count & inspect"},{"name":"dvialw","desc":"DVI to Apple LaserWriter","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false,"dir":false,"bytes":29608},{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":64794,"howto":"Works, and so do the other nine dvi* drivers. The disk ships the MetaFont sources, not the ready-made bitmaps, so each driver says \"Font file [cmr10 [300 dpi]] could not be opened ... Proceeding with zero size characters\" once per font and writes a page with the right layout and no glyphs. FONTS/PK300 and PK144 hold a Makefile each; generate the bitmaps from the MetaFont sources in SYS/TEX/MFINPUTS. Output goes to \u003cdvifile>_alw beside the input, not to standard output.","help":{"cmd":"dvialw -?","text":"[TeX82 DVI Translator Version 2.10b]\n[PostScript [Apple LaserWriter laser printer]]\nUsage:  [opts] dvifiles\nOptions:\n   -a    cache font files\n   -b    print in backwards order\n   -c#   print # copies\n   -d#   set debug mode\n   -eVAR=val  act as if environment var VAR were set\n   -fsubfile  use indicated file for font substitutions\n   -l    turn off logging\n   -m#   Use indicated magnification\n   -o# -o#:#   output indicated page or range of pages\n   -o#:#:#  output range of pages, with indicated step\n   -p    don't preload fonts\n   -q    quiet mode\n   -s#    Characters larger than # pixels are not preloaded\n   -v     Dump and reload fonts for each page\n   -x#    specify left margin (e.g., -x1.2in)\n   -y#    specify top margin\nFor documentation on this program, try the command(s):\nmore /dd/sys/tex/docs/dvi.help\n\n\n/dd/CMDS/TEXCMDS/dvialw: FATAL--option():  -? is not a legal switch\nCurrent TeX page counters: [0]"},"cat":"Text tools","sub":"DVI drivers"},{"name":"dvidjp","desc":"DVI to HP DeskJet Plus","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false,"dir":false,"bytes":29608},{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":55778,"help":{"cmd":"dvidjp -?","text":"[TeX82 DVI Translator Version 2.10]\n[Hewlett-Packard Desk Jet plus (from LaserJet)\n\tWITH Data Compaction for faster tput indicated page or range of pages\n   -o#:#:#  output range of pages, with indicated step\n   -p    don't preload fonts\n   -q    quiet mode\n   -x#    specify left margin (e.g., -x1.2in)\n   -y#    specify top margin\nFor documentation on this program, try the command(s):\nmore /dd/sys/tex/docs/dvi.help\n\n\n/dd/CMDS/TEXCMDS/dvioki: FATAL--option():  -? is not a legal switch\nCurrent TeX page counters: [0]"},"cat":"Text tools","sub":"DVI drivers"},{"name":"dvips","desc":"DVI to PostScript, dvipsk 5.495b. It wants its header file, tex.pro, before it will write a page, so dvialw is the PostScript driver that runs here","needs":[{"path":"/DD/SYS/TEX/FONTS/TFM","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS/TFM","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/TFM","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/DVIPS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/DVIPS","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/DVIPS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/PK","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/PK","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/PK","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":93342,"howto":"DVI to PostScript. It wants a header file tex.pro -- point it at one, or use `dvialw', which writes PostScript too.","help":{"cmd":"dvips -?","text":"This is dvipsk 5.495b Copyright 1986, 1992 Radical Eye Software\n     Usage: dvips [options] filename[.dvi]\n a*  Conserve memory, not time      x # Override dvi magnification\n b # Page copies, for posters e.g.  y # Multiply by dvi magnification\n c # Uncollated copies              C # Collated copies\n d # Debugging                      D # Resolution\n e # Maxdrift value                 E*  Try to create EPSF\n f*  Run as filter                  F*  Send control-D at end\n h f Add header file                K*  Pull comments from inclusions\n i*  Separate file per section      M*  Don't make fonts\n k*  Print crop marks               N*  No structured comments\n l # Last page                      O c Set/change paper offset\n m*  Manual feed                    P s Load config.$s\n n # Maximum number of pages        R   Run securely\n o f Output file                    S # Max section size in pages\n p # First page                     T c Specify desired page size\n q*  Run quietly                    U*  Disable string param trick\n r*  Reverse order of pages         X # Horizontal resolution\n s*  Enclose output in save/restore Y # Vertical resolution\n t s Paper format                   Z*  Compress bitmap fonts\n     # = number   f = file   s = string  * = suffix, `0' to turn off\n     c = comma-separated dimension pair (e.g., 3.2in,-32.1cm)"},"cat":"Text tools","sub":"TeX"},{"name":"dvitos","desc":"DVI to Toshiba","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false,"dir":false,"bytes":29608},{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS/","missing":true,"dir":false,"bytes":null},{"path":"/DD/TEX/FONTS","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":55070,"help":{"cmd":"dvitos -?","text":"[TeX82 DVI Translator Version 2.10]\n[Toshiba P-1351 180h x 180v dpi dot matrix printer]\nUsage:  [opts] dvifiles\nOptions:\n   -a    cache font files\n   -b    print in backwards order\n   -c#   print # copies\n   -d#   set debug mode\n   -eVAR=val  act as if environment var VAR were set\n   -fsubfile  use indicated file for font substitutions\n   -l    turn off logging\n   -m#   Use indicated magnification\n   -o# -o#:#   output indicated page or range of pages\n   -o#:#:#  output range of pages, with indicated step\n   -p    don't preload fonts\n   -q    quiet mode\n   -r    use run-length encoding of output\n   -x#    specify left margin (e.g., -x1.2in)\n   -y#    specify top margin\nFor documentation on this program, try the command(s):\nmore /dd/sys/tex/docs/dvi.help\n\n\n/dd/CMDS/TEXCMDS/dvitos: FATAL--option():  -? is not a legal switch\nCurrent TeX page counters: [0]"},"cat":"Text tools","sub":"DVI drivers"},{"name":"dvitype","desc":"show what is inside a .dvi file, as text","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/BIB","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/BIB","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFBASES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFBASES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFINPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/POOLS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/POOLS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FORMATS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FORMATS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/TEX/SAMPLES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/INPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/SAMPLES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":73712,"howto":"`dvitype \u003cfile>.dvi \u003c /nil'. It asks five questions -- output level, starting page, page count, device resolution, magnification -- and takes the default for each at end of file. Redirect its input so a script does not wait on the questions.","help":{"note":"it takes the .dvi file and asks its five questions itself"},"cat":"Text tools","sub":"TeX"},{"name":"e","desc":"SEDT screen editor, a small fixed VT100 build. Reads SYS/sedt.keys, sedt.ruler0 and sedt.help, the same three sedt and new_e read.","dir":"CMDS","size":66786,"help":{"cmd":"e -?","text":"Syntax:\n  e -[\u003copts>] \u003cfile1> [\u003copts_file1>]  \u003cfile2> [\u003copts_file2>] ...\n  up to four files may be specified\n\nOptions:\n  -o=\u003cfilename>   specify another file as output\n  -n   \t      open the file read-only (no output file)\n  -l=\u003cnumber>     goto this line\n  or \u003cnumber>     goto this line"},"cat":"System & modules","sub":"Utilities"},{"name":"ed","desc":"GNU ed 0.2, the line editor.  It keeps its scratch file on /r0, a RAM disk, so mount one (`mount -r=256k /r0'); DOC/README-RUNNING has the details","dir":"CMDS","size":85810,"star":true,"docs":true,"hassrc":true,"howto":"Needs a /r0 RAM disk for its scratch file; `mount -r=256k /r0' provides one. Then `ed \u003cfile>', with ed's usual commands: 1,4p prints, s/a/b/ substitutes, w writes, q quits.","help":{"cmd":"ed --help","text":"Usage: ed [OPTION]... [FILE]\n\n  -G, --traditional          use a few backward compatible features\n  -p, --prompt=STRING        use STRING as an interactive prompt\n  -s, -, --quiet, --silent   suppress diagnostics\n      --help                 display this help\n      --version              output version information\n\nStart edit by reading in FILE if given.  Read output of shell command\nif FILE begins with a `!'."},"cat":"Editors","sub":"Line & stream"},{"name":"ediff","desc":"put `diff' output into plain English: `diff \u003cf1> \u003cf2> ! ediff', or `ediff \u003cfile' for a diff you already have.  A one-line change comes out as `-------- 1 line changed at 3 from: ... to: ...'.  `diff' does the comparing; this makes the answer readable","src":"eff_ediff","origin":"EFFO forum","archive":"disk 7   C/EDIFF","dir":"CMDS","size":18814,"hassrc":true,"help":{"cmd":"ediff -?","text":"Syntax   : 'ediff \u003cfile'  or  'diff \u003cf1> \u003cf2> ! ediff'\nFunction : print output of 'diff' in plain text\nOptions  : none"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"edir","desc":"list the event directory -- OS-9 events and their values","src":"effo_forum4","origin":"EFFO forum","archive":"disk 4 SPRACHEN/C/EVENTS","dir":"CMDS","size":2968,"star":true,"hassrc":true,"help":{"cmd":"edir -?","text":"Syntax: edir [\u003copts>]\nFunction: display event directory\nOptions:\n\t-e\tprint extendet event directory\n\t-u\tprint unformatted listing"},"cat":"System & modules","sub":"Processes & memory"},{"name":"EditLibr","desc":"Home Librarian: builds and maintains a catalogue -- add, edit and delete cards -- `EditLibr -editfile cat.libr'","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":197374,"hassrc":true,"howto":"Part of the HL10 librarian set. Wants an edit file as a parameter; `EditLibr' alone prints its syntax.","help":{"cmd":"EditLibr -?","text":"Syntax: EditLibr [opts]\nLibrarian Card Catalog file editor\nThis program is used to edit and maintain Card Catalog Files\nOptions:\n-editfile\tString Required The name of the file to edit\n-minpages\tInteger Optional The minimum # of pages to set aside when creating a new file\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"editor","desc":"a full-screen file picker that hands the file you choose to `umacs': a lettered list of the directory, `+' and `-' to page, `.' to change directory.  Run it bare; given a path on the command line it stops on an illegal instruction. `gshell' and `assembler' are the same menu in front of other programs.","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":22014,"hassrc":true,"howto":"Run it bare: a full-screen file picker for umacs. Given a file on the command line it stops on an illegal instruction. Control-C leaves the menu.","help":{"cmd":"editor -?","text":"Syntax: editor [\u003cpath>]\nFunction: a menue driven umacs shell\nOptions: none"},"cat":"Editors","sub":"Line & stream"},{"name":"elm","desc":"the Elm mail reader itself -- full-screen, menu-driven","needs":[{"path":"/dd/USR/LIB/ELM/aliases","missing":true,"dir":false,"bytes":null},{"path":"/dd/USR/LIB/ELM","missing":false,"dir":true,"bytes":null},{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/TMP/","missing":false,"dir":true,"bytes":null},{"path":"/dd/USR/LIB/ELM/elm.rc","missing":true,"dir":false,"bytes":null},{"path":"/dd/USR/LIB/ELM/elmrc_info","missing":true,"dir":false,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/hostname","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/ELM","size":307136,"star":true,"docs":true,"howto":"The full-screen mail reader. It opens on the folder that ships for this account, `~/SPOOL/MAIL/tester', showing one message. `readmsg 1' prints a message without opening the reader; `messages' counts the folder. Mail lives at /dd/SPOOL/MAIL/\u003cuser>, and SYS/login points MAIL at it.","help":{"cmd":"elm -h","text":"Possible Starting Arguments for ELM program:\n\n\targ\t\t\tMeaning\n\t -a \t\tArrow - use the arrow pointer regardless\n\t -c \t\tCheckalias - check the given aliases only\n\t -dn\t\tDebug - set debug level to 'n'\n\t -fx\t\tFolder - read folder 'x' rather than incoming mailbox\n\t -h \t\tHelp - give this list of options\n\t -ix\t\tInclude prepared file 'x' in edit buffer for send\n\t -k \t\tKeypad - enable HP 2622 terminal keyboard\n\t -K \t\tKeypad&softkeys - enable use of softkeys + \"-k\"\n\t -m \t\tMenu - Turn off menu, using more of the screen\n\t -sx\t\tSubject 'x' - for batch mailing\n\t -t \t\tTiTe - don't use termcap/terminfo ti/te entries.\n\t -V \t\tEnable sendmail voyeur mode.\n\t -v \t\tPrint out ELM version information.\n\t -z \t\tZero - don't enter ELM if no mail is pending"},"cat":"Communications","sub":"Mail"},{"name":"elvis","desc":"Elvis 1.7, a full vi and ex clone -- the best-documented of this disk's three vi editors and the one with the most options, its source in CMDS/archives and its manual under DOC/elvis. Needs TERM and TERMCAP. It also appears as view (read-only) and as REBUILT/vi.elvis, both of which run elvis. It wants a /dd/tmp for its scratch file, a path compiled in: without that directory it stops before drawing, with `Can't create temp file...'. This disk ships one, so it bites only on a /dd you copy it to; `makdir /dd/tmp', or `setenv EXINIT \"set directory=\u003ca dir you have>\"' before starting it, cures that. DOC/README-VI compares the three.","needs":[{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/tmp","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":111944,"docs":true,"hassrc":true,"howto":"A full vi/ex clone. Needs TERM and TERMCAP set -- `SYS/login' does both. `view' opens read-only, REBUILT/vi.elvis is the same program as vi, and all of them exec CMDS/elvis, so it must be present.","help":{"note":"it takes file names; an unknown flag is ignored with a note, and DOC/elvis has the manual"},"cat":"Editors","sub":"vi clones"},{"name":"elvis_input","desc":"elvis under its `input' personality -- it opens already in insert mode.  The name is load-bearing: elvis's wrapper picks its personality from the LAST LETTER of the name it was invoked by, so a name ending in another letter falls through to plain vi.  CMDS/input is a different program entirely","dir":"CMDS/REBUILT","size":15144,"help":{"note":"it takes file names; an unknown flag is ignored with a note, and DOC/elvis has the manual"},"cat":"Editors","sub":"vi clones"},{"name":"elvprsv","desc":"preserves elvis's buffer when elvis dies, for elvrec to recover; elvis runs it itself","needs":[{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/usr/preserve/Index","missing":true,"dir":false,"bytes":null},{"path":"/dd/usr/preserve","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":25822,"docs":true,"help":{"note":"elvis runs it itself when it dies; it takes no options"},"cat":"Editors","sub":"vi clones"},{"name":"elvrec","desc":"Recover an elvis buffer preserved when elvis died. Run with no arguments it lists what is recoverable, so silence means nothing was preserved. It reads /usr/preserve/Index, and OS-9 has no /usr -- a leading /name is a device, not a directory -- so it finds nothing here whatever is placed under /dd. expreserve is the half that saves. DOC/elvrec/elvrec.doc.","needs":[{"path":"/dd/usr/preserve/Index","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS","size":24156,"docs":true,"howto":"Bare, it lists what elvis preserved; nothing listed means nothing was preserved.","help":{"note":"it takes the name of a preserved file; run bare it lists what is preserved"},"cat":"Editors","sub":"vi clones"},{"name":"em","desc":"MicroEMACS 3.8b, a screen editor with Emacs keys","needs":[{"path":"/dd/sys/","missing":false,"dir":true,"bytes":null},{"path":"/dd/lib/","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/emacsrc","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":79590,"howto":"A screen editor. It stops with \"Environment variable TERM not defined!\" unless TERM is set -- SYS/login sets it, so run it from a login shell rather than bare.","help":{"cmd":"em -?","text":"Syntax: em [\u003copts>] [\u003cfilenames> [\u003copts>]]\nFunction: MicroEMACS screen editor\nOptions:\n     -v        view file\n     -e        edit file\n     -sSTRING  initial search string\n     -gLINE    initial goto\n     -r        restrictive use\n     -kSTRING  crypt key\n     @FILE     process different startup file (default is\n               '.emacsrc' in home directory"},"cat":"Editors","sub":"emacs family"},{"name":"emacs","desc":"MicroEMACS 4.00, a full-screen editor with Emacs keys and a macro language; its macros and help are in USR/LIB/EMACS.","needs":[{"path":"/h0/memacs400/cmd/","missing":true,"dir":false,"bytes":null},{"path":"/h0/memacs400/","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":144910,"star":true,"docs":true,"howto":"Full-screen editor, MicroEMACS keys. Control-X control-C quits. Its macros and help are in USR/LIB/EMACS.","help":{"note":"it takes file names and no help flag; its help lives inside, in the macros and help files under USR/LIB/EMACS"},"cat":"Editors","sub":"emacs family"},{"name":"emacs.mm1","desc":"MicroEMACS 4.00 built for the MM/1 -- the same editor as `emacs'","needs":[{"path":"/h0/memacs400/cmd/","missing":true,"dir":false,"bytes":null},{"path":"/h0/memacs400/","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":131362,"star":true,"howto":"The MM/1 build of `emacs'; the same keys, control-X control-C quits.","help":{"note":"it takes file names and no help flag; its help lives inside, in the macros and help files under USR/LIB/EMACS"},"cat":"Editors","sub":"emacs family"},{"name":"enable","desc":"re-enable a UUCP device","src":"bnu_uucp","origin":"Microware OS-9 archive","archive":"uucp.lzh BNU/UUCP/SRC","needs":[{"path":"/DD/SYS/ttylist","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/UUCP","size":4378,"star":true,"hassrc":true,"help":{"cmd":"enable -?","text":"Syntax: enable [\u003copts>] \u003cport> [\u003copts>]\nFunction: Turn ON MTSMon on \u003cport>\nOptions:\n  -p  no prompt till signal"},"cat":"Communications","sub":"Mail"},{"name":"england","desc":"a year of random weather, day by day, for a tabletop game: the mid-Atlantic climate profile on the Gregorian calendar. `england 2' does two years.  Six builds of one program differ only in climate and calendar: england, florida (Gulf coast), georgia (south Atlantic), minnesota (north Atlantic), japan (north Pacific, Japanese calendar) and shire (mid-Atlantic, Middle-earth calendar)","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"howto":"One of six weather simulators that differ only in climate and calendar: england, florida, georgia, minnesota, japan (Japanese calendar) and shire (Middle-earth). Each prints a year of weather, a line a day, with a summary at each month's end; a number says how many years.","help":{"note":"it takes a number of years and nothing else"},"cat":"Amusements","sub":"Simulated weather"},{"name":"env","desc":"GNU env: runs a command with variables added to its environment, `env FOO=bar printenv'","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/errmsg.short","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":9674,"star":true,"help":{"cmd":"env --help","text":"Usage: env [OPTION]... [-] [NAME=VALUE]... [COMMAND [ARG]...]\n\n  -u, --unset=NAME           remove variable from the environment\n  -i, --ignore-environment   start with an empty environment\n      --help                 display this help and exit\n      --version              output version information and exit\n\nA mere - implies -i.  If no COMMAND, print the resulting environment."},"cat":"Shells","sub":"Shell utilities"},{"name":"eo","desc":"runs a command on every line of a file -- an xargs: `eo \u003cfile> \u003ccommand> @' runs the command once per line with `@' replaced by the line; -p takes the lines from a pipe, -q runs quietly, -e stops at the first error. It shells out through SHELL, which SYS/login sets","src":"eff_eo","origin":"EFFO forum","archive":"disk 11  SOFTWARE/C/EO","needs":[{"path":"/h0/tmp/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":3952,"star":true,"docs":true,"hassrc":true,"howto":"Runs a command on every line of a file, with `@' standing for the line: `eo \u003cfile> \u003ccommand> @'. It shells out, so it needs SHELL set to a shell that takes a command line as one argument -- SYS/login sets `SHELL=/dd/CMDS/ksh' and that is what makes it work. Without it, `can't execute /dd/bash'. `-p' takes the lines from a pipe instead of a file.","help":{"cmd":"eo -?","text":"eo ver 1.8 (c) by marc balmer, basel\n\neo [-options] [file] [OS9 command]\n\nexecute a command on every line in [file]\na '@' character is replaced by the line in\n[file]. options are:\n\tp\ttake the input lines from a\n      pipe rather than from a file\n      (e.g. 'dirr-u ! eo -p list @')\n\tq   don't display commands while\n\t\texecuting, e.g.:\n\n\t\teo [file] -q copy @ /h0/tmp/@\n\n\t\twould execute the copy command\n\t\ton every filename in \u003cfile>\n\t\twithout displaying the command\n\t\teverytime it is executed\n\te\tstop on error\n\nyou can easily generate the [file] file by typing\n'dir -u>[file]'"},"cat":"Text tools","sub":"Transform & filter"},{"name":"ephem","desc":"an astronomical ephemeris: a live panel of the sun, moon and planets -- right ascension, declination, azimuth, altitude and more -- for a site and time, from the configuration and star database in SYS. RETURN passes the opening page, control-D quits","needs":[{"path":"/dd/sys/ephem.cfg","missing":false,"dir":false,"bytes":151},{"path":"/dd/sys/ephem.db","missing":false,"dir":false,"bytes":2395},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":120794,"star":true,"docs":true,"howto":"An astronomical ephemeris: `ephem -c /dd/SYS/ephem.cfg -d /dd/SYS/ephem.db'. RETURN passes the opening page; any key stops the loop; ? is help; control-D quits.","help":{"cmd":"ephem -?","text":"usage: [-c \u003cconfigfile>] [-d \u003cdatabase>] [field=value ...]\n\nAdapted to OS-9/68k by Stephan Paschedag"},"cat":"Time & calendar","sub":"Astronomy"},{"name":"ephem881","desc":"ephem built for a 68881 floating-point coprocessor: the same panel, and with hardware floating point the whole table fills in at once","needs":[{"path":"/dd/sys/ephem.cfg","missing":false,"dir":false,"bytes":151},{"path":"/dd/sys/ephem.db","missing":false,"dir":false,"bytes":2395},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":128830,"star":true,"howto":"The same as ephem, built for a 68881 coprocessor. Control-D quits.","help":{"cmd":"ephem881 -?","text":"usage: [-c \u003cconfigfile>] [-d \u003cdatabase>] [field=value ...]\n\nAdapted to OS-9/68k by Stephan Paschedag"},"cat":"Time & calendar","sub":"Astronomy"},{"name":"epson","desc":"spline output driver for an Epson printer","src":"forum15","origin":"Microware OS-9 archive","archive":"forum15.lzh","dir":"CMDS","size":2444,"star":true,"hassrc":true,"help":{"cmd":"epson -?","text":"usage: epson [\u003copts>]\n\tc\u003cint>\tnumber of characters per line\n\t\t10,12,17 CPI\n\tg\tgerman character set\n\tu\tascii character set\n\tp\tformfeed\n\tn\tnormal (ascii + c17)\n(C) oettle + reichler Datentechnik GmbH, Paul Farquhar 1989"},"cat":"Printing","sub":"Printers"},{"name":"eset","desc":"set an OS-9 event to a value -- eset \u003cevent> \u003cnum>","dir":"CMDS","size":2286,"star":true,"help":{"cmd":"eset -?","text":"Syntax: eset \u003cevent> \u003cnum> [\u003copts>]\nFunction: set event to a new value\nOptions:\n\t-a\tstart all waiting processes"},"cat":"System & modules","sub":"Processes & memory"},{"name":"etags","desc":"generate an emacs TAGS file","src":"eff_etags","origin":"EFFO forum","archive":"disk 21  FORUM21/software/etags","info":{"purpose":"Tag file generator","status":"final","language":"C","author":"GNU (part of GNU Emacs)","availability":"Public"},"dir":"CMDS","size":26806,"docs":true,"hassrc":true,"help":{"cmd":"etags -?","text":"Syntax: etags { [\u003copts>] \u003cpath> }\nFunction: GNU tags file maker.\nCreates tag table files for editors like vi or emacs.\nEmulates etags with -e option set.\nHandles LaTex (.tex, .aux, .bbl), lisp (.l, .el, .lisp, .cl, .clisp),\nscheme (.scm, .sm, .scheme, .t, .sch, .SM, .SCM), C (.c, .h, .y)\nand fortran (all other extensions) source files.\nOptions:\n    -a         append to tag file\n    -t
