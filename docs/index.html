    record typedefs in C code as tags\n    -u         update tag file, for ctags style tag files only\n    -w         suppress warnings\n    -v         create vgrind style index output\n    -x         create cxref style output\n    -e         etags style output for GNU Emacs\n    -f=\u003cpath>  alternate tag file name\n    -B         set search char to '?', create ctags style output\n    -F         set search char to '/', create ctags style output"},"cat":"Developer tools","sub":"Source navigation"},{"name":"eunlink","desc":"unlink an OS-9 event by name -- `eunlink \u003cevent>'. `edir' lists the events and `eset' sets one","src":"effo_forum4","origin":"EFFO forum","archive":"disk 4 SPRACHEN/C/EVENTS","dir":"CMDS","size":2310,"star":true,"hassrc":true,"help":{"cmd":"eunlink -?","text":"Syntax: eunlink {\u003cevent>}\nFunction: unlink an event\nOptions: none"},"cat":"System & modules","sub":"Processes & memory"},{"name":"every","desc":"run a command at intervals","dir":"CMDS","size":2452,"star":true,"help":{"cmd":"every -?","text":"Syntax: every \u003ctime> \u003cprogname> [\u003cprogopts>]\nFunction: repeat program every \u003ctime> seconds"},"cat":"System & modules","sub":"Scheduling"},{"name":"exist","desc":"test file existence","dir":"CMDS","size":2702,"star":true,"help":{"cmd":"exist -?","text":"EXIST    Version UTIL 2.40 by DESIGNA VLT 24.11.97\nAufruf: exist [options] \u003cFile, Dir>\nno param Exit-Code 0, if file DOES exist\n  -n     Exit-Code 0, if file does NOT exist\n\n  -d     \u003cFile> is NOT a file, BUT a directory\n\n  -?     This helptable\n\nRueckgabewerte:\n     0   Kein Fehler\n    17   Falsches Argument\n    18   Kein Argument angegeben\n    20   Kein Dateiname angegeben\n    21   Datei nicht gefunden"},"cat":"Shells","sub":"Shell helpers"},{"name":"expand","desc":"GNU expand: turns tabs into spaces, at stops eight columns apart or as -t says","dir":"CMDS","size":27060,"help":{"cmd":"expand -?","text":"expand: unrecognized option `-?'\nUsage: expand [-tab1[,tab2[,...]]] [-t tab1[,tab2[,...]]] [-i]\n       [+tabs=tab1[,tab2[,...]]] [+initial] [file...]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"expire","desc":"delete news articles past their expiry date","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/active","missing":false,"dir":false,"bytes":233},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/UUCP","size":15472,"star":true,"hassrc":true,"help":{"cmd":"expire -?","text":"/dd/CMDS/UUCP/expire: illegal option -- ?\n expire        news article expire utility\n\n     -t         test (don't actually delete articles)\n     -x\u003clevel>  debug, default is 0 (OFF)\n     -n\u003cgroup>  expire only given group\n     -e\u003cdays>   expire articles older than specified number of days\n\n     With no arguments, expires all articles older than 14 days in\n     all newsgroups.\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"News"},{"name":"expr","desc":"GNU expr: evaluates an expression for a script -- arithmetic, comparisons, string length and matching","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/errmsg.short","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":34690,"star":true,"docs":true,"help":{"note":"it takes an expression and nothing else"},"cat":"Shells","sub":"Shell utilities"},{"name":"expreserve","desc":"vi's crash-recovery helper: preserves an edit buffer when the editor dies.  Like ksh it reads the terminal asking for more bytes than you type (388), so it depends on the same emulator behaviour -- see DOC/README-KSH","needs":[{"path":"/dd/MAIL/mail_","missing":false,"dir":false,"bytes":0},{"path":"/dd/PRESERVE/Exaa","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":4128,"star":true,"howto":"Saves a vi buffer when the editor or the line dies; vi runs it for you rather than you running it.","help":{"note":"vi runs it itself when it dies; it takes no options and wants a /r0 to write to"},"cat":"System & modules","sub":"Utilities"},{"name":"exrecover","desc":"recover a vi buffer that expreserve saved","needs":[{"path":"/dd/PRESERVE","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":6776,"star":true,"howto":"Recovers what expreserve saved. Again, vi's helper rather than a command you start.","help":{"note":"it takes a user name and a file name and nothing else"},"cat":"System & modules","sub":"Utilities"},{"name":"fastcc","desc":"a faster front end for cc","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/C/CC","needs":[{"path":"/h0/lib","missing":false,"dir":true,"bytes":null},{"path":"/h0/defs","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":7802,"star":true,"hassrc":true,"help":{"cmd":"fastcc -?","text":"fastcc: \u003copts> \u003cfiles> \u003copts>\nOptions:\n\t-a\t\tCompile to assembler files\n\t-bp\t\tshow commands before executing\n\t-bg\t\tcreate ghost module on output\n\t-c\t\tleave comments in assember-files\n\t-d\u003cname>\tdefine for cpp\n\t-e\u003c=num>\tedition number for output\n\t-u\u003cname>\tundefine for cpp\n\t-f\u003c=path>\toutput path (exec-dir)\n\t-fd\u003c=path>\toutpath (data-dir)\n\t-g\t\tgenerate debugging info\n\t-i\t\tuse clib-trap-library\n\t-j\t\tdont generate a jump-table\n\t-l\u003c=name>\tadditional library to search\n\t-n\u003c=name>\toutput module name\n\t-r\u003c=dir>\tcompile/assemble to rel. files\n\t-o\t\tdon't run o68\n\t-p\t\tpipe cpp-output into the compiler\n\t-q\t\tquiet mode\n\t-s\t\tomit stack-checking\n\t-t\u003c=dir>\tdir for temp. files\n\t-x\t\tuse math-trap-lib\n\t-v\u003c=dir>\tsearch-dir for cpp\n\t-m\u003c=n>\t\tadditional memory for stack in output module"},"cat":"System & modules","sub":"Utilities"},{"name":"fastmail","desc":"send a file as mail without opening the reader.  It needs a delivery agent to deliver it","needs":[{"path":"/dd/TMP/fastmail.","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/hostname","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/ELM","size":14998,"star":true,"help":{"cmd":"fastmail -?","text":"/dd/CMDS/ELM/fastmail: illegal option -- ?\nUsage: fastmail {args} [ filename | - ] address(es)\n   where {args} can be;\n\t-b bcc-list\n\t-c cc-list\n\t-d\n\t-C comments\n\t-f from-name\n\t-F from-addr\n\t-i msg-id\n\t-r reply-to\n\t-R references\n\t-s subject"},"cat":"Communications","sub":"Mail"},{"name":"fc","desc":"split a big file in two, to carry it on 360k disks -- the cut is at exactly 350,000 bytes: its own Function line says \"Takes first 350,000 bytes of a file or stdin and puts in one file and puts remaining bytes\" in the other","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":2678,"star":true,"hassrc":true,"help":{"cmd":"fc -?","text":"Syntax:   fc [\u003cfile>]\nFunction: Takes first 350,000 bytes of a file or stdin\n          and puts in one file and puts remaining bytes\n          in another file for easily putting large files\n          on 360k media.\nOptions:  none"},"cat":"Files & directories","sub":"Split & join"},{"name":"fcomp","desc":"compares two text files line by line and names the lines inserted, deleted or changed between them","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":5838,"star":true,"hassrc":true,"help":{"cmd":"fcomp -?","text":"Syntax: fcomp \u003cfile_1> \u003cfile_2>\nFunction: compares two text files\nOptions:\n    -b[=]\u003cn>[k]  use \u003cn> as minimum memory request chunk (16)"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"ff","desc":"find files by name -- `ff \u003cname>'.  It builds the command `dir -ausr ! grep \u003cname>' and hands it to Microware's `shell'. `find' does the same job","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2146,"star":true,"hassrc":true,"help":{"note":"it takes the name to look for and nothing else"},"cat":"Files & directories","sub":"Find & compare"},{"name":"fgrep","desc":"searches files for fixed strings rather than patterns, with context lines, counts, line numbers and file lists on request","src":"-","origin":"EFFO forum","archive":"disk 14 SOFTWARE/C/FGREP -- no source in the archive","info":{"purpose":"very fast grep utility","status":"final","hardware":"none","language":"C","author":"from FREE SOFTWARE FOUNDATION (adaption to OS-9/68k : Stephan Paschedag)","availability":"public","copyright":"see file COPYING !"},"dir":"CMDS","size":19960,"star":true,"docs":true,"help":{"cmd":"fgrep -?","text":"Syntax   : fgrep [-[[AB] ]\u003cnum>] [-[CVchilnsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]\nFunction : search for expressions in files\nOptions  :\n   -\u003cnum>    print \u003cnum> lines of context on each side of every match\n   -A \u003cnum>  print \u003cnum> lines of context after every maching line\n   -B \u003cnum>  print \u003cnum> lines of context before every maching line\n   -C        print 2 lines of context on each side of every match\n   -V        print version number on stderr\n   -b        print every match preceded by its byte offset\n   -c        print a total count of matching lines only\n   -e \u003cexpr> searach for \u003cexpr> (useful if \u003cexpr> starts with a '-')\n   -f \u003cexpr> search for \u003cexpr> containes in \u003cfile>\n   -h        don't display filenames on matches\n   -i        ignore case difference when comparing strings\n   -l        list files containing matches only\n   -n        print each match preceded by its line number\n   -s        run silently producing no output except error messages\n   -v        print only lines that contain no matches for the \u003cexpr>\n   -w        print only lines where the match is a complete word\n   -x        print only lines where the match is a whole line\n   -y        ignore case difference when comparing strings\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Text tools","sub":"Search & match"},{"name":"fibo","desc":"the Fibonacci benchmark: a Fibonacci number by the plain recursive definition, ten times over -- a test of the cost of a function call","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":1590,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it reports the result"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"field","desc":"select whitespace-separated fields from standard input by number, in the order asked for and tab-separated on output: `field 2 4 1' prints the second, fourth and first word of each line. `-i=c' names another input separator.","dir":"CMDS","size":6074,"star":true,"docs":true,"help":{"cmd":"field -?","text":"field v1.0 (c) S.R.Bourne, M.C.Gregorie, 1994\n\nSyntax  : field [\u003copts>] \u003cfields...> [\u003copts>]\nFunction: select fields or columns from lines in standard input\nOptions :\n     -c           check that all required fields are in each line\n     -d           debug mode\n     -i=c         input field separator. Defaults to whitespace\n     -o=c         output field separator. Defaults to tab\n     -s           suppress lines not containing all required fields"},"cat":"Text tools","sub":"Transform & filter"},{"name":"file","desc":"identifies file types from the magic table in SYS/magic -- OS-9 modules, text, images with their size and colours, archives -- one line per file named","needs":[{"path":"/dd/SYS/magic","missing":false,"dir":false,"bytes":9539}],"dir":"CMDS","size":43906,"howto":"Names real formats now that SYS/magic is here: `file /dd/DEMO/gulls.gif' reports the GIF version, size and colour count.","help":{"cmd":"file -?","text":"Syntax:   file [\u003copts>] {\u003cfile>}\nFunction: identify file types\nOptions:\n   -f[=]path  read files from path\n   -h[elp]    display verbose help information\n   -m[=]file  use file for magic file\n   -r         recursively descend directories\n   -x         execution directory relative\n   -z         read files from stdin\n   -z[=]path  read files from path (same as -f)\n\nNote: the -r and -x options are mutually exclusive, and the last\n      one seen on the command line will turn the other off.\n      Also, the options -f, -help, -m, and -z (since the may be\n      longer than a single character, must be the final option in\n      a group if grouped with other options. (ie -rz is OK, -zr is\n      not)\n\nThe environment variable MAGIC_FILE (if set) changes\nthe default magic file (from /dd/SYS/magic).\n\nThis program is Copyright (c) 1995 by Scott McGee but may be\ndistributed at no cost in its original unaltered form. This program\ncomes with ABSOLUTELY NO WARRANTY!"},"cat":"Text tools","sub":"Count & inspect"},{"name":"fileserv","desc":"serve files to remote sites on request","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":21202,"star":true,"hassrc":true,"help":{"note":"it takes no options and prints nothing; it answers the requests waiting in the spool"},"cat":"Communications","sub":"File transfer"},{"name":"fillup","desc":"fills a file up to a given length with a constant byte: `fillup -n=64 -i=65 f' pads f to 64 bytes with `A' and says `24 bytes (value=65) appended'. The length option is -n=, not -l=","src":"fillup","origin":"EFFO forum","archive":"disk 23 f23b/SOFTWARE/FILLUP (L. Zeller, 1992)","info":{"version":"Ed #1","purpose":"fills up file with byte pattern","status":"final","language":"C","author":"Lukas Zeller","availability":"Public, EFFO Forum 23","copyright":"(c) 1992 by L.Zeller"},"dir":"CMDS","size":3394,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"fillup -?","text":"Syntax:   fillup [\u003coptions>] \u003cfile>\nFunction: fill up file with constant data\nOptions:  -?        : displays this text\n          -n=\u003cnum>  : append data until file is \u003cnum> bytes long\n          -i=\u003cdata> : fill data byte, default=255\n(c) 1992 by L.Zeller"},"cat":"Text tools","sub":"Transform & filter"},{"name":"filter","desc":"sort incoming mail into folders by rule.  A PIPE stage: its own usage line begins `| filter'","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/hostname","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/domain","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/ELM","size":60436,"help":{"cmd":"filter -?","text":"/dd/CMDS/ELM/filter: illegal option -- ?\nUsage: | filter [-nrvlq] [-f rules] [-o file]\n\tor: filter [-c] -[s|S]"},"cat":"Communications","sub":"Mail"},{"name":"find","desc":"find 1.1.5 -- search a directory tree, with its own syntax: `-n=\u003cname>' matches and `-o' prints what it found. (`find \u003cdir> -name x -print' answers `only one parameter allowed'.)  The manual in DOC/find describes a different find.","src":"eff_effind","origin":"EFFO forum","archive":"disk 5   SPRACHEN/C/FIND   [also built from hc_utils]","dir":"CMDS","size":6826,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"find -?","text":"Syntax: find {\u003copts>} [\u003cpath>]\nFunction: finds files in Filesystem\nOptions :\n\t-o              output the found pathnames\n\t-~              only non matching files\n\t-n=[-]\u003cstring>  files with name \u003cstring> (wildcards allowed)\n\t-p=\u003cnum>        files with permissions \u003cnum> (\u003cnum> is octal)\n\t-u=[-]\u003cnum>     files which belong to user \u003cnum>\n\t-g=[-]\u003cnum>     files which belong to group \u003cnum>\n\t-s=[+|-]\u003cnum>   files are \u003cnum> blocks long (256 Byte/Block)\n\t-e=\u003cstring>     execute \u003cstring> on matching files\n\t-a=\u003cstring>     ask for executing \u003cstring> on matching files\n\t-l=\u003cnum>        recursive search to depth \u003cnum>"},"cat":"Files & directories","sub":"Find & compare"},{"name":"finger","desc":"ask another machine who is logged in","dir":"CMDS/NETWORK","size":5872,"star":true,"howto":"Asks another machine who is logged in: `finger \u003cuserid>'. Needs a network.","help":{"cmd":"finger -?","text":"Syntax: finger \u003cuserid>\nFunction: display real world info on user.\nOptions: none"},"cat":"Communications","sub":"TCP/IP"},{"name":"fitstopnm","desc":"FITS, the astronomers' image format, to PNM; -image picks a plane, -min and -max set the scaling","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":99550,"hassrc":true,"help":{"cmd":"fitstopnm -?","text":"usage:  fitstopnm [-image N] [-noraw] [-scanmax] [-printmax] [-min f] [-max f] [FITSfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"fixtext","desc":"repair the line endings of a received text batch","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","dir":"CMDS/UUCP","size":7346,"star":true,"hassrc":true,"help":{"cmd":"fixtext -?","text":"fixtext: A text file filter.  Removes escape sequences, expand tabs and change\n         end-of-line terminators to OS-9 ones.\n\nUsage:  fixtext [infile] [outfile]\n          if infile is a '-', the standard input is read\n\nExamples:\n\nfixtext                  -read standard in, write to standard out\nfixtext - outfile        -read standard in, write to outfile\nfixtext infile           -read infile, write to standard out\nfixtext infile outfile   -read infile, write to outfile\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"File transfer"},{"name":"fixyear","desc":"Y2K: correct a date the clock got wrong","dir":"CMDS","size":15008,"help":{"cmd":"fixyear -?","text":"Usage: fixyear [-opt] \u003cfile|dir> \u003cdir|file> [-opt]\n       Fix modification year if less than 1970\n\nOptions:\n   -l   log action to stdout\n   -q   don't quit on error\n   -z   read file names from stdin\n   -z=\u003cfile>  read file names from \u003cfile>"},"cat":"System & modules","sub":"Utilities"},{"name":"fiz","desc":"repairs a damaged zoo archive by walking its directory entries","dir":"CMDS","size":11666,"star":true,"docs":true,"help":{"note":"it takes the archive to repair and nothing else"},"cat":"Archives & compression","sub":"zoo"},{"name":"fkeys","desc":"define terminal function keys","src":"eff_fkeys","origin":"EFFO forum","archive":"disk 7   C/FKEYS","dir":"CMDS","size":17924,"docs":true,"hassrc":true,"help":{"cmd":"fkeys -?","text":"Syntax: fkeys [\u003cpath>]\nFunction:set User-Defined Keys on VT220 Terminals\nOptions: none"},"cat":"Communications","sub":"Terminal & session"},{"name":"flex","desc":"flex, the fast lexical analyser generator: turns a rules file into a C scanner, lex.yy.c. DOC/flex/README-FLEX has what to know first","src":"flex","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C/FLEX -- flex 2.3, Vern Paxson","needs":[{"path":"/dd/lib/flex.skel","missing":false,"dir":false,"bytes":19889},{"path":"/dd/tmp/flexXXXXXX","missing":true,"dir":false,"bytes":null}],"info":{"version":"2.3","purpose":"lexical analyzer generator","status":"final","language":"C,lex,yacc","author":"Vern Paxson","availability":"public","copyright":"see GNU copyright"},"dir":"CMDS","size":89186,"docs":true,"hassrc":true,"help":{"cmd":"flex -?","text":"Syntax   : flex [-bcdfinpstvFILT8 -C[efmF] -Sskeleton] [filename ...]\nFunction : fast lexical analyzer generator\nOptions  :\n   -b       generate backtracking info to 'lex.backtrack'\n   -C[efmF] controls the degree of table compression\n   -d       makes the generated scanner run in debug mode\n   -f       use full table (a faster scanner is generated)\n   -F       use fast scanner table representation\n   -i       generates a case-sensitve scanner\n   -I       generates an interactive scanner\n   -L       do not generate '#line' directives\n   -p       generate performance report to stderr\n   -s       causes the default rule to be suppressed\n   -S\u003cfile> override the default skeleton file by \u003cfile>\n   -t       write generated scanner to stdout\n   -T       run flex in trace mode\n   -v       write summary of statistics about the generated scanner to stderr\n   -8       generate a 8-bit scanner\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"flink","desc":"makes a second directory entry for a file under a name you give -- an RBF hard link. RBF has no true hard links, and removing such an entry can leave the original pointing at the wrong place, so do not run it on a disk you care about","src":"eff_flink","origin":"EFFO forum","archive":"disk 6   PROGRAMME/C/FLINK","dir":"CMDS","size":5318,"star":true,"hassrc":true,"howto":"DO NOT run it on a shipped module. It makes a directory entry aliasing the file's FD in the CURRENT directory, RBF has no hard links, and removing the entry leaves the file pointing at a DIRECTORY -- `cat' then answers `is a directory' for everything.","help":{"cmd":"flink -?","text":"flink: link to file     usage: flink [ -? | filename { filename } ]\n                        option: -? displays this message"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"float","desc":"a floating-point speed test: an arithmetic loop run seven thousand times","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":1828,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it reports when the loops are done"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"florida","desc":"the weather program on its Gulf-coast profile; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"howto":"Prints a year of Gulf-coast weather, a line a day; `florida | head -n 37' shows January. See england.","help":{"note":"it takes a number of years and nothing else"},"cat":"Amusements","sub":"Simulated weather"},{"name":"fmt","desc":"refills ragged text into even lines, 72 columns wide or as given by -\u003cwidth>; the fmt that came with elvis","needs":[{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS","size":24328,"docs":true,"help":{"cmd":"fmt -?","text":"usage: fmt [-width] [files]..."},"cat":"Text tools","sub":"Format & typeset"},{"name":"fontgen","desc":"generate a font for the Gepard display","src":"forum3","origin":"Microware OS-9 archive","archive":"forum3.lzh","dir":"CMDS","size":10606,"hassrc":true,"howto":"Generates a character font for the Gepard display -- it prints the assembler source of an 80-column font on stdout.","help":{"note":"it reads its bitmap on standard input and takes no options"},"cat":"System & modules","sub":"Utilities"},{"name":"for","desc":"the RTF/68K Fortran driver: it forks Microware's shell to run each compiler pass. At bash `for' is also the loop keyword, so ask for it by path there. Calling `rtf' directly needs no shell at all; see DOC/README-FORTRAN","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- RTF/68K driver","dir":"CMDS","size":3912,"hassrc":true,"help":{"note":"`load /dd/CMDS/os9lib' first; then it takes the source file and nothing else"},"cat":"Compilers & build","sub":"Fortran"},{"name":"forth","desc":"TILE Forth, a Forth-83 in C. A source file named on the command line is loaded first -- `forth fibonacci.tst' in lib/tile/TST -- and then it prompts silently: `2 3 + . cr' prints 5, a colon definition makes a new word, words lists the vocabulary, bye leaves. lib/tile holds its source library and TST twenty-two test programs; sixteen manuals in DOC/forth","src":"pd7","origin":"Microware OS-9 archive","archive":"pd7.lzh","needs":[{"path":"/dd/lib/tile","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":36050,"star":true,"docs":true,"hassrc":true,"howto":"Type `2 3 + . cr' and it answers 5; `: squares 11 1 do i dup * . loop cr ;' then `squares' prints them; `words' lists its vocabulary; `bye' leaves. A source file is a command-line argument -- `forth fibonacci.tst' in lib/tile/TST loads it and gives you the prompt -- because `include' is defined in the library, not the kernel. The library and its twenty-two programs are in lib/tile and lib/tile/TST.","help":{"cmd":"forth -?","text":"TILE Forth version 2.48, Copyright (c) 1989, by Mikael Patel\nSyntax   : forth [\u003copts>] [\u003cfile>] [\u003copts>]\nFunction : forth interpreter\nOptions  :\n     -a \u003cargument>       access arguments\n     -s \u003cstart-symbol>   define where to start\nAdapted to OS-9/68k by Stephan Paschedag"},"cat":"Languages","sub":"Interpreters"},{"name":"fortune","desc":"print a random quotation","src":"fortune","origin":"usenet archive","archive":"fortune.ar","needs":[{"path":"/dd/GAMES/FORTUNE/fortunes.dat","missing":false,"dir":false,"bytes":192811}],"dir":"CMDS","size":17944,"hassrc":true,"help":{"cmd":"fortune -","text":"usage:  fortune [ - ] [ -wsloa ] [ file ]\n        - - give this summary of usage\n        w - have program wait after printing message in order\n            to give time to read\n        s - short fortune only\n        l - long fortune only\n        o - offensive fortunes only\n        a - any fortune\n                Mail suggested fortunes to \"fortune\""},"cat":"Text tools","sub":"Fortune & sayings"},{"name":"frm","desc":"list who your mail is from, one line each.  On this port it answers `tester has no mail' for a folder that `messages' counts and `readmsg' prints, so use those two","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/hostname","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/domain","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/ELM","size":32300,"star":true,"howto":"Lists who your mail is from, one line each. Reads $MAIL, which SYS/login sets.","help":{"cmd":"frm -h","text":"frm -- list from and subject lines of messages in mailbox or folder\n\nUsage: frm [-n] [-v] [-s {new|old|read}] [filename | username] ...\n\noption summary:\n-h\tprint this help message.\n-n\tdisplay the message number of each message printed.\n-Q\tvery quiet -- no output is produced.  This option allows shell\n\tscripts to check frm's return status without having output.\n-q\tquiet -- only print summaries for each mailbox or folder.\n-S\tsummarize the number of messages in each mailbox or folder.\n-s status only select messages with the specified status.\n\t'status' is one of \"new\", \"old\", \"unread\" (same as \"old\"),\n\tor \"read\".  The first letter need only be specified.\n-v\tprint a verbose header."},"cat":"Communications","sub":"Mail"},{"name":"fstat","desc":"display a file's file descriptor -- the RBF file-descriptor sector, not the attribute bits `attr' shows you. Its own Function line says `Display file descriptor information' and it reports itself as `FStat'. `-s' adds the segment list, and `ssl' shows the same list from the same sector","dir":"CMDS","size":13848,"hassrc":true,"help":{"cmd":"fstat -?","text":"Syntax: FStat [\u003copts>] \u003cfile1> [\u003copts>]\nFunction: Display file descriptor information\nOptions:\n    -s  display file segment list"},"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"fstopgm","desc":"Usenix FaceSaver image to PGM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":50870,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"fuddle","desc":"A chess variant that shuffles -- \"fuddles\" -- the pieces into fresh places and then plays a game from there. It asks whether you want white, draws a shaded board with the pieces listed above it, and takes moves as two squares, e2e4.","src":"chess","origin":"usenet archive","archive":"chess.ar","dir":"CMDS/GAMES","size":18238,"hassrc":true,"help":{"note":"it takes no options and asks whether you want white"},"cat":"Games","sub":"Board & card"},{"name":"funzip","desc":"Unzip straight from a pipe -- funzip \u003c file.zip","src":"unzip50","origin":"Microware OS-9 archive","archive":"unzip50_src.lzh -- Info-ZIP 5.0,","dir":"CMDS","size":9184,"star":true,"docs":true,"hassrc":true,"howto":"Unzips from a pipe rather than a file: `funzip \u003c thing.zip > thing'. For a normal archive use unzip; zipinfo lists what is inside one.","help":{"note":"a filter with no options: a zip archive on standard input, its first member out"},"cat":"Archives & compression","sub":"zip"},{"name":"g","desc":"an Atari Graph demonstration, paired with striche. It calls the `graph' trap library, so load that first; it then aborts on a supervisor-only instruction, having been written to run in supervisor state","dir":"CMDS/GAMES","size":2068,"star":true,"help":{"note":"it takes no options; it calls the Graph trap library, so load graph first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"g3topbm","desc":"Group 3 fax file to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":46274,"hassrc":true,"help":{"cmd":"g3topbm -?","text":"usage:  g3topbm [-kludge][-reversebits][-stretch] [g3file]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"game","desc":"draw a saved GNU Chess game board by board as PostScript, one page a move, for printing with the ChessFont file DOC/game names.  Given a game it writes the first line of the page setup and stops there","dir":"CMDS/GAMES","size":20270,"docs":true,"howto":"Same input as checkgame, a gnuchess `chess.lst', and it writes PostScript on standard output: `game chess.lst > out.ps'. Here it gets as far as the page setup and stops.","help":{"note":"it takes the game listing and the page numbers and nothing else"},"cat":"Games","sub":"Chess utilities"},{"name":"gawk","desc":"GNU awk 2.11, the pattern-and-action language. This build reads standard input whatever it is given, so redirect: `gawk \"{...}\" \u003c file'; named a file it waits on the terminal","needs":[{"path":"/dd/tmp/gawkXXXXXX","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":112534,"star":true,"docs":true,"howto":"GNU awk 2.11. IT IGNORES A FILENAME ARGUMENT and reads standard input whatever it is given, so redirect: `gawk \"{print \\$1}\" \u003c file', never `gawk \"{print \\$1}\" file' -- named a file it sits waiting on the terminal. Keep the program text short: a command line wider than the window scrolls under bash and is hard to read back. Needs Microware's cio.","help":{"cmd":"gawk -?","text":"Syntax   : gawk [\u003copts>] \u003cprogram-file> [\u003cfile>]\nFunction : pattern scanning and processing language\nOptions  :\n   -a             use traditional syntax for regular expressions\n   -e             use egrep syntax for regular expressions\n   -f \u003cfile>      read program source from \u003cfile>\n   -F \u003cfs>        use \u003cfs> for input field separator\n   -v \u003cvar>=\u003cval> assign \u003cval> to variable \u003cvar>\n   --             signal end of options\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Text tools","sub":"Transform & filter"},{"name":"gcc","desc":"the GCC driver -- GCC139's and GCC2's share this name. They are not the same version, and neither is 2.x: GCC139/gcc answers `gcc version 1.39' and GCC2/gcc answers `gcc version 1.42', read out of `gcc -v'","needs":[{"path":"/DD/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/H0/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/DD/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/H0/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/DD/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/GNULIB/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/GCC2","size":27602,"star":true,"docs":true,"help":{"cmd":"gcc -?","text":"GNU C Compiler (Version 1.42)\nUsage: gcc {options} {files} {options}\nOptions:  (Do not concatenate single letter options)\n\nControl compile stages\n  -c           not run linker\n  -o68         use o68 before assemble\n  -ucc\t       use new Ultra C utilities\n  -S           only compile source files\n  -E           only preprocess source files\n  -M           only print dependencies\n  -MM          only print dependencies sans system header files\n  -pipe        connect preprocessor and compiler via pipe\n  -debug       not execute but only print command to execute\n  -v           print version and commands to execute\n  -Q           not quiet mode\n  -BPREFIX     use PREFIX for commands\n  -bPREFIX     use machine dependent PREFIX for commands\n  -LDIR        search DIR for library files\n  -TDIR        specify DIR of temp files\n  -FPROGsSIZEpPRIO\n               fork PROGram (one of cccp cc1 o68 opt68k r68(020) l68) with\n\t       additional stack SIZE and PRIOrity\n\nOutput\n  -o FILE      output to FILE\n  -x           put executable file into default execution directory\n\nWarning\n  -W           issue warnings\n  -WCASE       CASE is one of\n                 implicit return-type ununsed switch comment trigraphs all\n                 shadow id-clash-LEN pointer-arith cast-qual write-strings\n  -w           inhibit all warnings\n\nPortability\n  -ansi         support ANSI standard\n  -traditional  try to imitate traditional C compiler\n  -pedantic     support pedantic ANSI standard\n\nPreprocessor\n  -DMACRO[=DEF] define MACRO (by DEF)\n  -UMACRO       undefine MACRO\n  -IDIR         search include file in DIR\n  -I-           dir specified by the -Idir before -I- applies to only user\n                include files\n  -iFILE        get only #define's in FILE\n  -nostdinc     do not use standard directory of include files\n  -C            include comments in preprocessor output\n  -trigraphs    support ANSI trigraphs\n\nCompiler\n  -O            optimize\n  -p            generate profile code too\n  -a            generate block profile code too\n  -g\t          generate debug code for srcdbg\n  -mMACHINESPEC MACHINESPEC is one of\n                (c)68000 (c)68020 (c)68040 68881 soft-float short (no)bitfield\n                rtd (no)remote (no)stack-check (no)gss (no)long-calls\n  -fFLAG        FLAG is one of\n                  caller-saves combine-regs cond-mismatch float-store\n                  force-addr force-mem inline-functions keep-inline-functions\n                  omit-frame-pointer pcc-struct-return strength-reduce\n                  unsigned-char volatile writable-strings asm defer-pop\n                  function-cse signed-char delayed-branch\n                and the above with prefix no- and\n                  fixed-REG call-used-REG call-saved-REG\n  -dLETTERS     dump debug info in various stages.  LETTER is one of\n                  y r j s L f c l g J d m\n\nAssembler\n  -ob           optimize branch sizing\n\nLinker\n  -lFILE        use library FILE\n  -nostdlib     do not use any standard library files and startup file\n  -p (or -a)    link profile dump library\n  -g            output symbol table too\n  -cio          use cio trap handler\n  -j            inhibit to make jump table\n  -ghost        output ghost module\n  -s SIZE       specify additional stack SIZE of output module\n  -e NUMBER     specify edition NUMBER of output module\n  -n NAME       specify output module NAME\n  -P HEX        specify permission of output module in HEX\n  -A FILE       use alternate cstart FILE"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc2","desc":"the GCC 2.x driver, and the only one that is: `gcc version 2.5.6'","needs":[{"path":"/DD/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/H0/CMDS/gcc_","missing":true,"dir":false,"bytes":null},{"path":"/DD/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/GNULIB/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/GCC2","size":37206,"star":true,"help":{"cmd":"gcc2 -?","text":"GNU C Compiler (Version 2.5.6)\nUsage: gcc2 {options} {files} {options}\nOptions:  (Do not concatenate single letter options)\n\nControl compile stages\n  -c                not run linker\n  -o68              use o68 before assemble\n  -ucc              use UltraC utilities (opt68k,r68,l68)\n  -S                only compile source files\n  -E                only preprocess source files\n  -M                only print dependencies\n  -MM               like -M except mention only user header files\n  -MD               like -M except information is written to a \u003cname>.d file\n  -MMD              like -MD except mention only user header files\n  -pipe             connect preprocessor and compiler via pipe\n  -debug            not execute but only print command to execute\n  -v                print version and commands to execute\n  -Q                not quiet mode\n  -BPREFIX          use PREFIX for commands\n  -bPREFIX          use machine dependent PREFIX for commands\n  -LDIR             search DIR for library files\n  -TDIR             specify DIR of temp files\n  -FPROGsSIZEpPRIO  fork PROGram (one of cccp2 cc2 o68 opt68k r68(020) l68)\n                    with additional stack SIZE and PRIOrity\n\nOutput\n  -o FILE           output to FILE\n  -x                put executable file into default execution directory\n\nWarning\n  -W                issue warnings\n  -WCASE            CASE is one of\n                      aggregate-return cast-align cast-qual comment\n                      conversion error format id-clash-LEN enum-clash\n                      implicit import inline missing-prototypes nested-externs\n                      parentheses pointer-arith redundant-decls return-type\n                      shadow strict-prototypes switch traditional trigraphs\n                      uninitialized unused write-strings char-subscripts\n  -w                inhibit all warnings\n\nPortability\n  -ansi             support ANSI standard\n  -traditional      try to imitate traditional C compiler\n  -pedantic         support pedantic ANSI standard\n  -pedantic-errors  like -pedantic, but errors instead of warnings\n\nPreprocessor\n  -DMACRO[=DEF]      define MACRO (by DEF)\n  -UMACRO            undefine MACRO\n  -dM                tell cccp2 to output only a list of the macro definitions\n                     that are in effect at the end of preprocessing\n  -dD                tell cccp2 to pass all macro definitions into the output\n  -dN                like -dD execpt that macro args and contents are omitted\n  -H                 print the name of each header file used\n  -IDIR              search include file in DIR\n  -I-                dir specified by the -Idir before -I- applies to only user\n                     include files\n  -iFILE             get only #define's in FILE\n  -nostdinc          do not use standard directory of include files\n  -C                 include comments in preprocessor output\n  -traditional-cpp   try to imitate traditional cpp\n  -trigraphs         support ANSI trigraphs\n\nCompiler\n  -O0,1,2            optimize\n  -p                 generate profile code too\n  -pg                generate profile code for gprof\n  -a                 generate block profile code too\n  -gg or -gsrcdbg    generate debug code for srcdbg\n  -mMACHINESPEC      MACHINESPEC is one of\n                      (c)68000 (c)68020 (c)68030 (c)68040 (c)68020-40\n                      (c)68040-only cpu32 68881 soft-float (no)short\n                      (no)bitfield (no)com (no)rtd (no)remote (no)stack-check\n                      (no)gss (no)long-calls (no)regparm\n  -fFLAG             FLAG is one of\n                      Optimization :\n                        caller-saves cse-follow-jumps cse-skip-blocks\n                        delayed-branch  expensive-optimizations fast-math\n                        float-store force-addr force-mem inline-functions\n                        keep-inline-functions no-defer-pop no-function-cse\n                        no-inline no-peephole omit-frame-pointer\n                        rerun-cse-after-loop schedule-insns schedule-insns2\n                        strength-reduce thread-jumps unroll-all-loops\n                        unroll-loops elide-constructors memoize-lookups\n                        no-default-inline\n                      Language :\n                        cond-mismatch no-asm no-builtin signed-bitfields\n                        signed-char unsigned-bitfields unsigned-char\n                        writable-strings all-virtual dollars-in-identifiers\n                        enum-int-equiv no-strict-prototype this-is-variable\n                      Code Generation :\n                        call-saved-REG call-used-REG fixed-REG\n                        inhibit-size-directive nonnull-objects no-common\n                        no-ident short-enums short-double volatile\n\t\t\tvolatile-global shared-data\n\t\t\tpcc-struct-return reg-struct-return\n                      Warning :\n                        syntax-only\n                      Debugging :\n                        pretend-float\n  -dLETTERS          dump debug info in various stages.  LETTER is one of\n                       y r j s L f c l g J d m\n\nAssembler\n  -ob                optimize branch sizing\n\nLinker\n  -lFILE             use library FILE\n  -nostdlib          do not use any standard library files and startup file\n  -p (or -a)         link profile dump library (not yet supported)\n  -g                 generate symboltable module\n  -cio               use cio trap handler\n  -j                 inhibit to make jump table\n  -ghost             output ghost module\n  -s SIZE            specify additional stack SIZE of output module\n  -e NUMBER          specify edition NUMBER of output module\n  -n NAME            specify output module NAME\n  -P HEX             specify permission of output module in HEX\n  -A FILE            use alternate cstart FILE\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_cc1","desc":"GCC 1.39 C compiler pass","dir":"CMDS/GCC139","size":481494,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_cc1plus","desc":"GCC 1.39 C++ compiler pass","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/GCC139","size":813590,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_cc2","desc":"GCC 2.x compiler pass, under the name gcc2 forks","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":990198,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_cccp","desc":"GCC 1.39 preprocessor","needs":[{"path":"/dd/defs","missing":false,"dir":true,"bytes":null},{"path":"/h0/defs","missing":false,"dir":true,"bytes":null},{"path":"/dd/defs/cc","missing":false,"dir":true,"bytes":null},{"path":"/h0/defs/cc","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/GCC139","size":58834,"help":{"cmd":"gcc_cccp -?","text":"GNU C Compatible Compiler Preprocessor (Version 1.39)\nUsage: /dd/CMDS/GCC139/gcc_cccp [switches] input output\nSwitches:\n  -Idirectory           add the directory to be searched for header file.\n  -ifile                process file to make the macros defined in the file\n                        available for use in the main input.\n  -n(ostdinc)           use no default include directories.\n  -Dname[=definition]   predefine name as a macro with definition.(default 1).\n  -Uname                do not predefine name.(superior to -D option.)\n  -u(ndef)              do not predefine any non standard macros.\n  -traditional          try to imitate old fashioned non-ANSI preprocessor.\n  -trigraphs            process ANSI standard trigraph sequences.\n  -$                    do not admit `$' in identifier.\n  -+                    handle C++ comment and use extra default include\n                        directories for C++.\n  -P                    inhibit generation of #-line information.\n  -C                    output comments too.\n  -p(edantic)           issue warnings required by the ANSI C standard.\n  -w                    do not print warnings.\n  -Wtrigraphs           warn if there are any trigraphs.\n  -Wcomment(s)          warn if `/*' appears in a comment.\n  -Wall                 same as -Wtrigraphs and -Wcomment.\n  -o file               output result into file.\n  -d                    output #define's instead of preprocessing result.\n  -M                    output dependencies of files instead of preprocessing\n                        result.\n  -MM                   as -M but output only user include files.\n  -v                    print version number.\n  -K                    try to imitate microware's preprocessor.\nfollowing options are valid only under -K option\n  -e number             specify OSK psect edition.\n  -g                    output debug info too.\n  -l                    output comments too."},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_cccp2","desc":"GCC 2.x preprocessor, under the name gcc2 forks","needs":[{"path":"/DD/DEFS","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GCC2","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GPP2","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":84024,"star":true,"help":{"cmd":"gcc_cccp2 -?","text":"GNU C Compatible Compiler Preprocessor (Version 2.5.6)\nUsage: cccp2 [switches] input output\nSwitches:\n  -Idirectory           add the directory to be searched for header file.\n  -ifile                process file to make the macros defined in the file\n                        available for use in the main input.\n  -n(ostdinc)           use no default include directories.\n  -Dname[=definition]   predefine name as a macro with definition.(default 1).\n  -Uname                do not predefine name.(superior to -D option.)\n  -u(ndef)              do not predefine any non standard macros.\n  -traditional          try to imitate old fashioned non-ANSI preprocessor.\n  -trigraphs            process ANSI standard trigraph sequences.\n  -$                    do not admit `$' in identifier.\n  -+                    handle C++ comment and use extra default include\n                        directories for C++.\n  -P                    inhibit generation of #-line information.\n  -C                    output comments too.\n  -p(edantic)           issue warnings required by the ANSI C standard.\n  -w                    do not print warnings.\n  -Wtrigraphs           warn if there are any trigraphs.\n  -Wcomment(s)          warn if `/*' appears in a comment.\n  -Wall                 same as -Wtrigraphs and -Wcomment.\n  -o file               output result into file.\n  -d                    output #define's instead of preprocessing result.\n  -M                    output dependencies of files instead of preprocessing\n                        result.\n  -MM                   as -M but output only user include files.\n  -v                    print version number.\n  -K                    try to imitate microware's preprocessor.\nfollowing options are valid only under -K option\n  -e number             specify OSK psect edition.\n  -G                    output debug info too.\n  -L                    output comments too."},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcc_collect","desc":"GCC 1.39 collect2","dir":"CMDS/GCC139","size":17518,"help":{"cmd":"gcc_collect -?","text":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n           -l=\u003cfile>    process library\n  Written 1991 by Stephan Paschedag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gcl","desc":"a grand digital clock: the time drawn large across the terminal and redrawn as it runs.  `-n=\u003cseconds>' runs it for that long; -s scrolls the digits, -i inverts the video","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":5212,"star":true,"hassrc":true,"howto":"A full-screen digital clock: `gcl' runs until stopped, `gcl -n=10' for ten seconds; -s scrolls the digits, -i inverts the video.","help":{"cmd":"gcl -?","text":"syntax: gcl {opts} [bkgnd] {opts}\nFunction: display grand digital clock\nOptions:\n\t-i\t\t\tinverse video\n\t-s\t\t\tscroll digits\n\t-n[=]\u003cnum>\trun continuously for \u003cnum> seconds (default forever)\n\t-x[=]\u003cnum>\tbegin display at column \u003cnum>\n\t-y[=]\u003cnum>\tbegin display at row \u003cnum> (from top)\n'bkgnd' = a shell command to display a background image"},"cat":"Time & calendar","sub":"Clocks"},{"name":"gdd","desc":"GNU dd, a block copier and converter: `gdd if=\u003cfile> bs=\u003cn> skip= seek= count=', and `conv=ucase' converts on the way through. `of=' can only name a file that already exists, so send the output through `>' instead","dir":"CMDS","size":17938,"star":true,"howto":"GNU dd -- a block copier and converter. `gdd if=\u003cfile> bs=8 count=1' copies eight bytes, `conv=ucase' converts on the way through. `of=' can only name a file that already exists, so send the output through `>'. Give it arguments. It uses Microware's cio; `dump' is the hex dump here.","help":{"cmd":"gdd -?","text":"gdd: unrecognized option `-?'\nUsage: gdd [if=file] [of=file] [ibs=bytes] [obs=bytes] [bs=bytes] [cbs=bytes]\n       [skip=blocks] [seek=blocks] [count=blocks]\n       [conv={ascii,ebcdic,ibm,block,unblock,lcase,ucase,swab,noerror,sync}]\nNumbers can be followed by a multiplier:\nb=512, k=1024, w=2, xm=number m"},"cat":"Text tools","sub":"Transform & filter"},{"name":"gemtopbm","desc":"GEM .img (Atari and PC) to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":43040,"hassrc":true,"help":{"cmd":"gemtopbm -?","text":"usage:  gemtopbm [-debug] [gemfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gen","desc":"generates the frame of a new C program -- header block, authorship and version lines and the sectioned comments a Microware example was laid out with. It appends `.c' to whatever name you give it: `gen -p frame' leaves `frame.c'. `-m' does a module frame, `-t' a type, `-f' a function declaration","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":17940,"hassrc":true,"help":{"cmd":"gen -?","text":"Syntax: gen [\u003copt>] \u003cpathname> [\u003copts>]\nFunction: generate a program frame\nNote: there must be exactly one option selected\nOptions:\n     -f        generate function declaration frame\n     -m        generate module frame\n     -p        generate program frame\n     -t        generate type declaration frame\ngen: illegal arguments"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"georgia","desc":"the weather program on its south-Atlantic profile; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"help":{"note":"it takes a number of years and nothing else"},"cat":"Amusements","sub":"Simulated weather"},{"name":"gep","desc":"global expression parser -- grep-like; its `-e' takes the PATH OF A FILE holding the expressions: `gep -e=/dd/tmp/patterns \u003cfile>'. A file of patterns applied at once is what it is for and nothing else here does it. See DOC/README-GREP","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":3654,"star":true,"hassrc":true,"howto":"Its expressions come from a FILE named with `-e', which its own option list marks `(required)': `gep -e=\u003cpatterns> \u003csource>'. Handing it a pattern and a file the way you would grep earns `more than one path specified'.","help":{"cmd":"gep -?","text":"Syntax: gep [\u003copts>] [\u003csrcpath>] [\u003copts>]\nFunction: global expression(s) parser\nOptions:\n     -b[=]\u003cn>[K]  use specified expression buffer size (4096)\n     -e[=]\u003cpath>  use \u003cpath> for expressions (required)\n     -v        print non-matches\n     -?        print usage"},"cat":"Text tools","sub":"Transform & filter"},{"name":"getenv","desc":"print or test an environment variable.  German prompts: `getenv -p TERM' prints the value with a newline, -l without one, -x exits with it, -n inverts the test.  Bare, or with a name and no option, it prints its own usage.  DESIGNA VLT, version UTIL 2.40","dir":"CMDS","size":3784,"star":true,"help":{"cmd":"getenv -?","text":"GETENV   Version UTIL 2.40 by DESIGNA VLT 24.11.97\nUSAGE: getenv [-n|-p|-l|-x] \u003cEnvironment> [\u003cWert>]\n\n testet \u003cEnvironment> und vergleicht wenn angegeben \u003cWERT>\n und setzt Returncode entsprechend (OK = 0)\n\n   -n  =  Auswertung umkehren\n   -p  =  Ausgabe des Environment-Wertes auf StdOut (mit LineFeed)\n   -l  =  Ausgabe des Environment-Wertes auf StdOut (ohne LineFeed)\n\n   -x  =  Exit mit Wert des Environments"},"cat":"Shells","sub":"Shell helpers"},{"name":"getsys","desc":"report the system's globals -- what OS-9 thinks it is running on","dir":"CMDS","size":8998,"star":true,"help":{"cmd":"getsys -?","text":"Syntax: getsys [\u003copts>]\nFunction: display system global variables\nOptions:  none\ngetsys: no parameters recognized"},"cat":"System & modules","sub":"Utilities"},{"name":"gftopk","desc":"MetaFont generic font to packed font","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"pat
