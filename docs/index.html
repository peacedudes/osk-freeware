003cfiles...>'; -E, -F, -i, -v, -w and the rest as you would expect.","help":{"cmd":"ggrep -?","text":"ggrep: illegal option -- ?\nusage: ggrep [-[[AB] ]\u003cnum>] [-[CEFGVchilnqsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]"},"cat":"Text tools","sub":"Search & match"},{"name":"giftopnm","desc":"GIF to PNM; -image picks one of several in the file, -comments prints its comments","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":100070,"hassrc":true,"howto":"Reads a GIF into the PNM formats the other 168 converters work on -- try `giftopnm /dd/DEMO/gulls.gif | pnmfile'. IMPORTANT for anyone piping images out of the emulator: os9exec turns CR into CRLF on the way to the host, so a raw image containing byte 13 arrives corrupted. Keep binary inside OS-9 and convert with pnmnoraw before taking a picture anywhere else. DOC/README-NETPBM has the details.","help":{"cmd":"giftopnm -?","text":"usage:  giftopnm [-verbose] [-comments] [-image N] [GIFfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gmake","desc":"GNU make: builds targets from a makefile's rules -- -f names the file, -n prints what it would do, -k keeps going past errors","needs":[{"path":"/h0/X11R5/X11/h0/usr/local/include","missing":true,"dir":false,"bytes":null},{"path":"/h0/usr/local/include","missing":true,"dir":false,"bytes":null},{"path":"/h0/X11R5","missing":true,"dir":false,"bytes":null},{"path":"/h0/defs","missing":false,"dir":true,"bytes":null},{"path":"/h0/usr/local/lib","missing":true,"dir":false,"bytes":null},{"path":"/h0/lib","missing":false,"dir":true,"bytes":null},{"path":"/h0/cmds","missing":false,"dir":true,"bytes":null},{"path":"/h0/usr/gnubin","missing":true,"dir":false,"bytes":null},{"path":"/h0/cmds/sh","missing":false,"dir":false,"bytes":77306}],"dir":"CMDS","size":132446,"help":{"cmd":"gmake -h","text":"Usage: gmake [options] [target] ...\nOptions:\n  -b, -m                      Ignored for compatibility.\n  -C DIRECTORY, --directory DIRECTORY\n                              Change to DIRECTORY before doing anything.\n  -d, --debug                 Print lots of debugging information.\n  -e, --environment-overrides\n                              Environment variables override makefiles.\n  -f FILE, --file FILE, --makefile FILE\n                              Read FILE as a makefile.\n  -h, --help                  Print this message and exit.\n  -i, --ignore-errors         Ignore errors from commands.\n  -I DIRECTORY, --include-dir DIRECTORY\n                              Search DIRECTORY for included makefiles.\n  -j [N], --jobs [N]          Allow N jobs at once; infinite jobs with no arg.\n  -k, --keep-going            Keep going when some targets can't be made.\n  -l [N], --load-average [N], --max-load [N]\n                              Don't start multiple jobs unless load is below N.\n  -n, --just-print, --dry-run, --recon\n                              Don't actually run any commands; just print them.\n  -o FILE, --old-file FILE, --assume-old FILE\n                              Consider FILE to be very old and don't remake it.\n  -p, --print-data-base       Print make's internal database.\n  -q, --question              Run no commands; exit status says if up to date.\n  -r, --no-builtin-rules      Disable the built-in implicit rules.\n  -s, --silent, --quiet       Don't echo commands.\n  -S, --no-keep-going, --stop\n                              Turns off -k.\n  -t, --touch                 Touch targets instead of remaking them.\n  -v, --version               Print the version number of make and exit.\n  -w, --print-directory       Print the current directory.\n  --no-print-directory        Turn off -w, even if it was turned on implicitly.\n  -W FILE, --what-if FILE, --new-file FILE, --assume-new FILE\n                              Consider FILE to be infinitely new."},"cat":"Compilers & build","sub":"Make & generators"},{"name":"gnuan","desc":"GNU Chess analyser -- annotates a saved game move by move","needs":[{"path":"/h0/gnuchess4.0/misc/gnuchess.hash","missing":false,"dir":false,"bytes":39444},{"path":"/h0/gnuchess4.0/misc/gnuchess.data","missing":false,"dir":false,"bytes":144012},{"path":"/h0/gnuchess4.0/misc/gnuchess.lang","missing":false,"dir":false,"bytes":14008}],"dir":"CMDS/GAMES","size":162634,"docs":true,"howto":"Give it a file of moves like `e2e4 e7e5 g1f3', then a search depth and a minutes-per-move limit, and it annotates the game move by move. At the end of the file it prints the position and stops with `Bad move'.","help":{"cmd":"gnuan -?","text":"Usage: Gnuchess [-a] [-t] [-c size] [-s savefile][-l listfile] [-x xwndw]"},"cat":"Games","sub":"Chess utilities"},{"name":"gnuchess","desc":"GNU Chess, the build `gnuchess' runs: first on PATH, it reads its opening book at the compiled-in path /h0/usr/src/chess/gnuchess.book, which ships here, so it answers 1.e4 with a book move. Source `. termcap.entry' first, since it reads TERMCAP as the description itself. CMDS/GAMES/gnuchess, a second port under the same name, opens its book by bare name and draws the board reads TERMCAP as the description itself rather than as a filename -- and it draws the board, keeps both clocks and plays.  It opens its opening book by bare name, so it books when the book is the current directory; the CMDS build books from a fixed path and is what `gnuchess' runs","src":"gnu","origin":"usenet archive","archive":"gnu.ar","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false,"dir":false,"bytes":41413},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":78292,"star":true,"docs":true,"hassrc":true,"howto":"Full-screen chess. It reads TERMCAP as the terminal description itself rather than as a filename, so do `. /dd/SYS/termcap.entry' first; then it draws its time-control menu and plays. The build in CMDS/GAMES is the one that draws a board.","help":{"cmd":"gnuchess -?","text":"Usage: gnuchess [-a] [-h] [-x xwndw]\n'xterm-256color': Unknown terminal type."},"cat":"Games","sub":"Board & card"},{"name":"gnuchessc","desc":"GNU Chess 4.0 built for a curses display.  Its display files live at a compiled-in path; supply them there for a board.  It takes a move as `e2e4' and answers with its own","needs":[{"path":"/h0/gnuchess4.0/misc/gnuchess.hash","missing":false,"dir":false,"bytes":39444},{"path":"/h0/gnuchess4.0/misc/gnuchess.data","missing":false,"dir":false,"bytes":144012},{"path":"/h0/gnuchess4.0/misc/gnuchess.lang","missing":false,"dir":false,"bytes":14008}],"dir":"CMDS/GAMES","size":169252,"howto":"Its board display reads files from a compiled-in path; supply them there for a board. It still takes a move as `e2e4' and answers with its own.","help":{"cmd":"gnuchessc -?","text":"Usage: Gnuchess [-a] [-t] [-c size] [-s savefile][-l listfile] [-x xwndw]"},"cat":"Games","sub":"Board & card"},{"name":"gnuchessn","desc":"GNU Chess with the 1989 display, which draws the squares as blocks of hashes so light and dark can be told apart on a terminal with no highlighting.  Source `. /dd/SYS/termcap.entry' first; moves go in as `e2e4'","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false,"dir":false,"bytes":41413},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":101652,"star":true,"howto":"As gnuchess: `. /dd/SYS/termcap.entry' first, then moves as `e2e4'.","help":{"cmd":"gnuchessn -?","text":"Usage: gnuchess [-a] [-h] [-x xwndw]\n'xterm-256color': Unknown terminal type."},"cat":"Games","sub":"Board & card"},{"name":"gnuchessr","desc":"GNU Chess with the plainest display -- pieces as letters, capitals for one side and lower case for the other, nothing that needs a terminal to draw.  It prompts `Enter #moves #minutes', takes a move and replies with its own","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false,"dir":false,"bytes":41413}],"dir":"CMDS","size":66152,"star":true,"help":{"note":"it takes -a, -h and -x xwndw; asked for help it prints the usage line and starts the game anyway"},"cat":"Games","sub":"Board & card"},{"name":"gnuplot","desc":"gnuplot 2.0 -- plots functions and data files.  Built-in help (SYS/gnuplot.gih); demos and sample data in DOC/gnuplot/demo","needs":[{"path":"/dd/sys/gnuplot.gih","missing":false,"dir":false,"bytes":45765}],"dir":"CMDS","size":136932,"star":true,"docs":true,"howto":"Type `set term' first -- it lists every output device it knows, and refuses to plot until you choose one. Its whole manual is built in: type `help'. Demos and sample data are in DOC/gnuplot/demo. Needs Microware's cio.","help":{"note":"`help' at its own prompt is its whole manual; a flag is read as the name of a file to load"},"cat":"Graphics & images","sub":"Plotting"},{"name":"gothic","desc":"print text as a gothic/blackletter banner","src":"gothic","origin":"usenet archive","archive":"gothic.ar","dir":"CMDS","size":13464,"star":true,"hassrc":true,"help":{"note":"it draws whatever it is given, a `-?' included: `gothic word' sets the word, and `-h' halves the height"},"cat":"Text tools","sub":"Banners & text art"},{"name":"gouldtoppm","desc":"Gould scanner file to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45430,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gpp","desc":"the C++ driver -- and it is a GCC 1.x one.  GCC2/gpp says `gpp version 1.40.3 (based on GCC 1.40)' and GCC139/gpp says 1.37.1","needs":[{"path":"/DD/CMDS/gpp_","missing":true,"dir":false,"bytes":null},{"path":"/H0/CMDS/gpp_","missing":true,"dir":false,"bytes":null},{"path":"/DD/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/CMDS/gpp_","missing":true,"dir":false,"bytes":null},{"path":"/H0/CMDS/gpp_","missing":true,"dir":false,"bytes":null},{"path":"/DD/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/LIB/","missing":false,"dir":true,"bytes":null},{"path":"/DD/GNULIB/","missing":false,"dir":true,"bytes":null},{"path":"/H0/GNULIB/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/GCC2","size":41282,"help":{"cmd":"gpp -?","text":"GNU C++ Compiler (Version 1.40.3 (based on GCC 1.40))\nUsage: gpp {options} {files} {options}\nOptions:  (Do not concatenate single letter options)\n\nControl compile stages\n  -c           not run linker\n  -o68         use o68 before assemble\n  -S           only compile source files\n  -E           only preprocess source files\n  -M           only print dependencies\n  -MM          only print dependencies sans system header files\n  -pipe        connect preprocessor and compiler via pipe\n  -debug       not execute but only print command to execute\n  -v           print version and commands to execute\n  -Q           not quiet mode\n  -BPREFIX     use PREFIX for commands\n  -bPREFIX     use machine dependent PREFIX for commands\n  -LDIR        search DIR for library files\n  -TDIR        specify DIR of temp files\n  -FPROGsSIZEpPRIO\n               fork PROGram (one of cccp cc1plus o68 r68(020) l68) with\n               additional stack SIZE and PRIOrity\n\nOutput\n  -o FILE      output to FILE\n  -x           put executable file into default execution directory\n  -col         do not delete collector output file\n\nWarning\n  -W           issue warnings\n  -WCASE       CASE is one of\n                 implicit return-type ununsed switch comment trigraphs all\n                 shadow id-clash-LEN pointer-arith cast-qual write-strings\n  -w           inhibit all warnings\n\nPortability\n  -ansi         support ANSI standard\n  -traditional  try to imitate traditional C compiler\n  -pedantic     support pedantic ANSI standard\n\nPreprocessor\n  -DMACRO[=DEF] define MACRO (by DEF)\n  -UMACRO       undefine MACRO\n  -IDIR         search include file in DIR\n  -I-           dir specified by the -Idir before -I- applies to only user\n                include files\n  -iFILE        get only #define's in FILE\n  -nostdinc     do not use standard directory of include files\n  -C            include comments in preprocessor output\n  -trigraphs    support ANSI trigraphs\n\nAssembler\n  -ob           optimize branch sizing\n\nCompiler\n  -O            optimize\n  -p            generate profile code too\n  -a            generate block profile code too\n  -mMACHINESPEC MACHINESPEC is one of\n                (c)68000 (c)68020 (c)68040 68881 soft-float short (no)bitfield\n                rtd (no)remote (no)stack-check (no)gss (no)long-calls\n  -fFLAG        FLAG is one of\n                  caller-saves combine-regs cond-mismatch float-store\n                  force-addr force-mem inline-functions keep-inline-functions\n                  omit-frame-pointer pcc-struct-return strength-reduce\n                  unsigned-char volatile writable-strings asm defer-pop\n                  function-cse signed-char delayed-branch shared-data\n                and the above with prefix no- and\n                  fixed-REG call-used-REG call-saved-REG\n                  strict-prototype elide-contructors all-virtual\n                  this-is-variable save-memoized memoize-lookups\n  -dLETTERS     dump debug info in various stages.  LETTER is one of\n                  y r j s L f c l g J d m\n\nLinker\n  -lFILE        use library FILE\n  -nostdlib     do not use any standard library files and startup file\n  -p (or -a)    link profile dump library\n  -g            output symbol table too\n  -cio          use cio trap handler\n  -j            inhibit to make jump table\n  -ghost        output ghost module\n  -s SIZE       specify addtional stack SIZE of output module\n  -e NUMBER     specify edition NUMBER of output module\n  -n NAME       specify output module NAME\n  -P HEX        specify permission of output module in HEX"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_cc1plus","desc":"GCC 2.x C++ pass, under the name gpp forks","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":818786,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_cccp","desc":"GCC 2.x preprocessor, under the name gpp forks","needs":[{"path":"/DD/DEFS","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GCC2","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GPP2","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":84024,"star":true,"help":{"cmd":"gpp_cccp -?","text":"GNU C Compatible Compiler Preprocessor (Version 2.5.6)\nUsage: cccp2 [switches] input output\nSwitches:\n  -Idirectory           add the directory to be searched for header file.\n  -ifile                process file to make the macros defined in the file\n                        available for use in the main input.\n  -n(ostdinc)           use no default include directories.\n  -Dname[=definition]   predefine name as a macro with definition.(default 1).\n  -Uname                do not predefine name.(superior to -D option.)\n  -u(ndef)              do not predefine any non standard macros.\n  -traditional          try to imitate old fashioned non-ANSI preprocessor.\n  -trigraphs            process ANSI standard trigraph sequences.\n  -$                    do not admit `$' in identifier.\n  -+                    handle C++ comment and use extra default include\n                        directories for C++.\n  -P                    inhibit generation of #-line information.\n  -C                    output comments too.\n  -p(edantic)           issue warnings required by the ANSI C standard.\n  -w                    do not print warnings.\n  -Wtrigraphs           warn if there are any trigraphs.\n  -Wcomment(s)          warn if `/*' appears in a comment.\n  -Wall                 same as -Wtrigraphs and -Wcomment.\n  -o file               output result into file.\n  -d                    output #define's instead of preprocessing result.\n  -M                    output dependencies of files instead of preprocessing\n                        result.\n  -MM                   as -M but output only user include files.\n  -v                    print version number.\n  -K                    try to imitate microware's preprocessor.\nfollowing options are valid only under -K option\n  -e number             specify OSK psect edition.\n  -G                    output debug info too.\n  -L                    output comments too."},"cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_collect","desc":"GCC 2.x collect2, under the name gpp forks","dir":"CMDS","size":17634,"help":{"cmd":"gpp_collect -?","text":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n           -l=\u003cfile>    process library\n  Written 1991 by Stephan Paschedag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"graph","desc":"the Graph trap library itself -- a type-$0B module, not a program. It is what g, striche, apfel, sine, showpic, graphdemo, graphsave and wgen all call: `load' it and the trap installs. The module executes in supervisor state, so a program that calls it from the shell is entered and aborts on a supervisor-only instruction","dir":"CMDS/GAMES","size":5138,"docs":true,"hassrc":true,"help":{"note":"a trap-handler library, not a program: `load' it before g, striche, apfel and the other Graph programs"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"graphdemo","desc":"a demonstration of the Atari Graph display; it calls the `graph' trap library","dir":"CMDS/GAMES","size":1354,"help":{"note":"it takes no options; it calls the Graph trap library, so load graph first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"graphsave","desc":"save an Atari GRAPH screen.  Aborts with the `graph' trap library resident, like `showpic': it wants the display","dir":"CMDS/GAMES","size":608,"help":{"note":"it takes no options; it calls the Graph trap library, so load graph first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"greed","desc":"Greed: the screen is a field of digits and `@' is you. Move with the vi keys to eat that many digits in that direction, until no move is left","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/GAMES/lib/greed.hs","missing":false,"dir":false,"bytes":140},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":36196,"hassrc":true,"help":{"cmd":"greed -?","text":"Usage: /dd/CMDS/GAMES/greed [-p] [-s]"},"cat":"Games","sub":"Arcade & action"},{"name":"greg","desc":"converts a Julian day number to a Gregorian date: `greg 2461281' is the 29th of August 2026","src":"forum6","origin":"Microware OS-9 archive","archive":"forum6.lzh","dir":"CMDS","size":2226,"star":true,"docs":true,"hassrc":true,"howto":"It converts a Julian day number to a Gregorian date and is nothing to do with regular expressions: `greg 2460000' answers `2023 2 25'.","help":{"cmd":"greg -?","text":"greg: Usage greg \u003cjulian_date>"},"cat":"Time & calendar","sub":"Calendars"},{"name":"grep","desc":"GNU grep 2.0: prints the lines of files that match a regular expression -- -E extended, -F fixed strings, -i ignore case, -v invert, -n number, -c count","dir":"CMDS","size":72364,"docs":true,"help":{"cmd":"grep -?","text":"grep: illegal option -- ?\nusage: grep [-[[AB] ]\u003cnum>] [-[CEFGVchilnqsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]"},"cat":"Text tools","sub":"Search & match"},{"name":"gs33","desc":"Ghostscript 3.33 -- the older one.  gs403 ships with its init files and fonts; use that","needs":[{"path":"/dd/sys/doc","missing":true,"dir":false,"bytes":null},{"path":"/dd/etc/lib/gs33","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":885372,"help":{"cmd":"gs33 -?","text":"Aladdin Ghostscript 3.33 (4/10/1995)\nCopyright (C) 1995 Aladdin Enterprises, Menlo Park, CA.  All rights reserved.\nUsage: gs [switches] [file1.ps file2.ps ...]\nAvailable devices:\n\tkwin deskjet djet500 epson epsonc eps9mid eps9high ibmpro\n\tst800 ap3250 laserjet ljetplus ljet2p ljet3 ljet4 cdeskjet\n\tcdjcolor cdjmono cdj550 pj pjxl pjxl300 bj10e bj200\n\tdfaxhigh\nLanguage interpreters:\n\tPostScript PostScriptLevel1 PostScriptLevel2 PDF\nSearch path:\n    .\n    /dd/etc/lib/gs33\nMost frequently used switches: (you can use # in place of =)\n    -c quit              (as the last switch) exit after processing files\n    -d\u003cname>[=\u003ctoken>]   define name as token, or true if no token given\n    -dNOPAUSE            don't pause between pages\n    -g\u003cwidth>x\u003cheight>   set width and height (`geometry'), in pixels\n    -q                   `quiet' mode, suppress most messages\n    -r\u003cres>              set resolution, in pixels per inch\n    -s\u003cname>=\u003cstring>    define name as string\n    -sDEVICE=\u003cdevname>   select initial device\n    -sOutputFile=\u003cfile>  select output file: embed %d or %ld for page #,\n                           - means stdout, use |command to pipe\n    -                    read from stdin (e.g., a pipe) non-interactively\nFor more information, see the (plain text) file  use.doc  in the directory\n\t/dd/sys/doc."},"cat":"Printing","sub":"PostScript"},{"name":"gs403","desc":"Aladdin Ghostscript 4.03, the complete build: its init files and fonts are in LIB/gs403. Point GS_LIB at that directory and it interprets -- `export GS_LIB=/dd/LIB/gs403' in bash, not `setenv', which is the OS-9 shell's and is not a bash command. It then reads a PostScript file and drops to its own `GS>' prompt. Runs with no trap handler -- built with GCC 2.5.8 by its porter.","needs":[{"path":"/dd/etc/lib/gs4","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":1195388,"docs":true,"howto":"Aladdin Ghostscript 4.03. Point GS_LIB at its library first -- in bash that is `export GS_LIB=/dd/LIB/gs403`, not `setenv`, which is the OS-9 shell's command and gets \"setenv: command not found\" here. Then `gs403 -q -dNOPAUSE -sDEVICE=nullpage \u003cfile>.ps` reads the file and gives you its GS> prompt. Everything it needs, fonts included, is in that directory. gs403 is the complete build; gs33 is the older one.","help":{"cmd":"gs403 -?","text":"Aladdin Ghostscript 4.03 (1996-9-23)\nCopyright (C) 1996 Aladdin Enterprises, Menlo Park, CA.  All rights reserved.\nUsage: gs [switches] [file1.ps file2.ps ...]\nMost frequently used switches: (you can use # in place of =)\n -dNOPAUSE           no pause after page   | -q       `quiet', fewer messages\n -g\u003cwidth>x\u003cheight>  page size in pixels   | -r\u003cres>  pixels/inch resolution\n -sDEVICE=\u003cdevname>  select device         | -c quit  (as the last switch)\n                                           |            exit after last file\n -sOutputFile=\u003cfile> select output file: - for stdout, |command for pipe,\n                                         embed %d or %ld for page #\nInput formats: PostScript PostScriptLevel1 PostScriptLevel2 PDF\nAvailable devices:\n   kwin vsc deskjet djet500 laserjet ljetplus ljet2p ljet3 ljet4 cdeskjet\n   cdjcolor cdjmono cdj550 pj pjxl pjxl300 bj10e bj200 bjc600 bjc800 mgrmono\n   mgrgray2 mgrgray4 mgrgray8 mgr4 mgr8 faxg3 faxg32d faxg4 pcxmono pcxgray\n   pcx16 pcx256 pcx24b pbm pbmraw pgm pgmraw pgnm pgnmraw pnm pnmraw ppm\n   ppmraw tiffcrle tiffg3 tiffg32d tiffg4 tifflzw tiffpack tiff12nc tiff24nc\n   psmono bit bitrgb bitcmyk pngmono pnggray png16 png256 png16m pdfwrite\n   nullpage\nSearch path:\n   . : /dd/etc/lib/gs4\nFor more information, see /use.txt.\nReport bugs to ghost@aladdin.com; use the form in new-user.txt."},"cat":"Printing","sub":"PostScript"},{"name":"gshell","desc":"GSHELL V1.1 -- a full-screen menu, not a command shell: a lettered list of the directory, `+' and `-' to page, `.' to change directory, a letter to run a file. `assembler', `compiler' and `editor' are the same engine pointed at one job each. DOC/README-SHELLS","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":23114,"docs":true,"hassrc":true,"howto":"A full-screen menu of the current directory: + and - page, . changes directory, a letter runs that file. Control-C leaves it.","help":{"cmd":"gshell -?","text":"Syntax: gshell [\u003cpath>]\nFunction: a menuedriven shell\nOptions:\n\t-c           no change of directory allowed\n\t-p           no optional parameter allowed\n\t-a           display Files beginning with '.'\n\t-m=\u003cname>    mask for File to select (\u003cname> may contain '*' and '?')\n\t-e[=\u003cfile>]  print error explanations"},"cat":"Shells","sub":"Shells"},{"name":"gtar","desc":"another build of GNU tar, taking the long +option spellings as well: `gtar +help' lists them","needs":[{"path":"/h0/etc/cmds/rsh","missing":true,"dir":false,"bytes":null},{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/REBUILT","size":113562,"hassrc":true,"help":{"cmd":"gtar +help","text":"This is GNU tar, the tape archiving program.\n/dd/CMDS/REBUILT/gtar: choose one of the following:\n-A, +catenate,\n    +concatenate\tappend tar files to an archive\n-c, +create\t\tcreate a new archive\n-d, +diff,\n    +compare\t\tfind differences between archive and file system\n+delete\t\t\tdelete from the archive (not for use on mag tapes!)\n-r, +append\t\tappend files to the end of an archive\n-t, +list\t\tlist the contents of an archive\n-u, +update\t\tonly append files that are newer than copy in archive\n-x, +extract,\n    +get\t\textract files from an archive\nOther options:\n-b, +block-size N\tblock size of Nx512 bytes (default N=4)\n-B, +read-full-blocks\treblock as we read (for reading 4.2BSD pipes)\n-C, +directory DIR\tchange to directory DIR\n-f, +file [HOSTNAME:]F\tuse archive file or device F (default /mt0)\n-F, +info-script F\trun script at end of each tape (implies -M)\n-G, +incremental\tcreate/list/extract old GNU-format incremental backup\n-g, +listed-incremental F create/list/extract new GNU-format incremental backup\n-h, +dereference\tdon't dump symlinks; dump the files they point to\n-i, +ignore-zeros\tignore blocks of zeros in archive (normally mean EOF)\n-k, +keep-old-files\tkeep existing files; don't overwrite them from archive\n-K, +starting-file FILE\tbegin at FILE in the archive\n-l, +one-file-system\tstay in local file system when creating an archive\n-L, +tape-length LENGTH change tapes after writing LENGTH\n-m, +modification-time\tdon't extract file modified time\n-M, +multi-volume\tcreate/list/extract multi-volume archive\n-N, +after-date DATE,\n    +newer DATE\t\tonly store files newer than DATE\n-o, +old-archive,\n    +portability\twrite a V7 format archive, rather than ANSI format\n-O, +to-stdout\t\textract files to standard output\n-p, +same-permissions,\n    +preserve-permissions extract all protection information\n-P, +absolute-paths\tdon't strip leading `/'s from file names\n+preserve\t\tlike -p -s\n-R, +record-number\tshow record number within archive with each message\n-s, +same-order,\n    +preserve-order\tlist of names to extract is sorted to match archive\n+same-order\t\tcreate extracted files with the same ownership\n-S, +sparse\t\thandle sparse files efficiently\n-T, +files-from F\tget names to extract or create from file F\n+totals\t\t\tprint total bytes written with +create\n-v, +verbose\t\tverbosely list files processed\n-V, +label NAME\t\tcreate archive with volume name NAME\n+version\t\tprint tar program version number\n-w, +interactive,\n    +confirmation\task for confirmation for every action\n-W, +verify\t\tattempt to verify the archive after writing it\n-X, +exclude FILE\texclude file FILE\n+exclude-from FILE\texclude files listed in FILE\n-z, -Z, +compress,\n    +uncompress      \tfilter the archive through compress\n-[0-7][lmh]\t\tspecify drive and density"},"cat":"Archives & compression","sub":"Alternates"},{"name":"gzip","desc":"GNU gzip 1.2.2: compresses a file to .gz and back again with -d; -l lists, -t tests, -1 to -9 trade speed for size","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":77778,"help":{"cmd":"gzip -h","text":"gzip 1.2.2 (17 Jun 93)\nusage: gzip [-acdfhlLnrtvV19] [-S suffix] [file ...]\n -a --ascii       ascii text; convert end-of-lines using local conventions\n -c --stdout      write on standard output, keep original files unchanged\n -d --decompress  decompress\n -f --force       force overwrite of output file and compress links\n -h --help        give this help\n -l --list        list .gz file contents\n -L --license     display software license\n -n --no-name     do not save or restore the original name\n -q --quiet       suppress all warnings\n -r --recurse     recurse through directories\n -S .suf  --suffix .suf     use suffix .suf instead of .gz\n -t --test        test compressed file integrity\n -v --verbose     verbose mode\n -V --version     display version number\n -1 --fast        compress faster\n -9 - es":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":24416,"star":true,"docs":true,"hassrc":true,"howto":"Hangman. Type a letter to guess it; the letters still unused are along the top. Control-C gets you out. Its word list is GAMES/dict.","help":{"note":"it takes no options"},"cat":"Games","sub":"Word & guessing"},{"name":"hc","desc":"shift text to a column, or label every line. `hc +8 f' indents f so the text starts at column 8; `hc -11 f' strips leading columns so it starts at column 11; `hc -l \"> \" f' puts that string in front of every line. With no option it copies the file through","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":17432,"hassrc":true,"help":{"cmd":"hc -?","text":"hc: unrecognized option=-?\nusage:  hc [-s] [+tab | -col | -l \"str\" | filename] ..."},"cat":"Text tools","sub":"Format & typeset"},{"name":"head","desc":"prints the first lines of a file: `head -n 20 file'. This GNU build wants -n 20, not -20","dir":"CMDS","size":25874,"howto":"First lines of a file. This GNU build wants `head -n 20 file' -- the older `head -20' form is rejected as an unrecognized option. Needs cio.","help":{"cmd":"head -?","text":"head: unrecognized option `-?'\nUsage: head [-b #] [-c #] [-n #] [-qv] [+blocks=#] [+bytes=#] [+lines=#]\n       [+quiet] [+silent] [+verbose] [file...]\n\n       head [-#bclqv] [file...]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"help","desc":"help system: `help \u003ctopic>' pages the topic's article from a .hlp file in SYS/HELP and then offers its subtopics; `help help' explains the format. bash has a help builtin of its own that answers first, so `enable -n help' there","src":"eff_help","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/HELP","needs":[{"path":"/dd/SYS/HELP","missing":false,"dir":true,"bytes":null}],"info":{"version":"1.0 Ed#3","purpose":"Extended on-line help for OS-9/68k","status":"first released version, final","language":"C","author":"Lukas Zeller","availability":"Public domain","conditions":"1. This Program may only be used for peaceful applications. I do NOT ALLOW using this program for anything that has to do with development, testing or manufacturing of weapons of any type. 2. This text as well as all copyright messages (in this file as well as in the source texts and the code files) must be retained. 3. When distributing this program, source code may or may not be included, but th","copyright":"HELP and HELPINDEX (c) 1989 by Lukas Zeller, CH-Maennedorf"},"dir":"CMDS","size":27726,"docs":true,"hassrc":true,"howto":"`help dinfo'. At bash type `enable -n help' first, or bash's own help builtin answers instead.","help":{"cmd":"help -?","text":"Syntax:   help [\u003copts>] [\u003ctopic> {\u003csubtopic>}] [\u003copts>]\nFunction: Provides help information.\nUsage:    Just type \"HELP\" to get a menu of available topics.\n          Type \"HELP \u003ctopic>\" to get information about a certain\n          topic. For extended information about the help utility\n          itself, type \"HELP help\".\nOptions:  -?           : Show this information\n          -r           : recursive search for specified topic\nV1.0, Ed#3 (c) 1989 by L.Zeller, CH-Maennedorf"},"cat":"Documentation","sub":"Help & pagers"},{"name":"helpindex","desc":"builds the .ndx index a .hlp help file needs: `helpindex dinfo.hlp' writes dinfo.ndx beside it","src":"eff_help","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/HELP","dir":"CMDS","size":4094,"star":true,"hassrc":true,"howto":"`helpindex dinfo.hlp' writes dinfo.ndx beside it. Only names ending .hlp or .hlib are accepted unless -a is given; with no name it asks for one.","help":{"cmd":"helpindex -?","text":"Syntax:   helpindex [\u003copts>] {\u003chelp file>} [\u003copts>]\nFunction: Creates index file for specified help files\n          Without the -a option, only files with names ending\n          in \".hlp\" and \".hlib\" will be processed. The index\n          file name will have the \".hlp\"/\".hlib\" replaced by\n          \".ndx\".\nOptions:  -a  : Process all files with no name restrictions.\nNote:     existing index files (\".ndx\") will be overwritten\nV1.0 (c) 1989 by L.Zeller"},"cat":"Documentation","sub":"Help & pagers"},{"name":"hexbin","desc":"decodes a BinHex file back into the Macintosh file it carried","dir":"CMDS","size":44082,"docs":true,"howto":"Decodes Macintosh BinHex (.hqx) files, which is how Mac software travelled by mail and BBS. binhex goes the other way; unsit opens StuffIt archives and macunpack opens PackIt ones. All trap-free. DOC/macutils has the package readme.","help":{"cmd":"hexbin -H","text":"File output options:\n-b:\tMacBinary (default)\n-s:\tMacBinary stream to standard output\n-f:\tthree fork mode, skipping empty forks\n-3:\tthe same, writing also empty forks\n-r:\tresource forks only\n-d:\tdata forks only\n-u:\tdata forks only with Mac -> Unix text file translation\n-U:\tas -u, but filename will not have an extension\n-a:\tnot supported, needs recompilation\nHexbin specific options:\n-i:\tgive information only, do not convert\n-l:\tgive listing\n-v:\tgive verbose listing, including lines skipped\n-c:\tdo not check for equal line lengths\n-n nm:\tname to be generated\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent conversion"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"hexed","desc":"a hex editor made of your text editor: it writes the file out as a hex dump, opens that in the editor `-e=' names (default vi), and writes the file back when you leave. `-t=\u003cdir>' says where the dump goes; without it, /r0 [no military use -- EFFO-INFO]","src":"eff_hexed","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/HEXED","info":{"version":"1.0","purpose":"hex-editor using standard texteditor","status":"final","hardware":"no hardware dependency","language":"C","author":"Helmut Hoheisel-Zimmermann, D-2300 Kiel 14","availability":"public","conditions":"no military use","copyright":"by H. Hoheisel-Zimmermann"},"dir":"CMDS","size":23780,"docs":true,"hassrc":true,"military":true,"howto":"`hexed -t=\u003cdir> -e=\u003ceditor> \u003cfile>': the file goes out as a hex dump into \u003cdir>, the editor opens it, and leaving the editor writes the file back. Without -t it uses /r0.","help":{"cmd":"hexed -?","text":"Syntax: hexed [\u003copts>] \u003cpath> {[\u003copts>] | [\u003cpath>]}\nFunction: dump, edit and retransform file(s) with binary data\nOptions:\n     -t=\u003cdir>       use \u003cdir> for temporary files (default: '/r0')\n     -e=\u003ceditor>    use \u003ceditor> as the texteditor (default: 'vi')\n     -eo=\u003copts>     use editor-\u003copts> (default: '')\n     -eg=\u003copts>     use editor-\u003copts> to go to specified line (default: '+')\n     -?             show this message\n\nFormat for dumped lines as generated by 'hexed':\n  bytecount         (optional) will not be interpreted by retransformation\n  blank(s)          (at least one blank, obligatory) as separator\n  hexdata bytes     (an arbitrary number) each of it consisting of one or two\n                    hex-digits; the bytes are separated by blank(s)\n  blank & ; & ASCII (optional) arbitrary comment or ASCII-representation\n\nAlternatively the following line format can be retransformed:\n  .a                inits ASCII-line\n  blank(s)          (optional) as separator\n  delimiter         arbitrary ASCII-character except blank as delimiter\n  ASCII-data        text without delimiter\n  delimiter & ASCII (optional, delimiter as defined above) arbitrary comment"},"cat":"Editors","sub":"Binary & hex"},{"name":"hexedit","desc":"HEXPERT V2.4, a hex viewer and editor: `hexedit \u003cfile>'. It reads TERMCAP as the capability string itself, not as the name of a file, so source `. /dd/SYS/termcap.entry' first and it draws its viewer; without that it prints the terminal type and exits. Its -d option reports `file not accessible' for a file that is readable","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":66726,"docs":true,"howto":"`hexedit \u003cfile>'. Put the termcap entry in TERMCAP first (`. /dd/SYS/termcap.entry') or it will not draw.","help":{"cmd":"hexedit -?","text":"hexedit: unrecognized option `-?'\nUsage: hex [-vdr] 'file'"},"cat":"Editors","sub":"Binary & hex"},{"name":"hinterhalt","desc":"a small maze game, in German: asked whether you need instructions (J/N) and told no, it draws the board -- walls, the player and a target","src":"forum7","origin":"Microware OS-9 archive","archive":"forum7.lzh","needs":[{"path":"/dd/sys/","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":10140,"star":true,"hassrc":true,"help":{"note":"it asks its question itself, in German (J/N)"},"cat":"System & modules","sub":"Utilities"},{"name":"hipstopgm","desc":"HIPS, the image-processing package's format, to PGM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45260,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"hist","desc":"a command-line editor with history, in front of the shell  [no military use -- EFFO-INFO]","src":"hist","origin":"EFFO forum","archive":"disk 14 SOFTWARE/C/HIST (H. Hoheisel-Zimmermann, Kiel)","info":{"version":"1.0","purpose":"C-shell-like history, commandline editing","status":"final","hardware":"ready to go for Steinmann & Frei's emulation of Wyse-50 terminal on mc68000; may be recompiled for original terminal driver of mc68000 with 2. makefile; may be adapted for any other system and terminal by editing the include files 'h_def.h' and 'h_edidef.h'.","language":"C","author":"Helmut Hoheisel-Zimmermann, D-2300 Kiel 14","availability":"public","conditions":"no military use","copyright":"by H. Hoheisel","restrictions":"chd (chx) using wildcards doesn't work"},"dir":"CMDS","size":27030,"docs":true,"hassrc":true,"military":true,"howto":"A command-line editor with history in front of the shell. On this console it prints a row of asterisks and returns at once.","help":{"note":"it takes no options"},"cat":"Shells","sub":"Shell helpers"},{"name":"hotel","desc":"hotel -- two-player board game, played by coordinates","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":50808,"star":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; q, Q, control-D and ESC do not. If it has a quit command of its own, its documentation in DOC/ will say.","help":{"note":"it takes no options"},"cat":"Games","sub":"Other games"},{"name":"hpcdtoppm","desc":"Kodak Photo CD image to PPM, at one of five resolutions","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":59106,"hassrc":true,"help":{"cmd":"hpcdtoppm","text":"Error in Arguments !\n\nUsage: hpcdtoppm [options] pcd-file [ppm-file]\n\nOpts:\n     -x Overskip mode (tries to improve color quality.)\n     -i Give some (buggy) informations from fileheader\n     -s Apply simple sharpness-operator on the Luma-channel\n     -d Show differential picture only\n\n     -r Rotate clockwise for portraits\n     -l Rotate counter-clockwise for portraits\n     -a Try to find out orientation automatically.\n        (Experimentally, please report if it doesn't work.)\n\n     -ycc suppress ycc to rgb conversion\n        (Experimentally, doesn't have deeper sense)\n\n     -0 Extract thumbnails from Overview file\n     -1 Extract  128x192  from Image file\n     -2 Extract  256x384  from Image file\n     -3 Extract  512x768  from Image file\n     -4 Extract 1024x1536 from Image file\n     -5 Extract 2048x3072 from Image file"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"i_am_i","desc":"prints its own source (Pascal)","dir":"CMDS","size":5206,"docs":true,"help":{"note":"it takes no options: run it and it prints itself"},"cat":"System & modules","sub":"Utilities"},{"name":"icontopbm","desc":"Sun icon to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":46786,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"if","desc":"conditional execution for a shell script: `if def \u003cvar>', `if loaded \u003cmodule>' or `if varval \u003cvar> \u003cvalue>', the commands, `else', `endif'.  It hands the branch to Microware's `shell' to run","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":17032,"hassrc":true,"howto":"bash's own `if' is a reserved word; `command if' reaches the one on this disk.","help":{"cmd":"if -?","text":"Syntax: if [not] \u003ccond> {\u003carg>} {\u003ccmd1>} [else {\u003ccmd2>}] endif\nFunction: if the [negated] condition \u003ccond> depending on the arguments\n          \u003carg> is true, then hand the commands \u003ccmd1> to the shell for\n          execution, else, if provided, \u003ccmd2>.\nConditions available:\n    def    \u003cvar>              true, if environment variable \u003cvar> is defined\n    loaded \u003cmod>              true, if module \u003cmod> is already loaded\n    varval \u003cvar> \u003cval>        true, if envir. variable \u003cvar> has value \u003cval>\nOptions:\n     (none)"},"cat":"Shells","sub":"Shell helpers"},{"name":"ifdef","desc":"resolve #ifdefs in C source","src":"ifdef","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C -- see DOC/EFFO-INFO","info":{"purpose":"Remove unwanted ifdefs from C source code","status":"final","language":"C","author":"Warren Toomey","availability":"Public"},"dir":"CMDS","size":17234,"docs":true,"hassrc":true,"help":{"cmd":"ifdef -?","text":"Syntax: ifdef [\u003copts>] [\u003cfile>] [\u003copts>]\nFunction: read C-source from \u003cfile> or stdin, remove #ifdefs and write\n    to stdout.\nOptions:\n    -t           print #define / #undef table\n    -Dsymbol     define symbol\n    -dsymbol     define symbol, can't be undefined\n    -Usymbol     undefine symbol\n    -Isymbol     ignore symbol\nAdapted to OS-9/68k by Hubert Nehring"},"cat":"Developer tools","sub":"Source formatting"},{"name":"ilbmtoppm","desc":"Amiga IFF ILBM to PPM, HAM and extra-halfbrite pictures included","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":57042,"hassrc":true,"help":{"cmd":"ilbmtoppm -?","text":"usage:  ilbmtoppm [-verbose] [-ignore \u003cchunkID>] [-isham|-isehb] [-adjustcolors] [ilbmfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"imgtoppm","desc":"Img-whatnot, a PC paint program's format, to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":51686,"hassrc":true,"howto":"Reads the Img Software Set (AT&T Image-8) format; gemtopbm reads GEM IMG. Feed it an Image-8 file.","help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"indent","desc":"reformat a C source program for readability","src":"indent","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C/INDENT (source unpacked from indent_src.lzh)","needs":[{"path":"/dd/SYS/","missing":false,"dir":true,"bytes":null}],"info":{"purpose":"reformat a C source program","status":"final","language":"C","author":"University of California,  Berkeley University of Illinois, Urbana Sun Microsystems, Inc.","availability":"Public"},"dir":"CMDS","size":40732,"docs":true,"hassrc":true,"help":{"cmd":"indent -?","text":"Syntax: indent [\u003copts>] [\u003cinpath> [\u003coutpath>]] [\u003copts>]\nFunction: reformat C programs for more readability\nOptions: a proceeding n turns the option off\n   -[n]bacc    blanklines around conditional compilation (default: on)\n   -[n]badp    blanklines after declarations of the first block (def.: on)\n   -[n]bad     blanklines after declarations (default: on)\n   -[n]bap     blanklines after procs (default: on)\n   -[n]bbb     blanklines before block commants (default: on)\n   -[n]bc      never break declarations after commas (default: on)\n   -bl         brace should not be on same line as if, while etc. (def.: on)\n   -br         brace should be on same line as if, while etc. (def.: on)\n   -[n]bs      blank after sizeof (default: on)\n   -[n]cdb     comment delimiter on blankline (default: on)\n   -cd[=]\u003cnum> set column in which comment after declarations should be\n               put (default: 0)\n   -[n]ce      else should cuddle up to '}' (default: on)\n   -ci[=]\u003cnum> set indentiation between the edge of code and\n               continuation lines (default: 0)\n   -cli[=]\u003cnum>   set case label indent level (default: 0)\n   -c[=]\u003cnum>  set column in which comments to the right of code should\n               start (default: 33)\n   -di[=]\u003cnum> set column to indent declared identifiers to (def.: 16)\n   -[n]dj      declarations should be left justified (default: off)\n   -d[=]\u003cnum>  comments not to the right of of code will be placed \u003cnum>\n               indentation levels to the left of code (default: 0)\n   -[n]eei     continuation lines from the expression part of 'if(e)',\n               'while(e)', 'for(e;e;e)' should be indented an extra tab\n               stop (default: on)\n   -[n]ei      'else if' pairs are handled specially (default: on)\n   -[n]fc1     comment which start in column 1 are to be magically\n               reformated (default: on)\n   -[n]ip      indent parameters (default: on)\n   -i[=]\u003cnum>  set size of one indentation level (default: 8)\n   -lc[=]\u003cnum> set maximum line lenght for comments (def.: '-l' - value)\n   -[n]lp      continued code whithin parentheses will be lined up to the\n               open parenthesis (default: on)\n   -l[=]\u003cnum>  set maximum line lenth (default: 78)\n   -[n]pcs     no space after fucntion name (default: off)\n   -npro       do not read '.indent.pro' file\n   -[n]psl     newline between type of the function and its name (def.: on)\n   -[n]ps      pointer as binop (default: on)\n   -[n]sc      comment continuation lines should have a star (def.: on)\n   -[n]sob     swallow optional blanklines (default: on)\n   -st         write to standard output\n   -[n]tab     use TAB-characters where possible (default: on)\n   -troff      generate input for 'troff' (default: off)\n               fonts for 'troff':\n   -fbc[=]\u003cfont>     block comment font (default: 'I2')\n   -fbx[=]\u003cfont>     box comment font (default: 'I2')\n   -fb[=]\u003cfont>      major body font (default: 'R'\n   -fc[=]\u003cfont>      same line comment font (default: 'I')\n   -fk[=]\u003cfont>      keyword font (default: 'B')\n   -fs[=]\u003cfont>      string font (default: 'L')\n   -T[=]\u003cstr>  add \u003cstr> as an declaration keyword to the keyword table\n   -[n]v       verbose mode (default: off)"},"cat":"Developer tools","sub":"Source formatting"},{"name":"inetd","desc":"the internet daemon: it listens on a port and hands the connection to `wn'.  It opens `/socket', so it needs a TCP/IP stack presenting that device; without one it gets as far as `tcp protocol unknown'.  `inetd' alone prints its usage","dir":"CMDS/WN","size":7306,"star":true,"howto":"The listener that hands incoming connections to wn. Needs a network.","help":{"cmd":"inetd -?","text":"inetd: Unix inetd emulation by I.Levinson\ninetd: Usage: inetd \u003cport> \u003cprog> {\u003cprog-options>}"},"cat":"Communications","sub":"Web server"},{"name":"inetdc","desc":"what inetd forks for each connection.  1626 bytes with no message strings; inetd runs it, not you","dir":"CMDS/WN","size":1626,"star":true,"help":{"note":"inetd forks it; it takes no options and carries no message text"},"cat":"Communications","sub":"Web server"},{"name":"infocom","desc":"an interpreter for Infocom's Z-machine, a third and unrelated adventure system: plays the .z3 files in GAMES/INFORM (dejavu, hellow, shell -- Inform demonstrations, not the Infocom games). It writes its status-line cursor codes as literal text; infocom.tcap is the build for a terminal","dir":"CMDS","size":42416,"howto":"A Z-machine. Plays the .z3 files in /dd/GAMES/INFORM -- the Inform demos dejavu, hellow and shell.","help":{"note":"it takes the story file and nothing else"},"cat":"Games","sub":"Adventure & fiction"},{"name":"infocom.tcap","desc":"Infocom interpreter, TERMCAP build -- and it is the one to use at a terminal.  It puts a proper status line at the top of the screen (`Y2 Rock Room     Score: 0/2') where plain `infocom' writes the cursor codes for that line as literal text down the left margin","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":46296,"howto":"The termcap build of the Z-machine, and the one to use at a terminal: `infocom.tcap /dd/GAMES/INFORM/dejavu.z3' keeps a status line (room and score) across the top lse,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":34502,"docs":true,"hassrc":true,"howto":"Interactive spelling checker. Takes a file: `ispell \u003cfile>'. `ispell -a' is the pipe interface programs use.","help":{"cmd":"ispell -?","text":"syntax: ispell {opts} {\u003cfile> {opts}}\nFunction: interactive spelling checker\nOptions:\n\t-a         use from program via pipe (see manual)\n\t-l         produce a list of misspelled words in file(s)\n\t-s         unknown... (seems to wreck -a option)\n\t-o=\u003cfile>  name of output file for -a option, if not stdout\n\t-u         produce a list of unique misspelled words in file(s)\n\t-z         get file names from standard input\n\t-z=\u003cpath>  get list of file names from \u003cpath>\nnote: your personal dictionary is kept in HOME/ispell.words"},"cat":"Text tools","sub":"Spelling & words"},{"name":"japan","desc":"the weather program on its north-Pacific profile, with the months of the Japanese calendar; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10738,"star":true,"hassrc":true,"howto":"A weather simulator on the Japanese calendar -- see `england'.","help":{"note":"it takes a number of years and nothing else"},"cat":"Amusements","sub":"Simulated weather"},{"name":"jargon","desc":"a browser for the Jargon File, the hackers' dictionary: `jargon -b word' opens at an entry; it reads jargon.txt and jargon.idx from VH on its own","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/vh","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":64554,"docs":true,"howto":"A browser for the Jargon File, which is here: VH/jargon.txt, version 3.0.0 of 27 July 1993, with its index. It will not read SYS/termcap -- do `. /dd/SYS/termcap.entry' first, then `jargon -m'.","help":{"cmd":"jargon -?","text":"usage: jargon [-cigmr] [-b key] [srcname] [indexname]"},"cat":"Text tools","sub":"Spelling & words"},{"name":"join","desc":"GNU join -- relational join of two sorted files","dir":"CMDS","size":35400,"docs":true,"help":{"cmd":"join -?","text":"join: unrecognized option `-?'\nUsage: join [-a 1|2] [-v 1|2] [-e empty-string] [-o field-list...] [-t char]\n       [-j[1|2] field] [-1 field] [-2 field] file1 file2"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"k","desc":"Kermit transfer","dir":"CMDS/COMMS","size":61600,"help":{"cmd":"k -?","text":"General Usage:\n   To send files:      K \u003cfile1> \u003cfile2> \u003cetc.>\n   To receive files:   K\n\nBy default, K will automatically guess the type of each file.\n   To treat all files as a certain type:\n     -A   All files are ASCII      -B   All files are Binary\n   To get debugging information: -d, -dd, etc.\n\nK uses the MODEM environment variable to determine the port\nto use.  If none is available, stdio paths will be used.\nThe -p\u003cport> option overrides the MODEM environment variable.\nHost mode: -h forces K to use stdio paths and suppresses all\nprogress and debug messages.  Equivalent to `unsetenv MODEM'.\n\nBased on \"The Working Programmer's Guide to Serial Protocols\"\nCopyright (C) 1995 Tim Kientzle and The Coriolis Group, Inc."},"cat":"Communications","sub":"Terminal & transfer"},{"name":"keep","desc":"take a program off this disk onto your own disk -- copies it and whatever DOC/DEPENDS says it needs, and records every file written.  `keep -n' shows what it would do without doing it.  See DOC/README-KEEP.","needs":[{"path":"/dd/SYS/kept","missing":true,"dir":false,"bytes":null},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":25218,"hassrc":true,"help":{"cmd":"keep -?","text":"keep 1.0 -- OS-9 freeware collection\n\nUsage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...\n       drop [-n] \u003cprogram>...\n       kept\n\n  keep   copy a program from this collection onto your own /dd,\n         together with the files DOC/DEPENDS says it reads.\n  drop   remove exactly what keep wrote, and NOTHING whose\n         contents have changed since.\n  kept   list what has been taken, and how much it came to.\n\n  -n     dry run: print what would happen, write nothing\n  -f     overwrite a file that is already there\n  -p \u003cd> put everything under \u003cd> instead of /dd\n  -q     leave out the notes about what was skipped\n  -s     take the SOURCE tree too, where there is one\n\nIf you mount this collection as /dd you do not need any of this;\nsee DOC/README-RUNNING."},"cat":"System & modules","sub":"Keeping and dropping"},{"name":"kept","desc":"list what has been taken, and how much it came to","needs":[{"path":"/dd/SYS/kept","missing":true,"dir":false,"bytes":null},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":24846,"help":{"cmd":"kept -?","text":"keep 1.0 -- OS-9 freeware collection\n\nUsage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...\n       drop [-n] \u003cprogram>...\n       kept\n\n  keep   copy a program from this collection onto your own /dd,\n         together with the files DOC/DEPENDS says it reads.\n  drop   remove exactly what keep wrote, and NOTHING whose\n         contents have changed since.\n  kept   list what has been taken, and how much it came to.\n\n  -n     dry run: print what would happen, write nothing\n  -f     overwrite a file that is already there\n  -p \u003cd> put everything under \u003cd> instead of /dd\n  -q     leave out the notes about what was skipped\n  -s     take the SOURCE tree too, where there is one\n\nIf you mount this collection as /dd you do not need any of this;\nsee DOC/README-RUNNING."},"cat":"System & modules","sub":"Keeping and dropping"},{"name":"kermit","desc":"OS-9 Kermit Version 1 Release 5: serial file transfer and terminal emulation by command letter -- connect, send, receive, host-server, get, quit. `ckermit' is the C-Kermit with a command language; DOC/README-KERMIT compares the six Kermits here","src":"kermit","origin":"usenet archive","archive":"kermit.ar","dir":"CMDS","size":26828,"docs":true,"hassrc":true,"help":{"cmd":"kermit -?","text":"OS-9 Kermit Version 1 Release 5\nUsage: kermit c[le line esc.char]   (connect mode)\nor:    kermit s[difl line] file ... (send mode)\nor:    kermit r[difl line]          (receive mode)\nor:    kermit h[difl line]          (Host server mode)\nor:    kermit g[difl line] file ... (get file from server)\nor:    kermit q[diful line]         (Quit remote Host server)"},"cat":"Communications","sub":"Kermit"},{"name":"kermit2","desc":"Kermit Program Version 1 Release 6 -- the same command letters as `kermit', 5K smaller.  DOC/README-KERMIT compares all six","dir":"CMDS","size":21998,"docs":true,"help":{"cmd":"kermit2 -?","text":"Kermit Program   Version 1    Release 6\nUsage:   kermit c[le line esc.char]         (connect mode)\nor:      kermit s[difl line] file ...       (send mode)\nor:      kermit r[difl line]                (receive mode)\nor:      kermit h[difl line]                (Host server mode)\nor:      kermit g[difl line] file ...       (get file from server)\nor:      kermit q[diful line]               (Quit remote Host servern"},"cat":"Communications","sub":"Kermit"},{"name":"kermit3","desc":"Kermit68K version 1.0.00, 01 July 1987 -- a DIFFERENT program from the other small ones: it puts up its own `Kermit68K>' prompt and reads a Kermit.ini, rather than taking command letters.","dir":"CMDS","size":18148,"docs":true,"help":{"note":"it takes its commands at its own `Kermit68K>' prompt, where `?' lists them, and from Kermit.ini"},"cat":"Communications","sub":"Kermit"},{"name":"kermit_cio","desc":"a relink of `kermit' against Microware's cio: the same program and command letters, in less space","dir":"CMDS/REBUILT","size":13294,"star":true,"help":{"cmd":"kermit_cio nfig, sets the environment for your terminal type -- and optionally a default PATH and emacs bindings -- then starts the shell you name on its command line. It does not put anything in the background","needs":[{"path":"/dd/sys/config.","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/config","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":8986,"star":true,"docs":true,"howto":"Says \"nothing to launch\" until it is configured -- see its documentation.","help":{"cmd":"launch -?","text":"launch v1.1 (c) M.C.Gregorie, 1994\n\nSyntax  : launch \u003copts> \u003cshell> [shellargs...]\nFunction: Set up login environmental factors dependant on the type\n          of terminal. A default PATH environment string can also\n          be set up. All values are defined in /dd/sys/config.\nOptions : -d  debug mode\n          -e  set up emacs bindings file from prototypes in /dd/sys\n          -i  initialise the terminal using the 'is' capability\n              for the terminal"},"cat":"System & modules","sub":"Processes & memory"},{"name":"lcasep","desc":"lower-case a name for mail","dir":"CMDS/UUCP","size":7074,"star":true,"help":{"cmd":"lcasep -?","text":"/dd/CMDS/UUCP/lcasep: illegal option -- ?\nusage: /dd/CMDS/UUCP/lcasep [-f file] [-o outfile]"},"cat":"Communications","sub":"Mail"},{"name":"less","desc":"pager: space or f for the next page, b for the one before, / to search, h for its help screen (SYS/less.hlp), q to leave. Reads the terminal from TERM and TERMCAP","needs":[{"path":"/dd/sys/less.hlp","missing":false,"dir":false,"bytes":7969},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":85580,"docs":true,"hassrc":true,"help":{"note":"`h' inside less is its zrgc012][w=\u003cdir>] archive_file [file...]\nFunction: Archive Management Utility\nCommands:                           Options:\n a   Add (create/replace) to archive q  quiet\n x,e EXtract from archive            v  verbose\n l,v List / Verbose List             n  not execute\n u   Update newer files to archive   f  force (over write at extract)\n d   Delete from archive             t  FILES are TEXT file\n m   Move to archive (means 'ad')    o  use LHarc compatible method (a/u)\n c   re-Construct new archive        w=\u003cdir> specify extract directory (x/e)\n p   Print to STDOUT from archive    d  delete FILES after (a/u/c)\n t   Test file CRC in archive        i  ignore directory path (x/e)\n                                     g  [Generic] format (for compatiblity)\n                                     0/1/2 header level (a/u)\n                                     c  bad CoCo OS-9 archive (x/l)\n                                     s  store - don't compress files (a/u)\n                                     z  get list of file from standard input\n                                     r  Recursive expansion of dirs (a/u)\n\nThe environment variable TMPDIR may be set to specify the directory used for\ncreating temporary files while archiving"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"lharc","desc":"C-LHarc 1.00, the older sibling of lha: a adds to a .lzh archive, x extracts, l lists, t tests","dir":"CMDS","size":55816,"docs":true,"help":{"cmd":"lharc -?","text":"C-LHarc for OS-9/68k Version 1.00   (C) 1989-1990 Y.Tagawa, Kai Uwe Rommel\n\nUsage: lharc {axevlufdmctp}[qnftv] archive_file [files or directories...]\n\nCommands:                    Options:\n  a   Append                   q   quiet\n  x,e EXtract                  n   no execute\n  v,l View/List                f   force (over write at extract)\n  u   Update                   t   files are TEXT files\n  f   Freshen                  p\u003cpager>  use file pager for p command\n  d   Delete\n  m   Move\n  c   re-Construct new archive\n  t   Test archive\n  p   Print to STDOUT"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"lharcs","desc":"C-LHarc 1.01, older than CMDS/lha 2.08","dir":"CMDS/REBUILT","size":51966,"help":{"cmd":"lharcs -?","text":"C-LHarc for OS-9/68k Version 1.01   (C) 1989-1991 Y.Tagawa, Kai Uwe Rommel,\n                                                  Knut G. Grunwald\n\nUsage: lharcs {axevlufdmctp}[qnftv] archive_file [files or directories...]\n\nCommands:                    Options:\n  a   Append                   q   quiet\n  x,e EXtract                  n   no execute\n  v,l View/List                f   force (over write at extract)\n  u   Update                   t   files are TEXT files\n  f   Freshen                  p\u003cpager>  use file pager for p command\n  d   Delete                   g   generic attribute\n  m   Move\n  c   re-Construct new archive\n  t   Test archive\n  p   Print to STDOUT"},"cat":"Archives & compression","sub":"Alternates"},{"name":"liborder","desc":"order the modules in an OS-9 library -- give it one. On alib.l and the other libraries here it works. Handed a plain file instead it reads a length from what it takes to be a relocatable-object header and asks for that many bytes, which floods `No more memory !!!'.","src":"eff_libutils","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/LIBUTILS","dir":"CMDS","size":7538,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"liborder -?","text":"liborder: Unimplemented option '-?'.\n\nUsage: liborder \u003coptions> file1.r file2.r ...\nProduces an ordered list of the input modules to build OS-9 libraries.\n Where options are:\n   '-modinfo':\tprint info about each module (PUBLIC and EXTERNAL)\n   '-public':\tlist all PUBLIC functions\n   '-external':\tlist all EXTERNAL functions\n   '-preced':\tlist precedences between modules\n   '-precsymb':\tlist cross referenced symbols\n   '-lump':\tprint the set of fundamental cycles (need to be grouped)\n   '-exit':\tdo not perform ordering, print info only\nCopyright by CERN, written by CN/CE/MS (Vers.2.1 - 13 July 90)"},"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"liborder.os9","desc":"report the order of modules in a library","dir":"CMDS","size":20850,"help":{"cmd":"liborder.os9 -?","text":"liborder: Unimplemented option '-?'.\n\nUsage: liborder \u003coptions> file1.r file2.r ...\nProduces an ordered list of the input modules to build OS-9 libraries.\n Where options are:\n   '-modinfo':\tprint info about each module (PUBLIC and EXTERNAL)\n   '-public':\tlist all PUBLIC functions\n   '-external':\tlist all EXTERNAL functions\n   '-preced':\tlist precedences between modules\n   '-precsymb':\tlist cross referenced symbols\n   '-lump':\tprint the set of fundamental cycles (need to be grouped)\n   '-exit':\tdo not perform ordering, print info only\nCopyright by CERN, written by CN/CE/MS (Vers.3.0 - 24 July 90)"},"cat":"System & modules","sub":"Utilities"},{"name":"Libr2Ascii","desc":"Home Librarian: dumps a catalogue to plain text on standard output, `Libr2Ascii -infile cat.libr', in the form Ascii2Libr reads back","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":129614,"hassrc":true,"howto":"`-infile cat.libr' with a space. It writes the catalogue to standard output as text, and a page count and four index-key counts at the end -- all zero means the catalogue is empty.","help":{"cmd":"Libr2Ascii -?","text":"Syntax: Libr2Ascii [opts]\nConvert a Librarian Card Catalog file to a plain ASCII text file.\nOutput is sent to stdout.\nOptions:\n-infile\tString Required Input file\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"Librarian","desc":"Home Librarian: search a catalogue. Six programs and their docs travel together -- its licence requires it","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":161092,"hassrc":true,"howto":"One of six Home Librarian programs that must stay together -- its licence says so. Start here to search a catalogue; EditLibr edits one, Ascii2Libr builds one from text, Libr2Ascii dumps it back, PrintCards and PrintLabels print it. Manual in DOC/homelibr.","help":{"cmd":"Librarian -?","text":"Syntax: Librarian [opts]\nLibrarian Card Catalog query program\nThis program is used to search a Card Catalog file\nOptions:\n-infile\tString Required The name of the file to search\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"libsplit","desc":"Split a linker library into its component modules","dir":"CMDS","size":39248,"help":{"cmd":"libsplit -?","text":"Syntax   : [\u003copts>] {\u003clibrary>} [\u003copts>]\nFunction : Splits a new Type Library into ROF files.\n           Each psect is written to a ROF file.\nOptions  : -@  turn on Debug output\n           -r  overwrite an existing ROF file\n(C) 1998 by Michael Lamparth"},"cat":"Developer tools","sub":"Libraries"},{"name":"life","desc":"Conway's Game of Life","src":"life","origin":"hc disk","archive":"SOURCES/USENET/life.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":33246,"docs":true,"hassrc":true,"howto":"life [init-file]. The patterns are in /dd/GAMES/LIFE -- try `life /dd/GAMES/LIFE/glider`. It also wants more memory than the default; from the OS-9 shell that is `life #22k \u003cfile>`, and bash has no #size syntax at all.","help":{"note":"it takes a pattern file and nothing else"},"cat":"Screen toys","sub":"Screen toys"},{"name":"lispmtopgm","desc":"Lisp machine bitmap
