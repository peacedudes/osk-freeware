:"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":3558,"star":true,"hassrc":true,"howto":"Answers four prompts and prints the schedule for the whole term; pipe it through head or less.","help":{"note":"it asks its four questions itself; there is no help flag"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"logisim","desc":"logic circuit simulator -- draws a pulse diagram, a row per node and a column per step, from a circuit written as text. Two sample circuits ship with it, DOC/logisim/counter.lsi and flipflop.lsi, and its notes are DOC/logisim/logisim.doc, in German. It needs `PORT' set to a terminal path, `setenv PORT /term', because it reopens the keyboard through it; Esc stops the run","src":"eff_logisim","origin":"EFFO forum","archive":"disk 14  SOFTWARE/C/LOGISIM","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"info":{"purpose":"Simulation of logical circuits","status":"experimental","language":"C","author":"Hubert Nehring","availability":"Public"},"dir":"CMDS","size":23660,"docs":true,"hassrc":true,"howto":"Set PORT first: `setenv PORT /term'. Without it, `logisim: Environment variable PORT not defined' -- it reopens the keyboard through that path. Two sample circuits ship in DOC/logisim (counter.lsi, flipflop.lsi) and its notes are there too, in German.","help":{"cmd":"logisim -?","text":"Syntax: logisim [opts] filename [opts]\nFunction: Simulates logical circuit described by filename\nOptions:\n    -i  shows instable states"},"cat":"Maths & calculators","sub":"Simulators"},{"name":"logname","desc":"Print your login name (GNU)","needs":[{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":16220,"star":true,"help":{"cmd":"logname --help","text":"Usage: logname [OPTION]...\n\n  --help      display this help and exit\n  --version   output version information and exit"},"cat":"Shells","sub":"Shell utilities"},{"name":"lorenz3d","desc":"Tektronix demo: the Lorenz attractor in 3D","src":"tekdemos","origin":"Microware OS-9 archive","archive":"TekDemos.t.Z","dir":"CMDS/GAMES","size":5926,"star":true,"hassrc":true,"help":{"note":"it asks for its parameters itself; there is no help flag"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"lout","desc":"Lout 2.05 document formatter","needs":[{"path":"/h0/LOUT2/LIB/font","missing":true,"dir":false,"bytes":null},{"path":"/h0/LOUT2/LIB/evec","missing":true,"dir":false,"bytes":null},{"path":"/h0/LOUT2/LIB/data","missing":true,"dir":false,"bytes":null},{"path":"/h0/LOUT2/LIB/include","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":561302,"docs":true,"hassrc":true,"help":{"cmd":"lout -u","text":"usage: lout [ -i\u003cfilename> ] files"},"cat":"Text tools","sub":"Format & typeset"},{"name":"lp","desc":"submits a file to the lp print spooler: -n=xx makes copies, -d=ptr picks the printer, -m mails you when it is done","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":6580,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"lp -?","text":"Syntax: lp [\u003copts>] {\u003cpath>}\nOptions:\n       -z     get file names from standard input\n       -w     message on terminal when ready\n       -m     mail to user when ready\n       -n=xx  make xx copies (default 1)\n       -d=ptr output on device ptr\n       -s     silentmode"},"cat":"Printing","sub":"Spooling"},{"name":"lpq","desc":"shows the spooler queue. It looks for a data module called `spoolqueue' in memory; with a spooler running it reports the queue, and without one answers `no spooler installed'. Same for `prjob' and `lp'.","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":5938,"star":true,"hassrc":true,"help":{"cmd":"lpq -?","text":"Syntax: lpq [-p=dev] [user]\nFunction: shows spoolerqueue\nOptions:\n       -d=dev     shows queue of printer dev"},"cat":"Printing","sub":"Spooling"},{"name":"lprm","desc":"remove a job from the print queue","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":4908,"star":true,"hassrc":true,"help":{"cmd":"lprm -?","text":"Syntax: lprm [-d=dev] [-] job..\nFunction: delete job from spoolerqueue\nOptions:\n       -          deletes all entries\n       -d=dev     take queue of printer dev"},"cat":"Printing","sub":"Spooling"},{"name":"lpsched","desc":"starts the lp print spooler on a printer device; -r restarts it","needs":[{"path":"/dd/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":6738,"star":true,"help":{"cmd":"lpsched -?","text":"Syntax: lpsched [-r] {\u003cdevname>}\nFunction:  starts Printerspooler\nOptions:\n       -r    restarts spooler"},"cat":"Printing","sub":"Spooling"},{"name":"lpshut","desc":"shut down the printer scheduler","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":4106,"star":true,"hassrc":true,"help":{"cmd":"lpshut -?","text":"Syntax: lpshut\nFunction:  stops Printerspooler"},"cat":"Printing","sub":"Spooling"},{"name":"ls","desc":"GNU ls (fileutils 3.13) -- a real stat(), columns, and `-al'","dir":"CMDS","size":46916,"hassrc":true,"help":{"cmd":"ls --help","text":"Usage: ls [OPTION]... [FILE]...\nList information about the FILEs (the current directory by default).\nSort entries alphabetically if none of -cftuSUX nor --sort.\n\n  -A, --almost-all           do not list implied . and ..\n  -a, --all                  do not hide entries starting with .\n  -B, --ignore-backups       do not list implied entries ending with ~\n  -b, --escape               print octal escapes for nongraphic characters\n  -C                         list entries by columns\n  -c                         sort by change time; with -l: show ctime\n      --color[=WHEN]         control whether color is used to distinguish file\n                               types.  WHEN may be `never', `always', or `auto'\n  -D, --dired                generate output designed for Emacs' dired mode\n  -d, --directory            list directory entries instead of contents\n  -F, --classify             append a character for typing each entry\n  -f                         do not sort, enable -aU, disable -lst\n      --format=WORD          across -x, commas -m, horizontal -x, long -l,\n                               single-column -1, verbose -l, vertical -C\n      --full-time            list both full date and full time\n  -G, --no-group             inhibit display of group information\n  -g                         (ignored)\n  -I, --ignore=PATTERN       do not list implied entries matching shell PATTERN\n  -i, --inode                print index number of each file\n  -k, --kilobytes            use 1024 blocks, not 512 despite POSIXLY_CORRECT\n  -L, --dereference          list entries pointed to by symbolic links\n  -l                         use a long listing format\n  -m                         fill width with a comma separated list of entries\n  -N, --literal              print raw entry names (don't treat e.g. control\n                               characters specially)\n  -n, --numeric-uid-gid      list numeric UIDs and GIDs instead of names\n  -o                         use long listing format without group info\n  -p                         append a character for typing each entry\n  -Q, --quote-name           enclose entry names in double quotes\n  -q, --hide-control-chars   print ? instead of non graphic characters\n  -R, --recursive            list subdirectories recursively\n  -r, --reverse              reverse order while sorting\n  -S                         sort by file size\n  -s, --size                 print block size of each file\n      --sort=WORD            ctime -c, extension -X, none -U, size -S,\n                               status -c, time -t\n      --time=WORD            atime -u, access -u, use -u\n  -T, --tabsize=COLS         assume tab stops at each COLS instead of 8\n  -t                         sort by modification time; with -l: show mtime\n  -U                         do not sort; list entries in directory order\n  -u                         sort by last access time; with -l: show atime\n  -w, --width=COLS           assume screen width instead of current value\n  -x                         list entries by lines instead of by columns\n  -X                         sort alphabetically by entry extension\n  -1                         list one file per line\n      --help                 display this help and exit\n      --version              output version information and exit\n\nBy default, color is not used to distinguish types of files.  That is\nequivalent to using --color=none.  Using the --color option without the\noptional WHEN argument is equivalent to using --color=always.  With\n--color=auto, color codes are output only if standard output is connected\nto a terminal (tty)."},"cat":"Files & directories","sub":"List & navigate"},{"name":"lua","desc":"Lua 3.0, a small scripting language. `lua \u003cfile>' runs a script -- `lua hello.lua' in DOC/lua/examples prints hello world -- and with no file it reads one from standard input; -v prints the version. Eight example scripts are in DOC/lua/examples. luac compiles a script to bytecode, and to an OS-9 module that runc starts","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","needs":[{"path":"/dd/CMDS","missing":false,"dir":true,"bytes":null},{"path":"/dd/cmds/shell","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":81082,"docs":true,"hassrc":true,"howto":"`lua cf.lua' in DOC/lua/examples prints a temperature table; `lua hello.lua' says hello. Eight example scripts are there; -v prints the version.","help":{"note":"it takes a script file, or reads one from standard input; -v prints its version, and there is no help flag"},"cat":"Languages","sub":"Interpreters"},{"name":"luac","desc":"Lua bytecode compiler: `luac -o out.lc in.lua'; -l lists the instructions as it compiles, -x compiles into an OS-9 module in the execution directory for runc to start","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","dir":"CMDS","size":63022,"star":true,"hassrc":true,"howto":"`luac -l -o hello.lc hello.lua' compiles and lists the bytecode. `luac -x -o name script.lua' makes an OS-9 module in the execution directory for runc.","help":{"cmd":"luac -?","text":"usage: luac [-c | -u] [-d] [-l] [-p] [-q] [-v] [-o output] file ...\n -c\tcompile (default)\n -u\tundump\n -d\tgenerate debugging information\n -l\tlist (default for -u)\n -o\toutput file for -c (default \"luac.out\")\n -p\tparse only\n -q\tquiet (default for -c)\n -m\tgenerate OS-9 I-CblCode module\n -x\tput module into default execution directory(includes -m)\n -v\tshow version information"},"cat":"Languages","sub":"Interpreters"},{"name":"lunisolar","desc":"the phase of the moon in one line; given a year and a time zone it writes a whole lunisolar calendar as LaTeX instead","src":"forum16","origin":"Microware OS-9 archive","archive":"forum16.lzh","dir":"CMDS","size":7958,"star":true,"hassrc":true,"help":{"cmd":"lunisolar -?","text":"Bad args: lunisolar -?\nUsage: lunisolar\ngives the phase of the moon,\nand: lunisolar \u003cyear> \u003ctime_zone>\ngenerates a lunisolar calendar for LaTeX.\nTime zone may be one of:\nGMT\tNST\tAST\tEST\tCST\nMST\tPST\tYST\tHST\tBST\nJST"},"cat":"Time & calendar","sub":"Astronomy"},{"name":"lwf","desc":"ASCII to PostScript, like Unix enscript.  Reads its prologue from /dd/USR/LIB/lwf.prologue","needs":[{"path":"/dd/usr/lib/lwf.prologue","missing":false,"dir":false,"bytes":565},{"path":"/dd/cmds/pr","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":41102,"docs":true,"hassrc":true,"howto":"Turns plain text into PostScript, the way Unix enscript does. It reads /dd/USR/LIB/lwf.prologue and stops without it. No PostScript printer here, so send the output to a file and take it elsewhere.","help":{"cmd":"lwf -?","text":"Usage: lwf [-d] [-i#] [-l] [-m] [-olist] [-p[str]] [-r] [-s#] [-t#] [-v] [-S] [file ...]"},"cat":"Printing","sub":"PostScript"},{"name":"m4","desc":"m4 macro processor.  It expands macros correctly, from a file or a pipe","src":"eff_m4b","origin":"usenet archive","archive":"eff_m4b.ar","needs":[{"path":"/dd/tmp/m4.","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":39086,"docs":true,"hassrc":true,"help":{"cmd":"m4 -?","text":"Syntax   : m4 [\u003copts>] [\u003cfiles>]\nFunction : a simple macro processor\nOptions  :\n   -e          interactive mode\n   -V          print version info\n   -s          generate sync lines\n   -d\u003clevel>   set debug level\n   -H\u003csize>    set hashtable size\n   -G          disable GNU extensions\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"m4_0.5","desc":"a second build of the m4 macro processor, kept under its version number","needs":[{"path":"/dd/tmp/m4.","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/REBUILT","size":39094,"star":true,"help":{"cmd":"m4_0.5 -?","text":"Syntax   : m4 [\u003copts>] [\u003cfiles>]\nFunction : a simple macro processor\nOptions  :\n   -e          interactive mode\n   -V          print version info\n   -s          generate sync lines\n   -d\u003clevel>   set debug level\n   -H\u003csize>    set hashtable size\n   -G          disable GNU extensions\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Compilers & build","sub":"Alternates"},{"name":"macbin","desc":"wraps a file in MacBinary, the form a Macintosh file with two forks travels in; -t and -c set its type and creator, and -d unwraps","dir":"CMDS","size":20224,"docs":true,"help":{"cmd":"macbin -?","text":"MacBinary file converter version 1.1\nUsage  :   Converts files to MacBinary format\nSyntax :   macbin [-vdtc?] \u003cfile 1> [\u003cfile 2>]\n\nOptions:\n       -v           verbose\n       -d           deconvert\n       -t=\u003ctype>    set file type to \u003ctype>\n       -c=\u003ccreator> set file creator to \u003ccreator>\n\nNote:  \u003ccreator> and \u003ctype> are 4 characters long,\n       the defaults are: \u003ctype>=TEXT, \u003ccreator>=OS-9"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macptopbm","desc":"MacPaint to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":47570,"hassrc":true,"help":{"cmd":"macptopbm -?","text":"usage:  macptopbm [-extraskip N] [macpfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"macsave","desc":"unpack MacBinary files from standard input into `.bin' files in the current directory, making subdirectories for embedded folders.  It writes silently, as its manual page says.  `macbin' is the translator that makes a MacBinary file.  DOC/macsave/macsave.1.","dir":"CMDS","size":31650,"docs":true,"howto":"Its silence is correct and documented: DOC/macsave/macsave.1 says it \"reads standard input and silently writes the file(s) it contains\". `macbin' makes the MacBinary it wants, and the pair round-trips.","help":{"cmd":"macsave -H","text":"File output options:\n-b:\tMacBinary (default)\n-f:\tthree fork mode, skipping empty forks\n-3:\tthe same, writing also empty forks\n-r:\tresource forks only\n-d:\tdata forks only\n-u:\tdata forks only with Mac -> Unix text file translation\n-U:\tas -u, but filename will not have an extension\n-a:\tnot supported, needs recompilation\nMacsave specific options:\n-i:\tgive information only, do not save\n-l:\tgive listing\n-q:\tquery for every file/folder before saving\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent saving"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macstream","desc":"Read a MacTerminal file stream.  It measures the file before it reads it and answers `Short file \u003cname>' for anything too small to be one","dir":"CMDS","size":29398,"docs":true,"help":{"cmd":"macstream -H","text":"File input options:\n-r:\tread as resource files\n-d:\tread as data files\n-u:\tread as data files with Unix -> Mac text file translation\n-U:\ta synonym for -u\n-c cr:\tcreator if one of the above options is used\n-t ty:\tfiletype if one of the above options is used\nMacstream specific options:\n-i:\tgive information only, do not write\n-l:\tgive listing\n-q:\tquery for every file/folder before writing\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent writing"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macunpack","desc":"opens PackIt archives from a Macintosh","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":53208,"docs":true,"help":{"cmd":"macunpack -H","text":"File output options:\n-b:\tMacBinary (default)\n-s:\tMacBinary stream to standard output\n-f:\tthree fork mode, skipping empty forks\n-3:\tthe same, writing also empty forks\n-r:\tresource forks only\n-d:\tdata forks only\n-u:\tdata forks only with Mac -> Unix text file translation\n-U:\tas -u, but filename will not have an extension\n-a:\tnot supported, needs recompilation\nMacunpack specific options:\n-i:\tgive information only, do not unpack\n-l:\tgive listing\n-v:\tgive verbose listing\n-q:\tquery for every file/folder before unpacking\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent unpacking"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"mail","desc":"a simple mail sender","needs":[{"path":"/DD/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/DD/MAIL/xxxxxxxxxxxxxxxx","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/UUCP","size":11022,"star":true,"help":{"note":"it takes a recipient and reads the message on standard input; there is no help flag"},"cat":"Communications","sub":"Mail"},{"name":"mailx","desc":"the mail reader and sender","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/UUCP","size":41458,"star":true,"hassrc":true,"help":{"cmd":"mailx -?","text":"mailx v2.1 (94Sep30)  --send and receive e-mail\n\n mail [-r]                                        ...read mail\n      opt:  r                   -read mail in reverse order\n\n mail [opts] [\u003caddress>...] [opts]                ...send mail\n      opts: a \u003cfile>            -file replying to\n            s \"subject\"         -Subject: \"subject\"\n            x N                 -N = debug level\n            d                   -don't add .signature\n            n                   -use .alt_signature\n            p                   -don't prompt for carbon copy (Cc:)\n            q                   -work quietly when sending mail\n            ?                   -this message\n            v                   -toggle file viewer...default OFF\n            c [\u003cuser>...]       -check for our waiting mail and that of user\n\nThis is free software released under the GNU General Public License.  PleasePlease send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"Mail"},{"name":"make","desc":"make -- maintains a target. Two rules catch people: a command line must begin with a TAB (which will not survive being typed at this terminal, so copy DOC/make/demo.mk rather than echoing one), and a recipe must have no shell metacharacter -- `cp a b' runs, `cat a > b' gets `That path name doesn't lead to a file'.  DOC/STATUS has both","src":"eff_make","origin":"usenet archive","archive":"eff_make.ar","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":14522,"star":true,"docs":true,"hassrc":true,"howto":"It works. Copy `/dd/DOC/make/demo.mk` rather than writing a makefile at the shell -- a command line must begin with a TAB and a tab does not survive being typed at this terminal. And keep shell metacharacters out of a recipe: `cp a b` runs, `cat a > b` gets \"That path name doesn't lead to a file\", because make forks bash with the line as a PATHNAME rather than with -c. The default rules are in default.mk beside it, and make looks for that along your PATH.","help":{"cmd":"make -?","text":"Syntax :\tmake {[-f \u003cmakefile>] [-dDinrst] [\u003ctarget>] [\u003cmacro>=\u003cvalue>]}\nFunction :\tmaintain, update & regenerate groups of files\nOptions :\n\t-?\t\t\tdisplay this help text\n\t-f makefile\tuse the description file 'makefile'\n\t\t\t\t(- denotes stdin) of which several can be given\n\t-d\t\t\tdisplay reasons why to rebuild a target\n\t-dd\t\t\tdisplay dependencies and processing in detail\n\t-D\t\t\tdisplay makefiles read in\n\t-DD\t\t\tdisplay makefiles and 'default.mk' read in\n\t-i\t\t\tignore error codes of commands (same as .IGNORE)\n\t-n\t\t\tprint but don't execute commands (except $(MAKE) references)\n\t-r\t\t\tdon't read in default file\n\t-s\t\t\tdon't print command lines (same as .SILENT)\n\t-t\t\t\ttouch files rather than executing commands\n\tmacro=value\tmacro definition"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"makecrc","desc":"generates C source for CRC tables. It takes no arguments: run it somewhere writable and it writes six files into the data directory -- arc.c, binhex.c, ccitt.c, ccitt32.c, kermit.c and zip.c -- each holding a crctab[256] and an updcrc() for one polynomial. It writes them without a message, so list the directory afterwards. For a CRC of a file, `chksum' does that","dir":"CMDS","size":15968,"howto":"It GENERATES C SOURCE and takes no arguments. Run it somewhere writable (`ksh -c \"cd /dd/tmp; makecrc\"') and it writes six files -- arc.c, binhex.c, ccitt.c, ccitt32.c, kermit.c, zip.c -- each a crctab[256] and an updcrc(). It writes them without a message, so list the directory afterwards.","help":{"note":"it takes no options and writes its six files in the data directory"},"cat":"System & modules","sub":"Utilities"},{"name":"makedb","desc":"build smail's path-alias dbm: `makedb -o \u003cname> \u003cfile>' writes \u003cname>.dir and \u003cname>.pag.  /dd/USR/LIB/SMAIL/palias is the source it defaults to","src":"philmail","origin":"Microware OS-9 archive","archive":"philmail.lzh","needs":[{"path":"/dd/usr/lib/smail/palias","missing":false,"dir":false,"bytes":125},{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS/UUCP","size":23088,"hassrc":true,"help":{"cmd":"makedb -?","text":"/dd/CMDS/UUCP/makedb: illegal option -- ?\n/dd/CMDS/UUCP/makedb [-o dbmname] [-a] [file ...]"},"cat":"Communications","sub":"Mail"},{"name":"makeinfo","desc":"GNU makeinfo -- Texinfo to info","src":"makeinfo_src","origin":"Microware OS-9 archive","archive":"-- 75 of the binary's own strings","dir":"CMDS","size":66804,"hassrc":true,"help":{"cmd":"makeinfo -?","text":"makeinfo: unrecognized option `-?'\nUsage: makeinfo [options] texinfo-file...\n\nThis program accepts as input files of texinfo commands and text\nand outputs a file suitable for reading with GNU Info.\n\nThe options are:\n`+no-validate' to suppress node cross reference validation.\n`+no-warn' to suppress warning messages (errors are still output).\n`+no-split' to suppress the splitting of large files.\n`+verbose' to print information about what is being done.\n`+version' to print the version number of Makeinfo.\n`+paragraph-indent NUM' to set the paragraph indent to NUM (default 3).\n`+fill-column NUM' to set the filling column to NUM (default 72).\n`+error-limit NUM' to set the error limit to NUM (default 100).\n`+reference-limit NUM' to set the reference warning limit to NUM (default 1000).\n`+footnote-style STYLE' to set the footnote style to STYLE.  STYLE should\n  either be `MN' for `make node', or `BN' for `bottom node'."},"cat":"Compilers & build","sub":"Make & generators"},{"name":"makelex","desc":"compiles sonnet's lex.data word list into a C array","dir":"CMDS","size":2858,"star":true,"help":{"note":"a filter with no options: the word list on standard input, the C array out; given a file name it opens that instead"},"cat":"Text tools","sub":"Spelling & words"},{"name":"maketexpk","desc":"generate a .pk font at the size TeX asked for","needs":[{"path":"/dd/sys/tex/fonts","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/TEXCMDS","size":16994,"howto":"It carries the RIGHT Metafont line in its own strings and then reaches for `makdir', `del' and `attr' to file the result -- three Microware utilities that are not here. Run the virmf line yourself: DOC/README-METAFONT has it, and `gftopk' is all maketexpk was going to do afterwards.","help":{"note":"it takes a font name, a resolution and a mode; there is no help flag"},"cat":"Text tools","sub":"TeX"},{"name":"map","desc":"show the disk blocks a file occupies, sector by sector: `map \u003cfile>', or `map -e \u003cfile>' for the extended form. For memory rather than disk, see `mfree' and `free'","dir":"CMDS","size":3490,"star":true,"docs":true,"help":{"cmd":"map -?","text":"Syntax: map [\u003copts>] \u003cfile> {\u003cfile>}\nFunction: shows blocks used by a file\nOptions:\n\t-e     extended map listing"},"cat":"System & modules","sub":"Utilities"},{"name":"marc","desc":"MARC, the archive MERGER -- `marc \u003ctarget> \u003csource> [names]' copies members from one .arc into another","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":32706,"help":{"cmd":"marc -?","text":"MARC - archive merger, Version 5.21, created on 04/22/87 at 15:05:10\nUsage: MARC \u003ctgtarc> \u003csrcarc> [\u003cfilename> . . .]\nWhere: \u003ctgtarc> is the archive to add files to,\n       \u003csrcarc> is the archive to get files from, and\n       \u003cfilename> is zero or more file names to get.\n\nadapted to OS-9/68k by Stephan Paschedag"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"math","desc":"Microware's floating-point trap module (software)","dir":"CMDS","size":7798,"help":{"note":"Microware's maths trap handler, not a program"},"cat":"System & modules","sub":"Microware runtime"},{"name":"math881","desc":"the same, using a 68881/68882 coprocessor.  Both register as the module `math'; load whichever suits your machine.","dir":"CMDS","size":3220,"help":{"note":"Microware's maths trap handler for the 68881, not a program"},"cat":"System & modules","sub":"Microware runtime"},{"name":"maze","desc":"maze generator, small enough to have won an obfuscated-C contest.  It reads the number of rows on standard input and draws a maze that wide: `echo 11 | maze'","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS/GAMES","size":17776,"hassrc":true,"howto":"Reads the number of rows on standard input: `echo 11 | maze' draws a maze eleven rows deep.","help":{"note":"it reads the number of rows on standard input and takes no options"},"cat":"Games","sub":"Puzzles"},{"name":"mcvert","desc":"converts between MacBinary and BinHex either way: -U makes the BinHex for uploading, -D takes it back to MacBinary for downloading","dir":"CMDS","size":30966,"docs":true,"help":{"cmd":"mcvert -?","text":"Mcvert V1.05 By Doug Moore\nOSK Port by Dean Leiber\n\nUsage: Mcvert [-rduxh] [DUpqsv] filename(s)\n Options:\n          -r = Resource Fork Only\n          -d = Data Fork Only\n          -u = Mac \u003c-> Unix Text Conversion\n          -x = Convert [*Default*]\n          -h = Host\n Modifiers:\n          -D = Conversion for Download (BinHex -> Macbinary) [*Default*]\n          -U = Conversion for Upload   (Macbinary -> BinHex)\n          -p = PackIT (.PIT) File explode\n          -q = No PIT extraction [*Default*]\n          -s = Silent\n          -v = Verbose [*Default*]\n Enviromental Vars:\n MAC_EDITOR     [Default = MACA]  - For Option \"-uD\"\n MAC_DLOAD_DIR  [Default = \".\" ]  - Dir for \"-D\"\n MAC_EXT        [Default = .bin]  - Extension for \"-U,-D\"\n MAC_LINE_LIMIT [Default = 200 ]  - Length of file for \"-U\""},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"md5","desc":"the MD5 digest of each file named","dir":"CMDS","size":24658,"docs":true,"help":{"note":"it takes file names and no options"},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"me","desc":"MicroEMACS 3.11, a screen editor with Emacs keys and German messages (Datei for File); needs TERM set","needs":[{"path":"/dd/SYS/","missing":false,"dir":true,"bytes":null},{"path":"/dd/USR/LIB/EMACS/","missing":false,"dir":true,"bytes":null},{"path":"/h0/SYS/","missing":false,"dir":true,"bytes":null},{"path":"/h0/USR/LIB/EMACS/","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":110408,"howto":"Full-screen editor, MicroEMACS keys, German messages. Control-X control-C quits.","help":{"cmd":"me -?","text":"Syntax:   emacs [opts] \u003cfiles>\nFunktion: microemacs 3.11 (beta) Texteditor aufrufen.\nOptionen:\n    -e          bearbeite Fehlerdatei \"error.cmd\"\n    -f\u003cfile>    fuehre \u003cfile> statt \"emacs.rc\" beim Aufruf aus.\n    -c          veraenderbare Puffer.\n    -g\u003cznr>     gehe zu Zeile \u003cznr>.\n    -i\u003cvar> \u003cwert>  setze Variable \u003cvar> auf Wert \u003cwert>.\n    -k\u003ccode>    Puffer mit Schluessel \u003ccode> ver- und entschluesseln.\n    -r          eingeschraenkte Verwendung.\n    -s\u003ckette>   suche nach Suchkette \u003ckette>.\n    -v          schreibgeschuetzte Puffer, nur ansehen.\n    -?,-h       diesen Hilfetext anzeigen."},"cat":"Editors","sub":"emacs family"},{"name":"messages","desc":"counts and lists what is in a mail folder: `There is 1 message in your mailbox'","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/ELM","size":9948,"star":true,"howto":"Counts what is in your mail folder: \"There is 1 message in your mailbox\".","help":{"cmd":"messages -?","text":"Usage: messages [-f filename]"},"cat":"Communications","sub":"Mail"},{"name":"mexist","desc":"test module existence","dir":"CMDS","size":4262,"star":true,"help":{"cmd":"mexist -?","text":"MEXIST   Version UTIL 2.40 by DESIGNA VLT 24.11.97\nUsage: mexist [options] \u003cModule>\n\nThis utility checks whether the specified \u003cModul>\nis loaded to the module-directory (CASE-SENSITIVE !!) (or not)\n(a maximum of 256 modules is checked.)\n\nno opt   Exit-Code 0, if module DOES exist\n  -n     Exit-Code 0, if module does NOT exist\n\n  -s     Show Modules (unsorted) until \u003cModule> found\n\n  -?     This helptable\n\nExamples:\n  'mexist \u003cMod1> \u003cMod2>;dir'    --> start dir if BOTH modules are loaded\n  'mexist -n \u003cMod1> \u003cMod2>;dir' --> start dir if BOTH modules are NOT loaded"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"mg","desc":"Mg, a small MicroGnuEmacs -- Emacs keys in 79K, its documentation under DOC/mg.","needs":[{"path":"/dd/sys/mgrc","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":79126,"star":true,"docs":true,"howto":"Full-screen editor, Emacs keys. Control-X control-C quits.","help":{"note":"it takes file names and no help flag; control-H inside it is the help key"},"cat":"Editors","sub":"emacs family"},{"name":"mgif","desc":"a GIF inspector and viewer. `mgif -i file.gif' reports a GIF's structure and works on any terminal; displaying one needs an Atari ST, because flicker.c writes to ST graphics memory. Source in SRC/mgif; its GIF decoder is portable and is the part worth having","dir":"CMDS","size":49938,"docs":true,"hassrc":true,"howto":"`mgif -i file.gif' inspects a GIF and prints its structure -- that works on any terminal. Displaying an image needs an Atari ST, because it writes straight to ST graphics memory. Try it on /dd/DEMO/gulls.gif.","help":{"cmd":"mgif -?","text":"mgif [options] file ...\n\n-i       inquire about image only\n-v       verbose\n-N       use NTSC equation for luminescence\nfile     a .gif file\n\nIf more than one file, all share command switch settings."},"cat":"Graphics & images","sub":"Viewers"},{"name":"mgrtopbm","desc":"MGR window-manager bitmap to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":42048,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"mille","desc":"Mille Bornes -- the French car-racing card game","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":34708,"star":true,"howto":"Full-screen Mille Bornes. `p' picks a card, `u #' plays one, `d #' discards, `s' saves the game and `q' quits.","help":{"note":"it takes a saved game to restore and no options"}," no options; run it where the dictionary is"},"cat":"Games","sub":"Other games"},{"name":"modbuster","desc":"splits a file holding several OS-9 modules into one file per module, in the current directory or the one -w=\u003cdir> names","src":"modbust","origin":"Microware OS-9 archive","archive":"modbust.lzh","dir":"CMDS","size":18846,"hassrc":true,"howto":"Give it a file holding SEVERAL modules and it writes one file per module in the CURRENT directory. Use ksh to put yourself somewhere writable first. `/dd/CMDS/GAMES/cyberwar' looks like a candidate but modbuster hangs on it with no output at all; a single ordinary module (`/dd/CMDS/today') shows it working.","help":{"cmd":"modbuster -?","text":"Syntax: Modbuster [\u003copts>] \u003cpath> [\u003copts>]\nFunction: Seperate merged modules, rels, basic source or KWindows bitmaps\nOptions:\n   -b=\u003csize>  buffer size\n   -q         quiet/silent mode\n   -v         verbose\n   -w=\u003cdir>   seperate into \u003cdir>\n              (default = current work directory)"},"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"modinfo","desc":"report a module's header -- name, type, size, edition, CRC","src":"forum15","origin":"Microware OS-9 archive","archive":"forum15.lzh","dir":"CMDS","size":19912,"hassrc":true,"help":{"cmd":"modinfo -?","text":"module: Show Module Information\nSyntax:    module [modulename]"},"cat":"System & modules","sub":"Utilities"},{"name":"move","desc":"move files between directories without copying the contents -- it relinks them, which is why it is quick and why its own help warns never to kill it mid-run. `move \u003cfrom> \u003cto>' wants a destination name; -w=\u003cdir> is the wildcard form that takes a directory.","dir":"CMDS","size":6778,"star":true,"docs":true,"help":{"cmd":"move -?","text":"Syntax:   move [\u003coptions>] \u003cfrom> [\u003cto>] [\u003coptions>]\nFunction: Moves files from one directory to another without\n          actually copying the file contents\nOptions:  -d : move subdirectories too (required with -w only)\n          -p : don't print file names moved (with -w only)\n          -w=\u003cdir name> : wildcard move to specified directory\n          -x : look in execution directory for source\n          -r : rewrite destination"},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"msattrib","desc":"mtools 3.6: reads or sets a DOS file's attribute bits -- +r and -r read-only, +a archive, +h hidden, +s system","needs":[{"path":"/dd/sys/mtools.conf","missing":false,"dir":false,"bytes":1229},{"path":"/dd/sys/mtools","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":132596,"help":{"cmd":"msattrib -?","text":"msattrib: illegal option -- ?\nMtools version 3.6, dated 14 Apr 97\nUsage: msattrib [-p] [-a|+a] [-h|+h] [-r|+r] [-s|+s] msdosfile [msdosfiles...]"},"cat":"Disk & DOS","sub":"MS-DOS media (mtools)"},{"name":"msbadblocks","desc":"mtools 3.6: reads every used cluster of a DOS disk and marks the ones that fail as bad, so nothing is written there again","needs":[{"path":"/dd/sys/mtools.conf","missing":false,"dir":false,"bytes":1229},{"path":"/dd/sys/mtools","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":131754,"help":{"note":"it takes a drive and no options, and says nothing when the disk is fine"},"cat":"Disk & DOS","sub":"MS-DOS media (mtools)"},{"name":"mscd","desc":"mtools 3.6: sets the current directory on a DOS disk for the other ms commands; run bare it reports where it is","needs":[{"path":"/dd/sys/mtools.conf","missing":false,"dir":false,"bytes":1229},{"path":"/dd/sys/mtools","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":131400,"help":{"note":"it takes a DOS directory and no options; run bare it reports where it is"},"cat":"Disk & DOS","sub":"MS-DOS media (mtools)"},{"name":"mscheck","desc":"mtools disk verifier.  A ksh script (#!ksh), and ksh is starred, so this one wants cio too.  Drives a: and b: are ready.","dir":"CMDS","size":944,"help":{"note":"a she ol/mail file to your home machine\n   and invoke this program on it\n\nIt will read your mail for you, and ask whether to reply or not.\n  NOTE: to reply, your EDITOR env. variable Must be defined appropriately\nIt SHOULD offer inclusion of original message,\n   and reply to original sender, or ALL recipients\nIt is meant to be used in conjunction with a shell-script that\n   takes first and second lines of a file as recipient and subject,\n   and then mails the file. [on the UNIX end]\nWARINING: this version can only handle 50 messages\n\nThis will check the $MAIL file if non is specified.\n   It will also allow you to make a mailfile to send\n  ie: \"philmail machine!blah!person \"\nFURTHER NOTE:  the ~ escape is recognised (while composing without editor),\n   but doesn't do much currently"},"cat":"Communications","sub":"Mail"},{"name":"phone","desc":"connects two terminals over a communication path so you can type to somebody on another: `phone /t1' rings until answered; control-E leaves","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":20924,"help":{"cmd":"phone -?","text":"Syntax: phone \u003ccommunication-path>\nFunction: communication between two terminals"},"cat":"System & modules","sub":"Utilities"},{"name":"pi1toppm","desc":"Atari Degas .pi1 to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":44876,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"pi3topbm","desc":"Atari Degas .pi3 to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":fa r":"CMDS/NETPBM","size":50076,"hassrc":true,"help":{"cmd":"ppmtotga -?","text":"usage:  ppmtotga [-name \u003ctganame>] [-mono|-cmap|-rgb] [-norle] [ppmfile]"},"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"ppmtouil","desc":"PPM to Motif UIL icon source","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":57906,"hassrc":true,"help":{"cmd":"ppmtouil -?","text":"usage:  ppmtouil [-name \u003cuilname>] [ppmfile]"},"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"ppmtoxpm","desc":"PPM to X pixmap (XPM)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":54858,"hassrc":true,"help":{"cmd":"ppmtoxpm -?","text":"usage:  ppmtoxpm [-name \u003cxpm-name>] [-rgb \u003crgb-textfile>] [ppmfile]"},"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"ppmtoyuv","desc":"PPM to Abekas YUV bytes","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":44452,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"ppmtoyuvsplit","desc":"PPM to three YUV planes -- basename.Y, .U and .V, 4:2:0 -- written in the data directory","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":53788,"hassrc":true,"howto":"It takes a BASENAME and writes THREE files beside the DATA directory, not to standard output: \u003cname>.Y, .U and .V. 4:2:0 subsampling, so a 32x16 image gives .Y = 512 bytes and .U = .V = 128. `yuvsplittoppm \u003cname> \u003cw> \u003ch>' brings them back.","help":{"cmd":"ppmtoyuvsplit","text":"usage:  ppmtoyuvsplit basename [ppmfile]"},"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"preset","desc":"loads the terminal's function keys: it writes a fixed set of definitions -- `dir', `umacs', `r68', `l68', `dsave -ieb128k' and so on -- and answers `Funktionstasten belegt!'. German. It takes no arguments and ignores any given","src":"forum3","origin":"Microware OS-9 archive","archive":"forum3.lzh","dir":"CMDS","size":642,"hassrc":true,"help":{"note":"it takes no options and ignores any given"},"cat":"System & modules","sub":"Utilities"},{"name":"pri","desc":"change a process's priority: `pri \u003cpid> \u003cpriority>'.","dir":"CMDS","size":4576,"help":{"note":"`pri \u003cpid> \u003cpriority>'; there is no help flag"},"cat":"System & modules","sub":"Utilities"},{"name":"PrintCards","desc":"Home Librarian: prints a catalogue as index cards, the shelf list by default or the title, author or subject reference cards with -by","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":150360,"hassrc":true,"help":{"cmd":"PrintCards -?","text":"Syntax: PrintCards [opts]\nLibraian Card Catalog card printer\nThis program is used to print out cards\nPrints either large (5x8) or small cards (3x5)\nPrints \"Shelf List\" (by=Id), Title reference (by=Title),\nAuthor reference (by=Author), or Subject reference\n(by=Subject).  By default a \"Shelf List\" is printed.\nOptions:\n-infile\tString Required The name of the file to print records from\n-largep\tBoolean Optional If true, print large cards, else print small cards\n-by\tString Optional Should be one of {Id, Title, Author, Subject} - selects card type.\n-only\tString Optional selection expression\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"printenv","desc":"print the environment","dir":"CMDS","size":2480,"star":true,"help":{"cmd":"printenv -?","text":"**** PRINTENV Utility for use with ZSH, (c) 1989 by L.Zeller ****\nSyntax:   printenv [\u003coptions>] [{\u003cenv var name}]\nFunction: Displays the specified (or all, if none specified) environment\n          variable(s). Variables beginning with '@' (ZSH symbols) will\n          not be shown unless the -a option is used\nOptions:  -a : show all variables (including those starting with a '@')"},"cat":"Shells","sub":"Shell helpers"},{"name":"printf","desc":"formatted print from the shell, as on Unix: widths, numbers and floating point","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":16550,"hassrc":true,"howto":"printf as on Unix: `printf \"%-8s|%5d\\n\" name 12'. Widths, numbers and floating point all work.","help":{"note":"it takes a format and its arguments and nothing else"},"cat":"Shells","sub":"Shell helpers"},{"name":"PrintLabels","desc":"Home Librarian: print labels. Its options each take a separate argument -- `-infile cat.libr -templatefile tpl.txt', not `-infile=...', which answers `Bad option:' and prints the syntax. The same is true of Ascii2Libr, Libr2Ascii, PrintCards and EditLibr. The template is a text file copied out once per card, with %title, %author, %year and the other field names replaced","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/errmsg.short","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":155930,"hassrc":true,"howto":"Its options take a separate argument -- `-infile cat.libr -templatefile tpl.txt', never `-infile=...', which answers `Bad option:' and prints the syntax. The same is true of Ascii2Libr, Libr2Ascii, PrintCards and EditLibr. The template is a text file copied out once per card with %title, %author, %year and the other field names replaced.","help":{"cmd":"PrintLabels -?","text":"Syntax: PrintLabels [opts]\nLibraian Card Catalog card printer\nThis program is used to print out cards\nPrints either large (5x8) or small cards (3x5)\nPrints \"Shelf List\" (by=Id), Title reference (by=Title),\nAuthor reference (by=Author), or Subject reference\n(by=Subject).  By default a \"Shelf List\" is printed.\nOptions:\n-infile\tString Required The name of the file to print records from\n-templatefile\tString Required The name of the template file\n-by\tString Optional Should be one of {Id, Title, Author, Subject} - selects card type.\n-only\tString Optional selection expression\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"printmail","desc":"format a message for a printer.  It forks `readmsg' by bare name, so load it first; then it prints the message the same way `readmsg' would","dir":"CMDS/ELM","size":1994,"star":true,"howto":"It forks `readmsg' BY BARE NAME, and OS-9 resolves a bare-name fork against the EXECUTION directory, never against PATH -- so it is silent from everywhere except /dd/CMDS/ELM. `load /dd/CMDS/ELM/readmsg' once and it works from anywhere: a RESIDENT module is found by name with no directory search at all.","help":{"cmd":"printmail -?","text":"Usage: printmail [-p] [-r filename] \u003cmessage list>"},"cat":"Communications","sub":"Mail"},{"name":"prjob","desc":"prints a queued job from the lp spooler; with no spooler installed it says so","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":4906,"star":true,"hassrc":true,"help":{"note":"it takes a job id; with no spooler running it says so before anything else"},"cat":"Printing","sub":"Spooling"},{"name":"proff","desc":"proff, a portable roff: formats text under dot requests -- fill, justify, centre, running page headers -- with its macros in LIB/proff; +n and -n select pages, -v prints statistics","src":"proff","origin":"EFFO forum","archive":"disk 8 PROGRAMME/C/PROFF (proff.zoo)","dir":"CMDS","size":30916,"docs":true,"hassrc":true,"help":{"cmd":"proff -?","text":"usage: proff [+n] [-n] [-v] [-ifile] [-s] [-pon] [infile [outfile]]\n\t\tformat infile (or stdin) to outfile (or stdout)\noptions:\t+n start printing at page n\n\t\t-n stop printing after page n\n\t\t-v verbose mode, prints statistics after printing\n\t\t-s stop before each page and wait for prompt\n\t\t-pon set page offset to n (equivalent to .po)\n\t\t-ifile include file (may be repeated)"},"cat":"Text tools","sub":"Format & typeset"},{"name":"psc","desc":"turns an ASCII table into commands for `sc', the spreadsheet: `psc -d' ' \u003c table' answers `let A0 = 1', `let B0 = 2' and a `format' line per column. -d sets the field delimiter, -r assembles rows first, -s names the top-left cell","dir":"CMDS","size":11208,"star":true,"docs":true,"howto":"Feeds `sc', the spreadsheet: `psc -d' ' \u003c table' turns rows of numbers into `let A0 = 1' commands sc can read. -r assembles rows first, -s names the top-left cell, -d sets the delimiter.","help":{"cmd":"psc -?","text":"Syntax: psc [-rkfLSPv?] [-s v] [-R i] [-C i] [-n i] [-d c] [\u003cpath1] [>path2]\nFunction: filter to prepare ASCII data for the Spreadsheet Calculator\nOptions:\n  -s cell Top left location in the spreadsheet should be 'cell'; eg, k5\n  -R n    Increment by n between rows (not valid with '-r' option)\n  -C n    Increment by n between columns (valid only with '-r' option)\n  -n n    Length of the row (column) should be n.\n  -d c    Use c as the delimiter between the fields.\n  -r      Assemble data into rows first, not columns.\n  -k      Keep all delimiters - Default is strip multiple delimiters\n  -f      Suppress 'format' lines in output\n  -L      Left justify strings.  Default is right justify.\n  -S      Use strings vs numbers for numbers\n  -P      Use numbers only when there is no [-+eE] (plain numbers only)\n  -v      Version\n  -?      Help (this panel)\n\n Author: Robert Bond.  Adjustments: Jeff Buhrt and Eric Putz."},"cat":"Text tools","sub":"Transform & filter"},{"name":"psidtopgm","desc":"a PostScript image -- the hex data of an `image' operator -- to PGM, given its width, height and bits per sample","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":44920,"hassrc":true,"howto":"Reads the hex digits of PostScript `image' operator data: `psidtopgm \u003cwidth> \u003cheight> \u003cbits/sample>' then the hex on standard input. `echo ffffffff00000000 | psidtopgm 4 2 8' makes a 4x2 graymap, a white row over a black one.","help":{"cmd":"psidtopgm -?","text":"usage:  psidtopgm \u003cwidth> \u003cheight> \u003cbits/sample> [imagedata]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"ptob","desc":"convert bit patterns back to characters -- the other half of `btop', and the round trip is exact.","dir":"CMDS","size":15704,"help":{"cmd":"ptob -?","text":"Syntax:   PtoB [\u003copts>] [\u003cpath1>] [\u003copts>] [\u003cpath2>] [\u003copts>]\nFunction: convert bit patterns to chars\nOptions:  -o  use stdin for input, path1 for output"},"cat":"System & modules","sub":"Utilities"},{"name":"ptxm","desc":"Path Table eXtension Module: a KERNEL extension letting user-state processes open unlimited I/O paths.  Courtesyware, free.  It installs into the kernel and so needs supervisor state.  DOC/ptxm/ptxm.txt","dir":"CMDS","size":2886,"docs":true,"help":{"note":"a kernel extension module, not a program; ptxminst installs it"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"ptxminst","desc":"install Ptxm -- the kernel extension above","dir":"CMDS","size":174,"help":{"note":"it takes no options; it installs ptxm, which must be loaded first"},"cat":"System & modules","sub":"Utilities"},{"name":"puz15","desc":"the 15-puzzle: slide the tiles into the gap, `puz15 5x5' for a bigger board.  A second port is CMDS/puzzle15; both have source and play the same","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":43198,"hassrc":true,"howto":"Full-screen fifteen puzzle. Slide the tiles into the gap; `puz15 5x5' plays a bigger board. Control-C gets you out.","help":{"cmd":"puz15 -?","text":"bad argument -?\nusage: /dd/CMDS/GAMES/puz15 [\u003cwidth[x\u003cheight>]] [movemethod] [cursormethod] [facemethod]\npossible movemethods:\n\t\tmoveblank            (this is default)\n\t\tmovetile\n\t\tselecttile\npossible cursormethods:\n\t\tvikeys               (this is default)\n\t\tnumberkeys\n\t\tfacekeys             (implies movemethod selecttile)\n\t\tkeys \u003cup>\u003cdown>\u003cleft>\u003cright>\npossible facemethods:\n\t\tnumberfaces          (this is default)\n\t\talphafaces\n\t\tnumberalphafaces\n\t\talphanumberfaces\n\t\tfaces \u003cfacecharacters>"},"cat":"Games","sub":"Puzzles"},{"name":"puzzle","desc":"sliding-tile puzzle for G-Windows -- it draws through G-Windows, so at a terminal it gets one rule of plus signs out -- the top edge of the tile frame -- and stops.  For a 15-puzzle you can play, use puzzle15 or GAMES/puz15; both work","dir":"CMDS/GAMES","size":24200,"star":true,"docs":true,"help":{"note":"it needs G-Windows; there is no help flag"},"cat":"Games","sub":"Other games"},{"name":"puzzle15","desc":"the 15-puzzle: slide the tiles into the gap, `puzzle15 5x5' for a bigger board.  A second port lives in GAMES/puz15; both have source and play the same","src":"eff_puzzle15","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/PUZZLE15","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":43148,"docs":true,"hassrc":true,"howto":"The same fifteen puzzle, in CMDS. Slide the tiles into the gap; `puzzle15 5x5' plays a bigger board. Control-C gets you out.","help":{"cmd":"puzzle15 -?","text":"bad argument -?\nusage: puzzle15 [\u003cwidth[x\u003cheight>]] [movemethod] [cursormethod] [facemethod]\npossible movemethods:\n\t\tmoveblank            (this is default)\n\t\tmovetile\n\t\tselecttile\npossible cursormethods:\n\t\tvikeys               (this is default)\n\t\tnumberkeys\n\t\tfacekeys             (implies movemethod selecttile)\n\t\tkeys \u003cup>\u003cdown>\u003cleft>\u003cright>\npossible facemethods:\n\t\tnumberfaces          (this is default)\n\t\talphafaces\n\t\tnumberalphafaces\n\t\talphanumberfaces\n\t\tfaces \u003cfacecharacters>"},"cat":"Games","sub":"Puzzles"},{"name":"pwgen","desc":"pronounceable passwords: `pwgen \u003clength> [how many]'","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":8746,"star":true,"hassrc":true,"howto":"pwgen \u003clength> [count]: length 4 to 16. It takes a few seconds over each password, so allow for that.","help":{"note":"`pwgen \u003clength> [count]', the length 4 to 16; there is no help flag"},"cat":"Amusements","sub":"Generators"},{"name":"pwparse","desc":"parse the password file for the mailer","needs":[{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":6364,"star":true,"help":{"note":"a filter with no options: the password file on standard input, the login names out"},"cat":"Communications","sub":"Mail"},{"name":"qp","desc":"expands back-quotes in a command line, which Microware's shell does not do for itself: `qp \u003ccmd> \u003cargs>'. It forks a `shell' to run the result, so it wants Microware's on your execution path","src":"eff_qp","origin":"EFFO forum","archive":"disk 13  SOFTWARE/C/QP","dir":"CMDS","size":3770,"star":true,"docs":true,"hassrc":true,"howto":"Runs its expanded command through Microware's `shell'.","help":{"cmd":"qp -?","text":"Syntax: qp \u003ccmd> \u003carg1> ... \u003cargn>\nFunction: process back-quotes for command expansion\nno Options\n  Args enclosed in back quotes (`) are treated as a\n  command sequence; stdout of this sequence replaces\n  the command itself.\n  Nested qp's are possible: The innermost qp has to be\n  enclosed within a pair of single back quotes, the next\n  level must be enclosed with double back quotes, and\n  so on.\n  If quotes of two levels are at the same place, they\n  have to be separated by at least one blank."},"cat":"Shells","sub":"Shell helpers"},{"name":"qrttoppm","desc":"QRT ray-tracer output to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45164,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"qsort9","desc":"an in-memory quicksort filter: sorts lines by a chosen field (-f) and separator (-c), in dictionary order, reversed or unique","dir":"CMDS","size":4686,"star":true,"help":{"cmd":"qsort9 -?","text":"Syntax: qsort9 [\u003copts>] [\u003csrcpath>] [\u003copts>]\nFunction: in memory 'quik sort'\nOptions:\n     -a        don't match upper to lower case\n     -b[=]\u003cn>[K]  use specified buffer size (4096)\n     -c[=]\u003cchar>  use specified field seperator\n     -d        sort in dictionary order\n     -f[=]\u003cn>  skip \u003cn> fields for key\n     -i        ignore case completely\n     -r        reverse sort\n     -u        print unique lines\n     -?        print usage"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"qt","desc":"tells the time in words, the way a person would say it: `It's just gone ten past four.'","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":2940,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it tells the time"},"cat":"Time & calendar","sub":"Clocks"},{"name":"queens","desc":"an N-queens solver, an obfuscated-C contest entry: it reads the board size on standard input as a number and draws every arrangement it finds with no two queens attacking: `echo 6 | queens'","src":"ioccc","origin":"EFFO forum","archive":"disk, C contest entries -- IOCCC entry by M. Baruch","dir":"CMDS","size":2234,"star":true,"hassrc":true,"howto":"Reads the board size on standard input as a number: `echo 6 | queens'.","help":{"note":"it reads the board size on standard input and takes no options"},"cat":"Games","sub":"Puzzles"},{"name":"rain","desc":"raindrops land on the screen and spread in rings -- a screen toy; control-C ends it","src":"toys","origin":"usenet archive","archive":"toys.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":20024,"hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; q, Q, control-D and ESC do not. If it has a quit command of its own, its documentation in DOC/ will say.","help":{"note":"it takes no options; control-C ends it"},"cat":"Screen toys","sub":"Screen toys"},{"name":"rasttopnm","desc":"Sun raster to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":96822,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rawtopgm","desc":"raw grey bytes to PGM, given the width and height; -headerskip drops a header","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":48424,"hassrc":true,"help":{"cmd":"rawtopgm -?","text":"usage:  rawtopgm [-headerskip N] [-rowskip N] [-tb|-topbottom] [\u003cwidth> \u003cheight>] [rawfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rawtoppm","desc":"raw RGB bytes to PPM, given the width and height and the byte order","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":47336,"hassrc":true,"help":{"cmd":"rawtoppm -?","text":"usage:  rawtoppm [-headerskip N] [-rowskip N] [-rgb|-rbg|-grb|-gbr|-brg|-bgr] [-interpixel|-interrow] \u003cwidth> \u003cheight> [rawfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rayshade","desc":"ray tracer 4.0.  It renders, and requires Microware's `shell' on the execution path: it builds its scene through popen(), which OS-9's C library implements by forking a program of exactly that name.  It also wants `cccp' in the data directory, where the forked shell looks.  With both, it renders and reports its statistics.  DOC/rayshade has the two lines.","dir":"CMDS","size":169710,"docs":true,"hassrc":true,"howto":"Ray tracer 4.0, and it renders. REQUIRES MICROWARE'S `shell` on your execution path -- it builds its scene through popen(), and OS-9's C library implements popen() by forking a program of exactly that name. It also wants `cccp` in the DATA directory. DOC/rayshade has the two lines.","help":{"cmd":"rayshade -h","text":"usage: rayshade [options] [filename]\nWhere options include:\n\t-A frame\t(Begin with given frame #.)\n\t-C thresh\t(Set adaptive ray tree cutoff value.)\n\t-D depth\t(Set maximum ray tree depth.)\n\t-E eye_sep\t(Set eye separation in stereo pairs.)\n\t-F freq\t\t(Set frequency of status report.)\n\t-f \t\t(Flip all triangle normals.)\n\t-G gamma\t(Use given gamma correction exponent.)\n\t-g \t\t(Use Gaussian pixel filter.)\n\t-h \t\t(Print this message.)\n\t-j \t\t(Toggle jittered sampling.)\n\t-l \t\t(Render image for left eye view.)\n\t-N number\t(Render given number of frames.)\n\t-n \t\t(Do not render shadows.)\n\t-O outfile \t(Set output file name.)\n\t-o \t\t(Toggle opacity effect on shadowing.)\n\t-P cpp-args\t(Options to pass to C pre-processor.\n\t-p \t\t(Preview-quality rendering.)\n\t-q \t\t(Run quietly.)\n\t-R xres yres\t(Render at given resolution.)\n\t-r \t\t(Render image for right eye view.)\n\t-S samples\t(Max density of samples^2 samples.)\n\t-s \t\t(Don't cache shadowing information.)\n\t-T r g b\t(Set contrast threshold (0. - 1.).)\n\t-V filename \t(Write verbose output to filename.)\n\t-v \t\t(Verbose output.)\n\t-W x x y y \t(Render subwindow.)\n\t-X l r b t \t(Crop window.)"},"cat":"Graphics & images","sub":"Ray tracing & 3D"},{"name":"rb37c65","desc":"floppy driver (37C65 controller)","dir":"CMDS/MM1","size":2592,"help":{"note":"a device driver for the MM/1, not a program"},"cat":"System & modules","sub":"MM/1 drivers"},{"name":"rcs","desc":"RCS: the administration command -- access lists, locks, comment leaders and states on a history file","needs":[{"path":"/dd/tmp","missing":false,"dir":true,"bytes":null},{"path":"/h0/etc/cmds/smail","missing":true,"dir":false,"bytes":null},{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":44066,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"rcs -?","text":"rcs error: Unknown option: -?\ncommand format:\nrcs -i -alogins -Alogins -e[logins] -b[rev] -c[commentleader] -l[rev] -u[rev] -L -U -nname[:rev] -Nname[:rev] -orange -sstate[:rev] -t[textfile] file....\nrcs aborted"},"cat":"Developer tools","sub":"Version control"},{"name":"rcsdiff","desc":"RCS diff -- compare a working file against a stored revision.","needs":[{"path":"
