<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A guide to the 936 programs on the OS-9/68K freeware disk, grouped by what they are for.">
<meta name="color-scheme" content="light dark">
<title>OS-9/68K Freeware Collection — a guide to 936 programs</title>
<style>
  :root{
    --paper:#F4F5F3; --card:#FFF; --ink:#191D21; --dim:#5A646B; --faint:#8A949B;
    --rule:#DDE1DE; --hair:#EBEEEB; --accent:#B26A00; --soft:#F7E8D2;
    --warn:#8C2F1E; --ok:#2E6A4F; --screen:#0E1113; --phosphor:#CFE3CF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#98A4AC; --faint:#6B777E;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}}
  :root[data-theme="dark"]{
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#98A4AC; --faint:#6B777E;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* THE PAGE IS THREE COLUMNS: what kinds of thing there are, the programs
     of one kind, and one program.  Choosing in a column fills the next one
     and never covers the one you chose in -- the reader keeps their place. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px 22px;align-items:center;
       padding:12px 20px 10px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;
          white-space:nowrap}
  .top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;
                color:var(--dim);letter-spacing:0}
  .top input[type=search]{width:100%;max-width:520px;font:inherit;font-size:15px;padding:8px 12px;
    border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
  .only{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--dim);white-space:nowrap}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}

  .cols{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(380px,1.5fr);
        min-height:0;height:100%}
  .col{min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--rule)}
  .col:last-child{border-right:0}
  .col > h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
          text-transform:uppercase;color:var(--faint);margin:0;padding:14px 16px 6px}

  /* column one: categories, then the alphabet */
  .kinds{list-style:none;margin:0;padding:0 8px 8px}
  .kinds li{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;
            cursor:pointer;font-size:14px}
  .kinds li .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
               font-variant-numeric:tabular-nums}
  .kinds li:hover{background:var(--hair)}
  .kinds li[aria-current="true"]{background:var(--soft);color:var(--ink)}
  .kinds li[aria-current="true"] .n{color:var(--accent)}
  .abc{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 12px 20px}
  .abc button{font:500 12px/1 var(--mono);padding:7px 0;border:1px solid transparent;
              border-radius:6px;background:none;color:var(--dim);cursor:pointer}
  .abc button:hover{border-color:var(--rule);color:var(--ink)}
  .abc button[aria-current="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
  .abc button:disabled{color:var(--faint);opacity:.4;cursor:default}

  /* column two: the programs of one kind */
  .lede{padding:0 18px 12px;font-size:13.5px;color:var(--dim);max-width:52ch}
  .subh{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--faint);padding:14px 18px 4px;border-top:1px solid var(--hair)}
  .subh:first-of-type{border-top:0}
  .progs{list-style:none;margin:0;padding:0 8px 8px}
  li.p{display:grid;grid-template-columns:auto minmax(88px,120px) 1fr;gap:9px;padding:5px 10px;
       align-items:baseline;cursor:pointer;border-radius:7px}
  li.p:hover{background:var(--hair)}
  li.p[aria-current="true"]{background:var(--soft)}
  .nm{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nm .st{color:var(--accent)}
  .ds{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
  .ds .where{color:var(--faint)}
  li.p .pick{width:18px;height:18px;align-self:start;margin-top:2px;border:1px solid var(--rule);border-radius:4px;
    background:var(--card);color:var(--faint);font:600 12px/16px var(--mono);text-align:center;
    cursor:pointer;padding:0}
  li.p .pick:hover{border-color:var(--accent);color:var(--accent)}
  li.p.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff}
  .overview{padding:4px 8px 12px}
  .overview li{display:block;padding:9px 10px;border-radius:7px;cursor:pointer}
  .overview li:hover{background:var(--hair)}
  .overview .ct{font-family:var(--serif);font-size:16px;font-weight:600}
  .overview .ct .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;
                   margin-left:6px}
  .overview .blurb{font-size:12.5px;color:var(--dim);margin:2px 0 0}
  .empty{padding:40px 18px;color:var(--dim);font-size:14px;max-width:48ch}

  /* column three: one program */
  .panel{padding:18px 22px 40px}
  .pn{font-family:var(--mono);font-size:22px;font-weight:600;margin:0}
  .pd{color:var(--dim);margin:5px 0 0;font-size:15px;max-width:60ch}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .flag{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
        color:var(--dim)}
  .flag.cio{border-color:var(--accent);color:var(--accent)}
  .flag.mil{border-color:var(--warn);color:var(--warn)}
  .flag.ok{border-color:var(--ok);color:var(--ok)}
  dl{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;margin:18px 0 0;font-size:13.5px}
  dt{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.06em;
     text-transform:uppercase;padding-top:2px}
  dd{margin:0;color:var(--ink);overflow-wrap:anywhere;min-width:0}
  dd code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  dd .miss{color:var(--warn)}
  dd pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  pre.shot{font-family:var(--mono);font-size:11px;line-height:1.2;margin:0;
    white-space:pre;overflow-x:auto;background:var(--screen);color:var(--phosphor);
    border-radius:6px;padding:10px 12px}
  .shotcap{margin:.5rem 0 0;color:var(--dim);font-size:12.5px;line-height:1.45;max-width:64ch}
  dd .howto{font-size:13px;line-height:1.45;max-width:64ch}
  dd.advice{color:var(--dim);font-size:12.5px;line-height:1.45}
  dd .okk{color:var(--ok);font-size:11.5px}
  dd a.kin{color:var(--accent);text-decoration:none}
  dd a.kin:hover{text-decoration:underline}
  .try,.needs{display:flex;align-items:baseline;gap:12px;margin:14px 0 0;font-size:13.5px}
  .try .k,.needs .k,.see .k{color:var(--faint);font-family:var(--mono);font-size:11px;
     letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
  .try code{font-family:var(--mono);font-size:14.5px;color:var(--ink);background:var(--paper);
     border:1px solid var(--rule);border-radius:6px;padding:6px 11px}
  .needs code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .needs span{color:var(--dim)}
  .see{margin:16px 0 2px}
  .see .k{display:block;margin:0 0 6px}
  details.more{margin:16px 0 0;border-top:1px solid var(--rule);padding-top:10px}
  details.more summary{cursor:pointer;color:var(--accent);font-size:12.5px;list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more dl{margin-top:10px}
  details.more .howto{font-size:13px;line-height:1.45;max-width:64ch;margin-top:10px}
    .back{display:none;font:inherit;font-size:13px;background:none;border:0;color:var(--accent);
        cursor:pointer;padding:0;margin:0 0 10px}
  .about{padding:24px 18px;color:var(--dim);font-size:13px;max-width:52ch;line-height:1.5}
  .about code{font-family:var(--mono);color:var(--ink)}
  .about p{margin:0 0 12px}

  /* the tray: programs ticked for `keep' */
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--rule);box-shadow:0 -6px 24px rgba(0,0,0,.10);
    transform:translateY(110%);transition:transform .18s ease}
  .tray.on{transform:none}
  .tray .row2{display:flex;gap:12px;align-items:center;padding:12px 20px 14px;flex-wrap:wrap}
  .tray code{flex:1 1 320px;font-family:var(--mono);font-size:13px;
    background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:9px 11px;color:var(--ink);overflow-x:auto;white-space:nowrap}
  .tray .meta{color:var(--faint);font-size:12px;font-family:var(--mono)}

  /* TWO COLUMNS on a tablet held upright: the kinds become a strip across
     the top of the program column, and the program column and the panel
     stand side by side. */
  @media (max-width:1100px){
    .cols{grid-template-columns:minmax(280px,1fr) minmax(340px,1.4fr)}
    .col.kinds-col{grid-column:1;grid-row:1;border-right:0;border-bottom:1px solid var(--rule);
                   overflow-x:auto;overflow-y:hidden;max-height:none;height:auto}
    .cols{grid-template-rows:auto 1fr}
    .col.progs-col{grid-column:1;grid-row:2}
    .col.panel-col{grid-column:2;grid-row:1 / span 2}
    .kinds-col h2{display:none}
    .kinds{display:flex;gap:4px;padding:8px 10px;white-space:nowrap}
    .kinds li{padding:5px 9px;font-size:13px}
    .abc{display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto}
    .abc button{padding:5px 6px}
    .top{grid-template-columns:auto 1fr;gap:8px 16px}
    .only{grid-column:1 / -1;justify-content:flex-start}
  }
  /* ONE COLUMN on a phone: the list, then the panel over it with a way back. */
  @media (max-width:700px){
    .cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .col.panel-col{display:none;grid-column:1;grid-row:1 / span 2}
    .app[data-stage="panel"] .col.panel-col{display:block}
    .app[data-stage="panel"] .col.progs-col,.app[data-stage="panel"] .col.kinds-col{display:none}
    .back{display:inline-block}
    .top h1 small{display:none}
    .panel{padding:14px 16px 40px}
    dl{grid-template-columns:1fr;gap:2px 0}
    dt{padding-top:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app" data-stage="list">
  <header class="top">
    <h1>OS-9/68000 freeware<small>936 programs on one disk image, 1983&ndash;1998</small></h1>
    <input type="search" id="q" placeholder="Search names and descriptions"
           aria-label="Search programs" autocomplete="off">
    <div class="only" role="group" aria-label="Show only">
      <button class="chip" id="f-src" aria-pressed="false">Source on disk</button>
      <button class="chip" id="f-doc" aria-pressed="false">Has docs</button>
      <button class="chip" id="f-shot" aria-pressed="false">Sample output</button>
    </div>
  </header>

  <div class="cols">
    <nav class="col kinds-col" aria-label="Kinds of program">
      <h2>Kinds</h2>
      <ul class="kinds" id="kinds"></ul>
      <h2>By name</h2>
      <div class="abc" id="abc"></div>
    </nav>
    <section class="col progs-col" id="progs-col" aria-label="Programs"></section>
    <section class="col panel-col" id="panel-col" aria-label="Program"></section>
  </div>
</div>

<div class="tray" id="tray" role="region" aria-label="Programs picked to keep">
  <div class="row2">
    <code id="traycmd">keep</code>
    <span class="meta" id="traysize"></span>
    <button class="chip" id="traycopy">Copy</button>
    <button class="chip" id="trayclear">Clear</button>
  </div>
</div>

<script src="screens.js"></script>

 a directory of your own, `load /dd/CMDS/GAMES/advcom', then `sh -c \"chd /dd/tmp/adv; advcom osample\"'. It names every object it compiles and writes osample.dat.","cat":"Games","sub":"Adventure & fiction"},{"name":"advent","desc":"Colossal Cave Adventure, Will Crowther and Don Woods' mid-1970s original and the first text adventure -- self-contained, reads /dd/GAMES/adv/glorkz.  Needs this disk as /dd; mounted only as /h0 it cannot find its data.  Unrelated to advcom/advint.","src":"adv","origin":"usenet archive","archive":"adv.ar","needs":[{"path":"/dd/GAMES/adv/tmp.foo.baz","missing":true},{"path":"/dd/GAMES/adv/glorkz","missing":false}],"dir":"CMDS/GAMES","size":40300,"docs":true,"hassrc":true,"howto":"Colossal Cave. Needs this disk as /dd -- it opens /dd/GAMES/adv/glorkz by absolute path, so mounted only as /h0 it cannot find its data.","cat":"Games","sub":"Adventure & fiction"},{"name":"advint","desc":"ADVSYS adventure INTERPRETER -- plays a world compiled by advcom, and there is one to play: build it as advcom's entry says and `advint osample' starts you in the livingroom. Both open their files by bare name in the data directory, so run them where the files are: `load' the module, then `sh -c \"chd /dd/tmp/adv; advint osample\"'. GAMES/ADVSYS/README has the details","src":"advint","origin":"usenet archive","archive":"advint.ar","dir":"CMDS/GAMES","size":28460,"usage":"usage: advint [-r\u003crows>] [-c\u003ccolumns>] [-l\u003clog-file>] \u003cfile>","docs":true,"hassrc":true,"howto":"Plays an ADVSYS world. Build one first (see advcom), then run it where the .dat is: `load /dd/CMDS/GAMES/advint', then `sh -c \"chd /dd/tmp/adv; advint osample\"' -- you start in the livingroom, `n' goes to the hallway, `e' to a storage room with a key.","cat":"Games","sub":"Adventure & fiction"},{"name":"afm2tfm","desc":"Adobe font metrics to TeX font metrics","dir":"CMDS/TEXCMDS","size":35194,"usage":"Usage: afm2tfm foo[.afm] [-O] [-v|-V bar[.vpl]]\n   [-p|-t|-T encodingfile] [foo[.tfm]]","cat":"Text tools","sub":"TeX"},{"name":"alps","desc":"Switch an ALPS ASP-1000 printer between draft and NLQ","dir":"CMDS","size":1674,"usage":"Syntax: alps [\u003copts>] >/\u003cdevice>\nFunction: generate Alps ASP-1000 printer codes\nOptions:\n-lq   letter quality mode\n-norm   normal mode","star":true,"docs":true,"hassrc":true,"cat":"Printing","sub":"Printers"},{"name":"animal","desc":"guess-the-animal learning game","src":"animal","origin":"usenet archive","archive":"animal.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":33386,"usage":"Usage: animal {data-file}","docs":true,"hassrc":true,"howto":"The file it learns from is one you name: `animal /dd/DOC/animal/example'. Answer y or n to each question; when its final guess is wrong it asks what you were thinking of and what question tells the two apart, and writes that back into the file. Control-C leaves it.","cat":"Games","sub":"Word & guessing"},{"name":"answer","desc":" clears the screen and asks `Message to:'","needs":[{"path":"/dd/TMP/","missing":false},{"path":"/dd/nlslib/","missing":true},{"path":"/dd/SYS/domain","missing":true},{"path":"/dd/TMP","missing":false},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true}],"dir":"CMDS/ELM","size":29342,"star":true,"cat":"Communications","sub":"Mail"},{"name":"ape","desc":"writes GIBBERISH in the style of whatever it is given -- a travesty generator. `travesty' and `newsgen' are the others of its kind here. Its options are `-b' (how much source to read) and `-l' (how many characters must match before it follows the source).","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":16572,"hassrc":true,"howto":"A travesty generator: `-b' is how much source to read and `-l' the pattern length. Feed it VARIED text -- one word repeated makes it generate without end, because every position matches every other.","cat":"Text tools","sub":"Transform & filter"},{"name":"apfel","desc":"Mandelbrot (Apfelmaennchen) -- Atari GRAPH display","dir":"CMDS/GAMES","size":866,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"aprocs","desc":"process monitor.  It calls F$SetSys twice and is aborted (E_PRCABT) where that call is not implemented.  `procs', `top' and `sysmon' are the other process listers.","dir":"CMDS","size":11588,"usage":"Syntax: aprocs [\u003copts>]\nFunction: Another process utility; show processes in various formats\nOptions:\n-a   Show only processes with CPU-Time more than 0.1 percent","star":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"ar","desc":"archive librarian (Carl Kreider) -- .ar files","dir":"CMDS","size":22772,"usage":"Usage:  Ar -\u003ccmd>[\u003cmodifier>] [file .. ]","docs":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"ar2","desc":"Ar V2.00 -- Carl Kreider's archiver, a later edition than the V1.2 included as `ar'.  Both are here; ar is unstarred","dir":"CMDS","size":15478,"usage":"Usage:  Ar -\u003ccmd>[\u003cmodifier>] archive [file .. ]","star":true,"docs":true,"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"arc","desc":"ARC 5.21 archive utility","needs":[{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS","size":58666,"usage":"Usage: arc {amufdxerplvtc}[biswnoq][g\u003cpassword>]","docs":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"arc_5.12","desc":"ARC v5.12, third-party; /dd/CMDS/arc is 5.21.  5.12 wants its command letter with a leading dash, and cannot write an archive on this disk: the rename of its temporary file into place fails every time, with `No Children'","dir":"CMDS/REBUILT","size":38502,"usage":"Usage: arc -{amufdxeplvtc}[bswn][g\u003cpassword>]","cat":"Archives & compression","sub":"Alternates"},{"name":"areacode","desc":"look up a US telephone area code","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)   [also built from misc]","dir":"CMDS","size":7580,"usage":"Usage: areacode nnn nnn ...","star":true,"hassrc":true,"cat":"Amusements","sub":"Curiosities"},{"name":"arepdaemon","desc":"the daemon autoreply relies on.  It reads /dd/USR/LIB/ELM/autoreply.data; without it, `Error 216 attempting fstat' -- though it still touches autoreply.log on its way there","needs":[{"path":"/dd/USR/LIB/ELM/autoreply.data","missing":true},{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/USR/CMDS","missing":true},{"path":"/dd/USR/LIB/ELM/autoreply.log","missing":true},{"path":"/dd/TMP/autoreply.log","missing":true},{"path":"/dd/spool/uucp","missing":false},{"path":"/dd/nlslib/","missing":true}],"dir":"CMDS/ELM","size":20468,"star":true,"cat":"Communications","sub":"Mail"},{"name":"argproc_demo","desc":"demonstration of argproc(), RICO's command-line argument parser.  Built from SRC/argproc with MEM=64k, it parses the line and prints what it made of it -- `argproc_demo readme' answers `arg=readme, b=0, c=0, sGiven=0, s=this is a test, x=32, pi=3.144500'.  A switch takes its argument with NO SPACE (`-x99', not `-x 99'), which the program says itself under -help.  The argproc library manual is here too: DOC/argproc_demo/man.argproc, from EFFO forum 7.","src":"argproc","origin":"EFFO forum","archive":"disk 7 RICO/C/LIBSOURCE/ARGPROC","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS","size":25628,"docs":true,"hassrc":true,"howto":"A switch takes its argument with NO SPACE: `-x99', never `-x 99'. `argproc_demo readme' prints what it made of the line.","cat":"System & modules","sub":"Utilities"},{"name":"as0","desc":"6800/6802 cross-assembler (xasm).  See the note below this list.  A sample source for each of the six ships in DOC/xasm, so they can be seen doing their job rather than printing their usage line: `as0 /dd/DOC/xasm/sample.a0 - l s' lists the assembly with addresses, opcodes and a symbol table. The options come after a lone `-', and as11 is the one exception -- it takes them without it","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27238,"usage":"Usage: as0 [files]","hassrc":true,"howto":"Assemble the sample that ships with it: `as0 /dd/DOC/xasm/sample.a0 - l s' -- the options come after a lone `-', `l' for the listing and `s' for the symbol table. There is a sample for each of the six (sample.a0, .a1, .a4, .a5, .a09, .a11) and each is written for its own processor: as09 rejects the 6800 one, correctly. as11 is the one that takes its options without the `-'. None of these is a 68000 assembler.","cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as09","desc":"6809 assembler -- the one that targets the 6809 itself. It rejects 6800 source (`ldaa' is a 6800 mnemonic, not a 6809 one); DOC/xasm/sample.a09 is written for it","dir":"CMDS","size":17914,"usage":"Usage: as09 [files]","star":true,"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as1","desc":"6801/6803 cross-assembler (xasm).  DOC/xasm/sample.a1","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27412,"usage":"Usage: as1 [files]","hassrc":true,"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as11","desc":"68HC11 cross-assembler (xasm).  DOC/xasm/sample.a11","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":24868,"usage":"Usage: as11 [files]","hassrc":true,"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as4","desc":"6804 cross-assembler (xasm).  DOC/xasm/sample.a4","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":26662,"usage":"Usage: as4 [files]","hassrc":true,"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as5","desc":"6805/68HC05 cross-assembler (xasm).  DOC/xasm/sample.a5","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27350,"usage":"Usage: as5 [files]","hassrc":true,"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"ascii","desc":"ASCII character table","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":2608,"star":true,"hassrc":true,"cat":"Text tools","sub":"Count & inspect"},{"name":"Ascii2Libr","desc":"Home Librarian: build a catalogue from plain text -- `Ascii2Libr -outfile cat.libr', with the text on standard input, in the form Libr2Ascii writes","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":130522,"usage":"Syntax: Ascii2Libr [opts]","hassrc":true,"howto":"`-outfile cat.libr' with a space, and it reads the ASCII on standard input. The text is the form Libr2Ascii writes: a page count, then a card count and the cards, then the title, author and subject index sections.","cat":"Files & directories","sub":"Home Librarian"},{"name":"asciitopgm","desc":"ASCII art to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":50168,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"ask","desc":"the CLIENT for `wisecrack': it reads one line from /PIPE/txtpipe and prints it, and says `No Wisecracks coming' when nothing is feeding the pipe.  Start the server first -- `wisecrack &' -- and it answers.","src":"forum20","origin":"Microware OS-9 archive","archive":"forum20.lzh","dir":"CMDS","size":11776,"hassrc":true,"howto":"Asks a yes/no question and sets the shell status, for scripts. On its own it says \"No Wisecracks coming\" -- it is the front half of the `wisecrack' pipe from EFFO forum 20.","cat":"Games","sub":"Other games"},{"name":"assembler","desc":"GSHELL front-end for the assembler -- the same full-screen menu as `gshell', headed `Assembler-SHELL V1.0'.  It does not assemble anything itself; `as0' and its five siblings are the assemblers","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":22100,"usage":"Syntax: assembler [\u003cpath>]\nFunction: a menue driven assembler shell\nOptions: none","hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; none of q, Q, control-D or ESC do.","cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"aterm","desc":"ATerm 2.6 terminal emulator.  WORKS -- config is in SYS/ATERM; run it from a login session rather than as the machine's first process, or its terminal library bus errors.  `aterm /t1' for a real serial port.  Manual DOC/aterm, source SRC/aterm","needs":[{"path":"/DD/SYS/ATERM/ATerm.Ctl","missing":false},{"path":"/DD/SYS/ATERM/ATerm.Phone","missing":false},{"path":"/DD/SYS/ATERM/ATerm.Print","missing":false}],"dir":"CMDS","size":13422,"usage":"Syntax  : ATerm /serial_path\n   Function: Terminal program for OSK\n   Example : ATerm /t1","docs":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"atktopbm","desc":"Andrew toolkit to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":47622,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"atob","desc":"ASCII-to-binary decode","src":"btoa","origin":"Microware OS-9 archive","archive":"btoa.lzh","dir":"CMDS","size":19338,"usage":"Usage: atob \u003cfilein >fileout","hassrc":true,"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"atp","desc":"AX.25 transport, from the KA9Q package","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/NETWORK","size":62430,"star":true,"cat":"Communications","sub":"TCP/IP"},{"name":"authwn","desc":"authentication helper for protected areas","src":"wn1","origin":"Microware OS-9 archive","archive":"wn1.zip","needs":[{"path":"/h0/c/unid/wn_1.14.3/osk","missing":false}],"dir":"CMDS/WN","size":8694,"hassrc":true,"cat":"Communications","sub":"Web server"},{"name":"autolf","desc":"Mike Tozer's line-ending converter, 1995, and THE ONE THAT WORKS: it turns CR into CRLF or LF and back, expands tabs, and handles ^Z. Use it as a FILTER -- `autolf -c -C -L \u003c in > out' makes DOS text out of OS-9 text. Given a FILENAME it converts in place through a temporary and then cannot rename it back -- this C library has no rename(), the same wall zip and arc hit. `-H' explains the conversions. It is what `todos' and `toos9' were supposed to be.","dir":"CMDS","size":11354,"usage":"Usage:   autolf [\u003copts>] {\u003cfile names> [\u003copts>]}","star":true,"docs":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"autoreply","desc":"send an automatic reply while you are away.  It resolves your mailbox by the session's numeric owner rather than $USER, so under this identity it reaches for a mailbox named `su' and stops there; turning autoreplying off does not need the mailbox and answers for real","needs":[{"path":"/dd/TMP/arep","missing":true},{"path":"/dd/USR/LIB/ELM/autoreply.data","missing":true},{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/nlslib/","missing":true},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/ELM","size":11662,"usage":"Usage: autoreply \u003cfilename>\tto start autoreply,","star":true,"cat":"Communications","sub":"Mail"},{"name":"back","desc":"backgammon on a full board, points numbered 1 to 24, with the dice cup and the doubling status beside it. Single letters are the commands: R rolls, D doubles, H is the help, N starts a new game, Q quits","dir":"CMDS/GAMES","size":21010,"star":true,"howto":"Single letters are the commands: R rolls, D doubles, H is the help, N starts a new game, Q quits.","cat":"Games","sub":"Board & card"},{"name":"backgammon","desc":"backgammon, with a computer opponent","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":38612,"usage":"Usage:  backgammon [-] [n r w b pr pw pb t3a]","star":true,"cat":"Games","sub":"Other games"},{"name":"banner","desc":"print large banner text","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":7630,"star":true,"hassrc":true,"cat":"Text tools","sub":"Banners & text art"},{"name":"basename","desc":"strip directory from a pathname (M.C. Gregorie, 1994)","dir":"CMDS","size":2206,"usage":"Syntax:   basename \u003cpath> [\u003csuffix>]\nFunction: Outputs string after deleting any\n   prefix ending in / and the suffix\n   if it is present\nOptions:  none","star":true,"cat":"Files & directories","sub":"Paths"},{"name":"bash","desc":"GNU Bourne-Again Shell 1.12 -- this disk's shell; reads .bashrc. It CANNOT serve as $SHELL for a program that shells out: it reads system()'s command line as a script filename.  `ksh' is the one that can, and SYS/login sets SHELL to it. DOC/README-SHELLS compares all five","needs":[{"path":"/dd/local/sys/profile","missing":false},{"path":"/dd/sys/profile","missing":false},{"path":"/dd/tmp/","missing":false},{"path":"/dd/sys/password","missing":false},{"path":"/h0/sys/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/SYS/errmsg","missing":false},{"path":"/h0/SYS/errmsg","missing":false}],"dir":"CMDS","size":242604,"usage":"usage: fc [-e ename] [-nlr] [first] [last] or fc -s [pat=rep] [command]","docs":true,"cat":"Shells","sub":"Shells"},{"name":"basicwin","desc":"X11 demo - basic window (needs an X server)","src":"x11r6pl13_lib_v0_6","origin":"Microware OS-9 archive","archive":"x11r6pl13_lib_v0.6.lzh","dir":"CMDS","size":11074,"hassrc":true,"cat":"Graphics & images","sub":"X11"},{"name":"bcheck","desc":"count brackets in a source file and report a mismatch.","dir":"CMDS","size":2150,"usage":"Syntax: bcheck [\u003copt>] [\u003cfilename>]\nFunction: check sourcefile for correct bracketcount\nOptions:\n-q   quiet mode\n-?   show this explanation","star":true,"cat":"Developer tools","sub":"Source checking"},{"name":"bdecode","desc":"decode a batched news article","dir":"CMDS/NEWS","size":8818,"usage":"Usage: bdecode [file]","star":true,"cat":"Communications","sub":"News"},{"name":"beav","desc":"BEAV 1.40 -- Binary Editor And Viewer (needs TERM)","needs":[{"path":"/dd/sys","missing":false},{"path":"/h0/sys","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":85950,"usage":"Syntax   : beav {\u003cfilename>}\nFunction : binary file editor and viewer\nOptions  : \u003cnone>","docs":true,"hassrc":true,"howto":"Full-screen binary editor: `beav \u003cfile>'. Control-C leaves it.","cat":"Editors","sub":"Binary & hex"},{"name":"bibtex","desc":"BibTeX -- bibliography formatter, and it WORKS.  It reads the job name from STANDARD INPUT (`Please type input file name (no extension)--' is a prompt, not silence), and the .bst styles are in SYS/TEX/INPUTS -- plain, unsrt, abbrv and alpha -- not in SYS/TEX/BIB, which holds a read.me","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":139392,"howto":"It reads the job name from STANDARD INPUT -- `Please type input file name (no extension)--' is a prompt, not silence. The .bst styles are in SYS/TEX/INPUTS (plain, unsrt, abbrv, alpha), not SYS/TEX/BIB, which holds one read.me. A BACKSLASH CANNOT BE TYPED at this shell -- bash's echo eats `\\c' -- so patch one in with `pbyte \u003cfile> \u003chex offset> 5c'.","cat":"Text tools","sub":"TeX"},{"name":"bigsetter","desc":"Modula-2 set-operations demonstration","dir":"CMDS","size":23512,"cat":"System & modules","sub":"Utilities"},{"name":"bincheckr","desc":"check a GNU Chess opening-book file -- it reports booksize 0 for the 145 KB book that ships here, then aborts","dir":"CMDS/GAMES","size":24366,"docs":true,"howto":"It is in CMDS/GAMES, not CMDS. `bincheckr /dd/GAMES/gnuchess.book' prints the book's entrysize and counts and then faults at close.","cat":"Games","sub":"Chess utilities"},{"name":"binhex","desc":"Encode a file as Macintosh BinHex 4.0","dir":"CMDS","size":31262,"usage":"Usage: binhex [-binhex] [files]","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"bio","desc":"a biorhythm chart (F. Kaefer's Biorhythm V2.2e) in BASIC09 -- `runb bio' asks a Date and a Birthday as DD.MM.YYYY (RETURN at the Date prompt takes your system date), then `g' for a graph (or `v' for values) and a number of days, and plots the physical, emotional and mental cycles","dir":"CMDS","size":4594,"basic09":true,"hassrc":true,"howto":"A biorhythm chart (F. Kaefer's Biorhythm V2.2e, BASIC09) -- `runb bio' draws it. It asks a Date, then a Birthday, both as DD.MM.YYYY (dots, four-digit year, e.g. 06.09.1954; RETURN at the Date prompt takes your system date), then `g' for a graph (or `v' for values) and a number of days, and plots the physical, emotional and mental cycles.","cat":"Amusements","sub":"Biorhythms"},{"name":"bioradtopgm","desc":"Bio-Rad confocal to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45386,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"biory","desc":"biorhythm chart, in German: asks a name (Name Vorname), a birth date as TTMMJJ and a span of years as JJ-JJ, and writes the chart -- Koerper, Seele, Geist, month by month -- to Biory.Lis in the current directory.  Needs `load /dd/CMDS/os9lib' first; RETURN at the name prompt ends it. Source: SRC/rtf/biory.f","src":"rtf","origin":"EFFO forum","archive":"disk 5 SPRACHEN/FORTRAN/BIORY -- RTF/68K example","dir":"CMDS","size":6066,"hassrc":true,"cat":"Amusements","sub":"Biorhythms"},{"name":"bison","desc":"GNU bison 1.19 parser generator -- ADDED; skeletons in /dd/LIB","needs":[{"path":"/dd/tmp/b.","missing":true},{"path":"/h0/lib/bison.simple","missing":false},{"path":"/h0/lib/bison.hairy","missing":false}],"dir":"CMDS","size":60582,"usage":"Usage: bison [-dltvyV] [-b file-prefix] [-o outfile] [-p name-prefix]","docs":true,"cat":"Compilers & build","sub":"Make & generators"},{"name":"bite","desc":"a skull animation","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":31572,"hassrc":true,"howto":"Full-screen: it takes over the display. **`q' quits**.","cat":"Screen toys","sub":"Screen toys"},{"name":"blackjack","desc":"Las Vegas blackjack (M. Theys, 1969) in BASIC09 -- `runb blackjack' asks your name and whether you want the rules, then takes a wager and deals: RETURN draws, `s' stands, `d' doubles down, `x' splits a pair, a wager of 0 ends the game (blackjak, in GAMES, is the SNOBOL4 one)","dir":"CMDS","size":6524,"basic09":true,"howto":"BASIC09 I-code: `load /h1/CMDS/runb' then `runb blackjack' (bare module name -- a pathname gives BASIC09 error 43). It asks your name and whether you want the rules, then takes a wager and deals: RETURN draws a card, `s' stands, `d' doubles down, `x' splits a pair; a wager of 0 ends the game. runb links the `math' trap handler from the execution directory, so leave chx at CMDS -- tested, plays a full hand.","cat":"Games","sub":"Board & card"},{"name":"blackjak","desc":"Las Vegas BlackJack (SNOBOL4-in-C).  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false}],"dir":"CMDS/GAMES","size":22146,"star":true,"hassrc":true,"cat":"Games","sub":"Board & card"},{"name":"blastem","desc":"XModem and YModem file transfer, written for the MM/1","dir":"CMDS/COMMS","size":28774,"usage":"Syntax: blastem [\u003copts>] {\u003cfilename> [\u003copts>]}\nFunction: Xmodem/Ymodem file transfer utility\nOptions:\n  -y   use YModem (Batch) protocol","cat":"Communications","sub":"Terminal & transfer"},{"name":"bm","desc":"bm - fast grep utility (Boyer-Moore)","dir":"CMDS","size":6834,"star":true,"docs":true,"cat":"Text tools","sub":"Search & match"},{"name":"bmgtest","desc":"Boyer-Moore-Gosper substring search demo","src":"strsch","origin":"usenet archive","archive":"strsch.ar","dir":"CMDS","size":4710,"usage":"usage: bmgtest [-i] [-n] pattern [file ...]","star":true,"hassrc":true,"howto":"bmgtest [-i] [-n] \u003cpattern> [file ...]. A demonstration of Boyer-Moore-Gosper searching.","cat":"Text tools","sub":"Search & match"},{"name":"bmgtest2","desc":"Boyer-Moore-Gosper substring search demo (variant)","src":"strsch","origin":"usenet archive","archive":"strsch.ar","dir":"CMDS","size":5712,"usage":"usage: bmgtest [-i] [-n] pattern [file ...]","star":true,"hassrc":true,"cat":"Text tools","sub":"Search & match"},{"name":"bmptoppm","desc":"BMP to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":48112,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"bog","desc":"Boggle word game","src":"bog","origin":"usenet archive","archive":"bog.ar","needs":[{"path":"/dd/GAMES/BOG/dict","missing":false},{"path":"/dd/GAMES/BOG/dict.ind","missing":false},{"path":"/dd/GAMES/BOG/helpfile","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":48526,"usage":"Usage: bog [-b] [-d] [-s#] [-t#] [-w#] [+[+]] [boardspec]","docs":true,"hassrc":true,"howto":"Boggle. Space starts the three-minute round, `?' shows the rules, and you type every word you can trace through adjoining letters. Control-C leaves it. Its word list, index and help are in GAMES/BOG.","cat":"Games","sub":"Word & guessing"},{"name":"bootgen","desc":"generate an OS-9 boot file","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":8576,"usage":"Syntax:   bootgen [\u003copts>] \u003cdevice> {\u003cpath> [\u003copts>] }\nFunction: maintain boot file on disk\nOptions:  [\u003cn> is 'dd' or '$hh']\n-a   append files to end of existing boot","star":true,"hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"bootlogger","desc":"log what happens during boot","needs":[{"path":"/dd/sys/bootlog","missing":false},{"path":"/dd/cmds/del","missing":true}],"dir":"CMDS","size":3610,"star":true,"cat":"System & modules","sub":"Utilities"},{"name":"booz","desc":"Extract or list a zoo archive.  Public domain, Rahul Dhesi","dir":"CMDS","size":11026,"usage":"Usage:  booz {lxt} archive[.zoo] [ file ... ]","star":true,"docs":true,"howto":"Extracts and lists zoo archives. `booz -l file.zoo' to look, `booz -x' to extract. fiz repairs a zoo archive that will not open.","cat":"Archives & compression","sub":"zoo"},{"name":"break","desc":"send a BREAK on a serial line -- an assembler example, and it calls F$SysDbg, the system-debugger trap, on its way there.  On a machine with a debugger attached that drops you into it and waits for an answer, which in a script is a hang","src":"forum5","origin":"Microware OS-9 archive","archive":"forum5.lzh","dir":"CMDS","size":290,"usage":"Syntax: break\nFunction: invokes the system level debugger","hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"brushtopbm","desc":"Xerox brush to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":41862,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"bsplt68","desc":"Split a boot file into its component modules (Carl Kreider)","dir":"CMDS","size":4276,"cat":"System & modules","sub":"OS-9 modules"},{"name":"btoa","desc":"Binary-to-ASCII encode","src":"btoa","origin":"Microware OS-9 archive","archive":"btoa.lzh","dir":"CMDS","size":14638,"usage":"Usage : btoa \u003cfilein >fileout","docs":true,"hassrc":true,"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"btop","desc":"convert characters to bit patterns -- its own Function: line, and what it does: `btop \u003cfile>' prints each character as a grid of O and space.","dir":"CMDS","size":15816,"usage":"Syntax:   BtoP [\u003copts>] [\u003cpath1>] [\u003copts>] [\u003cpath2>] [\u003copts>]\nFunction: convert characters to bit patterns\nOptions:  -o  use stdin for input, path1 for output","cat":"System & modules","sub":"Utilities"},{"name":"btree","desc":"B-tree file handling demonstration and test","dir":"CMDS","size":21594,"star":true,"docs":true,"cat":"Editors","sub":"SEDT family"},{"name":"buildhash","desc":"build ispell's dictionary hash.  It reads a word list called `dict.191' (the name is compiled in). /dd/LIB/ispell.hash is the built hash, 490,186 bytes, and it ships, so ispell itself reads that and works.  `chardef' reads the same word list.","src":"ispell","origin":"hc disk","archive":"SOURCES/USENET/ISPELL/","needs":[{"path":"/dd/LIB","missing":false}],"dir":"CMDS","size":21564,"hassrc":true,"cat":"Text tools","sub":"Spelling & words"},{"name":"byteflip","desc":"byte-swap a dbz database between architectures -- hand it a dbz database","dir":"CMDS/NEWS","size":1882,"star":true,"howto":"It is in CMDS/NEWS. Hand it a dbz database to byte-swap between architectures.","cat":"Communications","sub":"News"},{"name":"c7decode","desc":"decode 7-bit-safe encoded news","dir":"CMDS/NEWS","size":2304,"star":true,"cat":"Communications","sub":"News"},{"name":"cal","desc":"Calendar, Bob van der Poel.  `cal -h' prints holidays with it -- SYS/holidays is here, and SYS/birthdays is an empty template for your own dates.  SYS/cal.init is a printer setup for a laser","needs":[{"path":"/dd/sys/cal.holidays","missing":false},{"path":"/dd/sys/cal.init","missing":false},{"path":"/dd/sys/holidays","missing":false}],"dir":"CMDS","size":13184,"usage":"Usage: calendar [\u003copts>]\nFunction: Prints a calendar to standard output\nOptions:\n-b   print in big format","star":true,"howto":"`cal -m=\u003cmonth> -y=\u003cyear>', with flags. -h marks the holidays in SYS/holidays and anything you add to SYS/birthdays, which it includes.","cat":"Time & calendar","sub":"Calendars"},{"name":"calen","desc":"calendar printer (v_misc)","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)   [also built from v_misc]","dir":"CMDS","size":21486,"hassrc":true,"cat":"Time & calendar","sub":"Calendars"},{"name":"calender","desc":"print a whole year's calendar (German)","src":"calender","origin":"EFFO forum","archive":"disk, from c't 3/88 p.148 and 9/88 p.80","dir":"CMDS","size":5748,"star":true,"hassrc":true,"howto":"A whole year at once, in German. It asks `Fuer welches Jahr?' (which year); RETURN at the question ends it.","cat":"Time & calendar","sub":"Calendars"},{"name":"cam","desc":"CAMSHAFT, not camera: it asks for the rocker ratio, the lift at a crank angle and the base circle, and plots the lift curve for an intake lobe.  The plot is Tektronix vectors, so on a vt100 it arrives as characters -- the dialogue above it is the readable part.","src":"tekdemos","origin":"Microware OS-9 archive","archive":"TekDemos.t.Z","dir":"CMDS/GAMES","size":5434,"star":true,"hassrc":true,"cat":"Maths & calculators","sub":"Calculators"},{"name":"card","desc":"Towers of Hanoi whose twelve disks are the lines of a Christmas message; VT100, wants TERMCAP","src":"card","origin":"usenet archive","archive":"comp.sources -- Istvan Mohos 1984","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":20952,"hassrc":true,"cat":"Screen toys","sub":"Screen toys"},{"name":"casefix","desc":"normalise letter case -- A FILTER, and it reads STANDARD INPUT.  Given a file as an argument it says nothing at all; `casefix \u003c file' sentence-cases it","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":6204,"hassrc":true,"howto":"It is a FILTER and reads STANDARD INPUT: `casefix \u003c file' sentence-cases it.","cat":"Text tools","sub":"Transform & filter"},{"name":"cat","desc":"concatenate files (S.M. Ryger, 1987)","dir":"CMDS","size":5322,"star":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"cb","desc":"C beautifier","dir":"CMDS","size":4408,"usage":"Usage:  cb \u003cinput.fil >output.fil","star":true,"cat":"Developer tools","sub":"Source formatting"},{"name":"cc1plus","desc":"GCC 2.x C++ compiler pass, where it was built","needs":[{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS/GCC2","size":818786,"cat":"Compilers & build","sub":"C toolchain"},{"name":"cc2","desc":"GCC 2.x C compiler pass, where it was built","needs":[{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS/GCC2","size":990198,"cat":"Compilers & build","sub":"C toolchain"},{"name":"cc2plus","desc":"GCC 2.x C++ pass, second form","dir":"CMDS/GCC2","size":1372920,"cat":"Compilers & build","sub":"C toolchain"},{"name":"cccp2","desc":"GCC 2.x preprocessor, where it was built","needs":[{"path":"/DD/DEFS","missing":false},{"path":"/DD/DEFS/GCC2","missing":false},{"path":"/DD/DEFS/GPP2","missing":true}],"dir":"CMDS/GCC2","size":84024,"usage":"Usage: cccp2 [switches] input output","star":true,"cat":"Compilers & build","sub":"C toolchain"},{"name":"ccheck","desc":"C program checker -- matching brackets, quotes, comment brackets, and indentation that disagrees with them","dir":"CMDS","size":8606,"usage":"Syntax  : ccheck [\u003copts>] \u003cfile>...\nFunction: To find and report all badly matched openers\n   and closers plus assignment/equality\n   confusions in a C source file.\nOptions :\n-q   quiet mode (suppress warnings)\n-s   synomym of quiet mode\n-v   verbose mode","star":true,"docs":true,"hassrc":true,"howto":"Checks C source for mismatched brackets, quotes and comment markers, and for indentation that disagrees with the nesting. Needs cio.","cat":"Developer tools","sub":"Source checking"},{"name":"cdiff","desc":"context diff.  Built `-qm' from SRC/v_misc/cdiff.c, it produces a real context diff: `>>>> INSERT BEFORE 2'. DOC/README-CIO","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":17838,"hassrc":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"charcnt","desc":"Count characters in a file (Carl Kreider)","dir":"CMDS","size":2324,"star":true,"cat":"Text tools","sub":"Count & inspect"},{"name":"chardef","desc":"define a character set -- it reads the same `dict.191' word list as `buildhash'.  Run bare it ends the os9exec session, so give it its input.","src":"eff_chardef","origin":"EFFO forum","archive":"disk 7   C/CHARDEF","dir":"CMDS","size":18398,"usage":"Syntax: defchar [\u003cpath>]\nFunction:defines a new Charset for VT220 Terminals\nOptions: none","docs":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"chbase","desc":"converts a number from one base to another: `chbase 255 10 16' prints FF, and a target base of 0 prints every base from 2 to 36","dir":"CMDS","size":4136,"usage":"Syntax   : chbase \u003cnumber> [ \u003cbase A> [ \u003cbase B> ] ]\n   base A : base of entry  (default=10)\n   base B : base of output (default=16)\n   (B='0' prints all bases from 2 to 36)","star":true,"cat":"Maths & calculators","sub":"Calculators"},{"name":"checkalias","desc":"check an alias resolves before you rely on it. `listalias' answers the same question and prints its result","dir":"CMDS/ELM","size":2132,"usage":"Usage: checkalias alias [alias ...]","star":true,"cat":"Communications","sub":"Mail"},{"name":"checkenv","desc":"compares an environment variable with a value for a script to branch on: `checkenv \u003cname> , \u003cvalue>', spaces round the comma.  It returns 0 whether the value matches or not, so `getenv -p \u003cname>', which prints the value, is the one to use for a reliable branch","src":"checkenv","origin":"Microware OS-9 archive","archive":"checkenv.lzh","dir":"CMDS","size":1912,"usage":"Syntax: checkenv \u003ceparam> , \u003cevalue>\nFunction: check environment variable value","star":true,"docs":true,"hassrc":true,"howto":"`checkenv \u003cname> , \u003cvalue>' with spaces round the comma. Meant to return an error when they differ; it returns 0 either way.","cat":"Shells","sub":"Shell helpers"},{"name":"checkfile","desc":"a CHEQUE BOOK -- a full-screen account manager, John R. Wainwright, 1992.  Records carry Date, Type, Description, Account and Amount; the menu is A - Add Records, B - Print Balance, R - Report, F - Select File, V - View/Edit, Q - Quit, and it opens `testfile.dat' unless you pick another.  Wants TERM.  For checking C source, that is `ccheck'","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":16260,"star":true,"docs":true,"hassrc":true,"howto":"Full-screen: it takes over the display. **`q' quits**.","cat":"Maths & calculators","sub":"Spreadsheets"},{"name":"checkgame","desc":"check a saved GNU Chess game for illegal moves and print the board it finishes on.  It reads the `chess.lst' that gnuchess writes when you type `list'.  A different program from `game', which makes PostScript","dir":"CMDS/GAMES","size":27582,"usage":"Usage: game file [start [end] ]","docs":true,"howto":"It reads the `chess.lst' that gnuchess writes when you type `list'. Play in a directory of your own -- `ksh -c \"cd /dd/tmp/mine; gnuchess\"' -- type `list' then `quit', and then `checkgame /dd/tmp/mine/chess.lst'.","cat":"Games","sub":"Chess utilities"},{"name":"checksum","desc":"file checksum","src":"eff_checksum","origin":"EFFO forum","archive":"disk 23  f23b/SOFTWARE/CHECKSUM","info":{"version":"Ed #1","purpose":"calulates 16-bit checksum","status":"final","language":"C","author":"Lukas Zeller","availability":"Public, EFFO Forum 23","copyright":"(c) 1992 by L.Zeller"},"dir":"CMDS","size":3812,"usage":"Syntax:   checksum \u003cfile> [\u003cfile>...]\nFunction: checksum calculation\nOptions:  -?   : displays this text\n   -n=\u003cn>   : calculate over \u003cn> bytes, (empty=$FF)\n   -s=\u003cn>   : start calculation at offset \u003cn>","star":true,"docs":true,"hassrc":true,"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"chess","desc":"chess against the machine on a shaded board.  It asks for your colour, your name and a long or short game, then takes a move as two squares -- `e2' then `e4', two keystrokes each with no RETURN.  68k port, three engine versions built","src":"chess","origin":"usenet archive","archive":"chess.ar","dir":"CMDS/GAMES","size":23602,"usage":"Syntax: chess [\u003copts>] \u003cname> [\u003copts>]\nFunction: plays interactive chess\nOptions:\n-b\tplay black pieces\n-l\tlong game\n-s\tshort game\n-w\tplay white pieces","hassrc":true,"howto":"It asks for your colour, your name and a long or short game, then takes a move as two squares -- `e2' for the piece and `e4' for where it goes. Each square is two keystrokes and needs no RETURN.","cat":"Games","sub":"Board & card"},{"name":"chgrp","desc":"change group","needs":[{"path":"/dd/sys/password","missing":false}],"dir":"CMDS","size":3552,"usage":"Usage:  chgrp [-z] {numerical-gid | username} [file [... file]]","star":true,"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"chksum","desc":"32-bit file checksum","src":"chksum","origin":"usenet archive","archive":"chksum.ar","dir":"CMDS","size":5334,"star":true,"docs":true,"hassrc":true,"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"chown","desc":"change owner","needs":[{"path":"/dd/sys/password","missing":false}],"dir":"CMDS","size":3552,"usage":"Usage:  chown [-z] {numerical-uid | username} [file [... file]]","star":true,"docs":true,"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"ci","desc":"RCS check in","needs":[{"path":"/dd/tmp","missing":false},{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":47684,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"cio","desc":"Microware's C library trap module -- what every starred program here needs.  Included with Microware's permission; see SOURCES.txt.  You do not run it, it loads itself.","dir":"CMDS","size":18058,"cat":"System & modules","sub":"Microware runtime"},{"name":"cjpeg","desc":"JPEG encoder (IJG).  Makes a JPEG from a PNM.  It wants LF between the fields of a PNM header where the netpbm here writes CR, so patch the three separators with `pbyte' first; DOC/STATUS has the offsets both ways.","needs":[{"path":"/dd/TEMP","missing":true}],"dir":"CMDS","size":50788,"usage":"usage: cjpeg [switches]","docs":true,"howto":"Makes a JPEG from a PNM -- but not straight from a netpbm PNM. cjpeg wants LF between the header fields and this disk's netpbm writes CR, so it says \"Bogus data in PPM file\". Patch the three separators with `pbyte` first: for `ppmmake red 8 8` they are at offsets 2, 6 and a. DOC/STATUS has the full recipe both ways.","cat":"Graphics & images","sub":"JPEG"},{"name":"cjpeg.070","desc":"JPEG encoder, a build for another processor.  On the 68000 its twin `cjpeg' is the one to use; the .070 files are builds for a different CPU.","dir":"CMDS","size":69194,"usage":"usage: cjpeg.070 [switches]","cat":"Graphics & images","sub":"JPEG"},{"name":"ckermit","desc":"C-Kermit 5A(190) BETA.14, 24 Jul 94 -- the cio build.","dir":"CMDS","size":356040,"star":true,"docs":true,"cat":"Communications","sub":"Kermit"},{"name":"clear","desc":"clear the screen","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/C/CLEAR","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":4204,"usage":"Syntax:   clear\nFunction: Clears the screen.","star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"clock","desc":"display a clock","src":"misc","origin":"usenet archive","archive":"misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":36566,"hassrc":true,"cat":"System & modules","sub":"System state"},{"name":"cls","desc":"clear the screen (termcap)","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":15646,"usage":"Syntax: cls\nFunction: clear terminal screen, uses TERM enviroment variable\n   and 'termcap' to clear screen\nOptions: none.","hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"cmuwmtopbm","desc":"CMU window manager to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":41790,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"co","desc":"RCS check out","needs":[{"path":"/dd/tmp","missing":false},{"path":"/dd/cmds/rcs","missing":false},{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":42308,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"collect","desc":"GCC 2.x collect2, where it was built","dir":"CMDS/GCC2","size":17634,"usage":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n   -l=\u003cfile>   process library","cat":"Compilers & build","sub":"C toolchain"},{"name":"colortest","desc":"G-Windows colour chart","dir":"CMDS/GAMES","size":5676,"star":true,"cat":"Games","sub":"Other games"},{"name":"combine","desc":"interleave two files BYTE BY BYTE, one supplying the even bytes and the other the odd -- how a 16-bit EPROM image is put back together from two 8-bit halves.  F.R.Schmitt, 1989.","dir":"CMDS","size":3688,"usage":"Syntax: combine [\u003cfile1>] [\u003cfile2>] [\u003coutfile>] [\u003copt>]\nFunction: combine files with even and odd bytes\nOptions:\n-q   quiet mode [no prints]\n-?   show this explanation","star":true,"cat":"System & modules","sub":"Utilities"},{"name":"compiler","desc":"GSHELL front-end for the C compiler","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":22090,"usage":"Syntax: compiler [\u003cpath>]\nFunction: a menue driven compiler shell\nOptions: none","docs":true,"hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; none of q, Q, control-D or ESC do.","cat":"Compilers & build","sub":"C toolchain"},{"name":"compr","desc":"file compressor","dir":"CMDS","size":17762,"usage":"Usage: compress [-dfvcV] [-b maxbits] [file ...]","docs":true,"cat":"Archives & compression","sub":"Compress a file"},{"name":"compress","desc":"compress/uncompress (LZW) -- ADDED","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":20484,"usage":"Usage: compress [-dfvoV] [-b MaxBits] [file ...]","docs":true,"hassrc":true,"cat":"Archives & compression","sub":"Compress a file"},{"name":"compress_4.0","desc":"compress 4.0, another edition of CMDS/compress","dir":"CMDS/REBUILT","size":31720,"usage":"Syntax   : compress [-cdfvV] [-b maxbits] [file ...]\nFunction : compress files\nOptions  :\n-b  \u003cbits> set max number of bits for common substrings\n-c   write result to stdout\n-d   decompress\n-f   overwrite already existing files\n-v   print compression factors\n-V   print version number","cat":"Archives & compression","sub":"Alternates"},{"name":"compress_rebuilt","desc":"our source build of CMDS/compress, from the same hc_utils source.  Same program, and the two agree byte for byte on what they write","dir":"CMDS/REBUILT","size":20434,"usage":"Usage: compress [-dfvoV] [-b MaxBits] [file ...]","cat":"Archives & compression","sub":"Alternates"},{"name":"config","desc":"report this machine's C type properties as #defines -- char, short, int, long, pointer and float all come out; it then aborts where `double' begins, because that needs a 68881 or Microware's fpu.  See DOC/README-BUSERR","dir":"CMDS","size":21944,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"connect","desc":"connect to a serial line","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":6494,"usage":"Usage: connect [\u003cswitches>] [\u003cpath1>] [\u003cswitches>] [\u003cpath2>]","star":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"convert","desc":"STARTS the `world' adventure. Run it and you get `WORLD. Amiga C  Version 1.02 Copyright 1987 J.D. McDonald  GOOD LUCK!', the opening paragraph and a `>'
