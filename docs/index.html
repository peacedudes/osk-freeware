<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A guide to the 935 programs on the OS-9/68K freeware disk, grouped by what they are for.">
<meta name="color-scheme" content="light dark">
<title>OS-9/68K Freeware Collection — a guide to 935 programs</title>
<style>
  :root{
    --paper:#F4F5F3; --card:#FFF; --ink:#191D21; --dim:#454E55; --faint:#6E787F;
    --rule:#DDE1DE; --hair:#EBEEEB; --accent:#B26A00; --soft:#F7E8D2;
    --warn:#8C2F1E; --ok:#2E6A4F; --screen:#0E1113; --phosphor:#CFE3CF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#B1BCC3; --faint:#8A959C;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}}
  :root[data-theme="dark"]{
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#B1BCC3; --faint:#8A959C;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* THE PAGE IS THREE COLUMNS: what kinds of thing there are, the programs
     of one kind, and one program.  Choosing in a column fills the next one
     and never covers the one you chose in -- the reader keeps their place. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px 22px;align-items:center;
       padding:12px 20px 10px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;
          white-space:nowrap}
  .top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;
                color:var(--dim);letter-spacing:0}
  .top input[type=search]{width:100%;max-width:520px;font:inherit;font-size:15px;padding:8px 12px;
    border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
  .only{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .only > span{display:flex;gap:6px}
  .shellsw{padding-right:12px;margin-right:6px;border-right:1px solid var(--rule)}
  .chip{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--dim);white-space:nowrap}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}

  .cols{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(380px,1.5fr);
        min-height:0;height:100%}
  .col{min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--rule)}
  .col:last-child{border-right:0}
  .col > h2{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.03em;
          color:var(--faint);margin:0;padding:14px 16px 6px}

  /* column one: categories, then the alphabet */
  .kinds{list-style:none;margin:0;padding:0 8px 8px}
  .kinds li{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;
            cursor:pointer;font-size:14px}
  .kinds li .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
               font-variant-numeric:tabular-nums}
  .kinds li:hover{background:var(--hair)}
  .kinds li[aria-current="true"]{background:var(--soft);color:var(--ink)}
  .kinds li[aria-current="true"] .n{color:var(--accent)}
  .abc{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 12px 20px}
  .abc button{font:500 12px/1 var(--mono);padding:7px 0;border:1px solid transparent;
              border-radius:6px;background:none;color:var(--dim);cursor:pointer}
  .abc button:hover{border-color:var(--rule);color:var(--ink)}
  .abc button[aria-current="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
  .abc button:disabled{color:var(--faint);opacity:.4;cursor:default}

  /* column two: the programs of one kind */
  .lede{padding:0 18px 12px;font-size:13.5px;color:var(--dim);max-width:52ch}
  .subh{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
        color:var(--faint);padding:14px 18px 4px;border-top:1px solid var(--hair)}
  .subh:first-of-type{border-top:0}
  .progs{list-style:none;margin:0;padding:0 8px 8px}
  li.p{display:grid;grid-template-columns:auto minmax(88px,120px) 1fr;gap:9px;padding:5px 10px;
       align-items:baseline;cursor:pointer;border-radius:7px}
  li.p:hover{background:var(--hair)}
  li.p[aria-current="true"]{background:var(--soft)}
  .nm{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nm .st{color:var(--accent)}
  .ds{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
  .ds .where{color:var(--faint)}
  li.p .pick{width:18px;height:18px;align-self:start;margin-top:2px;border:1px solid var(--rule);border-radius:4px;
    background:var(--card);color:var(--faint);font:600 12px/16px var(--mono);text-align:center;
    cursor:pointer;padding:0}
  li.p .pick:hover{border-color:var(--accent);color:var(--accent)}
  li.p.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff}
  .overview{padding:4px 8px 12px}
  .overview li{display:block;padding:9px 10px;border-radius:7px;cursor:pointer}
  .overview li:hover{background:var(--hair)}
  .overview .ct{font-family:var(--serif);font-size:16px;font-weight:600}
  .overview .ct .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;
                   margin-left:6px}
  .overview .blurb{font-size:12.5px;color:var(--dim);margin:2px 0 0}
  .empty{padding:40px 18px;color:var(--dim);font-size:14px;max-width:48ch}

  /* column three: one program */
  .panel{padding:18px 22px 40px}
  .pn{font-family:var(--mono);font-size:22px;font-weight:600;margin:0}
  .pd{color:var(--dim);margin:5px 0 0;font-size:15px;max-width:60ch}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .flag{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
        color:var(--dim)}
  .flag.cio{border-color:var(--accent);color:var(--accent)}
  .flag.mil{border-color:var(--warn);color:var(--warn)}
  .flag.ok{border-color:var(--ok);color:var(--ok)}
  dl{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;margin:18px 0 0;font-size:13.5px}
  dt{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
     padding-top:2px}
  dd{margin:0;color:var(--ink);overflow-wrap:anywhere;min-width:0}
  dd code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  dd .miss{color:var(--warn)}
  dd pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  pre.shot{font-family:var(--mono);font-size:11px;line-height:1.2;margin:0;
    white-space:pre;overflow-x:auto;background:var(--screen);color:var(--phosphor);
    border-radius:6px;padding:10px 12px}
  pre.shot .pr{color:var(--faint)}
  .shotcap{margin:.5rem 0 0;color:var(--dim);font-size:12.5px;line-height:1.45;max-width:64ch}
  .brings{display:flex;align-items:baseline;gap:12px;margin:14px 0 0;font-size:13px}
  .brings ul{list-style:none;margin:0;padding:0;color:var(--dim)}
  .brings li{display:flex;gap:10px;align-items:baseline}
  .brings code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .brings .sz{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .brings .note{font-size:12px;color:var(--faint)}
  dd .howto{font-size:13px;line-height:1.45;max-width:64ch}
  dd.advice{color:var(--dim);font-size:12.5px;line-height:1.45}
  dd .okk{color:var(--ok);font-size:11.5px}
  dd a.kin{color:var(--accent);text-decoration:none}
  dd a.kin:hover{text-decoration:underline}
  .try,.needs{display:flex;align-items:baseline;gap:12px;margin:14px 0 0;font-size:13.5px}
  .try .k,.needs .k,.see .k,.brings .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;
     letter-spacing:.03em;flex:0 0 auto}
  .try code{font-family:var(--mono);font-size:14.5px;color:var(--ink);background:var(--paper);
     border:1px solid var(--rule);border-radius:6px;padding:6px 11px}
  .try code .pr{color:var(--faint)}
  .needs code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .needs span{color:var(--dim)}
  .see{margin:16px 0 2px}
  .see .k{display:block;margin:0 0 6px}
  /* The program's own help, whole, right under the picture of it running:
     the reader should not have to open anything to see the options.  The
     header line is the command that asked for it, at the reader's prompt. */
  .help{margin:16px 0 2px}
  .help .k{display:block;margin:0 0 6px}
  .help pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  .help pre.usage .pr{color:var(--faint)}
  .help .none{color:var(--dim);font-size:13px}
  /* Details and provenance are always open.  They were a fold, and the fold
     closed again every time the shell switch re-rendered the card. */
  .more{margin:18px 0 0;border-top:1px solid var(--rule);padding-top:10px}
  .more .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.03em}
  .more dl{margin-top:10px}
    .back{display:none;font:inherit;font-size:13px;background:none;border:0;color:var(--accent);
        cursor:pointer;padding:0;margin:0 0 10px}
  .about{padding:24px 18px;color:var(--dim);font-size:13px;max-width:52ch;line-height:1.5}
  .about code{font-family:var(--mono);color:var(--ink)}
  .about p{margin:0 0 12px}

  /* the tray: programs ticked for `keep' */
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--rule);box-shadow:0 -6px 24px rgba(0,0,0,.10);
    transform:translateY(110%);transition:transform .18s ease}
  .tray.on{transform:none}
  .tray .row2{display:flex;gap:12px;align-items:center;padding:12px 20px 6px;flex-wrap:wrap}
  .tray .row2 .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;flex:0 0 7em}
  .tray code{flex:1 1 320px;font-family:var(--mono);font-size:13px;
    background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:9px 11px;color:var(--ink);overflow-x:auto;white-space:nowrap}
  .tray .meta{color:var(--dim);font-size:12.5px;padding:0 20px 12px;max-width:80ch;line-height:1.45}
  .tray .meta b{color:var(--ink);font-weight:600}
  .tray details{padding:0 20px 12px;font-size:12.5px;color:var(--dim)}
  .tray details summary{cursor:pointer;color:var(--accent);list-style:none}
  .tray details summary::-webkit-details-marker{display:none}
  .tray details ul{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:28px;max-height:22vh;overflow-y:auto}
  .tray details li{font-family:var(--mono);font-size:12px;break-inside:avoid}
  .tray details li .sz{color:var(--faint);margin-left:8px}

  /* TWO COLUMNS on a tablet held upright: the kinds become a strip across
     the top of the program column, and the program column and the panel
     stand side by side. */
  @media (max-width:1100px){
    .cols{grid-template-columns:minmax(280px,1fr) minmax(340px,1.4fr)}
    .col.kinds-col{grid-column:1;grid-row:1;border-right:0;border-bottom:1px solid var(--rule);
                   overflow-x:auto;overflow-y:hidden;max-height:none;height:auto}
    .cols{grid-template-rows:auto 1fr}
    .col.progs-col{grid-column:1;grid-row:2}
    .col.panel-col{grid-column:2;grid-row:1 / span 2}
    .kinds-col h2{display:none}
    .kinds{display:flex;gap:4px;padding:8px 10px;white-space:nowrap}
    .kinds li{padding:5px 9px;font-size:13px}
    .abc{display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto}
    .abc button{padding:5px 6px}
    .top{grid-template-columns:auto 1fr;gap:8px 16px}
    .only{grid-column:1 / -1;justify-content:flex-start}
  }
  /* ONE COLUMN on a phone: the list, then the panel over it with a way back. */
  @media (max-width:700px){
    .cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .col.panel-col{display:none;grid-column:1;grid-row:1 / span 2}
    .app[data-stage="panel"] .col.panel-col{display:block}
    .app[data-stage="panel"] .col.progs-col,.app[data-stage="panel"] .col.kinds-col{display:none}
    .back{display:inline-block}
    .top h1 small{display:none}
    .panel{padding:14px 16px 40px}
    dl{grid-template-columns:1fr;gap:2px 0}
    dt{padding-top:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app" data-stage="list">
  <header class="top">
    <h1>OS-9/68000 freeware<small>935 programs on one disk image, 1983&ndash;1998</small></h1>
    <input type="search" id="q" placeholder="Search names and descriptions"
           aria-label="Search programs" autocomplete="off">
    <div class="only">
      <span role="group" aria-label="Your shell" class="shellsw">
        <button class="chip" id="sh-unix" aria-pressed="true" title="bash or ksh, as on this disk">bash</button>
        <button class="chip" id="sh-os9" aria-pressed="false" title="Microware's own shell">OS-9 shell</button>
      </span>
      <span role="group" aria-label="Show only">
      <button class="chip" id="f-src" aria-pressed="false">Source on disk</button>
      <button class="chip" id="f-doc" aria-pressed="false">Has docs</button>
      <button class="chip" id="f-shot" aria-pressed="false">Sample output</button>
      </span>
    </div>
  </header>

  <div class="cols">
    <nav class="col kinds-col" aria-label="Kinds of program">
      <h2>Kinds</h2>
      <ul class="kinds" id="kinds"></ul>
      <h2>By name</h2>
      <div class="abc" id="abc"></div>
    </nav>
    <section class="col progs-col" id="progs-col" aria-label="Programs"></section>
    <section class="col panel-col" id="panel-col" aria-label="Program"></section>
  </div>
</div>

<div class="tray" id="tray" role="region" aria-label="Programs picked to keep">
  <div class="row2">
    <span class="k">see first</span><code id="traydry">keep -n</code>
    <button class="chip" id="traycopydry">Copy</button>
  </div>
  <div class="row2">
    <span class="k">then</span><code id="traycmd">keep</code>
    <button class="chip" id="traycopy">Copy</button>
    <button class="chip" id="trayclear">Clear</button>
  </div>
  <p class="meta" id="traysize"></p>
  <details><summary id="traysum">every file it would write</summary><ul id="trayfiles"></ul></details>
</div>

<script src="screens.js"></script>

th":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/ADL","size":49758,"howto":"`adlrun aard' in ADL/AARD plays the museum adventure at a > prompt; save and restore keep a game, quit leaves.","help":{"cmd":"adlrun -?","text":"Usage: adlrun [filename] [-d] [-h] [-r savefile]"},"cat":"Languages","sub":"Adventure authoring"},{"name":"adltouch","desc":"stamps a compiled ADL world with a number: `adltouch \u003cworld> \u003cn>' writes n into the first four bytes of the file, where the compiler left a #! line. Prints nothing","dir":"CMDS/ADL","size":12206,"howto":"`adltouch tiny 7' writes 7 into the first four bytes of the compiled world; dump the file to see it. It prints nothing.","help":{"cmd":"adltouch -?","text":"Usage: adltouch \u003cfile> \u003cnumber>"},"cat":"Languages","sub":"Adventure authoring"},{"name":"advcom","desc":"the ADVSYS adventure compiler: turns .adv source into the world file advint plays. It opens its `@objects.adi' include by bare name in the data directory and keeps a file name in 20 characters, so copy osample.adv and objects.adi from GAMES/ADVSYS to a directory of your own and run it there: `advcom osample'","src":"advint","origin":"usenet archive","archive":"advint.ar","dir":"CMDS/GAMES","size":31222,"hassrc":true,"howto":"The ADVSYS compiler. It opens its `@objects.adi' include by BARE NAME in the data directory and keeps a filename in 20 characters, so copy osample.adv and objects.adi from GAMES/ADVSYS to a directory of your own, `load /dd/CMDS/GAMES/advcom', then `sh -c \"chd /dd/tmp/adv; advcom osample\"'. It names every object it compiles and writes osample.dat.","help":{"note":"it takes the source name and nothing else; a flag is read as a file"},"cat":"Games","sub":"Adventure & fiction"},{"name":"advent","desc":"Colossal Cave Adventure, Will Crowther and Don Woods' mid-1970s original and the first text adventure -- self-contained, reads /dd/GAMES/adv/glorkz.  Needs this disk as /dd; mounted only as /h0 it cannot find its data.  Unrelated to advcom/advint.","src":"adv","origin":"usenet archive","archive":"adv.ar","needs":[{"path":"/dd/GAMES/adv/tmp.foo.baz","missing":true,"dir":false,"bytes":null},{"path":"/dd/GAMES/adv/glorkz","missing":false,"dir":false,"bytes":67665}],"dir":"CMDS/GAMES","size":40300,"docs":true,"hassrc":true,"howto":"Colossal Cave. Needs this disk as /dd -- it opens /dd/GAMES/adv/glorkz by absolute path, so mounted only as /h0 it cannot find its data.","help":{"note":"it takes no options; it asks its own questions"},"cat":"Games","sub":"Adventure & fiction"},{"name":"advint","desc":"the ADVSYS adventure interpreter: plays a world advcom compiled, opened by bare name in the data directory -- `advint osample' starts you in the livingroom. GAMES/ADVSYS/README has the details","src":"advint","origin":"usenet archive","archive":"advint.ar","dir":"CMDS/GAMES","size":28460,"docs":true,"hassrc":true,"howto":"Plays an ADVSYS world. Build one first (see advcom), then run it where the .dat is: `load /dd/CMDS/GAMES/advint', then `sh -c \"chd /dd/tmp/adv; advint osample\"' -- you start in the livingroom, `n' goes to the hallway, `e' to a storage room with a key.","help":{"cmd":"advint -?","text":"ADVINT v1.2 - Copyright (c) 1986, by David Betz\nusage: advint [-r\u003crows>] [-c\u003ccolumns>] [-l\u003clog-file>] \u003cfile>"},"cat":"Games","sub":"Adventure & fiction"},{"name":"afm2tfm","desc":"Adobe font metrics to TeX font metrics","dir":"CMDS/TEXCMDS","size":35194,"help":{"cmd":"afm2tfm","text":"afm2tfm 7.0, Copyright 1990-92 by Radical Eye Software\nUsage: afm2tfm foo[.afm] [-O] [-v|-V bar[.vpl]]\n                 [-p|-t|-T encodingfile] [foo[.tfm]]"},"cat":"Text tools","sub":"TeX"},{"name":"alps","desc":"Switch an ALPS ASP-1000 printer between draft and NLQ","dir":"CMDS","size":1674,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"alps -?","text":"Syntax: alps [\u003copts>] >/\u003cdevice>\nFunction: generate Alps ASP-1000 printer codes\nOptions:\n     -lq        letter quality mode\n     -norm      normal mode"},"cat":"Printing","sub":"Printers"},{"name":"animal","desc":"the guess-the-animal game that learns: `animal \u003cfile>' asks yes-or-no questions down a tree of what it knows, and when its guess is wrong asks what you were thinking of and writes it back into the file. DOC/animal/example is one to start from","src":"animal","origin":"usenet archive","archive":"animal.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":33386,"docs":true,"hassrc":true,"howto":"The file it learns from is one you name: `animal /dd/DOC/animal/example'. Answer y or n to each question; when its final guess is wrong it asks what you were thinking of and what question tells the two apart, and writes that back into the file. Control-C leaves it.","help":{"note":"it takes the file it learns from and no options"},"cat":"Games","sub":"Word & guessing"},{"name":"answer","desc":"replies to the messages in a folder one at a time: it clears the screen and asks `Message to:' for a recipient, checked against the alias table","needs":[{"path":"/dd/TMP/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/domain","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/hostname","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/domain","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/ELM","size":29342,"star":true,"help":{"note":"it takes no options: run it and it asks `Message to:'"},"cat":"Communications","sub":"Mail"},{"name":"ape","desc":"writes gibberish in the style of whatever it reads -- a travesty generator; `-b' is how much source to read and `-l' how many characters must match before it follows the source. `travesty' and `newsgen' are the others of its kind here","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":16572,"hassrc":true,"howto":"A travesty generator: `-b' is how much source to read and `-l' the pattern length. Feed it VARIED text -- one word repeated makes it generate without end, because every position matches every other.","help":{"cmd":"ape -?","text":"syntax: ape {opts}\nFunction: write gibberish in the style of \u003cstdin> to \u003cstdout>\nOptions:\n\t-b[=]\u003cnum>[k]\tmaximum amount of source text to read (default 8k)\n\t-l[=]\u003cnum>\t\tlength of pattern required to match (default 4)"},"cat":"Text tools","sub":"Transform & filter"},{"name":"apfel","desc":"the Mandelbrot set (Apfelmaennchen) drawn on the Atari Graph display; it calls the `graph' trap library","dir":"CMDS/GAMES","size":866,"help":{"note":"it takes no options; it calls the Graph trap library, so load graph first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"aprocs","desc":"a process monitor: prints the active processes as a tree -- id, parent, priority, CPU time, age and share of the CPU -- and -m measures their activity over a few seconds. `procs', `top' and `sysmon' are the other process listers","dir":"CMDS","size":11588,"star":true,"help":{"cmd":"aprocs -?","text":"Syntax: aprocs [\u003copts>]\nFunction: Another process utility; show processes in various formats\nOptions:\n -a         Show only processes with CPU-Time more than 0.1 percent\n -c[=]\u003cdif> Number of columns in process tree from parent to child (def: 2)\n -h[elp]    Show informations about aprocs' output\n -m[=\u003csec>] Measure process activity between two points in time (def: 3 secs)\n -n         Don't show processes in tree format (parent -> child)\n -q         Fill table entries with zeroes (allows output sorting with 'qsort')\n -v         Show some more process informations\n -vv        Be very verbose (includes -v)\n -V         Show informations about aprocs\naprocs: V1.10, (c)1996 by EKF Elektronik GmbH, 59065 Hamm, Germany"},"cat":"System & modules","sub":"Processes & memory"},{"name":"ar","desc":"Ar 1.2, an archive manager: gathers files into one .ar archive and compresses them as it goes -- -u adds, -t lists, -x extracts, -p prints a member","dir":"CMDS","size":22772,"docs":true,"help":{"cmd":"ar -?","text":"Ar V1.2 - archive file manager\nUsage:  Ar -\u003ccmd>[\u003cmodifier>] [file .. ]\n      \u003ccmd> is one of the following:\n         t  show table of contents for archive\n         u  update/add file(s) to the archive\n         p  print file(s) from the archive\n         x  extract file(s) from the archive\n      \u003cmodifier> is one of the following:\n         a  all versions (for extract)\n         s  supress file compression\n         z  read names for \u003ccmd> from std in\n\n      File names can include the meta chars * and ?, or path lists."},"cat":"Archives & compression","sub":"Create & extract"},{"name":"ar2","desc":"Ar 2.00, a later edition of `ar' with delete and move as well, and each file's attributes recorded","dir":"CMDS","size":15478,"star":true,"docs":true,"help":{"cmd":"ar2 -?","text":"Ar V2.00 - archive file manager\nUsage:  Ar -\u003ccmd>[\u003cmodifier>] archive [file .. ]\n      \u003ccmd> is one of the following:\n         d   delete file(s) from the archive\n         m   move file(s) to archive (add and delete)\n         p   print file(s) from the archive\n         t   show table of contents for archive\n         u   update/add file(s) to the archive\n         x   extract file(s) from the archive\n      \u003cmodifier> is one of the following:\n         a   all versions (for extract)\n         bnn set max bits to 'nn' (12 default)\n         d   incrment debug level\n         o   default to 'old' archives\n         s   once, suppress binary; twice, suppress all file compression\n         z   read names for \u003ccmd> from std in\n\n      File names can include the meta chars * and ?, or path lists."},"cat":"Archives & compression","sub":"Create & extract"},{"name":"arc","desc":"ARC 5.21, the archiver that came before zip: a adds, x extracts, v lists with the compression column, t tests, p prints a member","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":58666,"docs":true,"help":{"cmd":"arc -?","text":"ARC - archive utility, Version 5.21, created on 04/22/87 at 15:05:21\nUsage: arc {amufdxerplvtc}[biswnoq][g\u003cpassword>] \u003carchive> [\u003cfilename> . . .]\nWhere:   a   = add files to archive\n         m   = move files to archive\n         u   = update files in archive\n         f   = freshen files in archive\n         d   = delete files from archive\n         x,e = extract files from archive\n         r   = run files from archive\n         p   = copy files from archive to standard output\n         l   = list files in archive\n         v   = verbose listing of files in archive\n         t   = test archive integrity\n         c   = convert entry to new packing method\n         b   = retain backup copy of archive\n         s   = suppress compression (store only)\n         w   = suppress warning messages\n         n   = suppress notes and comments\n         o   = overwrite existing files when extracting\n         q   = squash instead of crunching\n         g   = Encrypt/decrypt archive entry\n\nadapted to OS-9/68k by Stephan Paschedag"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"areacode","desc":"looks up North American telephone area codes, as many as you give it, from a table of the late 1980s; a code it does not know is said to be no area code","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)   [also built from misc]","dir":"CMDS","size":7580,"star":true,"hassrc":true,"help":{"note":"it takes area codes and nothing else; one it does not know it calls no area code"},"cat":"Amusements","sub":"Curiosities"},{"name":"arepdaemon","desc":"the daemon autoreply relies on.  It reads /dd/USR/LIB/ELM/autoreply.data; without it, `Error 216 attempting fstat' -- though it still touches autoreply.log on its way there","needs":[{"path":"/dd/USR/LIB/ELM/autoreply.data","missing":true,"dir":false,"bytes":null},{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/USR/CMDS","missing":true,"dir":false,"bytes":null},{"path":"/dd/USR/LIB/ELM/autoreply.log","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP/autoreply.log","missing":true,"dir":false,"bytes":null},{"path":"/dd/spool/uucp","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/ELM","size":20468,"star":true,"help":{"note":"it takes no options: it reads USR/LIB/ELM/autoreply.data and runs as a daemon"},"cat":"Communications","sub":"Mail"},{"name":"argproc_demo","desc":"a demonstration of argproc(), a command-line argument parser: it parses the line and prints what it made of it -- `argproc_demo readme' answers `arg=readme, b=0, c=0, sGiven=0, s=this is a test, x=32, pi=3.144500'. A switch takes its argument with no space (`-x99', not `-x 99'), which the program says itself under -help. The argproc library manual is in DOC/argproc_demo/man.argproc","src":"argproc","origin":"EFFO forum","archive":"disk 7 RICO/C/LIBSOURCE/ARGPROC","needs":[{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":25628,"docs":true,"hassrc":true,"howto":"A switch takes its argument with NO SPACE: `-x99', never `-x 99'. `argproc_demo readme' prints what it made of the line.","help":{"cmd":"argproc_demo -help","text":"argproc_demo: Usage:  file ...\nDemonstration program for argproc().  Note that no spaces are allowed\nbetween a switch and its arguments (i.e. -x3 is okay, -x 3 is not allowed).\nOptions:\n    -help    Print this message\n    -b       Set b_bool TRUE\n    -c       Set c_bool TRUE\n    -sSTRING Set string s  [default: ]\n    -xINT    Set integer x [default: 0]\n    -piFLOAT Set double pi [default: 0.000000]"},"cat":"System & modules","sub":"Utilities"},{"name":"as0","desc":"6800/6802 cross-assembler, one of the six xasm tools: `as0 file - l s' assembles with a listing (l) and a symbol table (s), the options after a lone `-'. A sample source for each of the six ships in DOC/xasm. None of the six assembles 68000 code","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27238,"hassrc":true,"howto":"Assemble the sample that ships with it: `as0 /dd/DOC/xasm/sample.a0 - l s' -- the options come after a lone `-', `l' for the listing and `s' for the symbol table. There is a sample for each of the six (sample.a0, .a1, .a4, .a5, .a09, .a11) and each is written for its own processor: as09 rejects the 6800 one, correctly. as11 is the one that takes its options without the `-'. None of these is a 68000 assembler.","help":{"note":"it takes the source file and, after a lone `-', the letters l for a listing and s for the symbol table; there is no help flag"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as09","desc":"6809 assembler -- the one that targets the 6809 itself. It rejects 6800 source (`ldaa' is a 6800 mnemonic, not a 6809 one); DOC/xasm/sample.a09 is written for it","dir":"CMDS","size":17914,"star":true,"help":{"note":"it takes the source file and nothing else"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as1","desc":"6801/6803 cross-assembler (xasm); see as0. Sample in DOC/xasm/sample.a1","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27412,"hassrc":true,"help":{"note":"it takes the source file and, after a lone `-', the letters l for a listing and s for the symbol table; there is no help flag"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as11","desc":"68HC11 cross-assembler (xasm). It lists by default and takes no `- l s'; a word after the file name is another source file. Sample in DOC/xasm/sample.a11","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":24868,"hassrc":true,"help":{"note":"it takes source files and nothing else, and lists by default"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as4","desc":"6804 cross-assembler (xasm); see as0. Sample in DOC/xasm/sample.a4","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":26662,"hassrc":true,"help":{"note":"it takes the source file and, after a lone `-', the letters l for a listing and s for the symbol table; there is no help flag"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"as5","desc":"6805/68HC05 cross-assembler (xasm); see as0. Sample in DOC/xasm/sample.a5","src":"xasm","origin":"microware","archive":"MISC/xasm.ar","dir":"CMDS","size":27350,"hassrc":true,"help":{"note":"it takes the source file and, after a lone `-', the letters l for a listing and s for the symbol table; there is no help flag"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"ascii","desc":"prints the ASCII character table: every code from 0 to 127 with its control name, decimal, hex and octal","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":2608,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it prints the table"},"cat":"Text tools","sub":"Count & inspect"},{"name":"Ascii2Libr","desc":"Home Librarian: build a catalogue from plain text -- `Ascii2Libr -outfile cat.libr', with the text on standard input, in the form Libr2Ascii writes","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":130522,"hassrc":true,"howto":"`-outfile cat.libr' with a space, and it reads the ASCII on standard input. The text is the form Libr2Ascii writes: a page count, then a card count and the cards, then the title, author and subject index sections.","help":{"cmd":"Ascii2Libr -?","text":"Syntax: Ascii2Libr [opts]\nProgram to read the ASCII text file generated by Libr2Ascii\ninto a Librarian Card Catalog file\nOptions:\n-outfile\tString Required Output file to create\n-minpages\tInteger Optional Minimum number of pages to create file with.\n\n\tVersion: V1.0Beta\n\tCopyright (c) 1991,1992 Robert Heller D/B/A Deepwoods Software"},"cat":"Files & directories","sub":"Home Librarian"},{"name":"asciitopgm","desc":"reads a text picture -- ASCII art -- as a greymap, each character's darkness a grey level","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":50168,"hassrc":true,"help":{"cmd":"asciitopgm -?","text":"usage:  asciitopgm [-d \u003cval>] height width [asciifile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"ask","desc":"the CLIENT for `wisecrack': it reads one line from /PIPE/txtpipe and prints it, and says `No Wisecracks coming' when nothing is feeding the pipe.  Start the server first -- `wisecrack &' -- and it answers.","src":"forum20","origin":"Microware OS-9 archive","archive":"forum20.lzh","dir":"CMDS","size":11776,"hassrc":true,"howto":"Asks a yes/no question and sets the shell status, for scripts. On its own it says \"No Wisecracks coming\" -- it is the front half of the `wisecrack' pipe from EFFO forum 20.","help":{"note":"it takes no options"},"cat":"Games","sub":"Other games"},{"name":"assembler","desc":"GSHELL front-end for the assembler -- the same full-screen menu as `gshell', headed `Assembler-SHELL V1.0'.  It does not assemble anything itself; `as0' and its five siblings are the assemblers","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":22100,"hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; none of q, Q, control-D or ESC do.","help":{"cmd":"assembler -?","text":"Syntax: assembler [\u003cpath>]\nFunction: a menue driven assembler shell\nOptions: none"},"cat":"Compilers & build","sub":"Assemblers & linkers"},{"name":"aterm","desc":"ATerm 2.6, a terminal emulator for a serial line: `aterm /t1'. Its configuration is in SYS/ATERM; run it from a login session rather than as the machine's first process. Manual in DOC/aterm, source in SRC/aterm","needs":[{"path":"/DD/SYS/ATERM/ATerm.Ctl","missing":false,"dir":false,"bytes":1420},{"path":"/DD/SYS/ATERM/ATerm.Phone","missing":false,"dir":false,"bytes":290},{"path":"/DD/SYS/ATERM/ATerm.Print","missing":false,"dir":false,"bytes":3}],"dir":"CMDS","size":13422,"docs":true,"hassrc":true,"help":{"cmd":"aterm -?","text":"                    ATerm : A terminal program for OS9/68000\n                    ===== = = ======== ======= === =========\n\n                       Syntax  : ATerm /serial_path\n                       Function: Terminal program for OSK\n                       Example : ATerm /t1\n?"},"cat":"Communications","sub":"Terminal & session"},{"name":"atktopbm","desc":"Andrew Toolkit raster to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":47622,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"atob","desc":"decodes what btoa encoded, back to the bytes","src":"btoa","origin":"Microware OS-9 archive","archive":"btoa.lzh","dir":"CMDS","size":19338,"hassrc":true,"help":{"cmd":"atob -?","text":"Bad args to atob\n\nAtoB V4.0 - Decode 'btoa' ascii files back to binary.\n    Usage: atob \u003cfilein >fileout"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"atp","desc":"AX.25 transport, from the KA9Q package","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/NETWORK","size":62430,"star":true,"help":{"note":"it takes no options: it reads atprc or .atprc from the data directory"},"cat":"Communications","sub":"TCP/IP"},{"name":"authwn","desc":"authentication helper for protected areas","src":"wn1","origin":"Microware OS-9 archive","archive":"wn1.zip","needs":[{"path":"/h0/c/unid/wn_1.14.3/osk","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/WN","size":8694,"hassrc":true,"help":{"note":"wn invokes it per request; it takes no options"},"cat":"Communications","sub":"Web server"},{"name":"autolf","desc":"converts line endings between CR, LF and CR LF, expands tabs and handles ^Z, as a filter: `autolf -c -C -L \u003c in > out' makes DOS text of OS-9 text, and `-H' explains the conversions. Given a file name it converts through a temporary it then cannot rename back, so feed it standard input","dir":"CMDS","size":11354,"star":true,"docs":true,"help":{"cmd":"autolf -?","text":"autolf: copy stdin to stdout, converting end-of-line character sequences\nbetween the formats CR, LF and CRLF.  Also expands tabs if required.\nIf filenames are provided, then these are used instead of stdin.\nVersion 2.4, date 1995/03/01\nby Mike Tozer: autolf@vkthree.demon.co.uk   See -x for licence.\nUsage:   autolf [\u003copts>] {\u003cfile names> [\u003copts>]}\n   -?         print this information\n   -H         show detailed information on conversions\n   -c         use CR on input as eol sequence\n   -l         use LF on input as eol sequence\n   -C         use CR on output as eol sequence\n   -L         use LF on output as eol sequence\n   -N         set -C & -L for this platform (i.e. cr)\n   -z         ignore all ^Z characters from input\n   -Z         add a ^Z character at the end of the file\n   -k         keep intermediate temporary file(s)\n   -x         show licence details\n   -t[=][\u003cn>] expand tab characters (tab-size \u003cn> default is 4)\nIf no -c, -l, -C, -L or -N specified, -t is set automatically\nIf both -C & -L (or -c & -l) given, CR/LF is implied\nIf neither -c or -l given, auto-detection of input format {i.e. first\n                                EOL sequence detected is used}.\nIf none of -C, -L, -N given, output is based on input format: see -H"},"cat":"Text tools","sub":"Transform & filter"},{"name":"autoreply","desc":"send an automatic reply while you are away.  It resolves your mailbox by the session's numeric owner rather than $USER, so under this identity it reaches for a mailbox named `su' and stops there; turning autoreplying off does not need the mailbox and answers for real","needs":[{"path":"/dd/TMP/arep","missing":true,"dir":false,"bytes":null},{"path":"/dd/USR/LIB/ELM/autoreply.data","missing":true,"dir":false,"bytes":null},{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/ELM","size":11662,"star":true,"help":{"note":"`autoreply on' and `autoreply off' are its whole vocabulary, plus a file of reply text; there is no help flag"},"cat":"Communications","sub":"Mail"},{"name":"back","desc":"backgammon on a full board, points numbered 1 to 24, with the dice cup and the doubling status beside it. Single letters are the commands: R rolls, D doubles, H is the help, N starts a new game, Q quits","dir":"CMDS/GAMES","size":21010,"star":true,"howto":"Single letters are the commands: R rolls, D doubles, H is the help, N starts a new game, Q quits.","help":{"note":"it takes no options; H at its prompt is the help"},"cat":"Games","sub":"Board & card"},{"name":"backgammon","desc":"backgammon, with a computer opponent","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":38612,"star":true,"help":{"cmd":"backgammon -?","text":"Syntax: backgammon [\u003copts>] [\u003cfile>]\nFunction: what do you think ?\nOptions:\n     -n        don't ask for instructions\n     -r        you play red\n     -w        you play white\n     -b        you play both sides\n     -p[rwb]   print board before red/white/both\n     -s \u003cfile> recover earlier game from \u003cfile>\nIf no -s is present, but \u003cfile> is specified, then\nrecover from \u003cfile>"},"cat":"Games","sub":"Other games"},{"name":"banner","desc":"prints its argument as tall letters made of `@', for a banner or a sign","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":7630,"star":true,"hassrc":true,"help":{"note":"it takes the text to print and nothing else"},"cat":"Text tools","sub":"Banners & text art"},{"name":"basename","desc":"prints the last part of a path -- the file name with every directory dropped -- and drops a suffix too if one is given as a second argument","dir":"CMDS","size":2206,"star":true,"help":{"cmd":"basename -?","text":"basename v1.0 (c) M.C.Gregorie, 1994\n\nSyntax:   basename \u003cpath> [\u003csuffix>]\nFunction: Outputs string after deleting any\n          prefix ending in / and the suffix\n          if it is present\nOptions:  none"},"cat":"Files & directories","sub":"Paths"},{"name":"bash","desc":"GNU Bourne-Again Shell 1.12 -- this disk's shell; it reads .bashrc. It cannot serve as $SHELL for a program that shells out, because it reads system()'s command line as a script file name; `ksh' can, and SYS/login sets SHELL to it. DOC/README-SHELLS compares all five","needs":[{"path":"/dd/local/sys/profile","missing":false,"dir":false,"bytes":619},{"path":"/dd/sys/profile","missing":false,"dir":false,"bytes":619},{"path":"/dd/tmp/","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226},{"path":"/h0/sys/password","missing":false,"dir":false,"bytes":226},{"path": t styles are in SYS/TEX/INPUTS (plain, unsrt, abbrv, alpha), not SYS/TEX/BIB, which holds one read.me. A BACKSLASH CANNOT BE TYPED at this shell -- bash's echo eats `\\c' -- so patch one in with `pbyte \u003cfile> \u003chex offset> 5c'.","help":{"note":"it reads the job name from standard input and takes no options"},"cat":"Text tools","sub":"TeX"},{"name":"bigsetter","desc":"Modula-2 set-operations demonstration","dir":"CMDS","size":23512,"help":{"note":"it takes no options: run it and it prints its test"},"cat":"System & modules","sub":"Utilities"},{"name":"bincheckr","desc":"check a GNU Chess opening-book file -- it reports booksize 0 for the 145 KB book that ships here, then aborts","dir":"CMDS/GAMES","size":24366,"docs":true,"howto":"It is in CMDS/GAMES, not CMDS. `bincheckr /dd/GAMES/gnuchess.book' prints the book's entrysize and counts and then faults at close.","help":{"note":"it takes the book file and nothing else"},"cat":"Games","sub":"Chess utilities"},{"name":"binhex","desc":"encodes a MacBinary file as BinHex 4.0, the text form Macintosh software was posted in","dir":"CMDS","size":31262,"docs":true,"help":{"cmd":"binhex -H","text":"File input options:\n-r:\tread as resource files\n-d:\tread as data files\n-u:\tread as data files with Unix -> Mac text file translation\n-U:\ta synonym for -u\n-c cr:\tcreator if one of the above options is used\n-t ty:\tfiletype if one of the above options is used\nBinhex specific options:\n-r:\tdo not use run length encoding\n-i:\tgive information only, do not write\n-l:\tgive listing\n-q:\tquery for every file/folder before writing\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent writing"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"bio","desc":"a biorhythm chart in BASIC09 -- `runb bio' asks a Date and a Birthday as DD.MM.YYYY (RETURN at the Date prompt takes your system date), then `g' for a graph (or `v' for values) and a number of days, and plots the physical, emotional and mental cycles","dir":"CMDS","size":4594,"basic09":true,"hassrc":true,"howto":"A biorhythm chart in BASIC09 -- `runb bio' draws it. It asks a Date, then a Birthday, both as day.month.year with a four-digit year (RETURN at the Date prompt takes your system date), then `g' for a graph (or `v' for values) and a number of days, and plots the physical, emotional and mental cycles.","help":{"note":"a BASIC09 program run by runb; it asks its questions itself"},"cat":"Amusements","sub":"Biorhythms"},{"name":"bioradtopgm","desc":"Bio-Rad confocal microscope image to PGM; -image picks one of a stack","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45386,"hassrc":true,"help":{"cmd":"bioradtopgm -?","text":"usage:  bioradtopgm [-image#] [Bioradfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"biory","desc":"biorhythm chart, in German: asks a name (Name Vorname), a birth date as TTMMJJ and a span of years as JJ-JJ, and writes the chart -- Koerper, Seele, Geist, month by month -- to Biory.Lis in the current directory.  Needs `load /dd/CMDS/os9lib' first; RETURN at the name prompt ends it. Source: SRC/rtf/biory.f","src":"rtf","origin":"EFFO forum","archive":"disk 5 SPRACHEN/FORTRAN/BIORY -- RTF/68K example","dir":"CMDS","size":6066,"hassrc":true,"help":{"note":"it asks its questions itself, in German; load os9lib first. There is no help flag"},"cat":"Amusements","sub":"Biorhythms"},{"name":"bison","desc":"GNU bison 1.19, the parser generator: reads a grammar and writes the parser in C, with -v leaving a report of the states and conflicts. Its skeletons are in LIB","needs":[{"path":"/dd/tmp/b.","missing":true,"dir":false,"bytes":null},{"path":"/h0/lib/bison.simple","missing":false,"dir":false,"bytes":15460},{"path":"/h0/lib/bison.hairy","missing":false,"dir":false,"bytes":6477}],"dir":"CMDS","size":60582,"docs":true,"help":{"cmd":"bison -?","text":"Bison 1.19 (OSK-Version 1.2) (c) 1993 Dipl-Kfm Norbert Kuehne\n\nUsage: bison [-dltvyV] [-b file-prefix] [-o outfile] [-p name-prefix]\n       [--debug] [--defines] [--fixed-output-files] [--no-lines]\n       [--verbose] [--version] [--yacc]\n       [--file-prefix=prefix] [--name-prefix=prefix]\n       [--output-file=outfile] grammar-file"},"cat":"Compilers & build","sub":"Make & generators"},{"name":"bite","desc":"a skull draws itself and bites -- a screen toy; q quits","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":31572,"hassrc":true,"howto":"Full-screen: it takes over the display. **`q' quits**.","help":{"note":"it takes no options; q quits"},"cat":"Screen toys","sub":"Screen toys"},{"name":"blackjack","desc":"Las Vegas blackjack in BASIC09 -- `runb blackjack' asks your name and whether you want the rules, then takes a wager and deals: RETURN draws, `s' stands, `d' doubles down, `x' splits a pair, a wager of 0 ends the game (blackjak, in GAMES, is the SNOBOL4 one)","dir":"CMDS","size":6524,"basic09":true,"howto":"BASIC09 I-code: `load /h1/CMDS/runb' then `runb blackjack' (bare module name -- a pathname gives BASIC09 error 43). It asks your name and whether you want the rules, then takes a wager and deals: RETURN draws a card, `s' stands, `d' doubles down, `x' splits a pair; a wager of 0 ends the game. runb links the `math' trap handler from the execution directory, so leave chx at CMDS -- tested, plays a full hand.","help":{"note":"a BASIC09 program run by runb; it asks its questions itself"},"cat":"Games","sub":"Board & card"},{"name":"blackjak","desc":"Las Vegas BlackJack (SNOBOL4-in-C).  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false,"dir":false,"bytes":1792}],"dir":"CMDS/GAMES","size":22146,"star":true,"hassrc":true,"help":{"note":"it takes no options and asks whether you want the rules; answer yes or no in full"},"cat":"Games","sub":"Board & card"},{"name":"blastem","desc":"XModem and YModem file transfer, written for the MM/1","dir":"CMDS/COMMS","size":28774,"help":{"cmd":"blastem -?","text":"Syntax: Blastem [\u003copts>] {\u003cfilename> [\u003copts>]}\nFunction: Xmodem/Ymodem file transfer utility\nOptions:\n        -y        use YModem (Batch) protocol (XModem default)\n        -r        receive file(s) (default)\n        -s        send file(s)\n        -f        remove filler at EOF\n        -k        do not use 1K blocks (128 byte)\n        -l        checknum (8-bit)\n        -m        CRC (16-bit) (default)\n        -h        CRC (32-bit)\n        -t        use standard paths for transfer\n        -q        quiet (suppress messages)\n        -p=\u003cpath> modem path ('/t0' default)\n        -b=\u003csize> buffer size (2K default)\n        -x        look in execution directory for file(s)\n        -z        get file names from standard input\n        -z=\u003cpath> get list of files from \u003cpath>"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"bm","desc":"a fast grep by the Boyer-Moore algorithm: searches files for one or more fixed strings, with counts, file lists and character offsets on request","dir":"CMDS","size":6834,"star":true,"docs":true,"help":{"cmd":"bm -?","text":"bm: search for a given string or strings in a file or files\nsynopsis: bm [option]* [string(s)] [file]*\noptions:\n-c print only a count of matching lines\n-e Take next argument as the pattern\n-f PFile read patterns from a file PFile\n-h Do not print file names\n-l print a list of files containing the pattern(s)\n-n print the character offset of the pattern(s)\n-s silent mode. Return only success (0) or failure (1)\n-x print only lines which match entirely"},"cat":"Text tools","sub":"Search & match"},{"name":"bmgtest","desc":"Boyer-Moore-Gosper substring search demo","src":"strsch","origin":"usenet archive","archive":"strsch.ar","dir":"CMDS","size":4710,"star":true,"hassrc":true,"howto":"bmgtest [-i] [-n] \u003cpattern> [file ...]. A demonstration of Boyer-Moore-Gosper searching.","help":{"cmd":"bmgtest -?","text":"usage: bmgtest [-i] [-n] pattern [file ...]"},"cat":"Text tools","sub":"Search & match"},{"name":"bmgtest2","desc":"Boyer-Moore-Gosper substring search demo (variant)","src":"strsch","origin":"usenet archive","archive":"strsch.ar","dir":"CMDS","size":5712,"star":true,"hassrc":true,"help":{"cmd":"bmgtest2 -?","text":"usage: bmgtest [-i] [-n] pattern [file ...]"},"cat":"Text tools","sub":"Search & match"},{"name":"bmptoppm","desc":"Windows or OS/2 BMP to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":48112,"hassrc":true,"help":{"cmd":"bmptoppm -?","text":"usage:  bmptoppm [bmpfile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"bog","desc":"Boggle: sixteen lettered dice and three minutes to type every word you can trace through adjoining letters; its word list, index and help are in GAMES/BOG","src":"bog","origin":"usenet archive","archive":"bog.ar","needs":[{"path":"/dd/GAMES/BOG/dict","missing":false,"dir":false,"bytes":80520},{"path":"/dd/GAMES/BOG/dict.ind","missing":false,"dir":false,"bytes":416},{"path":"/dd/GAMES/BOG/helpfile","missing":false,"dir":false,"bytes":3620},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":48526,"docs":true,"hassrc":true,"howto":"Boggle. Space starts the three-minute round, `?' shows the rules, and you type every word you can trace through adjoining letters. Control-C leaves it. Its word list, index and help are in GAMES/BOG.","help":{"cmd":"bog -?","text":"Usage: bog [-b] [-d] [-s#] [-t#] [-w#] [+[+]] [boardspec]\n-b: 'batch mode' (boardspec must be present)\n-d: debug\n-s#: use # as the random number seed\n-t#: time limit is # seconds\n-w#: minimum word length is # letters\n+: can reuse a cube, but not twice in succession\n++: can reuse cubes arbitrarily\nboardspec: the first board to use (use 'q' for 'qu')"},"cat":"Games","sub":"Word & guessing"},{"name":"bootgen","desc":"generate an OS-9 boot file","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":8576,"star":true,"hassrc":true,"help":{"cmd":"bootgen -?","text":"Syntax:   bootgen [\u003copts>] \u003cdevice> {\u003cpath> [\u003copts>] }\nFunction: maintain boot file on disk\nOptions:  [\u003cn> is 'dd' or '$hh']\n    -a         append files to end of existing boot\n    -b[=]\u003csize>[K]  copy buffer size\n    -h         hook 'os9boot' into ID sector\n    -n[=]\u003cn>   make new boot file \u003cn> sectors long\n    -r         remove ID sector hook\n    -v         don't read-verify boot file\n    -x         pathlists starts from execution dir\n    -z[=\u003cpath>]  get list of module names from \u003cpath> (stdin)"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"bootlogger","desc":"log what happens during boot","needs":[{"path":"/dd/sys/bootlog","missing":false,"dir":false,"bytes":0},{"path":"/dd/cmds/del","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":3610,"star":true,"help":{"note":"it takes no options and prints nothing"},"cat":"System & modules","sub":"Utilities"},{"name":"booz","desc":"extracts or lists a zoo archive: `booz l' lists, `booz x' extracts, `booz t' tests","dir":"CMDS","size":11026,"star":true,"docs":true,"howto":"Lists and extracts zoo archives: `booz l file.zoo' lists with a bare letter, `booz x' extracts. fiz repairs a zoo archive that will not open.","help":{"cmd":"booz -?","text":"Public domain zoo archive extractor/lister by Rahul Dhesi\nVersion 2.0 (1991/07/07)\nUsage:  booz {lxt} archive[.zoo] [ file ... ]\nl = list, x = extract, t = test"},"cat":"Archives & compression","sub":"zoo"},{"name":"break","desc":"send a BREAK on a serial line -- an assembler example, and it calls F$SysDbg, the system-debugger trap, on its way there.  On a machine with a debugger attached that drops you into it and waits for an answer, which in a script is a hang","src":"forum5","origin":"Microware OS-9 archive","archive":"forum5.lzh","dir":"CMDS","size":290,"hassrc":true,"help":{"note":"it takes no options; asked for help it returns at once, and run bare it calls the debugger trap"},"cat":"System & modules","sub":"Utilities"},{"name":"brushtopbm","desc":"Xerox doodle brush to PBM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":41862,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"bsplt68","desc":"Split a boot file into its component modules","dir":"CMDS","size":4276,"help":{"note":"it takes the boot file and nothing else"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"btoa","desc":"encodes a binary file as printable text, five characters for every four bytes with a checksum on the last line -- denser than uuencode; atob decodes it","src":"btoa","origin":"Microware OS-9 archive","archive":"btoa.lzh","dir":"CMDS","size":14638,"docs":true,"hassrc":true,"help":{"cmd":"btoa -?","text":"Bad args to btoa\n\nBtoA V4.0 - Encode binary files to ascii.\n    Usage : btoa \u003cfilein >fileout"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"btop","desc":"convert characters to bit patterns -- its own Function: line, and what it does: `btop \u003cfile>' prints each character as a grid of O and space.","dir":"CMDS","size":15816,"help":{"cmd":"btop -?","text":"Syntax:   BtoP [\u003copts>] [\u003cpath1>] [\u003copts>] [\u003cpath2>] [\u003copts>]\nFunction: convert characters to bit patterns\nOptions:  -o  use stdin for input, path1 for output"},"cat":"System & modules","sub":"Utilities"},{"name":"btree","desc":"B-tree file handling demonstration and test","dir":"CMDS","size":21594,"star":true,"docs":true,"help":{"note":"it takes no options: run it and it builds its index"},"cat":"Editors","sub":"SEDT family"},{"name":"buildhash","desc":"build ispell's dictionary hash.  It reads a word list called `dict.191' (the name is compiled in). /dd/LIB/ispell.hash is the built hash, 490,186 bytes, and it ships, so ispell itself reads that and works.  `chardef' reads the same word list.","src":"ispell","origin":"hc disk","archive":"SOURCES/USENET/ISPELL/","needs":[{"path":"/dd/LIB","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":21564,"hassrc":true,"help":{"note":"it takes no options: run bare it reads the word list dict.191 and the affix file and builds the hash, or names the file it cannot find"},"cat":"Text tools","sub":"Spelling & words"},{"name":"byteflip","desc":"byte-swap a dbz database between architectures -- hand it a dbz database","dir":"CMDS/NEWS","size":1882,"star":true,"howto":"It is in CMDS/NEWS. Hand it a dbz database to byte-swap between architectures.","help":{"note":"it takes the database to swap and no options; with nothing named it waits on standard input"},"cat":"Communications","sub":"News"},{"name":"c7decode","desc":"decode 7-bit-safe encoded news","dir":"CMDS/NEWS","size":2304,"star":true,"help":{"note":"a filter with no options: encoded news on standard input, the article out"},"cat":"Communications","sub":"News"},{"name":"cal","desc":"Calendar. `cal -h' prints holidays with it -- SYS/holidays is here, and SYS/birthdays is an empty template for your own dates. SYS/cal.init is a printer setup for a laser","needs":[{"path":"/dd/sys/cal.holidays","missing":false,"dir":false,"bytes":717},{"path":"/dd/sys/cal.init","missing":false,"dir":false,"bytes":449},{"path":"/dd/sys/holidays","missing":false,"dir":false,"bytes":717}],"dir":"CMDS","size":13184,"star":true,"howto":"`cal -m=\u003cmonth> -y=\u003cyear>', with flags. -h marks the holidays in SYS/holidays and anything you add to SYS/birthdays, which it includes.","help":{"cmd":"cal -?","text":"Cal, (c) 1995, Bob van der Poel Software\nUsage: calendar [\u003copts>]\nFunction: Prints a calendar to standard output\nOptions:\n    -b          print in big format\n    -c[=]value  prints \u003cvalue> months\n    -g          don't use graphics characters\n    -h[=][path] print holidays, use path for data (def=/dd/sys/holidays)\n    -m[=]range  sets start/end month to print\n    -oe[=]str   overstrike end codes\n    -os[=]str   overstrike start codes\n    -p[=]path   set output to 'path'\n    -se[=]str   session end codes\n    -ss[=]str   session start codes\n    -u[-][path] use initialization file (def=/dd/sys/cal.init)\n    -w[=]value  set page width for big format (default=80)\n    -y[=]range  sets start/end year to print\n         \u003crange> can be specified as (dd=digits, eg. 12):\n           dd     print only specified month/year\n           -dd    print from current month/year to dd\n           dd-dd  print this range of month/year\n\nBy default, the three current months are displayed\nand the current month and year are used."},"cat":"Time & calendar","sub":"Calendars"},{"name":"calen","desc":"prints a month as a diary page, ruled for appointments, with the neighbouring months as small calendars in the corners. It reads the month, the year and how many months from its input: `echo 9 2026 1 | calen'","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)   [also built from v_misc]","dir":"CMDS","size":21486,"hassrc":true,"help":{"cmd":"calen -?","text":"Invalid flag: -?\nValid flags are -b -l -m -o -r -u\n\t-bN\t\tadd N blank lines after form-feed\n\t-m\t\tmixed-case output (default)\n\t-l\t\tleft-justify dates (default)\n\t-r\t\tright-justify dates\n\t-u\t\tupper-case output\n\t-o[seq]\tuse 'seq' as overstrike sequence\nEnter calendar specs (month year length): Month 0 not in range 1 .. 12\nYear 0 not in range 1753 .. 9999"},"cat":"Time & calendar","sub":"Calendars"},{"name":"calender","desc":"print a whole year's calendar (German)","src":"calender","origin":"EFFO forum","archive":"disk, from c't 3/88 p.148 and 9/88 p.80","dir":"CMDS","size":5748,"star":true,"hassrc":true,"howto":"A whole year at once, in German. It asks `Fuer welches Jahr?' (which year); RETURN at the question ends it.","help":{"note":"it asks `Fuer welches Jahr?' itself; there is no help flag"},"cat":"Time & calendar","sub":"Calendars"},{"name":"cam","desc":"CAMSHAFT, not camera: it asks for the rocker ratio, the lift at a crank angle and the base circle, and plots the lift curve for an intake lobe.  The plot is Tektronix vectors, so on a vt100 it arrives as characters -- the dialogue above it is the readable part.","src":"tekdemos","origin":"Microware OS-9 archive","archive":"TekDemos.t.Z","dir":"CMDS/GAMES","size":5434,"star":true,"hassrc":true,"help":{"note":"it asks for its numbers itself; there is no help flag"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"card","desc":"Towers of Hanoi whose twelve disks are the lines of a Christmas message; VT100, wants TERMCAP","src":"card","origin":"usenet archive","archive":"comp.sources -- Istvan Mohos 1984","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":20952,"hassrc":true,"help":{"note":"it takes no options"},"cat":"Screen toys","sub":"Screen toys"},{"name":"casefix","desc":"sentence-cases text: every letter to lower case except the first of each sentence. A filter that reads standard input; a file named as an argument is ignored","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":6204,"hassrc":true,"howto":"It is a FILTER and reads STANDARD INPUT: `casefix \u003c file' sentence-cases it.","help":{"note":"a filter with no options: text on standard input, sentence-cased text out"},"cat":"Text tools","sub":"Transform & filter"},{"name":"cat","desc":"concatenates files to standard output: -n numbers the lines, -v shows control characters, -s squeezes runs of blank lines","dir":"CMDS","size":5322,"star":true,"help":{"cmd":"cat -?","text":"Syntax: cat [\u003copts>] {[-] \u003cpath> [\u003copts>]}\nFunction: concatenate files to standard output\nOptions:\n    -u        output is unbuffered\n    -n        preceds each line with a linenumber\n    -b        number each but blank lines like -n\n    -v        non-printable chars as ^X (control) or M-X (msb set)\n    -s        squeeze adjacent blank lines to one blank line\n    -e        like -v but display a $ at the end of line\n    -t        like -v but display tab as ^I\n    -x        directory to search is execution directory\n    -z        get list of file names from standard input\n    -z=\u003cfile> get list of file names from \u003cfile>"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"cb","desc":"the C beautifier: indents C source into a readable layout, standard input to standard output","dir":"CMDS","size":4408,"star":true,"help":{"cmd":"cb -?","text":"Usage:  cb \u003cinput.fil >output.fil"},"cat":"Developer tools","sub":"Source formatting"},{"name":"cc1plus","desc":"a GCC C++ compiler pass (1.40.3) in the GCC2 directory; the driver runs it","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/GCC2","size":818786,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"cc2","desc":"the GCC 2.x C compiler pass, in the GCC2 directory; the driver runs it, and -version reports it","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/GCC2","size":990198,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"cc2plus","desc":"a second GCC C++ compiler pass (2.5.8) in the GCC2 directory","dir":"CMDS/GCC2","size":1372920,"help":{"note":"the driver runs it; -version prints its version, and it has no help flag"},"cat":"Compilers & build","sub":"C toolchain"},{"name":"cccp2","desc":"the GCC 2.x preprocessor, in the GCC2 directory beside its driver","needs":[{"path":"/DD/DEFS","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GCC2","missing":false,"dir":true,"bytes":null},{"path":"/DD/DEFS/GPP2","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/GCC2","size":84024,"star":true,"help":{"cmd":"cccp2 -?","text":"GNU C Compatible Compiler Preprocessor (Version 2.5.6)\nUsage: cccp2 [switches] input output\nSwitches:\n  -Idirectory           add the directory to be searched for header file.\n  -ifile                process file to make the macros defined in the file\n                        available for use in the main input.\n  -n(ostdinc)           use no default include directories.\n  -Dname[=definition]   predefine name as a macro with definition.(default 1).\n  -Uname                do not predefine name.(superior to -D option.)\n  -u(ndef)              do not predefine any non standard macros.\n  -traditional          try to imitate old fashioned non-ANSI preprocessor.\n  -trigraphs            process ANSI standard trigraph sequences.\n  -$                    do not admit `$' in identifier.\n  -+                    handle C++ comment and use extra default include\n                        directories for C++.\n  -P                    inhibit generation of #-line information.\n  -C                    output comments too.\n  -p(edantic)           issue warnings required by the ANSI C standard.\n  -w                    do not print warnings.\n  -Wtrigraphs           warn if there are any trigraphs.\n  -Wcomment(s)          warn if `/*' appears in a comment.\n  -Wall                 same as -Wtrigraphs and -Wcomment.\n  -o file               output result into file.\n  -d                    output #define's instead of preprocessing result.\n  -M                    output dependencies of files instead of preprocessing\n                        result.\n  -MM                   as -M but output only user include files.\n  -v                    print version number.\n  -K                    try to imitate microware's preprocessor.\nfollowing options are valid only under -K option\n  -e number             specify OSK psect edition.\n  -G                    output debug info too.\n  -L                    output comments too."},"cat":"Compilers & build","sub":"C toolchain"},{"name":"ccheck","desc":"C program checker -- matching brackets, quotes, comment brackets, and indentation that disagrees with them","dir":"CMDS","size":8606,"star":true,"docs":true,"hassrc":true,"howto":"Checks C source for mismatched brackets, quotes and comment markers, and for indentation that disagrees with the nesting. Needs cio.","help":{"cmd":"ccheck -?","text":"Syntax  : ccheck [\u003copts>] \u003cfile>...\nFunction: To find and report all badly matched openers\n          and closers plus assignment/equality\n          confusions in a C source file.\nOptions :\n     -q           quiet mode (suppress warnings)\n     -s           synomym of quiet mode\n     -v           verbose mode"},"cat":"Developer tools","sub":"Source checking"},{"name":"cdiff","desc":"a context diff: compares two text files and prints what changed, each difference headed by a line such as `>>>> INSERT BEFORE 2'","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":17838,"hassrc":true,"help":{"cmd":"cdiff -?","text":"TRY: diff oldfile newfile\n?"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"charcnt","desc":"counts how often each character occurs in the files named, control characters included, and totals the bytes read","dir":"CMDS","size":2324,"star":true,"help":{"note":"it takes no options: name the files to count, and with none it asks for some"},"cat":"Text tools","sub":"Count & inspect"},{"name":"chardef","desc":"loads a character set into a VT220 terminal from a definition file: `chardef \u003cfile>'; it calls itself defchar","src":"eff_chardef","origin":"EFFO forum","archive":"disk 7   C/CHARDEF","dir":"CMDS","size":18398,"docs":true,"hassrc":true,"help":{"cmd":"chardef -?","text":"Syntax: defchar [\u003cpath>]\nFunction:defines a new Charset for VT220 Terminals\nOptions: none"},"cat":"System & modules","sub":"Utilities"},{"name":"chbase","desc":"converts a number from one base to another: `chbase 255 10 16' prints FF, and a target base of 0 prints every base from 2 to 36","dir":"CMDS","size":4136,"star":true,"help":{"cmd":"chbase -?","text":"chbase   : OS9 Utility, created by Philip Maechler\nFunction : This program changes a number from base A to base B.\nSyntax   : chbase \u003cnumber> [ \u003cbase A> [ \u003cbase B> ] ]\n           base A : base of entry  (default=10)\n           base B : base of output (default=16)\n           (B='0' prints all bases from 2 to 36)"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"checkalias","desc":"check an alias resolves before you rely on it. `listalias' answers the same question and prints its result","dir":"CMDS/ELM","size":2132,"star":true,"help":{"cmd":"checkalias -?","text":"Usage: checkalias alias [alias ...]"},"cat":"Communications","sub":"Mail"},{"name":"checkenv","desc":"compares an environment variable with a value for a script to branch on: `checkenv \u003cname> , \u003cvalue>', spaces round the comma.  It returns 0 whether the value matches or not, so `getenv -p \u003cname>', which prints the value, is the one to use for a reliable branch","src":"checkenv","origin":"Microware OS-9 archive","archive":"checkenv.lzh","dir":"CMDS","size":1912,"star":true,"docs":true,"hassrc":true,"howto":"`checkenv \u003cname> , \u003cvalue>' with spaces round the comma. Meant to return an error when they differ; it returns 0 either way.","help":{"cmd":"checkenv -?","text":"Syntax: checkenv \u003ceparam> , \u003cevalue>\nFunction: check environment variable value\n  errors if \u003cevalue> not = SETENV value"},"cat":"Shells","sub":"Shell helpers"},{"name":"checkfile","desc":"cheque-book register, full screen. A adds a record through a form (item, date as YY/MM/DD, type, description, account, amount -- cheques as negative amounts), R lists the records with the balance, V edits, F picks the data file, Q quits. Records go in testfile.dat in the current directory. Wants TERM","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":16260,"star":true,"docs":true,"hassrc":true,"howto":"Full screen. A adds a record through a form, C accepts it, R lists the records with the balance, Q quits. Records go in testfile.dat in the current directory; cheques are entered as negative amounts.","help":{"note":"it takes no options; its commands are single letters on the screen"},"cat":"Maths & calculators","sub":"Spreadsheets"},{"name":"checkgame","desc":"check a saved GNU Chess game for illegal moves and print the board it finishes on.  It reads the `chess.lst' that gnuchess writes when you type `list'.  A different program from `game', which makes PostScript","dir":"CMDS/GAMES","size":27582,"docs":true,"howto":"It reads the `chess.lst' that gnuchess writes when you type `list'. Play in a directory of your own -- `ksh -c \"cd /dd/tmp/mine; gnuchess\"' -- type `list' then `quit', and then `checkgame /dd/tmp/mine/chess.lst'.","help":{"note":"it takes the game listing and nothing else"},"cat":"Games","sub":"Chess utilities"},{"name":"checksum","desc":"a 16-bit checksum of a file, or of part of one with -s for the offset and -n for the length","src":"eff_checksum","origin":"EFFO forum","archive":"disk 23  f23b/SOFTWARE/CHECKSUM","info":{"version":"Ed #1","purpose":"calulates 16-bit checksum","status":"final","language":"C","author":"Lukas Zeller","availability":"Public, EFFO Forum 23","copyright":"(c) 1992 by L.Zeller"},"dir":"CMDS","size":3812,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"checksum -?","text":"Syntax:   checksum \u003cfile> [\u003cfile>...]\nFunction: checksum calculation\nOptions:  -?        : displays this text\n          -n=\u003cn>    : calculate over \u003cn> bytes, (empty=$FF)\n          -s=\u003cn>    : start calculation at offset \u003cn>\n(c) 1992 by L.Zeller"},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"chess","desc":"chess against the machine on a shaded board.  It asks for your colour, your name and a long or short game, then takes a move as two squares -- `e2' then `e4', two keystrokes each with no RETURN.  68k port, three engine versions built","src":"chess","origin":"usenet archive","archive":"chess.ar","dir":"CMDS/GAMES","size":23602,"hassrc":true,"howto":"It asks for your colour, your name and a long or short game, then takes a move as two squares -- `e2' for the piece and `e4' for where it goes. Each square is two keystrokes and needs no RETURN.","help":{"cmd":"chess -?","text":"Syntax: chess [\u003copts>] \u003cname> [\u003copts>]\nFunction: plays interactive chess\nOptions:\n     -b\tplay black pieces\n     -l\tlong game\n     -s\tshort game\n     -w\tplay white pieces\n('NAME' environment variable will be used if set)"},"cat":"Games","sub":"Board & card"},{"name":"chgrp","desc":"sets the group half of a file's owner, by number or by name","needs":[{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS","size":3552,"star":true,"help":{"cmd":"chgrp -?","text":"chgrp: Usage:  chgrp [-z] {numerical-gid | username} [file [... file]]"},"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"chksum","desc":"a 32-bit checksum of each file named, with -c to count bytes as well and -t for a total only","src":"chksum","origin":"usenet archive","archive":"chksum.ar","dir":"CMDS","size":5334,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"chksum -h","text":"syntax: chksum [-cehtv]\t{file|--|-}...\nfunction: calculate 32-bit checksum for file(s), output to stdout\nOptions:\n\t-c\tCount bytes also\n\t-e\tgive extended Error reports on stderr\n\t-h\tHelp; give this help message and exit\n\t-t\tTotal only; don't list sum for each file\n\t-v\tVerbose; list filenames along with checksums\n\t--\ttake filenames from stdin, 1 name per line\n\t-\ttake stdin as a file\nFilenames may be mixed with options.\nExit status is the number of file errors encountered."},"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"chown","desc":"sets the user half of a file's owner, group.user, by number or by a name from SYS/password","needs":[{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS","size":3552,"star":true,"docs":true,"help":{"cmd":"chown -?","text":"chown: Usage:  chown [-z] {numerical-uid | username} [file [... file]]"},"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"ci","desc":"RCS: checks a working file in, writing the revision into its history file -- name_v here, since OS-9 has no comma in a file name -- with a log message","needs":[{"path":"/dd/tmp","missing":false,"dir":true,"bytes":null},{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":47684,"star":true,"help":{"cmd":"ci -?","text":"ci error: unknown option: -?\ncommand format:\nci -r[rev] -l[rev] -u[rev] -f[rev] -k[rev] -q[rev] -mmsg -nname -Nname -sstate -t[txtfile] file ...\nci aborted"},"cat":"Developer tools","sub":"Version control"},{"name":"cio","desc":"Microware's C library trap module -- what every starred program here needs.  Included with Microware's permission; see SOURCES.txt.  You do not run it, it loads itself.","dir":"CMDS","size":18058,"help":{"note":"Microware's C I/O trap handler, not a program: the starred programs call it"},"cat":"System & modules","sub":"Microware runtime"},{"name":"cjpeg","desc":"JPEG encoder (IJG).  Makes a JPEG from a PNM.  It wants LF between the fields of a PNM header where the netpbm here writes CR, so patch the three separators with `pbyte' first; DOC/STATUS has the offsets both ways.","needs":[{"path":"/dd/TEMP","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":50788,"docs":true,"howto":"Makes a JPEG from a PNM -- but not straight from a netpbm PNM. cjpeg wants LF between the header fields and this disk's netpbm writes CR, so it says \"Bogus data in PPM file\". Patch the three separators with `pbyte` first: for `ppmmake red 8 8` they are at offsets 2, 6 and a. DOC/STATUS has the full recipe both ways.","help":{"cmd":"cjpeg -?","text":"usage: cjpeg [switches] [inputfile]\nSwitches (names may be abbreviated):\n  -quality N     Compression quality (0..100; 5-95 is useful range)\n  -grayscale     Create monochrome JPEG file\n  -optimize      Optimize Huffman table (smaller file, but slow compression)\n  -targa         Input file is Targa format (usually not needed)\nSwitches for advanced users:\n  -restart N     Set restart interval in rows, or in blocks with B\n  -smooth N      Smooth dithered input (N=1..100 is strength)\n  -maxmemory N   Maximum memory to use (in kbytes)\n  -verbose  or  -debug   Emit debug output\nSwitches for wizards:\n  -qtables file  Use quantization tables given in file\n  -sample HxV[,...]  Set JPEG sampling factors"},"cat":"Graphics & images","sub":"JPEG"},{"name":"cjpeg.070","desc":"JPEG encoder, a build for another processor.  On the 68000 its twin `cjpeg' is the one to use; the .070 files are builds for a different CPU.","dir":"CMDS",
