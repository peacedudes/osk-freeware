on.","conditions":"May only be used under the conditions listed in the documentation (help file). The conditions prohibit use for military purposes. YOU MUST READ THE CONDITIONS BEFORE USING THIS PROGRAM!","copyright":"(c) 1990 by L.Zeller"},"dir":"CMDS","size":8462,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"space -?","text":"Syntax:   space [\u003copts>] {\u003cdir/file path>} [\u003copts>]\nFunction: Shows effective space requirements of directory trees and single\n          files on a given disk. \"Effective\" space means that not\n          only net file sizes, but also all space consumed by the\n          file system itself such as file descriptors, directory\n          files and partially used clusters is taken into account\nOptions:  -c=\u003cclustersize> : assume specified cluster size for space\n                             requirement calculation\n          -d=\u003cdisk>        : assume specified disk's cluster size\n                             for space requirement calculation\n          -g               : show grand total only\n          -k               : show KBytes instead of Sector count\nV1.1 Ed#4 (c) 1990 by L.Zeller"},"cat":"Files & directories","sub":"Find & compare"},{"name":"spctoppm","desc":"Atari compressed Spectrum picture to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45760,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"speech","desc":"translates English text into phonemes, the front half of a speech synthesiser: run bare it reads a line and prints its transcription; `speech in out' does a whole file","src":"speech","origin":"hc disk","archive":"SOURCES/USENET/speech.ar","dir":"CMDS","size":33882,"hassrc":true,"help":{"cmd":"speech -?","text":"Error: Cannot open input file.\nUsage: PHONEME [infile [outfile]]"},"cat":"Text tools","sub":"Spelling & words"},{"name":"spiff","desc":"a tolerant diff: compares two files while ignoring differences that do not matter -- white space, number formatting, case if asked -- and knows C, shell, Fortran, Modula-2 and Lisp source","src":"spiff","origin":"usenet archive","archive":"spiff.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":28408,"star":true,"docs":true,"hassrc":true,"howto":"Compares two files while ignoring differences that do not matter (whitespace, number formatting). Takes TWO filenames.","help":{"cmd":"spiff -?","text":"Syntax: spiff [-s script] [-f sfile] [-bteiqcdwm] [-abr value] -value f1 f2\nFunction: make controlled approximate comparsions between two files\n\nOptions:\n  -q        supress waring messages\n  -t        produce output in terms of individual tokens\n  -e        token compare\n  -value    sets a limit on the total number of insertions/deletions\n  -f sfile  a command script to be taken from file 'sfile'\n  -s script command script\n  -b        treat all objects (incl floating point numbers) as literals\n  -c        ignore differences between upper and lower case\n  -w        treat white space as objects\n  -m        treat leading sign chars (+/-) as separate\n  -d        treat integer numbers as real numbers\n  -a fpn    specifies an absolute value for the tolerance in fpns\n  -r fpn    specifies a relative tolerance (fpn=floating point number)\n  -i        causes differences between fpns to be ignored\n   Languages:\n  -C        treat input files as C program source code\n  -S        treat input files as Bourne shell program source code\n  -F        treat input files as FORTRAN program source code\n  -M        treat input files as Modula-2 program source code\n  -L        treat input files as Lisp program source code"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"spline","desc":"fit a spline through points, output PostScript","dir":"CMDS","size":6778,"star":true,"docs":true,"help":{"note":"it takes a file of points and writes PostScript whatever it is given; there is no help flag"},"cat":"System & modules","sub":"Utilities"},{"name":"split","desc":"GNU split: cuts a file into pieces of so many lines (-l) or bytes (-b), named after a prefix -- partaa, partab and so on","dir":"CMDS","size":32318,"help":{"cmd":"split -?","text":"split: unrecognized option `-?'\nUsage: split [-lines] [-l lines] [-b bytes[km]] [-C bytes[km]] [+lines=lines]\n       [+bytes=bytes[km]] [+line-bytes=bytes[km]] [infile [outfile-prefix]]"},"cat":"Text tools","sub":"Split & join"},{"name":"splitalf","desc":"split a file into \u003cname>_A to \u003cname>_Z by the first letter of each line, and \u003cname>_0 for the rest.  It opens \u003cname>_0, then tests a file slot it has not opened yet and stops with `can't open output file(s)'.","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":2628,"star":true,"hassrc":true,"howto":"It makes \u003cname>_0 and then stops with `can't open output file(s)', whatever it is given -- it tests a file slot it has not opened yet. No argument gets round it.","help":{"cmd":"splitalf -?","text":"Syntax: splitalf \u003copts> [\u003cin_path>] \u003copts>\nFunction: split file alphabetically.\nOptions:\n     -?        print usage"},"cat":"Text tools","sub":"Split & join"},{"name":"splman","desc":"OS-9 print spooler: the manager.  It wants a printer on an SCF device to spool to.  `splprt' is the process that drives the printer and `splstat' shows the queue; the three go together","needs":[{"path":"/dd/spl","missing":false,"dir":true,"bytes":null},{"path":"/DD/SPL/splq","missing":false,"dir":false,"bytes":0},{"path":"/DD/SPL/splforms","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":6858,"star":true,"help":{"note":"it takes no options; it opens the printer device and waits for work"},"cat":"Printing","sub":"Spooling"},{"name":"splprt","desc":"OS-9 print spooler: the printer process, one per printer. It wants an SCF device to write to","dir":"CMDS","size":3598,"star":true,"help":{"note":"it takes no options"},"cat":"Printing","sub":"Spooling"},{"name":"splstat","desc":"OS-9 print spooler: queue status.  It reads the spooler's queue.  The other spooler on this disk speaks up when its queue is empty: `lpq: no spooler installed', `lpshut: no spooler active', `prjob: Spooler not installed'.","needs":[{"path":"/DD/SPL/splq","missing":false,"dir":false,"bytes":0},{"path":"/DD/SPL/splforms","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":5252,"star":true,"help":{"note":"it takes a device number; anything else is refused as out of range"},"cat":"Printing","sub":"Spooling"},{"name":"spottopgm","desc":"SPOT satellite image to PGM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":53276,"hassrc":true,"help":{"note":"it takes the file to convert and no help flag"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sputoppm","desc":"Atari uncompressed Spectrum picture to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":44976,"hassrc":true,"help":{"note":"a filter with no options: an image on standard input or a file name, the result on standard output"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sqrtx","desc":"square-root demonstration","src":"forum1","origin":"Microware OS-9 archive","archive":"forum1.lzh","dir":"CMDS","size":12190,"hassrc":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"Utilities"},{"name":"ssl","desc":"show a file's segment list, sector by sector -- ssl \u003cfile>","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2308,"star":true,"hassrc":true,"help":{"note":"it takes the file and nothing else"},"cat":"System & modules","sub":"Devices & disks"},{"name":"sterm","desc":"a serial terminal emulator","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/COMMS","size":56242,"help":{"cmd":"sterm -?","text":"Sterm Ver. 2.0\n\nUsage:  sterm [-df? -l'p' -e'x']\n    -d       Debug mode on (displays during downloads)\n    -f    NOT downloading to floppy disks (CoCo only)\n    -?    Print this usage message\n    -l p  Link to modem port 'p' (Default /t2)\n    -e x  Set B+ MAXERRS to 'x' (default 10)"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"stone","desc":"the stones game (SNOBOL4-in-C).  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false,"dir":false,"bytes":1792}],"dir":"CMDS/GAMES","size":20950,"star":true,"hassrc":true,"help":{"note":"it takes no options and asks whether you want the rules; answer yes or no in full"},"cat":"Games","sub":"Other games"},{"name":"strfile","desc":"builds the .dat index that fortune reads from a file of sayings separated by %% lines, and reports what it found","src":"fortune","origin":"usenet archive","archive":"fortune.ar","dir":"CMDS","size":3522,"star":true,"hassrc":true,"help":{"cmd":"strfile -","text":"usage:  strfile [ - ] [ -cC ] [ -sv ] inputfile [ datafile ]\n        - - Give this usage summary\n        c - Replace delimiting character with 'C'\n        s - Silent.  Give no summary\n        v - Verbose.  Give summary.  (default)\n        Default \"datafile\" is inputfile.dat"},"cat":"Text tools","sub":"Fortune & sayings"},{"name":"striche","desc":"line drawing for the Atari Graph display; it calls the `graph' trap library, so load that first","dir":"CMDS/GAMES","size":3684,"star":true,"help":{"note":"it takes no options; it calls the Graph trap library, so load graph first"},"cat":"Graphics & images","sub":"Hardware demos"},{"name":"strings","desc":"finds the runs of printable text inside a binary and prints each with its offset, `$offset: text'; -l=n sets the shortest run reported","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":2494,"star":true,"hassrc":true,"help":{"cmd":"strings -?","text":"Usage: strings [-anpl=n] [file [file]]\n     searches named binary files for strings\n     -a   string is alpha chars only\n     -n   string is alphanumeric chars only\n     -p   string is printable chars only\n     -l=n set match length to 'n'\n     -z   get file names from std in"},"cat":"Text tools","sub":"Count & inspect"},{"name":"su","desc":"GNU su: become another user; its options are under `su --help'","needs":[{"path":"/dd/cmds","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/shells","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/errmsg.short","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":17550,"star":true,"help":{"cmd":"su --help","text":"Usage: su [OPTION]... [-] [USER [ARG]...]\n\n  -l, --login                  make the shell a login shell\n  -c, --commmand=COMMAND       pass a single COMMAND to the shell with -c\n  -f, --fast                   pass -f to the shell (for csh or tcsh)\n  -m, --preserve-environment   do not reset environment variables\n  -p                           same as -m\n  -s, --shell=SHELL            run SHELL if /etc/shells allows it\n      --help                   display this help and exit\n      --version                output version information and exit\n\nA mere - implies -l.   If USER not given, assume root."},"cat":"Shells","sub":"Shell utilities"},{"name":"subber","desc":"substitutes words in a stream from a `,old,new' word list, one pair a line, the first character being the delimiter. It grows its memory as it reads, so give it plenty up front: `subber #1000k words file' at an OS-9 shell","dir":"CMDS","size":4064,"star":true,"howto":"Substitutes words in a stream from a word list of `,old,new' pairs (the line's first character is the delimiter), reading a file as the second argument or standard input. It grows its data area as it reads, with F$Mem, so give it room up front: at an OS-9 (Microware) shell, `subber #1000k words file' -- bash and ksh read the `#' as a comment, so run it at your OS-9 shell or through it, `/h1/CMDS/shell \"subber #1000k words file\"'. Tested: `,fox,cat' turns `a fox' into `a cat'.","help":{"cmd":"subber -?","text":"Usage : subber \u003copts> wordlist \u003cfilename>\n\n        if no filename standard in is used\n        no opts yet"},"cat":"Text tools","sub":"Transform & filter"},{"name":"submit","desc":"runs the commands in a .sub file with its parameters substituted into them -- a batch job","dir":"CMDS","size":2692,"star":true,"help":{"cmd":"submit -?","text":"Syntax: submit [\u003copts>] [\u003csubmit file>] [{\u003cparameter>)]\nFunction: Executes commands from the submit file with textual replacement.\n          The submit file must have the suffix .sub.\nOptions:\n     -?       displays this help message"},"cat":"Shells","sub":"Shell helpers"},{"name":"subscribe","desc":"add a newsgroup to your subscription list -- for one already in /dd/.newsrc but turned off, `Newsgroup X is now subscribed.' and `X! 1' becomes `X: 1' in the file. A group not in .newsrc at all is silently left alone, which both this and unsubscribe do","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":9308,"star":true,"hassrc":true,"howto":"It works, and so does `unsubscribe' -- give it a group that IS in /dd/.newsrc. A group that is not there is silently left alone.","help":{"cmd":"subscribe -?","text":"subscribe: subscribe to Usenet newsgroups\n\nusage: subscribe \u003cnewsgroup> [newsgroup...]\n       if \u003cnewsgroup> is 'all', all newsgroups are subscribed to\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"News"},{"name":"suicide","desc":"animation: a stick figure walks off a rooftop","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":29800,"help":{"note":"it takes no options"},"cat":"Screen toys","sub":"Screen toys"},{"name":"suicide1","desc":"rooftop animation: a stick figure jumps from a tower block and a scream runs along the roofline as it falls. Plays once and returns; draws with termcap","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":30024,"help":{"note":"it takes no options"},"cat":"Screen toys","sub":"Screen toys"},{"name":"suicide2","desc":"the rooftop animation with a car: the figure lands on the road below and a warning is shouted across the top of the screen. Plays once and returns","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":29028,"help":{"note":"it takes no options"},"cat":"Screen toys","sub":"Screen toys"},{"name":"sum","desc":"GNU sum: prints a checksum and a block count for each file named","dir":"CMDS","size":22214,"help":{"note":"it takes no options of its own: name the files to sum"},"cat":"Text tools","sub":"Count & inspect"},{"name":"suse","desc":"show a program's usage line.  `-?' does the same for most programs here.","src":"forum2","origin":"Microware OS-9 archive","archive":"forum2.lzh","dir":"CMDS","size":190,"hassrc":true,"help":{"note":"it takes a program name and prints nothing"},"cat":"System & modules","sub":"Utilities"},{"name":"suspend","desc":"removes a process from the system -- its own usage line says so -- rather than suspending it; -s reaches system programs too","dir":"CMDS","size":4568,"star":true,"help":{"cmd":"suspend -?","text":"SUSPEND V1.1 (C.) 1989 by F.R.Schmitt\nSyntax  : suspend  [\u003cprocessname>]  [\u003copt>]\nFunction: removes the process from the system\nOptions:\n     -?       show this explanation\n     -s       remove also system programs"},"cat":"System & modules","sub":"Utilities"},{"name":"sysid","desc":"show system identification","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2146,"star":true,"hassrc":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"System state"},{"name":"sysmax","desc":"shows the system's maximum process age -- `system maximum age is 0' unless the kernel answers the F$SetSys call it uses","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2402,"star":true,"hassrc":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"Processes & memory"},{"name":"sysmin","desc":"shows the system's minimum process priority -- `system minimun priority is 0' here, from the same F$SetSys call","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2406,"star":true,"hassrc":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"Processes & memory"},{"name":"sysmon","desc":"system monitor.  It asks whether to create SYS/nodedef, times out on the keyboard and draws its Process Monitor, then takes a bus error at F$GPrDsc, the get-process- descriptor call this system does not answer -- the same gap `devprc -a' and `top' meet.  `dinfo', `map' and `space' answer the questions it would have.","src":"sysmon","origin":"Microware OS-9 archive","archive":"SYSMON.lzh","dir":"CMDS","size":87760,"star":true,"hassrc":true,"help":{"cmd":"sysmon -?","text":"Syntax: sysmon [\u003copt>]\nVersion: V6.1 09.03.1993\nFunction: show active tasks and cpu time consumption\nOptions:\n     -a      select alphanumeric mode\n     -b      select alphanumeric mode [extended]\n     -d      get default device from 'init'-module\n     -e      select alphanumeric mode [module information]\n     -j      enable max-hold function [dislay maximum cputime used]\n     -m      mark processes using more than 75 % cpu time  [graphic mode]\n     -p      show process priority instead of group & user [graphic mode]\n     -q      disable priority rising during work of sysmon [only at /term]\n     -r      switch QUICK-REFERENCE on\n     -t=s    get value for scan-time [seconds]\n     -u      select user mode (display only user processes)\n     -v      show program version and explanation\n     -w      enable WATCH-mode [kill unkown user processes]\n     -?      show this explanation\nNOTE:    While the program is running you can switch from NAME - mode\n         to DATA - mode by typing the 'N' - key. It's also possible to\n         switch to ALFA - mode by typing 'A' - key or to switch to\n         GRAFIC - mode by typing the 'G' - key !"},"cat":"System & modules","sub":"Processes & memory"},{"name":"t","desc":"a minimal trap-handler test stub: it installs, returns cleanly and prints nothing","dir":"CMDS","size":934,"help":{"note":"it takes no options and prints nothing"},"cat":"System & modules","sub":"Processes & memory"},{"name":"t_trtest","desc":"RICO trap-handler test","src":"forum7","origin":"Microware OS-9 archive","archive":"forum7.lzh","needs":[{"path":"/dd/sys/Errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS","size":15266,"hassrc":true,"help":{"note":"it asks for lines itself and has no help flag"},"cat":"System & modules","sub":"Utilities"},{"name":"tab","desc":"Tabulate 6809 or 68000 assembly source -- opcode-aware, and works on code that will not assemble","dir":"CMDS","size":17036,"docs":true,"help":{"cmd":"tab -?","text":"Syntax: tab [\u003copts>]\nFunction: Pipe to format 68000 series assembler source code\nOptions:\n     -a[=]\u003cnum> Argument field width (default 25)\n     -b         Tabulate 6809 mnemonics instead of 68000\n     -c         Only check conditionals\n     -i[=]\u003cnum> Indent by \u003cnum> characters per level (default 5)\n     -l[=]\u003cnum> Label field width (default 12)\n     -m         Don't use bar (|) to mark indented lines\n     -n         Ignore conditionals: no indent, no bar (overrides p)\n     -o[=]\u003cnum> Opcode field width (default 10)\n     -p         Form feed ($0c) on 'pag' nmemonics\n     -r         Remove all unnecessary spaces and tabs (overrides s)\n     -s         Format for columns 13,25,46 (overrides a,l,o)\n     -u         Allow only uncommented lines\n     -?         List usage\n\nCopyright (c) 1991 Steven Weller, Windsor Systems\n2407 Lime Kiln Lane, Louisville, KY 40222, U.S.A.\nPhone +1 (502) 425 9560  Fax +1 (502) 426 3944\n\nThis program may be freely copied and distributed, provided that\nit and this copyright message remain unmodified."},"cat":"Developer tools","sub":"Assembly"},{"name":"tabs","desc":"re-space a file, standard input to standard output: `-i8' says the input's tab stops are every 8 columns, `-o0' asks for spaces on output and `-o4' for tabs every 4.","src":"-","origin":"EFFO forum","archive":"disk 6 PROGRAMME/CODE (tabs.arc)","dir":"CMDS","size":14916,"docs":true,"help":{"cmd":"tabs -?","text":"Unknown switch: ?\nSyntax   : tabs [\u003copts>] [\u003cinput_redirection>] [\u003coutput_redirection>]\nFunction : convert from one tab size to another (default eight)\n           replace tabs with spaces or v.v.\n           delete trailing spaces/tabs on lines"},"cat":"Text tools","sub":"Transform & filter"},{"name":"tac","desc":"GNU tac: prints a file backwards, last line first","needs":[{"path":"/dd/tmp/tacXXXXXX","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":48142,"howto":"Prints a file backwards, last line first -- cat's mirror image. Needs cio.","help":{"cmd":"tac -?","text":"tac: unrecognized option `-?'\nUsage: tac [-br] [-s separator] [+before] [+regex] [+separator=separator]\n       [file...]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"tail","desc":"prints the last lines of a text file: `tail -l=3 file' the last three, twenty by default","dir":"CMDS","size":4038,"star":true,"docs":true,"help":{"cmd":"tail -?","text":"TAIL     Version UTIL 2.70 by DESIGNA VLT 27.05.98\ntail [Optionen] \u003cFile(Wildcard)>\nPrints last \u003cx> lines of Textfile\n\n   -l=\u003cx>, default=20\n   -d Switch on debug"},"cat":"Text tools","sub":"Count & inspect"},{"name":"tangle","desc":"WEB to Pascal -- Knuth's literate programming tool. It needs a change file named, always: given only a .web it answers `Error: `Can't open file.'' and the absent change file is what it could not open. DOC/tex ships `sample.web' and `none.ch' (an empty change file): copy both to your data directory and run `tangle sample none'. It reads and writes there, not where you typed from","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/BIB","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/BIB","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFBASES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFBASES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFINPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/POOLS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/POOLS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FORMATS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FORMATS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/TEX/SAMPLES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/INPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/SAMPLES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":76368,"howto":"Needs a CHANGE FILE named, always. `tangle yourfile.web' alone answers `Error: `Can't open file.'' and the file it cannot open is the absent change file, not your source. DOC/tex ships `sample.web' and `none.ch' (empty, changes nothing): copy both to your data directory and run `tangle sample none'. It reads and writes in the DATA directory, which bash's `cd' does not move. `weave sample none' is the other half.","help":{"cmd":"tangle -?","text":"Usage: tangle webfile[.web] [changefile[.ch]]."},"cat":"Text tools","sub":"TeX"},{"name":"tar","desc":"GNU tar 1.10: c creates a Unix tape archive, t lists it, x extracts; v shows each file, f names the archive","src":"eff_tar","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/TAR","dir":"CMDS","size":22966,"docs":true,"hassrc":true,"help":{"cmd":"tar -?","text":"Syntax : tar [ctx][mfv] tarfile [file(s)...]\nFunction: Builds and extracts from Unix tape archive files\nOptions:\n   c : create archive\n   t : list contents\n   x : extract from archive"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"tcmp","desc":"compares two text files and prints each differing line, both versions one under the other with the line number in each; -s sets how far ahead it looks to resynchronise","dir":"CMDS","size":5804,"star":true,"howto":"Compares two text files and prints each differing line, both versions one under the other with the line number in each file. Files whose lines differ only in tabs and spaces are reported as changed, which reads oddly until you dump them.","help":{"cmd":"tcmp -?","text":"[Tcmp v2.3]\nUsage:  tcmp [options] file1 file2\n  options:\n    -sdd   = syncronize up to dd lines\n     (dd = 0 is strict compare; default is 3\n    -fnnnn = start at line nnnn\n    -tnnnn = stop at line nnnn"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"teachgammon","desc":"backgammon that teaches you the game as you play","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":48926,"star":true,"help":{"cmd":"teachgammon -?","text":"Syntax: backgammon [\u003copts>] [\u003cfile>]\nFunction: what do you think ?\nOptions:\n     -n        don't ask for instructions\n     -r        you play red\n     -w        you play white\n     -b        you play both sides\n     -p[rwb]   print board before red/white/both\n     -s \u003cfile> recover earlier game from \u003cfile>\nIf no -s is present, but \u003cfile> is specified, then\nrecover from \u003cfile>"},"cat":"Games","sub":"Other games"},{"name":"tess","desc":"Beyond the Tesseract, a text adventure whose puzzles draw on physics and mathematics: two-word commands, about two hundred words understood, and -f skips the title and scenario","src":"tess","origin":"usenet archive","archive":"tess.ar","dir":"CMDS/GAMES","size":37052,"star":true,"docs":true,"hassrc":true,"help":{"note":"-f skips the title and scenario; there is no help flag"},"cat":"Games","sub":"Other games"},{"name":"testibc","desc":"IEEE-488 (GPIB) bus test program, B & K Denmark, 1989. Answer its `Timeout time (1/10 Sec)?' prompt and it draws a full command menu: Ifc, Remote, Llo, Goto local, Clear, Send, Enter, Dev-clear, Time, Quit.  Each command needs an IEEE-488 bus to reach.  It reads its messages from /dd/sys/errmsg.ibc.","needs":[{"path":"/dd/sys/errmsg.ibc","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":11448,"help":{"note":"it asks its questions itself and has no help flag"},"cat":"System & modules","sub":"Utilities"},{"name":"tet","desc":"Tetris -- `p' plays; s/j and f/l move a piece, d/k turns it, space drops it, q quits to the high-score table it keeps in GAMES/tet.hs.  Needs a terminal, not a pipe","src":"tet","origin":"usenet archive","archive":"tet.ar","needs":[{"path":"/dd/GAMES/tet.hs","missing":false,"dir":false,"bytes":140},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":67372,"docs":true,"hassrc":true,"howto":"Tetris. `p' plays from the menu; s or j moves the piece left, f or l right, d or k turns it, space drops it, ESC pauses and q quits to the high-score table, kept in GAMES/tet.hs. Give it a real terminal: it does no terminal setup of its own (the raw-mode code in SRC/tet/tet.c is inside `#ifndef OSK'), so from a pipe it draws its board and reads nothing.","help":{"note":"it takes no options; p plays from its menu"},"cat":"Games","sub":"Arcade & action"},{"name":"tex","desc":"TeX itself -- the typesetting program (a driver; virtex does the work)","dir":"CMDS/TEXCMDS","size":3160,"docs":true,"howto":"Run the engine, not the wrapper. `tex' is one line: it asks a shell to run `virtex \"&plain\" yourfile', the quoted format name is never unquoted, and the shell answers E$PNNF for the whole line (rc 221 with no $SHELL set, and silently). Type `virtex '&plain' yourfile.tex' instead. For LaTeX it is `virtex '&lplain' yourfile.tex', for SliTeX `virtex '&splain''. SYS/TEX/SAMPLES/small.tex is a LaTeX document and story.tex is plain TeX with no \\end.","help":{"note":"it takes the file to typeset; a flag is read as a file name"},"cat":"Text tools","sub":"TeX"},{"name":"texidx","desc":"build an index from TeX's .idx output","dir":"CMDS/TEXCMDS","size":24348,"help":{"note":"it takes the .idx file and nothing else"},"cat":"Text tools","sub":"TeX"},{"name":"textb","desc":"Mandelbrot set drawn in ASCII on an 80x25 terminal.  Start with X -2.3, Y -2.0, range 4.0, 32 iterations","dir":"CMDS","size":5354,"star":true,"docs":true,"hassrc":true,"howto":"An ASCII Mandelbrot viewer -- it asks four questions and draws. Try X_Coord -2.3, Y_Coord -2.0, RANGE 4.0, Max Iter 32. Needs Microware's cio.","help":{"note":"it asks its four questions itself; there is no help flag"},"cat":"Screen toys","sub":"Screen toys"},{"name":"tformat","desc":"fills text to a width: `tformat [width]' reads standard input and writes it refilled and justified, 80 columns unless told otherwise","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","dir":"CMDS/GAMES","size":15954,"hassrc":true,"help":{"cmd":"tformat -?","text":"tformat - format stdin to stdout.\n\nUsage: tformat [width|-?] [\u003cinfile] [>outfile]\n\n\t\tIf width omitted, then a width of 80 is used."},"cat":"Text tools","sub":"Format & typeset"},{"name":"tftopl","desc":"TeX font metric to property list (the readable form)","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FONTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/BIB","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/BIB","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFBASES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFBASES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFINPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/POOLS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/POOLS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FORMATS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FORMATS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/TEX/SAMPLES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/INPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/SAMPLES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":72600,"help":{"note":"it takes the .tfm file and, if wanted, the .pl to write; there is no help flag"},"cat":"Text tools","sub":"TeX"},{"name":"tgatoppm","desc":"TrueVision Targa to PPM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":47776,"hassrc":true,"help":{"cmd":"tgatoppm -?","text":"usage:  tgatoppm  [-debug] [tgafile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"time","desc":"times a command the way OS-9 accounts for it: system and user ticks, seconds elapsed, system calls and bytes moved. A time.stat file in the current directory collects the figures","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":4396,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"time -?","text":"syntax: time \u003cshell cmd>\nfunction: prints program timing statistics.  If a file\n\tnamed \"time.stat\" exists in the current directory,\n\tthe statistics will be appended to this file.\n\nFormat of time.stat file:\n\tField\tOffset\tSize\tDescription\n\t  1\t\t  0\t\t 30\t\tcommand executed\n\t  2\t\t 30\t\t  6\t\tdate\n\t  3\t\t 36\t\t  4\t\texecution time in seconds\n\t  4\t\t 40\t\t  6\t\tsystem ticks\n\t  5\t\t 46\t\t  6\t\tuser ticks\n\t  6\t\t 52\t\t  5\t\tOS-9 function calls\n\t  7\t\t 57\t\t  5\t\tI/O calls\n\t  8\t\t 62\t\t  8\t\tbytes read\n\t  9\t\t 70\t\t  8\t\tbytes written\nJ?"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"timid","desc":"a fixed timing loop -- runs a set batch of system calls and reports the elapsed clock ticks. It takes no command; time is the one that times a command.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":14664,"hassrc":true,"help":{"cmd":"timid -?","text":"Syntax: timit [\u003copts>]\nFunction: time something\nOptions:\n     (none available)"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"today","desc":"date, moon phase and this-day-in-history","src":"today","origin":"usenet archive","archive":"today.ar","dir":"CMDS","size":19450,"docs":true,"hassrc":true,"help":{"note":"it takes no options: run it and it prints the day"},"cat":"Time & calendar","sub":"Calendars"},{"name":"todos","desc":"meant to turn OS-9 line endings into DOS ones in place; it converts into a temporary file it then cannot rename back, so the file is left unchanged. `autolf -c -C -L' does the job as a filter","dir":"CMDS","size":2814,"star":true,"help":{"note":"it takes the file to convert and nothing else"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"toos9","desc":"meant to turn DOS line endings into OS-9 ones in place, and the same story as todos: the temporary cannot be renamed over the original. `autolf -l -C' does the job as a filter","dir":"CMDS","size":3748,"star":true,"help":{"cmd":"toos9 -?","text":"TOOS9    Version UTIL 2.80 by DESIGNA VLT 03.08.98\ntoos9 \u003cFile(Wildcard)>\n\nConverts TEXT-File from DOS-Format to OS9-Format\n(and overwrites the source-file !!)\n\n   -1         Convert german special chars (a-Umlaut (HEX 0x84)->ae, ...)"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"top","desc":"show the busiest processes by their share of the CPU.  It prints its headings and then crashes -- its own bug: it asks about the root process's non-existent parent and does not check the error.  `aprocs' and `sysmon' show process state and run","src":"eff_top","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/TOP_MODIF","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":7150,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"top -?","text":"Syntax: top [\u003copts>] [\u003cnum>]\nFunction: display the processtable every num (def.: 10) seconds\nOptions:\n\t-a\tdisplay all process"},"cat":"System & modules","sub":"Processes & memory"},{"name":"touchtype","desc":"TYPEFAST, a typing game: words fall down the screen and you type each one before it lands.  ESC ends the game and scores you in words per minute","src":"touchtype","origin":"usenet archive","archive":"touchtype.ar","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":46500,"hassrc":true,"howto":"Full-screen typing game. Answer `n' to the instructions question, pick a level 1-3 (q quits there), type each falling word followed by SPACE or RETURN. ESC ends the game and prints the words-per-minute score.","help":{"cmd":"touchtype -?","text":"Usage: touchtype"},"cat":"Amusements","sub":"Curiosities"},{"name":"tplot","desc":"Plot data to a plotter.  Asks for an interval and a range and drives the output device; written for an Atari ST","dir":"CMDS","size":12652,"star":true,"help":{"cmd":"tplot -?","text":"Usage : hiplot \u003c-opt1> .. \u003c-optn> \u003cfile1> .. \u003cfilen>\n        Plots data from files or stdin,  prompting for axis\n        information unless the -a opt is used.\n        A blank line in the point file will lift the pen\n        If no files are specified stdin is used\n\n        opts :\n              -a=file   file has 3 lines with\n                        x interval,  y interval,  x, y divisions\n                        each line two numbers separated by ' '\n              -x=xaxis  xaxis title of x-axis\n              -y=yaxis  yaxis title of y-axis\n              -t=title  plot title"},"cat":"Graphics & images","sub":"Plotting"},{"name":"transfer","desc":"copies files from GDOS disks to OS-9, and takes no options at all. For general device-to-device copies, `cp', `copy' and `dsave' do that","src":"forum1","origin":"Microware OS-9 archive","archive":"forum1.lzh","needs":[{"path":"/DD/DESC/DGDOS0","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":11212,"star":true,"hassrc":true,"help":{"cmd":"transfer -?","text":"Syntax: transfer\nFunction: copy files from GDOS-disks to OS-9\ntransfer: no options allowed"},"cat":"System & modules","sub":"Utilities"},{"name":"trap","desc":"an example trap handler -- it installs a trap from system state, so from an ordinary program it stops. Run it by path; trap is also a shell builtin.","src":"trap","origin":"usenet archive","archive":"trap.ar","dir":"CMDS","size":2488,"star":true,"hassrc":true,"howto":"The system-state trap-handler example: it installs a trap from system state. Ask for it BY PATH -- `/dd/CMDS/trap' -- because `trap' is also a bash builtin, and the builtin answers first, silently.","help":{"note":"an example trap handler that takes no options; run it by path"},"cat":"Developer tools","sub":"Debugging"},{"name":"travesty","desc":"rewrites its input as plausible nonsense, by Markov chains: `travesty -n400 \u003c file' for 400 characters of it","src":"travesty","origin":"usenet archive","archive":"Daniel J. Bernstein 1989, v1.1","dir":"CMDS","size":24990,"docs":true,"hassrc":true,"help":{"cmd":"travesty -H","text":"travesty makes a travesty of its input.\n\ntravesty -A: print authorship notice\ntravesty -C: print copyright notice\ntravesty -H: print this notice\ntravesty -U: print short usage summary\ntravesty -V: print version number\ntravesty -W: print disclaimer of warranty\n\ntravesty [ -oord ] [ -nnum ] [ -rrand ] [ -sS ]: let the monkeys bang away\n  -oord: use an order-ord Markov process (default 5, limit 20)\n  -nnum: generate num output characters (default 0, meaning forever)\n  -rrand: use rand as the random number generator seed (default based on time)\n  -s: start output same as input\n  -S: start output at a random spot in input (default)\n\ntravesty will respond to an ALRM signal by printing its random seed on stderr.\n\nIf you have questions about or suggestions for travesty, please feel free\nto contact the author, Daniel J. Bernstein, at brnstnd@acf10.nyu.edu\non the Internet."},"cat":"Amusements","sub":"Generators"},{"name":"tree","desc":"print a directory tree, drawn with line graphics -- directories only, sorted, from the directory you name","src":"eff_tree","origin":"EFFO forum","archive":"disk 13  SOFTWARE/C/TREE","needs":[{"path":"/dd/sys/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/h0/sys/errmsg","missing":false,"dir":false,"bytes":18543}],"info":{"version":"V1.21","purpose":"displays directory tree","language":"C","author":"Christian Mahr","availability":"Public.","copyright":"(c) 1990 by C.Mahr"},"dir":"CMDS","size":19176,"docs":true,"hassrc":true,"help":{"cmd":"tree -?","text":"tree, v1.21 - 28.04.90 - updated 17.06.90\nSyntax: tree [\u003cdirectory>] [\u003copts>]\nFunction: print all subdirectories as a tree\n          use special graphics for VT100 compatibles\n          and for IBM compatibles printers and ATARI ST\nOptions:\n   -f    print all files\n   -w=n  limit name field width to n characters\n   -d    internal debug flag\n   -a    force terminal type to be ANY_TERM\n   -v    force terminal type to be VT100\n   -s    force terminal type to be ST/IBM"},"cat":"Files & directories","sub":"List & navigate"},{"name":"trunc","desc":"truncate a file to a given length","src":"forum23","origin":"Microware OS-9 archive","archive":"forum23.lzh","dir":"CMDS","size":3184,"star":true,"hassrc":true,"help":{"cmd":"trunc -?","text":"OS-9/68k supplementary command.\nWritten by Carsten Emde; may be copied for non-commercial use.\nSyntax: trunc \u003cpath> \u003cnum>\nFunction: reduce length of file \u003cpath> to \u003cnum>, where \u003cnum>\n          specifies the new file length in decimal or optionally\n          in hexadecimal when preceeded by '$' or '0x'.\nOptions: none"},"cat":"System & modules","sub":"Utilities"},{"name":"tsmon2","desc":"tsmon replacement - terminal monitor","src":"eff_tsmon","origin":"EFFO forum","archive":"disk 8   PROGRAMME/C/TSMON2","dir":"CMDS","size":18316,"docs":true,"hassrc":true,"help":{"cmd":"tsmon2 -?","text":"**** TSMON2: de-luxe version of the timesharing monitor (c) 1989 by L.Zeller\nSyntax:   tsmon2 [\u003coptions>] \u003cdevice name>\nFunction: Monitor terminal device to initiate the login procedure when\n          CR is typed (default case)\nOptions:  -i         : initiate login program as soon as DCD goes active\n                       (no CR required to start login)\n          -t[=]\u003csec> : close and re-open path after specified number of\n                       seconds of inactivity on port while waiting for CR\n          -k         : kill login process and all it's child processes\n                       as soon as DCD goes inactive\n          -p=\u003cprog>  : Start \u003cprog> instead of 'login'\n          -a         : accept any character to initiate instead of CR only\nNote:     Some device drivers can't detect the inactive-to-active\n          transition of the DCD signal and some others don't support\n          DCD monitoring at all. Therefore, the -i and -k options may\n          not work as expected on some systems."},"cat":"Communications","sub":"Terminal & session"},{"name":"tsu","desc":"tterm's setup program","dir":"CMDS/COMMS","size":2980,"star":true,"help":{"note":"it takes no options: run it and it checks tterm's directories, creating what is missing"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"tt","desc":"Tetris for terminals: , and / move, . rotates, space drops, s pauses, q quits","needs":[{"path":"/h0/games/lib/ttscores","missing":false,"dir":false,"bytes":416},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543}],"dir":"CMDS/GAMES","size":45616,"howto":"Tetris for terminals, full-screen: , and / move the piece, . rotates, space drops, s pauses, q quits.","help":{"cmd":"tt -?","text":"tt: Usage: tt [ -s ] [ -b ] [ -l# ]"},"cat":"Games","sub":"Arcade & action"},{"name":"tterm","desc":"a terminal emulator, VT100-ish","needs":[{"path":"/dd/USR/TTERM/","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/COMMS","size":29904,"star":true,"help":{"cmd":"tterm -?","text":"Tterm Version 2.30\n\nUsage:  tterm \u003coptions>\n   -?      Print this usage message\n   -l[=]p  Link to modem port 'p'\n           defaults to MODEM"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"tttt","desc":"tic-tac-toe","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":33236,"hassrc":true,"howto":"Full-screen tic-tac-toe on a four-by-four board. Name a square as a column letter and a row digit, `b1'. `q' quits.","help":{"note":"it takes no options; q quits"},"cat":"Games","sub":"Board & card"},{"name":"tty","desc":"report the terminal's name","dir":"CMDS","size":1448,"star":true,"help":{"note":"it takes no options"},"cat":"System & modules","sub":"Utilities"},{"name":"ttyexp","desc":"fireworks drawn in characters: bursts thrown out from a point, arcing under gravity with trails. -s\u003cn> bursts at once, -p\u003cn> points in each, -D\u003cn> seconds to run; `ttyexp -s2 -p50' fills the screen. Clears the screen when done; VT100, wants TERMCAP","src":"ttyexp","origin":"usenet archive","archive":"comp.sources.games -- Dennis Lo","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":34480,"hassrc":true,"howto":"`ttyexp -s2 -p50' fills the screen with bursts; it runs ten seconds and clears the screen when done.","help":{"cmd":"ttyexp -?","text":"*** Invalid option: -?\nUsage: ttyexp \u003cparameters>\nParameters can be one of\n   -s\u003cn> :\u003cn> = # of simultaneous explosions. Default: 1\n   -x\u003cn> :\u003cn> = Explosion X size.             Default: 40\n   -y\u003cn> :\u003cn> = Explosion Y size.             Default: 15\n   -p\u003cn> :\u003cn> = #pts/explosion. Max 300.      Default: 10\n   -t\u003cn> :\u003cn> = Trail length.                 Default: 4\n   -d\u003cn> :\u003cn> = Delay factor.                 Default: 0\n   -g\u003cn> :\u003cn> = Gravity (vert accel).         Default: 1000\n   -w\u003cn> :\u003cn> = Wind (horiz accel).           Default: 0\n   -c\u003cn> :\u003cn> = Explosion character.          Default: '@'\n   -D\u003cn> :\u003cn> = Duration.                     Default: 10"},"cat":"Screen toys","sub":"Screen toys"},{"name":"txmod","desc":"send an OS-9 module over a serial line","dir":"CMDS/COMMS","size":2898,"help":{"cmd":"txmod -?","text":" 4ETXMod - Err:  -? !\nTXMod Ed.1 Rv.2 - send Module via SCF to RXMod to link there\nSyntax: TXMod [\u003copts>] module(s) [\u003copts>]\nOptions:\n  -x       :  all modules in EXE dir\n  -l[=]\u003cdev> : use dev for xmission\n              else StdIn/StdOut/StdErr\n\n  -r       :  send RXMOD to other, show 2 sec responses"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"ub68020demo","desc":"UniBasic 1.10 for the 68020 -- the same demonstration as `ub68kdemo' and it runs the same way, announcing `OS9/68020 Version' where the other says 68000.","dir":"CMDS/DEMOS","size":426242,"help":{"cmd":"ub68020demo -?","text":"UniBasic Version 1.10\nOS9/68020 Version\n\n*************** DEMO VERSION ***************\nModification expressly forbidden!!!\n\nTo order call: (573) 236-4372 or 4373\nEMail at mlsmith@vax2.rain.gen.mo.us\n\nVersions for other operating systems available\n\nCopyright  1995, 1996 Computer Design Lab\nAll Rights Reserved\n\ncb file [opts] {CompVar=Const}\nOptions:\n    -a        Compile to assembler (.a or .s file)\n    -e        Compile with no output but check for errors\n    -s        Symbol Table Dump to stdout\n    -f        Function mode\n    -g        Generate symbol module for debugger\n    -c        Compile to C code (.c file)\n    -r        Turn OFF remarks (comments) in -c option\n    -u        Unabridged symbol table dump\n    -v        Verbose (detailed reporting of progress)"},"cat":"System & modules","sub":"Vendor demos"},{"name":"ub68kdemo","desc":"UniBasic 1.10 -- a BASIC compiler, same arrangement as OmniBasic.  Run it from /dd/DOC/unibasic","dir":"CMDS/DEMOS","size":527726,"howto":"UniBasic 1.10, and it does compile -- the trick is that it runs its build through $SHELL. With SHELL unset it hunts for `/dd/bash' and dies with \"Error Exit\" and error 216. Do `setenv SHELL /dd/CMDS/sh', work in a directory holding basic.h and basic.l (DOC/unibasic has them), have your C toolchain reachable with CDEF and CLIB set, and give it memory. DEMO VERSION: the symbol table is capped, nothing else is.","help":{"cmd":"ub68kdemo -?","text":"UniBasic Version 1.10\nOS9/68000 Version\n\n*************** DEMO VERSION ***************\nModification expressly forbidden!!!\n\nTo order call: (573) 236-4372 or 4373\nEMail at mlsmith@vax2.rain.gen.mo.us\n\nVersions for other operating systems available\n\nCopyright  1995, 1996 Computer Design Lab\nAll Rights Reserved\n\ncb file [opts] {CompVar=Const}\nOptions:\n    -a        Compile to assembler (.a or .s file)\n    -e        Compile with no output but check for errors\n    -s        Symbol Table Dump to stdout\n    -f        Function mode\n    -g        Generate symbol module for debugger\n    -c        Compile to C code (.c file)\n    -r        Turn OFF remarks (comments) in -c option\n    -u        Unabridged symbol table dump\n    -v        Verbose (detailed reporting of progress)"},"cat":"System & modules","sub":"Vendor demos"},{"name":"udate","desc":"UNAXCESS BBS date display -- and it gets the YEAR wrong: `Monday, August 31, 19126'.  A two-digit year (126, meaning 2026) written into a four-digit field behind a literal `19'.","src":"effo_unaxcess","origin":"usenet archive","archive":"effo_unaxcess.ar","dir":"CMDS","size":2338,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it prints the date"},"cat":"Communications","sub":"Terminal & session"},{"name":"ularn","desc":"ULarn -- the larn variant, and its data is complete","needs":[{"path":"/dd/u","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/games/Ularn/","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/GAMES","size":162114,"help":{"cmd":"ularn -h","text":"Cmd line format: Ularn [-slicnh] [-o\u003coptsfile>] [-##] [++]\n  -s   show the scoreboard\n  -i   show scoreboard with inventories\n  -c   create new scoreboard (wizard only)\n  -n   suppress welcome message on starting game\n  -h   print this help text\n  -o\u003coptsfile>   specify .Ularnopts file to be used instead of \"~/.Ularnopts\"\n  -##  specify level of difficulty (example: Ularn -5)\n  -++  restore game checkpoint file"},"cat":"Games","sub":"Dungeon crawl"},{"name":"uld","desc":"XModem upload","dir":"CMDS/COMMS","size":4468,"star":true,"help":{"cmd":"uld -?","text":"uld version 1.4   (c) 1986 FHL\n\nSyntax: uld \u003cfile>\n\nFunction: upload to \u003cfile> using XMODEM protocol"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"umacs","desc":"uMacs 1.0, MicroEMACS in 45K -- the same keys, no macro language","needs":[{"path":"/DD/SYS/","missing":false,"dir":true,"bytes":null},{"path":"/H0/SYS/","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":45412,"star":true,"howto":"A small Emacs (uMacs 1.0). Full-screen: it takes the display and shows \"== uMacs 1.0 == main ==\" at the foot. It needs only TERM set.","help":{"note":"it takes file names and no help flag"},"cat":"Editors","sub":"emacs family"},{"name":"umusek","desc":"UMusEK -- a music editor.  It needs a hardware graphics screen: point it at one and it opens.  Without a graphics screen it stops with `***DS_ScAdd Error 208.' and `Fran: Can't get screen addr, 'bye!'.","needs":[{"path":"/DD/SYS/UM3.Init","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/AllUmK.img","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/Chars.img","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":140424,"help":{"note":"it takes no options; it wants a hardware screen"},"cat":"System & modules","sub":"Utilities"},{"name":"undel","desc":"brings back a deleted file: it asks for the directory, offers each deleted name RBF still holds (the first letter overwritten), and asks twice before writing","src":"eff_undel","origin":"EFFO forum","archive":"disk 6   PROGRAMME/C/UNDEL","dir":"CMDS","size":7482,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"undel -?","text":"usage: undel  [ -opt ] [ full directory name ] [ -opt ]\n       undelete Files in Directory \u003c full pathname >\n       options: -? prints usage message\n                -e extended info about undeleting"},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"unexpand","desc":"GNU unexpand: turns leading spaces back into tabs, or all of them with -a","dir":"CMDS","size":27258,"help":{"cmd":"unexpand -?","text":"unexpand: unrecognized option `-?'\nUsage: unexpand [-tab1[,tab2[,...]]] [-t tab1[,tab2[,...]]] [-a]\n       [+tabs=tab1[,tab2[,...]]] [+all] [file...]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"unifdef","desc":"resolve #ifdef sections in C source for one symbol: -d\u003csym> keeps its branch, -u\u003csym> the other.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":17786,"hassrc":true,"howto":"Its option is `-d\u003csym>' -- lower case, no equals -- and `-u\u003csym>' for the other side. `-DOSK' is refused with its own help, which reads like the program working and is not.","help":{"cmd":"unifdef -?","text":"syntax: unifdef {\u003copts>} [\u003cfile>]\nfunction: remove ifdef'ed lines from source file\noptions:\n\t-c\t\t\toperation of unifdef is complemented\n\t-d\u003csym>\t\tdefine a symbol\n\t-id\u003csym>\tignore lines within defined symbol\n\t-iu\u003csym>\tignore lines within undefined symbol\n\t-l\t\t\tblank out removed lines instead of deleting them\n\t-t\t\t\ttext file, ignore comments and quotes\n\t-u\u003csym>\t\tundefine a symbol\n\nExit status: 0=output is exact copy of input, 1 if not, 2 if trouble.\nThis is public domain software (newsnet), not for sale.\n\nAt least one arg from [-d -u -id -iu] is required"},"cat":"Developer tools","sub":"Source formatting"},{"name":"unip","desc":"unique lines with page numbers","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":15114,"hassrc":true,"help":{"cmd":"unip -?","text":"Syntax: unip [\u003copts>] [\u003csrcpath>] [\u003copts>]\nFunction: unique with page numbers\nOptions:\n     -a        don't match upper to lower case\n     -d        match in dictionary order\n     -i        ignore case completely\n     -?        print usage"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"uniq","desc":"drops repeated adjacent lines: -u keeps only the unrepeated, -d only the repeated, -c counts each; sort first","dir":"CMDS","size":3104,"star":true,"docs":true,"help":{"cmd":"uniq -?","text":"Usage: UNIQ [-u][-d][-c] [-n] [^n] input [>output]\n   -u ==> just output unrepeated lines\n   -d ==> output one copy of just repeated lines\n   (default) ==> union of -u and -d options\n   -c ==> prefix each output line with count of occurrences\n   -n ==> skip first n fields in comparison\n   ^n ==> ignore first n characters after skipped fields"},"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"UnMacpack","desc":"Unpack MacPack format.  Named for its module, which is UnMacpack rather than unmacpack","dir":"CMDS","size":41166,"help":{"cmd":"UnMacpack -H","text":"File output options:\n-b:\tMacBinary (default)\n-s:\tMacBinary stream to standard output\n-f:\tthree fork mode, skipping empty forks\n-3:\tthe same, writing also empty forks\n-r:\tresource forks only\n-d:\tdata forks only\n-u:\tdata forks only with Mac -> Unix text file translation\n-U:\tas -u, but filename will not have an extension\n-a:\tnot supported, needs recompilation\nMacunpack specific options:\n-i:\tgive information only, do not unpack\n-l:\tgive listing\n-v:\tgive verbose listing\n-q:\tquery for every file/folder before unpacking\n-V:\tgive information about this version\n-H:\tthis message\nDefault is silent unpacking"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"unp","desc":"strips unprintable characters from a stream and reports each one removed, by code and line number","dir":"CMDS","size":1680,"star":true,"help":{"cmd":"unp -?","text":"  Usage:  unp [-?] [file]"},"cat":"Text tools","sub":"Transform & filter"},{"name":"unpacklib","desc":"split an OS-9 library into its modules","src":"eff_libutils","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/LIBUTILS","dir":"CMDS","size":4572,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"unpacklib -?","text":"unpacklib: Unimplemented option '-?'.\n\nUsage: unpacklib \u003coptions> file1.l file2.l ...\nRicreates OS-9 modules from OS-9 libraries.\n Where options are:\n   '-verbose':\tlist all the processed module names\n   '-list':\tlist module names and size ONLY (don not create files)\nCopyright by CERN, written by CN/CE/MS (Vers.1.0 - 6 July 90)"},"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"unpacklib.os9","desc":"unpack a library into its object modules","dir":"CMDS","size":17728,"help":{"cmd":"unpacklib.os9 -?","text":"unpacklib: Unimplemented option '-?'.\n\nUsage: unpacklib \u003coptions> file1.l file2.l ...\nRicreates OS-9 modules from OS-9 libraries.\n Where options are:\n   '-verbose':\tlist all the processed module names\n   '-list':\tlist module names and size ONLY (don not create files)\nCopyright by CERN, written by CN/CE/MS (Vers.1.0 - 6 July 90)"},"cat":"System & modules","sub":"Utilities"},{"name":"unsit","desc":"opens StuffIt archives from a Macintosh: -l lists, -r and -d take one fork only","dir":"CMDS","size":35290,"docs":true,"help":{"cmd":"unsit -?","text":"unsit: unknown option -?\nUnsit V1.15f Update by Nigel Perry\n             Orginal by Allen G Weber\n             OSK Port by Dean Leiber\n\nUsage: Unsit [-rdulM] [-vqfm] filename\n\n Options:\n             -r = Extract Resource Fork only\n             -d = Extract Data Fork only\n             -u = Mac -> Unix Text\n             -l = List Archive Contents\n             -M = Macbinary\n Modifiers:\n             -v = Verbose\n             -q = Query (Prompt for Y/N)\n             -m = Input Macbinary [Default]\n             -f = Flatten Archive"},"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"unstr","desc":"strfile's reverse: writes the sayings back out of a fortune .dat index as plain text -- `unstr sayings.dat out'; the .dat may be left off the name","src":"fortune","origin":"usenet archive","archive":"fortune.ar","dir":"CMDS","size":15172,"hassrc":true,"help":{"cmd":"unstr","text":"usage: unstr datafile[.dat] [ outfile ]"},"cat":"Text tools","sub":"Fortune & sayings"},{"name":"unsubscribe","desc":"drops a newsgroup from your subscription list: `!' replaces `:' in /dd/.newsrc. For a group that is already off it prints `Newsgroup 684700s already unsubscribed.', because the string in the binary is `Newsgroup % is already unsubscribed.' with no conversion letter after the `%'","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":9330,"star":true,"hassrc":true,"help":{"cmd":"unsubscribe -?","text":"unsubscribe: unsubscribe from Usenet newsgroup(s)\n\nusage: unsubscribe \u003cnewsgroup> [newsgroup...]\n       if \u003cnewsgroup> is 'all', all newsgroups will be unsubscribed\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"News"},{"name":"unzip","desc":"Info-ZIP unzip -- reads zips made elsewhere; DOC/zip/sample.zip is one to try it on.  `zoo', `tar' and `gzip' are the archivers on this disk","src":"unzip50","origin":"Microware OS-9 archive","archive":"unzip50_src.lzh -- Info-ZIP 5.0,","dir":"CMDS","size":42060,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"unzip -?","text":"UnZip:  Zipfile Extract v5.0 of 21 August 1992;  (c) 1989 S.H.Smith and others\nVersions 3.0 and later by Info-ZIP.  Bug reports ONLY to zip-bugs@cs.ucla.edu\n\nOSK Version 1.1 By Ricky Beam 10/16/93\nUsage: unzip [ -options[modifiers] ] file[.zip] [filespec...]\n  -x  extract files (default)                -l  list files (short format)\n  -c  extract files to stdout/screen (CRT)   -v  list files (verbose format)\n  -f  freshen existing files, create none    -p  extract to pipe, no messages\n  -u  update files, create if necessary      -t  test archive integrity\n                                             -z  display archive comment\nmodifiers:\n  -n  never overwrite existing files\n  -o  overwrite files WITHOUT prompting      -a  convert text (CR LF => LF)\n  -j  junk paths (don't make directories)    -U  don't make names lowercase\n  -q  quiet mode (-qq => quieter)"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"upperdir","desc":"normalises the names in a directory: files to lower case, directories to upper, printing each as it renames it","src":"upperdir","origin":"Microware OS-9 archive","dir":"CMDS","size":8126,"hassrc":true,"help":{"cmd":"upperdir -?","text":"Usage: UpperDir [directory name]\n       Changes filenames to lowercase,\n       and directories to uppercase."},"cat":"Text tools","sub":"Transform & filter"},{"name":"uucico","desc":"the transfer program itself -- dials, talks UUCP","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/Systems","missing":false,"dir":false,"bytes":3605},{"path":"/DD/SYS/UUCP/Devices","missing":false,"dir":false,"bytes":989},{"path":"/DD/SYS/UUCP/Dialers","missing":false,"dir":false,"bytes":1427},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":43498,"star":true,"hassrc":true,"help":{"cmd":"uucico -?","text":"usage: uucico [opts] -r | sys [sys...]  [opts]\n\n      sys      -remote system to call as MASTER (default)\n\nopts: -r       -run as SLAVE\n      -u       -do not run UUXQT at all\n      -a       -run UUXQT after each call, default is after all calls\n                  are completed\n      -l       -use RAM disk for temporary \"uulog\"\n      -o       -orphan UUXQT\n      -pN      -fork UUXQT with a priority of N\n      -q       -run quietly\n      -wN      -use window size of N\n      -xN      -set debug level to N (0-9), default is 0 (off), if N > 5\n                  additional info sent to 'uulog'\n      -z       -send log info to screen if debug level is 1 to 5,\n                  overrides -l\n      -iN      -wait N minutes between call retries, default is 2\n      -tN      -try to call remote up to N times, default is 1\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"UUCP"},{"name":"uuclean","desc":"removes stale jobs from the UUCP spool, /dd/SPOOL/uucp, which SYS/UUCP/Parameters names, and rotates the log files. It walks every entry in the spool as if it were a directory, so a plain file there earns `can't change to directory'; harmless","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":21074,"star":true,"hassrc":true,"help":{"cmd":"uuclean -?","text":"uuclean: removed old UUCP files, rotate UUCP and FileServ log files\nUsage: uuclean [opts]\n\nOpts:   -nX     Remove those files over X days old (default is 7)\n        -ddir   Use this directory name\n        -v      Set verbose option on\n        -l      Do not rotate log files\n        -x      Set debug option on (files are not touched)\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"UUCP"},{"name":"uucp","desc":"queue a file copy to or from another site","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/sequence.spool","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":15682,"star":true,"hassrc":true,"help":{"cmd":"uucp -?","text":"uucp:  unix to unix copy program\n\n       uucp [-options] [system!]fromfile [system!]tofile\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"UUCP"},{"name":"uudecode","desc":"undoes uuencode: writes the file named on the begin line back into the current directory","dir":"CMDS","size":3440,"star":true,"help":{"cmd":"uudecode -?","text":"ERROR: can't find -?\nUSAGE: uudecode [infile]"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uuencode","desc":"uuencode. Give it one argument -- the input file -- and redirect: `uuencode myfile > myfile.uu'. Its own usage line prints `uuencode >outfile [infile] name', which fails with two arguments.","dir":"CMDS","size":2416,"star":true,"howto":"One argument, the file: `uuencode /dd/SYS/motd > out.uu'. Its usage line reads as though it wants two and with two it prints that line and stops. `uudecode' is what undoes it.","help":{"cmd":"uuencode -?","text":"ERROR: can't find -?\nUSAGE: uuencode >outfile [infile] name"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uuexpand","desc":"expands a file into a run of `0' and `1' characters, one per bit -- despite the shared prefix, unrelated to uuencode -- so it survives a copy between machines with different byte or character sizes; `uuexpand -u' (or `uuunexpand') reverses it","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":17590,"hassrc":true,"howto":"Expands a file into a string of 0s and 1s, one character per bit; despite the name it is unrelated to uuencode or uudecode. `uuexpand -u' (or `uuunexpand') reverses it. The -8/-16/-7 options choose the assumed character width, for portability across machines.","help":{"cmd":"uuexpand -?","text":"Usage: uuexpand [opts]\n   or: uuunexpand [opts]\n\nWhere [opts] can be:\n\n\t-16  \tEnsure 16-bit portability\n\t-8   \tEnsure 8-bit portability (the default)\n\t-7   \tEnsure 7-bit portability\n\t-?     \tList the starting options (this information)\n\t-h     \tIdentical in functionality to '-?'\n\t-A   \tUse the ASCII character set for expanded output\n\t-E     \tUse the EBCDIC character set for expanded output\n\t-d   \tEnable debugging output (to stderr)\n\t-e   \tExpand output (same as invoking 'uuexpand')\n\t-u     \tUnExpand output (same as invoking 'uuunexpand')\n\t-v   \tEnable verbose output (to stderr)\n\t-w N   \tSet expanded line output width to 'N' representational elements\n\t     \tper line (default is 8 per 8-bit represented line)"},"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uulog","desc":"show the transfer log","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/UUCP","size":7736,"star":true,"hassrc":true,"help":{"cmd":"uulog -?","text":"uulog: examine uucp or fileserver log files\n\nUsage: uulog [-s\u003csysname> -u\u003cusername> -d\u003cdays>] [-f]\n\nOpts:  -s\u003csysname>   -show work to/from the remote \u003csysname>\n       -u\u003cusername>  -show work to/from the user \u003cusername>\n       -d\u003cdays>      -show log file for \u003cdays> days ago.  Default is show\n                        today's log file\n       -f            -show fileserver logs, default is UUCP logs\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"UUCP"},{"name":"uuname","desc":"list the sites you can reach","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/Systems","missing":false,"dir":false,"bytes":3605}],"dir":"CMDS/UUCP","size":6320,"star":true,"hassrc":true,"help":{"cmd":"uuname -?","text":"uuname --show local machine name or those of UUCP sites we talk to\nUsage:  uuname [-l]\n\n           -l   show name of this machine"},"cat":"Communications","sub":"UUCP"},{"name":"uupoll","desc":"poll a site for waiting work.  It works silently: `uupoll nowhere' leaves /dd/SPOOL/uucp/nowhere/C.nowhereAPOLL, and the grade letter from -g goes into the name (`-gZ' -> ...ZPOLL)","needs":[{"path":"/DD/USR/LIB/UUCP/Config","missing":false,"dir":false,"bytes":1473},{"path":"/DD/SPOOL/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SPOOL/UUCPPUBLIC","missing":false,"dir":true,"bytes":null},{"path":"/DD/SPOOL/MAIL","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/.LOCKS/MAIL.LOCKS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/LIB/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":7244,"star":true,"howto":"Polls a UUCP site for waiting work, and it does the job in SILENCE -- which is why it reads as broken. `uupoll \u003csite>' leaves /dd/SPOOL/uucp/\u003csite>/C.\u003csite>APOLL; the grade letter from -g goes into the name, so `-gZ' gives ...ZPOLL. Blars uucp; wants the `uucp' user, which SYS/password has.","help":{"cmd":"uupoll -?","text":"Usage: uupoll [-g\u003cgrade>] system"},"cat":"Communications","sub":"Mail"},{"name":"uux","desc":"run a command on another UUCP site","needs":[{"path":"/DD/USR/LIB/UUCP/Config","missing":false,"dir":false,"bytes":1473},{"path":"/DD/SPOOL/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SPOOL/UUCPPUBLIC","missing":false,"dir":true,"bytes":null},{"path":"/DD/SPOOL/MAIL","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/.LOCKS/MAIL.LOCKS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/LIB/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/password","missing":false,"dir":false,"bytes":226},{"path":"/DD/SYS/Password","missing":false,"dir":false,"bytes":226}],"dir":"CMDS/UUCP","size":11536,"star":true,"howto":"Runs a command on another UUCP site. This is BLARS uucp, which reads USR/LIB/UUCP/Config -- a different configuration from UUCPbb's SYS/UUCP. Both ship.","help":{"cmd":"uux -?","text":"Syntax: uux [\u003copts>] \u003chost>!\u003cprog> [\u003cargs>]\nFunction: UUCP Executive\nOptions:\n     -a=\u003cuser name>      user requesting the service\n     -b                  binary file transfer (default ascii)\n     -g\u003cgrade>           specify grade\n     -r                  queue request\n     -d,-x=\u003clevel>       debug level\n     -z                  input from standard input"},"cat":"Communications","sub":"Mail"},{"name":"uuxqt","desc":"run the jobs a remote site queued here.  It looks for a module called `procs' to see whether it is already running, so it wants a `procs' loaded (error 221 without one).","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/UUCP","size":14418,"star":true,"hassrc":true,"help":{"note":"it takes no options; se,"bytes":null},{"path":"/DD/SYS/TEX/MFBASES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFBASES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/MFINPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/POOLS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/POOLS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FORMATS","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/FORMATS","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/INPUTS","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/TEX/SAMPLES","missing":false,"dir":true,"bytes":null},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/INPUTS","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/SAMPLES","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null},{"path":"/DD/USR/TEX/FONTS/VF","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/TEXCMDS","size":288860,"howto":"The real TeX engine, and the one to use -- see `tex'. It wants the format first: `virtex '&plain' file.tex' or `virtex '&lplain' file.tex'. The formats that ship are plain, lplain and splain, in SYS/TEX/FORMATS.","help":{"note":"it takes the format, `&plain', and then the file; a flag is read as a file name"},"cat":"Text tools","sub":"TeX"},{"name":"vis","desc":"run a command over and over and refresh the screen with its output -- what `watch' does on other systems: `vis {opts} \u003ccommand> \u003cargs>'.  Not the Unix `vis' that makes non-printing characters visible","src":"vis","origin":"usenet archive","archive":"vis.ar   [also built from v_misc]","needs":[{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":24814,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"vis -?","text":"vis: illegal option -- ?\nsyntax: vis {opt} \u003ccommand> \u003cargs>\nfunction: repeatedly execute command, refreshing screen with its output\noptions:\n\t-d=\u003cdelay> loop delay period, in seconds (default 2)\n\t-f         force continuation if \u003ccommand> returns error\n\t-h         don't print header (use all lines for screen)\n\t-s         show changes highlighted"},"cat":"System & modules","sub":"Processes & memory"},{"name":"vlen","desc":"a variable-length record demonstration: it ignores whatever you give it, creates a filesystem of its own, adds a hundred records of varying length and prints the minimum, the maximum and the mapper entries as it goes. `isam' is the other demonstration of its kind here. It leaves its store behind in the data directory as `test.mp' and `test.st' -- run it twice and the second run answers `Filesystem already exists.' and adds nothing. Delete those two to run it again","dir":"CMDS","size":9318,"star":true,"howto":"It leaves its store behind, in the DATA directory, as `test.mp' and `test.st'. Run it twice and the second run says `Filesystem already exists.' and adds nothing; delete those two to run it again.","help":{"note":"it takes no options and ignores any given"},"cat":"System & modules","sub":"Utilities"},{"name":"vmod_trap","desc":"the VMod_trap trap handler that rxmod and txmod call. A type-$0B trap module, not a program: `load /dd/CMDS/COMMS/vmod_trap' before running them. It runs in supervisor state, so once installed it faults on this kernel","dir":"CMDS/COMMS","size":202,"help":{"note":"a trap-handler module, not a program: `load' it before rxmod and txmod"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"vptovf","desc":"virtual property list to virtual font","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false,"dir":true,"
