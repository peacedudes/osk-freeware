till unused are along the top. Control-C gets you out. Its word list is GAMES/dict.","cat":"Games","sub":"Word & guessing"},{"name":"hc","desc":"shift text to a column, or label every line.  `hc +8 f' indents f so the text starts at column 8; `hc -11 f' strips leading columns so it starts at column 11; `hc -l \"> \" f' puts that string in front of every line.  With no option it copies the file through.  It evaluates nothing -- for arithmetic see `bc' and `dc'","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":17432,"hassrc":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"head","desc":"First lines of a file -- `head -n 20 file'.  These GNU builds want -n 20, not -20","dir":"CMDS","size":25874,"usage":"Usage: head [-b #] [-c #] [-n #] [-qv] [+blocks=#] [+bytes=#] [+lines=#]","howto":"First lines of a file. This GNU build wants `head -n 20 file' -- the older `head -20' form is rejected as an unrecognized option. Needs cio.","cat":"Text tools","sub":"Transform & filter"},{"name":"help","desc":"help system","src":"eff_help","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/HELP","needs":[{"path":"/dd/SYS/HELP","missing":false}],"info":{"version":"1.0 Ed#3","purpose":"Extended on-line help for OS-9/68k","status":"first released version, final","language":"C","author":"Lukas Zeller","availability":"Public domain","conditions":"1. This Program may only be used for peaceful applications. I do NOT ALLOW using this program for anything that has to do with development, testing or manufacturing of weapons of any type. 2. This text as well as all copyright messages (in this file as well as in the source texts and the code files) must be retained. 3. When distributing this program, source code may or may not be included, but th","copyright":"HELP and HELPINDEX (c) 1989 by Lukas Zeller, CH-Maennedorf"},"dir":"CMDS","size":27726,"usage":"Syntax:   help [\u003copts>] [\u003ctopic> {\u003csubtopic>}] [\u003copts>]\nFunction: Provides help information.","docs":true,"hassrc":true,"cat":"Documentation","sub":"Help & pagers"},{"name":"helpindex","desc":"builds the .ndx index a .hlp help file needs: `helpindex dinfo.hlp' writes dinfo.ndx beside it","src":"eff_help","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/HELP","dir":"CMDS","size":4094,"usage":"Syntax:   helpindex [\u003copts>] {\u003chelp file>} [\u003copts>]\nFunction: Creates index file for specified help files\n   Without the -a option, only files with names ending\n   in \".hlp\" and \".hlib\" will be processed. The index\n   file name will have the \".hlp\"/\".hlib\" replaced by\n   \".ndx\".\nOptions:  -a  : Process all files with no name restrictions.","star":true,"hassrc":true,"howto":"`helpindex dinfo.hlp' writes dinfo.ndx beside it. Only names ending .hlp or .hlib are accepted unless -a is given; with no name it asks for one.","cat":"Documentation","sub":"Help & pagers"},{"name":"hexbin","desc":"Decode BinHex back to a Macintosh file","dir":"CMDS","size":44082,"usage":"Usage: hexbin [-hexbin] [filenames]","docs":true,"howto":"Decodes Macintosh BinHex (.hqx) files, which is how Mac software travelled by mail and BBS. binhex goes the other way; unsit opens StuffIt archives and macunpack opens PackIt ones. All trap-free. DOC/macutils has the package readme.","cat":"Encoding & conversion","sub":"Macintosh"},{"name":"hexed","desc":"a hex editor made of your text editor: it writes the file out as a hex dump, opens that in the editor `-e=' names (default vi), and writes the file back when you leave. `-t=\u003cdir>' says where the dump goes; without it, /r0 [no military use -- EFFO-INFO]","src":"eff_hexed","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/HEXED","info":{"version":"1.0","purpose":"hex-editor using standard texteditor","status":"final","hardware":"no hardware dependency","language":"C","author":"Helmut Hoheisel-Zimmermann, D-2300 Kiel 14","availability":"public","conditions":"no military use","copyright":"by H. Hoheisel-Zimmermann"},"dir":"CMDS","size":23780,"usage":"Syntax: hexed [\u003copts>] \u003cpath> {[\u003copts>] | [\u003cpath>]}\nFunction: dump, edit and retransform file(s) with binary data\nOptions:","docs":true,"hassrc":true,"military":true,"howto":"`hexed -t=\u003cdir> -e=\u003ceditor> \u003cfile>': the file goes out as a hex dump into \u003cdir>, the editor opens it, and leaving the editor writes the file back. Without -t it uses /r0.","cat":"Editors","sub":"Binary & hex"},{"name":"hexedit","desc":"HEXPERT V2.4 by Dominic Alston -- `hexedit \u003cfile>'.  It reads TERMCAP as the capability string itself, not as the name of a file, so source `. /dd/SYS/termcap.entry' first and it draws its viewer; without that it prints the terminal type and exits.  gnuchess wants the same.  Its -d option is separately broken -- `file not accessible' (214) for a file that is readable.  `beav' is the binary editor that needs nothing, and `hexed' the one that would work if there were a RAM disk.","needs":[{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":66726,"usage":"Usage: hex [-vdr] 'file'","docs":true,"howto":"`hexedit \u003cfile>'. Put the termcap entry in TERMCAP first (`. /dd/SYS/termcap.entry') or it will not draw.","cat":"Editors","sub":"Binary & hex"},{"name":"hinterhalt","desc":"a small game (EFFO forum 7)","src":"forum7","origin":"Microware OS-9 archive","archive":"forum7.lzh","needs":[{"path":"/dd/sys/","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":10140,"star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"hipstopgm","desc":"HIPS to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45260,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"hist","desc":"a command-line editor with history, in front of the shell  [no military use -- EFFO-INFO]","src":"hist","origin":"EFFO forum","archive":"disk 14 SOFTWARE/C/HIST (H. Hoheisel-Zimmermann, Kiel)","info":{"version":"1.0","purpose":"C-shell-like history, commandline editing","status":"final","hardware":"ready to go for Steinmann & Frei's emulation of Wyse-50 terminal on mc68000; may be recompiled for original terminal driver of mc68000 with 2. makefile; may be adapted for any other system and terminal by editing the include files 'h_def.h' and 'h_edidef.h'.","language":"C","author":"Helmut Hoheisel-Zimmermann, D-2300 Kiel 14","availability":"public","conditions":"no military use","copyright":"by H. Hoheisel","restrictions":"chd (chx) using wildcards doesn't work"},"dir":"CMDS","size":27030,"docs":true,"hassrc":true,"military":true,"howto":"A command-line editor with history in front of the shell. On this console it prints a row of asterisks and returns at once.","cat":"Shells","sub":"Shell helpers"},{"name":"hotel","desc":"hotel -- two-player board game, played by coordinates","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":50808,"star":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; q, Q, control-D and ESC do not. If it has a quit command of its own, its documentation in DOC/ will say.","cat":"Games","sub":"Other games"},{"name":"hpcdtoppm","desc":"PhotoCD to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":59106,"usage":"Usage: hpcdtoppm [options] pcd-file [ppm-file]\n-x Overskip mode (tries to improve color quality.)\n-i Give some (buggy) informations from fileheader\n-s Apply simple sharpness-operator on the Luma-channel\n-d Show differential picture only\n-r Rotate clockwise for portraits\n-l Rotate counter-clockwise for portraits\n-a Try to find out orientation automatically.\n  (Experimentally, please report if it doesn't work.)\n-ycc suppress ycc to rgb conversion\n  (Experimentally, doesn't have deeper sense)","hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"i_am_i","desc":"prints its own source (Pascal)","dir":"CMDS","size":5206,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"icontopbm","desc":"Sun icon to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":46786,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"if","desc":"conditional execution for a shell script: `if def \u003cvar>', `if loaded \u003cmodule>' or `if varval \u003cvar> \u003cvalue>', the commands, `else', `endif'.  It hands the branch to Microware's `shell' to run","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":17032,"usage":"Syntax: if [not] \u003ccond> {\u003carg>} {\u003ccmd1>} [else","hassrc":true,"howto":"Ask for it by path, /dd/CMDS/if -- bash has an if of its own. It hands the chosen branch to Microware's `shell' to run.","cat":"Shells","sub":"Shell helpers"},{"name":"ifdef","desc":"resolve #ifdefs in C source","src":"ifdef","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C -- see DOC/EFFO-INFO","info":{"purpose":"Remove unwanted ifdefs from C source code","status":"final","language":"C","author":"Warren Toomey","availability":"Public"},"dir":"CMDS","size":17234,"usage":"Syntax: ifdef [\u003copts>] [\u003cfile>] [\u003copts>]","docs":true,"hassrc":true,"cat":"Developer tools","sub":"Source formatting"},{"name":"ilbmtoppm","desc":"IFF/ILBM to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":57042,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"imgtoppm","desc":"AT&T Image-8 to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":51686,"hassrc":true,"howto":"Reads the Img Software Set (AT&T Image-8) format; gemtopbm reads GEM IMG. Feed it an Image-8 file.","cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"indent","desc":"reformat a C source program for readability","src":"indent","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C/INDENT (source unpacked from indent_src.lzh)","needs":[{"path":"/dd/SYS/","missing":false}],"info":{"purpose":"reformat a C source program","status":"final","language":"C","author":"University of California,  Berkeley University of Illinois, Urbana Sun Microsystems, Inc.","availability":"Public"},"dir":"CMDS","size":40732,"usage":"Syntax: indent [\u003copts>] [\u003cinpath> [\u003coutpath>]] [\u003copts>]","docs":true,"hassrc":true,"cat":"Developer tools","sub":"Source formatting"},{"name":"inetd","desc":"the internet daemon: it listens on a port and hands the connection to `wn'.  It opens `/socket', so it needs a TCP/IP stack presenting that device; without one it gets as far as `tcp protocol unknown'.  `inetd' alone prints its usage","dir":"CMDS/WN","size":7306,"usage":"Usage: inetd \u003cport> \u003cprog> {\u003cprog-options>}","star":true,"howto":"The listener that hands incoming connections to wn. Needs a network.","cat":"Communications","sub":"Web server"},{"name":"inetdc","desc":"what inetd forks for each connection.  1626 bytes with no message strings; inetd runs it, not you","dir":"CMDS/WN","size":1626,"star":true,"cat":"Communications","sub":"Web server"},{"name":"infocom","desc":"Infocom Z-MACHINE interpreter -- a third, unrelated adventure system.  Plays the .z3 files in GAMES/INFORM (dejavu, hellow, shell -- Inform demos, not the Infocom games).","dir":"CMDS","size":42416,"usage":"Usage: infocom [-aehlnoprstvx] \u003cfilename>","howto":"A Z-machine. Plays the .z3 files in /dd/GAMES/INFORM -- the Inform demos dejavu, hellow and shell.","cat":"Games","sub":"Adventure & fiction"},{"name":"infocom.tcap","desc":"Infocom interpreter, TERMCAP build -- and it is the one to use at a terminal.  It puts a proper status line at the top of the screen (`Y2 Rock Room     Score: 0/2') where plain `infocom' writes the cursor codes for that line as literal text down the left margin","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":46296,"usage":"Usage: infocom.tcap [-aehlnoprstvx] \u003cfilename>","howto":"The termcap build of the Z-machine, and the one to use at a terminal: `infocom.tcap /dd/GAMES/INFORM/dejavu.z3' keeps a status line (room and score) across the top. Three Inform story files ship in GAMES/INFORM: dejavu, hellow, shell.","cat":"Games","sub":"Adventure & fiction"},{"name":"infoxpress","desc":"InfoXpress client","needs":[{"path":"/DD/IX","missing":true}],"dir":"CMDS/NETWORK","size":8058,"hassrc":true,"cat":"Communications","sub":"TCP/IP"},{"name":"inimf","desc":"MetaFont with no base preloaded","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":340688,"howto":"It builds a Metafont base, which SYS/TEX/MFBASES now ships. To rebuild: `echo \"plain; \\input modes; dump\" > mf.in' then `ksh -c \"cd /dd/tmp; inimf \u003c mf.in\"'. About a minute. DOC/README-METAFONT has the rest.","cat":"Text tools","sub":"TeX"},{"name":"initex","desc":"TeX with no format preloaded, for building .fmt files","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":314256,"howto":"TeX with no format preloaded -- this is what BUILDS the .fmt files. `initex \"plain \\dump\"'. The three formats already ship in SYS/TEX/FORMATS, built this way, so you only need this to make your own.","cat":"Text tools","sub":"TeX"},{"name":"initvdu","desc":"init video display","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":6808,"usage":"Syntax  : initvdu [\u003copts>]\nFunction: initialise the login VDU from termcap\nOptions :\n-d   debug (no initialisation)\n-r   reset the vdu ('rs' capability)\n-a=xx   use the xx capability\n   default is initialise ('is' capability)","star":true,"docs":true,"howto":"It sets up specific VDU hardware. On a terminal it is not defined for, it answers \"is not defined for this terminal\".","cat":"Communications","sub":"Terminal & session"},{"name":"input","desc":"UNAXCESS BBS - input helper","src":"effo_unaxcess","origin":"usenet archive","archive":"effo_unaxcess.ar","dir":"CMDS","size":5616,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"isam","desc":"indexed-sequential file demonstration","dir":"CMDS","size":28768,"star":true,"cat":"System & modules","sub":"Utilities"},{"name":"ispell","desc":"interactive spelling checker","src":"ispell","origin":"hc disk","archive":"SOURCES/USENET/ISPELL/","needs":[{"path":"/dd/tmp/spellXXXXXX","missing":true},{"path":"/dd/LIB","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":34502,"docs":true,"hassrc":true,"howto":"Interactive spelling checker. Takes a file: `ispell \u003cfile>'. `ispell -a' is the pipe interface programs use.","cat":"Text tools","sub":"Spelling & words"},{"name":"japan","desc":"the weather program on its north-Pacific profile, with the months of the Japanese calendar; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10738,"star":true,"hassrc":true,"howto":"A weather simulator on the Japanese calendar -- see `england'.","cat":"Amusements","sub":"Simulated weather"},{"name":"jargon","desc":"Jargon-file browser (needs its database files)","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/vh","missing":false}],"dir":"CMDS","size":64554,"usage":"usage: jargon [-cigmr] [-b key] [srcname] [indexname]","docs":true,"howto":"A browser for the Jargon File, which is here: VH/jargon.txt, version 3.0.0 of 27 July 1993, with its index. It will not read SYS/termcap -- do `. /dd/SYS/termcap.entry' first, then `jargon -m'.","cat":"Text tools","sub":"Spelling & words"},{"name":"join","desc":"GNU join -- relational join of two sorted files","dir":"CMDS","size":35400,"usage":"Usage: join [-a 1|2] [-v 1|2] [-e empty-string] [-o field-list...] [-t char]","docs":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"k","desc":"Kermit transfer (Tim Kientzle)","dir":"CMDS/COMMS","size":61600,"cat":"Communications","sub":"Terminal & transfer"},{"name":"keep","desc":"take a program off this disk onto your own disk -- copies it and whatever DOC/DEPENDS says it needs, and records every file written.  `keep -n' shows what it would do without doing it.  See DOC/README-KEEP.","needs":[{"path":"/dd/SYS/kept","missing":true},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":25218,"usage":"Usage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...","hassrc":true,"cat":"System & modules","sub":"Keeping and dropping"},{"name":"kept","desc":"list what has been taken, and how much it came to","needs":[{"path":"/dd/SYS/kept","missing":true},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":24846,"usage":"Usage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...","cat":"System & modules","sub":"Keeping and dropping"},{"name":"kermit","desc":"OS-9 Kermit Version 1 Release 5 -- serial file transfer and terminal emulation.  `ckermit' is the C-Kermit, and REBUILT/kermit_cio is our build of this one.  Run with no cio present it starts and prints its banner; it is REBUILT/kermit_cio that wants the module","src":"kermit","origin":"usenet archive","archive":"kermit.ar","dir":"CMDS","size":26828,"usage":"Usage: kermit c[le line esc.char]   (connect mode)","docs":true,"hassrc":true,"cat":"Communications","sub":"Kermit"},{"name":"kermit2","desc":"Kermit Program Version 1 Release 6 -- the same command letters as `kermit', 5K smaller.  DOC/README-KERMIT compares all six","dir":"CMDS","size":21998,"usage":"Usage:   kermit c[le line esc.char]   (connect mode)","docs":true,"cat":"Communications","sub":"Kermit"},{"name":"kermit3","desc":"Kermit68K version 1.0.00, 01 July 1987 -- a DIFFERENT program from the other small ones: it puts up its own `Kermit68K>' prompt and reads a Kermit.ini, rather than taking command letters.","dir":"CMDS","size":18148,"usage":"Usage: kermit [-x arg [-x arg]...[-yyy]...]]","docs":true,"cat":"Communications","sub":"Kermit"},{"name":"kermit_cio","desc":"a source build that links cio; CMDS/kermit is the archive binary and needs none","dir":"CMDS/REBUILT","size":13294,"usage":"Usage: kermit c[le line esc.char]   (connect mode)","star":true,"cat":"Communications","sub":"Kermit"},{"name":"keydrv.mm1","desc":"keyboard driver","dir":"CMDS/MM1","size":1474,"cat":"System & modules","sub":"MM/1 drivers"},{"name":"ksh","desc":"Korn shell.  `ksh -c '\u003ccommands>'` works completely.  Its INTERACTIVE loop depends on the EMULATOR: it reads the command line with read(fd,buf,256), and needs the emulator's I$Read to return at the end-of-record character rather than only when the full count arrives, or no typed command reaches it.  Given that, ksh is a full shell -- prompt, for loops, variables, forking.  DOC/README-KSH","needs":[{"path":"/dd/SYS/profile.ksh","missing":false},{"path":"/dd/SYS","missing":false},{"path":"/h0/SYS","missing":false},{"path":"/dd/CMDS","missing":false}],"dir":"CMDS","size":118554,"usage":"Syntax: 'setpr \u003cprior>' or 'setpr \u003cpid> [\u003cpid>..] \u003cprior>'","star":true,"docs":true,"cat":"Shells","sub":"Shells"},{"name":"l","desc":"list a TEXT FILE with word wrap and a carriage return at the end of every line -- `l -\u003cwidth> \u003cfile>', 79 columns by default.  Written for Stylo documents and other long-line files.  It takes files, not directories","src":"cowen_tools","origin":"Microware OS-9 archive","archive":"cowen_tools.lzh","dir":"CMDS","size":4168,"usage":"Usage: l [-options] [file] [file] [-options]\n-no  = width (default 79, max 256)","star":true,"docs":true,"hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"lander","desc":"lunar lander -- space starts a game, a digit sets the power, x or k is vertical thrust, z/j and c/l the side retros.  Its score file is GAMES/lander.hs, looked for under /h0, so mount the disk there as well","src":"lander","origin":"usenet archive","archive":"lander.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":47366,"docs":true,"hassrc":true,"howto":"Full-screen. Space starts a descent, a digit sets the engine power, `x' or `k' fires the main thruster and z/j and c/l the side retros. `q' quits.","cat":"Games","sub":"Arcade & action"},{"name":"larn","desc":"larn -- dungeon crawl; see the PLAYGROUND note above","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/h0/GAMES/larn/PLAYGROUND/","missing":false}],"dir":"CMDS/GAMES","size":128834,"star":true,"howto":"Full-screen dungeon crawl. RETURN gets past the opening text. Control-C gets you out; its playground is GAMES/LARN/PLAYGROUND.","cat":"Games","sub":"Dungeon crawl"},{"name":"latex","desc":"LaTeX -- Lamport's document preparation system on top of TeX","dir":"CMDS/TEXCMDS","size":3164,"howto":"See `tex'. The wrapper cannot reach the engine; run `virtex '&lplain' yourfile.tex'. That does work: SAMPLES/small.tex gives \"Output written on small.dvi (1 page, 1704 bytes)\". The .dvi and .log land in your DATA directory.","cat":"Text tools","sub":"TeX"},{"name":"launch","desc":"M.C.Gregorie's login helper: reads /dd/SYS/config, sets the environment for your terminal type -- and optionally a default PATH and emacs bindings -- then starts the shell you name on its command line.  It does not put anything in the background","needs":[{"path":"/dd/sys/config.","missing":true},{"path":"/dd/sys","missing":false},{"path":"/dd/sys/config","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":8986,"usage":"Syntax  : launch \u003copts> \u003cshell> [shellargs...]\nFunction: Set up login environmental factors dependant","star":true,"docs":true,"howto":"Says \"nothing to launch\" until it is configured -- see its documentation.","cat":"System & modules","sub":"Processes & memory"},{"name":"lcasep","desc":"lower-case a name for mail","dir":"CMDS/UUCP","size":7074,"usage":"usage: lcasep [-f file] [-o outfile]","star":true,"cat":"Communications","sub":"Mail"},{"name":"less","desc":"Pager (wants a real TERM).  Its help screen works now: SYS/less.hlp is on the disk","needs":[{"path":"/dd/sys/less.hlp","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":85580,"docs":true,"hassrc":true,"cat":"Documentation","sub":"Help & pagers"},{"name":"lessecho","desc":"prints its arguments back quoted for a shell -- the helper less uses to hand file names on","dir":"CMDS","size":3176,"usage":"usage: lessecho [-ox] [-cx] [-pn] [-dn] [-a] file ...","star":true,"cat":"Documentation","sub":"Help & pagers"},{"name":"lesskey","desc":"turns a key-binding file into the binary less reads: a `#command' section, then one key and one command per line","dir":"CMDS","size":23722,"usage":"usage: lesskey [-o output] [input]","docs":true,"cat":"Documentation","sub":"Help & pagers"},{"name":"lfmaker","desc":"make a G-Windows launch file -- and it asks the allocator for an ADDRESS as if it were a length, so the request is refused: `2470464192-byte request refused, 32682944 bytes free'.  The number MOVES with the environment, which is what identifies it as an address.  It happens only once the module is already resident: run it bare first, then with an argument.","dir":"CMDS","size":118014,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"lgrep","desc":"list the files a pattern appears in -- its banner says \"same as 'grep -l', but prints filenames without comments\". `grep -l' does the same job here.  DOC/README-GREP compares the six searchers","dir":"CMDS","size":2446,"usage":"Syntax: lgrep \u003carg1> ... \u003cargn>\nFunction: same as 'lgrep lgrep', but prints filenames without comments\nOptions: same as with 'lgrep'","star":true,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"lha","desc":"LHa 2.08 -- create/extract .lzh archives","dir":"CMDS","size":65560,"usage":"Syntax: LHa -{axelvudmcp}[qvnfodiszrgc012][w=\u003cdir>] archive_file [file...]\nFunction: Archive Management Utility\nCommands:   Options:","docs":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"lharc","desc":"LHarc archiver","dir":"CMDS","size":55816,"usage":"Usage: lharc {axevlufdmctp}[qnftv] archive_file [files or directories...]","docs":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"lharcs","desc":"C-LHarc 1.01, older than CMDS/lha 2.08","dir":"CMDS/REBUILT","size":51966,"usage":"Usage: lharcs {axevlufdmctp}[qnftv] archive_file [files or directories...]","cat":"Archives & compression","sub":"Alternates"},{"name":"liborder","desc":"order the modules in an OS-9 library -- give it one. On /dd/LIB/alib.l and the other libraries here it works. Handed a plain file instead it reads a length from what it takes to be a ROF header and asks for that many bytes, which floods `No more memory !!!'.","src":"eff_libutils","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/LIBUTILS","dir":"CMDS","size":7538,"usage":"Usage: liborder \u003coptions> file1.r file2.r ...","star":true,"docs":true,"hassrc":true,"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"liborder.os9","desc":"report the order of modules in a library","dir":"CMDS","size":20850,"usage":"Usage: liborder \u003coptions> file1.r file2.r ...","cat":"System & modules","sub":"Utilities"},{"name":"Libr2Ascii","desc":"Home Librarian: dump a catalogue to plain text","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":129614,"usage":"Syntax: Libr2Ascii [opts]","hassrc":true,"howto":"`-infile cat.libr' with a space. It writes the catalogue to standard output as text, and a page count and four index-key counts at the end -- all zero means the catalogue is empty.","cat":"Files & directories","sub":"Home Librarian"},{"name":"Librarian","desc":"Home Librarian: search a catalogue.  SIX PROGRAMS AND THEIR DOCS TRAVEL TOGETHER -- its licence requires it","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":161092,"usage":"Syntax: Librarian [opts]","hassrc":true,"howto":"One of six Home Librarian programs that must stay together -- its licence says so. Start here to search a catalogue; EditLibr edits one, Ascii2Libr builds one from text, Libr2Ascii dumps it back, PrintCards and PrintLabels print it. Manual in DOC/homelibr.","cat":"Files & directories","sub":"Home Librarian"},{"name":"libsplit","desc":"Split a linker library into its component modules","dir":"CMDS","size":39248,"usage":"Syntax   : [\u003copts>] {\u003clibrary>} [\u003copts>]\nFunction : Splits a new Type Library into ROF files.\n   Each psect is written to a ROF file.\nOptions  : -@  turn on Debug output\n   -r  overwrite an existing ROF file","cat":"Developer tools","sub":"Libraries"},{"name":"life","desc":"Conway's Game of Life","src":"life","origin":"hc disk","archive":"SOURCES/USENET/life.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":33246,"usage":"usage: life [init-file]","docs":true,"hassrc":true,"howto":"life [init-file]. The patterns are in /dd/GAMES/LIFE -- try `life /dd/GAMES/LIFE/glider`. It also wants more memory than the default; from the OS-9 shell that is `life #22k \u003cfile>`, and bash has no #size syntax at all.","cat":"Screen toys","sub":"Screen toys"},{"name":"lispmtopgm","desc":"Lisp machine to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":44270,"hassrc":true,"howto":"This build handles at most 16 grey levels and says \"depth is too large\" otherwise. Run the image through `pnmdepth 15' before pgmtolispm.","cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"lissaj","desc":"Tektronix demo: Lissajous figures","dir":"CMDS/GAMES","size":8126,"star":true,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"listalias","desc":"list the aliases you have, once newalias has compiled them: `home  os9-freeware (This Collection)'.  Its -s and -u forms pipe through `egrep'; the plain form needs nothing extra","needs":[{"path":"/dd/USR/LIB/ELM/aliases","missing":true},{"path":"/dd/nlslib/","missing":true},{"path":"/dd/SYS/domain","missing":true},{"path":"/dd/TMP","missing":false},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true}],"dir":"CMDS/ELM","size":26082,"usage":"Usage: listalias [ -s | -u ] \u003coptional-regular-expression>","star":true,"cat":"Communications","sub":"Mail"},{"name":"lmail","desc":"local mail delivery.  Its usage line answers; giving it a real recipient does not return here -- it hangs, and only the session's own end brings it down","src":"uucp","origin":"Microware OS-9 archive","archive":"uucp.lzh","needs":[{"path":"/DD/TMP/lmail.tmpXXXXXX","missing":true},{"path":"/DD/USR/LIB/UUCP/Config","missing":false},{"path":"/DD/SPOOL/UUCP","missing":false},{"path":"/DD/SPOOL/UUCPPUBLIC","missing":false},{"path":"/DD/SPOOL/MAIL","missing":false},{"path":"/DD/SYS/.LOCKS/MAIL.LOCKS","missing":true},{"path":"/DD/USR/LIB/ file from data directory\n-l   print pathlist of file loaded\n-z   get list of module names from standard input","hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"loadmem","desc":"load memory image","dir":"CMDS","size":472,"usage":"Syntax   : LOADMEM \u003cdestinati address> \u003cupper limit address> \u003cpath>\nFunction : loads file into memory at specified address","cat":"Graphics & images","sub":"Drawing & display"},{"name":"loan","desc":"amortisation calculator: principal, term, rate and start month in, the payment and a month-by-month schedule out","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":3558,"star":true,"hassrc":true,"cat":"Maths & calculators","sub":"Calculators"},{"name":"logisim","desc":"logic circuit simulator -- draws a pulse diagram from a circuit written as text.  Two sample circuits ship with it, DOC/logisim/flipflop.lsi and counter.lsi, and its notes are DOC/logisim/logisim.doc, in German.  It needs `PORT' set to a terminal path -- it reopens the keyboard through it, so `setenv PORT /term' first.  Past that it floods `No more memory !!!'.","src":"eff_logisim","origin":"EFFO forum","archive":"disk 14  SOFTWARE/C/LOGISIM","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"info":{"purpose":"Simulation of logical circuits","status":"experimental","language":"C","author":"Hubert Nehring","availability":"Public"},"dir":"CMDS","size":23646,"usage":"Syntax: logisim [opts] filename [opts]\nFunction: Simulates logical circuit described by filename\nOptions:\n-i  shows instable states","docs":true,"hassrc":true,"howto":"Set PORT first: `setenv PORT /term'. Without it, `logisim: Environment variable PORT not defined' -- it reopens the keyboard through that path. Two sample circuits ship in DOC/logisim (counter.lsi, flipflop.lsi) and its notes are there too, in German.","cat":"Maths & calculators","sub":"Simulators"},{"name":"logname","desc":"Print your login name (GNU)","needs":[{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":16220,"usage":"Usage: logname [OPTION]...\n--help   display this help and exit\n--version   output version information and exit","star":true,"cat":"Shells","sub":"Shell utilities"},{"name":"lorenz3d","desc":"Tektronix demo: the Lorenz attractor in 3D","src":"tekdemos","origin":"Microware OS-9 archive","archive":"TekDemos.t.Z","dir":"CMDS/GAMES","size":5926,"star":true,"hassrc":true,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"lout","desc":"Lout 2.05 document formatter (Basser Lout, Jeffrey Kingston)","needs":[{"path":"/h0/LOUT2/LIB/font","missing":true},{"path":"/h0/LOUT2/LIB/evec","missing":true},{"path":"/h0/LOUT2/LIB/data","missing":true},{"path":"/h0/LOUT2/LIB/include","missing":true}],"dir":"CMDS","size":561302,"usage":"usage: -o\u003cfilename>","docs":true,"hassrc":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"lp","desc":"line printer spooler - submit a job","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":6580,"usage":"Syntax: lp [\u003copts>] {\u003cpath>}\nOptions:\n -z   get file names from standard input\n -w   message on terminal when ready\n -m   mail to user when ready\n -n=xx  make xx copies (default 1)\n -d=ptr output on device ptr\n -s   silentmode","star":true,"docs":true,"hassrc":true,"cat":"Printing","sub":"Spooling"},{"name":"lpq","desc":"shows the spooler queue.  It looks for a DATA MODULE called `spoolqueue' in memory; with a spooler running it reports the queue, and without one answers `no spooler installed'.  Same for `prjob' and `lp'.","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":5938,"usage":"Syntax: lpq [-p=dev] [user]\nFunction: shows spoolerqueue\nOptions:\n -d=dev   shows queue of printer dev","star":true,"hassrc":true,"cat":"Printing","sub":"Spooling"},{"name":"lprm","desc":"remove a job from the print queue","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":4908,"usage":"Syntax: lprm [-d=dev] [-] job..\nFunction: delete job from spoolerqueue\nOptions:","star":true,"hassrc":true,"cat":"Printing","sub":"Spooling"},{"name":"lpsched","desc":"the line-printer scheduler","needs":[{"path":"/dd/SYS/password","missing":false},{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":6738,"usage":"Syntax: lpsched [-r] {\u003cdevname>}\nFunction:  starts Printerspooler\nOptions:\n -r   restarts spooler","star":true,"cat":"Printing","sub":"Spooling"},{"name":"lpshut","desc":"shut down the printer scheduler","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":4106,"usage":"Syntax: lpshut\nFunction:  stops Printerspooler","star":true,"hassrc":true,"cat":"Printing","sub":"Spooling"},{"name":"ls","desc":"GNU ls (fileutils 3.13) -- a real stat(), columns, and `-al'","dir":"CMDS","size":46916,"usage":"Usage: ls [OPTION]... [FILE]...","hassrc":true,"cat":"Files & directories","sub":"List & navigate"},{"name":"lua","desc":"Lua 3.0, a small scripting language -- and it RUNS, once it has a `csl' of the edition it was built against.  As it stands it stops at `**** csl traphandler mismatch ****', because the `csl' on this disk is edition 16 and lua wants a later one.  `load' the newer module first and it works:","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","needs":[{"path":"/dd/CMDS","missing":false},{"path":"/dd/cmds/shell","missing":true}],"dir":"CMDS","size":81082,"docs":true,"hassrc":true,"howto":"It stops at `**** csl traphandler mismatch ****' because it was built against a LATER csl than the edition 16 this disk ships. `load' a later csl module first -- anyone with a Microware SDK has one -- and it runs: `lua DOC/lua/examples/hello.lua' prints `hello world, from Lua!'. `luac' needs none of that. Eight example scripts are in DOC/lua/examples.","cat":"Languages","sub":"Interpreters"},{"name":"luac","desc":"Lua bytecode compiler -- luac -o out in.lua","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","dir":"CMDS","size":63022,"usage":"usage: luac [-c | -u] [-d] [-l] [-p] [-q] [-v] [-o output] file ...\n-c\tcompile (default)\n-u\tundump\n-d\tgenerate debugging information\n-l\tlist (default for -u)\n-o\toutput file for -c (default \"luac.out\")\n-p\tparse only\n-q\tquiet (default for -c)\n-m\tgenerate OS-9 I-CblCode module\n-x\tput module into default execution directory(includes -m)\n-v\tshow version information","star":true,"hassrc":true,"howto":"`luac -l -o out.lc in.lua' compiles and lists the bytecode instruction by instruction. It needs no csl and works as the disk stands. DOC/lua/examples has eight scripts that came with the package.","cat":"Languages","sub":"Interpreters"},{"name":"lunisolar","desc":"lunar and solar position calculator","src":"forum16","origin":"Microware OS-9 archive","archive":"forum16.lzh","dir":"CMDS","size":7958,"star":true,"hassrc":true,"cat":"Time & calendar","sub":"Astronomy"},{"name":"lwf","desc":"ASCII to PostScript, like Unix enscript.  Reads its prologue from /dd/USR/LIB/lwf.prologue","needs":[{"path":"/dd/usr/lib/lwf.prologue","missing":false},{"path":"/dd/cmds/pr","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":41102,"docs":true,"hassrc":true,"howto":"Turns plain text into PostScript, the way Unix enscript does. It reads /dd/USR/LIB/lwf.prologue and stops without it. No PostScript printer here, so send the output to a file and take it elsewhere.","cat":"Printing","sub":"PostScript"},{"name":"m4","desc":"m4 macro processor.  It expands macros correctly, from a file or a pipe","src":"eff_m4b","origin":"usenet archive","archive":"eff_m4b.ar","needs":[{"path":"/dd/tmp/m4.","missing":true}],"dir":"CMDS","size":39086,"usage":"Usage: m4 [options] file ....","docs":true,"hassrc":true,"cat":"Compilers & build","sub":"Make & generators"},{"name":"m4_0.5","desc":"another build of m4 -- it is the build that ships as `m4'; the earlier one mangled what it expanded.","needs":[{"path":"/dd/tmp/m4.","missing":true}],"dir":"CMDS/REBUILT","size":39094,"usage":"Usage: m4 [options] file ....","star":true,"cat":"Compilers & build","sub":"Alternates"},{"name":"macbin","desc":"MacBinary encode/decode","dir":"CMDS","size":20224,"usage":"Usage  :   Converts files to MacBinary format","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macptopbm","desc":"MacPaint to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":47570,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"macsave","desc":"unpack MacBinary files FROM STANDARD INPUT, and its SILENCE IS CORRECT: its own manual page says it \"reads standard input and silently writes the file(s) it contains\", giving them `.bin' names in the current directory and making subdirectories for embedded folders. `macbin' is the translator that MAKES one. DOC/macsave/macsave.1.","dir":"CMDS","size":31650,"docs":true,"howto":"Its silence is CORRECT and documented: DOC/macsave/macsave.1 says it \"reads standard input and silently writes the file(s) it contains\". `macbin' makes the MacBinary it wants, and the pair round-trips.","cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macstream","desc":"Read a MacTerminal file stream.  It measures the file before it reads it and answers `Short file \u003cname>' for anything too small to be one","dir":"CMDS","size":29398,"usage":"Usage: macstream [-macstream] files","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"macunpack","desc":"Unpack a packed Macintosh archive","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS","size":53208,"usage":"Usage: macunpack [-macunpack] [filename]","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"mail","desc":"a simple mail sender","needs":[{"path":"/DD/MAIL/","missing":false},{"path":"/DD/MAIL/xxxxxxxxxxxxxxxx","missing":true}],"dir":"CMDS/UUCP","size":11022,"usage":"Syntax: mail [\u003copts>] [\u003cuser>]\nFunction: sends and lists mail\nOptions:\n-r\t\t???\n-s sub\tsubject is sub\n-h\t\t???\n-d\t\t???\n-p\t\tshow contence without question\n-q\t\tquit mail after interrupt\n-f=box\ttake mailbox box\n-b\t\tshow old mail first (default: new mail first)","star":true,"cat":"Communications","sub":"Mail"},{"name":"mailx","desc":"the mail reader and sender","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/UUCP","size":41458,"star":true,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"make","desc":"make -- maintains a target. Two rules catch people: a command line must begin with a TAB (which will not survive being typed at this terminal, so copy DOC/make/demo.mk rather than echoing one), and a recipe must have no shell metacharacter -- `cp a b' runs, `cat a > b' gets `That path name doesn't lead to a file'.  DOC/STATUS has both","src":"eff_make","origin":"usenet archive","archive":"eff_make.ar","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS","size":14522,"usage":"Syntax :\tmake {[-f \u003cmakefile>] [-dDinrst] [\u003ctarget>] [\u003cmacro>=\u003cvalue>]}\nFunction :\tmaintain, update & regenerate groups of files\nOptions :\n-?   display this help text\n-f makefile\tuse the description file 'makefile'","star":true,"docs":true,"hassrc":true,"howto":"It works. Copy `/dd/DOC/make/demo.mk` rather than writing a makefile at the shell -- a command line must begin with a TAB and a tab does not survive being typed at this terminal. And keep shell metacharacters out of a recipe: `cp a b` runs, `cat a > b` gets \"That path name doesn't lead to a file\", because make forks bash with the line as a PATHNAME rather than with -c. The default rules are in default.mk beside it, and make looks for that along your PATH.","cat":"Compilers & build","sub":"Make & generators"},{"name":"makecrc","desc":"GENERATE C SOURCE for CRC tables.  It takes no arguments: run it somewhere writable and it writes six files into the data directory -- arc.c, binhex.c, ccitt.c, ccitt32.c, kermit.c and zip.c -- each holding a crctab[256] and an updcrc() for one polynomial.  It writes them without a message, so list the directory afterwards.  For a CRC of a file, `chksum' does that","dir":"CMDS","size":15968,"howto":"It GENERATES C SOURCE and takes no arguments. Run it somewhere writable (`ksh -c \"cd /dd/tmp; makecrc\"') and it writes six files -- arc.c, binhex.c, ccitt.c, ccitt32.c, kermit.c, zip.c -- each a crctab[256] and an updcrc(). It writes them without a message, so list the directory afterwards.","cat":"System & modules","sub":"Utilities"},{"name":"makedb","desc":"build smail's path-alias dbm: `makedb -o \u003cname> \u003cfile>' writes \u003cname>.dir and \u003cname>.pag.  /dd/USR/LIB/SMAIL/palias is the source it defaults to","src":"philmail","origin":"Microware OS-9 archive","archive":"philmail.lzh","needs":[{"path":"/dd/usr/lib/smail/palias","missing":false},{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS/UUCP","size":23088,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"makeinfo","desc":"GNU makeinfo -- Texinfo to info","src":"makeinfo_src","origin":"Microware OS-9 archive","archive":"-- 75 of the binary's own strings","dir":"CMDS","size":66804,"usage":"Usage: makeinfo [options] texinfo-file...","hassrc":true,"cat":"Compilers & build","sub":"Make & generators"},{"name":"makelex","desc":"compiles sonnet's lex.data word list into a C array","dir":"CMDS","size":2858,"star":true,"cat":"Text tools","sub":"Spelling & words"},{"name":"maketexpk","desc":"generate a .pk font at the size TeX asked for","needs":[{"path":"/dd/sys/tex/fonts","missing":false}],"dir":"CMDS/TEXCMDS","size":16994,"howto":"It carries the RIGHT Metafont line in its own strings and then reaches for `makdir', `del' and `attr' to file the result -- three Microware utilities that are not here. Run the virmf line yourself: DOC/README-METAFONT has it, and `gftopk' is all maketexpk was going to do afterwards.","cat":"Text tools","sub":"TeX"},{"name":"map","desc":"show the disk blocks a file occupies, sector by sector: `map \u003cfile>', or `map -e \u003cfile>' for the extended form. For memory rather than disk, see `mfree' and `free'","dir":"CMDS","size":3490,"usage":"Syntax: map [\u003copts>] \u003cfile> {\u003cfile>}\nFunction: shows blocks used by a file\nOptions:\n-e   extended map listing","star":true,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"marc","desc":"MARC, the archive MERGER -- `marc \u003ctarget> \u003csource> [names]' copies members from one .arc into another","needs":[{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS","size":32706,"usage":"Usage: MARC \u003ctgtarc> \u003csrcarc> [\u003cfilename> . . .]\nWhere: \u003ctgtarc> is the archive to add files to,","cat":"Archives & compression","sub":"Create & extract"},{"name":"math","desc":"Microware's floating-point trap module (software)","dir":"CMDS","size":7798,"cat":"System & modules","sub":"Microware runtime"},{"name":"math881","desc":"the same, using a 68881/68882 coprocessor.  Both register as the module `math'; load whichever suits your machine.","dir":"CMDS","size":3220,"cat":"System & modules","sub":"Microware runtime"},{"name":"maze","desc":"maze generator, small enough to have won an obfuscated-C contest.  It reads the number of rows on standard input and draws a maze that wide: `echo 11 | maze'","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS/GAMES","size":17776,"hassrc":true,"howto":"Reads the number of rows on standard input: `echo 11 | maze' draws a maze eleven rows deep.","cat":"Games","sub":"Puzzles"},{"name":"mcvert","desc":"Convert between Macintosh file representations","dir":"CMDS","size":30966,"usage":"Usage: Mcvert [-rduxh] [DUpqsv] filename(s)\nOptions:\n   -r = Resource Fork Only\n   -d = Data Fork Only\n   -u = Mac \u003c-> Unix Text Conversion\n   -x = Convert [*Default*]\n   -h = Host","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"md5","desc":"MD5 checksum","dir":"CMDS","size":24658,"usage":"Usage: MD%d \u003c-opts> \u003cfilename>","docs":true,"cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"me","desc":"MicroEmacs 3.11 -- ADDED; needs TERM.  (memacs400 `emacs` needs cio)","needs":[{"path":"/dd/SYS/","missing":false},{"path":"/dd/USR/LIB/EMACS/","missing":false},{"path":"/h0/SYS/","missing":false},{"path":"/h0/USR/LIB/EMACS/","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":110408,"usage":"Syntax:   emacs [opts] \u003cfiles>","howto":"Full-screen editor, MicroEMACS keys, German messages. Control-X control-C quits.","cat":"Editors","sub":"emacs family"},{"name":"messages","desc":"count and list what is in a folder.  Works","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/nlslib/","missing":true}],"dir":"CMDS/ELM","size":9948,"usage":"Usage: messages [-f filename]","star":true,"howto":"Counts what is in your mail folder: \"There is 1 message in your mailbox\".","cat":"Communications","sub":"Mail"},{"name":"mexist","desc":"test module existence","dir":"CMDS","size":4262,"usage":"Usage: mexist [options] \u003cModule>","star":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"mg","desc":"MicroGnuEmacs","needs":[{"path":"/dd/sys/mgrc","missi e, the start hour, the step and the length.","cat":"Time & calendar","sub":"Astronomy"},{"name":"os9lib","desc":"RTF/68K FORTRAN run-time LIBRARY.  rtf, for, lnk, biory and creadoc all F$Link it, so `load' it into the module directory before running them.  See DOC/README-FORTRAN.","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- RTF/68K run-time library","dir":"CMDS","size":29272,"hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"osknet","desc":"OSKNET -- TCP/IP for OS-9, Telnet, FTP, Ping and SMTP","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS/NETWORK","size":148628,"usage":"Usage: mailscan [\u003cmailfile>] [\u003cskip pages>]","docs":true,"howto":"Charles Hedrick's TCP/IP for OS-9 -- Telnet, FTP, Ping and SMTP. It needs a network interface. Its own documentation is nine files in DOC/osknet: start with howto.doc and useguide.doc.","cat":"Communications","sub":"TCP/IP"},{"name":"oskversion","desc":"report the OS-9/OSK version","src":"eff_oskversion","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/version","dir":"CMDS","size":2886,"usage":"Syntax:   OSKversion\nFunction: prints some useful informations","star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"System state"},{"name":"owner","desc":"CHANGE a file's owner -- `owner \u003cuser> \u003cfile> ...', super user only.  Run with a file it prints its usage; run as `owner \u003cfile>' it reads the filename as a user name and answers `No such user'.  `fstat' and `ls -l' are what SHOW an owner","src":"cowen_tools","origin":"Microware OS-9 archive","archive":"cowen_tools.lzh","needs":[{"path":"/DD/SYS/PASSWORD","missing":false},{"path":"/H0/SYS/PASSWORD","missing":false}],"dir":"CMDS","size":3818,"usage":"Usage: owner user file file ...\nWhere:","star":true,"docs":true,"hassrc":true,"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"p2c","desc":"Pascal to C translator (GPL).  Reads LIB/p2c/p2crc; programs it emits link again path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":59458,"hassrc":true,"howto":"A PALETTED CONVERTER NEEDS A QUANTISED IMAGE, and this is what quantises: `ppmquant 16 in.ppm > out.ppm'. Eight netpbm writers -- ppmtoicr, ppmtosixel, ppmtouil, ppmtopuzz, ppmtopict, ppmtopi1 and two more -- write ZERO BYTES for a 24-bit PPM and correct files after it.","cat":"Graphics & images","sub":"NETPBM: edit & analyse"},{"name":"ppmqvga","desc":"netpbm image tool","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":53834,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: edit & analyse"},{"name":"ppmrelief","desc":"netpbm image tool","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45020,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: edit & analyse"},{"name":"ppmshift","desc":"netpbm image tool","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":52022,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: edit & analyse"},{"name":"ppmspread","desc":"netpbm image tool","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":52174,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: edit & analyse"},{"name":"ppmtoacad","desc":"PPM (colour) to acad","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":55706,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"ppmtobmp","desc":"PPM (colour) to BMP","src":"n NAME and writes THREE files beside the DATA directory, not to standard output: \u003cname>.Y, .U and .V. 4:2:0 subsampling, so a 32x16 image gives .Y = 512 bytes and .U = .V = 128. `yuvsplittoppm \u003cname> \u003cw> \u003ch>' brings them back.","cat":"Graphics & images","sub":"NETPBM: out of PNM"},{"name":"preset","desc":"LOAD THE TERMINAL'S FUNCTION KEYS: it writes a fixed set of definitions -- `dir', `umacs', `r68', `l68', `dsave -ieb128k' and so on -- and answers `Funktionstasten belegt!'.  German, from forum3.  It takes no arguments and ignores any given.","src":"forum3","origin":"Microware OS-9 archive","archive":"forum3.lzh","dir":"CMDS","size":642,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"pri","desc":"change a process's priority: `pri \u003cpid> \u003cpriority>'.","dir":"CMDS","size":4576,"cat":"System & modules","sub":"Utilities"},{"name":"PrintCards","desc":"Home Librarian: print catalogue cards","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","dir":"CMDS","size":150360,"usage":"Syntax: PrintCards [opts]","hassrc":true,"cat":"Files & directories","sub":"Home Librarian"},{"name":"printenv","desc":"print the environment","dir":"CMDS","size":2480,"usage":"Syntax:   printenv [\u003coptions>] [{\u003cenv var name}]\nFunction: Displays the specified (or all, if none specified) environment\n   variable(s). Variables beginning with '@' (ZSH symbols) will\n   not be shown unless the -a option is used\nOptions:  -a : show all variables (including those starting with a '@')","star":true,"cat":"Shells","sub":"Shell helpers"},{"name":"printf","desc":"formatted print from the shell, as on Unix: widths, numbers and floating point","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":16550,"usage":"Usage: printf \u003cformat-string> [ arg1 . . . ]","hassrc":true,"howto":"printf as on Unix: `printf \"%-8s|%5d\\n\" name 12'. Widths, numbers and floating point all work.","cat":"Shells","sub":"Shell helpers"},{"name":"PrintLabels","desc":"Home Librarian: print labels.  ITS OPTIONS TAKE A SEPARATE ARGUMENT -- `-infile cat.libr -templatefile tpl.txt', not `-infile=...', which answers `Bad option:' and prints the syntax.  The same is true of Ascii2Libr, Libr2Ascii, PrintCards and EditLibr.  The template is a text file copied out once per card, with %title, %author, %year and the other field names replaced","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/errmsg.short","missing":true}],"dir":"CMDS","size":155930,"usage":"Syntax: PrintLabels [opts]","hassrc":true,"howto":"Its options take a SEPARATE argument: `-infile cat.libr -templatefile tpl.txt', never `-infile=...', which answers `Bad option:' and prints the syntax. The same is true of Ascii2Libr, Libr2Ascii, PrintCards and EditLibr. The template is a text file copied out once per card with %title, %author, %year and the other field names replaced.","cat":"Files & directories","sub":"Home Librarian"},{"name":"printmail","desc":"format a message for a printer.  It forks `readmsg' by bare name, so load it first; then it prints the message the same way `readmsg' would","dir":"CMDS/ELM","size":1994,"usage":"Usage: printmail [-p] [-r filename] \u003cmessage list>","star":true,"howto":"It forks `readmsg' BY BARE NAME, and OS-9 resolves a bare-name fork against the EXECUTION directory, never against PATH -- so it is silent from everywhere except /dd/CMDS/ELM. `load /dd/CMDS/ELM/readmsg' once and it works from anywhere: a RESIDENT module is found by name with no directory search at all.","cat":"Communications","sub":"Mail"},{"name":"prjob","desc":"print a job","src":"eff_lp","origin":"usenet archive","archive":"eff_lp.ar","needs":[{"path":"/dd/SPOOL/","missing":false}],"dir":"CMDS","size":4906,"star":true,"hassrc":true,"cat":"Printing","sub":"Spooling"},{"name":"proff","desc":"proff - portable roff text formatter (macros in LIB/proff). Given a text file it justifies it to a measure, and takes page ranges and a statistics option.  `roff' works too; `nroff' wants a real macro package and answers `illegal switch' to -?","src":"proff","origin":"EFFO forum","archive":"disk 8 PROGRAMME/C/PROFF (proff.zoo)","dir":"CMDS","size":30916,"usage":"usage: proff [+n] [-n] [-v] [-ifile] [-s] [-pon] [infile [outfile]]","docs":true,"hassrc":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"psc","desc":"turn an ASCII table into commands for `sc', the spreadsheet: `psc -d' ' \u003c table' answers `let A0 = 1', `let B0 = 2' and a `format' line per column.  -d sets the field delimiter, -r assembles rows first, -s names the top-left cell.  Robert Bond's, and it works","dir":"CMDS","size":11208,"usage":"Syntax: psc [-rkfLSPv?] [-s v] [-R i] [-C i] [-n i] [-d c] [\u003cpath1] [>path2]\nFunction: filter to prepare ASCII data for the Spreadsheet Calculator\nOptions:\n-s cell Top left location in the spreadsheet should be 'cell'; eg, k5\n-R n   Increment by n between rows (not valid with '-r' option)\n-C n   Increment by n between columns (valid only with '-r' option)\n-n n   Length of the row (column) should be n.\n-d c   Use c as the delimiter between the fields.\n-r   Assemble data into rows first, not columns.\n-k   Keep all delimiters - Default is strip multiple delimiters\n-f   Suppress 'format' lines in output\n-L   Left justify strings.  Default is right justify.\n-S   Use strings vs numbers for numbers\n-P   Use numbers only when there is no [-+eE] (plain numbers only)\n-v   Version\n-?   Help (this panel)","star":true,"docs":true,"howto":"Feeds `sc', the spreadsheet: `psc -d' ' \u003c table' turns rows of numbers into `let A0 = 1' commands sc can read. -r assembles rows first, -s names the top-left cell, -d sets the delimiter.","cat":"Text tools","sub":"Transform & filter"},{"name":"psidtopgm","desc":"PostScript image to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":44920,"hassrc":true,"howto":"Reads the hex digits of PostScript `image' operator data: `psidtopgm \u003cwidth> \u003cheight> \u003cbits/sample>' then the hex on standard input. `echo ffffffff00000000 | psidtopgm 4 2 8' makes a 4x2 graymap, a white row over a black one.","cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"ptob","desc":"convert bit patterns back to characters -- the other half of `btop', and the round trip is exact.","dir":"CMDS","size":15704,"usage":"Syntax:   PtoB [\u003copts>] [\u003cpath1>] [\u003copts>] [\u003cpath2>] [\u003copts>]\nFunction: convert bit patterns to chars\nOptions:  -o  use stdin for input, path1 for output","cat":"System & modules","sub":"Utilities"},{"name":"ptxm","desc":"Path Table eXtension Module (Nick Holgate, 1995): a KERNEL extension letting user-state processes open unlimited I/O paths.  Courtesyware, free.  It installs into the kernel and so needs supervisor state.  DOC/ptxm/ptxm.txt","dir":"CMDS","size":2886,"docs":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"ptxminst","desc":"install Ptxm -- the kernel extension above","dir":"CMDS","size":174,"cat":"System & modules","sub":"Utilities"},{"name":"puz15","desc":"the 15-puzzle -- same program as CMDS/puzzle15, built twice","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":43198,"usage":"usage: puz15 [\u003cwidth[x\u003cheight>]] puz15","hassrc":true,"howto":"Full-screen fifteen puzzle. Slide the tiles into the gap; `puz15 5x5' plays a bigger board. Control-C gets you out.","cat":"Games","sub":"Puzzles"},{"name":"puzzle","desc":"sliding-tile puzzle for G-Windows -- it draws through G-Windows, so at a terminal it gets one rule of plus signs out -- the top edge of the tile frame -- and stops.  For a 15-puzzle you can play, use puzzle15 or GAMES/puz15; both work","dir":"CMDS/GAMES","size":24200,"star":true,"docs":true,"cat":"Games","sub":"Other games"},{"name":"puzzle15","desc":"the 15-puzzle -- same program as GAMES/puz15, built twice","src":"eff_puzzle15","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/PUZZLE15","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":43148,"usage":"usage: puzzle15 [\u003cwidth[x\u003cheight>]] puzzle15","docs":true,"hassrc":true,"howto":"The same fifteen puzzle, in CMDS. Slide the tiles into the gap; `puzzle15 5x5' plays a bigger board. Control-C gets you out.","cat":"Games","sub":"Puzzles"},{"name":"pwgen","desc":"pronounceable passwords: `pwgen \u003clength> [how many]'","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":8746,"usage":"usage: pwgen length [count]","star":true,"hassrc":true,"howto":"pwgen \u003clength> [count]. Give it a length and it prints that many pronounceable passwords.","cat":"Amusements","sub":"Generators"},{"name":"pwparse","desc":"parse the password file for the mailer","needs":[{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/UUCP","size":6364,"star":true,"cat":"Communications","sub":"Mail"},{"name":"qp","desc":"expand BACK-QUOTES in a command line, which Microware's shell does not do for itself: `qp \u003ccmd> \u003cargs>'.  It forks a `shell' to do the expansion, so it wants Microware's on your execution path","src":"eff_qp","origin":"EFFO forum","archive":"disk 13  SOFTWARE/C/QP","dir":"CMDS","size":3770,"usage":"Syntax: qp \u003ccmd> \u003carg1> ... \u003cargn>\nFunction: process back-quotes for command expansion","star":true,"docs":true,"hassrc":true,"howto":"Runs its expanded command through Microware's `shell'.","cat":"Shells","sub":"Shell helpers"},{"name":"qrttoppm","desc":"QRT ray tracer to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45164,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"qsort9","desc":"sort filter","dir":"CMDS","size":4686,"usage":"Syntax: qsort9 [\u003copts>] [\u003csrcpath>] [\u003copts>]","star":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"qt","desc":"tells the time in words, the way a person would say it: `It's just gone ten past four.'","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":2940,"star":true,"hassrc":true,"cat":"Time & calendar","sub":"Calendars"},{"name":"queens","desc":"N-queens solver -- IOCCC entry by M. Baruch.  It reads the board size on standard input as a NUMBER and draws every arrangement it finds with no two queens attacking: `echo 6 | queens'","src":"ioccc","origin":"EFFO forum","archive":"disk, C contest entries -- IOCCC entry by M. Baruch","dir":"CMDS","size":2234,"star":true,"hassrc":true,"howto":"Reads the board size on standard input as a number: `echo 6 | queens'.","cat":"Games","sub":"Puzzles"},{"name":"rain","desc":"raindrops screen effect","src":"toys","origin":"usenet archive","archive":"toys.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":20024,"hassrc":true,"howto":"Full-screen: it takes over the display. **control-C gets you out**; q, Q, control-D and ESC do not. If it has a quit command of its own, its documentation in DOC/ will say.","cat":"Screen toys","sub":"Screen toys"},{"name":"rasttopnm","desc":"Sun raster to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":96822,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rawtopgm","desc":"raw bytes to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":48424,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rawtoppm","desc":"raw bytes to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":47336,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rayshade","desc":"ray tracer 4.0.  It renders, and requires Microware's `shell' on the execution path: it builds its scene through popen(), which OS-9's C library implements by forking a program of exactly that name.  It also wants `cccp' in the data directory, where the forked shell looks.  With both, it renders and reports its statistics.  DOC/rayshade has the two lines.","dir":"CMDS","size":169710,"usage":"usage: rayshade [options] [filename]","docs":true,"hassrc":true,"howto":"Ray tracer 4.0, and it renders. REQUIRES MICROWARE'S `shell` on your execution path -- it builds its scene through popen(), and OS-9's C library implements popen() by forking a program of exactly that name. It also wants `cccp` in the DATA directory. DOC/rayshade has the two lines.","cat":"Graphics & images","sub":"Ray tracing & 3D"},{"name":"rb37c65","desc":"floppy driver (37C65 controller)","dir":"CMDS/MM1","size":2592,"cat":"System & modules","sub":"MM/1 drivers"},{"name":"rcs","desc":"RCS","needs":[{"path":"/dd/tmp","missing":false},{"path":"/h0/etc/cmds/smail","missing":true},{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":44066,"star":true,"docs":true,"hassrc":true,"cat":"Developer tools","sub":"Version control"},{"name":"rcsdiff","desc":"RCS diff.  The RCS set here depends on the clock advancing between check-ins: two made in the same second collide and `ci' refuses the second -- `Date ... is not later than ... in existing revision 1.1'.  With only one revision there is nothing for rcsdiff to compare, and it then cannot create its own temporary either.  `ci', `co' and `rlog' work singly.","needs":[{"path":"/dd/tmp","missing":false},{"path":"/dd/cmds/rcs","missing":false},{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":30276,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"rcsident","desc":"RCS ident","dir":"CMDS","size":2660,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"rcsmerge","desc":"RCS merge -- same clock, same result as rcsdiff","needs":[{"path":"/dd/tmp","missing":false},{"path":"/dd/cmds/rcs","missing":false},{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":29864,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"rdjpgcom","desc":"read the comment from a JPEG file","dir":"CMDS","size":17140,"usage":"Usage: rdjpgcom [switches] [inputfile]","docs":true,"cat":"Graphics & images","sub":"JPEG"},{"name":"rdjpgcom.070","desc":"read a JPEG's comment (IJG 0.70 build)","dir":"CMDS","size":17266,"usage":"Usage: rdjpgcom.070 [switches] [inputfile]","cat":"Graphics & images","sub":"JPEG"},{"name":"rdoc","desc":"reverse documentation: C source in, structure chart out","src":"eff_rdoc","origin":"EFFO forum","archive":"disk 7   C/RDOC","dir":"CMDS","size":4414,"star":true,"docs":true,"hassrc":true,"cat":"Developer tools","sub":"Source navigation"},{"name":"read_mail","desc":"a small mail reader of its own: it opens /dd/MAIL/mail_\u003cuser> and offers `[L]ist again, e[X]it & delete mail, exit & [N]ot delete'","needs":[{"path":"/dd/MAIL/mail_","missing":false}],"dir":"CMDS","size":1678,"star":true,"howto":"Not vi's helper and not part of Elm: it has a mail directory of its own, /dd/MAIL/mail_\u003cuser>, and $USER decides which. Answer its L/X/N prompt ON STANDARD INPUT -- `echo N > f; read_mail \u003c f'. With no input at all it re-asks without bound.","cat":"Communications","sub":"Mail"},{"name":"readmsg","desc":"print selected messages from a folder, by number or by pattern.  Works","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/nlslib/","missing":true}],"dir":"CMDS/ELM","size":20188,"usage":"Usage: readmsg [-anhp] [-f Folder] {MessageNum ... | pattern | *}","star":true,"howto":"Prints messages from a mail folder: `readmsg 1' for the first. It reads the welcome message in /dd/SPOOL/MAIL/tester.","cat":"Communications","sub":"Mail"},{"name":"readnews","desc":"read Usenet news articles: it opens the reader and asks about each newsgroup in the active file not yet in .newsrc, then answers `**** End of newsgroups' when the news spool is empty","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP/newshelp","missing":true},{"path":"/DD/SYS/UUCP/active","missing":false},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/UUCP","size":33162,"star":true,"hassrc":true,"cat":"Communications","sub":"News"},{"name":"rechne","desc":"calculator, German -- and it takes ONE expression with no spaces in it: `rechne 4095+1' answers 4096, $1000 and the binary.  Spaced out it evaluates each argument separately","dir":"CMDS","size":18446,"star":true,"cat":"Maths & calculators","sub":"Calculators"},{"name":"ref","desc":"Look up a C function's declaration from a tags file","needs":[{"path":"/dd/defs","missing":false},{"path":"/dd/defs/sys","missing":true},{"path":"/dd/usr/src/lib","missing":true},{"path":"/dd/usr/lib","missing":false}],"dir":"CMDS","size":17904,"usage":"usage: ref [-t] [-c class] [-f file] tag\n-t   output tag info, instead of the function header\n-f File   tag might be a static function in File\n-c Class  tag might be a member of class Class","docs":true,"cat":"Developer tools","sub":"Tags"},{"name":"remove","desc":"REMOVE MODULES FROM MEMORY -- its own Function line says so.  `remove \u003cmodule>...', -q for quiet.  `rm' removes files","src":"eff_remove","origin":"EFFO forum","archive":"disk 17  SOFTWARE/C/REMOVE","info":{"version":"1.0","purpose":"remove modules from memory","status":"final","language":"C","author":"Stephan Paschedag","availability":"public"},"dir":"CMDS","size":3186,"usage":"Syntax   : remove [\u003copt>] [\u003cmodules>] [\u003copt>] [\u003cmodules>] [\u003copt>]\nFunction : remove modules from memory\nOptions  : -?  show this text\n   -q  quiet opertaion","star":true,"docs":true,"hassrc":true,"howto":"Removes MODULES FROM MEMORY. `del', `rm' and `deldir' are the file ones.","cat":"System & modules","sub":"OS-9 modules"},{"name":"rendsk","desc":"rename a disk volume","src":"eff_rendsk","origin":"EFFO forum","archive":"disk 12  SOFTWARE/C/RENDSK","dir":"CMDS","size":3024,"usage":"Syntax:   rendsk [\u003copts>] \u003cdisk device> \u003cnew name>\nFunction: Changes Volume name of disk devices","star":true,"docs":true,"hassrc":true,"cat":"Files & directories","sub":"Create & rename"},{"name":"repeat","desc":"repeat an OS-9 command N times -- `repeat 2 date' runs date twice.  It hands the command to $SHELL, which SYS/login sets to ksh, and ksh runs it.  date writes no trailing newline, so the repeats abut on one line.","src":"forum10","origin":"Microware OS-9 archive","archive":"forum10.lzh","dir":"CMDS","size":14204,"usage":"syntax: repeat [number of repetitions] [OS-9 command]\noptions: -?   provide this explanation","hassrc":true,"cat":"System & modules","sub":"Scheduling"},{"name":"rgb3toppm","desc":"rgb3 to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45160,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rlog","desc":"RCS log","needs":[{"path":"/h0/CMDS/pd","missing":true},{"path":"/dd/SYS/utmp","missing":true}],"dir":"CMDS","size":38712,"star":true,"cat":"Developer tools","sub":"Version control"},{"name":"rm","desc":"remove files","dir":"CMDS","size":20372,"usage":"Usage: rm [-dfirvPR] [+directory] [+force] [+interactive] [+recursive]","star":true,"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"rmail","desc":"deliver incoming mail (invoked by uuxqt, not by you). Given a local name it builds \u003cmailbox>/\u003cuser>, and the mailbox here is a file, so it stops with `can't change to mailbox: /dd/SPOOL/MAIL/tester/tester'.  Given a `host!user' address for remote delivery it does not return at all","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP/Systems","missing":false},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/UUCP/sequence.spool","missing":true},{"path":"/DD/SYS/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/UUCP","size":29164,"usage":"usage: rmail [file] \"site!user[@site]\"","star":true,"hassrc":true,"howto":"Local delivery builds \u003cmailbox>/\u003cuser> and stops, because the mailbox here is a file: `rmail tester' answers plainly. `rmail \"site!user\"' for remote delivery does not return.","cat":"Communications","sub":"Mail"},{"name":"rndir","desc":"convert directory NAMES between upper and lower case -- its own Function: line is \"rename directory names in big/small characters\".  `-l' for small, `-q' to work silently.","dir":"CMDS","size":6652,"usage":"Syntax: rndir [\u003copt>]","star":true,"cat":"System & modules","sub":"Utilities"},{"name":"rndname","desc":"invents pronounceable names, as many as you ask for -- a second program of the same idea as `name'","src":"rndname","origin":"usenet archive","archive":"rndname.ar","dir":"CMDS","size":6238,"usage":"Usage: name number-of-names","star":true,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"rnews","desc":"unpack an incoming news batch","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP/active","missing":false},{"path":"/DD/SYS/UUCP","missing":false}],"dir":"CMDS/UUCP","size":22348,"star":true,"hassrc":true,"cat":"Communications","sub":"News"},{"name":"robots","desc":"robots -- outrun them until they crash into each other. You are the `I', the robots are the `#' and a wreck is an `@'.  USE -m: manual mode, one robot step per move of yours; without it the game is effectively unplayable. The keys are the numeric keypad 1-9 with 5 to stand still, `t' to teleport and `s' for a last stand.","src":"rob","origin":"usenet archive","archive":"robots.ar (first sector lost)","needs":[{"path":"/h0/games/rob/robot.log","missing":false},{"path":"/h0/games/rob/robots.log","missing":false},{"path":"/h0/games/rob/robots.debug","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":41952,"usage":"Usage: robots [ -m ] [ -s ]","star":true,"hassrc":true,"howto":"Play with `robots -m' -- manual mode, where the robots take one step per move you make. Keys are the numeric keypad 1-9 (5 stands still), `s' for last stand, `t' to teleport. Needs Microware's math module and a real TERM.","cat":"Games","sub":"Arcade & action"},{"name":"roff","desc":"roff text formatter, and it works: `roff -?' gives its syntax and page-range options.","src":"eff_roff","origin":"EFFO forum","archive":"disk 4   SPRACHEN/C/ROFF","dir":"CMDS","size":26312,"usage":"Syntax: roff {[+00] [-00] [-s] -[h] file}\nFunction: format textfiles\nOptions:","docs":true,"hassrc":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"rot","desc":"turn a text file on its side -- line one becomes column one","src":"rot","origin":"usenet archive","archive":"rot.ar","needs":[{"path":"/dd/rodXXXXXX","missing":true},{"path":"/dd/rotXXXXXX","missing":true}],"dir":"CMDS","size":19108,"docs":true,"hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"rpn","desc":"RPN calculator -- and its `+' is wrong: 12, 34, + leaves a stack of three with 0 on top instead of one with 46. `rechne' is the calculator that answers correctly","src":"eff_rpn","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/RPN","dir":"CMDS","size":4950,"star":true,"docs":true,"hassrc":true,"cat":"Maths & calculators","sub":"Calculators"},{"name":"rpoem","desc":"random poem generator (SNOBOL4-in-C).  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/RPOEM.SYN","missing":false},{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false}],"dir":"CMDS/GAMES","size":19448,"star":true,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"rsconvert","desc":"convert rayshade image output between formats.  Run here it prints `/* Converted by rsconvert */' and then stops with a stack overflow, with or without a file named.","dir":"CMDS","size":41270,"usage":"usage: rsconvert [oldfile]","cat":"Graphics & images","sub":"Ray tracing & 3D"},{"name":"rstory","desc":"random story generator, roff output.  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/RSTORY.SYN","missing":false},{"path":"/dd/GAMES/SNOBOL/RSTORY.ACT","missing":false},{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false}],"dir":"CMDS/GAMES","size":37954,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"rstory2","desc":"asks your name, sex, favourite animal and colour and a setting, then hands them to a story program (rstory_W, rstory_S, rstory_C or rstory_G); supply one and it writes the story","src":"effo_snobol","origin":"EFFO forum","archive":"di
