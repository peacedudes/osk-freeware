   Also display dimensions of JPEG image"},"cat":"Graphics & images","sub":"JPEG"},{"name":"rdoc","desc":"reverse documentation: C source in, structure chart out","src":"eff_rdoc","origin":"EFFO forum","archive":"disk 7   C/RDOC","dir":"CMDS","size":4414,"star":true,"docs":true,"hassrc":true,"help":{"note":"it takes the source file and nothing else"},"cat":"Developer tools","sub":"Source navigation"},{"name":"read_mail","desc":"a small mail reader of its own: it opens /dd/MAIL/mail_\u003cuser> and offers `[L]ist again, e[X]it & delete mail, exit & [N]ot delete'","needs":[{"path":"/dd/MAIL/mail_","missing":false,"dir":false,"bytes":0}],"dir":"CMDS","size":1678,"star":true,"howto":"Not vi's helper and not part of Elm: it has a mail directory of its own, /dd/MAIL/mail_\u003cuser>, and $USER decides which. Answer its L/X/N prompt ON STANDARD INPUT -- `echo N > f; read_mail \u003c f'. With no input at all it re-asks without bound.","help":{"note":"it takes no options and asks L, X or N on standard input"},"cat":"Communications","sub":"Mail"},{"name":"readmsg","desc":"prints selected messages from a mail folder, by number or by pattern: `readmsg 1' for the first","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false,"dir":true,"bytes":null},{"path":"/dd/nlslib/","missing":true,"dir":false,"bytes":null}],"dir":"CMDS/ELM","size":20188,"star":true,"howto":"Prints messages from a mail folder: `readmsg 1' for the first. It reads the welcome message in /dd/SPOOL/MAIL/tester.","help":{"cmd":"readmsg -?","text":"/dd/CMDS/ELM/readmsg: illegal option -- ?\nUsage: /dd/CMDS/ELM/readmsg [-anhp] [-f Folder] {MessageNum ... | pattern | *}"},"cat":"Communications","sub":"Mail"},{"name":"readnews","desc":"read Usenet news articles: it opens the reader and asks about each newsgroup in the active file not yet in .newsrc, then answers `**** End of newsgroups' when the news spool is empty","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP/newshelp","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/UUCP/active","missing":false,"dir":false,"bytes":233},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/UUCP","size":33162,"star":true,"hassrc":true,"help":{"cmd":"readnews -?","text":"readnews: read Usenet news articles\n\nUsage: readnews\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"News"},{"name":"rechne","desc":"German command-line calculator: every answer in decimal, hex and binary at once. The expression is one argument with no spaces -- `rechne 4095+1' -- with operators + - x / m (modulo) a o p (and, or, xor) and $ for hex; -b lists the bits set","dir":"CMDS","size":18446,"star":true,"howto":"One expression, no spaces: `rechne 4095+1'. Operators + - x / m a o p; $ff is hex; -b lists the set bits. The other -xx switches decode status codes of the maker's own equipment.","help":{"cmd":"rechne -?","text":"RECHNE   Version UTIL 2.80 by DESIGNA VLT 03.08.98\nrechne [Optionen] \u003cAusdruck>\n   Moegliche Operatoren:\n      + = Addition        - = Subtraktion     x = Multiplikation\n      / = Division        m = Modulo\n      a = Log. AND        o = Log. ODER       p = Log. XOR\n\n   Moegliche Operanden:\n      ..  = Dezimal ..          $.. = Hex ..\n\n   Spezielle Parameter:\n      -b  = Bitkodierung        -ak = A-Karten-Status\n      -ip = Preise-Status       -ti = TCC-Init\n      -tn = TCC-Netzstatus      -tz = TCC-Zustand\n      -kf = KFCHECK-Fehlernr.   -kr = Krt_Meld-Status\n      -kk = KK-File-Status\t\t-ec = KK_EC-Status\n      -ah = AktPKH-Status\t\t-ih = InitPKH-Status\n      -kb = Kassenbuch-Art\n      -sec=Ausdruck in Sekunden -min=Ausdruck in Minuten\n      -std=Ausdruck in Stunden  -tag=Ausdruck in Tage"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"ref","desc":"Look up a C function's declaration from a tags file","needs":[{"path":"/dd/defs","missing":false,"dir":true,"bytes":null},{"path":"/dd/defs/sys","missing":true,"dir":false,"bytes":null},{"path":"/dd/usr/src/lib","missing":true,"dir":false,"bytes":null},{"path":"/dd/usr/lib","missing":false,"dir":true,"bytes":null}],"dir":"CMDS","size":17904,"docs":true,"help":{"cmd":"ref -?","text":"usage: ref [-t] [-c class] [-f file] tag\n   -t        output tag info, instead of the function header\n   -f File   tag might be a static function in File\n   -c Class  tag might be a member of class Class"},"cat":"Developer tools","sub":"Tags"},{"name":"remove","desc":"remove modules from memory -- its own Function line says so. `remove \u003cmodule>...', -q for quiet. `rm' removes files","src":"eff_remove","origin":"EFFO forum","archive":"disk 17  SOFTWARE/C/REMOVE","info":{"version":"1.0","purpose":"remove modules from memory","status":"final","language":"C","author":"Stephan Paschedag","availability":"public"},"dir":"CMDS","size":3186,"star":true,"docs":true,"hassrc":true,"howto":"Removes modules from memory. `del', `rm' and `deldir' are the file ones.","help":{"cmd":"remove -?","text":"Syntax   : remove [\u003copt>] [\u003cmodules>] [\u003copt>] [\u003cmodules>] [\u003copt>]\nFunction : remove modules from memory\nOptions  : -?  show this text\n           -q  quiet opertaion\n V1.0, written by Stephan Paschedag"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"rendsk","desc":"changes the volume name of a disk -- the name in its identification sector, not any file on it; super user only","src":"eff_rendsk","origin":"EFFO forum","archive":"disk 12  SOFTWARE/C/RENDSK","dir":"CMDS","size":3024,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"rendsk -?","text":"Syntax:   rendsk [\u003copts>] \u003cdisk device> \u003cnew name>\nFunction: Changes Volume name of disk devices\nNotes:  - ONLY SUPERUSERS may use rendsk\n        - if new name contains spaces, surround it with double quotes\nV1.0 Ed#1 (c) 1990 by L.Zeller"},"cat":"Files & directories","sub":"Create & rename"},{"name":"repeat","desc":"repeat an OS-9 command N times -- `repeat 2 date' runs date twice.  It hands the command to $SHELL, which SYS/login sets to ksh, and ksh runs it.  date writes no trailing newline, so the repeats abut on one line.","src":"forum10","origin":"Microware OS-9 archive","archive":"forum10.lzh","dir":"CMDS","size":14204,"hassrc":true,"help":{"cmd":"repeat -?","text":"repeat ver 1.2\nfunction: repeat an OS-9 command several times\nsyntax: repeat [number of repetitions] [OS-9 command]\noptions: -?     provide this explanation\nexample: repeat 10 echo Hello"},"cat":"System & modules","sub":"Scheduling"},{"name":"rgb3toppm","desc":"three greymaps -- red, green and blue -- combined into one PPM; ppmtorgb3 splits it","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":45160,"hassrc":true,"help":{"cmd":"rgb3toppm -?","text":"usage:  rgb3toppm \u003cred pgmfile> \u003cgreen pgmfile> \u003cblue pgmfile>"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"rlog","desc":"RCS: prints a history file's log -- head revision, locks, the description and each revision's message","needs":[{"path":"/h0/CMDS/pd","missing":true,"dir":false,"bytes":null},{"path":"/dd/SYS/utmp","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":38712,"star":true,"help":{"cmd":"rlog -?","text":"rlog error: unknown option: -?\ncommand format:\nrlog -L -R -h -t -b -ddates -l[lockers] -rrevisions -sstates -w[logins] file ...\nrlog aborted"},"cat":"Developer tools","sub":"Version control"},{"name":"rm","desc":"GNU rm: removes files, whole directories with -r, asking first with -i, naming each with -v","dir":"CMDS","size":20372,"star":true,"help":{"cmd":"rm -?","text":"rm: unrecognized option `-?'\nUsage: rm [-dfirvPR] [+directory] [+force] [+interactive] [+recursive]\n       [+verbose] [+no-permission] path..."},"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"rmail","desc":"deliver incoming mail (invoked by uuxqt, not by you). Given a local name it builds \u003cmailbox>/\u003cuser>, and the mailbox here is a file, so it stops with `can't change to mailbox: /dd/SPOOL/MAIL/tester/tester'.  Given a `host!user' address for remote delivery it does not return at all","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/Systems","missing":false,"dir":false,"bytes":3605},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/sequence.spool","missing":true,"dir":false,"bytes":null},{"path":"/DD/SYS/password","missing":false,"dir":false,"bytes":226},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/UUCP","size":29164,"star":true,"hassrc":true,"howto":"Local delivery builds \u003cmailbox>/\u003cuser> and stops, because the mailbox here is a file: `rmail tester' answers plainly. `rmail \"site!user\"' for remote delivery does not return.","help":{"cmd":"rmail -?","text":"usage: rmail [file] \"site!user[@site]\"\n\nv2.1 (94Sep30) This is free software released under the GNU General Public\nLicense.  Please send suggestions/bug reports to:  bob@kc2wz.bubble.org"},"cat":"Communications","sub":"Mail"},{"name":"rndir","desc":"converts directory names between upper and lower case -- its own Function line is \"rename directory names in big/small characters\". `-l' for small, `-q' to work silently","dir":"CMDS","size":6652,"star":true,"help":{"cmd":"rndir -?","text":"Syntax: rndir [\u003copt>]\nVersion:  V1.0  13.02.1990\nFunction: rename directory names in big/small characters\nOptions:\n     -?   show valid options\n     -d   temp-files allways on current working directory !\n     -h   help user\n     -l   rename directories in small characters\n     -n   don't erase temp-files after completition of work\n     -q   quiet mode [no prints to terminal screen]"},"cat":"System & modules","sub":"Utilities"},{"name":"rndname","desc":"invents pronounceable names, as many as you ask for -- the earlier version of `name', with every letter equally likely, so the names come out more exotic","src":"rndname","origin":"usenet archive","archive":"rndname.ar","dir":"CMDS","size":6238,"star":true,"hassrc":true,"help":{"note":"it takes how many names to invent and nothing else"},"cat":"Amusements","sub":"Generators"},{"name":"rnews","desc":"unpack an incoming news batch","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false,"dir":true,"bytes":null},{"path":"/DD/SYS/UUCP/active","missing":false,"dir":false,"bytes":233},{"path":"/DD/SYS/UUCP","missing":false,"dir":true,"bytes":null}],"dir":"CMDS/UUCP","size":22348,"star":true,"hassrc":true,"help":{"cmd":"rnews -?","text":"rnews [-x debug_level] [-n inital_newsgroup] [-z] newsfile"},"cat":"Communications","sub":"News"},{"name":"robots","desc":"robots: outrun them until they crash into each other. You are the `I', the robots are the `#' and a wreck is an `@'. Use -m, manual mode, one robot step per move of yours; without it the game is effectively unplayable. The keys are the numeric keypad 1-9 with 5 to stand still, `t' to teleport and `s' for a last stand","src":"rob","origin":"usenet archive","archive":"robots.ar (first sector lost)","needs":[{"path":"/h0/games/rob/robot.log","missing":false,"dir":false,"bytes":2800},{"path":"/h0/games/rob/robots.log","missing":false,"dir":false,"bytes":2800},{"path":"/h0/games/rob/robots.debug","missing":true,"dir":false,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/GAMES","size":41952,"star":true,"hassrc":true,"howto":"Play with `robots -m' -- manual mode, where the robots take one step per move you make. Keys are the numeric keypad 1-9 (5 stands still), `s' for last stand, `t' to teleport. Needs Microware's math module and a real TERM.","help":{"cmd":"robots -?","text":"Unknown terminal type ''.\n\nUsage: /dd/CMDS/GAMES/robots [ -m ] [ -s ]"},"cat":"Games","sub":"Arcade & action"},{"name":"roff","desc":"a text formatter in the nroff line: it reads text with dot-commands at the start of a line and fills, justifies and paginates it.  `.ce' centres, `.sp' spaces, `.fi'/ `.nf' turn filling on and off, `.ad'/`.na' the right justify, `.in'/`.ti'/`.ll' set the margins and measure, `.he'/`.fo' add a running header and footer with the page number, `.sh' numbers headings.  nroff and proff are the same idea; DOC/roff has the full request list.","src":"eff_roff","origin":"EFFO forum","archive":"disk 4   SPRACHEN/C/ROFF","dir":"CMDS","size":26312,"docs":true,"hassrc":true,"help":{"cmd":"roff -?","text":"Syntax: roff {[+00] [-00] [-s] -[h] file}\nFunction: format textfiles\nOptions:\n     +00       start at page 00\n     -00       end at page 00\n     -c        print tabel of contents\n     -s        ????\n     -h        use hardtabs"},"cat":"Text tools","sub":"Format & typeset"},{"name":"rot","desc":"turn a text file on its side -- line one becomes column one","src":"rot","origin":"usenet archive","archive":"rot.ar","needs":[{"path":"/dd/rodXXXXXX","missing":true,"dir":false,"bytes":null},{"path":"/dd/rotXXXXXX","missing":true,"dir":false,"bytes":null}],"dir":"CMDS","size":19108,"docs":true,"hassrc":true,"help":{"cmd":"rot -?","text":"syntax: rot {opt} [\u003cfile>]\nfunction: rotate lines in file (or stdin if none)\noptions:\n\t-b      don't suppress trailing blanks in output file\n\t-c \u003cch> use ch for as line separater instead of CR\n\t-h      huge file: use temp (\"/dd\") files, instead of memory (SLOW)\n\t-l      only print num of lines, and length of longest in the file\n\t-o      change the order of columns\n\t-r      rotate reverse (counter clockwise)\n note: rot knows nothing about tabs, expand them first if desired"},"cat":"Text tools","sub":"Transform & filter"},{"name":"rpn","desc":"reverse-Polish calculator on whole numbers. A number typed is pushed; the words add, sub, mul, div and mod combine the top two, and, or, xor and not work bitwise, pr prints an entry, pop discards one. After each line it shows the stack top and depth; ? lists the words, q leaves","src":"eff_rpn","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/RPN","dir":"CMDS","size":4950,"star":true,"docs":true,"hassrc":true,"howto":"Operators are words typed on their own line: 12, 34, add. A + sign is read as the number 0 and pushed. q leaves.","help":{"note":"`?' at its prompt lists the words; a flag is refused"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"rpoem","desc":"writes verses at random from a grammar and a word list in GAMES/SNOBOL; a number says how many, thirty without one","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/RPOEM.SYN","missing":false,"dir":false,"bytes":1180},{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false,"dir":false,"bytes":1792}],"dir":"CMDS/GAMES","size":19448,"star":true,"hassrc":true,"help":{"note":"it takes how many verses to write and nothing else"},"cat":"Amusements","sub":"Generators"},{"name":"rsconvert","desc":"converts rayshade image output between formats. Run here it prints `/* Converted by rsconvert */' and stops with a stack overflow, with or without a file named","dir":"CMDS","size":41270,"help":{"note":"it takes the file to convert and no help flag"},"cat":"Graphics & images","sub":"Ray tracing & 3D"},{"name":"rstory","desc":"a cumulative tale in the shape of The Old Woman and Her Pig, the animal, the obstacle and every helper drawn at random; `rstory | tformat' sets it justified under a dated heading. Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/RSTORY.SYN","missing":false,"dir":false,"bytes":1672},{"path":"/dd/GAMES/SNOBOL/RSTORY.ACT","missing":false,"dir":false,"bytes":347},{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false,"dir":false,"bytes":1792}],"dir":"CMDS/GAMES","size":37954,"hassrc":true,"help":{"note":"it takes no options: run it and it tells a tale"},"cat":"Amusements","sub":"Generators"},{"name":"rstory2","desc":"asks your name, sex, favourite animal and colour and a setting, then hands them through the shell to a story program (rstory_W, rstory_S, rstory_C or rstory_G) whose story goes through tformat to the printer at /p1. The four story programs did not come with it, so the questions are as far as it goes","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","dir":"CMDS/GAMES","size":3298,"star":true,"hassrc":true,"help":{"note":"it asks its questions itself; there is no help flag"},"cat":"Amusements","sub":"Generators"},{"name":"rtf","desc":"RTF/68K, the Real-Time Fortran-77 compiler, v2.14 (CERN, 1987). `load /dd/CMDS/os9lib' first; then `rtf file.f' reads the Fortran and writes 68k assembly beside the source, and r68 and l68 from your OS-9 assemble and link it. `for' is its driver, which forks Microware's shell for each pass. Sources to try in SRC/rtf; the manual is DOC/rtf/rtfman.txt","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- RTF/68K Fortran-77 (CERN)","needs":[{"path":"/dd/cmds/rtfdat","missing":false,"dir":false,"bytes":47360}],"dir":"CMDS","size":33360,"docs":true,"hassrc":true,"help":{"note":"`load /dd/CMDS/os9lib' first; then it takes the source file and nothing else"},"cat":"Compilers & build","sub":"Fortran"},{"name":"rtfdat","desc":"RTF FORTRAN data module","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- rtf's data module","dir":"CMDS","size":47360,"hassrc":true,"help":{"note":"a data module for the RTF Fortran set, not a program"},"cat":"System & modules","sub":"OS-9 modules"},{"name":"run","desc":"runs a program with its input and output on the terminal PORT names: `run '\u003cprogram> \u003cargs>''","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":15412,"docs":true,"hassrc":true,"howto":"`run '\u003cprogram> \u003cargs>'' with PORT naming a terminal: the program runs with its input and output on that terminal.","help":{"note":"it takes the quoted command and reads PORT from the environment; there is no help flag"},"cat":"Shells","sub":"Shell helpers"},{"name":"runc","desc":"runs a Lua script that `luac -x' has compiled into an OS-9 module: `load greet', then `runc greet \u003cargs>'. The script reads its arguments from argv[1] onwards, with the count in argv.n","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","dir":"CMDS","size":3958,"hassrc":true,"howto":"Compile with `luac -x -o greet greet.lua', `load greet', then `runc greet World'. The script reads argv[1] onwards; argv.n is the count.","help":{"note":"it takes the module name luac -x made and the script's arguments"},"cat":"Languages","sub":"Interpreters"},{"name":"rxmod","desc":"receives an OS-9 module over a serial line and enters it in the module directory -- the receiving half of `txmod'. It calls the VMod_trap handler that ships beside it in COMMS, so `load' that first. Source in SRC/serload","dir":"CMDS/COMMS","size":3210,"docs":true,"howto":"It stops with `can't install Vmod Trap handler' and the handler is sitting beside it: `load /dd/CMDS/COMMS/vmod_trap' first. It then gets past the install and faults inside the trap, which is a different thing and worth telling apart.","help":{"cmd":"rxmod -?","text":" 4ERXMod - Err:  -? \"\nRXmod Ed.4 Rv.2 - load Module via SCF from TXMod on Host\nSyntax: rxmod [\u003copts> [module(s)]]\nOptions:\n  -l[=]\u003cdev> : use dev for xmission\n              else StdIn/StdOut/StdErr\n\n   Module(s) : all after \u003cdev> to EOL is send to\n              Host, preceeded by 'TXMOD'. For\n              wildchards on host use \"*\" in double-quotes"},"cat":"Communications","sub":"Terminal & transfer"},{"name":"savage","desc":"Savage's benchmark: a chain of functions that should cancel to an exact number, a thousand times; how far the printed value drifts measures the arithmetic's rounding","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":2006,"star":true,"hassrc":true,"help":{"note":"it takes no options: run it and it reports the drift"},"cat":"Developer tools","sub":"Benchmarks"},{"name":"savemem","desc":"writes a block of memory to a file -- from address, to address and path, the addresses in hex; super user only. loadmem is its reverse","dir":"CMDS","size":444,"help":{"cmd":"savemem -?","text":"Syntax   : SAVEMEM \u003cfrom address> \u003cto address> \u003cpath>\nFunction : saves memory block to file\nNotes    : - You must be super user\n           - specify addresses in hex"},"cat":"Graphics & images","sub":"Drawing & display"},{"name":"sbreak","desc":"Send/clear an SS_Break signal on a serial path","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":12574,"hassrc":true,"help":{"cmd":"sbreak -?","text":"Syntax:   sbreak [/device]\nFunction: send break on SCF device\nOptions:  none"},"cat":"Communications","sub":"Terminal & session"},{"name":"sc","desc":"sc -- spreadsheet calculator (needs TERM)","needs":[{"path":"/DD/SYS/TERM","missing":false,"dir":true,"bytes":null},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":233050,"docs":true,"hassrc":true,"howto":"The spreadsheet, version 6.16. `sc' opens and says \"Type '?' for help\". It reads TERMCAP as SYS/login sets it, so no `. /dd/SYS/termcap.entry' is needed first.","help":{"cmd":"sc -?","text":"Syntax: sc [-c] [-r] [-m] [-n] [-x] [-b] [filename]\nFunction: spreadsheet calculator\nOptions:\n  -c  Recalculation set for column order\n  -r  Recalculation set for row order (default)\n  -m  Automatic recalculation disabled\n  -n  Quick numeric entry mode\n  -x  Encryption/decryption for Get/Put commands\n  -b  Disable auto-backups"},"cat":"Maths & calculators","sub":"Calculators"},{"name":"scales","desc":"deals scales and chords into a random practice order, a tick-box each, in `scales.lst' in the current directory (or a file you name): -d diatonic scales, -a altered scales, -m modes, -c chords; each entry gives the key signature and the spelling","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":13034,"star":true,"hassrc":true,"howto":"Pick at least one of -d -a -m -c or it asks what you had in mind; `scales -d -c' writes 195 entries to scales.lst, and a trailing name writes elsewhere.","help":{"cmd":"scales -h","text":"Usage: scales [-h] [-d] [-a] [-m] [-c] [outname]\n\n             -h: This message only\n             -d: include diatonic scales\n             -a: include altered scales\n             -m: include modal scales\n             -c: include chords\n\nNo scales or chords are given as a default."},"cat":"Amusements","sub":"Generators"},{"name":"scqref","desc":"quick reference for sc, the spreadsheet: a 360-line document that prints itself, in sections A to Q -- options, cursor movement, cell entry, files, ranges and the function lists. `scqref ! less' pages it","dir":"CMDS","size":18426,"star":true,"howto":"`scqref ! less' pages the reference; it is 360 lines.","help":{"note":"it takes no options: run it and it prints the reference"},"cat":"Maths & calculators","sub":"Spreadsheets"},{"name":"screen","desc":"`screens': picks a file at random from $HOME/.SCREENS and shows it -- a login greeting.  On OS-9 it RUNS the file rather than printing it, through system(), so it wants Microware's `shell' on your execution path.  Not the terminal multiplexer of the same name.  Source in SRC/screen, man page in DOC/screen/screens.6","src":"screen","origin":"usenet archive","archive":"screen.ar","dir":"CMDS","size":7138,"star":true,"docs":true,"hassrc":true,"help":{"note":"-v prints its version; it has no help flag, and it wants a $HOME/.screens directory"},"cat":"System & modules","sub":"Utilities"},{"name":"screen_nocio","desc":"a trap-free source build; CMDS/screen uses cio and this one does not","dir":"CMDS/REBUILT","size":17196,"help":{"note":"-v prints its version; it wants a $HOME/.screens directory"},"cat":"System & modules","sub":"Utilities"},{"name":"scriptmaster","desc":"G-Windows scripting tool","dir":"CMDS/GAMES","size":37152,"star":true,"docs":true,"help":{"note":"it needs G-Windows; there is no help flag"},"cat":"Games","sub":"Other games"},{"name":"scsi_mm1a","desc":"SCSI driver","dir":"CMDS/MM1","size":4218,"help":{"note":"a device driver for the MM/1, not a program"},"cat":"System & modules","sub":"MM/1 drivers"},{"name":"scsiutil","desc":"talks to a SCSI device: inquiry, capacity, read sectors, eject, and audio CD control -- table of contents, play, volume","dir":"CMDS","size":47678,"docs":true,"help":{"cmd":"scsiutil -?","text":"SCSIutil V2.02 [Jan 28 1997 : 15:59:35] - written by Gary Duncan\n         (gduncan@philips.oz.au) and Heiko Rath (hr@brewhr.swb.de)\n           OS-9 port by Andrzej Kotanski (kotanski@if.uj.edu.pl)\nUsage: SCSIutil [/scsi_dev@] \u003ccommand>\n -c[r]                 : Read capacity [raw]\n -d\u003cl|r|s> sec blks    : Read 16 bit digital audio(start sector/# blocks)(2)\n -D\u003cl|r|s> sec blks    : Read  8 bit digital audio(left or right channel)(3)\n -e \u003c0|1>              : Change medium (0=eject, 1=load)\n -i[r]                 : Inquiry [raw]\n -h[r] blk             : Read CD-ROM data block address header\n -l \u003c0|1>              : Allow/Prevent medium removal\n -m \u003c0|1>              : Stop/Start motor {0=stop, 1=start}\n -o[r] contr page      : Mode sense (contr = 0-3)(4)\n -p st si et ei        : Play audio CD track (1-99), index (1-99)\n -r sec_no             : Read sectors\n -s sec_no             : Seek to sector (5)\n -t[r|l]               : Display TOC of an audio CD [raw|long]\n -u[r] chan fmt track  : Read CD sub-channel information [raw] (6)\n -v [vl0 vl1 vl2 vl3]  : Set output volume channels 0-3 (7)\n\nNote 2: with 's' returns LRLRLR pairs of stereo audio, 2352 bytes per block\n     3: converted to 8 bit audio (-d and -D work with Sony CDU 561 & 8003)\n     4: contr 0: current, 1: changeable, 2: default, 3: saved values\n     5: to park heads, try sec_no of -1\n     6: Q-channel = 64, fmt: 0=Sub-Q Channel data,1=current CD-ROM pos.,\n        2=Media Catalog Number (UPC/Bar Code),3=Track ISRC\n     7: use -1 to leave volume of channel as it is, without argument shows\n        current volume settings"},"cat":"System & modules","sub":"Utilities"},{"name":"sdb","desc":"SDB 2.0, a symbolic debugger: opens a program at its prompt, where breakpoints, single steps and memory display are commands; q leaves","src":"effo_sdb","origin":"EFFO forum","archive":"disk 1   C/SDB","dir":"CMDS","size":43424,"docs":true,"hassrc":true,"help":{"note":"it takes the program to debug and nothing else; its commands are typed at its own prompt"},"cat":"Developer tools","sub":"Debugging"},{"name":"sddemo","desc":"White's Speedisk 2.10 -- disk de-fragmenter.  Wants an 80x24 screen; falls back to tty mode","needs":[{"path":"/dd/sys/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS/DEMOS","size":64694,"howto":"White's Speedisk 2.10 de-fragmenter, demo build. Wants an 80x24 screen and drops to tty mode without one.","help":{"cmd":"sddemo -?","text":"Speedisk v2.10 (Demo) -- Copyright (c) 1994 by Dynamic Systems\n\nUsage:\tSpeedisk [\u003copts>] [\u003cdevice>] [\u003copts>]\n\n        If no device is specified, the device containing the current\n        working directory is used.\n\nOptions:\n        -a        Accept some disk errors as okay and continue\n        -b=\u003cnum>  Limit temporary file storage to \u003cnum> kilobytes of RAM\n        -d        Don't put directories at the front of the disk\n        -e        Don't put executable files before others\n        -f        Don't use fullscreen display\n        -o        Optimize now (batch mode)\n        -r=\u003cnum>  Use \u003cnum> kilobytes of RAM for read/write buffer\n        -t=\u003cnum>  Limit optimization time to \u003cnum> minutes (batch mode)\n        -v        Verify all disk writes\n        -w        Wipe free space after optimization (for security)"},"cat":"System & modules","sub":"Vendor demos"},{"name":"sed","desc":"sed, the stream editor: substitutes, deletes and prints, with -n for no default output, -e for a script line and -f for a script file","src":"eff_sed","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/SED","info":{"purpose":"non interactive stream editor","status":"final","language":"C","author":"GNU","availability":"Public"},"dir":"CMDS","size":38728,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"sed -?","text":"Syntax   : sed [\u003copts>] [\u003cfile>]\nFunction : stream editor\nOptions  :\n    -n          no default output\n    -e \u003cscript> add script line\n    -f \u003csfile>  use \u003csfile> as script\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Editors","sub":"Line & stream"},{"name":"sed_1.06","desc":"a second build of sed, kept under its version number; the same substitutions","dir":"CMDS/REBUILT","size":38738,"star":true,"help":{"cmd":"sed_1.06 -?","text":"Syntax   : sed [\u003copts>] [\u003cfile>]\nFunction : stream editor\nOptions  :\n    -n          no default output\n    -e \u003cscript> add script line\n    -f \u003csfile>  use \u003csfile> as script\n  Adapted to OS-9/68k by Stephan Paschedag"},"cat":"Editors","sub":"Alternates"},{"name":"sedt","desc":"SEDT 2.6 screen editor, the VT100 build: a DEC-style keypad editor.  `new_e' and `e' are two more builds of it; all three read SYS/sedt.keys, sedt.ruler0 and sedt.help","src":"effo_sedt","origin":"EFFO forum","archive":"disk 11  SOFTWARE/C/SEDT_EDITOR/SEDT","dir":"CMDS","size":56568,"star":true,"docs":true,"hassrc":true,"help":{"cmd":"sedt -?","text":"Syntax:\n  e -[\u003copts>] \u003cfile1> [\u003copts_file1>]  \u003cfile2> [\u003copts_file2>] ...\n  up to four files may be specified\n\nOptions:\n  -o=\u003cfilename>   specify another file as output\n  -n   \t      open the file read-only (no output file)\n  -l=\u003cnumber>     goto this line\n  or \u003cnumber>     goto this line\n  -r              recover a file\n  -j              suppress journal file\n  -d              debug mode"},"cat":"Editors","sub":"SEDT family"},{"name":"sepwords","desc":"splits text into one word per line -- the first step towards a word list or an index","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":14742,"hassrc":true,"help":{"cmd":"sepwords -?","text":"Syntax: sepwords [\u003cin_path> [\u003cout_path>]]\nFunction: split file to one word per line."},"cat":"Text tools","sub":"Split & join"},{"name":"setfont","desc":"load a downloadable terminal font -- setfont \u003cpath>. Given a font file it writes no byte to /term, to $PORT, or to a file $PORT names, and returns exit status 0.  With no argument it answers `usage: setfont \u003cpath>'.","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":1908,"star":true,"hassrc":true,"help":{"cmd":"setfont -?","text":"usage: setfont \u003cpath>"},"cat":"Communications","sub":"Terminal & session"},{"name":"setime","desc":"sets the system time. It prompts with `YYMMDDHHMMSS' and then does not set it: the clock is unchanged whether the answer comes from standard input or from six fields on the command line","dir":"CMDS","size":430,"help":{"note":"it prompts YYMMDDHHMMSS itself; there is no help flag"},"cat":"System & modules","sub":"System state"},{"name":"setime2","desc":"Y2K: set the system time, four-digit year","dir":"CMDS","size":21166,"help":{"cmd":"setime2 -?","text":"Syntax:    setime2 [\u003copt>] [\u003cyyy mm dd hh mm ss [am/pm]>] [\u003copt>]\nFunction:  set system date and time\nOptions:\n       -?    help message\n       -d    don't display time\n       -s    setime for battery backed-up clocks\nNote: 'YYY' is number of years after 1900"},"cat":"System & modules","sub":"Utilities"},{"name":"setimex","desc":"checks the system clock against a hardware time source and sets it: -s=\u003cdate> sets a date outright, -t tests, and -x or -e make the exit status say whether the time was right","dir":"CMDS","size":17526,"star":true,"help":{"cmd":"setimex -?","text":"SETIMEX  Version UTIL 2.80 by DESIGNA VLT 03.08.98\nUsage:\n  -n         Exit always with 0 (standard)\n  -x         Exit with 0 if time was ok; 1 for not ok\n  -e         Exit with 1 if time was ok; 0 for not ok\n\n  -s=\u003cdate>  Set this date (format see below)\n  -d=\u003cdate>  If old Date is wrong, then set this date (format see below)\n\n  -?         This helptable\n  -0         Debug\n  -t         Test (set incorrect time and correct immediately)\n\n  -1         Set Time to actual time - 1 hour\n  +1         Set Time to actual time + 1 hour\n  -s         starts OS9 'setime -s'\n\nPossible formats for Date:\n               YYYYMMDDhhmmss         YYYMMDDhhmmss    YYMMDDhhmmss\n               YYMMDDhhmm             YYYMMDDhhmm      (seconds will be 00)\n               YYMMDD                 YYYMMDD          (time will be 00:00:00)\n\nExit-Values:      0=No Error         1=Error"},"cat":"Time & calendar","sub":"Clocks"},{"name":"setterm","desc":"reports or sets the terminal type: `setterm' alone says what TERM names; give it a name to change it. When TERM names a terminal it does not know it falls back on SYS/setterm, the defaults file. DOC/setterm has the manual and a termcap.extra of further entries","src":"setterm2","origin":"Microware OS-9 archive","archive":"setterm2.lzh","needs":[{"path":"/dd/sys/setterm","missing":false,"dir":false,"bytes":2540},{"path":"/dd/sys/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/sys/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":9300,"star":true,"docs":true,"hassrc":true,"howto":"`setterm' alone reports what TERM says; give it a terminal name to change it. Run with no arguments and a terminal it wants to configure it goes FULL-SCREEN -- **ESC quits** (control-C also works, but ESC is the program's own way). SYS/setterm is the defaults file it falls back on when TERM names something it does not know, and DOC/setterm/termcap.extra has further entries you can add to SYS/termcap.","help":{"cmd":"setterm -?","text":"setterm v2.0 (c) 1991, 1995 by Dynamic Software Systems\n\nSyntax:   setterm [opts] [term type]\nFunction: Optionally prompt for terminal type.\n          Copy the terminal description to the TERMCAP\n          environment variable for faster access.\nOptions:\n          -s   send o/p to std output. Default is /pipe/setterm\n          -i   read std input. Default is to use std output\n               so it can access the terminal from Microware\n               shell .login scripts.\n          -x   don't set TERMCAP. Default is to set TERMCAP\n               unless the resulting command is too big for the shell.\n\nnormal use:    setterm [term type]\n               profile /pipe/setterm\n\n        or:    var=`setterm -si [term type]`\n               eval $var"},"cat":"Communications","sub":"Terminal & session"},{"name":"setyear","desc":"Y2K: set the year directly","dir":"CMDS","size":19488,"help":{"cmd":"setyear -?","text":"Syntax:    setyear \u003cYYYY>\nFunction:  set system date to year YYYY\n           (YYYY must be 1970 to 2050)"},"cat":"System & modules","sub":"Utilities"},{"name":"sgitopnm","desc":"SGI image to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false,"dir":false,"bytes":16059}],"dir":"CMDS/NETPBM","size":98286,"hassrc":true,"howto":"Cannot read a pipe -- same as pcxtoppm. Give it a filename or it reports \"premature EOF\".","help":{"cmd":"sgitopnm -?","text":"usage:  sgitopnm [-verbose] [sgifile]"},"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sh","desc":"Bourne shell v7.5 -- what the startup script runs.  It has a REAL `chd' where bash does not, and it cannot fork a program by absolute pathname here, which is the trade. DOC/README-SHELLS","needs":[{"path":"/dd/CMDS","missing":false,"dir":true,"bytes":null},{"path":"/dd/TMP","missing":false,"dir":true,"bytes":null},{"path":"/dd/SYS/profile","missing":false,"dir":false,"bytes":619},{"path":"/dd/SYS/errmsg","missing":false,"dir":false,"bytes":18543},{"path":"/dd/SYS/sh.logout","missing":true,"dir":false,"bytes":null},{"path":"/dd/TMP/","missing":false,"dir":true,"bytes":null},{"path":"/dd/SYS/termcap","missing":false,"dir":false,"bytes":963},{"path":"/h0/SYS/termcap","missing":false,"dir":false,"bytes":963}],"dir":"CMDS","size":77306,"docs":true,"help":{"cmd":"sh -?","text":"Syntax: sh [\u003copts>] [\u003cscriptfile>] [\u003carg1>] ... [\u003cargn>]\nFunction: Operating system user interface (shell)\nOptions:\n    -b            block input path while editing (default)\n    -C            redirected output requires '-' to overwrite file\n    -c            exit after reading and executing one command\n    -d[=\u003cmode>]   enable debug output [for \u003cmode>]\n    -e[=\u003cpath>]   print error explanations [using file \u003cpath>]\n    -f=\u003cprofile>  process profile file \u003cprofile>\n    -g            command completion includes execution directories\n    -h=\u003cn>        set the # of history lines to \u003cn>\n    -i            do not suppress shell messages (default if interactive)\n    -l            require 'logout' to logout (default automatic)\n    -p[=\u003cprompt>] print prompt \u003cprompt>\n    -r            do not process default profile files\n    -s            stop command execution\n    -t            echo input lines\n    -u            display references to unset variables\n    -v            verbose mode (same as '-t')\n    -w            kill all child processes and abort if carrier lost\n    -x            exit on error (default if non-interactive)\n    -y            try to make standard input path a tty\nAll options may be prefixed by an 'n' character to invert their sense"},"cat":"Shells","sub":"Shells"},{"name":"shar","desc":"Shell-archive creator, and one faulty check is all that stops it: its read-access test rejects every file that exists -- `No read access for file: \u003cname>' on its own standard output, for world-readable files that `cat' reads, absolute or relative, with -a or without. Hand it a name that is not there and the check passes vacuously: it writes the whole shell-archive preamble, cut line and all, and only then fails at open. For making an archive here, use `tar', `zoo' or `lha'.","dir":"CMDS","size":16740,"docs":true,"help":{"cmd":"shar -?","text":"shar: illegal option -- ?\nshar: No input files\nusage: shar [-u archive] [[-a] [-p prefix] [-d delim] [-bcv] files > archive]"},"cat":"Archives & compression","sub":"Create & extract"},{"name":"shdev","desc":"lists the system's device table: what is mounted and the driver behind each","dir":"CMDS","size":3132,"star":true,"help":{"note
