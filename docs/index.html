its bar chart and its answer (156 MHz, which is the emulator), then traps on vector $07 and takes the session down with it","dir":"CMDS","size":8246,"star":true,"cat":"System & modules","sub":"Utilities"},{"name":"creadoc","desc":"extract the documentation header (C++ ... C--) from every .f file in the current directory into creadoc.txt -- an early Fortran documentation generator.  It reads each file name from column 53 of a `dir -eadu' listing, where this disk's dir puts it at 54 (and 2026, printed `126', pushes it a column further), so it opens the name with a leading space and stops.  A dir-format brittleness, not the CPU; a one-constant source fix.  DOC/rtf/biory.doc is its output for biory.f.  Source: SRC/rtf/creadoc.f","src":"rtf","origin":"EFFO forum","archive":"disk 5 SPRACHEN/FORTRAN/CREADOC","dir":"CMDS","size":5748,"hassrc":true,"cat":"Compilers & build","sub":"Fortran"},{"name":"crib","desc":"cribbage.  Needs TERM set, so run it from a login session -- bare it says `Unknown terminal type'","src":"crib","origin":"usenet archive","archive":"crib.ar","needs":[{"path":"/dd/GAMES/crib/crib.instr","missing":false},{"path":"/dd/GAMES/crib/criblog","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":53634,"docs":true,"hassrc":true,"howto":"Full-screen cribbage, and it wants TERM -- run it from a login session. Answer the instructions question, choose a long or short game, and discard by naming a card, `7H'. Control-C gets you out.","cat":"Games","sub":"Board & card"},{"name":"cribbage","desc":"cribbage -- offers instructions before it deals.  Needs TERM, so run it from a login session","needs":[{"path":"/h0/games/crib/crib.instr","missing":false},{"path":"/h0/games/crib/criblog","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":40608,"star":true,"howto":"The other cribbage, the same shape: TERM must be set, it offers the rules first, then cuts for the crib. Control-C gets you out.","cat":"Games","sub":"Board & card"},{"name":"cron","desc":"run commands at specified times (daemon)","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","needs":[{"path":"/dd/usr/lib/crontab","missing":false}],"dir":"CMDS","size":5126,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Scheduling"},{"name":"crypto","desc":"cryptogram puzzle solver's assistant","src":"crypto","origin":"usenet archive","archive":"crypto.ar","needs":[{"path":"/dd/GAMES/dict","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":39736,"usage":"usage: crypto [-cegnru] [file(s)]","star":true,"docs":true,"hassrc":true,"howto":"`crypto -h' is the real option list and `-i' the interactive commands; its bare answer is two lines naming those. As a FILTER it ends the emulator session here, so read the help rather than piping through it.","cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"csl","desc":"Microware's C Shared Library, for programs built with Ultra C rather than cc 3.2 (68000)","dir":"CMDS","size":48366,"cat":"System & modules","sub":"Microware runtime"},{"name":"csl020","desc":"the same, for 68020/030/040","dir":"CMDS","size":43794,"cat":"System & modules","sub":"Microware runtime"},{"name":"ctags","desc":"generate a vi tags file from C source (BSD)","dir":"CMDS","size":25972,"usage":"usage: ctags [-BFadtuwvx] [-f tagsfile] file ...\n  -B : use backward searching patterns (? ?)\n  -F : use forward searching patterns (/ /)\n  -a : append to 'tags' file\n  -d : create tags for #define's without arguments\n  -f : place tag description in 'tagsfile'\n  -t : create tags for typedefs, structs, unions\n  -u : update specified files in 'tags'\n  -v : prepare index for 'vgrind'\n  -w : suppress warnings\n  -x : prepare xref index","docs":true,"cat":"Developer tools","sub":"Source navigation"},{"name":"ctags.elvis","desc":"elvis 1.7's ctags; CMDS/ctags is the BSD one","needs":[{"path":"/dd/sys/Errmsg","missing":false},{"path":"/dd/SYS/password","missing":false}],"dir":"CMDS/REBUILT","size":28032,"usage":"usage: ctags [flags] filenames...\n-s  include static functions\n-t  include typedefs\n-v  include variable declarations\n-r  generate a \"refs\" file, too\n-a  append to \"tags\", instead of overwriting","cat":"Developer tools","sub":"Tags"},{"name":"cursive","desc":"generate a horizontal cursive banner","src":"cursive","origin":"usenet archive","archive":"cursive.ar","dir":"CMDS","size":23590,"usage":"usage: cursive [-tn] [-in] message","docs":true,"hassrc":true,"cat":"Text tools","sub":"Banners & text art"},{"name":"cut","desc":"cut selected fields from each line","src":"cutpaste","origin":"usenet archive","archive":"cutpaste.ar","dir":"CMDS","size":17596,"docs":true,"hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"cuts","desc":"Coco Usenet Transfer Utility -- encodes a binary as text that will pass through electronic mail, in a form that survives gateways between ASCII and EBCDIC machines; `-d' decodes, which is the half worth having.  The encoder (`-e') asks for billions of bytes of memory, is refused, and writes empty data lines until it is stopped.","src":"cuts","origin":"hc disk","archive":"SOURCES/USENET/cuts.ar","dir":"CMDS","size":8794,"usage":"Usage: cuts \u003c-d> [-o name] \u003cfile>...","star":true,"docs":true,"hassrc":true,"howto":"Coco Usenet Transfer Utility: it encodes a binary as mail-safe text and `-d' decodes a cuts file. Use `-d' for the half worth having; the encoder (`-e') asks for gigabytes of memory and is refused.","cat":"Encoding & conversion","sub":"Text encodings"},{"name":"cvtbase","desc":"converts a number between bases.  The bases are named by key -- b, d, h or x, o -- or by their value, and the number comes on standard input: `echo 255 ! cvtbase d h' answers ff","src":"misc","origin":"usenet archive","archive":"misc.ar","dir":"CMDS","size":16476,"hassrc":true,"howto":"The BASES are the arguments and the NUMBER comes on standard input: `echo 255 ! cvtbase d h' answers ff, `cvtbase d b' answers 11111111. Bases are named b, d, h or x, o -- or by their actual digit characters.","cat":"Maths & calculators","sub":"Calculators"},{"name":"cxref","desc":"C cross-reference lister -- numbered listing + symbol table","dir":"CMDS","size":5594,"usage":"Syntax:\t\tcxref [-opts] [path]\nFunction:\tCreate and print a 'C' cross-reference\nOptions:\t-x   make cross-reference only","star":true,"cat":"Developer tools","sub":"Source navigation"},{"name":"cyberwar","desc":"CyberWar -- Stephen Carville's game, needs G-Windows","dir":"CMDS/GAMES","size":93966,"star":true,"docs":true,"cat":"Games","sub":"Other games"},{"name":"dam","desc":"display the disk allocation map -- dam [\u003cdrive>]","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2626,"star":true,"hassrc":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"dback","desc":"directory backup: walks a directory and issues an OS-9 `copy' for every file that has changed, so what you see is the list of copies it wants","src":"dback","origin":"Microware OS-9 archive","archive":"dback.lzh","dir":"CMDS","size":14898,"usage":"Usage: Dback [-options] \u003cfromdir> \u003ctodir> [-options]","docs":true,"hassrc":true,"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"dbz","desc":"the news history database","dir":"CMDS/NEWS","size":13344,"star":true,"howto":"The news history database from C News: `dbz [-a] [-x] [-c] database [file]...'. Part of a news system.","cat":"Communications","sub":"News"},{"name":"dclock","desc":"a digital clock for G-Windows","dir":"CMDS/GAMES","size":5652,"usage":"Usage: dclock [options]\noptions:\n  -m = use 24 hour format (default = 12 hour format).\n  -h = don't hibernate on startup.","star":true,"cat":"Games","sub":"Other games"},{"name":"dearc","desc":"Extract an MS-DOS .ARC archive (Carl Kreider).  arc and marc handle the OS-9 side","dir":"CMDS","size":7680,"usage":"Usage: dearc [p] filename","star":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"dedit","desc":"BASIC09 disk sector editor (Carl Kreider) -- read, edit and write raw sectors, decode a disk's identification sector.  I-CODE, not 68000 code: run it with runb and the bare module name, like bio and wysetime.  Nine modules in the one file.","dir":"CMDS","size":13514,"basic09":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"delbak","desc":"delete backup files (*_bak) in a directory tree","src":"cowen_tools","origin":"Microware OS-9 archive","archive":"cowen_tools.lzh","dir":"CMDS","size":3352,"usage":"Usage: delbak [-options] [directory] [-options]\n-n   = no recursion\n-l   = list only","star":true,"hassrc":true,"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"demerge","desc":"split a merged file back into its parts","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/ASSEMBLER (68k asm)","dir":"CMDS","size":456,"usage":"Syntax:   demerge \u003cpath>\nFunction: demerges a file of merged modules to single module\n   files named as modules","hassrc":true,"howto":"OS-9's `merge' is concatenation and there is no `merge' binary here, so `cat a b > c' makes the file demerge takes apart. There is no `od' either -- `dump' is the hex dump.","cat":"System & modules","sub":"Utilities"},{"name":"demo","desc":"egetopt option-parsing demonstration","dir":"CMDS","size":11082,"cat":"System & modules","sub":"Utilities"},{"name":"des","desc":"DES file encryption -- it writes `\u003cfile>.n' and removes the original.  It does not restore a file run through it twice with the same key (the result checksums 00000000), so for a round trip use `xcrypt'","src":"des","origin":"usenet archive","archive":"des.ar","dir":"CMDS","size":6344,"star":true,"docs":true,"hassrc":true,"howto":"It takes FILES and has no option flags at all -- `des file ...'. `-e' and `-?' are read as filenames and earn `Can't read -e.'","cat":"Encoding & conversion","sub":"Ciphers & hashes"},{"name":"detab","desc":"tabs to spaces","dir":"CMDS","size":2138,"usage":"Usage: detab [-tn] [infile] or [\u003cinfile]\n-tn = n is tabstop","star":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"deton","desc":"time out an I/O read using an alarm: `deton [seconds]', an example rather than a tool.  For converting tabs, see `detab' and `expand'","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2974,"usage":"syntax: deton [seconds]\nfunction: demonstrate use of alarm to time out I/O\noptions: none","star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"devprc","desc":"show which device each process holds a path to: `-a' walks every process and lists its open paths and the device behind each.  `top' prints its headings and then crashes -- its own bug, not the system: it asks F$GPrDsc about the root process's parent (process 0), does not check the \"no such process\" it correctly gets back, and reads an unfilled buffer.  aprocs and sysmon read the same state and run.","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS","size":17922,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"dfiles","desc":"find duplicate files under a directory and write out the `cmp' commands that would prove them identical, so the list itself is the answer","src":"dfiles","origin":"EFFO forum","archive":"disk 15 SOFTWARE/C/DFILES","info":{"version":"1.4","purpose":"search for double files on disk","status":"final (hopefully)","language":"C","author":"Christian Mahr","availability":"Public","conditions":"no conditions","copyright":"(C) Christian Mahr"},"dir":"CMDS","size":8798,"star":true,"docs":true,"hassrc":true,"cat":"Files & directories","sub":"Find & compare"},{"name":"dhry","desc":"Microware cc","dir":"CMDS/DHRY","size":25000,"docs":true,"hassrc":true,"howto":"Dhrystone 2.0. Twelve builds of the same source sit in CMDS/DHRY -- run several and compare, which is what tells you the compiler's cost. Run under an emulator the number describes the host machine, not a 68000.","cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc","desc":"GCC 1.x","dir":"CMDS/DHRY","size":8804,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2","desc":"GCC 2.x","dir":"CMDS/DHRY","size":9510,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2in","desc":"GCC 2.x, inlined","dir":"CMDS/DHRY","size":9506,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2mx","desc":"GCC 2.x, mixed","dir":"CMDS/DHRY","size":9450,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcc2o2","desc":"GCC 2.x, optimised","dir":"CMDS/DHRY","size":8808,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGccin","desc":"GCC 1.x, inlined","dir":"CMDS/DHRY","size":8810,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGccmx","desc":"GCC 1.x, mixed","dir":"CMDS/DHRY","size":8750,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryGcco2","desc":"GCC 1.x, optimised","dir":"CMDS/DHRY","size":8806,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryO2","desc":"Microware cc, optimised","dir":"CMDS/DHRY","size":24854,"howto":"All eleven Dhrystone builds READ A RUN COUNT FROM STANDARD INPUT before they start -- run bare they print two lines and wait. `echo 200000 | dhryO2'. Under os9exec even 20000 runs finish inside one tick of the clock, so it answers \"Measured time too small ... Please increase number of runs\" rather than a rate; the comparison between builds is what they are here for, and on real hardware it works as intended.","cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryshamu","desc":"Shamus build","dir":"CMDS/DHRY","size":8750,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"dhryshamu2","desc":"Shamus build, second variant","dir":"CMDS/DHRY","size":9454,"star":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"diff","desc":"GNU diff 1.1 -- handles CR text files.","src":"diff","origin":"usenet archive","archive":"diff.ar   [also built from eff_effdiff]","dir":"CMDS","size":31240,"usage":"Usage: diff [-options] file1 file2\n-I option:\n-F option:","star":true,"docs":true,"hassrc":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"diff_1.1","desc":"another build of GNU diff 1.1","dir":"CMDS/REBUILT","size":61968,"usage":"Syntax   : diff [\u003coptions>] file1 file2\nFunction : generate differences of two files\nOptions  :","cat":"Text tools","sub":"Alternates"},{"name":"digclk","desc":"digital clock with hostname","src":"digclk","origin":"usenet archive","archive":"digclk.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":38194,"usage":"Usage: digclk [refresh_rate]","star":true,"docs":true,"hassrc":true,"cat":"Time & calendar","sub":"Clocks"},{"name":"dinfo","desc":"disk/device information","src":"eff_dinfo","origin":"EFFO forum","archive":"disk 12  SOFTWARE/C/DINFO","dir":"CMDS","size":7348,"usage":"Syntax:   dinfo [\u003copts>] {\u003cdevice name> [\u003copts>]}\nFunction: Show information about a RBF Disk Device\n   (Substitute for OS9 \"free\" utility)\nOptions:  -e   : Extended display\n   -f[[=]\u003cnum>] : Show fragmentation info. \u003cnum> specifies max\n   size (in clusters) of blocks to be reported as\n   \"small blocks\". Default is 4 clusters\n   -l   : detailed list of unused blocks\n   -b[=]\u003csize>  : set buffer size","star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"dir","desc":"directory listing -- `dir [\u003copts>] \u003cdirectory>'; `-e' adds owner, dates, attributes and size","dir":"CMDS","size":9680,"usage":"Syntax: dir [\u003copts>] {\u003cdir names> [\u003copts>]}\nFunction: display directory contents\nOptions:\n-a   show all files\n-c   show creation date\n-d   show directories with a slash\n-e   extended dir listing\n-f   show fragmentation and link count\n-h   show file size in hex\n-k   show file size in kilo bytes\n-m   sort 'last modified' field\n-n   treat dirs like files\n-p   follow the PATH environment dir names\n-r   recursive dir listings","star":true,"cat":"Files & directories","sub":"List & navigate"},{"name":"dirname","desc":"strip filename from a pathname (M.C. Gregorie, 1994)","dir":"CMDS","size":2074,"usage":"Syntax:   dirname \u003cpath>\nFunction: Outputs string after deleting\n   anything after the final /\nOptions:  none","star":true,"cat":"Files & directories","sub":"Paths"},{"name":"disable","desc":"disable a UUCP device","src":"bnu_uucp","origin":"Microware OS-9 archive","archive":"uucp.lzh BNU/UUCP/SRC","needs":[{"path":"/DD/SYS/ttylist","missing":true}],"dir":"CMDS/UUCP","size":4280,"usage":"Syntax: disable \u003cport>\nFunction: Turn OFF MTSMon on \u003cport>","star":true,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"disktest","desc":"measure disk performance  [no military use -- DOC/EFFO-INFO]","src":"forum14","origin":"Microware OS-9 archive","archive":"forum14.lzh","info":{"version":"1.0","purpose":"diskperformance test","status":"final","hardware":"none","language":"C","author":"Stephan Paschedag, CH-8708 Maennedorf","availability":"public","conditions":"no military use","copyright":"by St.Paschedag","restrictions":"will not work on small RAMdisks of fast systems"},"dir":"CMDS","size":23802,"usage":"Syntax   : disktest [\u003copt>]\nFunction : measure diskperformance\nOptions  : -?  show this text","docs":true,"hassrc":true,"military":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"divide","desc":"SPLIT A FILE into pieces -- Farside Systems 1992, `divide -l=\u003clines> \u003cinfile> [\u003coutfile>]'","dir":"CMDS","size":4708,"star":true,"cat":"Files & directories","sub":"Split & join"},{"name":"djpeg","desc":"JPEG decompressor, jpeg-5a.  Decodes a JPEG to a PNM.  Its output ends each header line with LF where the netpbm here wants CR, so patch the three separators with `pbyte' to pipe it on; DOC/STATUS has the offsets.","needs":[{"path":"/dd/TEMP","missing":true}],"dir":"CMDS","size":55960,"usage":"usage: djpeg [switches]","docs":true,"howto":"Decompresses a JPEG: `djpeg -pnm image.jpg > out.ppm`. The disk has one to try, SRC/jpeglib/JPEG_5A/testimg.jpg. Its output will NOT pipe into netpbm unpatched -- djpeg writes LF at the end of a PNM header line and netpbm here wants CR. `pbyte out.ppm 2 0d` and the same at the two later separators fixes it; DOC/STATUS has the offsets.","cat":"Graphics & images","sub":"JPEG"},{"name":"djpeg.070","desc":"JPEG decompressor, a build for another processor.  It decodes a JPEG, including one the 68000 cjpeg wrote; its companion encoder is cjpeg.070","dir":"CMDS","size":79586,"usage":"usage: djpeg.070 [switches]","cat":"Graphics & images","sub":"JPEG"},{"name":"dld","desc":"XModem download","dir":"CMDS/COMMS","size":4122,"usage":"Syntax: dld \u003cfile>\nFunction: download from \u003cfile> using XMODEM protocol","star":true,"cat":"Communications","sub":"Terminal & transfer"},{"name":"dload","desc":"load a data file into a data module: `dload \u003cfilename>'. Nothing to do with serial downloads -- `sbreak' and `break' are the serial-line examples here","dir":"CMDS","size":3058,"usage":"Syntax: dload \u003cfilename>\nFunction: loads datafile into datamodule","star":true,"cat":"System & modules","sub":"Utilities"},{"name":"dm","desc":"Disk Master 1.4, a full-screen two-pane disk and directory browser with a file-information panel beside the listing.  It runs the commands on its bottom line through system(), so SHELL must name a shell that can carry them out: with SHELL=/dd/CMDS/sh it runs completely.  Its help file is SYS/dm.hlp","needs":[{"path":"/dd/sys/dm.hlp","missing":false}],"dir":"CMDS","size":35436,"usage":"Usage: DiskMaster [-c] [-d\u003cdir name>]\n -c don't clear screen on exit","star":true,"docs":true,"hassrc":true,"howto":"Disk Master 1.4, a full-screen disk browser. It runs the commands on its bottom line through system(), so SHELL must name a shell that can carry them out; with SHELL=/dd/CMDS/sh it runs completely, listing and file-information panel and all.","cat":"Files & directories","sub":"List & navigate"},{"name":"dmake","desc":"dmake 3.70 - parallel make with its own makefile dialect","needs":[{"path":"/h0/SYS/startup.mk","missing":false}],"dir":"CMDS","size":92930,"star":true,"cat":"Compilers & build","sub":"Make & generators"},{"name":"dotilde","desc":"the mailer's TILDE-ESCAPE handler: it reads a message from standard input and acts on the `~' commands in it, answering `Unrecognized tilde command' and `Continuing...type \".\" or \u003cESC> to end message...'","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/UUCP","size":18634,"star":true,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"dpark","desc":"park the DISK HEAD: `dpark [/device]' restores an RBF device's head to track 00, which is what you did before moving a drive.","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":2418,"usage":"Syntax:   dpark [/device]\nFunction: restore RBF device head to TRK00\nOptions:  none","star":true,"hassrc":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"draw","desc":"character-graphics drawing program","src":"draw","origin":"hc disk","archive":"SOURCES/USENET/draw.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":53818,"hassrc":true,"cat":"Graphics & images","sub":"Drawing & display"},{"name":"drop","desc":"put back exactly what keep wrote.  It refuses to remove any file whose checksum has changed, so your saves and scores are safe from it by construction.","needs":[{"path":"/dd/SYS/kept","missing":true},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":24958,"usage":"Usage: keep [-n] [-f] [-q] [-s] [-p \u003cdir>] \u003cprogram>...","cat":"System & modules","sub":"Keeping and dropping"},{"name":"du","desc":"disk usage, by directory","src":"eff_du","origin":"EFFO forum","archive":"disk 4   SPRACHEN/C/DU","dir":"CMDS","size":4854,"usage":"Syntax: du \u003cdirectory>\nFunction: displays information about disk usage\nOptions : -a displays just the final summary","star":true,"hassrc":true,"cat":"Files & directories","sub":"Find & compare"},{"name":"dump","desc":"hex dump of a file or module","dir":"CMDS","size":1712,"usage":"Syntax: dump [\u003copts>] \u003cpath/module> [\u003copts>] [\u003cstarting byte>] [\u003copts>]\nFunction: formatted display of contents of a file/module\nOptions:\n-c   don't compress duplicate lines\n-x   path implies execution directory\n-m   dump memory module","docs":true,"howto":"This is the hex dump on this disk. There is no `od'.","cat":"Text tools","sub":"Count & inspect"},{"name":"dvialw","desc":"DVI to Apple LaserWriter","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","size":64794,"usage":"Usage: dvialw [opts] dvifiles\nOptions:\n-a   cache font files\n-b   print in backwards order","howto":"Works, and so do the other nine dvi* drivers. The disk ships the MetaFont sources, not the ready-made bitmaps, so each driver says \"Font file [cmr10 [300 dpi]] could not be opened ... Proceeding with zero size characters\" once per font and writes a page with the right layout and no glyphs. FONTS/PK300 and PK144 hold a Makefile each; generate the bitmaps from the MetaFont sources in SYS/TEX/MFINPUTS. Output goes to \u003cdvifile>_alw beside the input, not to standard output.","cat":"Text tools","sub":"DVI drivers"},{"name":"dvidjp","desc":"DVI to HP DeskJet Plus","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","size":55778,"usage":"Usage: dvidjp [opts] dvifiles\nOptions:\n-a   cache font files\n-b   print in backwards order","cat":"Text tools","sub":"DVI drivers"},{"name":"dvieps","desc":"DVI to Epson","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","size":55532,"usage":"Usage: dvieps [opts] dvifiles\nOptions:\n-a   cache font files\n-b   print in backwards order","cat":"Text tools","sub":"DVI drivers"},{"name":"dviimp","desc":"DVI to Imagen","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","size":54676,"usage":"Usage: dviimp [opts] dvifiles\nOptions:\n-a   cache font files\n-b   print in backwards order","cat":"Text tools","sub":"DVI drivers"},{"name":"dvijep","desc":"DVI to HP LaserJet Plus","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","s DVI to PostScript -- pair it with gs33","needs":[{"path":"/DD/SYS/TEX/FONTS/TFM","missing":false},{"path":"/DD/USR/TEX/FONTS/TFM","missing":true},{"path":"/DD/TEX/FONTS/TFM","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true},{"path":"/DD/TEX/FONTS/VF","missing":true},{"path":"/DD/SYS/TEX/DVIPS","missing":true},{"path":"/DD/USR/TEX/DVIPS","missing":true},{"path":"/DD/TEX/DVIPS","missing":true},{"path":"/DD/SYS/TEX/FONTS/PK","missing":true},{"path":"/DD/USR/TEX/FONTS/PK","missing":true},{"path":"/DD/TEX/FONTS/PK","missing":true}],"dir":"CMDS/TEXCMDS","size":93342,"usage":"Usage: dvips [options] filename[.dvi]","howto":"DVI to PostScript. It wants a header file tex.pro -- point it at one, or use `dvialw', which writes PostScript too.","cat":"Text tools","sub":"TeX"},{"name":"dvitos","desc":"DVI to Toshiba","needs":[{"path":"/dd/sys/tex/docs/dvi.help","missing":false},{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/TEX/FONTS/","missing":true},{"path":"/DD/TEX/FONTS","missing":true}],"dir":"CMDS/TEXCMDS","size":55070,"usage":"Usage: dvitos [opts] dvifiles\nOptions:\n-a   cache font files\n-b   print in backwards order","cat":"Text tools","sub":"DVI drivers"},{"name":"dvitype","desc":"show what is inside a .dvi file, as text","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":73712,"usage":"Usage: dvitype \u003cdvi file>.","howto":"`dvitype \u003cfile>.dvi \u003c /nil'. It asks five questions -- output level, starting page, page count, device resolution, magnification -- and takes the default for each at end of file. Redirect its input so a script does not wait on the questions.","cat":"Text tools","sub":"TeX"},{"name":"e","desc":"SEDT screen editor, the small VT220 build.  Reads SYS/sedt.keys, sedt.ruler0 and sedt.help, which ship","dir":"CMDS","size":66786,"cat":"System & modules","sub":"Utilities"},{"name":"ed","desc":"GNU ed 0.2, the line editor.  It keeps its scratch file on /r0, a RAM disk, so mount one (`mount -r=256k /r0'); DOC/README-RUNNING has the details","dir":"CMDS","size":85810,"usage":"Usage: ed [OPTION]... [FILE]","star":true,"docs":true,"hassrc":true,"howto":"Needs a /r0 RAM disk for its scratch file; `mount -r=256k /r0' provides one. Then `ed \u003cfile>', with ed's usual commands: 1,4p prints, s/a/b/ substitutes, w writes, q quits.","cat":"Editors","sub":"Line & stream"},{"name":"ediff","desc":"put `diff' output into plain English: `diff \u003cf1> \u003cf2> ! ediff', or `ediff \u003cfile' for a diff you already have.  A one-line change comes out as `-------- 1 line changed at 3 from: ... to: ...'.  `diff' does the comparing; this makes the answer readable","src":"eff_ediff","origin":"EFFO forum","archive":"disk 7   C/EDIFF","dir":"CMDS","size":18814,"usage":"Syntax   : 'ediff \u003cfile'  or  'diff \u003cf1> \u003cf2> ! ediff'\nFunction : print output of 'diff' in plain text\nOptions  : none","hassrc":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"edir","desc":"list the EVENT directory -- OS-9 events and their values","src":"effo_forum4","origin":"EFFO forum","archive":"disk 4 SPRACHEN/C/EVENTS","dir":"CMDS","size":2968,"usage":"Syntax: edir [\u003copts>]\nFunction: display event directory\nOptions:\n-e\tprint extendet event directory\n-u\tprint unformatted listing","star":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"EditLibr","desc":"Home Librarian: edit a catalogue","src":"homelibr","origin":"microware","archive":"APPS/hl10obin.lzh","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":197374,"usage":"Syntax: EditLibr [opts]","hassrc":true,"howto":"Part of the HL10 librarian set. Wants an edit file as a parameter; `EditLibr' alone prints its syntax.","cat":"Files & directories","sub":"Home Librarian"},{"name":"editor","desc":"a full-screen file picker that hands the file you choose to `umacs': a lettered list of the directory, `+' and `-' to page, `.' to change directory.  Run it bare; given a path on the command line it stops on an illegal instruction. `gshell' and `assembler' are the same menu in front of other programs.","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":22014,"usage":"Syntax: editor [\u003cpath>]\nFunction: a menue driven umacs shell\nOptions: none","hassrc":true,"howto":"Run it bare: a full-screen file picker for umacs. Given a file on the command line it stops on an illegal instruction. Control-C leaves the menu.","cat":"Editors","sub":"Line & stream"},{"name":"elm","desc":"the Elm mail reader itself -- full-screen, menu-driven","needs":[{"path":"/dd/USR/LIB/ELM/aliases","missing":true},{"path":"/dd/USR/LIB/ELM","missing":false},{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/TMP/","missing":false},{"path":"/dd/USR/LIB/ELM/elm.rc","missing":true},{"path":"/dd/USR/LIB/ELM/elmrc_info","missing":true},{"path":"/dd/nlslib/","missing":true},{"path":"/dd/SYS/domain","missing":true},{"path":"/dd/TMP","missing":false},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/ELM","size":307136,"star":true,"docs":true,"howto":"The full-screen mail reader. It opens on the folder that ships for this account, `~/SPOOL/MAIL/tester', showing one message. `readmsg 1' prints a message without opening the reader; `messages' counts the folder. Mail lives at /dd/SPOOL/MAIL/\u003cuser>, and SYS/login points MAIL at it.","cat":"Communications","sub":"Mail"},{"name":"elvis","desc":"Elvis 1.7 -- the best-documented of this disk's three vi editors, and the one with the most options.  Built from the source in CMDS/archives.  Needs TERM and TERMCAP; runs with no program under its other personalities and need elvis present to run. IT ALSO NEEDS A /dd/tmp, and the path is compiled in: on a /dd without that directory it stops before drawing anything with `Can't create temp file... Does directory \"/dd/tmp\" exist?'.  This disk ships one, so it bites on the machine you copy elvis TO.  Either `makdir /dd/tmp' or, before starting it, `setenv EXINIT \"set directory=\u003ca dir you have>\"' -- elvis reads EXINIT before creating the temp file.  `vi' has the same compiled-in /dd/tmp; the PVIC builds do not.  DOC/README-VI has the table","needs":[{"path":"/dd/sys/Errmsg","missing":false},{"path":"/dd/SYS/password","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/tmp","missing":false}],"dir":"CMDS","size":111944,"usage":"Usage: %c /regular expression/ command","docs":true,"hassrc":true,"howto":"A full vi/ex clone. Needs TERM and TERMCAP set -- `SYS/login' does both. `view' opens read-only, REBUILT/vi.elvis is the same program as vi, and all of them exec CMDS/elvis, so it must be present.","cat":"Editors","sub":"vi clones"},{"name":"elvis_input","desc":"elvis under its `input' personality -- it opens already in insert mode.  The name is load-bearing: elvis's wrapper picks its personality from the LAST LETTER of the name it was invoked by, so a name ending in another letter falls through to plain vi.  CMDS/input is a different program entirely","dir":"CMDS/REBUILT","size":15144,"cat":"Editors","sub":"vi clones"},{"name":"elvprsv","desc":"Preserve an elvis session across a crash","needs":[{"path":"/dd/sys/Errmsg","missing":false},{"path":"/dd/SYS/password","missing":false},{"path":"/dd/usr/preserve/Index","missing":true},{"path":"/dd/usr/preserve","missing":true}],"dir":"CMDS","size":25822,"docs":true,"cat":"Editors","sub":"vi clones"},{"name":"elvrec","desc":"recover an elvis buffer preserved when elvis died.  Run with NO ARGUMENTS it lists what is recoverable -- so its silence here means there is nothing, which is true.  It reads `/usr/preserve/Index', and OS-9 cannot have a /usr at all: a leading /name is a DEVICE, not a directory.  So on this machine it can never find anything, whatever is placed under /dd.  `expreserve' is the half that saves. DOC/elvrec/elvrec.doc.","needs":[{"path":"/dd/usr/preserve/Index","missing":true},{"path":"/dd/sys/Errmsg","missing":false},{"path":"/dd/SYS/password","missing":false}],"dir":"CMDS","size":24156,"usage":"usage: elvrec [preserved_file [recovery_file]]","docs":true,"howto":"Bare, it lists what elvis preserved; nothing listed means nothing was preserved.","cat":"Editors","sub":"vi clones"},{"name":"em","desc":"MicroEMACS 3.8b, a screen editor with Emacs keys","needs":[{"path":"/dd/sys/","missing":false},{"path":"/dd/lib/","missing":false},{"path":"/dd/sys/emacsrc","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":79590,"usage":"Syntax: em [\u003copts>] [\u003cfilenames> [\u003copts>]]\nFunction: MicroEMACS screen editor\nOptions:\n-v   view file\n-e   edit file\n-sSTRING  initial search string\n-gLINE   initial goto\n-r   restrictive use\n-kSTRING  crypt key","howto":"A screen editor. It stops with \"Environment variable TERM not defined!\" unless TERM is set -- SYS/login sets it, so run it from a login shell rather than bare.","cat":"Editors","sub":"emacs family"},{"name":"emacs","desc":"MicroEmacs 4.00","needs":[{"path":"/h0/memacs400/cmd/","missing":true},{"path":"/h0/memacs400/","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":144910,"star":true,"docs":true,"howto":"Full-screen editor, MicroEMACS keys. Control-X control-C quits. Its macros and help are in USR/LIB/EMACS.","cat":"Editors","sub":"emacs family"},{"name":"emacs.mm1","desc":"MicroEMACS 4.00 built for the MM/1 -- the same editor as `emacs'","needs":[{"path":"/h0/memacs400/cmd/","missing":true},{"path":"/h0/memacs400/","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":131362,"star":true,"howto":"The MM/1 build of `emacs'; the same keys, control-X control-C quits.","cat":"Editors","sub":"emacs family"},{"name":"enable","desc":"re-enable a UUCP device","src":"bnu_uucp","origin":"Microware OS-9 archive","archive":"uucp.lzh BNU/UUCP/SRC","needs":[{"path":"/DD/SYS/ttylist","missing":true}],"dir":"CMDS/UUCP","size":4378,"usage":"Syntax: enable [\u003copts>] \u003cport> [\u003copts>]\nFunction: Turn ON MTSMon on \u003cport>\nOptions:\n-p  no prompt till signal","star":true,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"england","desc":"a year of random weather, day by day, for a tabletop game: the mid-Atlantic climate profile on the Gregorian calendar. `england 2' does two years.  Six builds of one program differ only in climate and calendar: england, florida (Gulf coast), georgia (south Atlantic), minnesota (north Atlantic), japan (north Pacific, Japanese calendar) and shire (mid-Atlantic, Middle-earth calendar)","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"howto":"One of six weather simulators that differ only in climate and calendar: england, florida, georgia, minnesota, japan (Japanese calendar) and shire (Middle-earth). Each prints a day's weather and stops.","cat":"Amusements","sub":"Simulated weather"},{"name":"env","desc":"Print or set the environment for a command (GNU)","needs":[{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/errmsg.short","missing":true}],"dir":"CMDS","size":9674,"usage":"Usage: env [OPTION]... [-] [NAME=VALUE]... [COMMAND [ARG]...]","star":true,"cat":"Shells","sub":"Shell utilities"},{"name":"eo","desc":"EXECUTE A COMMAND ON EVERY LINE OF A FILE -- an xargs. `eo \u003cfile> \u003ccommand> @' runs \u003ccommand> once per line with `@' replaced by the line; -p takes the lines from a pipe, -q runs quietly, -e stops on the first error. Marc Balmer, version 1.8. It shells out, so it needs SHELL set, which SYS/login does.","src":"eff_eo","origin":"EFFO forum","archive":"disk 11  SOFTWARE/C/EO","needs":[{"path":"/h0/tmp/","missing":false}],"dir":"CMDS","size":3952,"star":true,"docs":true,"hassrc":true,"howto":"Runs a command on every line of a file, with `@' standing for the line: `eo \u003cfile> \u003ccommand> @'. It shells out, so it needs SHELL set to a shell that takes a command line as one argument -- SYS/login sets `SHELL=/dd/CMDS/ksh' and that is what makes it work. Without it, `can't execute /dd/bash'. `-p' takes the lines from a pipe instead of a file.","cat":"Text tools","sub":"Transform & filter"},{"name":"ephem","desc":"ephem - astronomical ephemeris","needs":[{"path":"/dd/sys/ephem.cfg","missing":false},{"path":"/dd/sys/ephem.db","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","siz EVENTS","dir":"CMDS","size":2310,"usage":"Syntax: eunlink {\u003cevent>}\nFunction: unlink an event\nOptions: none","star":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"every","desc":"run a command at intervals","dir":"CMDS","size":2452,"usage":"Syntax: every \u003ctime> \u003cprogname> [\u003cprogopts>]\nFunction: repeat program every \u003ctime> seconds","star":true,"cat":"System & modules","sub":"Scheduling"},{"name":"exist","desc":"test file existence","dir":"CMDS","size":2702,"star":true,"cat":"Shells","sub":"Shell helpers"},{"name":"expand","desc":"Turn tabs into spaces (GNU)","dir":"CMDS","size":27060,"usage":"Usage: expand [-tab1[,tab2[,...]]] [-t tab1[,tab2[,...]]] [-i]","cat":"Text tools","sub":"Transform & filter"},{"name":"expire","desc":"delete news articles past their expiry date","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP/active","missing":false},{"path":"/DD/SYS/UUCP","missing":false}],"dir":"CMDS/UUCP","size":15472,"star":true,"hassrc":true,"cat":"Communications","sub":"News"},{"name":"expr","desc":"Evaluate an expression (GNU)","needs":[{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/errmsg.short","missing":true}],"dir":"CMDS","size":34690,"star":true,"docs":true,"cat":"Shells","sub":"Shell utilities"},{"name":"expreserve","desc":"vi's crash-recovery helper: preserves an edit buffer when the editor dies.  Like ksh it reads the terminal asking for more bytes than you type (388), so it depends on the same emulator behaviour -- see DOC/README-KSH","needs":[{"path":"/dd/MAIL/mail_","missing":false},{"path":"/dd/PRESERVE/Exaa","missing":true}],"dir":"CMDS","size":4128,"star":true,"howto":"Saves a vi buffer when the editor or the line dies; vi runs it for you rather than you running it.","cat":"System & modules","sub":"Utilities"},{"name":"exrecover","desc":"recover a vi buffer that expreserve saved","needs":[{"path":"/dd/PRESERVE","missing":true}],"dir":"CMDS","size":6776,"star":true,"howto":"Recovers what expreserve saved. Again, vi's helper rather than a command you start.","cat":"System & modules","sub":"Utilities"},{"name":"fastcc","desc":"a faster front end for cc","src":"effo_forum16","origin":"EFFO forum","archive":"disk 16 SOFTWARE/C/CC","needs":[{"path":"/h0/lib","missing":false},{"path":"/h0/defs","missing":false}],"dir":"CMDS","size":7802,"star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"fastmail","desc":"send a file as mail without opening the reader.  It needs a delivery agent to deliver it","needs":[{"path":"/dd/TMP/fastmail.","missing":true},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true},{"path":"/dd/sys/password","missing":false}],"dir":"CMDS/ELM","size":14998,"usage":"Usage: fastmail {args} [ filename | - ] address(es)","star":true,"cat":"Communications","sub":"Mail"},{"name":"fc","desc":"split a big file in two, to carry it on 360k disks -- the cut is at exactly 350,000 BYTES: its own Function line says \"Takes first 350,000 bytes of a file or stdin and puts in one file and puts remaining bytes\" in the other","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":2678,"usage":"Syntax:   fc [\u003cfile>]\nFunction: Takes first 350,000 bytes of a file or stdin\n   and puts in one file and puts remaining bytes\n   in another file for easily putting large files\n   on 360k media.\nOptions:  none","star":true,"hassrc":true,"cat":"Files & directories","sub":"Split & join"},{"name":"fcomp","desc":"compare two text files","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":5838,"usage":"Syntax: fcomp \u003cfile_1> \u003cfile_2>\nFunction: compares two text files\nOptions:","star":true,"hassrc":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"ff","desc":"find files by name -- `ff \u003cname>'.  It builds the command `dir -ausr ! grep \u003cname>' and hands it to Microware's `shell'. `find' does the same job","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2146,"star":true,"hassrc":true,"cat":"Files & directories","sub":"Find & compare"},{"name":"fgrep","desc":"very fast grep utility","src":"-","origin":"EFFO forum","archive":"disk 14 SOFTWARE/C/FGREP -- no source in the archive","info":{"purpose":"very fast grep utility","status":"final","hardware":"none","language":"C","author":"from FREE SOFTWARE FOUNDATION (adaption to OS-9/68k : Stephan Paschedag)","availability":"public","copyright":"see file COPYING !"},"dir":"CMDS","size":19960,"usage":"usage: fgrep [-[[AB] ]\u003cnum>] [-[CVchilnsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]","star":true,"docs":true,"cat":"Text tools","sub":"Search & match"},{"name":"fibo","desc":"Fibonacci benchmark","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":1590,"star":true,"hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"field","desc":"select whitespace-separated fields from standard input by number, in the order asked for and tab-separated on output: `field 2 4 1' prints the second, fourth and first word of each line. `-i=c' names another input separator.","dir":"CMDS","size":6074,"usage":"Syntax  : field [\u003copts>] \u003cfields...> [\u003copts>]\nFunction: select fields or columns from lines in","star":true,"docs":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"file","desc":"Identify file types.  SYS/magic is now here, so it names real formats -- \"GIF picture ver. 87a 320 x 200, interlaced, 256 colors\" -- and not just OS-9 modules","needs":[{"path":"/dd/SYS/magic","missing":false}],"dir":"CMDS","size":43906,"usage":"Syntax:   file [\u003copts>] {\u003cfile>}","howto":"Names real formats now that SYS/magic is here: `file /dd/DEMO/gulls.gif' reports the GIF version, size and colour count.","cat":"Text tools","sub":"Count & inspect"},{"name":"fileserv","desc":"serve files to remote sites on request","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/UUCP/sequence.mail","missing":true},{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":21202,"star":true,"hassrc":true,"cat":"Communications","sub":"File transfer"},{"name":"fillup","desc":"fill a file up to a given length with a constant byte: `fillup -n=64 -i=65 f' pads f to 64 bytes with `A' and says `24 bytes (value=65) appended'.  The length option is -n=, not -l=.  L. Zeller, 1992","src":"fillup","origin":"EFFO forum","archive":"disk 23 f23b/SOFTWARE/FILLUP (L. Zeller, 1992)","info":{"version":"Ed #1","purpose":"fills up file with byte pattern","status":"final","language":"C","author":"Lukas Zeller","availability":"Public, EFFO Forum 23","copyright":"(c) 1992 by L.Zeller"},"dir":"CMDS","size":3394,"usage":"Syntax:   fillup [\u003coptions>] \u003cfile>\nFunction: fill up file with constant data\nOptions:  -?   : displays this text\n   -n=\u003cnum>  : append data until file is \u003cnum> bytes long\n   -i=\u003cdata> : fill data byte, default=255","star":true,"docs":true,"hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"filter","desc":"sort incoming mail into folders by rule.  A PIPE stage: its own usage line begins `| filter'","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/nlslib/","missing":true},{"path":"/dd/SYS/domain","missing":true},{"path":"/dd/TMP","missing":false},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/ELM","size":60436,"usage":"Usage: | filter [-nrvlq] [-f rules] [-o file]","cat":"Communications","sub":"Mail"},{"name":"find","desc":"f ives & compression","sub":"zoo"},{"name":"fkeys","desc":"define terminal function keys","src":"eff_fkeys","origin":"EFFO forum","archive":"disk 7   C/FKEYS","dir":"CMDS","size":17924,"usage":"Syntax: fkeys [\u003cpath>]\nFunction:set User-Defined Keys on VT220 Terminals\nOptions: none","docs":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"flex","desc":"lexical analyzer generator -- see DOC/flex/README-FLEX FIRST","src":"flex","origin":"EFFO forum","archive":"disk 17 SOFTWARE/C/FLEX -- flex 2.3, Vern Paxson","needs":[{"path":"/dd/lib/flex.skel","missing":false},{"path":"/dd/tmp/flexXXXXXX","missing":true}],"info":{"version":"2.3","purpose":"lexical analyzer generator","status":"final","language":"C,lex,yacc","author":"Vern Paxson","availability":"public","copyright":"see GNU copyright"},"dir":"CMDS","size":89186,"usage":"Syntax   : flex [-bcdfinpstvFILT8 -C[efmF] -Sskeleton] [filename ...]\nFunction : fast lexical analyzer generator\nOptions  :\n-b   generate backtracking info to 'lex.backtrack'","docs":true,"hassrc":true,"cat":"Compilers & build","sub":"Make & generators"},{"name":"flink","desc":"list a module's links","src":"eff_flink","origin":"EFFO forum","archive":"disk 6   PROGRAMME/C/FLINK","dir":"CMDS","size":5318,"usage":"usage: flink [ -? | filename { filename } ]\n   option: -? displays this message","star":true,"hassrc":true,"howto":"DO NOT run it on a shipped module. It makes a directory entry aliasing the file's FD in the CURRENT directory, RBF has no hard links, and removing the entry leaves the file pointing at a DIRECTORY -- `cat' then answers `is a directory' for everything.","cat":"System & modules","sub":"OS-9 modules"},{"name":"float","desc":"floating-point benchmark","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":1828,"star":true,"hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"florida","desc":"the weather program on its Gulf-coast profile; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"howto":"`florida \u003c /nil'. It simulates a year of Florida weather day by day, with the calendar notes.","cat":"Amusements","sub":"Simulated weather"},{"name":"fmt","desc":"Simple text formatter (elvis 1.7)","needs":[{"path":"/dd/sys/Errmsg","missing":false},{"path":"/dd/SYS/password","missing":false}],"dir":"CMDS","size":24328,"usage":"usage: fmt [-width] [files]...","docs":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"fontgen","desc":"generate a font for the Gepard display","src":"forum3","origin":"Microware OS-9 archive","archive":"forum3.lzh","dir":"CMDS","size":10606,"hassrc":true,"howto":"Generates a character font for the Gepard display -- it prints the assembler source of an 80-column font on stdout.","cat":"System & modules","sub":"Utilities"},{"name":"for","desc":"the RTF/68K FORTRAN driver, and a bash KEYWORD -- ask for it by PATH (`/dd/CMDS/for') or bash swallows the name.  It uses Microware's `shell' on your execution path, forking one to run each compiler pass.  Call `rtf' directly and you need no shell at all -- see DOC/README-FORTRAN","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- RTF/68K driver","dir":"CMDS","size":3912,"hassrc":true,"cat":"Compilers & build","sub":"Fortran"},{"name":"forth","desc":"Forth-83, and it runs.  Type at it:","src":"pd7","origin":"Microware OS-9 archive","archive":"pd7.lzh","needs":[{"path":"/dd/lib/tile","missing":false}],"dir":"CMDS","size":36050,"usage":"Syntax   : forth [\u003copts>] [\u003cfile>] [\u003copts>]\nFunction : forth interpreter\nOptions  :\n-a \u003cargument>   access arguments\n-s \u003cstart-symbol>   define where to start","star":true,"docs":true,"hassrc":true,"howto":"Type `2 3 + . cr' and it answers 5; `: squares 10 1 do i dup * . loop cr ;' then `squares' prints them; `words' lists its vocabulary; `bye' leaves. A SOURCE FILE IS A COMMAND-LINE ARGUMENT -- `forth fibonacci.tst' loads it and gives you the prompt -- because `include' is defined in the library, not the kernel. The library and the twenty-two programs it shipped with are in lib/tile and lib/tile/TST; lib/tile/readme explains the name (TILE is this Forth's own).","cat":"Languages","sub":"Interpreters"},{"name":"fortune","desc":"print a random quotation","src":"fortune","origin":"usenet archive","archive":"fortune.ar","needs":[{"path":"/dd/GAMES/FORTUNE/fortunes.dat","missing":false}],"dir":"CMDS","size":17944,"usage":"usage:  fortune [ - ] [ -wsloa ] [ file ]\n  - - give this summary of usage\n  w - have program wait after printing message in order\n   to give time to read\n  s - short fortune only\n  l - long fortune only\n  o - offensive fortunes only\n  a - any fortune\n   Mail suggested fortunes to \"fortune\"","hassrc":true,"cat":"Text tools","sub":"Fortune & sayings"},{"name":"frm","desc":"list who your mail is from, one line each.  On this port it answers `tester has no mail' for a folder that `messages' counts and `readmsg' prints, so use those two","needs":[{"path":"/dd/SPOOL/MAIL/","missing":false},{"path":"/dd/nlslib/","missing":true},{"path":"/dd/SYS/domain","missing":true},{"path":"/dd/TMP","missing":false},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/ELM","size":32300,"usage":"Usage: frm [-n] [-v] [-s {new|old|read}] [filename | username] ...","star":true,"howto":"Lists who your mail is from, one line each. Reads $MAIL, which SYS/login sets.","cat":"Communications","sub":"Mail"},{"name":"fstat","desc":"display a file's FILE DESCRIPTOR -- the RBF FD sector, not the attribute bits `attr' shows you.  Its own Function line says \"Display file descriptor information\" and it reports itself as `FStat'.  `-s' adds the segment list, and `ssl' shows the same list from the same sector","dir":"CMDS","size":13848,"usage":"Syntax: FStat [\u003copts>] \u003cfile1> [\u003copts>]\nFunction: Display file descriptor information\nOptions:\n-s  display file segment list","hassrc":true,"cat":"Files & directories","sub":"Attributes & ownership"},{"name":"fstopgm","desc":"Usenix FaceSaver to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":50870,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"fuddle","desc":"chess - fuddle variant","src":"chess","origin":"usenet archive","archive":"chess.ar","dir":"CMDS/GAMES","size":18238,"hassrc":true,"cat":"Games","sub":"Other games"},{"name":"funzip","desc":"Unzip straight from a pipe -- funzip \u003c file.zip","src":"unzip50","origin":"Microware OS-9 archive","archive":"unzip50_src.lzh -- Info-ZIP 5.0,","dir":"CMDS","size":9184,"usage":"usage: funzip \u003c infile.zip > outfile","star":true,"docs":true,"hassrc":true,"howto":"Unzips from a pipe rather than a file: `funzip \u003c thing.zip > thing'. For a normal archive use unzip; zipinfo lists what is inside one.","cat":"Archives & compression","sub":"zip"},{"name":"g","desc":"an Atari GRAPH demo, paired with striche.  Needs the `graph'","dir":"CMDS/GAMES","size":2068,"star":true,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"g3topbm","desc":"Group 3 fax to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":46274,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"game","desc":"draw a saved GNU Chess game board by board as PostScript, one page a move, for printing with the ChessFont file DOC/game names.  Given a game it writes the first line of the page setup and stops there","dir":"CMDS/GAMES","size":20270,"usage":"Usage: game file [start [end] ]","docs":true,"howto":"Same input as checkgame, a gnuchess `chess.lst', and it writes PostScript on standard output: `game chess.lst > out.ps'. Here it gets as far as the page setup and stops.","cat":"Games","sub":"Chess utilities"},{"name":"gawk","desc":"GNU awk 2.11 -- the pattern-and-action language.  It works, but it IGNORES A FILENAME ARGUMENT and reads standard input whatever it is given, so redirect: gawk '{...}' \u003c file, never gawk '{...}' file.  Named a file, it sits waiting on the terminal.","needs":[{"path":"/dd/tmp/gawkXXXXXX","missing":true}],"dir":"CMDS","size":112534,"usage":"Syntax   : gawk [\u003copts>] \u003cprogram-file> [\u003cfile>]\nFunction : pattern scanning and processing language\nOptions  :\n-a   use traditional syntax for regular expressions\n-e   use egrep syntax for regular expressions\n-f \u003cfile>   read program source from \u003cfile>\n-F \u003cfs>   use \u003cfs> for input field separator\n-v \u003cvar>=\u003cval> assign \u003cval> to variable \u003cvar>","star":true,"docs":true,"howto":"GNU awk 2.11. IT IGNORES A FILENAME ARGUMENT and reads standard input whatever it is given, so redirect: `gawk \"{print \\$1}\" \u003c file', never `gawk \"{print \\$1}\" file' -- named a file it sits waiting on the terminal. Keep the program text short: a command line wider than the window scrolls under bash and is hard to read back. Needs Microware's cio.","cat":"Text tools","sub":"Transform & filter"},{"name":"gcc","desc":"the GCC driver -- GCC139's and GCC2's share this name. They are NOT the same version, and neither is 2.x: GCC139/gcc answers `gcc version 1.39' and GCC2/gcc answers `gcc version 1.42', read out of `gcc -v'","needs":[{"path":"/DD/CMDS/gcc_","missing":true},{"path":"/H0/CMDS/gcc_","missing":true},{"path":"/DD/LIB/","missing":false},{"path":"/H0/LIB/","missing":false},{"path":"/DD/GNULIB/","missing":false},{"path":"/H0/GNULIB/","missing":false},{"path":"/DD/CMDS/gcc_","missing":true},{"path":"/H0/CMDS/gcc_","missing":true},{"path":"/DD/LIB/","missing":false},{"path":"/H0/L build","sub":"C toolchain"},{"name":"gcc_collect","desc":"GCC 1.39 collect2","dir":"CMDS/GCC139","size":17518,"usage":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n   -l=\u003cfile>   process library","cat":"Compilers & build","sub":"C toolchain"},{"name":"gcl","desc":"a grand digital clock: the time drawn large across the terminal and redrawn as it runs.  `-n=\u003cseconds>' runs it for that long; -s scrolls the digits, -i inverts the video","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":5212,"star":true,"hassrc":true,"howto":"A full-screen digital clock: `gcl' runs until stopped, `gcl -n=10' for ten seconds; -s scrolls the digits, -i inverts the video.","cat":"Time & calendar","sub":"Clocks"},{"name":"gdd","desc":"GNU dd -- a block copier and converter. `gdd if=\u003cfile> bs=\u003cn> skip= seek= count=', and `conv=ucase' converts to upper case on the way through. `of=' can only name a file that already exists, so send the output through `>' instead. Give it arguments; `dump' is the hex dump here.","dir":"CMDS","size":17938,"usage":"Usage: gdd [if=file] [of=file] [ibs=bytes] [obs=bytes] [bs=bytes] [cbs=bytes]","star":true,"howto":"GNU dd -- a block copier and converter. `gdd if=\u003cfile> bs=8 count=1' copies eight bytes, `conv=ucase' converts on the way through. `of=' can only name a file that already exists, so send the output through `>'. Give it arguments. It uses Microware's cio; `dump' is the hex dump here.","cat":"Text tools","sub":"Transform & filter"},{"name":"gemtopbm","desc":"GEM to PBM (bitmap)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":43040,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gen","desc":"generates the FRAME of a new C program -- header block, authorship and version lines and the sectioned comments a Microware example was laid out with.  It appends `.c' to whatever name you give it: `gen -p frame' leaves `frame.c'.  `-m' does a module frame, `-t' a type, `-f' a function declaration.","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":17940,"usage":"Syntax: gen [\u003copt>] \u003cpathname> [\u003copts>]\nFunction: generate a program frame","hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"georgia","desc":"the weather program on its south-Atlantic profile; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":10166,"star":true,"hassrc":true,"cat":"Amusements","sub":"Simulated weather"},{"name":"gep","desc":"global expression parser -- grep-like; its `-e' takes the PATH OF A FILE holding the expressions: `gep -e=/dd/tmp/patterns \u003cfile>'. A file of patterns applied at once is what it is for and nothing else here does it. See DOC/README-GREP","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":3654,"usage":"Syntax: gep [\u003copts>] [\u003csrcpath>] [\u003copts>]","star":true,"hassrc":true,"howto":"Its expressions come from a FILE named with `-e', which its own option list marks `(required)': `gep -e=\u003cpatterns> \u003csource>'. Handing it a pattern and a file the way you would grep earns `more than one path specified'.","cat":"Text tools","sub":"Transform & filter"},{"name":"getenv","desc":"print or test an environment variable.  German prompts: `getenv -p TERM' prints the value with a newline, -l without one, -x exits with it, -n inverts the test.  Bare, or with a name and no option, it prints its own usage.  DESIGNA VLT, version UTIL 2.40","dir":"CMDS","size":3784,"usage":"USAGE: getenv [-n|-p|-l|-x] \u003cEnvironment> [\u003cWert>]","star":true,"cat":"Shells","sub":"Shell helpers"},{"name":"getsys","desc":"report the system's globals -- what OS-9 thinks it is running on","dir":"CMDS","size":8998,"usage":"Syntax: getsys [\u003copts>]\nFunction: display system global variables\nOptions:  none","star":true,"cat":"System & modules","sub":"Utilities"},{"name":"gftopk","desc":"MetaFont generic font to packed font","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":52756,"usage":"Usage: gftopk [-v] \u003cgf file> [pk file].","howto":"`gftopk cmr10.120gf /dd/tmp/cmr10.120pk'. GFFONTS must name where the input is; the OUTPUT path is never searched for, so an absolute one works with nothing set.","cat":"Text tools","sub":"TeX"},{"name":"gftype","desc":"show what is inside a .gf file","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":52772,"usage":"Usage: gftype [-m] [-i] \u003cgf file>.","howto":"`gftype -i \u003cfont>.\u003cdpi>gf' draws the glyphs as asterisks; -m adds the opcodes. GFFONTS must NAME THE DIRECTORY -- the compiled-in FONTS paths do not begin with `.', so a file beside you is invisible.","cat":"Text tools","sub":"TeX"},{"name":"ggrep","desc":"GNU grep, from the sh_utils collection","needs":[{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/errmsg.short","missing":true}],"dir":"CMDS","size":53124,"usage":"usage: ggrep [-[[AB] ]\u003cnum>] [-[CEFGVchilnqsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]","star":true,"howto":"GNU grep. `ggrep \u003cexpr> \u003cfiles...>'; -E, -F, -i, -v, -w and the rest as you would expect.","cat":"System & modules","sub":"Utilities"},{"name":"giftopnm","desc":"GIF to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":100070,"hassrc":true,"howto":"Reads a GIF into the PNM formats the other 168 converters work on -- try `giftopnm /dd/DEMO/gulls.gif | pnmfile'. IMPORTANT for anyone piping images out of the emulator: os9exec turns CR into CRLF on the way to the host, so a raw image containing byte 13 arrives corrupted. Keep binary inside OS-9 and convert with pnmnoraw before taking a picture anywhere else. DOC/README-NETPBM has the details.","cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gmake","desc":"GNU make -- ADDED (the gnu.bin build of make is the broken one)","needs":[{"path":"/h0/X11R5/X11/h0/usr/local/include","missing":true},{"path":"/h0/usr/local/include","missing":true},{"path":"/h0/X11R5","missing":true},{"path":"/h0/defs","missing":false},{"path":"/h0/usr/local/lib","missing":true},{"path":"/h0/lib","missing":false},{"path":"/h0/cmds","missing":false},{"path":"/h0/usr/gnubin","missing":true},{"path":"/h0/cmds/sh","missing":false}],"dir":"CMDS","size":132446,"usage":"Usage: gmake [options] [target] ...\nOptions:","cat":"Compilers & build","sub":"Make & generators"},{"name":"gnuan","desc":"GNU Chess analyser -- annotates a saved game move by move","needs":[{"path":"/h0/gnuchess4.0/misc/gnuchess.hash","missing":false},{"path":"/h0/gnuchess4.0/misc/gnuchess.data","missing":false},{"path":"/h0/gnuchess4.0/misc/gnuchess.lang","missing":false}],"dir":"CMDS/GAMES","size":162634,"docs":true,"howto":"Give it a file of moves like `e2e4 e7e5 g1f3', then a search depth and a minutes-per-move limit, and it annotates the game move by move. At the end of the file it prints the position and stops with `Bad move'.","cat":"Games","sub":"Chess utilities"},{"name":"gnuchess","desc":"GNU Chess, and the build `gnuchess' runs: it is first on PATH and reads its opening book at the compiled-in path /h0/usr/src/chess/gnuchess.book, which ships here, so it answers 1.e4 with a book move.  Source `. termcap.entry' first (it reads TERMCAP as the description itself).  It shares a module name with CMDS/GAMES/gnuchess, a second port that opens its book by bare name reads TERMCAP as the description itself rather than as a filename -- and it draws the board, keeps both clocks and plays.  It opens its opening book by bare name, so it books when the book is the current directory; the CMDS build books from a fixed path and is what `gnuchess' runs","src":"gnu","origin":"usenet archive","archive":"gnu.ar","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":78292,"usage":"Usage: gnuchess [-a] [-h] [-x xwndw]","star":true,"docs":true,"hassrc":true,"howto":"Full-screen chess. It reads TERMCAP as the terminal description itself rather than as a filename, so do `. /dd/SYS/termcap.entry' first; then it draws its time-control menu and plays. The build in CMDS/GAMES is the one that draws a board.","cat":"Games","sub":"Board & card"},{"name":"gnuchessc","desc":"GNU Chess 4.0 built for a curses display.  Its display files live at a compiled-in path; supply them there for a board.  It takes a move as `e2e4' and answers with its own","needs":[{"path":"/h0/gnuchess4.0/misc/gnuchess.hash","missing":false},{"path":"/h0/gnuchess4.0/misc/gnuchess.data","missing":false},{"path":"/h0/gnuchess4.0/misc/gnuchess.lang","missing":false}],"dir":"CMDS/GAMES","size":169252,"howto":"Its board display reads files from a compiled-in path; supply them there for a board. It still takes a move as `e2e4' and answers with its own.","cat":"Games","sub":"Board & card"},{"name":"gnuchessn","desc":"GNU Chess with the 1989 display, which draws the squares as blocks of hashes so light and dark can be told apart on a terminal with no highlighting.  Source `. /dd/SYS/termcap.entry' first; moves go in as `e2e4'","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false},{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":101652,"usage":"Usage: gnuchess [-a] [-h] [-x xwndw]","star":true,"howto":"As gnuchess: `. /dd/SYS/termcap.entry' first, then moves as `e2e4'.","cat":"Games","sub":"Board & card"},{"name":"gnuchessr","desc":"GNU Chess with the plainest display -- pieces as letters, capitals for one side and lower case for the other, nothing that needs a terminal to draw.  It prompts `Enter #moves #minutes', takes a move and replies with its own","needs":[{"path":"/h0/usr/src/chess/gnuchess.book","missing":false}],"dir":"CMDS","size":66152,"usage":"Usage: gnuchess [-a] [-h] [-x xwndw]","star":true,"cat":"Games","sub":"Board & card"},{"name":"gnuplot","desc":"gnuplot 2.0 -- plots functions and data files.  Built-in help (SYS/gnuplot.gih); demos and sample data in DOC/gnuplot/demo","needs":[{"path":"/dd/sys/gnuplot.gih","missing":false}],"dir":"CMDS","size":136932,"star":true,"docs":true,"howto":"Type `set term' first -- it lists every output device it knows, and refuses to plot until you choose one. Its whole manual is built in: type `help'. Demos and sample data are in DOC/gnuplot/demo. Needs Microware's cio.","cat":"Graphics & images","sub":"Plotting"},{"name":"gothic","desc":"print text as a gothic/blackletter banner","src":"gothic","origin":"usenet archive","archive":"gothic.ar","dir":"CMDS","size":13464,"star":true,"hassrc":true,"cat":"Text tools","sub":"Banners & text art"},{"name":"gouldtoppm","desc":"Gould scanner to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45430,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"gpp","desc":"the C++ driver -- and it is a GCC 1.x one.  GCC2/gpp says `gpp version 1.40.3 (based on GCC 1.40)' and GCC139/gpp says 1.37.1","needs":[{"path":"/DD/CMDS/gpp_","missing":true},{"path":"/H0/CMDS/gpp_","missing":true},{"path":"/DD/LIB/","missing":false},{"path":"/H0/LIB/","missing":false},{"path":"/DD/GNULIB/","missing":false},{"path":"/H0/GNULIB/","missing":false},{"path":"/DD/CMDS/gpp_","missing":true},{"path":"/H0/CMDS/gpp_","missing":true},{"path":"/DD/LIB/","missing":false},{"path":"/H0/LIB/","missing":false},{"path":"/DD/GNULIB/","missing":false},{"path":"/H0/GNULIB/","missing":false}],"dir":"CMDS/GCC2","size":41282,"usage":"Usage: gpp {options} {files} {options}\nOptions:  (Do not concatenate single letter options)","cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_cc1plus","desc":"GCC 2.x C++ pass, under the name gpp forks","needs":[{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS","size":818786,"cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_cccp","desc":"GCC 2.x preprocessor, under the name gpp forks","needs":[{"path":"/DD/DEFS","missing":false},{"path":"/DD/DEFS/GCC2","missing":false},{"path":"/DD/DEFS/GPP2","missing":true}],"dir":"CMDS","size":84024,"usage":"Usage: gpp_cccp [switches] input output","star":true,"cat":"Compilers & build","sub":"C toolchain"},{"name":"gpp_collect","desc":"GCC 2.x collect2, under the name gpp forks","dir":"CMDS","size":17634,"usage":"Syntax   : collect [\u003copts>] {\u003cfile>} [\u003copts>]\nFunction : generate global con-/de-structor table for g++\nOptions  : -o \u003coutfile> write output to \u003coutfile>\n   -l=\u003cfile>   process library","cat":"Compilers & build","sub":"C toolchain"},{"name":"graph","desc":"the `Graph' TRAP LIBRARY itself -- a type-$0B module.  It is what g, striche, apfel, sine, showpic, graphdemo, graphsave and wgen all link.  `load' it and the trap installs; the module executes in supervisor state, so a program that calls it from the shell is entered and aborts on a supervisor-only instruction.","dir":"CMDS/GAMES","size":5138,"docs":true,"hassrc":true,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"graphdemo","desc":"Atari GRAPH demonstration","dir":"CMDS/GAMES","size":1354,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"graphsave","desc":"save an Atari GRAPH screen.  Aborts with the `graph' trap library resident, like `showpic': it wants the display","dir":"CMDS/GAMES","size":608,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"greed","desc":"Greed - grid game","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","needs":[{"path":"/dd/GAMES/lib/greed.hs","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":36196,"usage":"Usage: greed [-p] [-s]","hassrc":true,"cat":"Games","sub":"Arcade & action"},{"name":"greg","desc":"converts a Julian day number to a Gregorian date: `greg 2461281' is the 29th of August 2026","src":"forum6","origin":"Microware OS-9 archive","archive":"forum6.lzh","dir":"CMDS","size":2226,"star":true,"docs":true,"hassrc":true,"howto":"It converts a JULIAN DAY NUMBER to a Gregorian date and is nothing to do with regular expressions: `greg 2460000' answers `2023 2 25'.","cat":"System & modules","sub":"Utilities"},{"name":"grep","desc":"GNU grep 2.0 -- pattern search","dir":"CMDS","size":72364,"usage":"usage: grep [-[[AB] ]\u003cnum>] [-[CEFGVchilnqsvwx]] [-[ef]] \u003cexpr> [\u003cfiles...>]","docs":true,"cat":"Text tools","sub":"Search & match"},{"name":"gs33","desc":"Ghostscript 3.33 -- the older one.  gs403 ships with its init files and fonts; use that","needs":[{"path":"/dd/sys/doc","missing":true},{"path":"/dd/etc/lib/gs33","missing":false}],"dir":"CMDS","size":885372,"usage":"Usage: gs ... -%c file.ps arg1 ... argn","cat":"Printing","sub":"PostScript"},{"name":"gs403","desc":"Aladdin Ghostscript 4.03, and this one is COMPLETE: its init files and fonts are in LIB/gs403.  Point GS_LIB at that directory and it interprets -- `export GS_LIB=/dd/LIB/gs403' in bash, NOT `setenv', which is the OS-9 shell's and is not a bash command.  It then reads a PostScript file and drops to its own `GS>' prompt.  Runs with no trap handler -- built with GCC 2.5.8 by its porter.","needs":[{"path":"/dd/etc/lib/gs4","missing":true}],"dir":"CMDS","size":1195388,"usage":"Usage: gs ... -%c file.ps arg1 ... argn","docs":true,"howto":"Aladdin Ghostscript 4.03. Point GS_LIB at its library first -- in bash that is `export GS_LIB=/dd/LIB/gs403`, NOT `setenv`, which is the OS-9 shell's command and gets \"setenv: command not found\" here. Then `gs403 -q -dNOPAUSE -sDEVICE=nullpage \u003cfile>.ps` reads the file and gives you its GS> prompt. Everything it needs, fonts included, is in that directory. gs403 is the complete build; gs33 is the older one.","cat":"Printing","sub":"PostScript"},{"name":"gshell","desc":"GSHELL V1.1 (Uwe Simon, 1988) -- a full-screen MENU, not a command shell: a lettered list of the directory, `+' and `-' to page, `.' to change directory, a letter to run a file. `assembler', `compiler' and `editor' are the same engine pointed at one job each.  DOC/README-SHELLS","src":"eff_gshell","origin":"usenet archive","archive":"eff_gshell.ar","needs":[{"path":"/dd/sys/errmsg","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":23114,"usage":"Syntax: gshell [\u003cpath>]\nFunction: a menuedriven shell\nOptions:\n-c   no change of directory allowed\n-p   no optional parameter allowed\n-a   display Files beginning with '.'","docs":true,"hassrc":true,"howto":"A full-screen menu of the current directory: + and - page, . changes directory, a letter runs that file. Control-C leaves it.","cat":"Shells","sub":"Shells"},{"name":"gtar","desc":"another GNU tar; CMDS/tar is the one the image build uses","needs":[{"path":"/h0/etc/cmds/rsh","missing":true},{"path":"/h0/CMDS/pd","missing":true}],"dir":"CMDS/REBUILT","size":113562,"hassrc":true,"cat":"Archives & compression","sub":"Alternates"},{"name":"gzip","desc":"GNU gzip","needs":[{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS","size":77778,"usage":"usage: gzip [-gzipcdfhlLngziptvV19] [-S suffix] [file ...]","cat":"Archives & compression","sub":"Compress a file"},{"name":"gzip020_csl","desc":"gzip 1.2.4, 68020, needs csl","dir":"CMDS/REBUILT","size":57046,"usage":"usage: gzip020_csl [-gzip020_cslcdfhlLnNgzip020_csltvV19] [-S suffix] [file ...]\n-c --stdout   write on standard output, keep original files unchanged\n-d --decom
