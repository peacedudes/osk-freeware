sk 9   PROGRAMME/C/SNOBOL","dir":"CMDS/GAMES","size":3298,"star":true,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"rtf","desc":"RTF/68K Real-Time Fortran-77 compiler, v2.14 (CERN, 1987), AND IT COMPILES HERE.  `load /dd/CMDS/os9lib' first, then `rtf \u003cfile>.f' reads the Fortran and writes 68k ASSEMBLY beside the source: zero errors, `RTF normally completed'. Assemble and link that with Microware's r68 and l68. Call rtf directly: the `for' driver forks Microware's `shell' to run it.  Sources to try in SRC/rtf.  Manual: DOC/rtf/rtfman.txt","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- RTF/68K Fortran-77 (CERN)","needs":[{"path":"/dd/cmds/rtfdat","missing":false}],"dir":"CMDS","size":33360,"docs":true,"hassrc":true,"cat":"Compilers & build","sub":"Fortran"},{"name":"rtfdat","desc":"RTF FORTRAN data module","src":"rtf","origin":"EFFO public-domain disk","archive":"1 CMDS -- rtf's data module","dir":"CMDS","size":47360,"hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"run","desc":"runs a program with its input and output on the terminal PORT names: `run '\u003cprogram> \u003cargs>''","src":"divutils","origin":"EFFO forum","archive":"disk, DIVUTILS (M. Moser, Kaufbeuren)","dir":"CMDS","size":15412,"usage":"Syntax: run '\u003cprgname> {\u003carg>}'\nFunction: execute the program \u003cprgname> with stdio","docs":true,"hassrc":true,"howto":"`run '\u003cprogram> \u003cargs>'' with PORT naming a terminal: the program runs with its input and output on that terminal.","cat":"Shells","sub":"Shell helpers"},{"name":"runc","desc":"Runs a compiled Lua chunk as an OS-9 command -- and stops with the same csl mismatch as `lua'.  DOC/STATUS names all five programs that do","src":"lua","origin":"microware","archive":"LANGUAGES/lua.src.zip","dir":"CMDS","size":3958,"hassrc":true,"cat":"Languages","sub":"Interpreters"},{"name":"rxmod","desc":"receive an OS-9 module over a serial line and enter it in the module directory.  Source: SRC/serload the module directory.  Source: SRC/serload","dir":"CMDS/COMMS","size":3210,"usage":"Syntax: rxmod [\u003copts> [module(s)]]\nOptions:","docs":true,"howto":"It stops with `can't install Vmod Trap handler' and the handler is sitting beside it: `load /dd/CMDS/COMMS/vmod_trap' first. It then gets past the install and faults inside the trap, which is a different thing and worth telling apart.","cat":"Communications","sub":"Terminal & transfer"},{"name":"savage","desc":"Savage floating-point accuracy benchmark","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":2006,"star":true,"hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"savemem","desc":"save memory image","dir":"CMDS","size":444,"usage":"Syntax   : SAVEMEM \u003cfrom address> \u003cto address> \u003cpath>\nFunction : saves memory block to file","cat":"Graphics & images","sub":"Drawing & display"},{"name":"sbreak","desc":"Send/clear an SS_Break signal on a serial path","src":"smallutils","origin":"Microware OS-9 archive","archive":"smallutils.tar.Z (68k)","dir":"CMDS","size":12574,"usage":"Syntax:   sbreak [/device]\nFunction: send break on SCF device\nOptions:  none","hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"sc","desc":"sc -- spreadsheet calculator (needs TERM)","needs":[{"path":"/DD/SYS/TERM","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":233050,"usage":"Syntax: sc [-c] [-r] [-m] [-n]","docs":true,"hassrc":true,"howto":"The spreadsheet, version 6.16. `sc' opens and says \"Type '?' for help\". It reads TERMCAP as SYS/login sets it, so no `. /dd/SYS/termcap.entry' is needed first.","cat":"Maths & calculators","sub":"Calculators"},{"name":"scales","desc":"musical scale generator -- writes `scales.lst' in the current directory","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","dir":"CMDS","size":13034,"usage":"Usage: scales [-h] [-d] [-a] [-m] [-c] [outname]\n   -h: This message only\n   -d: include diatonic scales\n   -a: include altered scales\n   -m: include modal scales\n   -c: include chords","star":true,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"scqref","desc":"Quick reference for sc, the spreadsheet on this disk","dir":"CMDS","size":18426,"star":true,"cat":"Maths & calculators","sub":"Spreadsheets"},{"name":"screen","desc":"Russ Smith's `screens': picks a file at random from $HOME/.SCREENS and shows it -- a login greeting.  On OS-9 it RUNS the file rather than printing it, through system(), so it wants Microware's `shell' on your execution path.  Not the terminal multiplexer of the same name.  Source in SRC/screen, man page in DOC/screen/screens.6","src":"screen","origin":"usenet archive","archive":"screen.ar","dir":"CMDS","size":7138,"star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"screen_nocio","desc":"a trap-free source build; CMDS/screen uses cio and this one does not","dir":"CMDS/REBUILT","size":17196,"cat":"System & modules","sub":"Utilities"},{"name":"scriptmaster","desc":"G-Windows scripting tool","dir":"CMDS/GAMES","size":37152,"usage":"Usage: scriptmaster -t=\u003ctitle> -d=\u003cdirectory>.\n-t = title to display in the window and the hibernate icon\n   (default = Scripts).\n-d = directory to read scripts from\n   (default = $HOME/GWINDOWS/WORK_OUT.SCRIPTS)","star":true,"docs":true,"cat":"Games","sub":"Other games"},{"name":"scsi_mm1a","desc":"SCSI driver","dir":"CMDS/MM1","size":4218,"cat":"System & modules","sub":"MM/1 drivers"},{"name":"scsiutil","desc":"SCSI device utility","dir":"CMDS","size":47678,"usage":"Usage: SCSIutil [/scsi_dev@] \u003ccommand>","docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"sdb","desc":"SDB 2.0 - symbolic debugger","src":"effo_sdb","origin":"EFFO forum","archive":"disk 1   C/SDB","dir":"CMDS","size":43424,"docs":true,"hassrc":true,"cat":"Developer tools","sub":"Debugging"},{"name":"sddemo","desc":"White's Speedisk 2.10 -- disk de-fragmenter.  Wants an 80x24 screen; falls back to tty mode","needs":[{"path":"/dd/sys/errmsg","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/DEMOS","size":64694,"usage":"Usage:\tSpeedisk [\u003copts>] [\u003cdevice>] [\u003copts>]\n  If no device is specified, the device containing the current\n  working directory is used.\nOptions:\n  -a   Accept some disk errors as okay and continue\n  -b=\u003cnum>  Limit temporary file storage to \u003cnum> kilobytes of RAM\n  -d   Don't put directories at the front of the disk\n  -e   Don't put executable files before others\n  -f   Don't use fullscreen display\n  -o   Optimize now (batch mode)\n  -r=\u003cnum>  Use \u003cnum> kilobytes of RAM for read/write buffer\n  -t=\u003cnum>  Limit optimization time to \u003cnum> minutes (batch mode)\n  -v   Verify all disk writes\n  -w   Wipe free space after optimization (for security)","howto":"White's Speedisk 2.10 de-fragmenter, demo build. Wants an 80x24 screen and drops to tty mode without one.","cat":"System & modules","sub":"Vendor demos"},{"name":"sed","desc":"sed - stream editor: substitutes, deletes and prints with -n.  See DOC/README-CIO.","src":"eff_sed","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/SED","info":{"purpose":"non interactive stream editor","status":"final","language":"C","author":"GNU","availability":"Public"},"dir":"CMDS","size":38728,"usage":"Syntax   : sed [\u003copts>] [\u003cfile>]\nFunction : stream editor\nOptions  :\n-n   no default output\n-e \u003cscript> add script line\n-f \u003csfile>  use \u003csfile> as script","star":true,"docs":true,"hassrc":true,"cat":"Editors","sub":"Line & stream"},{"name":"sed_1.06","desc":"another build of sed -- it is the build that ships as `sed'; the earlier one did nothing but exhaust memory.","dir":"CMDS/REBUILT","size":38738,"usage":"Syntax   : sed [\u003copts>] [\u003cfile>]\nFunction : stream editor\nOptions  :\n-n   no default output\n-e \u003cscript> add script line\n-f \u003csfile>  use \u003csfile> as script","star":true,"cat":"Editors","sub":"Alternates"},{"name":"sedt","desc":"SEDT 2.6 screen editor, the VT100 build: a DEC-style keypad editor.  `new_e' and `e' are two more builds of it; all three read SYS/sedt.keys, sedt.ruler0 and sedt.help","src":"effo_sedt","origin":"EFFO forum","archive":"disk 11  SOFTWARE/C/SEDT_EDITOR/SEDT","dir":"CMDS","size":56568,"star":true,"docs":true,"hassrc":true,"cat":"Editors","sub":"SEDT family"},{"name":"sepwords","desc":"split a file to one word per line","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":14742,"usage":"Syntax: sepwords [\u003cin_path> [\u003cout_path>]]","hassrc":true,"cat":"Text tools","sub":"Split & join"},{"name":"setfont","desc":"load a downloadable terminal font -- setfont \u003cpath>. Given a font file it writes no byte to /term, to $PORT, or to a file $PORT names, and returns exit status 0.  With no argument it answers `usage: setfont \u003cpath>'.","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":1908,"usage":"usage: setfont \u003cpath>","star":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"setime","desc":"Set system time.  It PROMPTS with `YYMMDDHHMMSS' and then does not set it: the clock is unchanged whether the answer comes from standard input or from six fields on the command line.","dir":"CMDS","size":430,"cat":"System & modules","sub":"System state"},{"name":"setime2","desc":"Y2K: set the system time, four-digit year","dir":"CMDS","size":21166,"usage":"Syntax:   setime2 [\u003copt>] [\u003csetime2>] [\u003copt>]\nFunction:  set system date and time\nOptions:\n -?   help message\n -d   don't display time\n -s   setime for battery backed-up clocks","cat":"System & modules","sub":"Utilities"},{"name":"setimex","desc":"set time from hardware clock","dir":"CMDS","size":17526,"usage":"Usage:\n-n   Exit always with 0 (standard)\n-x   Exit with %d if time was ok; %d for not ok\n-e   Exit with %d if time was ok; %d for not ok","star":true,"cat":"Time & calendar","sub":"Calendars"},{"name":"setterm","desc":"set the terminal type -- SetTerm 2.0, Brian C. White. `setterm' alone reports what TERM says; give it a name to change it.  When TERM names a terminal it does not know it falls back on SYS/setterm, which lists the defaults, and that file ships now -- it came in the same archive as the binary and had never been unpacked.  DOC/setterm has the manual and a termcap.extra of further entries","src":"setterm2","origin":"Microware OS-9 archive","archive":"setterm2.lzh","needs":[{"path":"/dd/sys/setterm","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":9300,"usage":"Syntax:   setterm [opts] [term type]\nFunction: Optionally prompt for terminal type.\n   Copy the terminal description to the TERMCAP\n   environment variable for faster access.\nOptions:","star":true,"docs":true,"hassrc":true,"howto":"`setterm' alone reports what TERM says; give it a terminal name to change it. Run with no arguments and a terminal it wants to configure it goes FULL-SCREEN -- **ESC quits** (control-C also works, but ESC is the program's own way). SYS/setterm is the defaults file it falls back on when TERM names something it does not know, and DOC/setterm/termcap.extra has further entries you can add to SYS/termcap.","cat":"Communications","sub":"Terminal & session"},{"name":"setyear","desc":"Y2K: set the year directly","dir":"CMDS","size":19488,"usage":"Syntax:   setyear \u003cYYYY>\nFunction:  set system date to year YYYY\n   (YYYY must be 1970 to 2050)","cat":"System & modules","sub":"Utilities"},{"name":"sgitopnm","desc":"SGI to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":98286,"hassrc":true,"howto":"Cannot read a pipe -- same as pcxtoppm. Give it a filename or it reports \"premature EOF\".","cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sh","desc":"Bourne shell v7.5 -- what the startup script runs.  It has a REAL `chd' where bash does not, and it cannot fork a program by absolute pathname here, which is the trade. DOC/README-SHELLS","needs":[{"path":"/dd/CMDS","missing":false},{"path":"/dd/TMP","missing":false},{"path":"/dd/SYS/profile","missing":false},{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/sh.logout","missing":true},{"path":"/dd/TMP/","missing":false},{"path":"/dd/SYS/termcap","missing":false},{"path":"/h0/SYS/termcap","missing":false}],"dir":"CMDS","size":77306,"docs":true,"cat":"Shells","sub":"Shells"},{"name":"shar","desc":"Shell-archive creator, and ONE BROKEN CHECK is all that stops it: its read-access test rejects every file that EXISTS -- `No read access for file: \u003cname>' on its own standard output, for world-readable files that `cat' reads, absolute or relative, with -a or without.  Hand it a name that is NOT there and the check passes vacuously: it writes the whole shell-archive preamble, cut line and all, and only then fails at open.  For making an archive here, use `tar', `zoo' or `lha'.","dir":"CMDS","size":16740,"docs":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"shdev","desc":"show devices","dir":"CMDS","size":3132,"star":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"shire","desc":"the weather program on its mid-Atlantic profile, with the months of Tolkien's Shire calendar; see england","src":"weather","origin":"usenet archive","archive":"weather.ar","dir":"CMDS","size":18390,"hassrc":true,"howto":"A weather simulator using the Middle-earth calendar -- see `england'.","cat":"Amusements","sub":"Simulated weather"},{"name":"showpic","desc":"show a picture on the Atari GRAPH display.  With the `graph' trap library resident it is entered and aborts: it wants the display, not just the library.","dir":"CMDS/GAMES","size":332,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"shuffle","desc":"a FULL-SCREEN SWITCH PUZZLE: a row of numbered switches, `LEVEL: 1', `Wich switch ?' and a move counter, where flipping one flips its neighbours.  `q' quits.  Wants TERM. For shuffling lines, `sort -r' and `tac' are the line tools","src":"shuffle","origin":"hc disk","archive":"SOURCES/USENET/shuffle.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":42286,"usage":"Usage: shuffle [-] [-L level]","hassrc":true,"howto":"Full-screen: it takes over the display. **`q' quits**.","cat":"Games","sub":"Other games"},{"name":"sieve","desc":"sieve of Eratosthenes benchmark","src":"eff_bench","origin":"usenet archive","archive":"eff_bench.ar","dir":"CMDS","size":1572,"star":true,"hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"signal","desc":"send a signal to a process","dir":"CMDS","size":2222,"usage":"Syntax: signal \u003cprocess-id> \u003csignal-code> [\u003cseconds>]\nFunction: send signal to process after specified time.","star":true,"docs":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"sine","desc":"sine plot, Atari GRAPH","dir":"CMDS/GAMES","size":450,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"sirtopnm","desc":"sir to PNM","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":95906,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sldtoppm","desc":"AutoCAD slide to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":61828,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"slitex","desc":"SliTeX -- LaTeX for slides","dir":"CMDS/TEXCMDS","size":3166,"howto":"LaTeX for slides; its format is SYS/TEX/FORMATS/splain.fmt, already built.","cat":"Text tools","sub":"TeX"},{"name":"smail","desc":"smart mail router","needs":[{"path":"/dd/usr/lib/smail/palias","missing":false},{"path":"/dd/usr/lib/smail/aliases","missing":true},{"path":"/dd/usr/lib/smail/fullnames","missing":true},{"path":"/dd/tmp/stderrXXXXXX","missing":true},{"path":"/dd/etc/cmds/lmail","missing":true},{"path":"/dd/etc/cmds/uux","missing":true},{"path":"/dd/etc/cmds/smail","missing":true},{"path":"/dd/spool/uucp/.log/mail.log","missing":true},{"path":"/dd/tmp/rmXXXXXX","missing":true},{"path":"/dd/sys/hostname","missing":true},{"path":"/dd/sys/domain","missing":true},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/UUCP","size":26250,"usage":"Usage:   smail [\u003coptions>] address...","star":true,"hassrc":true,"cat":"Communications","sub":"Mail"},{"name":"snake","desc":"snake arcade game.  You are the `I', the money is the `$' and the snake chases you; h/j/k/l move, `x' quits. Run it from a login session -- bare, with no TERMCAP, it bus errors instead; see DOC/README-BUSERR.  Some of its cursor moves arrive as literal text, so the board picks up stray characters as you play.  Playable, untidy","src":"snake","origin":"usenet archive","archive":"snake.ar","needs":[{"path":"/dd/GAMES/snake/snakerawscores","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":36464,"hassrc":true,"howto":"Full-screen. h/j/k/l move; reach the `$' before the snake reaches you. `x' quits.","cat":"Games","sub":"Arcade & action"},{"name":"snap","desc":"snapshot the screen to a file","src":"snap","origin":"usenet archive","archive":"snap.ar","dir":"CMDS","size":7400,"star":true,"docs":true,"hassrc":true,"cat":"Graphics & images","sub":"Drawing & display"},{"name":"snd_sig","desc":"send a signal to a process","src":"forum6","origin":"Microware OS-9 archive","archive":"forum6.lzh","dir":"CMDS","size":2366,"usage":"Syntax:   snd_sig [-options] pid pid1...pidn\nFunction: Wakeup a process with the wake signal\nOptions:\n   -?   display synopsis\n   -(n)   signal number to send","star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"snddrv","desc":"sound driver","dir":"CMDS/MM1","size":1836,"cat":"System & modules","sub":"MM/1 drivers"},{"name":"sokoban","desc":"Sokoban puzzle","src":"sokoban","origin":"usenet archive","archive":"sokoban.ar","needs":[{"path":"/dd/GAMES/sokoban/screens","missing":false},{"path":"/dd/GAMES/sokoban/sokoban.help","missing":false},{"path":"/dd/GAMES/sokoban/SAVES","missing":false},{"path":"/dd/sok.lock","missing":true},{"path":"/dd/GAMES/sokoban/sok.score","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":41096,"usage":"Usage: sokoban [-{s|c|r|\u003cnn>}]\n   -c:   create new score table (superuser only)\n   -r:   restore saved game\n   -s:   show score table\n   -\u003cnn>: play this level (\u003cnn> must be greater 0)","star":true,"docs":true,"hassrc":true,"howto":"Wants a username, so run it from a login rather than a bare shell, or it stops with \"cannot get your username\".","cat":"Games","sub":"Arcade & action"},{"name":"sonnet","desc":"writes (bad) sonnets in iambic pentameter, curses-based","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":81172,"usage":"Usage:  sonnet [-l input] [-f outfilename]","docs":true,"hassrc":true,"howto":"Full-screen: it takes over the display. **ESC quits**. (control-C also gets you out, but ESC is the program's own way.)","cat":"Text tools","sub":"Fortune & sayings"},{"name":"sort","desc":"GNU sort","dir":"CMDS","size":39714,"usage":"Usage: sort [-cmus] [-t separator] [-o output-file] [-bdfiMnr] [+POS1 [-POS2]]","cat":"Text tools","sub":"Sort, compare & merge"},{"name":"soundex","desc":"Soundex phonetic key for each word on stdin","src":"soundex","origin":"EFFO forum","archive":"disk 8  PROGRAMME/C/NO_DOC (N. Dean Pentcheff, public domain)","dir":"CMDS","size":14150,"hassrc":true,"cat":"Text tools","sub":"Search & match"},{"name":"sox","desc":"Sound eXchange -- audio format converter.  Sample .iff sounds are in DOC/sox","dir":"CMDS","size":52960,"star":true,"docs":true,"howto":"Converts between audio formats. There is no sound device here, so it converts files rather than plays them. Sample .iff sounds are in DOC/sox. Needs Microware's cio.","cat":"Encoding & conversion","sub":"Audio"},{"name":"space","desc":"effective disk usage  [conditions apply -- run `help space`]","src":"eff_space","origin":"EFFO forum","archive":"disk 12  SOFTWARE/C/SPACE","info":{"version":"V1.1 Ed#5","purpose":"displays effective disk usage of files/dirs","language":"C","author":"Lukas Zeller","availability":"Public, with condition.","conditions":"May only be used under the conditions listed in the documentation (help file). The conditions prohibit use for military purposes. YOU MUST READ THE CONDITIONS BEFORE USING THIS PROGRAM!","copyright":"(c) 1990 by L.Zeller"},"dir":"CMDS","size":8462,"usage":"Syntax:   space [\u003copts>] {\u003cdir/file path>} [\u003copts>]\nFunction: Shows effective space requirements of directory trees and single\n   files on a given disk. \"Effective\" space means that not\n   only net file sizes, but also all space consumed by the\n   file system itself such as file descriptors, directory\n   files and partially used clusters is taken into account\nOptions:  -c=\u003cclustersize> : assume specified cluster size for space\n   requirement calculation\n   -d=\u003cdisk>   : assume specified disk's cluster size\n   for space requirement calculation\n   -g   : show grand total only\n   -k   : show KBytes instead of Sector count","star":true,"docs":true,"hassrc":true,"cat":"Files & directories","sub":"Find & compare"},{"name":"spctoppm","desc":"Atari Spectrum to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":45760,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"speech","desc":"English-to-phoneme translation","src":"speech","origin":"hc disk","archive":"SOURCES/USENET/speech.ar","dir":"CMDS","size":33882,"usage":"Usage: PHONEME [infile [outfile]]","hassrc":true,"cat":"Text tools","sub":"Spelling & words"},{"name":"spiff","desc":"tolerant diff - ignores formatting noise","src":"spiff","origin":"usenet archive","archive":"spiff.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":28408,"usage":"Syntax: spiff [-s script] [-f sfile] [-bteiqcdwm] [-abr value] -value f1 f2\nFunction: make controlled approximate comparsions between two files\nOptions:\n-q   supress waring messages\n-t   produce output in terms of individual tokens\n-e   token compare\n-value   sets a limit on the total number of insertions/deletions\n-f sfile  a command script to be taken from file 'sfile'\n-s script command script\n-b   treat all objects (incl floating point numbers) as literals\n-c   ignore differences between upper and lower case\n-w   treat white space as objects\n-m   treat leading sign chars (+/-) as separate\n-d   treat integer numbers as real numbers\n-a fpn   specifies an absolute value for the tolerance in fpns\n-r fpn   specifies a relative tolerance (fpn=floating point number)\n-i   causes differences between fpns to be ignored","star":true,"docs":true,"hassrc":true,"howto":"Compares two files while ignoring differences that do not matter (whitespace, number formatting). Takes TWO filenames.","cat":"Text tools","sub":"Sort, compare & merge"},{"name":"spline","desc":"fit a spline through points, output PostScript","dir":"CMDS","size":6778,"star":true,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"split","desc":"Split a file into pieces (GNU)","dir":"CMDS","size":32318,"usage":"Usage: split [-lines] [-l lines] [-b bytes[km]] [-C bytes[km]] [+lines=lines]","cat":"Text tools","sub":"Split & join"},{"name":"splitalf","desc":"split a file into \u003cname>_A to \u003cname>_Z by the first letter of each line, and \u003cname>_0 for the rest.  It opens \u003cname>_0, then tests a file slot it has not opened yet and stops with `can't open output file(s)'.","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":2628,"usage":"Syntax: splitalf \u003copts> [\u003cin_path>] \u003copts>","star":true,"hassrc":true,"howto":"It makes \u003cname>_0 and then stops with `can't open output file(s)', whatever it is given -- it tests a file slot it has not opened yet. No argument gets round it.","cat":"Text tools","sub":"Split & join"},{"name":"splman","desc":"OS-9 print spooler: the manager (Carl Kreider).  It wants a printer on an SCF device to spool to.  `splprt' is the process that drives the printer and `splstat' shows the queue; the three go together","needs":[{"path":"/dd/spl","missing":false},{"path":"/DD/SPL/splq","missing":false},{"path":"/DD/SPL/splforms","missing":true}],"dir":"CMDS","size":6858,"star":true,"cat":"Printing","sub":"Spooling"},{"name":"splprt","desc":"OS-9 print spooler: the printer process, one per printer. It wants an SCF device to write to","dir":"CMDS","size":3598,"star":true,"cat":"Printing","sub":"Spooling"},{"name":"splstat","desc":"OS-9 print spooler: queue status.  It reads the spooler's queue.  The other spooler on this disk speaks up when its queue is empty: `lpq: no spooler installed', `lpshut: no spooler active', `prjob: Spooler not installed'.","needs":[{"path":"/DD/SPL/splq","missing":false},{"path":"/DD/SPL/splforms","missing":true}],"dir":"CMDS","size":5252,"star":true,"cat":"Printing","sub":"Spooling"},{"name":"spottopgm","desc":"spot to PGM (greyscale)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":53276,"usage":"Usage: spottopgm [-1|2|3] [Firstcol Firstline Lastcol Lastline] input_file","hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sputoppm","desc":"Atari Spectrum to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":44976,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"sqrtx","desc":"square-root demonstration","src":"forum1","origin":"Microware OS-9 archive","archive":"forum1.lzh","dir":"CMDS","size":12190,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"ssl","desc":"show a file's segment list, sector by sector -- ssl \u003cfile>","src":"effo_wolk","origin":"usenet archive","archive":"effo_wolk.ar","dir":"CMDS","size":2308,"star":true,"hassrc":true,"cat":"System & modules","sub":"Devices & disks"},{"name":"sterm","desc":"a serial terminal emulator","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/COMMS","size":56242,"usage":"Usage:  sterm [-df? -l'p' -e'x']","cat":"Communications","sub":"Terminal & transfer"},{"name":"stone","desc":"the stones game (SNOBOL4-in-C).  Data: GAMES/SNOBOL","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","needs":[{"path":"/dd/GAMES/SNOBOL/PHRASE.SYN","missing":false}],"dir":"CMDS/GAMES","size":20950,"star":true,"hassrc":true,"cat":"Games","sub":"Other games"},{"name":"strfile","desc":"build fortune's index file","src":"fortune","origin":"usenet archive","archive":"fortune.ar","dir":"CMDS","size":3522,"usage":"usage:  strfile [ - ] [ -cC ] [ -sv ] inputfile [ datafile ]\n  - - Give this usage summary\n  c - Replace delimiting character with 'C'\n  s - Silent.  Give no summary\n  v - Verbose.  Give summary.  (default)\n  Default \"datafile\" is inputfile.dat","star":true,"hassrc":true,"cat":"Text tools","sub":"Fortune & sayings"},{"name":"striche","desc":"line drawing, Atari GRAPH.  Needs the `graph' trap library found -- see the graph entry below","dir":"CMDS/GAMES","size":3684,"star":true,"cat":"Graphics & images","sub":"Hardware demos"},{"name":"strings","desc":"extract printable strings, reported as $offset: \u003ctext>","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":2494,"usage":"Usage: strings [-anpl=n] [file [file]]","star":true,"hassrc":true,"cat":"Text tools","sub":"Count & inspect"},{"name":"su","desc":"Become another user (GNU) -- and it is the GNU one, so it answers `illegal option' and points at `su --help' for the `-?' every other program here takes","needs":[{"path":"/dd/cmds","missing":false},{"path":"/dd/sys/shells","missing":true},{"path":"/dd/SYS/errmsg","missing":false},{"path":"/dd/SYS/errmsg.short","missing":true}],"dir":"CMDS","size":17550,"usage":"Usage: su [OPTION]... [-] [USER [ARG]...]","star":true,"cat":"Shells","sub":"Shell utilities"},{"name":"subber","desc":"Substitute text in a stream: a word list of `,old,new' pairs (the first character is the delimiter) and a file or standard input (Carl Kreider).  It grows its data area as it reads, so give it room -- at your OS-9 shell, `subber #1000k words file'","dir":"CMDS","size":4064,"usage":"Usage : subber \u003copts> wordlist \u003cfilename>\n  if no filename standard in is used\n  no opts yet","star":true,"howto":"Substitutes words in a stream from a word list of `,old,new' pairs (the line's first character is the delimiter), reading a file as the second argument or standard input. It grows its data area as it reads, with F$Mem, so give it room up front: at an OS-9 (Microware) shell, `subber #1000k words file' -- bash and ksh read the `#' as a comment, so run it at your OS-9 shell or through it, `/h1/CMDS/shell \"subber #1000k words file\"'. Tested: `,fox,cat' turns `a fox' into `a cat'.","cat":"Text tools","sub":"Transform & filter"},{"name":"submit","desc":"submit a job to the print spooler","dir":"CMDS","size":2692,"usage":"Syntax: submit [\u003copts>] [\u003csubmit file>] [{\u003cparameter>)]\nFunction: Executes commands from the submit file with textual replacement.\n   The submit file must have the suffix .sub.\nOptions:\n-?   displays this help message","star":true,"cat":"Shells","sub":"Shell helpers"},{"name":"subscribe","desc":"add a newsgroup to your subscription list -- for one already in /dd/.newsrc but turned off, `Newsgroup X is now subscribed.' and `X! 1' becomes `X: 1' in the file. A group not in .newsrc at all is silently left alone, which both this and unsubscribe do","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":9308,"usage":"usage: subscribe \u003cnewsgroup> [newsgroup...]","star":true,"hassrc":true,"howto":"It works, and so does `unsubscribe' -- give it a group that IS in /dd/.newsrc. A group that is not there is silently left alone.","cat":"Communications","sub":"News"},{"name":"suicide","desc":"animation: a stick figure walks off a rooftop","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":29800,"cat":"Screen toys","sub":"Screen toys"},{"name":"suicide1","desc":"suicide, variant","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":30024,"cat":"Screen toys","sub":"Screen toys"},{"name":"suicide2","desc":"suicide, variant","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":29028,"cat":"Screen toys","sub":"Screen toys"},{"name":"sum","desc":"Checksum and block count (GNU)","dir":"CMDS","size":22214,"cat":"Text tools","sub":"Count & inspect"},{"name":"suse","desc":"show a program's usage line.  `-?' does the same for most programs here.","src":"forum2","origin":"Microware OS-9 archive","archive":"forum2.lzh","dir":"CMDS","size":190,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"suspend","desc":"REMOVES a process from the system -- its own usage line says so -- rather than suspending it.  F.R.Schmitt, 1989.","dir":"CMDS","size":4568,"usage":"Syntax  : suspend  [\u003cprocessname>]  [\u003copt>]\nFunction: removes the process from the system\nOptions:\n-?   show this explanation\n-s   remove also system programs","star":true,"cat":"System & modules","sub":"Utilities"},{"name":"sysid","desc":"show system identification","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2146,"star":true,"hassrc":true,"cat":"System & modules","sub":"System state"},{"name":"sysmax","desc":"shows the system's maximum process AGE -- `system maximum age is 0' unless the kernel answers the F$SetSys call it uses.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2402,"star":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"sysmin","desc":"shows the system's minimum process PRIORITY -- `system minimun priority is 0' here, same F$SetSys call.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":2406,"star":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"sysmon","desc":"system monitor.  It asks whether to create SYS/nodedef, times out on the keyboard and draws its Process Monitor, then takes a bus error at F$GPrDsc, the get-process- descriptor call this system does not answer -- the same gap `devprc -a' and `top' meet.  `dinfo', `map' and `space' answer the questions it would have.","src":"sysmon","origin":"Microware OS-9 archive","archive":"SYSMON.lzh","dir":"CMDS","size":87760,"usage":"Syntax: sysmon [\u003copt>]","star":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"t","desc":"tiny test/stub binary","dir":"CMDS","size":934,"cat":"System & modules","sub":"Processes & memory"},{"name":"t_trtest","desc":"RICO trap-handler test","src":"forum7","origin":"Microware OS-9 archive","archive":"forum7.lzh","needs":[{"path":"/dd/sys/Errmsg","missing":false}],"dir":"CMDS","size":15266,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"tab","desc":"Tabulate 6809 or 68000 assembly source -- opcode-aware, and works on code that will not assemble","dir":"CMDS","size":17036,"usage":"Syntax: tab [\u003copts>]\nFunction: Pipe to format 68000 series assembler source code\nOptions:","docs":true,"cat":"Developer tools","sub":"Assembly"},{"name":"tabs","desc":"re-space a file, standard input to standard output: `-i8' says the input's tab stops are every 8 columns, `-o0' asks for spaces on output and `-o4' for tabs every 4.","src":"-","origin":"EFFO forum","archive":"disk 6 PROGRAMME/CODE (tabs.arc)","dir":"CMDS","size":14916,"usage":"Syntax   : tabs [\u003copts>] [\u003cinput_redirection>] [\u003coutput_redirection>]\nFunction : convert from one tab size to another (default eight)\n   replace tabs with spaces or v.v.\n   delete trailing spaces/tabs on lines","docs":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"tac","desc":"Print a file backwards, last line first (GNU)","needs":[{"path":"/dd/tmp/tacXXXXXX","missing":true}],"dir":"CMDS","size":48142,"usage":"Usage: tac [-br] [-s separator] [+before] [+regex] [+separator=separator]","howto":"Prints a file backwards, last line first -- cat's mirror image. Needs cio.","cat":"Text tools","sub":"Transform & filter"},{"name":"tail","desc":"last lines of a file -- DESIGNA's, and it takes `-l=\u003cn>', not GNU's `-n \u003cn>', which it rejects as an unknown option.  `head' on this disk IS the GNU one and takes -n: two conventions, one disk","dir":"CMDS","size":4038,"star":true,"docs":true,"cat":"Text tools","sub":"Count & inspect"},{"name":"tangle","desc":"WEB to Pascal -- Knuth's literate programming tool.  IT NEEDS A CHANGE FILE NAMED, always: given only a .web it answers `Error: `Can't open file.'' -- the absent CHANGE file is what it could not open.  DOC/tex ships `sample.web' and `none.ch' (an empty change file): copy both to your data directory and run `tangle sample none'.  It reads and writes there, not where you typed from.","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":76368,"usage":"Usage: tangle webfile[.web] [changefile[.ch]].","howto":"Needs a CHANGE FILE named, always. `tangle yourfile.web' alone answers `Error: `Can't open file.'' and the file it cannot open is the absent change file, not your source. DOC/tex ships `sample.web' and `none.ch' (empty, changes nothing): copy both to your data directory and run `tangle sample none'. It reads and writes in the DATA directory, which bash's `cd' does not move. `weave sample none' is the other half.","cat":"Text tools","sub":"TeX"},{"name":"tar","desc":"GNU tar 1.10","src":"eff_tar","origin":"EFFO forum","archive":"disk 10  SOFTWARE/C/TAR","dir":"CMDS","size":22966,"usage":"Syntax : tar [ctx][mfv] tarfile [file(s)...]\nFunction: Builds and extracts from Unix tape archive files\nOptions:","docs":true,"hassrc":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"tcmp","desc":"Compare two text files (Carl Kreider)","dir":"CMDS","size":5804,"usage":"Usage:  tcmp [options] file1 file2\noptions:\n-sdd   = syncronize up to dd lines","star":true,"howto":"Compares two text files and prints each differing line, both versions one under the other with the line number in each file. Files whose lines differ only in tabs and spaces are reported as changed, which reads oddly until you dump them.","cat":"Text tools","sub":"Sort, compare & merge"},{"name":"teachgammon","desc":"backgammon that teaches you the game as you play","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":48926,"usage":"Usage:  backgammon [-] [n r w b pr pw pb t3a]","star":true,"cat":"Games","sub":"Other games"},{"name":"tess","desc":"tesselation puzzle","src":"tess","origin":"usenet archive","archive":"tess.ar","dir":"CMDS/GAMES","size":37052,"star":true,"docs":true,"hassrc":true,"cat":"Games","sub":"Other games"},{"name":"testibc","desc":"IEEE-488 (GPIB) bus test program, B & K Denmark, 1989. Answer its `Timeout time (1/10 Sec)?' prompt and it draws a full command menu: Ifc, Remote, Llo, Goto local, Clear, Send, Enter, Dev-clear, Time, Quit.  Each command needs an IEEE-488 bus to reach.  It reads its messages from /dd/sys/errmsg.ibc.","needs":[{"path":"/dd/sys/errmsg.ibc","missing":true}],"dir":"CMDS","size":11448,"cat":"System & modules","sub":"Utilities"},{"name":"tet","desc":"Tetris -- `p' plays; s/j and f/l move a piece, d/k turns it, space drops it, q quits to the high-score table it keeps in GAMES/tet.hs.  Needs a terminal, not a pipe","src":"tet","origin":"usenet archive","archive":"tet.ar","needs":[{"path":"/dd/GAMES/tet.hs","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/GAMES","size":67372,"docs":true,"hassrc":true,"howto":"Tetris. `p' plays from the menu; s or j moves the piece left, f or l right, d or k turns it, space drops it, ESC pauses and q quits to the high-score table, kept in GAMES/tet.hs. Give it a real terminal: it does no terminal setup of its own (the raw-mode code in SRC/tet/tet.c is inside `#ifndef OSK'), so from a pipe it draws its board and reads nothing.","cat":"Games","sub":"Arcade & action"},{"name":"tex","desc":"TeX itself -- the typesetting program (a driver; virtex does the work)","dir":"CMDS/TEXCMDS","size":3160,"docs":true,"howto":"Run the engine, not the wrapper. `tex' is one line: it asks a shell to run `virtex \"&plain\" yourfile', the quoted format name is never unquoted, and the shell answers E$PNNF for the whole line (rc 221 with no $SHELL set, and silently). Type `virtex '&plain' yourfile.tex' instead. For LaTeX it is `virtex '&lplain' yourfile.tex', for SliTeX `virtex '&splain''. SYS/TEX/SAMPLES/small.tex is a LaTeX document and story.tex is plain TeX with no \\end.","cat":"Text tools","sub":"TeX"},{"name":"texidx","desc":"build an index from TeX's .idx output","dir":"CMDS/TEXCMDS","size":24348,"cat":"Text tools","sub":"TeX"},{"name":"textb","desc":"Mandelbrot set drawn in ASCII on an 80x25 terminal.  Start with X -2.3, Y -2.0, range 4.0, 32 iterations","dir":"CMDS","size":5354,"star":true,"docs":true,"hassrc":true,"howto":"An ASCII Mandelbrot viewer -- it asks four questions and draws. Try X_Coord -2.3, Y_Coord -2.0, RANGE 4.0, Max Iter 32. Needs Microware's cio.","cat":"Screen toys","sub":"Screen toys"},{"name":"tformat","desc":"text formatter (SNOBOL4-in-C)","src":"effo_snobol","origin":"EFFO forum","archive":"disk 9   PROGRAMME/C/SNOBOL","dir":"CMDS/GAMES","size":15954,"usage":"Usage: tformat [width|-?] [\u003cinfile] [>outfile]","hassrc":true,"cat":"Text tools","sub":"Format & typeset"},{"name":"tftopl","desc":"TeX font metric to property list (the readable form)","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":72600,"usage":"Usage: tftopl [-verbose] \u003ctfm file> [\u003cproperty list file>].","cat":"Text tools","sub":"TeX"},{"name":"tgatoppm","desc":"Targa to PPM (colour)","src":"netpbm","origin":"Microware OS-9 archive","archive":"osknet.readme NETPBM (an LHa archive)","needs":[{"path":"/dd/sys/rgb.txt","missing":false}],"dir":"CMDS/NETPBM","size":47776,"hassrc":true,"cat":"Graphics & images","sub":"NETPBM: into PNM"},{"name":"time","desc":"time a command","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":4396,"star":true,"docs":true,"hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"timid","desc":"timing utility -- and it reports itself as `timit', which is the name in its own usage line.  It takes NO command to time: `timid wc -c file' answers `timid: unknown option c'. `time' is the one that times a command.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":14664,"usage":"Syntax: timit [\u003copts>]\nFunction: time something\nOptions:","hassrc":true,"cat":"Developer tools","sub":"Benchmarks"},{"name":"today","desc":"date, moon phase and this-day-in-history","src":"today","origin":"usenet archive","archive":"today.ar","dir":"CMDS","size":19450,"docs":true,"hassrc":true,"cat":"Time & calendar","sub":"Calendars"},{"name":"todos","desc":"OS-9 to DOS line endings.  Use `autolf -c -C -L', which does the job -- todos and toos9 are no-ops (see below)","dir":"CMDS","size":2814,"star":true,"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"toos9","desc":"DOS to OS-9 line endings.  `autolf -l -C' converts the other way and is the one to use: todos and toos9 rewrite a file in place but leave it byte-identical to the input on CR-only OS-9 text, so they are no-ops here.  `flip' host-side or `tr' also convert.","dir":"CMDS","size":3748,"star":true,"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"top","desc":"show the busiest processes -- prints its heading and then aborts (E_PRCABT).  `aprocs' aborts the same way","src":"eff_top","origin":"EFFO forum","archive":"disk 16  SOFTWARE/C/TOP_MODIF","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":7150,"usage":"Syntax: top [\u003copts>] [\u003cnum>]\nFunction: display the processtable every num (def.: 10) seconds\nOptions:\n-a\tdisplay all process","star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"touchtype","desc":"TYPEFAST, a typing game: words fall down the screen and you type each one before it lands.  ESC ends the game and scores you in words per minute","src":"touchtype","origin":"usenet archive","archive":"touchtype.ar","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":46500,"hassrc":true,"howto":"Full-screen typing game. Answer `n' to the instructions question, pick a level 1-3 (q quits there), type each falling word followed by SPACE or RETURN. ESC ends the game and prints the words-per-minute score.","cat":"Amusements","sub":"Curiosities"},{"name":"tplot","desc":"Plot data to a plotter.  Asks for an interval and a range and drives the output device; written for an Atari ST","dir":"CMDS","size":12652,"usage":"Usage : hiplot \u003c-opt1> .. \u003c-optn> \u003cfile1> .. \u003cfilen>\n  Plots data from files or stdin,  prompting for axis\n  information unless the -a opt is used.\n  A blank line in the point file will lift the pen\n  If no files are specified stdin is used\n  opts :\n   -a=file   file has 3 lines with\n   x interval,  y interval,  x, y divisions\n   each line two numbers separated by ' '\n   -x=xaxis  xaxis title of x-axis\n   -y=yaxis  yaxis title of y-axis\n   -t=title  plot title","star":true,"cat":"Graphics & images","sub":"Plotting"},{"name":"transfer","desc":"copies files from GDOS DISKS to OS-9, and takes no options at all.  For general device-to-device copies, `cp', `copy' and `dsave' do that.","src":"forum1","origin":"Microware OS-9 archive","archive":"forum1.lzh","needs":[{"path":"/DD/DESC/DGDOS0","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":11212,"usage":"Syntax: transfer\nFunction: copy files from GDOS-disks to OS-9","star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"trap","desc":"system-state trap-handler example -- it installs a trap from system state.  Ask for it by PATH: `trap' is also a bash builtin, and the builtin answers first, silently.","src":"trap","origin":"usenet archive","archive":"trap.ar","dir":"CMDS","size":2488,"star":true,"hassrc":true,"howto":"The system-state trap-handler example: it installs a trap from system state. Ask for it BY PATH -- `/dd/CMDS/trap' -- because `trap' is also a bash builtin, and the builtin answers first, silently.","cat":"Developer tools","sub":"Debugging"},{"name":"travesty","desc":"rewrites its input as plausible nonsense, by Markov chains: `travesty -n400 \u003c file' for 400 characters of it","src":"travesty","origin":"usenet archive","archive":"Daniel J. Bernstein 1989, v1.1","dir":"CMDS","size":24990,"usage":"Usage: travesty [ -oord ] [ -nnum ] [ -rrand ] [ -sS ] [ -ACHUVW ]","docs":true,"hassrc":true,"cat":"Amusements","sub":"Generators"},{"name":"tree","desc":"print a directory tree, drawn with line graphics -- directories only, sorted, from the directory you name","src":"eff_tree","origin":"EFFO forum","archive":"disk 13  SOFTWARE/C/TREE","needs":[{"path":"/dd/sys/errmsg","missing":false},{"path":"/h0/sys/errmsg","missing":false}],"info":{"version":"V1.21","purpose":"displays directory tree","language":"C","author":"Christian Mahr","availability":"Public.","copyright":"(c) 1990 by C.Mahr"},"dir":"CMDS","size":19176,"usage":"Syntax: tree [\u003cdirectory>] [\u003copts>]\nFunction: print all subdirectories as a tree\n   use special graphics for VT100 compatibles\n   and for IBM compatibles printers and ATARI ST\nOptions:\n-f   print all files\n-w=n  limit name field width to n characters\n-d   internal debug flag\n-a   force terminal type to be ANY_TERM\n-v   force terminal type to be VT100\n-s   force terminal type to be ST/IBM","docs":true,"hassrc":true,"cat":"Files & directories","sub":"List & navigate"},{"name":"trunc","desc":"truncate a file to a given length","src":"forum23","origin":"Microware OS-9 archive","archive":"forum23.lzh","dir":"CMDS","size":3184,"usage":"Syntax: trunc \u003cpath> \u003cnum>\nFunction: reduce length of file \u003cpath> to \u003cnum>, where \u003cnum>\n   specifies the new file length in decimal or optionally\n   in hexadecimal when preceeded by '$' or '0x'.\nOptions: none","star":true,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"tsmon2","desc":"tsmon replacement - terminal monitor","src":"eff_tsmon","origin":"EFFO forum","archive":"disk 8   PROGRAMME/C/TSMON2","dir":"CMDS","size":18316,"usage":"Syntax:   tsmon2 [\u003coptions>] \u003cdevice name>\nFunction: Monitor terminal device to initiate the login procedure when\n   CR is typed (default case)\nOptions:  -i   : initiate login program as soon as DCD goes active\n   (no CR required to start login)\n   -t[=]\u003csec> : close and re-open path after specified number of\n   seconds of inactivity on port while waiting for CR\n   -k   : kill login process and all it's child processes\n   as soon as DCD goes inactive\n   -p=\u003cprog>  : Start \u003cprog> instead of 'login'\n   -a   : accept any character to initiate instead of CR only","docs":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"tsu","desc":"tterm's setup program","dir":"CMDS/COMMS","size":2980,"star":true,"cat":"Communications","sub":"Terminal & transfer"},{"name":"tt","desc":"Tetris for terminals: , and / move, . rotates, space drops, s pauses, q quits","needs":[{"path":"/h0/games/lib/ttscores","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/SYS/errmsg","missing":false}],"dir":"CMDS/GAMES","size":45616,"usage":"Usage: tt [ -s ] [ -b ] [ -l# ]","howto":"Tetris for terminals, full-screen: , and / move the piece, . rotates, space drops, s pauses, q quits.","cat":"Games","sub":"Arcade & action"},{"name":"tterm","desc":"Stephen Carville's terminal emulator, VT100-ish","needs":[{"path":"/dd/USR/TTERM/","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS/COMMS","size":29904,"usage":"Usage:  tterm \u003coptions>","star":true,"cat":"Communications","sub":"Terminal & transfer"},{"name":"tttt","desc":"tic-tac-toe","src":"hc_loose","origin":"hc disk","archive":"SOURCES/USENET/ (loose C sources)","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":33236,"hassrc":true,"howto":"Full-screen tic-tac-toe on a four-by-four board. Name a square as a column letter and a row digit, `b1'. `q' quits.","cat":"Games","sub":"Board & card"},{"name":"tty","desc":"report the terminal's name","dir":"CMDS","size":1448,"star":true,"cat":"System & modules","sub":"Utilities"},{"name":"ttyexp","desc":"fireworks that clear the screen; VT100, wants TERMCAP","src":"ttyexp","origin":"usenet archive","archive":"comp.sources.games -- Dennis Lo","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":34480,"usage":"Usage: ttyexp \u003cparameters>","hassrc":true,"cat":"Screen toys","sub":"Screen toys"},{"name":"txmod","desc":"send an OS-9 MODULE over a serial line","dir":"CMDS/COMMS","size":2898,"usage":"Syntax: TXMod [\u003copts>] module(s) [\u003copts>]\nOptions:\n-x   :  all modules in EXE dir","cat":"Communications","sub":"Terminal & transfer"},{"name":"ub68020demo","desc":"UniBasic 1.10 for the 68020 -- the same demonstration as `ub68kdemo' and it runs the same way, announcing `OS9/68020 Version' where the other says 68000.","dir":"CMDS/DEMOS","size":426242,"cat":"System & modules","sub":"Vendor demos"},{"name":"ub68kdemo","desc":"UniBasic 1.10 -- a BASIC compiler, same arrangement as OmniBasic.  Run it from /dd/DOC/unibasic","dir":"CMDS/DEMOS","size":527726,"howto":"UniBasic 1.10, and it does compile -- the trick is that it runs its build through $SHELL. With SHELL unset it hunts for `/dd/bash' and dies with \"Error Exit\" and error 216. Do `setenv SHELL /dd/CMDS/sh', work in a directory holding basic.h and basic.l (DOC/unibasic has them), have your C toolchain reachable with CDEF and CLIB set, and give it memory. DEMO VERSION: the symbol table is capped, nothing else is.","cat":"System & modules","sub":"Vendor demos"},{"name":"udate","desc":"UNAXCESS BBS date display -- and it gets the YEAR wrong: `Monday, August 31, 19126'.  A two-digit year (126, meaning 2026) written into a four-digit field behind a literal `19'.","src":"effo_unaxcess","origin":"usenet archive","archive":"effo_unaxcess.ar","dir":"CMDS","size":2338,"star":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"ularn","desc":"ULarn -- the larn variant, and its data is complete","needs":[{"path":"/dd/u","missing":true},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/h0/games/Ularn/","missing":false}],"dir":"CMDS/GAMES","size":162114,"cat":"Games","sub":"Dungeon crawl"},{"name":"uld","desc":"XModem upload","dir":"CMDS/COMMS","size":4468,"usage":"Syntax: uld \u003cfile>\nFunction: upload to \u003cfile> using XMODEM protocol","star":true,"cat":"Communications","sub":"Terminal & transfer"},{"name":"umacs","desc":"uMacs 1.0, MicroEMACS in 45K -- the same keys, no macro language","needs":[{"path":"/DD/SYS/","missing":false},{"path":"/H0/SYS/","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":45412,"star":true,"howto":"A small Emacs (uMacs 1.0). Full-screen: it takes the display and shows \"== uMacs 1.0 == main ==\" at the foot. It needs only TERM set.","cat":"Editors","sub":"emacs family"},{"name":"umusek","desc":"UMusEK -- a music editor.  It needs a hardware graphics screen: point it at one and it opens.  Without a graphics screen it stops with `***DS_ScAdd Error 208.' and `Fran: Can't get screen addr, 'bye!'.","needs":[{"path":"/DD/SYS/UM3.Init","missing":true},{"path":"/DD/SYS/AllUmK.img","missing":true},{"path":"/DD/SYS/Chars.img","missing":true}],"dir":"CMDS","size":140424,"cat":"System & modules","sub":"Utilities"},{"name":"undel","desc":"undelete a file","src":"eff_undel","origin":"EFFO forum","archive":"disk 6   PROGRAMME/C/UNDEL","dir":"CMDS","size":7482,"usage":"Usage: attr \u003cfile> -d","star":true,"docs":true,"hassrc":true,"cat":"Files & directories","sub":"Copy, move, delete"},{"name":"unexpand","desc":"Turn leading spaces back into tabs (GNU)","dir":"CMDS","size":27258,"usage":"Usage: unexpand [-tab1[,tab2[,...]]] [-t tab1[,tab2[,...]]] [-a]","cat":"Text tools","sub":"Transform & filter"},{"name":"unifdef","desc":"remove #ifdef sections from C source.  Its option is `-d\u003csym>' -- lower case, no equals -- and `-u\u003csym>' for the other side; `-D\u003csym>' is refused.","src":"hc_utils","origin":"hc disk","archive":"SOURCES/UTILS/  (loose C sources)","dir":"CMDS","size":17786,"usage":"syntax: unifdef {\u003copts>} [\u003cfile>]\nfunction: remove ifdef'ed lines from source file\noptions:\n-c   operation of unifdef is complemented","hassrc":true,"howto":"Its option is `-d\u003csym>' -- lower case, no equals -- and `-u\u003csym>' for the other side. `-DOSK' is refused with its own help, which reads like the program working and is not.","cat":"Developer tools","sub":"Source formatting"},{"name":"unip","desc":"unique lines with page numbers","src":"bix","origin":"EFFO forum","archive":"disk 6 PROGRAMME/bix (bix.arc) -- BIX utility collection","dir":"CMDS","size":15114,"usage":"Syntax: unip [\u003copts>] [\u003csrcpath>] [\u003copts>]","hassrc":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"uniq","desc":"drop duplicate lines","dir":"CMDS","size":3104,"usage":"Usage: UNIQ [-u][-d][-c] [-n] [^n] input [>output]\n-u ==> just output unrepeated lines\n-d ==> output one copy of just repeated lines","star":true,"docs":true,"cat":"Text tools","sub":"Sort, compare & merge"},{"name":"UnMacpack","desc":"Unpack MacPack format.  Named for its module, which is UnMacpack rather than unmacpack","dir":"CMDS","size":41166,"usage":"Usage: macunpack [-UnMacpack] [filename]","cat":"Encoding & conversion","sub":"Macintosh"},{"name":"unp","desc":"Strip unprintable characters from a stream (Carl Kreider)","dir":"CMDS","size":1680,"usage":"Usage:  unp [-?] [file]","star":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"unpacklib","desc":"split an OS-9 library into its modules","src":"eff_libutils","origin":"EFFO forum","archive":"disk 15  SOFTWARE/C/LIBUTILS","dir":"CMDS","size":4572,"usage":"Usage: unpacklib \u003coptions> file1.l file2.l ...","star":true,"docs":true,"hassrc":true,"cat":"Archives & compression","sub":"OS-9 module libraries"},{"name":"unpacklib.os9","desc":"unpack a library into its object modules","dir":"CMDS","size":17728,"usage":"Usage: unpacklib \u003coptions> file1.l file2.l ...","cat":"System & modules","sub":"Utilities"},{"name":"unsit","desc":"Unpack a StuffIt archive (V1.15f, Nigel Perry)","dir":"CMDS","size":35290,"usage":"Usage: Unsit [-rdulM] [-vqfm] filename\nOptions:\n   -r = Extract Resource Fork only\n   -d = Extract Data Fork only\n   -u = Mac -> Unix Text\n   -l = List Archive Contents\n   -M = Macbinary","docs":true,"cat":"Encoding & conversion","sub":"Macintosh"},{"name":"unstr","desc":"reverse strfile - dump a fortune index.  It takes the index BASE name, appending `.dat' itself, so `unstr /dd/GAMES/FORTUNE/fortunes' is the invocation and bare it prints its own usage.  DOC/README-CIO","src":"fortune","origin":"usenet archive","archive":"fortune.ar","dir":"CMDS","size":15172,"usage":"usage: unstr datafile[.dat] [ outfile ]","hassrc":true,"cat":"Text tools","sub":"Fortune & sayings"},{"name":"unsubscribe","desc":"drop one, and it does that too: `!' replaces `:'.  It has one bug of its own -- for a group that is ALREADY off it prints `Newsgroup  684700s already unsubscribed.', because the string in the binary is `Newsgroup % is already unsubscribed.' with no conversion letter after the `%'","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":9330,"usage":"usage: unsubscribe \u003cnewsgroup> [newsgroup...]","star":true,"hassrc":true,"cat":"Communications","sub":"News"},{"name":"unzip","desc":"Info-ZIP unzip -- reads zips made elsewhere; DOC/zip/sample.zip is one to try it on.  `zoo', `tar' and `gzip' are the archivers on this disk","src":"unzip50","origin":"Microware OS-9 archive","archive":"unzip50_src.lzh -- Info-ZIP 5.0,","dir":"CMDS","size":42060,"usage":"Usage: unzip [ -options[modifiers] ] file[.zip] [filespec...]\n-x  extract files (default)   -l  list files (short format)\n-c  extract files to stdout/screen (CRT)   -v  list files (verbose format)\n-f  freshen existing files, create none   -p  extract to pipe, no messages\n-u  update files, create if necessary   -t  test archive integrity\n   -z  display archive comment","star":true,"docs":true,"hassrc":true,"cat":"Archives & compression","sub":"Create & extract"},{"name":"upperdir","desc":"Normalise case: files lowercase, dirs uppercase","src":"upperdir","origin":"Microware OS-9 archive","dir":"CMDS","size":8126,"usage":"Usage: UpperDir [directory name]","hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"uucico","desc":"the transfer program itself -- dials, talks UUCP","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/UUCP/Systems","missing":false},{"path":"/DD/SYS/UUCP/Devices","missing":false},{"path":"/DD/SYS/UUCP/Dialers","missing":false},{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":43498,"usage":"usage: uucico [opts] -r | sys [sys...]  [opts]","star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uuclean","desc":"remove stale jobs from the spool.  The spool is /dd/SPOOL/uucp, and SYS/UUCP/Parameters names it.  uuclean walks every ENTRY in the spool as if it were a directory, so the README that keeps the directory in the repository trips it: `can't change to directory .../README'. Harmless, and it is why the message is not a sign of a broken spool","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":21074,"usage":"Usage: uuclean [opts]","star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uucp","desc":"queue a file copy to or from another site","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/UUCP/sequence.spool","missing":true},{"path":"/DD/SYS/password","missing":false}],"dir":"CMDS/UUCP","size":15682,"star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uudecode","desc":"uudecode","dir":"CMDS","size":3440,"usage":"USAGE: uudecode [infile]","star":true,"cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uuencode","desc":"uuencode.  Give it ONE argument -- the input file -- and redirect: `uuencode myfile > myfile.uu'.  Its own usage line prints `uuencode >outfile [infile] name', which fails with two arguments.","dir":"CMDS","size":2416,"usage":"USAGE: uuencode >outfile [infile] name","star":true,"howto":"ONE argument, the file: `uuencode /dd/SYS/motd > out.uu'. Its usage line reads as though it wants two and with two it prints that line and stops. `uudecode' is what undoes it.","cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uuexpand","desc":"make text portable across 8- and 16-bit machines, reading standard input: its own usage is `uuexpand [opts]' or `uuunexpand [opts]', with -8 and -16 choosing which.  To undo a `uuencode', that is `uudecode', which is here","src":"v_misc","origin":"hc disk","archive":"SOURCES/USENET/v_misc.ar","dir":"CMDS","size":17590,"usage":"Usage: uuexpand [opts]","hassrc":true,"howto":"Makes text portable across 8- and 16-bit machines, reading standard input. Its own usage is `uuexpand [opts] / or: uuunexpand [opts]' with -8 and -16 choosing which. Use `uudecode' to undo `uuencode'.","cat":"Encoding & conversion","sub":"Text encodings"},{"name":"uulog","desc":"show the transfer log","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false}],"dir":"CMDS/UUCP","size":7736,"usage":"Usage: uulog [-s\u003csysname> -u\u003cusername> -d\u003cdays>] [-f]","star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uuname","desc":"list the sites you can reach","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/SYS/UUCP","missing":false},{"path":"/DD/SYS/UUCP/Systems","missing":false}],"dir":"CMDS/UUCP","size":6320,"usage":"Usage:  uuname [-l]\n   -l   show name of this machine","star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uupoll","desc":"poll a site for waiting work.  It works silently: `uupoll nowhere' leaves /dd/SPOOL/uucp/nowhere/C.nowhereAPOLL, and the grade letter from -g goes into the name (`-gZ' -> ...ZPOLL)","needs":[{"path":"/DD/USR/LIB/UUCP/Config","missing":false},{"path":"/DD/SPOOL/UUCP","missing":false},{"path":"/DD/SPOOL/UUCPPUBLIC","missing":false},{"path":"/DD/SPOOL/MAIL","missing":false},{"path":"/DD/SYS/.LOCKS/MAIL.LOCKS","missing":true},{"path":"/DD/USR/LIB/UUCP","missing":false},{"path":"/dd/sys/password","missing":false},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/UUCP","size":7244,"usage":"Usage: uupoll [-g\u003cgrade>] system","star":true,"howto":"Polls a UUCP site for waiting work, and it does the job in SILENCE -- which is why it reads as broken. `uupoll \u003csite>' leaves /dd/SPOOL/uucp/\u003csite>/C.\u003csite>APOLL; the grade letter from -g goes into the name, so `-gZ' gives ...ZPOLL. Blars uucp; wants the `uucp' user, which SYS/password has.","cat":"Communications","sub":"Mail"},{"name":"uux","desc":"run a command on another UUCP site","needs":[{"path":"/DD/USR/LIB/UUCP/Config","missing":false},{"path":"/DD/SPOOL/UUCP","missing":false},{"path":"/DD/SPOOL/UUCPPUBLIC","missing":false},{"path":"/DD/SPOOL/MAIL","missing":false},{"path":"/DD/SYS/.LOCKS/MAIL.LOCKS","missing":true},{"path":"/DD/USR/LIB/UUCP","missing":false},{"path":"/dd/sys/password","missing":false},{"path":"/DD/SYS/Password","missing":false}],"dir":"CMDS/UUCP","size":11536,"usage":"Syntax: uux [\u003copts>] \u003chost>!\u003cprog> [\u003cargs>]\nFunction: UUCP Executive\nOptions:","star":true,"howto":"Runs a command on another UUCP site. This is BLARS uucp, which reads USR/LIB/UUCP/Config -- a different configuration from UUCPbb's SYS/UUCP. Both ship.","cat":"Communications","sub":"Mail"},{"name":"uuxqt","desc":"run the jobs a remote site queued here.  It looks for a module called `procs' to see whether it is already running, so it wants a `procs' loaded (error 221 without one).","src":"uucpbb","origin":"Microware OS-9 archive","archive":"uub21osk.lzh (expire, rnews from uubb21p1.lzh)","needs":[{"path":"/DD/LOG","missing":false},{"path":"/DD/SYS/UUCP","missing":false}],"dir":"CMDS/UUCP","size":14418,"usage":"Usage:  uuxqt [opts]  \u003csys> [\u003csys>...]  [opts]","star":true,"hassrc":true,"cat":"Communications","sub":"UUCP"},{"name":"uwho","desc":"UNAXCESS BBS -- who is online.  Opens `/etc/utmp'; in OS-9 a leading /etc names a DEVICE, so it wants an /etc device presenting utmp, which the BBS would supply.  A Unix-ism from the port","src":"effo_unaxcess","origin":"usenet archive","archive":"effo_unaxcess.ar","dir":"CMDS","size":4360,"star":true,"hassrc":true,"cat":"Communications","sub":"Terminal & session"},{"name":"valspeak","desc":"Valley-speak text filter: standard input in, the rewritten text out. `I think this operating system is really good' comes back as `I think this operatin' system is like wow! really bitchin''.","src":"toys","origin":"usenet archive","archive":"toys.ar","dir":"CMDS/GAMES","size":25704,"hassrc":true,"cat":"Text tools","sub":"Transform & filter"},{"name":"vc","desc":"a SPREADSHEET -- `Welcome to the Spreadsheet Calculator, type ? for help', with rows, columns and a formula line","needs":[{"path":"/dd/sys/","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":32698,"star":true,"docs":true,"cat":"System & modules","sub":"Utilities"},{"name":"vecho","desc":"System V `echo': the newline is suppressed by a trailing \\c IN THE ARGUMENT, not by default.  `vecho one' writes `one' and a CR; `vecho one\\c' writes `one' and stops. Several arguments are joined with a space.  SRC/less_v177","src":"less_v177","origin":"Microware OS-9 archive","archive":"less.v177.lzh","dir":"CMDS","size":6050,"hassrc":true,"cat":"System & modules","sub":"Utilities"},{"name":"version","desc":"prints ITS OWN version and nothing else -- `Dies ist das Program 'version', Version 7' -- whatever module you name. `ident' and `modinfo' show a module's edition.","src":"version","origin":"EFFO forum","archive":"disk 15 SOFTWARE/C/VERSION","info":{"version":"no version","purpose":"version display","language":"C","author":"Christian Mahr","availability":"Public. very public."},"dir":"CMDS","size":1560,"star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"OS-9 modules"},{"name":"vftovp","desc":"virtual font to virtual property list","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":90226,"usage":"Usage: \u003cvfm file> \u003ctfm file> \u003cvpl file>.","howto":"`vftovp s.vf s.tfm back.vpl' reads the binary pair back to text. VFFONTS and TEXFONTS must name where the .vf and .tfm are.","cat":"Text tools","sub":"TeX"},{"name":"vi","desc":"the real vi/ex, and it keeps the name -- its source in SRC/effo_vi is the Berkeley ex source itself, not a clone. `vi -x' is ex, `vi -d' is edit.  See DOC/README-VI.","src":"effo_vi","origin":"EFFO forum","archive":"disk 13  SOFTWARE/C/VI/SRC","needs":[{"path":"/dd/SYS/vi_errmsg","missing":false},{"path":"/dd/SYS/vi_usage","missing":false},{"path":"/dd/SYS/.exrc","missing":false},{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false},{"path":"/dd/tmp","missing":false},{"path":"/dd/CMDS/zsh","missing":true}],"dir":"CMDS","size":91760,"star":true,"docs":true,"hassrc":true,"howto":"One of three unrelated vi editors here, and the only one that is the genuine Berkeley ex/vi rather than a clone -- its source in SRC/effo_vi is the real ex_*.c files. `vi -x' becomes ex, `vi -d' becomes edit. DOC/README-VI compares all three.","cat":"Editors","sub":"vi family"},{"name":"vi.elvis","desc":"elvis 1.7 as vi.  CMDS/vi is the EFFO build and CMDS/vi_nocio is PVic -- three unrelated vi clones","dir":"CMDS/REBUILT","size":15140,"cat":"Editors","sub":"vi clones"},{"name":"vi_1.0","desc":"PVIC 1.0, public domain      -> /dd/CMDS/REBUILT (name was taken) and CMDS/vi_nocio are PVIC 1.0a","needs":[{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS/REBUILT","size":78496,"usage":"Usage: vi [file ...]","cat":"Editors","sub":"vi family"},{"name":"vi_cio","desc":"PVic vi, cio build (use vi_nocio instead)","needs":[{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":61714,"usage":"Usage: vi [file ...]","star":true,"howto":"PVIC 1.0a built with cio. Put the termcap entry in TERMCAP first (`. /dd/SYS/termcap.entry'), then `vi_cio \u003cfile>'. CMDS/vi_nocio is the same editor needing no module.","cat":"Editors","sub":"vi family"},{"name":"vi_nocio","desc":"PVIC 1.0a -- the smallest of this disk's three vi editors, public domain.  See DOC/README-VI to choose between them","needs":[{"path":"/dd/sys/termcap","missing":false}],"dir":"CMDS","size":81464,"usage":"Usage: vi [file ...]","howto":"PVIC 1.0a, the smallest of the three vi editors on this disk, public domain, no source or docs here. DOC/README-VI compares it with vi and elvis.","cat":"Editors","sub":"vi family"},{"name":"view","desc":"elvis opened read-only","dir":"CMDS","size":15132,"cat":"Editors","sub":"vi clones"},{"name":"virmf","desc":"the real MetaFont engine -- generates fonts from .mf sources","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":327106,"howto":"Metafont. `virmf '&cmbase' '\\scrollmode; \\mode:=epsonlo; \\input cmr10; \\end'' renders all 128 characters of cmr10. THE JOB NAME COMES FROM THE COMMAND LINE: the same line fed on standard input renders the same font and calls it `mfput'.","cat":"Text tools","sub":"TeX"},{"name":"virtex","desc":"the real TeX engine, loaded with a format","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":288860,"howto":"The real TeX engine, and the one to use -- see `tex'. It wants the format first: `virtex '&plain' file.tex' or `virtex '&lplain' file.tex'. The formats that ship are plain, lplain and splain, in SYS/TEX/FORMATS.","cat":"Text tools","sub":"TeX"},{"name":"vis","desc":"run a command over and over and refresh the screen with its output -- what `watch' does on other systems: `vis {opts} \u003ccommand> \u003cargs>'.  Not the Unix `vis' that makes non-printing characters visible","src":"vis","origin":"usenet archive","archive":"vis.ar   [also built from v_misc]","needs":[{"path":"/dd/sys/termcap","missing":false},{"path":"/h0/sys/termcap","missing":false}],"dir":"CMDS","size":24814,"star":true,"docs":true,"hassrc":true,"cat":"System & modules","sub":"Processes & memory"},{"name":"vlen","desc":"a VARIABLE-LENGTH RECORD demonstration: it ignores whatever you give it, creates a filesystem of its own, adds a hundred records of varying length and prints the minimum, the maximum and the mapper entries as it goes.  `isam' is the other demonstration of its kind here.  IT LEAVES ITS STORE BEHIND, in the DATA directory, as `test.mp' and `test.st' -- run it twice and the second run answers `Filesystem already exists.' and adds nothing.  Delete those two to run it again.","dir":"CMDS","size":9318,"star":true,"howto":"It leaves its store behind, in the DATA directory, as `test.mp' and `test.st'. Run it twice and the second run says `Filesystem already exists.' and adds nothing; delete those two to run it again.","cat":"System & modules","sub":"Utilities"},{"name":"vmod_trap","desc":"the VMod_trap trap library rxmod and txmod need.  Type-$0B, and it runs in SUPERVISOR state, so it installs here and then faults.  Renamed from lowercase `vmod_trap' -- rxmod asks for `VMod_trap' and real OS-9 matches exactly and it runs in SUPERVISOR state, so it installs here and then faults.  Renamed from lowercase `vmod_trap' -- rxmod asks for `VMod_trap' and real OS-9 matches exactly","dir":"CMDS/COMMS","size":202,"cat":"System & modules","sub":"OS-9 modules"},{"name":"vptovf","desc":"virtual property list to virtual font","needs":[{"path":"/DD/SYS/TEX/FONTS","missing":false},{"path":"/DD/USR/TEX/FONTS","missing":true},{"path":"/DD/SYS/TEX/BIB","missing":false},{"path":"/DD/USR/TEX/BIB","missing":true},{"path":"/DD/SYS/TEX/MFBASES","missing":false},{"path":"/DD/USR/TEX/MFBASES","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/MFINPUTS","missing":false},{"path":"/DD/USR/TEX/MFINPUTS","missing":true},{"path":"/DD/SYS/TEX/POOLS","missing":false},{"path":"/DD/USR/TEX/POOLS","missing":true},{"path":"/DD/SYS/TEX/FORMATS","missing":false},{"path":"/DD/USR/TEX/FORMATS","missing":true},{"path":"/DD/SYS/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/SYS/TEX/INPUTS","missing":false},{"path":"/DD/SYS/TEX/SAMPLES","missing":false},{"path":"/DD/USR/TEX/INPUTS/LOCAL","missing":true},{"path":"/DD/USR/TEX/INPUTS","missing":true},{"path":"/DD/USR/TEX/SAMPLES","missing":true},{"path":"/DD/SYS/TEX/FONTS/VF","missing":true},{"path":"/DD/USR/TEX/FONTS/VF","missing":true}],"dir":"CMDS/TEXCMDS","size":99452,"usage":"Usage: vptovf \u003cvpl file> \u003cvfm file> \u003ctfm file>.","howto":"`vptovf /dd/DOC/tex/sample.vpl s.vf s.tfm'. sample.vpl is a one-character virtual font written for this, mapping `A' onto cmr10's.","cat":"Text tools","sub":"TeX"},{"name":"vtxtcn","desc":"world - build its text tables.  Writes .inc files; needs world's .dat files in the current directory","src":"world","origin":"usenet archive","archive":"world.ar","dir":"CMDS/GAMES","size":16274,"hassrc":true,"cat":"Games","sub":"Other games"},{"name":"wam.sbprolog","desc":"SB-Prolog 2.2 WAM engine -- see DOC/sbprolog/README-SBPROLOG","src":"sbprolog","origin":"PD disk","archive":"3, SBPROLOG2.2/SIM -- SB-Prolog 2.2, SUNY Stony Brook","dir":"CMDS","size":72088,"usage":"Usage: sim [-Ttdns] [-m s_size] [-p p_size] [-b tr_size] [-ui num] pil_file_name ...","hassrc":true,"cat":"Languages","sub":"Interpreters"},{"name":"wanderer","desc":"Boulderdash-style maze game.  Screens ARE here, in GAMES/WAND/screens; needs this disk as /dd to find them.","src":"wanderer","origin":"usenet archive","archive":"wanderer.ar","needs":[{"path":"/dd/GAMES/wand/screens","missing":fal
