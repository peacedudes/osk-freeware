# Build the RBF image, and attach it to a release when one is tagged.
#
# The build needs no Microware utility and no OS-9 system disk -- only the
# os9exec binary, which this workflow compiles from source. That is the whole
# reason CI is possible at all; see notes/ROADMAP-freeware.md.
name: build-image

on:
  push:
    tags: ['v*']            # tagged release: build and attach the image
    branches: [main]        # ordinary push: build and check, no release
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      os9exec_ref:
        description: 'os9exec ref to build against'
        required: false
        default: fix/scf-pd-eor

env:
  # WHICH os9exec. The collection is developed and tested against the branch
  # the os9exec project is actively working on -- every harness in tools/
  # runs the binary built from that working tree -- NOT against what is on
  # github/master, which is a long way behind and lacks every fix this
  # collection now depends on:
  #
  #   40facae  F$Alarm, and Linux renaming every dot-file on an RBF image
  #   d401ce2  an F$STrap table's handler offset is signed  (this is why
  #            `config' stopped looking as though it wanted a 68881)
  #   685a4c3  SS_EOF on host-directory files
  #   00fcec5  F$PErr searches only a path it can search -- without it a
  #            mistyped `load' name repeats its error until you kill the
  #            session
  #
  # So this names the BRANCH. Until that branch is pushed, this workflow
  # cannot run, and that is the correct failure: the alternative was a
  # commit pin at 261b4b6 (2026-08-04, on master) which would have built an
  # emulator without any of the above and reported success.
  #
  # AT RELEASE, FREEZE IT. Replace the branch with a COMMIT, so that a
  # force-push or a regression on a moving branch cannot change what a
  # tagged build produced. The tip moves fast -- 665ca8c to 7d54fa1 inside a
  # few hours on 2026-09-19 -- so take the hash at the moment of tagging.
  #
  # ASK FOR THE COMMIT; DO NOT JUST TAKE THE TIP. On 2026-09-20 the tip was
  # d64163b and it carried a flake its own author knew about and we did not:
  # an idle-wait cap that made their XOFF test fail about one run in three.
  # A freeze that night would have taken exactly that commit. They corrected
  # it and named 60d4b0a as the one to pin -- seventeen clean full-suite runs
  # behind it, several under deliberate contention. The lesson is not the
  # hash, which will be stale again: it is that the person who owns the
  # emulator knows which commit is good and a tip does not.
  #
  # 2026-09-26: the working branch was renamed release-v4.1.0 and pushed
  # (f2954f3; its emulator source is 8d7d870's, on which the suite passed
  # 1019/1019 twice). fix/scf-pd-eor no longer exists on GitHub. Freeze to
  # the merge commit the os9exec project names.
  OS9EXEC_REPO: peacedudes/os9exec
  OS9EXEC_REF: release-v4.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # the release step uploads the image
      pages: write            # the catalogue is published to GitHub Pages
      id-token: write         # deploy-pages authenticates with OIDC
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4

      - name: Pick the os9exec ref
        id: ref
        run: echo "value=${{ github.event.inputs.os9exec_ref || env.OS9EXEC_REF }}" >> "$GITHUB_OUTPUT"

      # Runs before anything is compiled: these catch the mistakes that are
      # invisible in a built image, and cost seconds.
      - name: Check the disk tree
        run: tools/check_disk.py disk

      # The catalogue and the sample-output screens are GENERATED and
      # committed, so they can fall behind what they describe without any
      # test noticing. These two say so. --check on gen_screens is the one
      # that matters: a stanza edited after its capture was taken publishes
      # the OLD screen under the NEW caption, and nothing else catches it.
      - name: Check every program is catalogued
        run: tools/gen_catalog.py disk --check

      - name: Check no screen has drifted from its stanza
        run: tools/gen_screens.py --check

      - name: Check out os9exec
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OS9EXEC_REPO }}
          ref: ${{ steps.ref.outputs.value }}
          path: os9exec

      - name: Build os9exec
        run: make -C os9exec -j"$(nproc)"

      # Fail here, with a reason, rather than let mkimage.sh report an
      # "unknown option" that says nothing about which commit is missing.
      - name: Check os9exec can create a named blank image
        run: |
          if ! ./os9exec/os9exec -r mount '-?' 2>&1 | tr -d '\000' | grep -q -- '-v=<name>'; then
            echo "::error::os9exec at '${{ steps.ref.outputs.value }}' has no 'mount -k -v=<name>'."
            echo "::error::That branch needs the commit which also stopped images being dated 1902."
            exit 1
          fi

      - name: Build the image
        run: OS9EXEC_DIR="$PWD/os9exec" tools/mkimage.sh disk osk-freeware.dd

      # mkimage.sh fails if tar extracted the wrong number of files. This is
      # the other half: mount the finished image and use it. Both checks below
      # fail against a blank image, which is what makes them worth running.
      #
      # STRIP CR AS WELL AS NUL. OS-9 ends a line with CR, so `basename' answers
      # "c\r" and the `grep -qx c' below never matched it -- this step would
      # have failed on every run the workflow ever made, on a disk that was
      # perfectly good. Found 2026-08-30 by running the whole workflow locally
      # against a clean `git archive' export, which is the only way it had ever
      # been exercised: the branch this lives on has never been pushed.
      - name: Read the image back
        run: |
          img="$PWD/osk-freeware.dd"
          run() { OS9DISK="$img" ./os9exec/os9exec -r "$@" 2>&1 | tr -d '\000\r' | grep -v '^#'; }

          run wc /dd/startup | grep -q '/dd/startup' || {
            echo "::error::cannot read /dd/startup from the image"; exit 1; }

          run basename /a/b/c | grep -qx 'c' || {
            echo "::error::cannot load and run a module from the image"; exit 1; }

          echo "image reads files and executes modules"

      - name: Compress
        run: |
          gzip -9 -c osk-freeware.dd > osk-freeware.dd.gz
          ls -lh osk-freeware.dd osk-freeware.dd.gz

      - name: Upload as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: osk-freeware-image
          path: osk-freeware.dd.gz
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            || echo "release already exists, uploading to it"
          gh release upload "${GITHUB_REF_NAME}" osk-freeware.dd.gz --clobber

      # GitHub renders Markdown from a repository but not HTML -- clicking an
      # .html file shows its source. The catalogue is only inviting once Pages
      # serves it, so publish it there. Requires Pages enabled for the repo
      # with "GitHub Actions" as the source; until then this step is skipped.
      # The browser demo serves the disk it was built with.  docs/try holds
      # the page and the WebAssembly build of os9exec; the image is not in
      # the repository, so it is put in place here, from the one just built.
      - name: Put the disk under the browser demo
        run: |
          cp osk-freeware.dd.gz docs/try/disk.gz
          ls -lh docs/try

      - name: Rebuild the catalogue
        run: tools/gen_catalog.py disk docs/index.html

      - name: Package the catalogue for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish to Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        continue-on-error: true          # Pages may not be enabled yet
        uses: actions/deploy-pages@v4
