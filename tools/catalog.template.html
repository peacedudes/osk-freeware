<title>OS-9/68K Freeware Collection — a guide to __TOTAL__ programs</title>
<style>
  :root{
    --paper:#F4F5F3; --card:#FFF; --ink:#191D21; --dim:#454E55; --faint:#6E787F;
    --rule:#DDE1DE; --hair:#EBEEEB; --accent:#B26A00; --soft:#F7E8D2;
    --warn:#8C2F1E; --ok:#2E6A4F; --screen:#0E1113; --phosphor:#CFE3CF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#B1BCC3; --faint:#8A959C;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}}
  :root[data-theme="dark"]{
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#B1BCC3; --faint:#8A959C;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* THE PAGE IS THREE COLUMNS: what kinds of thing there are, the programs
     of one kind, and one program.  Choosing in a column fills the next one
     and never covers the one you chose in -- the reader keeps their place. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px 22px;align-items:center;
       padding:12px 20px 10px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;
          white-space:nowrap}
  .top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;
                color:var(--dim);letter-spacing:0}
  .top input[type=search]{width:100%;max-width:520px;font:inherit;font-size:15px;padding:8px 12px;
    border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
  .only{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .only > span{display:flex;gap:6px}
  .shellsw{padding-right:12px;margin-right:6px;border-right:1px solid var(--rule)}
  .chip{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--dim);white-space:nowrap}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}

  .cols{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(380px,1.5fr);
        min-height:0;height:100%}
  .col{min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--rule)}
  .col:last-child{border-right:0}
  .col > h2{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.03em;
          color:var(--faint);margin:0;padding:14px 16px 6px}

  /* column one: categories, then the alphabet */
  .kinds{list-style:none;margin:0;padding:0 8px 8px}
  .kinds li{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;
            cursor:pointer;font-size:14px}
  .kinds li .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
               font-variant-numeric:tabular-nums}
  .kinds li:hover{background:var(--hair)}
  .kinds li[aria-current="true"]{background:var(--soft);color:var(--ink)}
  .kinds li[aria-current="true"] .n{color:var(--accent)}
  .abc{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 12px 20px}
  .abc button{font:500 12px/1 var(--mono);padding:7px 0;border:1px solid transparent;
              border-radius:6px;background:none;color:var(--dim);cursor:pointer}
  .abc button:hover{border-color:var(--rule);color:var(--ink)}
  .abc button[aria-current="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
  .abc button:disabled{color:var(--faint);opacity:.4;cursor:default}

  /* column two: the programs of one kind */
  .lede{padding:0 18px 12px;font-size:13.5px;color:var(--dim);max-width:52ch}
  .subh{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
        color:var(--faint);padding:14px 18px 4px;border-top:1px solid var(--hair)}
  .subh:first-of-type{border-top:0}
  .progs{list-style:none;margin:0;padding:0 8px 8px}
  li.p{display:grid;grid-template-columns:auto minmax(88px,120px) 1fr;gap:9px;padding:5px 10px;
       align-items:baseline;cursor:pointer;border-radius:7px}
  li.p:hover{background:var(--hair)}
  li.p[aria-current="true"]{background:var(--soft)}
  .nm{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nm .st{color:var(--accent)}
  .ds{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
  .ds .where{color:var(--faint)}
  li.p .pick{width:18px;height:18px;align-self:start;margin-top:2px;border:1px solid var(--rule);border-radius:4px;
    background:var(--card);color:var(--faint);font:600 12px/16px var(--mono);text-align:center;
    cursor:pointer;padding:0}
  li.p .pick:hover{border-color:var(--accent);color:var(--accent)}
  li.p.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff}
  .overview{padding:4px 8px 12px}
  .overview li{display:block;padding:9px 10px;border-radius:7px;cursor:pointer}
  .overview li:hover{background:var(--hair)}
  .overview .ct{font-family:var(--serif);font-size:16px;font-weight:600}
  .overview .ct .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;
                   margin-left:6px}
  .overview .blurb{font-size:12.5px;color:var(--dim);margin:2px 0 0}
  .empty{padding:40px 18px;color:var(--dim);font-size:14px;max-width:48ch}

  /* column three: one program */
  .panel{padding:18px 22px 40px}
  .pn{font-family:var(--mono);font-size:22px;font-weight:600;margin:0}
  .pd{color:var(--dim);margin:5px 0 0;font-size:15px;max-width:60ch}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .flag{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
        color:var(--dim)}
  .flag.cio{border-color:var(--accent);color:var(--accent)}
  .flag.mil{border-color:var(--warn);color:var(--warn)}
  .flag.ok{border-color:var(--ok);color:var(--ok)}
  dl{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;margin:18px 0 0;font-size:13.5px}
  dt{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
     padding-top:2px}
  dd{margin:0;color:var(--ink);overflow-wrap:anywhere;min-width:0}
  dd code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  dd .miss{color:var(--warn)}
  dd pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  pre.shot{font-family:var(--mono);font-size:11px;line-height:1.2;margin:0;
    white-space:pre;overflow-x:auto;background:var(--screen);color:var(--phosphor);
    border-radius:6px;padding:10px 12px}
  pre.shot .pr{color:var(--faint)}
  .shotcap{margin:.5rem 0 0;color:var(--dim);font-size:12.5px;line-height:1.45;max-width:64ch}
  /* A caption quotes a key or a command as `x' -- the keys that get you OUT
     of a full-screen program most of all.  Those are what a reader hunts for,
     so they are not the same colour as the prose around them. */
  .shotcap .key{font-family:var(--mono);font-size:12px;color:var(--accent)}
  /* A program whose NAME is also the name of a utility the reader owns.
     rdoggett: "I want to do it with informed consent" -- so this is a
     callout on the card, not a line in a document they must go and find. */
  .shadow{margin:12px 0 0;padding:9px 11px;border-radius:6px;
    background:var(--soft);border:1px solid var(--accent);
    color:var(--ink);font-size:13px;line-height:1.5}
  .shadow b{font-weight:600}
  .shadow code{font-family:var(--mono);font-size:12.5px}
  .brings{display:flex;align-items:baseline;gap:12px;margin:14px 0 0;font-size:13px}
  .brings ul{list-style:none;margin:0;padding:0;color:var(--dim)}
  .brings li{display:flex;gap:10px;align-items:baseline}
  .brings code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .brings .sz{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .brings .note{font-size:12px;color:var(--faint)}
  .brings li.sub{padding-left:16px}
  .brings li.sub code{color:var(--dim)}
  dd .howto{font-size:13px;line-height:1.45;max-width:64ch}
  dd.advice{color:var(--dim);font-size:12.5px;line-height:1.45}
  dd .okk{color:var(--ok);font-size:11.5px}
  dd a.kin{color:var(--accent);text-decoration:none}
  dd a.kin:hover{text-decoration:underline}
  .try,.needs{display:flex;align-items:baseline;gap:12px;margin:14px 0 0;font-size:13.5px}
  .try .k,.needs .k,.see .k,.brings .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;
     letter-spacing:.03em;flex:0 0 auto}
  .try code{font-family:var(--mono);font-size:14.5px;color:var(--ink);background:var(--paper);
     border:1px solid var(--rule);border-radius:6px;padding:6px 11px}
  .try code .pr{color:var(--faint)}
  .try code.copycmd{cursor:pointer;position:relative;transition:background .15s}
  .try code.copycmd:hover{background:var(--rule)}
  .try code.copycmd:focus-visible{outline:2px solid var(--faint);outline-offset:2px}
  .try code.copycmd.copied{background:var(--rule)}
  .try code.copycmd.copied::after{content:"copied";position:absolute;left:100%;margin-left:8px;
     white-space:nowrap;color:var(--faint);font-size:11.5px;font-family:var(--mono)}
  .needs code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .needs span{color:var(--dim)}
  .see{margin:16px 0 2px}
  .see .k{display:block;margin:0 0 6px}
  /* The program's own help, whole, right under the picture of it running:
     the reader should not have to open anything to see the options.  The
     header line is the command that asked for it, at the reader's prompt. */
  .help{margin:16px 0 2px}
  .help .k{display:block;margin:0 0 6px}
  .help pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  .help pre.usage .pr{color:var(--faint)}
  .help .none{color:var(--dim);font-size:13px}
  /* Details and provenance are always open.  They were a fold, and the fold
     closed again every time the shell switch re-rendered the card. */
  .more{margin:18px 0 0;border-top:1px solid var(--rule);padding-top:10px}
  .more .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.03em}
  .more dl{margin-top:10px}
    .back{display:none;font:inherit;font-size:13px;background:none;border:0;color:var(--accent);
        cursor:pointer;padding:0;margin:0 0 10px}
  .about{padding:24px 18px;color:var(--dim);font-size:13px;max-width:52ch;line-height:1.5}
  .about code{font-family:var(--mono);color:var(--ink)}
  .about p{margin:0 0 12px}

  /* the tray: programs ticked for `keep' */
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--rule);box-shadow:0 -6px 24px rgba(0,0,0,.10);
    transform:translateY(110%);transition:transform .18s ease}
  .tray.on{transform:none}
  .tray .row2{display:flex;gap:12px;align-items:center;padding:12px 20px 6px;flex-wrap:wrap}
  .tray .row2 .k{color:var(--faint);font-family:var(--mono);font-size:11.5px;flex:0 0 7em}
  .tray code{flex:1 1 320px;font-family:var(--mono);font-size:13px;
    background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:9px 11px;color:var(--ink);overflow-x:auto;white-space:nowrap}
  .tray .meta{color:var(--dim);font-size:12.5px;padding:0 20px 12px;max-width:80ch;line-height:1.45}
  .tray .meta b{color:var(--ink);font-weight:600}
  .tray details{padding:0 20px 12px;font-size:12.5px;color:var(--dim)}
  .tray details summary{cursor:pointer;color:var(--accent);list-style:none}
  .tray details summary::-webkit-details-marker{display:none}
  .tray details ul{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:28px;max-height:22vh;overflow-y:auto}
  .tray details li{font-family:var(--mono);font-size:12px;break-inside:avoid}
  .tray details li .sz{color:var(--faint);margin-left:8px}

  /* TWO COLUMNS on a tablet held upright: the kinds become a strip across
     the top of the program column, and the program column and the panel
     stand side by side. */
  @media (max-width:1100px){
    .cols{grid-template-columns:minmax(280px,1fr) minmax(340px,1.4fr)}
    .col.kinds-col{grid-column:1;grid-row:1;border-right:0;border-bottom:1px solid var(--rule);
                   overflow-x:auto;overflow-y:hidden;max-height:none;height:auto}
    .cols{grid-template-rows:auto 1fr}
    .col.progs-col{grid-column:1;grid-row:2}
    .col.panel-col{grid-column:2;grid-row:1 / span 2}
    .kinds-col h2{display:none}
    .kinds{display:flex;gap:4px;padding:8px 10px;white-space:nowrap}
    .kinds li{padding:5px 9px;font-size:13px}
    .abc{display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto}
    .abc button{padding:5px 6px}
    .top{grid-template-columns:auto 1fr;gap:8px 16px}
    .only{grid-column:1 / -1;justify-content:flex-start}
  }
  /* ONE COLUMN on a phone: the list, then the panel over it with a way back. */
  @media (max-width:700px){
    .cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .col.panel-col{display:none;grid-column:1;grid-row:1 / span 2}
    .app[data-stage="panel"] .col.panel-col{display:block}
    .app[data-stage="panel"] .col.progs-col,.app[data-stage="panel"] .col.kinds-col{display:none}
    .back{display:inline-block}
    .top h1 small{display:none}
    .panel{padding:14px 16px 40px}
    dl{grid-template-columns:1fr;gap:2px 0}
    dt{padding-top:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app" data-stage="list">
  <header class="top">
    <h1>OS-9/68000 freeware<small>__TOTAL__ programs on one disk image, 1983&ndash;1998</small></h1>
    <input type="search" id="q" placeholder="Search names and descriptions"
           aria-label="Search programs" autocomplete="off">
    <div class="only">
      <span class="shellsw">
        <button class="chip" id="sh-toggle" aria-pressed="false"
                title="Which shell the commands are spelt for; press to switch">shell: bash</button>
      </span>
      <span role="group" aria-label="Show only">
      <button class="chip" id="f-src" aria-pressed="false">Source on disk</button>
      <button class="chip" id="f-doc" aria-pressed="false">Has docs</button>
      <button class="chip" id="f-shot" aria-pressed="false">Sample output</button>
      <button class="chip" id="f-de" aria-pressed="false" title="Programs that speak German at the terminal">In German</button>
      </span>
    </div>
  </header>

  <div class="cols">
    <nav class="col kinds-col" aria-label="Kinds of program">
      <h2>Kinds</h2>
      <ul class="kinds" id="kinds"></ul>
      <h2>By name</h2>
      <div class="abc" id="abc"></div>
    </nav>
    <section class="col progs-col" id="progs-col" aria-label="Programs"></section>
    <section class="col panel-col" id="panel-col" aria-label="Program"></section>
  </div>
</div>

<div class="tray" id="tray" role="region" aria-label="Programs picked to keep">
  <div class="row2">
    <span class="k">see first</span><code id="traydry">keep -n</code>
    <button class="chip" id="traycopydry">Copy</button>
  </div>
  <div class="row2">
    <span class="k">then</span><code id="traycmd">keep</code>
    <button class="chip" id="traycopy">Copy</button>
    <button class="chip" id="trayclear">Clear</button>
  </div>
  <p class="meta" id="traysize"></p>
  <details><summary id="traysum">every file it would write</summary><ul id="trayfiles"></ul></details>
</div>

<script src="screens.js"></script>

<script>
const DATA = __DATA__;
const BLURB = __BLURB__;
const ORDER = __ORDER__;
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const kb = n => n>=1024 ? Math.round(n/1024)+"K" : n+"B";
// `x' is how every document here quotes a key or a command.  Mark those up
// so they stand out of the caption -- rdoggett, 2026-09-18, on hunting for
// the key that leaves a program: "It would be nice if these escape codes
// were highlighted (different color, maybe yellow instead of white?)".
// Runs on ALREADY-ESCAPED text, so it can only ever wrap what is there.
const keys = s => s.replace(/`([^`'\n]{1,28})'/g,
                           (m,k) => `<span class="key">${k}</span>`);
// Screens captured from the running programs, keyed by program name.
// docs/screens.js is generated by tools/gen_screens.py; if it is missing
// the catalogue simply shows no pictures.
const SHOTS = window.SCREENS || {};
const BY = Object.fromEntries(DATA.map(p=>[p.name,p]));
const picked = new Set();
// Which shell the reader types at.  Most commands read the same at bash and
// at Microware's shell; where a card carries an `os9' spelling, that is
// what the OS-9 setting shows.  Remembered in this browser only.
let shell = "unix";
try{ if(localStorage.getItem("shell")==="os9") shell="os9"; }catch(e){}
const PROMPT = {unix:"bash$ ", os9:"$ "};
// A comment after a command.  Microware's shell reads a star at the start
// of a command, so a semicolon first.  This bash (1.12) reads a hash only
// in a script, never at the prompt -- measured: `echo one # x' prints both
// -- so the bash form is its no-op builtin `:', which swallows its arguments.
const COMMENT = {unix:"   ;: ", os9:"   ;* "};
// One button, showing the shell in force; pressing it switches to the
// other.  The chip reads pressed when the OS-9 shell is chosen.
const SHELL_NAME = {unix:"bash", os9:"OS-9 shell"};
function setShell(s){
  shell = s;
  try{ localStorage.setItem("shell", s); }catch(e){}
  const b = document.getElementById("sh-toggle");
  b.textContent = "shell: " + SHELL_NAME[s];
  b.setAttribute("aria-pressed", String(s==="os9"));
  b.setAttribute("aria-label", "Commands are spelt for " + SHELL_NAME[s] + "; press for " + SHELL_NAME[s==="os9"?"unix":"os9"]);
  renderPanel(); about();
}
// A picture is a session: its typed lines start `$ '.  Show them at the
// reader's own prompt, and where the card spells the command differently
// for the OS-9 shell, show that spelling on the line that typed it.
function shotHTML(shot){
  const cmd = tryFor(shot);
  return esc(shot.s).split("\n").map(ln => {
    if(!ln.startsWith("$ ")) return ln;
    let typed = ln.slice(2);
    if(shell==="os9" && shot.os9 && typed===esc(shot.try||"")) typed = esc(shot.os9);
    return `<span class="pr">${esc(PROMPT[shell])}</span>${typed}`;
  }).join("\n");
}
function tryFor(shot){
  if(!shot) return null;
  return (shell==="os9" && shot.os9) || shot.try || null;
}
// What the reader has chosen: a kind OR a letter, a query, and a program.
const st = {q:"", cat:null, letter:null, sel:null, nocio:false, src:false, doc:false, shot:false, de:false};

function ok(p){
  if(st.nocio && p.star) return false;
  if(st.src && !p.hassrc) return false;
  if(st.doc && !p.docs) return false;
  if(st.shot && !SHOTS[p.name]) return false;
  if(st.de && p.lang!=="German") return false;
  return true;
}
function matches(p, q){
  return p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q)
      || p.cat.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q);
}
// How well `p' answers the query: 3 exact name, 2 name starts with it,
// 1 name contains it, 0 only the prose does.  Typing `ls' should put the
// program `ls' first, not thirty descriptions that happen to contain those
// two letters.
function rank(p, q){
  const n = p.name.toLowerCase();
  return n === q ? 3 : n.startsWith(q) ? 2 : n.includes(q) ? 1 : 0;
}

// The list gives each program one line: the first sentence of its entry.
// The whole entry is on its page.
function lead(d){
  const m = /^(.*?)(\.\s|$)/.exec(d||"");
  return m ? m[1] : d;
}
function brief(d){
  const s = lead(d);
  return s.length > 68 ? s.slice(0,66).replace(/\s+\S*$/,"") + "\u2026" : s;
}
function row(p, where){
  const on = picked.has(p.name);
  return `<li class="p${on?" picked":""}" tabindex="0" data-n="${esc(p.name)}"`+
    `${st.sel===p.name?' aria-current="true"':''}>`+
    `<button class="pick" data-pick="${esc(p.name)}" tabindex="-1" `+
    `aria-label="pick ${esc(p.name)}">${on?"&#10003;":"+"}</button>`+
    `<span class="nm">${esc(p.name)}</span>`+
    `<span class="ds">${esc(brief(p.desc))}${where?` <span class="where">&middot; ${esc(where)}</span>`:""}</span></li>`;
}

function renderKinds(){
  const hits = DATA.filter(ok);
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  document.getElementById("kinds").innerHTML = ORDER.filter(c=>count[c]).map(c=>
    `<li data-cat="${esc(c)}" tabindex="0"${st.cat===c?' aria-current="true"':''}>`+
    `${esc(c)}<span class="n">${count[c]}</span></li>`).join("");
  const byl = {};
  for(const p of hits) byl[p.name[0].toUpperCase()] = (byl[p.name[0].toUpperCase()]||0)+1;
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  for(const k of Object.keys(byl)) if(!letters.includes(k)) letters.push(k);
  document.getElementById("abc").innerHTML = letters.map(k =>
    `<button data-letter="${k}"${byl[k]?"":" disabled"}${st.letter===k?' aria-current="true"':''}`+
    ` title="${byl[k]||0} programs">${k}</button>`).join("");
}

function renderProgs(){
  const col = document.getElementById("progs-col");
  const hits = DATA.filter(ok);
  const q = st.q.trim().toLowerCase();
  if(q){
    // SEARCHING IS NOT BROWSING: the answer is a ranked list, best first.
    const rows = hits.filter(p=>matches(p,q)).sort((a,b)=>rank(b,q)-rank(a,q)||a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${rows.length} match${rows.length===1?"":"es"}</h2>`+
      (rows.length ? `<ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`
                   : `<p class="empty">Nothing matches that. Names, descriptions and kinds are searched.</p>`);
    return;
  }
  if(st.letter){
    const rows = hits.filter(p=>p.name[0].toUpperCase()===st.letter).sort((a,b)=>a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${st.letter} &middot; ${rows.length}</h2><ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`;
    return;
  }
  if(st.cat){
    const subs = {};
    for(const p of hits) if(p.cat===st.cat) (subs[p.sub] ||= []).push(p);
    const names = Object.keys(subs).sort((a,b)=>a.localeCompare(b));
    const total = names.reduce((n,s)=>n+subs[s].length,0);
    let out = `<h2>${esc(st.cat)} &middot; ${total}</h2><p class="lede">${esc(BLURB[st.cat]||"")}</p>`;
    for(const s of names){
      if(names.length>1) out += `<div class="subh">${esc(s)} &middot; ${subs[s].length}</div>`;
      out += `<ul class="progs">${subs[s].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>row(p)).join("")}</ul>`;
    }
    col.innerHTML = out;
    return;
  }
  // Nothing chosen yet: every kind, with what it holds, as the way in.
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  col.innerHTML = `<h2>${hits.length} programs</h2><ul class="overview kinds">`+
    ORDER.filter(c=>count[c]).map(c=>`<li data-cat="${esc(c)}" tabindex="0"><div class="ct">${esc(c)}`+
    `<span class="n">${count[c]}</span></div><p class="blurb">${esc(BLURB[c]||"")}</p></li>`).join("")+"</ul>";
}

// Extra data files a program reads that ARE on the disk -- a reassurance,
// not a warning.  Scratch and universal paths are not worth listing, and a
// path the scan marked absent is dropped entirely: it is usually a
// compiled-in fallback the program never opens, and "what it needs and how
// to run it" is the job of the How to run it line, in plain words.
const NOISE = /\/tmp(\/|$)|\/sys\/termcap|tmp\.|\/nil$/i;
function alsoReads(p){
  if(!p.needs) return [];
  return p.needs.filter(n => !n.missing && !NOISE.test(n.path)).map(n => n.path);
}

// What `keep <name>' writes, by keep's own rules (SRC/keep/keep.c): the
// program, then everything DOC/DEPENDS says it opens that is here -- data
// files by name, a data directory copied whole, and a terminal description
// if your own disk has none.  A path named twice is taken once; a path the
// scan marked absent is a compiled-in fallback and is left out.
// A small directory is listed file by file; a big one is summarised by count.
const BRINGS_LISTCAP = 16;
function brings(p){
  const items = [{t:"file", path:"/dd/"+p.dir+"/"+p.name, bytes:p.size||0}];
  const seen = new Set([(p.dir+"/"+p.name).toLowerCase()]);
  let termcap = false;
  for(const n of (p.needs||[])){
    if(n.missing) continue;
    const rel = n.path.replace(/^\/(dd|h0)\//i,"");
    if(/^sys\/termcap$/i.test(rel)){ termcap = true; continue; }
    if(seen.has(rel.toLowerCase())) continue;
    seen.add(rel.toLowerCase());
    if(n.dir){
      // A top-level system directory (cmds, sys, usr, lib, ...) is your own
      // disk's; keep leaves it be.  A nested data directory is the program's.
      if(rel.indexOf("/")<0){
        items.push({t:"note", path:"/dd/"+rel, text:"your own system directory, left in place"});
        continue;
      }
      const nf = n.nfiles||0, files = n.files||[];
      if(nf>0 && nf<=BRINGS_LISTCAP && files.length===nf){
        items.push({t:"dir", path:"/dd/"+rel, nfiles:nf});
        for(const f of files) items.push({t:"sub", path:f.name, bytes:f.bytes});
      } else {
        items.push({t:"note", path:"/dd/"+rel,
          text:"a directory of "+nf+" file"+(nf===1?"":"s")+", copied whole"});
      }
      continue;
    }
    if(n.bytes==null) continue;          // a path not here -- keep copies nothing
    items.push({t:"file", path:"/dd/"+rel, bytes:n.bytes});
  }
  if(termcap) items.push({t:"note", path:"/dd/SYS/termcap",
    text:"a terminal description, if your disk has none"});
  return items;
}
function bringsHTML(p){
  const items = brings(p).map(it=>{
    if(it.t==="file") return `<li><code>${esc(it.path)}</code><span class="sz">${kb(it.bytes)}</span></li>`;
    if(it.t==="sub")  return `<li class="sub"><code>${esc(it.path)}</code><span class="sz">${kb(it.bytes)}</span></li>`;
    if(it.t==="dir")  return `<li><code>${esc(it.path)}/</code><span class="note">${it.nfiles} file${it.nfiles===1?"":"s"}, copied whole</span></li>`;
    return `<li><code>${esc(it.path)}</code><span class="note">${esc(it.text)}</span></li>`;
  });
  return `<div class="brings"><span class="k">keep brings</span><ul>${items.join("")}</ul></div>`;
}

function about(){
  const col = document.getElementById("panel-col");
  if(st.sel && BY[st.sel]) return;
  const pr = PROMPT[shell];
  const cm = esc(COMMENT[shell]);
  col.innerHTML = `<div class="about">`+
    `<p><b>Setting up</b><br>`+
    `This collection is for OS-9. Give it a disk of its own on your system, reached `+
    `by two device names: <code>/dd</code>, where the programs look for their data, and `+
    `<code>/h0</code>, which a few of them carry inside instead. On most OS-9 systems `+
    `<code>/dd</code> already names the <code>/h0</code> drive, so that is the usual `+
    `arrangement. Your own commands and modules stay where they are: `+
    `<code>SYS/login</code> puts <code>/h1/CMDS</code> on the path for runb, the shell and `+
    `the rest, so <code>/h1</code> is the name to give your system disk while this one is `+
    `<code>/dd</code>. The collection is one RBF image, written whole to a disk your `+
    `system mounts. We have not had a real machine to do this on; `+
    `<code>DOC/README-RUNNING</code> says what is known.</p>`+
    `<p><b>Trying it first</b><br>`+
    `os9exec, a community emulator that builds on macOS, Linux, Windows and most `+
    `anything with a C compiler, runs the image with no OS-9 of your own. Its `+
    `devices are named by environment variables: give the image as both `+
    `<code>OS9DISK</code> and <code>OS9H0</code>, and your own OS-9 system or SDK, if `+
    `you have one, as <code>OS9H1</code>.</p>`+
    `<pre class="usage">OS9DISK=$PWD/osk-freeware.dd OS9H0=$PWD/osk-freeware.dd OS9H1=&lt;your OS-9&gt; \\\n`+
    `    os9exec -r bash /dd/SYS/login</pre>`+
    `<p>Keep it as an RBF image rather than unpacking it into a host directory: on the `+
    `image, file permissions and record locking work as OS-9 expects, and a host `+
    `directory gives neither. os9exec's own <code>mount -k</code> makes a blank one. `+
    `Everything on these pages was captured this way.</p>`+
    `<p><b>Taking a few programs onto your own disk</b><br>`+
    `<code>keep</code>, <code>kept</code> and <code>unkeep</code> are three small programs `+
    `written for this collection, for the same arrangement. <code>keep cookie</code> copies `+
    `cookie and the data files it reads from this disk onto your own on <code>/h1</code>, `+
    `laid out the way cookie expects them, and records every file it wrote; `+
    `<code>kept</code> lists those files; <code>unkeep cookie</code> removes them, leaving `+
    `any you have changed since, such as a score file. Tick programs with <b>+</b> `+
    `(or the space bar) and the command builds itself below.</p>`+
    `<pre class="usage">${esc(pr)}keep -n fortune cookie${cm}show what keep would write\n`+
    `${esc(pr)}keep fortune cookie${cm}copy them, and record every file written\n`+
    `${esc(pr)}kept${cm}list every file keep has written\n`+
    `${esc(pr)}unkeep cookie${cm}remove what keep wrote for cookie</pre>`+
    `<p><code>DOC/README-KEEP</code> on the disk has the rest.${shell==="unix" ? " (This bash reads a <code>#</code> comment only in a script; at the prompt, <code>:</code> is the no-op that swallows one.)" : ""}</p>`+
    `<p><b>Reading a page</b><br>`+
    `Pick a kind of program, or a letter, then a program. Its page says what it does, `+
    `gives a command to try, lists what it needs, shows it running, and prints its own `+
    `help. Its terms, version, author and origin follow.</p>`+
    `<p><b>See it run</b> was captured from the program on the disk image; nothing is `+
    `mocked up. The <b>shell</b> button at the top names the shell the commands are `+
    `spelt for, bash or the OS-9 shell, and pressing it changes to the other.</p>`+
    `</div>`;
}

function renderPanel(){
  const col = document.getElementById("panel-col");
  const p = st.sel && BY[st.sel];
  if(!p){
    about();
    return;
  }
  // Every requirement, including the ones this disk already supplies: a
  // reader taking a program to a system of their own needs to know about
  // cio as much as about the data files it opens (from DEPENDS) or runb.
  const needs=[];
  if(p.star) needs.push('Microware&rsquo;s <code>cio</code> (on this disk)');
  if(p.basic09) needs.push('Microware&rsquo;s <code>runb</code>');
  (p.requires||[]).forEach(r=>needs.push(esc(r)));
  const data=alsoReads(p);
  data.forEach(x=>needs.push(`<code>${esc(x)}</code>`));
  if(p.military) needs.push('the author asks no military use');
  if(p.lang) needs.push(`${esc(p.lang)}: ${esc(p.langnote||"its prompts and messages")}`);

  const D=[];
  const add=(k,v)=>{ if(v) D.push(`<dt>${k}</dt><dd>${v}</dd>`); };
  add("Kind", esc(p.cat)+" &middot; "+esc(p.sub));
  add("On the disk", `<code>/dd/${esc(p.dir)}/${esc(p.name)}</code>`+(p.size?` &middot; ${kb(p.size)}`:""));
  const i=p.info||{};
  add("Version",   esc(i.version));
  add("Author",    esc(i.author));
  add("Copyright", esc(i.copyright));
  add("Terms",     esc(p.terms||i.availability||i.conditions||"")||"not yet looked up &mdash; <code>SOURCES.txt</code> has what is recorded");
  add("Language",  esc(i.language));
  add("Came from", p.origin ? esc(p.origin)+(p.archive?` &mdash; ${esc(p.archive)}`:"") : "");
  add("Source",    p.src ? `<code>SRC/${esc(p.src)}</code>` : (p.hassrc?`<code>SRC/${esc(p.name)}</code>`:""));
  add("Docs",      p.docs ? `<code>DOC/${esc(p.name)}/</code>` : "");
  add("Restrictions", esc(i.restrictions));
  add("Hardware",     esc(i.hardware));
  const kin=DATA.filter(x=>x.sub===p.sub && x.name!==p.name).sort((a,b)=>a.name.localeCompare(b.name));
  if(kin.length) add("See also", kin.map(x=>
      `<a href="#p=${encodeURIComponent(x.name)}" class="kin" data-n="${esc(x.name)}"><code>${esc(x.name)}</code></a>`).join(", "));

  // The two things a browser wants first: what to type, and the program
  // doing it.  The command is short; the demo shows the real invocation.
  const shot=SHOTS[p.name];
  const tryCmd=tryFor(shot)||p.name;
  const seeHTML=shot
    ? `<div class="see"><div class="k">see it run</div>`+
      `<pre class="shot">${shotHTML(shot)}</pre>`+
      `<p class="shotcap">${keys(esc(shot.c))}</p></div>`
    : "";
  // What the program says of itself when asked, captured whole
  // (tools/help.psv says how each one is asked; docs/help/ holds the
  // answers).  A program with no help of its own says so in a line.
  const h=p.help;
  const helpHTML=!h ? "" : h.cmd
    ? `<div class="help"><div class="k">its own help</div>`+
      `<pre class="usage"><span class="pr">${esc(PROMPT[shell])}</span>${esc(h.cmd)}\n${esc(h.text)}</pre></div>`
    : `<div class="help"><div class="k">its own help</div><span class="none">${esc(h.note)}</span></div>`;

  col.innerHTML = `<div class="panel">`+
    `<button class="back" id="back">&larr; Back to the list</button>`+
    `<h2 class="pn">${esc(p.name)}</h2>`+
    `<p class="pd">${esc(i.purpose||lead(p.desc))}</p>`+
    `<div class="try"><span class="k">try it</span><code class="copycmd" tabindex="0" title="tap to copy"><span class="pr">${esc(PROMPT[shell])}</span><span class="ct">${esc(tryCmd)}</span></code></div>`+
    (p.shadows?`<p class="shadow"><b>Your OS-9 has a <code>${esc(p.name)}</code> of its own.</b> `+
      `This is a different program under the same name. Nothing is overwritten by reading this disk `+
      `&mdash; but put <code>${esc(p.shadows.includes("/")?"/dd/CMDS/"+p.shadows.replace(/\/[^/]*$/,""):"/dd/CMDS")}</code> `+
      `ahead of yours on PATH, or <code>load</code> this one, and it answers for that name until you `+
      `<code>unlink</code> it &mdash; a resident module is found by name whatever path you type. `+
      `<code>DOC/README-NAMES</code> lists all of them.</p>`:"")+
    (needs.length?`<div class="needs"><span class="k">needs</span><span>${needs.join(" &middot; ")}${data.length?` <span class="okk">&middot; ${data.length>1?"all ":""}on the disk</span>`:""}</span></div>`:"")+
    seeHTML+
    helpHTML+
    bringsHTML(p)+
    (D.length?`<div class="more"><span class="k">details and provenance</span><dl>${D.join("")}</dl></div>`:"")+
    `</div>`;
  col.scrollTop = 0;
}

function render(){ renderKinds(); renderProgs(); renderPanel(); }

// The address bar follows the reader, so a page can be linked to and the
// back button works: #k=Games, #a=G, #p=gnuchess, #q=chess.
function toHash(){
  const h = st.sel ? "p="+encodeURIComponent(st.sel)
        : st.q ? "q="+encodeURIComponent(st.q)
        : st.cat ? "k="+encodeURIComponent(st.cat)
        : st.letter ? "a="+st.letter : "";
  if(location.hash.slice(1)!==h) history.pushState(null,"","#"+h);
}
function fromHash(){
  const [k,v] = location.hash.slice(1).split("=");
  const val = v ? decodeURIComponent(v) : "";
  if(k==="p" && BY[val]){ st.sel = val; if(!st.cat && !st.letter && !st.q) st.cat = BY[val].cat; }
  else if(k==="k"){ st.cat = val; st.letter=null; st.q=""; }
  else if(k==="a"){ st.letter = val; st.cat=null; st.q=""; }
  else if(k==="q"){ st.q = val; }
  document.getElementById("q").value = st.q;
  document.getElementById("app").dataset.stage = st.sel ? "panel" : "list";
}

function choose(name){
  st.sel = name;
  document.getElementById("app").dataset.stage = "panel";
  toHash(); renderProgs(); renderPanel();
}
function chooseKind(c){
  st.cat = c; st.letter = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}
function chooseLetter(k){
  st.letter = k; st.cat = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}

function tray(){
  const names=[...picked].sort();
  document.getElementById("tray").classList.toggle("on", names.length>0);
  document.getElementById("traycmd").textContent = names.length ? "keep " + names.join(" ") : "keep";
  document.getElementById("traydry").textContent = names.length ? "keep -n " + names.join(" ") : "keep -n";
  const all=[], notes=[], seen=new Set();
  for(const x of names){
    if(!BY[x]) continue;
    const b=brings(BY[x]);
    for(const f of b.files){ if(!seen.has(f.path.toLowerCase())){ seen.add(f.path.toLowerCase()); all.push(f); } }
    for(const n of b.notes) notes.push(n);
  }
  const bytes=all.reduce((n,f)=>n+f.bytes,0);
  document.getElementById("traysize").innerHTML =
    `<b>${names.length}</b> program${names.length===1?"":"s"}, <b>${all.length}</b> file${all.length===1?"":"s"}, `+
    `<b>${kb(bytes)}</b> written under /dd. Every file is recorded, so <code>unkeep</code> can take it back.`;
  document.getElementById("traysum").textContent = "every file it would write ("+all.length+")";
  document.getElementById("trayfiles").innerHTML =
    all.map(f=>`<li>${esc(f.path)}<span class="sz">${kb(f.bytes)}</span></li>`).join("")+
    notes.map(n=>`<li class="note">${esc(n)}</li>`).join("");
}

document.getElementById("kinds").addEventListener("click",e=>{
  const li=e.target.closest("li[data-cat]"); if(li) chooseKind(li.dataset.cat); });
document.getElementById("kinds").addEventListener("keydown",e=>{
  const li=e.target.closest("li[data-cat]"); if(li && e.key==="Enter") chooseKind(li.dataset.cat); });
document.getElementById("abc").addEventListener("click",e=>{
  const b=e.target.closest("button[data-letter]"); if(b) chooseLetter(b.dataset.letter); });
document.getElementById("progs-col").addEventListener("click",e=>{
  const pb=e.target.closest("button.pick");
  if(pb){                       // picking, not opening
    e.stopPropagation();
    const n=pb.dataset.pick;
    picked.has(n) ? picked.delete(n) : picked.add(n);
    pb.closest("li.p").classList.toggle("picked", picked.has(n));
    pb.innerHTML = picked.has(n) ? "&#10003;" : "+";
    tray();
    return;
  }
  const li=e.target.closest("li.p"); if(li){ choose(li.dataset.n); return; }
  const k=e.target.closest("li[data-cat]"); if(k) chooseKind(k.dataset.cat);
});
document.getElementById("progs-col").addEventListener("keydown",e=>{
  const li=e.target.closest("li.p");
  if(li){
    if(e.key==="Enter"){ e.preventDefault(); choose(li.dataset.n); }
    else if(e.key===" "){ e.preventDefault(); const pb=li.querySelector("button.pick"); if(pb) pb.click(); }
    return;
  }
  const k=e.target.closest("li[data-cat]"); if(k && e.key==="Enter") chooseKind(k.dataset.cat);
});
document.getElementById("panel-col").addEventListener("click",e=>{
  const a=e.target.closest("a.kin");
  if(a){ e.preventDefault(); choose(a.dataset.n); return; }
  if(e.target.id==="back"){
    st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel();
  }
});
document.getElementById("q").addEventListener("input",e=>{
  st.q=e.target.value; if(st.q){ st.cat=null; st.letter=null; }
  document.getElementById("app").dataset.stage="list"; toHash(); render(); });
for(const [id,k] of [["f-src","src"],["f-doc","doc"],["f-shot","shot"],["f-de","de"]]){
  const b=document.getElementById(id);
  b.onclick=()=>{ st[k]=!st[k]; b.setAttribute("aria-pressed",String(st[k])); render(); };
}
function copier(codeId, buttonId){ return ()=>{
  const el=document.getElementById(codeId);
  const b=document.getElementById(buttonId);
  const done=()=>{ b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200); };
  const selectIt=()=>{ const r=document.createRange(); r.selectNodeContents(el);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  // Selecting the text is the fallback: the clipboard API is unavailable on a
  // page opened from a file:// URL in several browsers, and this page is meant
  // to be readable straight off the disk.
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.textContent).then(done, selectIt);
  else selectIt();
}; }
document.getElementById("traycopy").onclick=copier("traycmd","traycopy");
document.getElementById("traycopydry").onclick=copier("traydry","traycopydry");
// Tap a shown command to copy it -- just the command, not the bash$/os9$
// prompt.  Delegated, so it works for every card the panel renders.  Falls
// back to selecting the text where the clipboard API is blocked (file://).
function copyCmd(code){
  const ct=code.querySelector(".ct"); if(!ct) return;
  const flash=()=>{ code.classList.add("copied"); setTimeout(()=>code.classList.remove("copied"),1000); };
  const selectIt=()=>{ const r=document.createRange(); r.selectNodeContents(ct);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); flash(); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(ct.textContent).then(flash, selectIt);
  else selectIt();
}
document.addEventListener("click", e=>{
  const code=e.target.closest && e.target.closest(".copycmd");
  if(code) copyCmd(code);
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const code=e.target.closest && e.target.closest(".copycmd");
  if(code){ e.preventDefault(); copyCmd(code); }
});
document.getElementById("sh-toggle").onclick=()=>setShell(shell==="os9" ? "unix" : "os9");
document.getElementById("trayclear").onclick=()=>{ picked.clear(); renderProgs(); tray(); };
window.addEventListener("popstate", ()=>{ st.sel=null; st.cat=null; st.letter=null; st.q=""; fromHash(); render(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && st.sel){ st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel(); }
});
fromHash(); setShell(shell); render(); tray();
</script>
