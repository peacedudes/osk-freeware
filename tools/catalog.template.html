<title>OS-9/68K Freeware Collection — a guide to __TOTAL__ programs</title>
<style>
  :root{
    --paper:#F4F5F3; --card:#FFF; --ink:#191D21; --dim:#5A646B; --faint:#8A949B;
    --rule:#DDE1DE; --hair:#EBEEEB; --accent:#B26A00; --soft:#F7E8D2;
    --warn:#8C2F1E; --ok:#2E6A4F; --screen:#0E1113; --phosphor:#CFE3CF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#98A4AC; --faint:#6B777E;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}}
  :root[data-theme="dark"]{
    --paper:#131619; --card:#1A1E22; --ink:#E3E7EA; --dim:#98A4AC; --faint:#6B777E;
    --rule:#282E34; --hair:#20252A; --accent:#F0A93C; --soft:#372B16;
    --warn:#E08064; --ok:#6FBF97;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* THE PAGE IS THREE COLUMNS: what kinds of thing there are, the programs
     of one kind, and one program.  Choosing in a column fills the next one
     and never covers the one you chose in -- the reader keeps their place. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px 22px;align-items:center;
       padding:12px 20px 10px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;
          white-space:nowrap}
  .top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;
                color:var(--dim);letter-spacing:0}
  .top input[type=search]{width:100%;max-width:520px;font:inherit;font-size:15px;padding:8px 12px;
    border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
  .only{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--dim);white-space:nowrap}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}

  .cols{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(380px,1.5fr);
        min-height:0;height:100%}
  .col{min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--rule)}
  .col:last-child{border-right:0}
  .col > h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
          text-transform:uppercase;color:var(--faint);margin:0;padding:14px 16px 6px}

  /* column one: categories, then the alphabet */
  .kinds{list-style:none;margin:0;padding:0 8px 8px}
  .kinds li{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;
            cursor:pointer;font-size:14px}
  .kinds li .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
               font-variant-numeric:tabular-nums}
  .kinds li:hover{background:var(--hair)}
  .kinds li[aria-current="true"]{background:var(--soft);color:var(--ink)}
  .kinds li[aria-current="true"] .n{color:var(--accent)}
  .abc{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 12px 20px}
  .abc button{font:500 12px/1 var(--mono);padding:7px 0;border:1px solid transparent;
              border-radius:6px;background:none;color:var(--dim);cursor:pointer}
  .abc button:hover{border-color:var(--rule);color:var(--ink)}
  .abc button[aria-current="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
  .abc button:disabled{color:var(--faint);opacity:.4;cursor:default}

  /* column two: the programs of one kind */
  .lede{padding:0 18px 12px;font-size:13.5px;color:var(--dim);max-width:52ch}
  .subh{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--faint);padding:14px 18px 4px;border-top:1px solid var(--hair)}
  .subh:first-of-type{border-top:0}
  .progs{list-style:none;margin:0;padding:0 8px 8px}
  li.p{display:grid;grid-template-columns:auto minmax(88px,120px) 1fr;gap:9px;padding:5px 10px;
       align-items:baseline;cursor:pointer;border-radius:7px}
  li.p:hover{background:var(--hair)}
  li.p[aria-current="true"]{background:var(--soft)}
  .nm{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nm .st{color:var(--accent)}
  .ds{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
  .ds .where{color:var(--faint)}
  li.p .pick{width:18px;height:18px;align-self:start;margin-top:2px;border:1px solid var(--rule);border-radius:4px;
    background:var(--card);color:var(--faint);font:600 12px/16px var(--mono);text-align:center;
    cursor:pointer;padding:0}
  li.p .pick:hover{border-color:var(--accent);color:var(--accent)}
  li.p.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff}
  .overview{padding:4px 8px 12px}
  .overview li{display:block;padding:9px 10px;border-radius:7px;cursor:pointer}
  .overview li:hover{background:var(--hair)}
  .overview .ct{font-family:var(--serif);font-size:16px;font-weight:600}
  .overview .ct .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;
                   margin-left:6px}
  .overview .blurb{font-size:12.5px;color:var(--dim);margin:2px 0 0}
  .empty{padding:40px 18px;color:var(--dim);font-size:14px;max-width:48ch}

  /* column three: one program */
  .panel{padding:18px 22px 40px}
  .pn{font-family:var(--mono);font-size:22px;font-weight:600;margin:0}
  .pd{color:var(--dim);margin:5px 0 0;font-size:15px;max-width:60ch}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .flag{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
        color:var(--dim)}
  .flag.cio{border-color:var(--accent);color:var(--accent)}
  .flag.mil{border-color:var(--warn);color:var(--warn)}
  .flag.ok{border-color:var(--ok);color:var(--ok)}
  dl{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;margin:18px 0 0;font-size:13.5px}
  dt{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.06em;
     text-transform:uppercase;padding-top:2px}
  dd{margin:0;color:var(--ink);overflow-wrap:anywhere;min-width:0}
  dd code{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  dd .miss{color:var(--warn)}
  dd pre.usage{font-family:var(--mono);font-size:12px;line-height:1.45;margin:0;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);
    border:1px solid var(--rule);border-radius:6px;padding:9px 11px;color:var(--ink)}
  dd pre.shot{font-family:var(--mono);font-size:11px;line-height:1.2;margin:0;
    white-space:pre;overflow-x:auto;background:var(--screen);color:var(--phosphor);
    border-radius:6px;padding:10px 12px}
  dd .shotcap{margin:.5rem 0 0;color:var(--dim);font-size:12.5px;line-height:1.45;max-width:64ch}
  dd .howto{font-size:13px;line-height:1.45;max-width:64ch}
  dd.advice{color:var(--dim);font-size:12.5px;line-height:1.45}
  dd .okk{color:var(--ok);font-size:11.5px}
  dd a.kin{color:var(--accent);text-decoration:none}
  dd a.kin:hover{text-decoration:underline}
  .back{display:none;font:inherit;font-size:13px;background:none;border:0;color:var(--accent);
        cursor:pointer;padding:0;margin:0 0 10px}
  .about{padding:24px 18px;color:var(--dim);font-size:13px;max-width:52ch;line-height:1.5}
  .about code{font-family:var(--mono);color:var(--ink)}
  .about p{margin:0 0 12px}

  /* the tray: programs ticked for `keep' */
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--rule);box-shadow:0 -6px 24px rgba(0,0,0,.10);
    transform:translateY(110%);transition:transform .18s ease}
  .tray.on{transform:none}
  .tray .row2{display:flex;gap:12px;align-items:center;padding:12px 20px 14px;flex-wrap:wrap}
  .tray code{flex:1 1 320px;font-family:var(--mono);font-size:13px;
    background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:9px 11px;color:var(--ink);overflow-x:auto;white-space:nowrap}
  .tray .meta{color:var(--faint);font-size:12px;font-family:var(--mono)}

  /* TWO COLUMNS on a tablet held upright: the kinds become a strip across
     the top of the program column, and the program column and the panel
     stand side by side. */
  @media (max-width:1100px){
    .cols{grid-template-columns:minmax(280px,1fr) minmax(340px,1.4fr)}
    .col.kinds-col{grid-column:1;grid-row:1;border-right:0;border-bottom:1px solid var(--rule);
                   overflow-x:auto;overflow-y:hidden;max-height:none;height:auto}
    .cols{grid-template-rows:auto 1fr}
    .col.progs-col{grid-column:1;grid-row:2}
    .col.panel-col{grid-column:2;grid-row:1 / span 2}
    .kinds-col h2{display:none}
    .kinds{display:flex;gap:4px;padding:8px 10px;white-space:nowrap}
    .kinds li{padding:5px 9px;font-size:13px}
    .abc{display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto}
    .abc button{padding:5px 6px}
    .top{grid-template-columns:auto 1fr;gap:8px 16px}
    .only{grid-column:1 / -1;justify-content:flex-start}
  }
  /* ONE COLUMN on a phone: the list, then the panel over it with a way back. */
  @media (max-width:700px){
    .cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .col.panel-col{display:none;grid-column:1;grid-row:1 / span 2}
    .app[data-stage="panel"] .col.panel-col{display:block}
    .app[data-stage="panel"] .col.progs-col,.app[data-stage="panel"] .col.kinds-col{display:none}
    .back{display:inline-block}
    .top h1 small{display:none}
    .panel{padding:14px 16px 40px}
    dl{grid-template-columns:1fr;gap:2px 0}
    dt{padding-top:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app" data-stage="list">
  <header class="top">
    <h1>OS-9/68000 freeware<small>__TOTAL__ programs on one disk image, 1983&ndash;1998</small></h1>
    <input type="search" id="q" placeholder="Search names and descriptions"
           aria-label="Search programs" autocomplete="off">
    <div class="only" role="group" aria-label="Show only">
      <button class="chip" id="f-nocio" aria-pressed="false">Runs without cio</button>
      <button class="chip" id="f-src" aria-pressed="false">Source on disk</button>
      <button class="chip" id="f-doc" aria-pressed="false">Has docs</button>
      <button class="chip" id="f-shot" aria-pressed="false">Sample output</button>
    </div>
  </header>

  <div class="cols">
    <nav class="col kinds-col" aria-label="Kinds of program">
      <h2>Kinds</h2>
      <ul class="kinds" id="kinds"></ul>
      <h2>By name</h2>
      <div class="abc" id="abc"></div>
    </nav>
    <section class="col progs-col" id="progs-col" aria-label="Programs"></section>
    <section class="col panel-col" id="panel-col" aria-label="Program"></section>
  </div>
</div>

<div class="tray" id="tray" role="region" aria-label="Programs picked to keep">
  <div class="row2">
    <code id="traycmd">keep</code>
    <span class="meta" id="traysize"></span>
    <button class="chip" id="traycopy">Copy</button>
    <button class="chip" id="trayclear">Clear</button>
  </div>
</div>

<script src="screens.js"></script>

<script>
const DATA = __DATA__;
const BLURB = __BLURB__;
const ORDER = __ORDER__;
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const kb = n => n>=1024 ? Math.round(n/1024)+"K" : n+"B";
// Screens captured from the running programs, keyed by program name.
// docs/screens.js is generated by tools/gen_screens.py; if it is missing
// the catalogue simply shows no pictures.
const SHOTS = window.SCREENS || {};
const BY = Object.fromEntries(DATA.map(p=>[p.name,p]));
const picked = new Set();
// What the reader has chosen: a kind OR a letter, a query, and a program.
const st = {q:"", cat:null, letter:null, sel:null, nocio:false, src:false, doc:false, shot:false};

function ok(p){
  if(st.nocio && p.star) return false;
  if(st.src && !p.hassrc) return false;
  if(st.doc && !p.docs) return false;
  if(st.shot && !SHOTS[p.name]) return false;
  return true;
}
function matches(p, q){
  return p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q)
      || p.cat.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q);
}
// How well `p' answers the query: 3 exact name, 2 name starts with it,
// 1 name contains it, 0 only the prose does.  Typing `ls' should put the
// program `ls' first, not thirty descriptions that happen to contain those
// two letters.
function rank(p, q){
  const n = p.name.toLowerCase();
  return n === q ? 3 : n.startsWith(q) ? 2 : n.includes(q) ? 1 : 0;
}

// The list gives each program one line: the first sentence of its entry.
// The whole entry is on its page.
function brief(d){
  const m = /^(.*?)(\.\s|\s--\s|;\s|$)/.exec(d||"");
  return m ? m[1] : d;
}
function row(p, where){
  const on = picked.has(p.name);
  return `<li class="p${on?" picked":""}" tabindex="0" data-n="${esc(p.name)}"`+
    `${st.sel===p.name?' aria-current="true"':''}>`+
    `<button class="pick" data-pick="${esc(p.name)}" tabindex="-1" `+
    `aria-label="pick ${esc(p.name)}">${on?"&#10003;":"+"}</button>`+
    `<span class="nm">${p.star?'<span class="st" title="needs cio">&#9733;</span>':''}${esc(p.name)}</span>`+
    `<span class="ds">${esc(brief(p.desc))}${where?` <span class="where">&middot; ${esc(where)}</span>`:""}</span></li>`;
}

function renderKinds(){
  const hits = DATA.filter(ok);
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  document.getElementById("kinds").innerHTML = ORDER.filter(c=>count[c]).map(c=>
    `<li data-cat="${esc(c)}" tabindex="0"${st.cat===c?' aria-current="true"':''}>`+
    `${esc(c)}<span class="n">${count[c]}</span></li>`).join("");
  const byl = {};
  for(const p of hits) byl[p.name[0].toUpperCase()] = (byl[p.name[0].toUpperCase()]||0)+1;
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  for(const k of Object.keys(byl)) if(!letters.includes(k)) letters.push(k);
  document.getElementById("abc").innerHTML = letters.map(k =>
    `<button data-letter="${k}"${byl[k]?"":" disabled"}${st.letter===k?' aria-current="true"':''}`+
    ` title="${byl[k]||0} programs">${k}</button>`).join("");
}

function renderProgs(){
  const col = document.getElementById("progs-col");
  const hits = DATA.filter(ok);
  const q = st.q.trim().toLowerCase();
  if(q){
    // SEARCHING IS NOT BROWSING: the answer is a ranked list, best first.
    const rows = hits.filter(p=>matches(p,q)).sort((a,b)=>rank(b,q)-rank(a,q)||a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${rows.length} match${rows.length===1?"":"es"}</h2>`+
      (rows.length ? `<ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`
                   : `<p class="empty">Nothing matches that. Names, descriptions and kinds are searched.</p>`);
    return;
  }
  if(st.letter){
    const rows = hits.filter(p=>p.name[0].toUpperCase()===st.letter).sort((a,b)=>a.name.localeCompare(b.name));
    col.innerHTML = `<h2>${st.letter} &middot; ${rows.length}</h2><ul class="progs">${rows.map(p=>row(p,p.cat)).join("")}</ul>`;
    return;
  }
  if(st.cat){
    const subs = {};
    for(const p of hits) if(p.cat===st.cat) (subs[p.sub] ||= []).push(p);
    const names = Object.keys(subs).sort((a,b)=>a.localeCompare(b));
    const total = names.reduce((n,s)=>n+subs[s].length,0);
    let out = `<h2>${esc(st.cat)} &middot; ${total}</h2><p class="lede">${esc(BLURB[st.cat]||"")}</p>`;
    for(const s of names){
      if(names.length>1) out += `<div class="subh">${esc(s)} &middot; ${subs[s].length}</div>`;
      out += `<ul class="progs">${subs[s].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>row(p)).join("")}</ul>`;
    }
    col.innerHTML = out;
    return;
  }
  // Nothing chosen yet: every kind, with what it holds, as the way in.
  const count = {};
  for(const p of hits) count[p.cat] = (count[p.cat]||0)+1;
  col.innerHTML = `<h2>${hits.length} programs</h2><ul class="overview kinds">`+
    ORDER.filter(c=>count[c]).map(c=>`<li data-cat="${esc(c)}" tabindex="0"><div class="ct">${esc(c)}`+
    `<span class="n">${count[c]}</span></div><p class="blurb">${esc(BLURB[c]||"")}</p></li>`).join("")+"</ul>";
}

function advice(p, gone){
  // A missing path is not one problem. Which one it is decides what to do,
  // and "not on this disk" on its own leaves the reader stuck.
  const paths = gone.map(g=>g.path.toLowerCase());
  if(paths.some(x=>x.endsWith("/sys/termcap")))
    return "termcap is on this disk at <code>SYS/termcap</code>; arrange the disk as "+
           "<code>/h0</code> as well as <code>/dd</code> and it resolves. "+
           "<code>DOC/README-RUNNING</code> shows all three arrangements.";
  if(paths.some(x=>x.includes("/etc/")||x.includes("/lib/")))
    return "This wants a support library the collection does not carry. You would have "+
           "to fetch the package's own data files and put them where it looks; the "+
           "path above is exactly where.";
  return "Nothing here provides that path. If the program creates it itself, make the "+
         "directory and it will; if it reads it, the data was never collected. "+
         "<code>DOC/DEPENDS</code> lists this for every program.";
}

function renderPanel(){
  const col = document.getElementById("panel-col");
  const p = st.sel && BY[st.sel];
  if(!p){
    col.innerHTML = `<div class="about">`+
      `<p>Choose a kind of program, or a letter, then a program. Its page says what it is, `+
      `what it needs, where it came from, how to run it, and shows it running.</p>`+
      `<p><b>Sample output</b> was captured from the program running on the disk image: `+
      `keystrokes into os9exec&rsquo;s console, and the terminal stream rendered into the `+
      `grid a vt100 would have shown. Nothing is mocked up.</p>`+
      `<p><span style="color:var(--accent)">&#9733;</span> marks a program that needs `+
      `Microware&rsquo;s <code>cio</code>, which ships on the disk; see <code>DOC/README-CIO</code>.</p>`+
      `<p>Tick programs with <b>+</b> (or the space bar) to build a <code>keep</code> command `+
      `you can paste at an OS-9 shell; see <code>DOC/README-KEEP</code>.</p>`+
      `<p>Built from <code>DOC/INDEX</code>, <code>DOC/ORIGINS</code>, <code>DOC/DEPENDS</code>, `+
      `the EFFO <code>info_</code> files and the tree itself, so it cannot drift from what ships.</p>`+
      `</div>`;
    return;
  }
  const F=[];
  if(p.star)     F.push('<span class="flag cio">&#9733; needs cio</span>');
  if(p.basic09)  F.push('<span class="flag cio">BASIC09 &mdash; needs runb</span>');
  if(p.military) F.push('<span class="flag mil">author asks: no military use</span>');
  if(!p.star && !p.basic09) F.push('<span class="flag ok">runs on the bare disk</span>');
  if(p.hassrc)   F.push('<span class="flag">source on disk</span>');
  if(p.docs)     F.push('<span class="flag">documented</span>');

  const D=[];
  const add=(k,v)=>{ if(v) D.push(`<dt>${k}</dt><dd>${v}</dd>`); };
  add("Kind", esc(p.cat)+" &middot; "+esc(p.sub));
  add("On the disk", `<code>/dd/${esc(p.dir)}/${esc(p.name)}</code>`+(p.size?` &middot; ${kb(p.size)}`:""));
  const i=p.info||{};
  add("Version",   esc(i.version));
  add("Author",    esc(i.author));
  add("Copyright", esc(i.copyright));
  add("Terms",     esc(i.availability||i.conditions));
  add("Language",  esc(i.language));
  add("Came from", p.origin ? esc(p.origin)+(p.archive?` &mdash; ${esc(p.archive)}`:"") : "");
  add("Source",    p.src ? `<code>SRC/${esc(p.src)}</code>` : (p.hassrc?`<code>SRC/${esc(p.name)}</code>`:""));
  add("Docs",      p.docs ? `<code>DOC/${esc(p.name)}/</code>` : "");
  if(p.needs && p.needs.length){
    add("Also needs", p.needs.map(n=>`<code>${esc(n.path)}</code>`+
        (n.missing?' <span class="miss">not on this disk</span>':' <span class="okk">present</span>')).join("<br>"));
    const gone=p.needs.filter(n=>n.missing);
    if(gone.length) D.push(`<dt></dt><dd class="advice">${advice(p,gone)}</dd>`);
  }
  if(p.howto) add("How to run it", `<div class="howto">${esc(p.howto)}</div>`);
  if(p.usage) D.push(`<dt>Its own help</dt><dd><pre class="usage">${esc(p.usage)}</pre></dd>`);
  // THE PROGRAM RUNNING, beside its own help: captured from the disk image,
  // never composed.  A card belongs to one program; where a family shares
  // one, the caption says so.
  const shot=SHOTS[p.name];
  if(shot){
    D.push(`<dt>Sample output</dt><dd><pre class="shot">${esc(shot.s)}</pre>`+
      `<p class="shotcap">${esc(shot.c)}</p></dd>`);
  }
  add("Restrictions", esc(i.restrictions));
  add("Hardware",     esc(i.hardware));
  // Siblings: the answer to "is there anything else like this?"
  const kin=DATA.filter(x=>x.sub===p.sub && x.name!==p.name).sort((a,b)=>a.name.localeCompare(b.name));
  if(kin.length) add("See also", kin.slice(0,14).map(x=>
      `<a href="#p=${encodeURIComponent(x.name)}" class="kin" data-n="${esc(x.name)}"><code>${esc(x.name)}</code></a>`)
      .join(", ") + (kin.length>14?` &hellip; and ${kin.length-14} more`:""));

  col.innerHTML = `<div class="panel">`+
    `<button class="back" id="back">&larr; Back to the list</button>`+
    `<h2 class="pn">${esc(p.name)}</h2>`+
    `<p class="pd">${esc(i.purpose||p.desc)}</p>`+
    (F.length?`<div class="flags">${F.join("")}</div>`:"")+
    (D.length?`<dl>${D.join("")}</dl>`:"")+`</div>`;
  col.scrollTop = 0;
}

function render(){ renderKinds(); renderProgs(); renderPanel(); }

// The address bar follows the reader, so a page can be linked to and the
// back button works: #k=Games, #a=G, #p=gnuchess, #q=chess.
function toHash(){
  const h = st.sel ? "p="+encodeURIComponent(st.sel)
        : st.q ? "q="+encodeURIComponent(st.q)
        : st.cat ? "k="+encodeURIComponent(st.cat)
        : st.letter ? "a="+st.letter : "";
  if(location.hash.slice(1)!==h) history.pushState(null,"","#"+h);
}
function fromHash(){
  const [k,v] = location.hash.slice(1).split("=");
  const val = v ? decodeURIComponent(v) : "";
  if(k==="p" && BY[val]){ st.sel = val; if(!st.cat && !st.letter && !st.q) st.cat = BY[val].cat; }
  else if(k==="k"){ st.cat = val; st.letter=null; st.q=""; }
  else if(k==="a"){ st.letter = val; st.cat=null; st.q=""; }
  else if(k==="q"){ st.q = val; }
  document.getElementById("q").value = st.q;
  document.getElementById("app").dataset.stage = st.sel ? "panel" : "list";
}

function choose(name){
  st.sel = name;
  document.getElementById("app").dataset.stage = "panel";
  toHash(); renderProgs(); renderPanel();
}
function chooseKind(c){
  st.cat = c; st.letter = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}
function chooseLetter(k){
  st.letter = k; st.cat = null; st.q = ""; document.getElementById("q").value = "";
  document.getElementById("app").dataset.stage = "list";
  toHash(); render();
}

function tray(){
  const names=[...picked].sort();
  document.getElementById("tray").classList.toggle("on", names.length>0);
  document.getElementById("traycmd").textContent = names.length ? "keep " + names.join(" ") : "keep";
  const bytes=names.reduce((n,x)=>n+((BY[x]&&BY[x].size)||0),0);
  document.getElementById("traysize").textContent =
    names.length + (names.length===1?" program, ":" programs, ") + kb(bytes) + " of binaries";
}

document.getElementById("kinds").addEventListener("click",e=>{
  const li=e.target.closest("li[data-cat]"); if(li) chooseKind(li.dataset.cat); });
document.getElementById("kinds").addEventListener("keydown",e=>{
  const li=e.target.closest("li[data-cat]"); if(li && e.key==="Enter") chooseKind(li.dataset.cat); });
document.getElementById("abc").addEventListener("click",e=>{
  const b=e.target.closest("button[data-letter]"); if(b) chooseLetter(b.dataset.letter); });
document.getElementById("progs-col").addEventListener("click",e=>{
  const pb=e.target.closest("button.pick");
  if(pb){                       // picking, not opening
    e.stopPropagation();
    const n=pb.dataset.pick;
    picked.has(n) ? picked.delete(n) : picked.add(n);
    pb.closest("li.p").classList.toggle("picked", picked.has(n));
    pb.innerHTML = picked.has(n) ? "&#10003;" : "+";
    tray();
    return;
  }
  const li=e.target.closest("li.p"); if(li){ choose(li.dataset.n); return; }
  const k=e.target.closest("li[data-cat]"); if(k) chooseKind(k.dataset.cat);
});
document.getElementById("progs-col").addEventListener("keydown",e=>{
  const li=e.target.closest("li.p");
  if(li){
    if(e.key==="Enter"){ e.preventDefault(); choose(li.dataset.n); }
    else if(e.key===" "){ e.preventDefault(); const pb=li.querySelector("button.pick"); if(pb) pb.click(); }
    return;
  }
  const k=e.target.closest("li[data-cat]"); if(k && e.key==="Enter") chooseKind(k.dataset.cat);
});
document.getElementById("panel-col").addEventListener("click",e=>{
  const a=e.target.closest("a.kin");
  if(a){ e.preventDefault(); choose(a.dataset.n); return; }
  if(e.target.id==="back"){
    st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel();
  }
});
document.getElementById("q").addEventListener("input",e=>{
  st.q=e.target.value; if(st.q){ st.cat=null; st.letter=null; }
  document.getElementById("app").dataset.stage="list"; toHash(); render(); });
for(const [id,k] of [["f-nocio","nocio"],["f-src","src"],["f-doc","doc"],["f-shot","shot"]]){
  const b=document.getElementById(id);
  b.onclick=()=>{ st[k]=!st[k]; b.setAttribute("aria-pressed",String(st[k])); render(); };
}
document.getElementById("traycopy").onclick=()=>{
  const el=document.getElementById("traycmd");
  const b=document.getElementById("traycopy");
  const done=()=>{ b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200); };
  const selectIt=()=>{ const r=document.createRange(); r.selectNodeContents(el);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  // Selecting the text is the fallback: the clipboard API is unavailable on a
  // page opened from a file:// URL in several browsers, and this page is meant
  // to be readable straight off the disk.
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.textContent).then(done, selectIt);
  else selectIt();
};
document.getElementById("trayclear").onclick=()=>{ picked.clear(); renderProgs(); tray(); };
window.addEventListener("popstate", ()=>{ st.sel=null; st.cat=null; st.letter=null; st.q=""; fromHash(); render(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && st.sel){ st.sel=null; document.getElementById("app").dataset.stage="list"; toHash(); renderProgs(); renderPanel(); }
});
fromHash(); render(); tray();
</script>
